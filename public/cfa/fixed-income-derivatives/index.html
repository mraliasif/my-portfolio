add({n:68,topic:"fi",title:"Asset-Backed Security (ABS) Instrument and Market Features",
los:["68.a Describe characteristics and risks of covered bonds and how they differ from other asset-backed securities.","68.b Describe typical credit enhancement structures used in securitizations.","68.c Describe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type.","68.d Describe collateralized debt obligations, including their cash flows and risks."],
s:{
eli5:`<p>Think of a pool of loans as a building and the bonds as floors. When losses happen (like a flood), the water fills the bottom floor first. The people in the basement (the riskiest bonds) get hit first and are paid the most for it; the people on the top floor (the safest bonds) stay dry unless the flood is huge. That's <strong>tranching</strong>.</p>
<p>Other safety features: putting more loans in the pool than bonds issued (<strong>overcollateralization</strong>), and keeping the extra interest the loans earn as a rainy-day fund (<strong>excess spread</strong>).</p>
<p><strong>Covered bonds</strong> are a sturdier cousin: the bank keeps the loans on its own books, and if the pool fails, investors can still go after the bank itself.</p>`,
core:`<p><strong>What problem is this solving?</strong> Turning a pool of risky loans into securities with different risk levels that different investors want, while protecting senior investors through credit enhancement.</p>
<ul><li><strong>Covered bonds vs ABS:</strong> covered bonds keep the cover pool on the issuer's balance sheet, give dual recourse (issuer + pool), require the issuer to replace non-performing assets (dynamic pool) and are typically higher quality with lower yields.</li>
<li><strong>Credit enhancement:</strong> internal (subordination/credit tranching, overcollateralization, excess spread, reserve accounts) and external (guarantees, letters of credit, surety bonds; exposed to the guarantor's credit).</li>
<li><strong>Non-mortgage ABS:</strong> auto loans (amortizing), credit card receivables (non-amortizing; lockout/revolving period then amortization, early amortization triggers), student loans, solar loans (ESG appeal), etc.</li>
<li><strong>CDOs:</strong> pools of debt (CBOs: corporate/EM bonds; CLOs: leveraged loans) actively managed by a collateral manager; tranches from senior to equity. Equity holders earn the excess of collateral returns over funding costs: leveraged exposure.</li></ul>`,
formal:`<h4>Covered bonds</h4>
<ul><li>Senior debt issued by financial institutions, backed by a segregated cover pool (mortgages, public sector loans) that stays on the issuer's balance sheet.</li>
<li>Dual recourse: to the issuer and, if it defaults, to the cover pool.</li>
<li>Dynamic pool: issuer must replace prepaid/non-performing assets. Hard-bullet, soft-bullet, conditional pass-through structures for maturity extension.</li>
<li>Lower credit risk and yields than comparable ABS.</li></ul>
<h4>Credit enhancements</h4>
<ul><li><strong>Overcollateralization:</strong> collateral value &gt; ABS face value.</li>
<li><strong>Excess spread:</strong> collateral income exceeding ABS coupons and fees, used to absorb losses/build reserves.</li>
<li><strong>Credit tranching (subordination):</strong> losses absorbed first by the lowest tranche (equity/first loss), then mezzanine, then senior. Senior/subordinated structure.</li>
<li>Reserve accounts; external guarantees.</li></ul>
<h4>Non-mortgage ABS</h4>
<ul><li><strong>Auto loan ABS:</strong> amortizing loans; prepayments from sales, refinancing, accidents; credit enhancement via subordination, reserves, excess spread.</li>
<li><strong>Credit card ABS:</strong> non-amortizing receivables. During the <strong>lockout (revolving) period</strong>, only interest and fees are passed through; principal repayments buy new receivables. Then the <strong>amortization period</strong> passes principal to investors. Early (rapid) amortization provisions triggered by performance deterioration.</li>
<li><strong>Solar ABS:</strong> loans to homeowners for solar equipment, secured on equipment or residence; ESG appeal.</li></ul>
<h4>Collateralized debt obligations</h4>
<ul><li>Backed by pools of debt managed by a <strong>collateral manager</strong>: CBOs (corporate and EM bonds), CLOs (leveraged bank loans), structured finance CDOs, synthetic CDOs.</li>
<li><strong>CLO types:</strong> cash flow CLOs (paid from collateral cash flows), market value CLOs (paid from trading the collateral), synthetic CLOs (exposure via credit derivatives).</li>
<li>Tranches: senior, mezzanine, subordinated/equity. Equity earns residual (collateral return − tranche costs): high return, high risk. Risks: collateral defaults, manager risk, correlation (defaults clustering).</li></ul>`,
math:`<div class="f"><span class="lbl">Loss allocation (credit tranching)</span>Losses hit equity → mezzanine → senior, in order, each up to its size</div>
<div class="f"><span class="lbl">Overcollateralization</span>OC = collateral value − ABS face value (often as %)</div>
<div class="f"><span class="lbl">Excess spread</span>Excess spread = collateral yield − weighted ABS coupon − servicing/fees</div>
<div class="f"><span class="lbl">CDO equity return (intuition)</span>Equity return ≈ (collateral income − senior/mezz interest − fees − losses) / equity capital</div>
<div class="dir"><div>Thicker subordination below a tranche → that tranche safer → lower yield</div><div>Default correlation <span class="up">↑</span> → senior tranches riskier</div><div>Credit card ABS: lockout → only interest; amortization → principal flows</div></div>`,
example:`<div class="q">An ABS deal: collateral $105m of loans yielding 8%; bonds issued $100m: senior $80m (5%), mezzanine $15m (7%), equity $5m. Servicing fees 0.5% of collateral. (a) Overcollateralization? (b) Approximate annual excess spread before losses? (c) If cumulative losses reach $8m beyond OC and excess spread, how are they allocated? (d) How would a covered bond on similar mortgages differ?</div>
<ol class="steps"><li><strong>OC</strong> = 105 − 100 = <strong>$5m</strong> (5%).</li>
<li><strong>Collateral income</strong> = 8% × 105 = 8.40; bond coupons = 0.05 × 80 + 0.07 × 15 = 4.00 + 1.05 = 5.05 (equity takes the residual); fees = 0.525. Excess before equity distributions ≈ 8.40 − 5.05 − 0.525 = <strong>$2.83m</strong>, available to absorb losses before they reach any tranche.</li>
<li><strong>$8m loss:</strong> equity absorbs $5m (wiped out); mezzanine absorbs $3m (20% loss); senior <strong>untouched</strong>.</li>
<li><strong>Covered bond:</strong> pool stays on the bank's balance sheet; investors have recourse to the bank and the pool; bank must replace bad loans → lower risk, lower yield.</li></ol>
<p class="ans">Answers: $5m · ≈$2.83m · equity −$5m, mezz −$3m, senior 0 · dual recourse, on-balance-sheet, dynamic pool</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Covered bonds move assets off balance sheet. <b>Fix:</b> cover pool stays on the issuer's balance sheet.</li>
<li><b>Trap:</b> Senior tranches absorb losses first. <b>Fix:</b> lowest tranche first.</li>
<li><b>Trap:</b> Credit card ABS pay principal during lockout. <b>Fix:</b> only interest and fees; principal buys new receivables.</li>
<li><b>Trap:</b> External enhancements eliminate risk. <b>Fix:</b> they add guarantor credit risk.</li>
<li><b>Trap:</b> CDOs are passive. <b>Fix:</b> actively managed by a collateral manager.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> covered bonds vs ABS; identify internal vs external enhancements; loss allocation by tranche; credit card ABS lockout; CLO types.</li>
<li><strong>Loss waterfall tip:</strong> subtract tranche sizes from the bottom up.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Flood fills the basement first</b>Losses hit equity, then mezzanine, then senior.</div>
<div class="anchor"><b>Belt and braces</b>Covered bonds: issuer + pool recourse.</div>
<div class="anchor"><b>O-E-T</b>Overcollateralization, Excess spread, Tranching.</div>
<div class="anchor"><b>Lockout = interest only</b>Credit card ABS revolving period.</div></div>`,
summary:`Covered bonds are senior bonds backed by a cover pool kept on the issuer's balance sheet, giving investors recourse to both the issuer and the pool, with a dynamic pool that must be replenished, making them safer and lower yielding than ABS. Internal credit enhancements include overcollateralization (collateral exceeds bond value), excess spread (collateral income above bond coupons and fees) and credit tranching (losses absorbed from the lowest-priority tranche upward); external enhancements include guarantees and letters of credit. Non-mortgage ABS include auto loan ABS (amortizing), credit card ABS (non-amortizing, with a lockout/revolving period in which only interest and fees pass through before an amortization period, plus early amortization triggers) and solar ABS. Collateralized debt obligations are actively managed pools (CBOs of bonds, CLOs of leveraged loans) structured into senior, mezzanine and equity tranches; CLOs may be cash flow, market value or synthetic.`
},
quiz:[
{q:"Which is an internal credit enhancement?",o:["A bank letter of credit","Overcollateralization","A surety bond"],a:1,e:"Overcollateralization, excess spread and tranching are internal; the others are external."},
{q:"During the lockout period of a credit card ABS, investors receive:",o:["principal and interest","only interest and fees","nothing"],a:1,e:"Principal payments are reinvested in new receivables."},
{q:"Compared with ABS, covered bonds:",o:["remove assets from the issuer's balance sheet","provide recourse to both the issuer and the cover pool","have no credit enhancement"],a:1,e:"Dual recourse with the pool kept on balance sheet."}]
});

add({n:69,topic:"fi",title:"Mortgage-Backed Security (MBS) Instrument and Market Features",
los:["69.a Define prepayment risk and describe time tranching structures in securitizations and their purpose.","69.b Describe fundamental features of residential mortgage loans that are securitized.","69.c Describe types and characteristics of residential mortgage-backed securities, including mortgage pass-through securities and collateralized mortgage obligations, and explain the cash flows and risks for each type.","69.d Describe characteristics and risks of commercial mortgage-backed securities."],
s:{
eli5:`<p>Homeowners can usually pay off their mortgage early, especially when rates fall and they can refinance cheaper. For investors holding mortgage bonds, that's annoying: you get your money back exactly when you'd rather keep earning the old higher rate (<strong>contraction risk</strong>). And when rates rise, people stay put and repay slowly, so your money is stuck earning the old low rate (<strong>extension risk</strong>).</p>
<p>To manage that, the cash flows are sliced into "time tranches": the first slice gets repaid first (short and predictable-ish), the last slice last. Some slices are made extra-predictable by having "support" slices absorb the surprises.</p>
<p>Commercial mortgages (offices, malls) are different: borrowers usually can't prepay easily, so the main worry is whether the property earns enough to pay the loan.</p>`,
core:`<p><strong>What problem is this solving?</strong> Mortgage cash flows are uncertain in timing because borrowers hold a prepayment option. MBS structures redistribute that uncertainty among investors with different horizons and risk tolerance.</p>
<ul><li><strong>Prepayment risk</strong> = uncertainty in timing of principal: contraction risk (rates fall → faster prepayments → reinvest at lower rates; price upside capped → negative convexity) and extension risk (rates rise → slower prepayments → longer duration when you least want it).</li>
<li><strong>Loan features drive risk:</strong> LTV (lower = more equity cushion), DTI (lower = more affordable), fixed vs adjustable rate, amortization, recourse vs non-recourse, prepayment penalties, agency vs non-agency (credit guarantee or not).</li>
<li><strong>Pass-throughs</strong> pass all pool cash flows pro rata (minus fees); <strong>CMOs</strong> re-cut them: sequential-pay tranches (first tranche most contraction risk, last most extension risk), PAC/support (PACs get scheduled payments within a prepayment band; support tranches absorb the variability), plus Z-tranches, IO/PO, floaters, residuals.</li>
<li><strong>CMBS:</strong> non-recourse loans on income-producing properties → analysis focuses on property cash flows (DSCR, LTV); strong call protection (lockouts, defeasance, prepayment penalties, yield maintenance); balloon risk at maturity (refinancing risk → extension).</li></ul>`,
formal:`<h4>Prepayment risk and time tranching</h4>
<ul><li>Prepayments: amounts paid above scheduled principal (refinancing, home sales, curtailments). Measured by conditional prepayment rate (CPR/SMM) relative to benchmarks (PSA).</li>
<li><strong>Contraction risk:</strong> faster prepayments when rates fall. <strong>Extension risk:</strong> slower when rates rise.</li>
<li><strong>Time tranching:</strong> distributes prepayment risk across tranches with different expected maturities.</li></ul>
<h4>Residential mortgage features</h4>
<ul><li><strong>LTV</strong> = loan/property value (lower → less credit risk). <strong>DTI</strong> = monthly debt payments/gross income (lower → less risk).</li>
<li>Maturity (often 15–30 years), fixed vs adjustable rate, fully amortizing typical, prepayment penalties (less common in US), recourse vs non-recourse (borrower personally liable or not).</li>
<li><strong>Agency RMBS:</strong> guaranteed/issued by government or GSEs (conforming loans meeting standards); <strong>non-agency RMBS:</strong> private issuers, may include non-conforming/subprime, need credit enhancement.</li></ul>
<h4>RMBS types</h4>
<ul><li><strong>Mortgage pass-through:</strong> investors receive pro rata share of interest, scheduled principal and prepayments, minus servicing/guarantee fees. Pass-through rate &lt; mortgage rate. Pool described by WAC (weighted average coupon) and WAM (weighted average maturity).</li>
<li><strong>Collateralized mortgage obligations (CMOs):</strong> backed by pass-throughs or pools; tranches with different prepayment exposure.
<ul><li><strong>Sequential-pay:</strong> all principal (scheduled + prepayments) goes to tranche A until retired, then B, etc. First tranche: most contraction risk; last tranche: most extension risk.</li>
<li><strong>Planned amortization class (PAC):</strong> scheduled principal if prepayments stay within a band (PAC collar); <strong>support (companion)</strong> tranches absorb excess/shortfall → more contraction and extension risk.</li>
<li>Others: <strong>Z-tranche</strong> (accrual: interest added to principal until earlier tranches paid), <strong>IO</strong> (interest-only: value falls when prepayments rise) and <strong>PO</strong> (principal-only: value rises with faster prepayments), floating-rate tranches, residual tranches.</li></ul></li></ul>
<h4>Commercial MBS</h4>
<ul><li>Backed by mortgages on income-producing properties (office, retail, multifamily, industrial, hotels). Commercial mortgages are typically <strong>non-recourse</strong> → focus on property's ability to service debt.</li>
<li>Credit metrics: <strong>DSCR</strong> = NOI/debt service (higher better; &gt; 1 needed); <strong>LTV</strong> (lower better).</li>
<li>Tranched by credit; losses absorbed from lowest-priority tranches.</li>
<li><strong>Call protection:</strong> loan-level (prepayment lockout periods, defeasance, prepayment penalty points, yield maintenance charges) and structural (subordinate tranches retire first).</li>
<li>Often partially amortizing → <strong>balloon risk</strong> (inability to refinance at maturity → extension).</li></ul>`,
math:`<div class="f"><span class="lbl">Loan metrics</span>LTV = loan / property value &nbsp;·&nbsp; DTI = monthly debt payments / gross monthly income &nbsp;·&nbsp; DSCR = NOI / debt service</div>
<div class="f"><span class="lbl">Sequential-pay logic</span>All principal → Tranche A until retired → then B → then C …</div>
<div class="f"><span class="lbl">PAC/support</span>Prepayments within band → PAC gets schedule; support absorbs the difference</div>
<div class="dir"><div>Rates <span class="dn">↓</span> → prepayments <span class="up">↑</span> → contraction risk (early tranches, support tranches), IO value <span class="dn">↓</span>, PO value <span class="up">↑</span></div><div>Rates <span class="up">↑</span> → prepayments <span class="dn">↓</span> → extension risk (later tranches, support tranches)</div><div>LTV <span class="dn">↓</span>, DTI <span class="dn">↓</span>, DSCR <span class="up">↑</span> → credit risk <span class="dn">↓</span></div></div>`,
example:`<div class="q">(a) A home buyer borrows $320,000 on a $400,000 home; monthly debt payments are $2,400 on $8,000 gross monthly income. LTV and DTI? (b) A sequential-pay CMO has tranches A, B, C. Rates fall sharply. Which tranche faces the most contraction risk? If rates rise sharply, which faces the most extension risk? (c) A PAC/support CMO: who absorbs a surge in prepayments? (d) A CMBS loan: NOI $1.2m, annual debt service $1.0m, loan $7.5m on a $10m property. DSCR and LTV?</div>
<ol class="steps"><li><strong>LTV</strong> = 320/400 = <strong>80%</strong>; <strong>DTI</strong> = 2,400/8,000 = <strong>30%</strong>.</li>
<li><strong>Falling rates:</strong> tranche <strong>A</strong> (first to receive all prepayments) has most contraction risk. <strong>Rising rates:</strong> tranche <strong>C</strong> (last in line) has most extension risk.</li>
<li><strong>Support tranche</strong> absorbs excess prepayments so the PAC stays on schedule (within its collar).</li>
<li><strong>DSCR</strong> = 1.2/1.0 = <strong>1.20×</strong>; <strong>LTV</strong> = 7.5/10 = <strong>75%</strong>.</li></ol>
<p class="ans">Answers: 80% / 30% · A (contraction), C (extension) · support tranche · 1.20× / 75%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Contraction risk occurs when rates rise. <b>Fix:</b> contraction = rates fall (faster prepayment); extension = rates rise.</li>
<li><b>Trap:</b> PAC tranches have more prepayment risk. <b>Fix:</b> support tranches carry more of both risks.</li>
<li><b>Trap:</b> IO tranches gain when prepayments rise. <b>Fix:</b> IOs lose (interest stream shrinks); POs gain.</li>
<li><b>Trap:</b> CMBS analysis focuses on the borrower's personal credit. <b>Fix:</b> non-recourse → property cash flows (DSCR, LTV).</li>
<li><b>Trap:</b> Pass-through rate = mortgage rate. <b>Fix:</b> lower, by servicing and guarantee fees.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> define contraction/extension risk; which tranche bears which risk; PAC vs support; IO/PO behavior; LTV/DTI/DSCR; agency vs non-agency; CMBS call protection and balloon risk.</li>
<li><strong>Memory:</strong> first-in-line faces contraction; last-in-line faces extension; support faces both.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Rates down, money back too soon</b>Contraction risk.</div>
<div class="anchor"><b>Rates up, money stuck too long</b>Extension risk.</div>
<div class="anchor"><b>PAC = Protected, Support = Shock absorber</b>Support tranches take the bumps.</div>
<div class="anchor"><b>Commercial = can the building pay?</b>DSCR and LTV, not the owner.</div></div>`,
summary:`Prepayment risk is uncertainty in the timing of mortgage principal: contraction risk when falling rates accelerate prepayments and extension risk when rising rates slow them; time tranching distributes this risk. Residential mortgage credit is assessed by loan-to-value (lower is safer) and debt-to-income (lower is safer); agency RMBS are guaranteed by government or GSEs and require conforming loans, while non-agency RMBS are issued privately and may hold riskier loans. Pass-through securities distribute pool cash flows pro rata, characterized by the pass-through rate, WAC and WAM. CMOs re-cut cash flows: in sequential-pay structures the first tranche bears the most contraction risk and the last the most extension risk; PAC tranches receive scheduled payments within a prepayment band while support tranches absorb both risks; other tranches include Z, IO, PO, floating and residual tranches. CMBS are backed by non-recourse commercial mortgages, analyzed with debt service coverage and LTV, tranched for credit, protected by lockouts, defeasance, prepayment penalties and subordination, and exposed to balloon risk.`
},
quiz:[
{q:"When interest rates fall sharply, a mortgage pass-through investor faces:",o:["extension risk","contraction risk","no prepayment risk"],a:1,e:"Faster prepayments return principal early, to be reinvested at lower rates."},
{q:"In a PAC/support CMO, which tranche has the greatest prepayment risk?",o:["PAC tranche","Support tranche","Both equal"],a:1,e:"Support tranches absorb deviations to keep PACs on schedule."},
{q:"A CMBS loan has NOI of $900,000 and annual debt service of $750,000. Its DSCR is:",o:["0.83×","1.20×","1.50×"],a:1,e:"900/750 = 1.20×."}]
});

/* ===================== READING 70 ===================== */
add({n:70,topic:"der",title:"Derivative Instrument and Derivative Market Features",
los:["70.a Define a derivative and describe basic features of a derivative instrument.","70.b Describe the basic features of derivative markets, and contrast over-the-counter and exchange-traded derivative markets."],
s:{
eli5:`<p>A derivative is a contract whose value depends on something else. A farmer and a baker agree today that in three months the baker will buy wheat at $6 a bushel, whatever the market price is then. The contract's value "derives" from the price of wheat, the <strong>underlying</strong>.</p>
<p>Some contracts are custom-made between two parties (over-the-counter, like a tailor-made suit). Others are standardized and traded on an exchange (like off-the-rack clothes), with a clearinghouse in the middle guaranteeing everyone gets paid.</p>`,
core:`<p><strong>What problem is this solving?</strong> Derivatives let people transfer risk (hedge), take exposure cheaply (speculate), and discover prices, without buying or selling the underlying itself.</p>
<ul><li><strong>Basic features:</strong> underlying (assets like stocks, bonds, commodities, currencies; or variables like interest rates, indexes, credit events, weather), contract price (forward/exercise price), contract size, expiration/settlement date, settlement method (physical delivery or cash).</li>
<li><strong>Zero value at initiation</strong> for forward commitments: the price is set so neither side pays anything up front (options are different: the buyer pays a premium).</li>
<li><strong>Exchange-traded:</strong> standardized, liquid, transparent, clearinghouse (central counterparty) eliminates counterparty risk via margin and daily settlement.</li>
<li><strong>OTC:</strong> customized, less transparent, less regulated historically, counterparty credit risk; post-2008 reforms require central clearing for many standardized OTC contracts (e.g., interest rate swaps), reducing counterparty risk.</li></ul>`,
formal:`<h4>Definition and features</h4>
<ul><li>A derivative is a financial instrument whose value derives from the value of an underlying asset, rate, index or event at a specified future date.</li>
<li><strong>Underlyings:</strong> equities (single stocks, indexes), fixed income and interest rates, currencies, commodities, credit, other (weather, longevity, crypto).</li>
<li><strong>Terms:</strong> underlying, contract price, contract size (notional), expiration (settlement) date, settlement (deliverable vs cash-settled).</li>
<li><strong>Two sides:</strong> long (buyer) and short (seller). For forward commitments, price is set so value = 0 at initiation.</li>
<li>Derivatives offer implicit leverage: small initial outlay, large exposure.</li></ul>
<h4>Exchange-traded vs OTC</h4>
<table><tr><th></th><th>Exchange-traded (ETD)</th><th>Over-the-counter (OTC)</th></tr>
<tr><td>Terms</td><td>Standardized</td><td>Customized</td></tr>
<tr><td>Counterparty risk</td><td>Minimal: clearinghouse guarantees, margin, daily mark-to-market</td><td>Bilateral counterparty risk (reduced if centrally cleared)</td></tr>
<tr><td>Transparency</td><td>High (prices, volumes public)</td><td>Lower</td></tr>
<tr><td>Liquidity</td><td>High for standard contracts</td><td>Varies; often lower</td></tr>
<tr><td>Regulation</td><td>Exchange and regulatory oversight</td><td>Historically light; increasing (reporting, central clearing mandates)</td></tr>
<tr><td>Examples</td><td>Futures, listed options</td><td>Forwards, swaps, many options</td></tr></table>
<p><strong>Central clearing:</strong> a central counterparty (CCP) becomes buyer to every seller and seller to every buyer; members post initial and variation margin.</p>`,
math:`<div class="f"><span class="lbl">Payoff of a forward commitment at expiration</span>Long: S<sub>T</sub> − F₀(T) &nbsp;·&nbsp; Short: F₀(T) − S<sub>T</sub></div>
<div class="vars"><div><code>S<sub>T</sub></code><span>Underlying price at expiration</span></div><div><code>F₀(T)</code><span>Price agreed at initiation for delivery at T</span></div></div>
<p><strong>Why symmetric:</strong> it's a zero-sum contract; the long's gain is the short's loss.</p>
<div class="f"><span class="lbl">Notional exposure vs cash outlay</span>Exposure = contract size × price; initial outlay ≈ margin (or 0 for forwards) → implicit leverage</div>
<div class="dir"><div>Underlying price <span class="up">↑</span> → long forward value <span class="up">↑</span>, short <span class="dn">↓</span></div><div>Central clearing → counterparty risk <span class="dn">↓</span></div></div>`,
example:`<div class="q">(a) A wheat farmer agrees to sell 5,000 bushels at $6.00 in three months to a miller. At expiration wheat is $5.40. Payoffs? (b) Classify as exchange-traded or OTC: (i) a customized 7-year interest rate swap between a bank and a corporation; (ii) S&amp;P 500 index futures; (iii) a forward on euros for a specific date chosen by an importer. (c) Why do ETDs have little counterparty risk?</div>
<ol class="steps"><li><strong>Farmer (short):</strong> (6.00 − 5.40) × 5,000 = <strong>+$3,000</strong>. <strong>Miller (long):</strong> <strong>−$3,000</strong>. Zero-sum.</li>
<li><strong>(i)</strong> OTC (possibly centrally cleared); <strong>(ii)</strong> exchange-traded; <strong>(iii)</strong> OTC.</li>
<li><strong>Clearinghouse</strong> guarantees performance, backed by margin and daily settlement of gains/losses.</li></ol>
<p class="ans">Answers: farmer +$3,000, miller −$3,000 · OTC, ETD, OTC · clearinghouse + margin</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Forwards require an upfront payment. <b>Fix:</b> value is zero at initiation; options need a premium.</li>
<li><b>Trap:</b> OTC markets have no counterparty risk mitigation. <b>Fix:</b> many are now centrally cleared.</li>
<li><b>Trap:</b> Derivatives must be physically settled. <b>Fix:</b> many are cash-settled.</li>
<li><b>Trap:</b> ETDs are customizable. <b>Fix:</b> standardized.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> define derivative and features; ETD vs OTC; role of central clearing; cash vs physical settlement.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Value borrowed from something else</b>"Derivative" = derived value.</div>
<div class="anchor"><b>Tailor vs off-the-rack</b>OTC custom; exchange standardized.</div>
<div class="anchor"><b>Clearinghouse = referee with a wallet</b>Guarantees both sides.</div></div>`,
summary:`A derivative is an instrument whose value derives from an underlying asset, rate, index or event at a future date. Its basic features are the underlying, the contract price, the contract size and the settlement date, with physical delivery or cash settlement; for forward commitments the price is set so the contract has zero value to both parties at initiation, and derivatives offer implicit leverage. Exchange-traded derivatives are standardized, transparent and liquid, and a central clearinghouse takes the opposite side of every trade, guaranteeing performance through margin and daily settlement. OTC derivatives are customizable, less transparent and historically lightly regulated with bilateral counterparty risk, though central clearing mandates now cover many standardized OTC contracts.`
},
quiz:[
{q:"Which feature is characteristic of exchange-traded derivatives?",o:["Customized terms","Central clearinghouse guarantee","High counterparty credit risk"],a:1,e:"The clearinghouse is the counterparty to every trade."},
{q:"At initiation, the value of a forward contract to both parties is typically:",o:["equal to the spot price","zero","equal to the forward price"],a:1,e:"The forward price is set so no money changes hands."},
{q:"A derivative that pays the difference between the market price and the contract price in money, rather than delivering the asset, is:",o:["physically settled","cash-settled","contingent"],a:1,e:"Cash settlement exchanges the net value."}]
});

/* ===================== READING 71 ===================== */
add({n:71,topic:"der",title:"Forward Commitment and Contingent Claim Features and Instruments",
los:["71.a Define forward contracts, futures contracts, swaps, options (calls and puts), and credit derivatives and compare their basic characteristics.","71.b Determine the value at expiration and profit from a long or a short position in a call or put option.","71.c Contrast forward commitments with contingent claims."],
s:{
eli5:`<p>There are two families of derivatives.</p>
<p><strong>Promises (forward commitments):</strong> both sides <em>must</em> follow through. A <strong>forward</strong> is a private deal to buy later at a fixed price. A <strong>future</strong> is the same idea traded on an exchange, settled up every day. A <strong>swap</strong> is a series of such promises, like "I'll pay you a fixed rate, you pay me a floating rate, every quarter for five years".</p>
<p><strong>Choices (contingent claims):</strong> one side gets a <em>right</em>, not an obligation, and pays for it. A <strong>call</strong> is the right to buy at a set price (like a deposit holding a house price). A <strong>put</strong> is the right to sell at a set price (like insurance on your car's value). A <strong>credit default swap</strong> is insurance against a borrower defaulting.</p>`,
core:`<p><strong>What problem is this solving?</strong> Different needs call for different payoff shapes: locking in a price (forwards, futures, swaps) vs buying protection or upside while capping the downside (options, CDS).</p>
<ul><li><strong>Forward commitments</strong> have symmetric, linear payoffs: gains on one side equal losses on the other; no premium at initiation.</li>
<li><strong>Contingent claims</strong> have asymmetric payoffs: the buyer's loss is limited to the premium; the payoff only happens if a condition is met (price above/below strike, credit event).</li>
<li><strong>Futures vs forwards:</strong> futures are standardized, exchange-traded, marked to market daily with margin, so credit risk is minimal and gains/losses are realized daily.</li>
<li><strong>Swaps</strong> = a portfolio of forwards (e.g., fixed vs floating interest), used to change the nature of cash flows.</li>
<li><strong>Option payoffs at expiration:</strong> call = max(0, S<sub>T</sub> − X); put = max(0, X − S<sub>T</sub>). Profit = payoff − premium for buyers; premium − payoff for sellers.</li></ul>`,
formal:`<h4>Instruments</h4>
<table><tr><th>Instrument</th><th>Type</th><th>Key characteristics</th></tr>
<tr><td>Forward</td><td>Forward commitment, OTC</td><td>Obligation to buy/sell at F at T; customized; counterparty risk; no cash until settlement</td></tr>
<tr><td>Futures</td><td>Forward commitment, exchange-traded</td><td>Standardized; clearinghouse; initial margin, maintenance margin, variation margin; daily mark-to-market; price limits</td></tr>
<tr><td>Swap</td><td>Forward commitment, mostly OTC</td><td>Exchange of series of cash flows (e.g., fixed vs floating on notional); equivalent to a series of forwards</td></tr>
<tr><td>Call option</td><td>Contingent claim</td><td>Right (not obligation) to buy at X; buyer pays premium</td></tr>
<tr><td>Put option</td><td>Contingent claim</td><td>Right to sell at X; buyer pays premium</td></tr>
<tr><td>Credit default swap (CDS)</td><td>Contingent claim (credit derivative)</td><td>Protection buyer pays periodic premium; seller pays if a credit event occurs on the reference entity</td></tr></table>
<ul><li>Options: American (exercise any time to expiration) vs European (only at expiration); listed or OTC.</li>
<li><strong>Futures margin:</strong> initial margin posted; account marked daily; if it falls below maintenance margin, variation margin restores it to initial margin.</li></ul>
<h4>Option payoffs and profits</h4>
<table><tr><th>Position</th><th>Payoff at T</th><th>Profit</th><th>Max gain</th><th>Max loss</th><th>Breakeven</th></tr>
<tr><td>Long call</td><td>max(0, S − X)</td><td>payoff − c₀</td><td>Unlimited</td><td>c₀</td><td>X + c₀</td></tr>
<tr><td>Short call</td><td>−max(0, S − X)</td><td>c₀ − payoff</td><td>c₀</td><td>Unlimited</td><td>X + c₀</td></tr>
<tr><td>Long put</td><td>max(0, X − S)</td><td>payoff − p₀</td><td>X − p₀</td><td>p₀</td><td>X − p₀</td></tr>
<tr><td>Short put</td><td>−max(0, X − S)</td><td>p₀ − payoff</td><td>p₀</td><td>X − p₀</td><td>X − p₀</td></tr></table>
<h4>Forward commitments vs contingent claims</h4>
<p>Forward commitments: obligations, linear symmetric payoffs, zero initial value. Contingent claims: rights for the buyer, nonlinear asymmetric payoffs, premium paid at initiation; payoff depends on an event (price threshold, default).</p>`,
math:`<div class="f"><span class="lbl">Option values at expiration</span>Call: c<sub>T</sub> = max(0, S<sub>T</sub> − X) &nbsp;·&nbsp; Put: p<sub>T</sub> = max(0, X − S<sub>T</sub>)</div>
<div class="f"><span class="lbl">Profit</span>Long = value − premium &nbsp;·&nbsp; Short = premium − value</div>
<div class="f"><span class="lbl">Breakevens</span>Call: X + premium &nbsp;·&nbsp; Put: X − premium</div>
<p><strong>Why max(0, …):</strong> the holder only exercises when it helps; otherwise the option expires worthless, so value can't be negative to the holder.</p>
<div class="dir"><div>S<sub>T</sub> <span class="up">↑</span> → long call <span class="up">↑</span>, long put <span class="dn">↓</span>; short positions the reverse</div><div>Option sellers: limited gain (premium), large potential loss</div></div>
<div class="calc" data-calc="opt"></div>`,
example:`<div class="q">(a) A call with X = $50 costs $3. At expiration S = $56. Find the long call's payoff and profit, the short call's profit, and the breakeven. (b) A put with X = $50 costs $2. At expiration S = $44. Long put payoff and profit? Short put profit? (c) If S = $47 at expiration, what happens to each option? (d) A futures trader posts $5,000 initial margin (maintenance $3,500) and loses $2,000 on day 1. What happens?</div>
<ol class="steps"><li><strong>Long call:</strong> payoff = max(0, 56 − 50) = <strong>$6</strong>; profit = 6 − 3 = <strong>$3</strong>. Short call profit = <strong>−$3</strong>. Breakeven = 50 + 3 = <strong>$53</strong>.</li>
<li><strong>Long put:</strong> payoff = max(0, 50 − 44) = <strong>$6</strong>; profit = 6 − 2 = <strong>$4</strong>; short put profit = <strong>−$4</strong>.</li>
<li><strong>S = 47:</strong> call expires worthless (long loses $3, short gains $3); put payoff = 3, long put profit = <strong>$1</strong>, short put −$1.</li>
<li><strong>Margin:</strong> balance falls to $3,000 &lt; $3,500 maintenance → margin call; deposit <strong>$2,000</strong> variation margin to restore $5,000.</li></ol>
<p class="ans">Answers: +$6/+$3 (short −$3), BE $53 · +$6/+$4 (short −$4) · call worthless, put profit $1 · deposit $2,000</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Confusing payoff (value) with profit. <b>Fix:</b> profit subtracts (long) or adds (short) the premium.</li>
<li><b>Trap:</b> Put breakeven = X + premium. <b>Fix:</b> X − premium.</li>
<li><b>Trap:</b> Variation margin restores to maintenance level. <b>Fix:</b> restores to initial margin.</li>
<li><b>Trap:</b> CDS is a forward commitment. <b>Fix:</b> it's a contingent claim (pays only on a credit event).</li>
<li><b>Trap:</b> Short put max loss is unlimited. <b>Fix:</b> limited to X − premium (price can't go below 0).</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute payoff/profit for each option position; breakevens; max gain/loss; forwards vs futures; margin calls; classify instruments as forward commitment or contingent claim.</li>
<li><strong>Speed:</strong> compute the long payoff first, then flip sign for short; then adjust for premium.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Promise vs choice</b>Forward commitments obligate; contingent claims give rights.</div>
<div class="anchor"><b>Call = Claim upside; Put = Protection downside</b>Buy the right to buy / to sell.</div>
<div class="anchor"><b>Max(0, …)</b>Options never have negative value to the holder.</div>
<div class="anchor"><b>Back to initial</b>Variation margin restores to initial margin.</div></div>`,
summary:`Forward contracts obligate one party to buy and the other to sell an asset at a set price on a future date (OTC, customized, counterparty risk); futures are similar but standardized, exchange-traded, cleared and marked to market daily with initial, maintenance and variation margin; swaps exchange series of cash flows (e.g., fixed vs floating) and equal a series of forwards. Calls give the right to buy and puts the right to sell at the exercise price, for a premium; credit default swaps pay the protection buyer if a credit event occurs. At expiration, call value = max(0, S − X), put value = max(0, X − S); profit = value − premium for buyers and premium − value for sellers; breakevens are X + premium (call) and X − premium (put). Forward commitments are obligations with linear, symmetric payoffs and zero initial value; contingent claims are rights with asymmetric payoffs and an upfront premium.`
},
quiz:[
{q:"A put option with X = 40 and a premium of 3 is held long. At expiration S = 35. The profit is:",o:["2","5","−3"],a:0,e:"Payoff = 5; profit = 5 − 3 = 2."},
{q:"Which is a contingent claim?",o:["Interest rate swap","Futures contract","Credit default swap"],a:2,e:"A CDS pays only if a credit event occurs."},
{q:"The breakeven price at expiration for the buyer of a call with X = 60 and premium 4 is:",o:["56","60","64"],a:2,e:"X + premium = 64."},
{q:"A futures account falls below the maintenance margin. The trader must deposit enough to bring it back to:",o:["the maintenance margin","the initial margin","zero"],a:1,e:"Variation margin restores the initial margin level."}]
});
