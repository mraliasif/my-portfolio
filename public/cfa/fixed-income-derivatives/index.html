/* ===================== READING 51 ===================== */
add({n:51,topic:"fi",title:"Fixed-Income Instrument Features",
los:["51.a Describe the features of a fixed-income security.","51.b Describe the contents of a bond indenture and contrast affirmative and negative covenants."],
s:{
eli5:`<p>A bond is an IOU. You lend a company or government $1,000. They promise to pay you "rent" on your money every so often (the <strong>coupon</strong>) and give the $1,000 back on a set date (<strong>maturity</strong>).</p>
<p>The IOU's paperwork (the <strong>indenture</strong>) spells out the deal: who's borrowing, how much, when they pay, what happens if things go wrong, and the rules they must follow, like "you must keep insurance on your factory" (a <em>must-do</em> rule) or "you can't borrow a mountain of extra debt" (a <em>can't-do</em> rule).</p>
<p>And one rule of thumb you'll use forever: <strong>when interest rates in the market go up, existing bonds become less valuable</strong>, because new bonds pay more. Price and yield move in opposite directions, like a seesaw.</p>`,
core:`<p><strong>What problem is this solving?</strong> Borrowers need long-term money; lenders want predictable income and protection. A bond standardizes that deal so it can be bought and sold, and the indenture makes the borrower's promises enforceable.</p>
<ul><li><strong>Every bond is defined by a handful of features:</strong> issuer, maturity (tenor), par, coupon rate and frequency, currency, seniority and any contingency provisions (embedded options). Each one changes risk: longer maturity → more rate risk; lower seniority → more credit risk; call options → less value to investors.</li>
<li><strong>Yield is the bond's return; price is its cost.</strong> With fixed cash flows, the only way to offer a higher return is a lower price, hence the inverse price-yield relationship.</li>
<li><strong>The yield curve</strong> (yield vs maturity for one issuer, usually the government) is the benchmark; riskier issuers pay a <em>spread</em> above it.</li>
<li><strong>The indenture protects lenders</strong> because bondholders can't control the company day to day. Affirmative covenants keep the business healthy and transparent; negative covenants stop management from shifting value away from bondholders (more debt, asset sales, big dividends, pledging assets to others).</li>
<li><strong>Repayment source and collateral</strong> determine credit risk: government taxes, project revenue, corporate operations, or a pool of assets (securitized bonds); secured vs unsecured; credit enhancements.</li></ul>`,
formal:`<h4>Basic features</h4>
<ul><li><strong>Issuer:</strong> sovereign governments, local/regional governments, quasi-government entities, supranational organizations, corporations, special purpose entities (issuing asset-backed securities).</li>
<li><strong>Maturity:</strong> date of final payment; <em>tenor</em> = time remaining. Original maturity ≤ 1 year → money market securities; &gt; 1 year → capital market securities; no maturity → perpetual bonds.</li>
<li><strong>Par (principal, face) value:</strong> amount repaid; bonds trade at premium, par or discount to it.</li>
<li><strong>Coupon rate and frequency:</strong> annual % of par paid as interest; annual, semiannual, quarterly, monthly. <strong>Floating-rate notes (FRNs):</strong> MRR + fixed margin (in bp). <strong>Zero-coupon (pure discount):</strong> no coupons, sold below par.</li>
<li><strong>Currency:</strong> may differ from issuer's home currency; dual-currency and currency-option bonds exist.</li>
<li><strong>Seniority:</strong> senior debt ranks above junior (subordinated) debt; all debt ranks above equity.</li>
<li><strong>Contingency provisions:</strong> embedded options (call, put, conversion).</li></ul>
<h4>Yield and yield curve</h4>
<p>Yield is the return implied by price and cash flows; price and yield are inversely related. A yield curve plots yields vs maturity: normal (upward), inverted (downward), flat. Government curves are benchmarks; spreads over them compensate for credit and liquidity risk.</p>
<h4>Bond indenture (trust deed)</h4>
<ul><li>Legal contract; often held by a trustee for bondholders. Specifies issuer, principal, coupon, maturity, repayment sources, collateral, credit enhancements, covenants.</li>
<li><strong>Sources of repayment:</strong> sovereign → taxes (and ability to print money); local government → taxes or project revenue (general obligation vs revenue bonds); corporate → operating cash flows; securitized → cash flows from a pool of financial assets.</li>
<li><strong>Collateral:</strong> secured bonds (specific assets pledged, e.g., mortgage bonds, equipment trust certificates) vs unsecured (debentures, general claim).</li>
<li><strong>Credit enhancements:</strong> internal (subordination/tranching, overcollateralization, excess spread) and external (surety bonds, bank guarantees, letters of credit).</li>
<li><strong>Affirmative covenants:</strong> what the issuer must do: make payments, maintain insurance and assets, comply with laws, provide financial reports, pari passu and cross-default clauses.</li>
<li><strong>Negative covenants:</strong> what the issuer must not do: restrictions on additional debt, negative pledges (no pledging assets to other lenders), restrictions on asset sales, on prior claims, on distributions/dividends, on investments, on mergers.</li></ul>`,
math:`<div class="f"><span class="lbl">The seesaw</span>Price = Σ cash flows / (1 + yield)<sup>t</sup> &nbsp;→&nbsp; yield ↑ ⇒ price ↓</div>
<p><strong>Why:</strong> the coupons and principal are fixed by contract. A higher required yield means each future dollar is discounted more heavily, so today's price must fall.</p>
<div class="f"><span class="lbl">Zero-coupon price</span>P = Par / (1 + y)<sup>N</sup></div>
<div class="f"><span class="lbl">Credit spread</span>Spread = bond yield − benchmark government yield (same maturity)</div>
<div class="f"><span class="lbl">Coupon per period</span>Coupon payment = coupon rate × par / payments per year</div>
<div class="dir"><div>Maturity <span class="up">↑</span> → price sensitivity to yields <span class="up">↑</span></div><div>Subordination <span class="up">↑</span> → credit risk and required yield <span class="up">↑</span></div><div>More/stronger negative covenants → lower risk to lenders → lower yield</div></div>
<div class="calc" data-calc="bond"></div>`,
example:`<div class="q">(a) A $1,000, 5% semiannual-coupon bond: what is each coupon? (b) Price a 10-year $1,000 zero-coupon bond yielding 7% (annual compounding). (c) A 5-year corporate bond yields 6% and the 5-year government bond yields 5%. What's the spread? (d) Classify: (i) "The issuer must deliver audited financial statements within 90 days of year-end." (ii) "The issuer may not pledge its plants as collateral to other lenders." (iii) "The issuer may not pay dividends exceeding 50% of net income."</div>
<ol class="steps"><li><strong>Coupon</strong> = 5% × 1,000 / 2 = <strong>$25</strong> every six months.</li>
<li><strong>Zero price</strong> = 1,000 / 1.07<sup>10</sup> = <strong>$508.35</strong>: a bit more than half of par, all return comes from accretion to par.</li>
<li><strong>Spread</strong> = 6% − 5% = <strong>1% (100 bp)</strong>, compensation for credit and liquidity risk.</li>
<li><strong>(i)</strong> affirmative; <strong>(ii)</strong> negative (negative pledge); <strong>(iii)</strong> negative (restriction on distributions).</li></ol>
<p class="ans">Answers: $25 · $508.35 · 100 bp · affirmative, negative, negative</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Money market vs capital market by <em>remaining</em> maturity. <b>Fix:</b> classification uses <em>original</em> maturity (≤ 1 year = money market).</li>
<li><b>Trap:</b> Thinking higher coupons mean higher yield. <b>Fix:</b> yield depends on price; coupon is fixed at issue.</li>
<li><b>Trap:</b> Calling "must maintain insurance" a negative covenant. <b>Fix:</b> "must do" = affirmative; "must not do" = negative.</li>
<li><b>Trap:</b> Debentures are secured. <b>Fix:</b> in the US, debentures are typically unsecured.</li>
<li><b>Trap:</b> Forgetting the seesaw direction. <b>Fix:</b> yield up → price down, always for fixed cash flows.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> identify bond features; money vs capital market; affirmative vs negative covenants; sources of repayment by issuer type; secured vs unsecured; price-yield direction.</li>
<li><strong>Covenant shortcut:</strong> anything that <em>restricts</em> management's freedom → negative; anything that <em>requires</em> an action → affirmative.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>IOU with rent</b>Coupon = rent on your money; par = the money back.</div>
<div class="anchor"><b>Seesaw</b>Yield up, price down.</div>
<div class="anchor"><b>Must-do vs Must-not</b>Affirmative vs negative covenants.</div>
<div class="anchor"><b>Who pays you back?</b>Taxes, project revenue, operations, or an asset pool.</div></div>`,
summary:`A fixed-income security is defined by its issuer (sovereign, local government, quasi-government, supranational, corporate, SPE), maturity (money market ≤ 1 year original maturity; capital market > 1 year; perpetual), par value, coupon rate and frequency (fixed, floating = MRR + margin, or zero-coupon), currency, seniority and contingency provisions such as call, put or conversion options. Price and yield are inversely related, and a yield curve plots yields against maturity, with government curves serving as benchmarks for credit spreads. The bond indenture is the legal contract specifying the issuer, terms, sources of repayment (taxes, project revenue, operations, or a pool of assets), collateral (secured vs unsecured), credit enhancements and covenants: affirmative covenants require actions (payments, reporting, insurance, compliance), while negative covenants restrict actions (additional debt, negative pledges, asset sales, distributions).`
},
quiz:[
{q:"A bond issued with an original maturity of 9 months is classified as a:",o:["capital market security","money market security","perpetual bond"],a:1,e:"Original maturity of one year or less → money market."},
{q:"Which is a negative covenant?",o:["The issuer must maintain its properties in good condition","The issuer may not sell more than 20% of its assets without consent","The issuer must provide quarterly financial statements"],a:1,e:"Restrictions on actions (asset sales) are negative covenants."},
{q:"If market yields rise, the price of an existing fixed-coupon bond will:",o:["rise","fall","stay at par"],a:1,e:"Fixed cash flows discounted at a higher rate → lower price."}]
});

add({n:52,topic:"fi",title:"Fixed-Income Cash Flows and Types",
los:["52.a Describe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and investors.","52.b Describe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities."],
s:{
eli5:`<p>There are different ways to pay back a loan. You can pay just the "rent" each year and the whole amount at the end (<strong>bullet</strong>), like an interest-only loan. Or you can pay a bit of the amount back every time, like a car loan, until nothing is left (<strong>amortizing</strong>). Or something in between with a big final payment (<strong>balloon</strong>).</p>
<p>Some bonds come with special "buttons". A <strong>call</strong> button lets the <em>borrower</em> repay early (handy if rates fall, so they can borrow again cheaper). A <strong>put</strong> button lets the <em>lender</em> demand money back early. A <strong>convert</strong> button lets the lender swap the bond for company shares. Whoever owns the button benefits, and the price adjusts accordingly.</p>
<p>Where and in what currency the bond is issued also matters, because each country has its own rules and taxes.</p>`,
core:`<p><strong>What problem is this solving?</strong> Borrowers and lenders have different needs for timing, certainty and flexibility. Cash-flow structures and embedded options tailor the bond to those needs, and their value shows up in price and yield.</p>
<ul><li><strong>Principal repayment patterns</strong> change credit and reinvestment risk: amortizing and sinking-fund structures reduce credit risk (less principal outstanding over time) but create reinvestment risk.</li>
<li><strong>Coupon structures</strong> match issuers' cash flows or investors' needs: floaters (rates move with the market, so little price risk), step-ups (compensate investors if not called), credit-linked (coupon rises if rating falls), PIK (pay interest in more bonds when cash is tight), deferred coupons (start-ups, project finance), index-linked (inflation protection).</li>
<li><strong>Options belong to someone:</strong> callable → issuer benefits → investors demand higher yield/lower price. Putable and convertible → investor benefits → lower yield/higher price. Formula: callable value = straight − call; putable value = straight + put.</li>
<li><strong>Legal/regulatory/tax:</strong> domestic, foreign, Eurobonds and global bonds face different regulations; tax treatment of coupon income, capital gains and original-issue discount changes after-tax returns, so issuers and investors structure accordingly.</li></ul>`,
formal:`<h4>Principal repayment structures</h4>
<ul><li><strong>Bullet:</strong> coupons periodically; full principal at maturity.</li>
<li><strong>Fully amortizing:</strong> equal payments of interest + principal; zero balance at maturity (e.g., mortgages).</li>
<li><strong>Partially amortizing:</strong> some principal repaid along the way; balloon payment at maturity.</li>
<li><strong>Sinking fund:</strong> issuer retires a portion of the issue periodically (by calling at a sinking fund price, usually par, or buying in the market if cheaper). Reduces credit risk; creates reinvestment risk; issuer has a de facto call option when prices are above par.</li></ul>
<h4>Coupon structures</h4>
<ul><li><strong>FRN:</strong> MRR + quoted margin; may have caps (benefit issuer), floors (benefit investor), collars. <strong>Inverse floater:</strong> coupon moves opposite to MRR.</li>
<li><strong>Step-up coupon:</strong> coupon increases at set dates (often with call option).</li>
<li><strong>Credit-linked coupon:</strong> coupon rises if credit rating falls.</li>
<li><strong>Payment-in-kind (PIK):</strong> issuer may pay interest with additional bonds.</li>
<li><strong>Deferred coupon (split coupon):</strong> no coupons initially, then higher coupons.</li>
<li><strong>Index-linked (inflation-linked, linkers):</strong> coupon and/or principal adjusted by an index (e.g., CPI): interest-indexed, capital-indexed (TIPS-style), zero-coupon indexed.</li></ul>
<h4>Contingency provisions (embedded options)</h4>
<table><tr><th>Option</th><th>Holder</th><th>Effect on price/yield</th></tr>
<tr><td>Call (American, European, Bermudan; make-whole)</td><td>Issuer</td><td>Lower price/higher yield vs straight bond; call protection period</td></tr>
<tr><td>Put</td><td>Investor</td><td>Higher price/lower yield</td></tr>
<tr><td>Conversion (convertible bond)</td><td>Investor</td><td>Higher price/lower yield; conversion ratio, conversion price, conversion value; contingent convertibles (CoCos) convert automatically on a trigger</td></tr>
<tr><td>Warrants (attached)</td><td>Investor</td><td>Right to buy shares at a set price</td></tr></table>
<h4>Legal, regulatory, tax</h4>
<ul><li><strong>Domestic bonds:</strong> issued and traded in issuer's country and currency. <strong>Foreign bonds:</strong> foreign issuer, local currency/market (e.g., Yankee, Samurai). <strong>Eurobonds:</strong> issued outside any single country's jurisdiction, any currency, usually bearer form, less regulated. <strong>Global bonds:</strong> Eurobond market + at least one domestic market.</li>
<li><strong>Taxes:</strong> coupon interest usually taxed as ordinary income; gains/losses on sale as capital gains; accretion of original issue discount (OID) treated as interest income; US municipal interest typically exempt from federal (and in-state) tax.</li></ul>`,
math:`<div class="f"><span class="lbl">Fully amortizing payment (annuity)</span>PMT = Principal × r / [1 − (1 + r)<sup>−N</sup>]</div>
<p><strong>Why:</strong> the payment is the constant amount whose present value equals the loan. Early payments are mostly interest (the balance is large); later ones mostly principal.</p>
<div class="f"><span class="lbl">Values with embedded options</span>Callable = straight bond − call option &nbsp;·&nbsp; Putable = straight bond + put option &nbsp;·&nbsp; Convertible = straight bond + conversion option</div>
<div class="f"><span class="lbl">Convertible terms</span>Conversion value = conversion ratio × share price &nbsp;·&nbsp; Conversion price = par / conversion ratio</div>
<div class="dir"><div>Rates <span class="dn">↓</span> → call more likely → callable bond's upside capped</div><div>Rates <span class="up">↑</span> → put more valuable to investor</div><div>Share price <span class="up">↑</span> → convertible behaves more like equity</div></div>`,
example:`<div class="q">(a) A $100,000, 5-year, 6% fully amortizing loan with annual payments: find the payment and year-1 split between interest and principal. (b) A straight bond is worth 102; the embedded call is worth 1.5. Value the callable bond. A putable bond with a 0.8 put? (c) A convertible with $1,000 par has a conversion ratio of 25; the stock trades at $45. Conversion price and value? (d) A Japanese company issues a USD bond in the US market. What type?</div>
<ol class="steps"><li><strong>Payment</strong> = 100,000 × 0.06/(1 − 1.06<sup>−5</sup>) = <strong>$23,739.64</strong>. Year-1 interest = 6,000; principal = <strong>$17,739.64</strong>.</li>
<li><strong>Callable</strong> = 102 − 1.5 = <strong>100.5</strong>. <strong>Putable</strong> = 102 + 0.8 = <strong>102.8</strong>.</li>
<li><strong>Conversion price</strong> = 1,000/25 = <strong>$40</strong>; <strong>conversion value</strong> = 25 × 45 = <strong>$1,125</strong> (in the money).</li>
<li><strong>Foreign bond</strong> (a "Yankee" bond): foreign issuer, domestic market and currency.</li></ol>
<p class="ans">Answers: $23,739.64 (6,000 interest + 17,739.64 principal) · 100.5 / 102.8 · $40 / $1,125 · foreign bond</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Thinking a call option benefits investors. <b>Fix:</b> issuer holds it; investors are compensated with higher yield.</li>
<li><b>Trap:</b> Eurobond = bond in euros. <b>Fix:</b> issued outside any one jurisdiction, in any currency.</li>
<li><b>Trap:</b> Caps benefit investors. <b>Fix:</b> caps limit the coupon (issuer benefits); floors benefit investors.</li>
<li><b>Trap:</b> Sinking funds increase credit risk. <b>Fix:</b> they reduce it (but add reinvestment risk).</li>
<li><b>Trap:</b> OID accretion is a capital gain. <b>Fix:</b> taxed as interest income.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> identify structure (bullet/amortizing/balloon/sinking fund); coupon structure from a description; who benefits from an option; domestic/foreign/Eurobond/global; tax treatment.</li>
<li><strong>Option shortcut:</strong> "issuer's right" → minus; "investor's right" → plus.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Interest-only vs car loan</b>Bullet vs amortizing.</div>
<div class="anchor"><b>Whoever holds the button wins</b>Call → issuer; put/convert → investor.</div>
<div class="anchor"><b>Caps for Corporates, Floors for Folks</b>Caps help issuers, floors help investors.</div>
<div class="anchor"><b>Euro = Exterritorial</b>Eurobonds sit outside any one country's rules.</div></div>`,
summary:`Bonds repay principal as a bullet (all at maturity), fully amortizing (equal payments to zero balance) or partially amortizing (with a balloon), and sinking funds retire part of an issue over time (lower credit risk, added reinvestment risk). Coupon structures include floating-rate notes (MRR + margin, with possible caps and floors), step-up, credit-linked, payment-in-kind, deferred and index-linked coupons. Embedded options benefit their holder: calls benefit issuers (callable = straight − call, higher yield), while puts and conversion options benefit investors (putable = straight + put; convertibles have conversion ratio, price and value). Domestic, foreign, Eurobonds and global bonds face different legal and regulatory regimes. Coupon income is usually taxed as ordinary income, gains as capital gains, OID accretion as interest, and US municipal interest is typically tax-exempt.`
},
quiz:[
{q:"Which feature benefits the bondholder?",o:["A call provision","An interest rate cap on a floating-rate note","A put provision"],a:2,e:"Puts give the investor the right to sell back; calls and caps benefit the issuer."},
{q:"A bond issued by a Brazilian company in Japan, denominated in yen, is a:",o:["domestic bond","foreign bond","Eurobond"],a:1,e:"Foreign issuer, local market and currency."},
{q:"A bond that makes equal periodic payments that fully repay principal by maturity has a:",o:["bullet structure","fully amortizing structure","balloon structure"],a:1,e:"Fully amortizing: equal payments, zero balance at maturity."}]
});

add({n:53,topic:"fi",title:"Fixed-Income Issuance and Trading",
los:["53.a Describe fixed-income market segments and their issuer and investor participants.","53.b Describe types of fixed-income indexes.","53.c Compare primary and secondary fixed-income markets to equity markets."],
s:{
eli5:`<p>The bond market is a giant marketplace of IOUs, sorted into aisles: <strong>who</strong> is borrowing (governments, companies, special-purpose vehicles), <strong>how safe</strong> they are (investment grade vs high yield, like A-students vs risky bets), and <strong>how long</strong> the loan lasts (short, medium, long).</p>
<p>Shoppers pick the aisle that matches their needs: a pension fund that must pay retirees in 30 years buys long, safe bonds; a company parking spare cash for a few weeks buys short, safe ones; a bold fund chasing returns buys risky high-yield bonds.</p>
<p>New bonds are sold in the <strong>primary market</strong> (the factory store); existing ones are resold in the <strong>secondary market</strong> (the second-hand shop), mostly by phone or screen between dealers rather than on a stock exchange.</p>`,
core:`<p><strong>What problem is this solving?</strong> Matching borrowers' funding needs with investors' preferences across credit quality and maturity, and organizing how bonds are issued and traded efficiently.</p>
<ul><li><strong>Segmentation drives pricing:</strong> credit quality and maturity determine yield; investors self-select by their liabilities and risk appetite (liability-driven investing).</li>
<li><strong>Corporate funding by horizon:</strong> commercial paper for working capital, intermediate debt for medium-term needs, long-term debt for fixed assets: matching asset and liability maturities.</li>
<li><strong>Bond indexes are harder to build than equity indexes:</strong> many more issues, constant new issuance and maturities (high turnover), illiquid constituents, and weights that follow whoever borrows most (heavily indebted issuers get bigger weights).</li>
<li><strong>Bond trading differs from stocks:</strong> most trading is over-the-counter through dealers who quote bid and ask; liquidity varies hugely (on-the-run government bonds vs old, small corporate issues), so bid-ask spreads are a key cost and risk signal.</li></ul>`,
formal:`<h4>Market segments</h4>
<ul><li><strong>By issuer:</strong> sovereign (and other government), corporate (financial and non-financial), special purpose entities issuing ABS.</li>
<li><strong>By credit quality:</strong> investment grade (Baa3/BBB− and above) vs non-investment grade/high yield/"junk" (Ba1/BB+ and below).</li>
<li><strong>By original maturity:</strong> short-term/money market (≤ 1 year), intermediate (1–10 years), long-term (&gt; 10 years).</li>
<li>Also by currency, geography (developed/emerging), and ESG (green bonds).</li></ul>
<h4>Investor preferences</h4>
<table><tr><th>Investor</th><th>Typical segment</th></tr>
<tr><td>Pension funds, life insurers</td><td>Long-term investment grade (match long liabilities)</td></tr>
<tr><td>Corporations (cash management)</td><td>Short-term investment grade (excluding T-bills)</td></tr>
<tr><td>Central banks</td><td>Intermediate government notes (monetary policy operations)</td></tr>
<tr><td>Bond funds and ETFs</td><td>Intermediate investment grade</td></tr>
<tr><td>Return-seeking asset managers</td><td>High-yield intermediate, distressed debt</td></tr>
<tr><td>Banks</td><td>Government securities across maturities</td></tr></table>
<h4>Fixed-income indexes</h4>
<p>More constituents, higher turnover, and weights more affected by issuer sector and borrowing trends than equity indexes. <strong>Aggregate indexes</strong> cover the broad market; narrower ones focus on sector, credit quality, geography, maturity, currency or ESG. Challenges: illiquidity and pricing of constituents, replication difficulty (sampling).</p>
<h4>Primary and secondary markets</h4>
<ul><li><strong>Primary:</strong> public offerings (underwritten: intermediary guarantees price; best-efforts: no guarantee), shelf registration, private placements (to qualified investors, less disclosure, less liquid). Governments issue mainly via auctions. Debut issues take longer and cost more than repeat issues.</li>
<li><strong>Secondary:</strong> mostly OTC dealer (quote-driven) markets; some electronic platforms and exchanges. Bid-ask spreads narrow for liquid (e.g., on-the-run government) issues and wide for illiquid ones. Settlement typically T+1/T+2 for corporates; T+1 or same-day for many government bonds.</li>
<li><strong>Distressed debt:</strong> bonds of issuers in or near bankruptcy, traded at deep discounts.</li></ul>
<p>Versus equities: far more bond issues per issuer, mostly OTC rather than exchange-traded, lower liquidity for most issues, larger institutional trade sizes.</p>`,
math:`<p>This reading is descriptive; the "math" is classification logic and liquidity costs.</p>
<div class="f"><span class="lbl">Rating cut-off</span>Investment grade ≥ Baa3 / BBB− &nbsp;·&nbsp; High yield ≤ Ba1 / BB+</div>
<div class="f"><span class="lbl">Round-trip trading cost</span>Bid-ask spread (% of price) = (ask − bid) / mid</div>
<div class="f"><span class="lbl">Index weight (market-value weighted)</span>Weight of issuer = market value of its bonds / total market value → more borrowing = bigger weight</div>
<div class="dir"><div>Liquidity <span class="dn">↓</span> → bid-ask spread <span class="up">↑</span> → yield required <span class="up">↑</span></div><div>Issuer borrows more → larger index weight ("bums problem")</div></div>`,
example:`<div class="q">(a) Classify: a 7-year BB+ corporate bond; a 6-month Treasury bill; a 20-year Baa2 utility bond. (b) Which segment best suits: a defined-benefit pension with liabilities due in 25 years; a company holding cash for payroll next month; a fund seeking high returns willing to take credit risk? (c) A dealer quotes a corporate bond at 98.50 bid / 99.10 ask. Bid-ask spread as % of mid? (d) A bond issue is sold where the bank buys the entire issue and resells it. What kind of offering?</div>
<ol class="steps"><li><strong>(a)</strong> High yield, intermediate · investment grade (government), short-term/money market · investment grade, long-term.</li>
<li><strong>(b)</strong> Long-term investment grade · short-term investment grade (CP, CDs) · high-yield intermediate or distressed.</li>
<li><strong>(c)</strong> Mid = 98.80; spread = 0.60/98.80 = <strong>0.61%</strong>.</li>
<li><strong>(d)</strong> Underwritten offering (the intermediary bears price risk); under best-efforts it would only sell what it can.</li></ol>
<p class="ans">Answers: HY intermediate · IG short · IG long · LT IG / ST IG / HY · 0.61% · underwritten</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> BB+ is investment grade. <b>Fix:</b> BBB− is the lowest investment-grade rating.</li>
<li><b>Trap:</b> Most bonds trade on exchanges. <b>Fix:</b> most trade OTC through dealers.</li>
<li><b>Trap:</b> Bond indexes have fewer constituents than equity indexes. <b>Fix:</b> more constituents and higher turnover.</li>
<li><b>Trap:</b> Best-efforts guarantees the price. <b>Fix:</b> underwritten offerings guarantee; best-efforts doesn't.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> rating and maturity classifications; matching investors to segments; features of bond indexes; underwritten vs best-efforts vs private placement; OTC dealer markets and bid-ask spreads.</li>
<li>Fast recall reading: classify and move on.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Who · How safe · How long</b>The three aisles of the bond market.</div>
<div class="anchor"><b>Triple-B minus is the line</b>Above = investment grade.</div>
<div class="anchor"><b>Factory store vs second-hand shop</b>Primary vs secondary markets.</div>
<div class="anchor"><b>Bonds trade by phone</b>Mostly OTC dealer markets.</div></div>`,
summary:`Fixed-income markets are segmented by issuer (sovereign, corporate, SPEs issuing ABS), credit quality (investment grade Baa3/BBB− and above; high yield Ba1/BB+ and below) and original maturity (money market ≤ 1 year, intermediate 1–10 years, long-term > 10 years). Investors choose segments according to their liabilities and risk appetite: pensions and insurers long-term investment grade, corporations short-term investment grade, central banks intermediate government notes, bond funds intermediate investment grade, return-seeking managers high yield and distressed debt, banks government bonds across maturities. Fixed-income indexes have more constituents and higher turnover than equity indexes, with weights driven by issuance; aggregate indexes cover the whole market and narrower indexes target sectors, quality, geography or ESG. Bonds are issued by public offering (underwritten or best-efforts), shelf registration, private placement or, for governments, auctions, and mostly trade in OTC dealer markets where bid-ask spreads reflect liquidity.`
},
quiz:[
{q:"A bond rated BB+ is classified as:",o:["investment grade","high yield","money market"],a:1,e:"BBB− is the lowest investment-grade rating; BB+ is high yield."},
{q:"Compared with equity indexes, fixed-income indexes typically have:",o:["fewer constituents and lower turnover","more constituents and higher turnover","identical construction challenges"],a:1,e:"Many issues, frequent new issuance and maturities raise turnover."},
{q:"Which investor most likely prefers long-term investment-grade bonds?",o:["A corporation managing short-term cash","A life insurance company","A distressed-debt hedge fund"],a:1,e:"Long liabilities are matched with long, high-quality bonds."}]
});

add({n:54,topic:"fi",title:"Fixed-Income Markets for Corporate Issuers",
los:["54.a Compare short-term funding alternatives available to corporations and financial institutions.","54.b Describe repurchase agreements (repos), their uses, and their benefits and risks.","54.c Contrast the long-term funding of investment-grade versus high-yield corporate issuers."],
s:{
eli5:`<p>Companies need two kinds of money: quick cash for day-to-day bills, and long-term money for big things like factories.</p>
<p>For quick cash, a company might have a <strong>credit line</strong> with its bank (like a credit card), borrow against its inventory or customer invoices, or sell short IOUs called <strong>commercial paper</strong> if it's a big, trusted firm. Banks get quick cash mainly from customers' deposits.</p>
<p>A <strong>repo</strong> is like a pawn shop for bonds: "I'll sell you this bond today for $9.8 million and buy it back next month for $9.82 million." It's really a short, safe loan with the bond as collateral.</p>
<p>For long-term money, strong companies borrow cheaply with few strings attached; risky companies pay more, borrow for shorter periods, and accept more rules.</p>`,
core:`<p><strong>What problem is this solving?</strong> Firms must fund operations at the lowest cost while keeping enough liquidity to survive shocks. The choice of funding depends on credit quality, cost, reliability and maturity matching.</p>
<ul><li><strong>Reliability costs money:</strong> uncommitted lines (bank can refuse) are cheapest and least reliable; committed lines charge a commitment fee; revolving credit agreements (multi-year, formal) are most reliable and costliest.</li>
<li><strong>Secured short-term funding</strong> (asset-based loans, factoring receivables) is available to weaker firms because collateral protects the lender.</li>
<li><strong>Commercial paper</strong> is cheap but needs high credit quality and backup lines (rollover risk if the CP market freezes).</li>
<li><strong>Repos</strong> are the plumbing of financial markets: collateralized, short-term, cheap funding for dealers, a safe parking place for cash-rich lenders, a tool for central banks, and a way for short sellers to borrow securities. The repo rate rises with term, weaker collateral and less collateral; it falls for "special" collateral that's in high demand.</li>
<li><strong>IG vs HY long-term debt:</strong> for HY, credit spread dominates the yield, so returns behave more like equity; HY debt is shorter, more often callable, and carries more covenants. HY investors focus on default probability and recovery; IG investors on downgrade risk.</li></ul>`,
formal:`<h4>Short-term funding for non-financial corporations</h4>
<ul><li><strong>Uncommitted line of credit:</strong> bank may refuse to lend; least reliable, no fee.</li>
<li><strong>Committed (regular) line:</strong> bank commits for a period (≤ 1 year), commitment fee; counts as short-term debt only when drawn.</li>
<li><strong>Revolving credit agreement (revolver):</strong> formal, multi-year committed facility; most reliable.</li>
<li><strong>Secured loans:</strong> asset-based loans backed by receivables/inventory; blanket liens.</li>
<li><strong>Factoring:</strong> selling receivables at a discount to a factor (who takes on collection and credit risk).</li>
<li><strong>Commercial paper:</strong> short-term unsecured promissory notes (often ≤ 270 days in the US), issued at a discount (US) or interest-bearing (Eurocommercial paper); requires backup lines; rollover risk.</li></ul>
<h4>Short-term funding for financial institutions</h4>
<p>Customer deposits (demand/checking, savings, time deposits; certificates of deposit: nonnegotiable vs negotiable), interbank funds (unsecured and repos), central bank funds, commercial paper and asset-backed commercial paper (ABCP).</p>
<h4>Repurchase agreements</h4>
<ul><li>Borrower sells a security and agrees to repurchase it at a higher price; the difference is interest at the <strong>repo rate</strong> (annualized). Overnight repo vs term repo. Reverse repo is the lender's side.</li>
<li><strong>Repo margin (haircut):</strong> loan amount below collateral value; variation margin if collateral falls below required level.</li>
<li><strong>Uses:</strong> financing security positions (dealers), earning return on excess cash, central bank open market operations, short sellers obtaining securities (as the lender of cash).</li>
<li><strong>Repo rate higher</strong> with longer term, lower-quality collateral, higher credit risk of borrower, less collateralization. <strong>Lower</strong> for collateral in high demand ("special"), and when collateral delivered to the lender.</li>
<li><strong>Risks:</strong> default risk, collateral risk (value falls), margining risk, legal risk, netting and settlement risk. <strong>Tri-party repos</strong> (a custodian handles collateral) mitigate operational risks.</li></ul>
<h4>Long-term funding: investment grade vs high yield</h4>
<table><tr><th></th><th>Investment grade</th><th>High yield</th></tr>
<tr><td>Yield composition</td><td>Mostly benchmark rate</td><td>Larger share is credit spread</td></tr>
<tr><td>Maturity</td><td>Longer (up to 30+ years)</td><td>Shorter</td></tr>
<tr><td>Covenants</td><td>Fewer</td><td>More (incurrence and maintenance)</td></tr>
<tr><td>Call/prepayment features</td><td>Less common (make-whole)</td><td>More common</td></tr>
<tr><td>Returns behave like</td><td>Rates/bonds</td><td>More equity-like</td></tr>
<tr><td>Key investor concern</td><td>Downgrade risk</td><td>Probability of default and loss given default</td></tr></table>
<p>Funding: IG issuers use public bonds and MTN programs; HY issuers rely more on bank loans (often secured, floating), high-yield bonds with call schedules, and private placements.</p>`,
math:`<div class="f"><span class="lbl">Repo amount and repurchase price</span>Loan = collateral value × (1 − haircut) &nbsp;·&nbsp; Repurchase price = loan × (1 + repo rate × days/360)</div>
<div class="vars"><div><code>Haircut</code><span>Repo margin: cushion protecting the lender if collateral falls</span></div><div><code>Repo rate</code><span>Annualized interest rate on the repo (money-market, 360-day)</span></div></div>
<p><strong>Why it's cheap money:</strong> the lender holds the collateral, so if the borrower defaults the lender sells it. Lower risk → lower rate than unsecured borrowing.</p>
<div class="dir"><div>Longer term / weaker collateral / thinner haircut → repo rate <span class="up">↑</span></div><div>Collateral "on special" (hard to borrow) → repo rate <span class="dn">↓</span></div><div>Line reliability: uncommitted &lt; committed &lt; revolver (and cost rises the same way)</div></div>`,
example:`<div class="q">(a) A dealer finances $10,000,000 market value of government bonds with a 30-day repo at 3.0% (360-day basis) and a 2% haircut. How much is borrowed and what's the repurchase price? (b) Rank uncommitted, committed and revolving lines by reliability. (c) Would the repo rate be higher or lower if (i) collateral were BBB corporate bonds; (ii) the term were 90 days; (iii) the collateral were a bond in very high demand for shorting?</div>
<ol class="steps"><li><strong>Loan</strong> = 10,000,000 × 0.98 = <strong>$9,800,000</strong>.</li>
<li><strong>Interest</strong> = 9,800,000 × 0.03 × 30/360 = $24,500 → repurchase price = <strong>$9,824,500</strong>.</li>
<li><strong>Reliability:</strong> uncommitted &lt; committed &lt; revolving (cost rises in the same order).</li>
<li><strong>(i)</strong> higher (weaker collateral); <strong>(ii)</strong> higher (longer term); <strong>(iii)</strong> lower (collateral "on special": lenders accept a lower rate to get it).</li></ol>
<p class="ans">Answers: $9.8m borrowed, repurchase $9,824,500 · uncommitted &lt; committed &lt; revolver · higher, higher, lower</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> A repo is a sale with no lending. <b>Fix:</b> economically it's a collateralized loan.</li>
<li><b>Trap:</b> Larger haircut = riskier for the lender. <b>Fix:</b> a larger haircut protects the lender more.</li>
<li><b>Trap:</b> HY bonds have fewer covenants. <b>Fix:</b> HY bonds have more covenants.</li>
<li><b>Trap:</b> IG investors worry most about default. <b>Fix:</b> downgrade risk is their main concern; HY investors focus on default and recovery.</li>
<li><b>Trap:</b> Committed line counts as debt before drawn. <b>Fix:</b> only drawn amounts appear as liabilities.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> rank credit lines; define factoring and CP; repo mechanics (loan amount, repurchase price, haircut); repo rate drivers; repo risks; IG vs HY contrasts.</li>
<li><strong>Repo direction:</strong> "borrower sells and repurchases" = repo; the cash lender's side = reverse repo.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Pawn shop for bonds</b>Repo = collateralized loan.</div>
<div class="anchor"><b>Haircut = cushion</b>Lender lends less than collateral value.</div>
<div class="anchor"><b>U-C-R</b>Uncommitted, Committed, Revolver: rising reliability and cost.</div>
<div class="anchor"><b>Junk acts like stock</b>HY returns are equity-like and spread-driven.</div></div>`,
summary:`Non-financial corporations fund short-term needs with uncommitted, committed and revolving lines of credit (increasing reliability and cost), secured asset-based loans, factoring of receivables and commercial paper (which needs high credit quality and backup lines). Financial institutions rely on deposits (including negotiable and nonnegotiable CDs), interbank and central bank funds, repos and commercial paper including ABCP. A repo is a collateralized loan in which the borrower sells a security and repurchases it at a higher price; the haircut protects the lender and variation margin maintains collateral. Repos finance dealer positions, invest excess cash, implement monetary policy and supply securities to short sellers. Repo rates rise with term, weaker collateral and undercollateralization and fall for scarce collateral; risks include default, collateral, margining, legal and settlement risks, mitigated by tri-party repos. High-yield issuers' debt has more of its yield in credit spread, more covenants, shorter maturities, more call features and more equity-like returns; HY investors focus on default probability and loss given default, IG investors on downgrades.`
},
quiz:[
{q:"Which short-term funding source is most reliable for a corporation?",o:["Uncommitted line of credit","Committed line of credit","Revolving credit agreement"],a:2,e:"Revolvers are formal multi-year commitments: most reliable (and costliest)."},
{q:"All else equal, the repo rate will be lower when:",o:["the repo term is longer","the collateral is in high demand","the collateral is of lower credit quality"],a:1,e:"Scarce ('special') collateral commands a lower repo rate."},
{q:"Compared with investment-grade bonds, high-yield bonds typically have:",o:["longer maturities and fewer covenants","shorter maturities and more covenants","a smaller share of yield from credit spread"],a:1,e:"HY debt is shorter with more covenants and more spread-driven yields."}]
});

add({n:55,topic:"fi",title:"Fixed-Income Markets for Government Issuers",
los:["55.a Describe funding choices by sovereign and non-sovereign governments, quasi-government entities, and supranational agencies.","55.b Contrast the issuance and trading of government and corporate fixed-income instruments."],
s:{
eli5:`<p>Governments borrow too, usually more than anyone else in their country. Because they can raise taxes (and often print money), their IOUs are usually the safest in town, which is why everyone uses their interest rates as the "zero-risk" yardstick.</p>
<p>Rich, stable countries borrow easily in their own strong currency. Developing countries have bumpier economies, so they pay more and sometimes borrow in foreign currencies.</p>
<p>Cities and regions borrow for schools and roads, backed by local taxes or by the money a project earns (like tolls). Special government-created agencies borrow for housing or infrastructure. And international bodies like the World Bank borrow to fund development.</p>
<p>Governments sell new bonds through <strong>auctions</strong>: buyers bid the yield they'll accept, and the government fills the cheapest bids first.</p>`,
core:`<p><strong>What problem is this solving?</strong> Governments fund deficits and public investment; markets need a risk-free benchmark curve; central banks need instruments for monetary policy. Government debt markets do all three.</p>
<ul><li><strong>Sovereign credit depends on the economy and institutions:</strong> developed sovereigns (diversified economies, transparent policy, reserve currencies) vs emerging (faster growth, less stability, concentrated revenue, possible foreign-currency debt).</li>
<li><strong>Maturity choice:</strong> in theory (Ricardian equivalence) it doesn't matter whether governments tax or borrow, or at what maturity; in practice, short-term debt creates rollover risk, so governments issue across the curve, which also builds a benchmark yield curve, hedging tools, repo collateral and monetary policy instruments.</li>
<li><strong>Non-sovereigns:</strong> agencies/quasi-government (often implicit or explicit government support), local governments (general obligation backed by taxes; revenue bonds backed by project revenue, riskier), supranationals (high ratings, backed by member countries).</li>
<li><strong>Auctions:</strong> transparent, competitive price discovery; competitive bids set the yield, noncompetitive bids are guaranteed allocation at that yield. Single-price (uniform) vs multiple-price (discriminatory) auctions. Primary dealers are obliged to bid.</li>
<li><strong>Trading:</strong> OTC dealer markets; on-the-run (most recent) issues are most liquid and their prices most informative; off-the-run trade at slightly higher yields.</li></ul>`,
formal:`<h4>Sovereign issuers</h4>
<ul><li>Usually the highest credit quality and largest issuers in their market; repayment from taxes and (if issuing in own currency) money creation.</li>
<li><strong>Developed market sovereigns:</strong> stable, diversified economies; consistent, transparent fiscal policy; debt in a reserve currency.</li>
<li><strong>Emerging market sovereigns:</strong> faster-growing, less stable, concentrated economies (dependence on a commodity/industry); less stable tax revenues; debt can be domestic (local currency, local investors) or external (owed to foreign creditors, often in foreign currency).</li>
<li>Instruments: bills (≤ 1 year), notes, bonds; fixed-rate, floating-rate, inflation-linked.</li>
<li><strong>Ricardian equivalence:</strong> theory that governments should be indifferent between taxing now and issuing debt of any maturity; in practice, rollover risk and fiscal predictability lead to issuance across maturities.</li>
<li>Benefits of a full maturity range: benchmark yield curve; investors can hedge rate risk; collateral for repos; central bank monetary policy operations.</li></ul>
<h4>Non-sovereign government issuers</h4>
<ul><li><strong>Agency/quasi-government bonds:</strong> entities created by governments for specific purposes (infrastructure, housing finance); may carry explicit or implicit guarantees.</li>
<li><strong>Local/regional governments:</strong> general obligation (GO) bonds backed by taxing power; revenue bonds backed by specific project revenue (higher risk).</li>
<li><strong>Supranational bonds:</strong> issued by multilateral institutions (World Bank, IMF, regional development banks); typically high ratings.</li></ul>
<h4>Issuance and trading vs corporate</h4>
<ul><li>Governments issue on a regular, pre-announced calendar via public auctions; corporations issue opportunistically via underwritten offerings or private placements.</li>
<li><strong>Competitive bids</strong> specify yield (and amount) and determine the price; <strong>noncompetitive bids</strong> accept the auction yield and are filled first, guaranteed.</li>
<li><strong>Single-price auction:</strong> all winning bidders pay the price at the highest accepted (cut-off/stop-out) yield. <strong>Multiple-price auction:</strong> each winning competitive bidder pays the price corresponding to their own bid.</li>
<li><strong>Primary dealers:</strong> required to bid competitively, may bid for clients, act as counterparties to the central bank.</li>
<li>Secondary trading: quote-driven OTC dealer markets; on-the-run issues most liquid; government markets far more liquid than most corporate markets.</li></ul>`,
math:`<div class="f"><span class="lbl">Auction mechanics</span>Competitive amount needed = offering − noncompetitive bids → fill competitive bids from LOWEST yield up → cut-off (stop-out) yield</div>
<div class="f"><span class="lbl">Who pays what</span>Single-price: everyone pays price at cut-off yield &nbsp;·&nbsp; Multiple-price: each pays price at own bid yield</div>
<p><strong>Why lowest yield first:</strong> a lower yield means a higher price for the government, so the government accepts the most generous bids first.</p>
<div class="dir"><div>Rollover risk <span class="up">↑</span> with heavy short-term issuance</div><div>On-the-run → liquidity <span class="up">↑</span>, yield slightly <span class="dn">↓</span> vs off-the-run</div><div>Revenue bond vs GO bond → credit risk <span class="up">↑</span></div></div>`,
example:`<div class="q">A government auctions $100 million of bonds and receives $10 million of noncompetitive bids plus competitive bids: $40m at 4.10%, $30m at 4.15%, $50m at 4.20%. (a) What's the cut-off yield and how are bids filled? (b) What yield do winners pay under a single-price vs multiple-price auction? (c) A city funds a toll bridge with bonds repaid only from tolls. What type?</div>
<ol class="steps"><li><strong>Noncompetitive</strong> $10m filled first → $90m left for competitive bids.</li>
<li><strong>Fill from lowest yield:</strong> $40m at 4.10% (50m left) → $30m at 4.15% (20m left) → $20m of the $50m at 4.20%. Cut-off yield = <strong>4.20%</strong>; the 4.20% bidders get 40% of their request.</li>
<li><strong>Single-price:</strong> all winners (and noncompetitive bidders) pay the price at <strong>4.20%</strong>. <strong>Multiple-price:</strong> 4.10% bidders pay the price at 4.10%, 4.15% bidders at 4.15%, 4.20% bidders at 4.20%; noncompetitive at the average/stop-out per local rules.</li>
<li><strong>Revenue bond</strong> (riskier than a general obligation bond backed by the city's taxing power).</li></ol>
<p class="ans">Answers: cut-off 4.20% (partial fill at 4.20%) · uniform 4.20% vs own bids · revenue bond</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Filling auction bids from highest yield. <b>Fix:</b> lowest yield (highest price) first.</li>
<li><b>Trap:</b> Noncompetitive bids set the price. <b>Fix:</b> competitive bids set it; noncompetitive bids are guaranteed fills at it.</li>
<li><b>Trap:</b> Revenue bonds backed by general taxes. <b>Fix:</b> GO bonds are; revenue bonds rely on project revenue.</li>
<li><b>Trap:</b> Off-the-run bonds are more liquid. <b>Fix:</b> on-the-run issues are most liquid.</li>
<li><b>Trap:</b> Ricardian equivalence explains why governments issue at all maturities. <b>Fix:</b> theory says indifference; practice (rollover risk) explains spreading maturities.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> developed vs emerging sovereign features; domestic vs external debt; GO vs revenue bonds; agencies, supranationals; auction mechanics and cut-off yield; single- vs multiple-price; primary dealers; on-the-run.</li>
<li><strong>Auction speed tip:</strong> subtract noncompetitive first, then stack competitive bids from lowest yield until filled.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Tax-power = top credit</b>Sovereigns set the risk-free benchmark.</div>
<div class="anchor"><b>GO = General taxes, Revenue = Road tolls</b>Local government bonds.</div>
<div class="anchor"><b>Lowest yield wins</b>Auction fill order.</div>
<div class="anchor"><b>Newest = most liquid</b>On-the-run.</div></div>`,
summary:`Sovereign issuers are usually the highest-quality and largest issuers in a market. Developed sovereigns have stable, diversified economies, transparent fiscal policy and reserve-currency debt; emerging sovereigns have faster-growing but less stable and more concentrated economies, with domestic or external (foreign-creditor) debt. Ricardian equivalence implies indifference between taxes and debt of any maturity, but rollover risk leads governments to issue across maturities, which provides benchmark curves, hedging tools, repo collateral and monetary policy instruments. Non-sovereign issuers include agencies/quasi-government entities, local governments (general obligation bonds backed by taxes; revenue bonds backed by project revenue) and supranationals. Governments issue via regular public auctions: competitive bids set the yield, noncompetitive bids are filled at that yield, single-price auctions charge everyone the cut-off price, multiple-price auctions charge each bidder their own bid, and primary dealers must participate. Government bonds trade in OTC dealer markets, with on-the-run issues most liquid and informative.`
},
quiz:[
{q:"In a single-price government bond auction, successful bidders pay:",o:["the price corresponding to their own bid","the price corresponding to the cut-off yield","the average of all bids"],a:1,e:"Uniform pricing at the stop-out (cut-off) yield."},
{q:"A municipal bond backed only by revenues from a new stadium is a:",o:["general obligation bond","revenue bond","supranational bond"],a:1,e:"Revenue bonds are repaid from a specific project's revenue."},
{q:"Which government bonds are typically the most liquid?",o:["Off-the-run issues","On-the-run issues","Zero-coupon strips"],a:1,e:"The most recently issued (on-the-run) bonds trade most actively."}]
});

add({n:56,topic:"fi",title:"Fixed-Income Bond Valuation: Prices and Yields",
los:["56.a Calculate a bond's price given a yield-to-maturity on or between coupon dates.","56.b Identify the relationships among a bond's price, coupon rate, maturity, and yield-to-maturity.","56.c Describe matrix pricing."],
s:{
eli5:`<p>A bond's price is simply "what all its future payments are worth today". If the market wants an 8% return but the bond pays only 6% coupons, nobody pays full price; they pay less so the overall return works out to 8%. If the bond pays more than the market wants, people happily pay extra.</p>
<p>If you buy a bond halfway between coupon dates, the seller has "earned" half of the next coupon by holding it, so you pay them that part on top of the quoted price. That extra is <strong>accrued interest</strong>.</p>
<p>And if a bond hardly ever trades, you estimate its yield by looking at similar bonds that do trade, like pricing a house from comparable sales nearby. That's <strong>matrix pricing</strong>.</p>`,
core:`<p><strong>What problem is this solving?</strong> Converting a promised stream of cash flows into one price, and back again into a yield, so bonds with different coupons and maturities can be compared.</p>
<ul><li><strong>Price = PV of cash flows at the YTM.</strong> YTM is the single discount rate that equates PV with price: the bond's internal rate of return if held to maturity, all payments made, coupons reinvested at the YTM.</li>
<li><strong>Coupon vs YTM tells you premium/discount:</strong> coupon &lt; YTM → discount; coupon &gt; YTM → premium; equal → par.</li>
<li><strong>Price sensitivity rises with maturity and falls with coupon:</strong> distant, lumpy cash flows (long maturity, low or zero coupon) are hit harder by discounting changes.</li>
<li><strong>Convexity of the price-yield curve:</strong> prices rise more when yields fall than they fall when yields rise by the same amount.</li>
<li><strong>Pull to par:</strong> as maturity approaches, premium and discount bond prices converge toward par (holding YTM constant).</li>
<li><strong>Between coupon dates:</strong> full (dirty) price = PV at last coupon grown by the fraction of the period elapsed; quoted flat (clean) price = full − accrued interest, so quoted prices don't jump on coupon dates.</li></ul>`,
formal:`<h4>Price on a coupon date</h4>
<p>P = Σ<sub>t=1..N</sub> PMT/(1 + r)<sup>t</sup> + FV/(1 + r)<sup>N</sup>, where r is the periodic market discount rate (YTM/m) and N the number of periods.</p>
<h4>Price between coupon dates</h4>
<ul><li>Full price PV<sup>Full</sup> = PV (at last coupon date) × (1 + r)<sup>t/T</sup>, t = days since last coupon, T = days in coupon period.</li>
<li>Accrued interest AI = (t/T) × PMT.</li>
<li>Flat price = full price − AI (quoted price).</li>
<li><strong>Day count conventions:</strong> actual/actual (common for government bonds) or 30/360 (common for corporate bonds).</li></ul>
<h4>Price-yield relationships (other factors constant)</h4>
<ul><li>Price and YTM are inversely related.</li>
<li>Convex: a decrease in yield raises price more than an equal increase lowers it.</li>
<li>Coupon &lt; YTM → discount; coupon &gt; YTM → premium; coupon = YTM → par.</li>
<li>Lower coupon → greater % price sensitivity; longer maturity → greater sensitivity (generally).</li>
<li>Constant-yield price trajectory: prices pull to par as maturity approaches.</li></ul>
<h4>Matrix pricing</h4>
<p>For bonds that are untraded or infrequently traded: estimate YTM from traded bonds of similar credit quality, interpolating linearly between maturities, then price the bond at that yield. Also used to set yields for new issues (benchmark yield + estimated spread).</p>`,
math:`<div class="f"><span class="lbl">Bond price</span>P = PMT/(1+r) + PMT/(1+r)² + … + (PMT + FV)/(1+r)<sup>N</sup></div>
<div class="vars"><div><code>PMT</code><span>Coupon per period = coupon rate × FV / m</span></div><div><code>r</code><span>YTM per period = YTM / m</span></div><div><code>N</code><span>Number of remaining periods = years × m</span></div></div>
<div class="f"><span class="lbl">Full price, accrued interest, flat price</span>Full = PV × (1 + r)<sup>t/T</sup> &nbsp;·&nbsp; AI = PMT × t/T &nbsp;·&nbsp; Flat = Full − AI</div>
<p><strong>Why grow the PV:</strong> between coupon dates the bond's value accrues at the yield; you're simply moving the last-coupon-date value forward by the fraction of the period that has passed.</p>
<div class="f"><span class="lbl">Matrix pricing (linear interpolation)</span>y<sub>target</sub> = y<sub>short</sub> + (y<sub>long</sub> − y<sub>short</sub>) × (M<sub>target</sub> − M<sub>short</sub>)/(M<sub>long</sub> − M<sub>short</sub>)</div>
<div class="dir"><div>YTM <span class="up">↑</span> → price <span class="dn">↓</span> (convex curve)</div><div>Lower coupon or longer maturity → bigger % price swings</div><div>Time passes (YTM constant) → price moves toward par</div></div>
<div class="calc" data-calc="bond"></div>
<div class="calc" data-calc="ai"></div>`,
example:`<div class="q">(a) Price a 5-year, 6% semiannual bond (par 100) at an 8% YTM. (b) A 5% semiannual bond has 3 years left as of its last coupon date; YTM is 6%. Settlement is 60 days into a 180-day coupon period (30/360). Find full price, accrued interest and flat price. (c) An illiquid 4-year, 5% annual-pay bond has no quotes. Comparable bonds: 3-year yields 4.0%, 5-year yields 5.0%. Estimate its yield and price.</div>
<ol class="steps"><li><strong>(a)</strong> N = 10, r = 4%, PMT = 3, FV = 100 → <strong>P = 91.89</strong> (discount: coupon 6% &lt; YTM 8%).</li>
<li><strong>(b) PV at last coupon:</strong> N = 6, r = 3%, PMT = 2.5 → 97.2914. Full price = 97.2914 × 1.03<sup>60/180</sup> = <strong>98.2547</strong>.</li>
<li><strong>Accrued interest</strong> = 2.5 × 60/180 = <strong>0.8333</strong>. <strong>Flat price</strong> = 98.2547 − 0.8333 = <strong>97.4214</strong>.</li>
<li><strong>(c) Matrix:</strong> 4 years is halfway between 3 and 5 → y = 4.0 + 0.5 × 1.0 = <strong>4.5%</strong>. Price at 4.5% (N = 4, PMT = 5) = <strong>101.79</strong> (premium, since coupon 5% &gt; 4.5%).</li></ol>
<p class="ans">Answers: 91.89 · full 98.2547, AI 0.8333, flat 97.4214 · 4.5% → 101.79</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Annual inputs for semiannual bonds. <b>Fix:</b> halve coupon and yield, double N.</li>
<li><b>Trap:</b> Quoting the full price as the market quote. <b>Fix:</b> quotes are flat (clean); you pay the full price.</li>
<li><b>Trap:</b> Computing AI with the yield instead of the coupon. <b>Fix:</b> AI = coupon × fraction of period.</li>
<li><b>Trap:</b> Believing higher-coupon bonds are more rate-sensitive. <b>Fix:</b> lower coupon → more sensitive.</li>
<li><b>Trap:</b> Thinking a premium bond's price stays put. <b>Fix:</b> it pulls down to par over time.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> bond price from YTM; YTM from price (CPT I/Y, × m); premium/discount logic; full vs flat price; accrued interest; matrix pricing interpolation; sensitivity rankings.</li>
<li><strong>Sanity check first:</strong> compare coupon and YTM to know whether the answer is above or below par before computing.</li>
<li><strong>Calculator:</strong> N, I/Y (periodic), PMT, FV → CPT PV; keep signs consistent.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Coupon vs YTM decides premium/discount</b>"C &lt; Y → discount; C &gt; Y → premium."</div>
<div class="anchor"><b>Dirty = Clean + Accrued</b>You pay dirty, they quote clean.</div>
<div class="anchor"><b>Pull to par</b>Every bond walks toward 100 as it ages.</div>
<div class="anchor"><b>Comparable sales</b>Matrix pricing = house pricing from neighbors.</div></div>`,
summary:`A bond's price is the present value of its coupons and principal discounted at the periodic YTM (use YTM/m and N × m for semiannual bonds). Between coupon dates, the full (dirty) price equals the PV at the last coupon date × (1 + r)<sup>t/T</sup>, accrued interest = coupon × t/T, and the quoted flat (clean) price = full − accrued interest, using actual/actual or 30/360 day counts. Price and YTM are inversely related and the relationship is convex; bonds trade at a discount when coupon < YTM and a premium when coupon > YTM; lower-coupon and longer-maturity bonds are more price-sensitive; and prices pull to par as maturity approaches. Matrix pricing estimates yields for illiquid bonds from comparable traded bonds of similar credit quality, interpolating across maturities.`
},
quiz:[
{q:"A bond's coupon rate is 4% and its YTM is 5%. The bond trades at:",o:["a premium","par","a discount"],a:2,e:"Coupon below YTM → discount."},
{q:"The full price of a bond is 101.40 and accrued interest is 1.25. The flat price is:",o:["102.65","100.15","101.40"],a:1,e:"Flat = full − AI = 100.15."},
{q:"Which bond's price is most sensitive to a change in yield?",o:["5-year, 8% coupon","20-year, 2% coupon","20-year, 8% coupon"],a:1,e:"Longer maturity and lower coupon → greatest sensitivity."}]
});

add({n:57,topic:"fi",title:"Yield and Yield Spread Measures for Fixed-Rate Bonds",
los:["57.a Calculate annual yield on a bond for varying compounding periods in a year.","57.b Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds."],
s:{
eli5:`<p>"6% a year" can mean different things. If interest is added twice a year, you actually end up with a bit more than 6% because you earn interest on interest. So to compare bonds fairly, we must say how often the interest compounds.</p>
<p>There are also several "quick" yield measures: the <strong>current yield</strong> just divides the yearly coupon by the price (ignoring the gain or loss when the bond matures). The <strong>yield to call</strong> asks "what if the issuer pays me back early?" A cautious investor looks at the <strong>yield to worst</strong>, the lowest of these.</p>
<p>And to see how much extra a company bond pays for its risk, you compare its yield with a safe benchmark. That gap is the <strong>spread</strong>. There are several kinds of spread depending on which benchmark you use.</p>`,
core:`<p><strong>What problem is this solving?</strong> Yields are quoted on different conventions and bonds have different features, so investors need consistent measures to compare return and to isolate compensation for credit, liquidity and option risk.</p>
<ul><li><strong>Periodicity:</strong> a stated annual rate compounded m times per year has effective annual yield (1 + r/m)<sup>m</sup> − 1. Converting between periodicities means finding the rate with the same effective yield. More frequent compounding → lower stated rate for the same economic return.</li>
<li><strong>Conventions:</strong> street convention (scheduled dates) vs true yield (actual dates, including weekends/holidays; slightly lower). Semiannual bond basis yield = 2 × semiannual rate.</li>
<li><strong>Current yield</strong> ignores capital gains/losses and reinvestment; <strong>simple yield</strong> adds straight-line amortization of discount/premium.</li>
<li><strong>Callable bonds:</strong> compute yield-to-call for each call date; <strong>yield-to-worst</strong> = lowest of YTM and all YTCs.</li>
<li><strong>Spreads tell you what you're being paid for:</strong> G-spread (over government benchmark), I-spread (over swap rates), Z-spread (constant spread over the whole spot curve: more precise), OAS (Z-spread minus option cost: the spread for credit/liquidity only).</li></ul>`,
formal:`<h4>Yields and periodicity</h4>
<ul><li>Effective annual yield EAY = (1 + r<sub>stated</sub>/m)<sup>m</sup> − 1. Annual-pay bond: EAY = YTM; more frequent payments → EAY &gt; stated YTM.</li>
<li>Semiannual bond basis: YTM = 2 × semiannual discount rate.</li>
<li>Conversion: (1 + APR<sub>m</sub>/m)<sup>m</sup> = (1 + APR<sub>n</sub>/n)<sup>n</sup>.</li>
<li>Street convention vs true yield (true slightly lower when payments delayed by weekends/holidays); government equivalent yield (actual/actual) vs corporate (30/360).</li></ul>
<h4>Other yield measures</h4>
<ul><li><strong>Current yield</strong> = annual coupon / flat price.</li>
<li><strong>Simple yield</strong> = (annual coupon + straight-line amortization of discount or − of premium) / flat price.</li>
<li><strong>Yield-to-call</strong> (first call, each call date), <strong>yield-to-first-par-call</strong>, <strong>yield-to-worst</strong> = lowest of YTM and YTCs.</li>
<li>Option-adjusted yield: yield after removing option value (callable: higher than YTW-related measures).</li></ul>
<h4>Spread measures</h4>
<table><tr><th>Spread</th><th>Definition</th><th>Use</th></tr>
<tr><td>Benchmark/yield spread</td><td>YTM − benchmark yield</td><td>Simple credit + liquidity compensation</td></tr>
<tr><td>G-spread</td><td>YTM − government bond yield (same/interpolated maturity)</td><td>Most common benchmark spread</td></tr>
<tr><td>I-spread</td><td>YTM − swap rate (same maturity)</td><td>Relative to bank credit/funding</td></tr>
<tr><td>Z-spread (zero-volatility)</td><td>Constant spread added to each benchmark spot rate so PV = price</td><td>Accounts for shape of the spot curve</td></tr>
<tr><td>OAS</td><td>Z-spread − option value (in bp) for callable; + for putable</td><td>Compare bonds with/without embedded options</td></tr></table>`,
math:`<div class="f"><span class="lbl">Effective annual yield</span>EAY = (1 + YTM/m)<sup>m</sup> − 1</div>
<div class="f"><span class="lbl">Periodicity conversion</span>(1 + APR<sub>m</sub>/m)<sup>m</sup> = (1 + APR<sub>n</sub>/n)<sup>n</sup></div>
<p><strong>Why:</strong> two quotes are equivalent if they grow $1 to the same amount in a year.</p>
<div class="f"><span class="lbl">Current and simple yield</span>Current = coupon / price &nbsp;·&nbsp; Simple = [coupon + (par − price)/years] / price</div>
<div class="f"><span class="lbl">Spreads</span>G-spread = YTM − Gov yield &nbsp;·&nbsp; I-spread = YTM − swap rate &nbsp;·&nbsp; OAS = Z-spread − option cost (callable)</div>
<div class="dir"><div>More compounding periods → EAY <span class="up">↑</span> (same stated rate)</div><div>Call option value <span class="up">↑</span> → OAS <span class="dn">↓</span> relative to Z-spread</div><div>Discount bond: current yield &lt; YTM; premium bond: current yield &gt; YTM</div></div>
<div class="calc" data-calc="period"></div>
<div class="calc" data-calc="ytm"></div>`,
example:`<div class="q">(a) A bond yields 6% on a semiannual basis. Find the effective annual yield and the equivalent quarterly-compounded rate. (b) A 4-year, 5% semiannual bond trades at 95. Find YTM, current yield. (c) The 4-year government yield is 4.5%. G-spread? (d) A callable bond has a Z-spread of 180 bp and a call option worth 45 bp. OAS?</div>
<ol class="steps"><li><strong>EAY</strong> = 1.03² − 1 = <strong>6.09%</strong>. Quarterly equivalent: 4 × (1.0609<sup>0.25</sup> − 1) = <strong>5.956%</strong>.</li>
<li><strong>YTM:</strong> N = 8, PV = −95, PMT = 2.5, FV = 100 → I/Y = 3.219% → YTM = <strong>6.44%</strong>. Current yield = 5/95 = <strong>5.26%</strong> (below YTM, as for any discount bond).</li>
<li><strong>G-spread</strong> = 6.44% − 4.50% ≈ <strong>194 bp</strong>.</li>
<li><strong>OAS</strong> = 180 − 45 = <strong>135 bp</strong>: the compensation for credit and liquidity after removing the call.</li></ol>
<p class="ans">Answers: 6.09%, 5.956% · YTM 6.44%, CY 5.26% · ≈194 bp · 135 bp</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Comparing a semiannual-basis yield with an annual-pay yield directly. <b>Fix:</b> convert to the same periodicity.</li>
<li><b>Trap:</b> Yield-to-worst = highest yield. <b>Fix:</b> it's the lowest of YTM and all YTCs.</li>
<li><b>Trap:</b> OAS = Z-spread + call value. <b>Fix:</b> for callable bonds, OAS = Z − option value.</li>
<li><b>Trap:</b> Using G-spread for bonds when the curve is steep. <b>Fix:</b> Z-spread better reflects curve shape.</li>
<li><b>Trap:</b> Current yield includes price change. <b>Fix:</b> it ignores it.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> convert yields between periodicities; compute current/simple yield; identify YTW; define and compare G-, I-, Z-spreads and OAS.</li>
<li><strong>Shortcut:</strong> I-spread uses swap rates; G uses government; Z uses the whole spot curve; OAS strips options.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Same growth, same yield</b>Convert periodicities by matching effective annual yield.</div>
<div class="anchor"><b>Worst = lowest</b>Yield-to-worst is the cautious number.</div>
<div class="anchor"><b>G-overnment, I-nterbank swap, Z-ero curve, O-ptions out</b>The spread family.</div></div>`,
summary:`Yield quotes depend on periodicity: effective annual yield = (1 + YTM/m)<sup>m</sup> − 1, and yields are converted between compounding frequencies by equating effective returns (more frequent compounding means a lower stated rate for the same return). Semiannual bond basis yield is twice the semiannual rate; street convention uses scheduled dates, true yield actual dates. Current yield = annual coupon/price; simple yield adds straight-line amortization of discount or premium. For callable bonds, yields to each call date are computed and yield-to-worst is the lowest of YTM and YTCs. Spreads measure extra compensation: G-spread over government yields, I-spread over swap rates, Z-spread as the constant spread over the benchmark spot curve that equates PV and price, and OAS (Z-spread minus call option value for callable bonds) as the spread net of embedded options.`
},
quiz:[
{q:"A bond has a 5% YTM on a semiannual basis. Its effective annual yield is closest to:",o:["5.00%","5.06%","5.25%"],a:1,e:"1.025² − 1 = 5.0625%."},
{q:"The spread added to every point on the benchmark spot curve to equate a bond's PV with its price is the:",o:["G-spread","Z-spread","I-spread"],a:1,e:"Zero-volatility (Z-) spread."},
{q:"A callable bond has a Z-spread of 150 bp and its call option is worth 30 bp. Its OAS is:",o:["120 bp","150 bp","180 bp"],a:0,e:"OAS = Z-spread − option cost = 120 bp."}]
});

add({n:58,topic:"fi",title:"Yield and Yield Spread Measures for Floating-Rate Instruments",
los:["58.a Calculate and interpret yield spread measures for floating-rate instruments.","58.b Calculate and interpret yield measures for money market instruments."],
s:{
eli5:`<p>A <strong>floating-rate note</strong> pays interest that resets with the market, like a savings account whose rate follows the central bank. Because its payments keep up with market rates, its price stays close to 100. It only drifts away if the borrower becomes riskier or safer than when the note was issued.</p>
<p><strong>Money market</strong> instruments are very short IOUs (days to a year), like Treasury bills. They're quoted in quirky ways: some as a "discount" off the face value, some as normal interest, some on a 360-day year, some on 365. To compare them, you convert everything to the same basis.</p>`,
core:`<p><strong>What problem is this solving?</strong> Floaters remove most interest-rate risk but keep credit risk, so their pricing is about the issuer's credit spread. Money market instruments use different quoting conventions, so investors need conversions to compare true returns.</p>
<ul><li><strong>Quoted margin vs discount (required) margin:</strong> the quoted margin is fixed in the contract; the discount margin is what the market now demands. Equal → price at par on reset dates. If credit worsens, discount margin &gt; quoted margin → price below par; if credit improves → above par.</li>
<li><strong>Money market quoting:</strong> <em>discount rate</em> basis (T-bills, CP, bankers' acceptances) understates the true return because it's computed on face value, not price, and usually on a 360-day year. <em>Add-on</em> basis (CDs, repos, interbank deposits) is like a normal interest rate. The <em>bond-equivalent yield</em> is an add-on rate on a 365-day year: the comparable measure.</li></ul>`,
formal:`<h4>Floating-rate notes</h4>
<ul><li>Coupon = MRR + quoted margin (QM), reset periodically (e.g., quarterly).</li>
<li><strong>Required/discount margin (DM):</strong> spread over MRR demanded by investors for credit and liquidity risk.</li>
<li>At issuance, typically QM = DM → priced at par. DM &gt; QM → discount; DM &lt; QM → premium.</li>
<li>Price on a reset date: PV = Σ [(MRR + QM)/m × FV] / (1 + (MRR + DM)/m)<sup>t</sup> + FV/(1 + (MRR + DM)/m)<sup>N</sup> (simplified model assuming MRR constant).</li>
<li>Interest-rate risk is small (coupon resets), credit spread risk remains.</li></ul>
<h4>Money market yields</h4>
<ul><li><strong>Discount basis:</strong> PV = FV × (1 − (days/year) × DR); DR = (year/days) × (FV − PV)/FV.</li>
<li><strong>Add-on basis:</strong> PV = FV / (1 + (days/year) × AOR); AOR = (year/days) × (FV − PV)/PV.</li>
<li>Year = 360 or 365 by convention. <strong>Bond-equivalent yield</strong> = add-on rate on a 365-day year.</li>
<li>Discount rates are lower than equivalent add-on rates (denominator FV &gt; PV) and 360-day rates lower than 365-day equivalents.</li></ul>`,
math:`<div class="f"><span class="lbl">Discount-basis price and rate</span>PV = FV × (1 − days/year × DR) &nbsp;·&nbsp; DR = (year/days) × (FV − PV)/FV</div>
<div class="f"><span class="lbl">Add-on basis</span>PV = FV / (1 + days/year × AOR) &nbsp;·&nbsp; AOR = (year/days) × (FV − PV)/PV</div>
<div class="vars"><div><code>DR</code><span>Discount rate: interest measured as a % of face value</span></div><div><code>AOR</code><span>Add-on rate: interest as a % of the amount actually invested</span></div><div><code>year</code><span>360 or 365 per convention</span></div></div>
<p><strong>Why discount rates understate return:</strong> you earn FV − PV on an investment of PV, but the discount rate divides by FV, the bigger number.</p>
<div class="f"><span class="lbl">FRN price vs margins</span>DM &gt; QM → price &lt; par &nbsp;·&nbsp; DM &lt; QM → price &gt; par</div>
<div class="dir"><div>Issuer credit worsens → DM <span class="up">↑</span> → FRN price <span class="dn">↓</span></div><div>Same instrument: discount rate &lt; add-on (360) &lt; BEY (365)</div></div>
<div class="calc" data-calc="mm"></div>`,
example:`<div class="q">(a) A 90-day T-bill (face 100) is quoted at a 4.00% discount rate (360-day). Find its price, add-on yield (360) and bond-equivalent yield. (b) An FRN pays MRR + 1.20%; investors now require MRR + 1.60%. Premium or discount? (c) A 180-day CD has a 4.2% add-on rate (365). Is it a better investment than the T-bill?</div>
<ol class="steps"><li><strong>Price</strong> = 100 × (1 − 90/360 × 0.04) = <strong>99.00</strong>.</li>
<li><strong>Add-on (360)</strong> = (360/90) × (1/99) = <strong>4.040%</strong>. <strong>BEY</strong> = (365/90) × (1/99) = <strong>4.097%</strong>.</li>
<li><strong>FRN:</strong> DM 1.60% &gt; QM 1.20% → coupons too small for the risk → <strong>discount</strong> to par.</li>
<li><strong>Comparison:</strong> CD's 4.20% (add-on, 365) vs T-bill's 4.097% BEY: the CD yields more, though maturity, credit risk and liquidity differ (T-bill is risk-free and liquid).</li></ol>
<p class="ans">Answers: 99.00 · 4.040% / 4.097% · discount · CD 4.20% &gt; 4.097% (but compare risk and term)</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Comparing a discount-basis yield with an add-on yield directly. <b>Fix:</b> convert both to BEY (add-on, 365).</li>
<li><b>Trap:</b> FRNs have no risk. <b>Fix:</b> little rate risk, but credit spread risk remains.</li>
<li><b>Trap:</b> QM changes with credit. <b>Fix:</b> QM is fixed; DM changes.</li>
<li><b>Trap:</b> Using PV in the discount-rate denominator. <b>Fix:</b> discount rate uses FV; add-on uses PV.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> FRN premium/discount from QM vs DM; price/yield of money market instruments; convert discount to add-on/BEY; rank yields.</li>
<li><strong>Shortcut:</strong> for the same instrument, DR &lt; AOR(360) &lt; AOR(365).</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Floater floats near par</b>Only credit changes push it away.</div>
<div class="anchor"><b>Quoted = contract, Discount = market</b>DM above QM → below par.</div>
<div class="anchor"><b>Discount basis divides by Face</b>So it understates return.</div>
<div class="anchor"><b>BEY = add-on, 365</b>The common yardstick.</div></div>`,
summary:`Floating-rate notes pay MRR plus a fixed quoted margin; the discount (required) margin is the spread investors currently demand for credit and liquidity risk. At issuance the two are usually equal and the FRN is priced at par; if credit deteriorates and the discount margin exceeds the quoted margin the FRN trades below par, and if credit improves it trades above par. Money market instruments are quoted on a discount basis (PV = FV(1 − days/year × DR), using face value as denominator) or an add-on basis (PV = FV/(1 + days/year × AOR), using price), with 360- or 365-day years; the bond-equivalent yield is an add-on rate on a 365-day year and is used to compare instruments. For the same instrument, the discount rate is lower than the add-on rate, and a 360-day rate is lower than its 365-day equivalent.`
},
quiz:[
{q:"An FRN's quoted margin is 80 bp and the market's required margin is 60 bp. The FRN trades:",o:["at a premium","at par","at a discount"],a:0,e:"Quoted margin above required margin → coupons generous → above par."},
{q:"A 180-day instrument priced at 98 per 100 face has a discount rate (360-day basis) of:",o:["4.00%","4.08%","4.14%"],a:0,e:"DR = (360/180) × (2/100) = 4.00%."},
{q:"Which yield measure is computed as an add-on rate based on a 365-day year?",o:["Discount rate","Bond-equivalent yield","Current yield"],a:1,e:"BEY is the add-on, 365-day measure."}]
});
