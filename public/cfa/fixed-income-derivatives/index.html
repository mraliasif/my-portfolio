<script>
(function(){
const TOPICS={fi:{name:"Fixed Income",short:"Fixed Income",color:"var(--quant)",blurb:"Bond features and markets, pricing and yields, spot/par/forward curves, duration and convexity, credit analysis, securitization, ABS and MBS."},
der:{name:"Derivatives",short:"Derivatives",color:"var(--cf)",blurb:"Forwards, futures, swaps and options; uses and risks; arbitrage and cost of carry; pricing and valuation; put-call parity and the binomial model."}};
const SECS=[["eli5","Ultra-Simple (ELI5)"],["core","Intuitive Core Idea"],["formal","Formal CFA-Level"],["math","Mathematics Made Intuitive"],["example","Worked Example"],["traps","Common Mistakes & Traps"],["exam","Thinking in the Exam"],["anchors","Memory Anchors"],["summary","One-Paragraph Summary"],["quiz","Quick Quiz"]];
const R=window.READINGS.sort((a,b)=>a.n-b.n);
const store={get(k,d){try{const v=localStorage.getItem("cfa1fid:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("cfa1fid:"+k,JSON.stringify(v))}catch(e){}}};
let done=store.get("done",{});
let state={r:null,s:"eli5",all:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=h=>h.replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ").replace(/\s+/g," ");

/* theme */
const th=store.get("theme",null); if(th) document.documentElement.setAttribute("data-theme",th);
$("#theme").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const nx=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);store.set("theme",nx)};

function nav(filter){
  const f=(filter||"").trim().toLowerCase();
  let h="";
  for(const t of Object.keys(TOPICS)){
    const rs=R.filter(r=>r.topic===t);
    const dn=rs.filter(r=>done[r.n]).length;
    let items="";
    for(const r of rs){
      let snip="";
      if(f){
        if(!r.title.toLowerCase().includes(f)&&!String(r.n).startsWith(f)){
          const txt=r._txt||(r._txt=strip(Object.values(r.s).join(" ")));
          const i=txt.toLowerCase().indexOf(f);
          if(i<0) continue;
          snip=`<span class="hit">…${esc(txt.slice(Math.max(0,i-30),i+50))}…</span>`;
        }
      }
      items+=`<button class="rlink${state.r===r.n?" on":""}${done[r.n]?" done":""}" data-r="${r.n}" style="--tc:${TOPICS[t].color}"><span class="n">${r.n}</span><span>${esc(r.title)}${snip}</span><span class="ok">✓</span></button>`;
    }
    if(!items&&f) continue;
    h+=`<div class="topic" style="--tc:${TOPICS[t].color}"><div class="topic-h">${TOPICS[t].name}<span>${dn}/${rs.length}</span></div>${items||""}</div>`;
  }
  $("#nav").innerHTML=h||`<div class="overall">No matches.</div>`;
  const tot=Object.keys(done).filter(k=>done[k]).length;
  $("#ovtxt").textContent=`${tot} of ${R.length} readings marked done`;
  $("#ovbar").style.width=(100*tot/R.length)+"%";
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest(".rlink");if(b){go(+b.dataset.r,"eli5");document.body.classList.remove("nav")}});
$("#q").addEventListener("input",e=>nav(e.target.value));
$("#scrim").onclick=()=>document.body.classList.remove("nav");

function home(){
  state.r=null;
  const counts=k=>R.filter(r=>r.topic===k);
  let cards="";
  for(const k of Object.keys(TOPICS)){const rs=counts(k);if(!rs.length)continue;const dn=rs.filter(r=>done[r.n]).length;
    cards+=`<button class="tcard" data-r="${rs[0].n}" style="--tc:${TOPICS[k].color}"><h3>${TOPICS[k].name}</h3><p>${TOPICS[k].blurb}</p><div style="font-size:13px;color:var(--ink3)">Readings ${rs[0].n}–${rs[rs.length-1].n} · ${dn}/${rs.length} done</div><div class="bar"><i style="width:${100*dn/rs.length}%;background:var(--tc)"></i></div></button>`}
  $("#main").innerHTML=`<div class="topbar"><button class="iconbtn" id="burger" aria-label="Menu">☰</button><span class="t">CFA L1 · FI &amp; Derivatives</span></div>
  <div class="home" style="padding-top:26px"><div class="kicker" style="--tc:var(--accent)">SchweserNotes 2027 · Fixed Income &amp; Derivatives</div><h2>Learn every reading three times over: simply, intuitively, then exam-precise.</h2>
  <p class="lead">29 readings, each taught in the same nine layers, plus a quick quiz. Pick a topic to start, or jump in from the sidebar. Calculators inside the maths sections let you move the inputs and watch the answer change.</p>
  <div class="cards">${cards}</div>
  <div class="legend">${SECS.map((s,i)=>`<div><b>${i+1}.</b> ${s[1]}</div>`).join("")}</div>
  <p class="hint">Keys: <kbd>←</kbd> <kbd>→</kbd> move between sections · <kbd>[</kbd> <kbd>]</kbd> previous/next reading · <kbd>/</kbd> search</p></div>`;
  $("#main").querySelectorAll(".tcard").forEach(b=>b.onclick=()=>go(+b.dataset.r,"eli5"));
  $("#burger").onclick=()=>document.body.classList.add("nav");
  nav($("#q").value);
}

function secHTML(r,key,label,i){
  if(key==="quiz") return `<section class="sec" id="s-quiz"><h3>${i+1}. ${label}</h3>${quizHTML(r)}</section>`;
  const body=r.s[key]||"<p><em>—</em></p>";
  const cls=key==="summary"?"prose summary":"prose";
  return `<section class="sec" id="s-${key}"><h3>${i+1}. ${label}</h3><div class="${cls}">${body}</div></section>`;
}
function quizHTML(r){
  if(!r.quiz||!r.quiz.length) return "<p>No quiz.</p>";
  return `<div class="quiz"><p class="score" data-score>Answer each question; feedback is instant.</p>${r.quiz.map((q,qi)=>`<div class="qq" data-qi="${qi}"><p class="stem">${qi+1}. ${q.q}</p>${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join("")}<div class="expl">${q.e}</div></div>`).join("")}</div>`;
}
function wireQuiz(r){
  const root=$("#main");
  root.querySelectorAll(".qq").forEach(div=>{
    div.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const q=r.quiz[+div.dataset.qi];const pick=+b.dataset.oi;
      div.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(i===q.a)x.classList.add("right")});
      if(pick!==q.a)b.classList.add("wrong");
      div.classList.add("answered");div.dataset.ok=pick===q.a?"1":"0";
      const all=root.querySelectorAll(".qq"),ans=root.querySelectorAll(".qq.answered");
      const ok=[...ans].filter(x=>x.dataset.ok==="1").length;
      const sc=root.querySelector("[data-score]");
      if(sc) sc.textContent=ans.length===all.length?`Score: ${ok}/${all.length}${ok===all.length?" — perfect.":" — re-read the explanations for the misses."}`:`${ok}/${ans.length} correct so far`;
    });
  });
}

function go(n,sec,noscroll){
  const r=R.find(x=>x.n===n); if(!r) return home();
  state.r=n; state.s=sec||state.s||"eli5";
  const t=TOPICS[r.topic]; const idx=R.indexOf(r); const prev=R[idx-1],next=R[idx+1];
  document.documentElement.style.setProperty("--tc",t.color);
  const tabs=SECS.map((s,i)=>`<button class="tab${!state.all&&state.s===s[0]?" on":""}" data-s="${s[0]}"><b>${i+1}</b>${s[1]}</button>`).join("");
  const body=state.all?SECS.map((s,i)=>secHTML(r,s[0],s[1],i)).join(""):(()=>{const i=SECS.findIndex(s=>s[0]===state.s);return secHTML(r,SECS[i][0],SECS[i][1],i)})();
  const si=SECS.findIndex(s=>s[0]===state.s);
  const secPager=state.all?"":`<div class="pager">${si>0?`<button class="btn" data-sp="${SECS[si-1][0]}">← ${SECS[si-1][1]}</button>`:"<span></span>"}${si<SECS.length-1?`<button class="btn primary" data-sp="${SECS[si+1][0]}">${SECS[si+1][1]} →</button>`:(next?`<button class="btn primary" data-go="${next.n}">Next: R${next.n} ${esc(next.title)} →</button>`:"<span></span>")}</div>`;
  $("#main").innerHTML=`<div class="topbar"><button class="iconbtn" id="burger" aria-label="Menu">☰</button><span class="t">R${r.n} · ${esc(r.title)}</span></div>
  <header class="rhead" style="--tc:${t.color}"><div class="kicker"><a href="#" id="homelink" style="color:inherit;text-decoration:none">Home</a> · ${t.name} · Reading ${r.n}</div><h2>${esc(r.title)}</h2>
  <details class="los"><summary>Learning outcomes (LOS)</summary><ul>${r.los.map(l=>`<li>${l}</li>`).join("")}</ul></details>
  <div class="actions"><button class="btn${done[r.n]?" on":""}" id="markdone">${done[r.n]?"✓ Marked done":"Mark reading done"}</button><button class="btn" id="toggleall">${state.all?"Show one section at a time":"Show all sections on one page"}</button></div></header>
  <div class="tabs" id="tabs">${tabs}</div>
  <div id="body">${body}</div>${secPager}
  <div class="pager">${prev?`<button class="btn" data-go="${prev.n}">← R${prev.n} ${esc(prev.title)}</button>`:"<span></span>"}${next?`<button class="btn" data-go="${next.n}">R${next.n} ${esc(next.title)} →</button>`:"<span></span>"}</div>`;
  $("#burger").onclick=()=>document.body.classList.add("nav");
  $("#homelink").onclick=e=>{e.preventDefault();home();window.scrollTo(0,0)};
  $("#markdone").onclick=()=>{done[r.n]=!done[r.n];store.set("done",done);go(n,state.s,true)};
  $("#toggleall").onclick=()=>{state.all=!state.all;go(n,state.s,true)};
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    if(state.all){const el=document.getElementById("s-"+b.dataset.s);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-70,behavior:"smooth"});return}
    go(n,b.dataset.s)});
  $("#main").querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>go(n,b.dataset.sp));
  $("#main").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go,"eli5"));
  const on=$("#tabs .tab.on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
  renderCalcs(); wireQuiz(r);
  store.set("last",{r:n,s:state.s});
  if(!noscroll){const tb=$("#tabs");const y=tb.getBoundingClientRect().top+scrollY-(innerWidth<=860?55:0);if(scrollY>y)window.scrollTo(0,y)}
  nav($("#q").value);
}

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){e.preventDefault();$("#q").focus();return}
  if(state.r==null)return;
  const si=SECS.findIndex(s=>s[0]===state.s);const idx=R.findIndex(x=>x.n===state.r);
  if(e.key==="ArrowRight"&&!state.all&&si<SECS.length-1)go(state.r,SECS[si+1][0]);
  if(e.key==="ArrowLeft"&&!state.all&&si>0)go(state.r,SECS[si-1][0]);
  if(e.key==="]"&&R[idx+1])go(R[idx+1].n,"eli5");
  if(e.key==="["&&R[idx-1])go(R[idx-1].n,"eli5");
});

/* ---------- calculators ---------- */
const fmt=(x,d=2)=>isFinite(x)?Number(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const pct=(x,d=2)=>isFinite(x)?fmt(100*x,d)+"%":"—";
function irr(cfs){let lo=-0.99,hi=10;const npv=r=>cfs.reduce((s,c,t)=>s+c/Math.pow(1+r,t),0);let flo=npv(lo),fhi=npv(hi);if(flo*fhi>0)return NaN;for(let i=0;i<200;i++){const m=(lo+hi)/2,fm=npv(m);if(flo*fm<=0){hi=m;fhi=fm}else{lo=m;flo=fm}}return (lo+hi)/2}
function pvBond(c,y,n,m,fv){const r=y/m,N=Math.round(n*m),C=fv*c/m;return r===0?C*N+fv:C*(1-Math.pow(1+r,-N))/r+fv*Math.pow(1+r,-N)}
function bondStats(c,y,n,m){const r=y/m,N=Math.round(n*m),C=100*c/m;let P=0,mac=0,cv=0;for(let t=1;t<=N;t++){const cf=C+(t===N?100:0);const pv=cf/Math.pow(1+r,t);P+=pv;mac+=t*pv;cv+=t*(t+1)*cf/Math.pow(1+r,t+2)}mac=mac/P/m;const mod=mac/(1+r);const conv=cv/P/(m*m);return{P,mac,mod,conv}}
const CALCS={
 bond:{t:"Bond price from YTM",i:[["fv","Face value",100],["c","Coupon rate %",6],["y","YTM % (annual, stated)",8],["n","Years to maturity",5],["m","Payments per year",2]],
  f:v=>{const P=pvBond(v.c/100,v.y/100,v.n,v.m,v.fv);return `Periodic coupon = ${fmt(v.fv*v.c/100/v.m,3)} · periodic yield = ${pct(v.y/100/v.m,3)} · periods = ${Math.round(v.n*v.m)}<br>Price = <b>${fmt(P,4)}</b> → ${P<v.fv-1e-6?"<b>discount</b> (coupon &lt; YTM)":P>v.fv+1e-6?"<b>premium</b> (coupon &gt; YTM)":"<b>par</b> (coupon = YTM)"}<br>Current yield = annual coupon / price = <b>${pct(v.fv*v.c/100/P,3)}</b>`}},
 ai:{t:"Full price, accrued interest & flat price (between coupons)",i:[["c","Coupon rate %",5],["y","YTM % (annual, stated)",6],["n","Years remaining as of LAST coupon date",3],["m","Payments per year",2],["t","Days since last coupon",60],["T","Days in coupon period",180]],
  f:v=>{const r=v.y/100/v.m;const pv0=pvBond(v.c/100,v.y/100,v.n,v.m,100);const full=pv0*Math.pow(1+r,v.t/v.T);const ai=100*v.c/100/v.m*v.t/v.T;return `PV at last coupon date = ${fmt(pv0,4)}<br>Full (dirty) price = PV × (1 + r)<sup>t/T</sup> = ${fmt(pv0,4)} × (1 + ${pct(r,3)})<sup>${v.t}/${v.T}</sup> = <b>${fmt(full,4)}</b><br>Accrued interest = coupon × t/T = ${fmt(100*v.c/100/v.m,3)} × ${v.t}/${v.T} = <b>${fmt(ai,4)}</b><br>Flat (clean, quoted) price = full − AI = <b>${fmt(full-ai,4)}</b>`}},
 ytm:{t:"Yield to maturity from price",i:[["p","Price (per 100)",95],["c","Coupon rate %",5],["n","Years to maturity",4],["m","Payments per year",2]],
  f:v=>{let lo=-0.9,hi=2;for(let i=0;i<200;i++){const mid=(lo+hi)/2;if(pvBond(v.c/100,mid,v.n,v.m,100)>v.p)lo=mid;else hi=mid}const y=(lo+hi)/2;const eff=Math.pow(1+y/v.m,v.m)-1;return `YTM (stated, ×${v.m}) = <b>${pct(y,3)}</b> · periodic yield ${pct(y/v.m,3)}<br>Effective annual yield = (1 + ${pct(y/v.m,3)})<sup>${v.m}</sup> − 1 = <b>${pct(eff,3)}</b><br>Current yield = ${pct(v.c/v.p,3)} · Simple yield = (coupon + (100 − P)/years)/P = ${pct((+v.c+(100-v.p)/v.n)/v.p,3)}`}},
 period:{t:"Convert a yield between compounding frequencies",i:[["y","Stated annual yield %",6],["m1","Compounding periods per year (from)",2],["m2","Compounding periods per year (to)",4]],
  f:v=>{const eff=Math.pow(1+v.y/100/v.m1,v.m1)-1;const y2=v.m2*(Math.pow(1+eff,1/v.m2)-1);return `Effective annual = (1 + ${fmt(v.y/v.m1,4)}%)<sup>${v.m1}</sup> − 1 = <b>${pct(eff,4)}</b><br>Equivalent stated rate with ${v.m2} periods/yr = <b>${pct(y2,4)}</b> (more frequent compounding → lower stated rate for the same return)`}},
 mm:{t:"Money market yields: discount vs add-on, 360 vs 365",i:[["fv","Face value",100],["d","Days to maturity",90],["dr","Discount rate % (360-day)",4]],
  f:v=>{const pv=v.fv*(1-v.d/360*v.dr/100);const aor360=(360/v.d)*(v.fv-pv)/pv;const bey=(365/v.d)*(v.fv-pv)/pv;const hpr=v.fv/pv-1;const eff=Math.pow(1+hpr,365/v.d)-1;return `Price = FV × (1 − days/360 × DR) = <b>${fmt(pv,4)}</b><br>Add-on rate (360) = (360/days) × (FV − PV)/PV = <b>${pct(aor360,4)}</b><br>Bond-equivalent yield (add-on, 365) = <b>${pct(bey,4)}</b> · Effective annual = ${pct(eff,4)}<br>Discount rate understates return: it uses FV (not PV) in the denominator and 360 days.`}},
 curve:{t:"Spot curve → bond price, par rates and 1-year forward rates",i:[["s","Annual spot rates % (years 1, 2, 3, ...)",'3,4,5',"text"],["c","Coupon rate % for the bond to price (annual pay)",6]],
  f:v=>{const s=String(v.s).split(/[,\s]+/).filter(Boolean).map(x=>+x/100);if(s.some(isNaN)||!s.length)return"Enter rates.";const df=s.map((r,i)=>Math.pow(1+r,-(i+1)));let P=0;df.forEach((d,i)=>P+=v.c*d+(i===s.length-1?100*d:0));const par=s.map((_,i)=>{const sum=df.slice(0,i+1).reduce((a,b)=>a+b,0);return (1-df[i])/sum});const fw=s.map((r,i)=>i===0?r:Math.pow(1+r,i+1)/Math.pow(1+s[i-1],i)-1);return `Discount factors: ${df.map(d=>fmt(d,4)).join(", ")}<br>Price of ${v.c}% ${s.length}-yr annual bond = <b>${fmt(P,4)}</b><br>Par rates: ${par.map((p,i)=>`${i+1}y <b>${pct(p,3)}</b>`).join(" · ")}<br>1-yr forwards: ${fw.map((f,i)=>`${i}y1y <b>${pct(f,3)}</b>`).join(" · ")}`}},
 dur:{t:"Duration, convexity & price change",i:[["c","Coupon rate %",5],["y","YTM %",6],["n","Years to maturity",10],["m","Payments per year",1],["dy","Yield change (bp)",100]],
  f:v=>{const s=bondStats(v.c/100,v.y/100,v.n,v.m);const dy=v.dy/10000;const lin=-s.mod*dy;const full=lin+0.5*s.conv*dy*dy;const actual=pvBond(v.c/100,v.y/100+dy,v.n,v.m,100)/s.P-1;return `Price = ${fmt(s.P,4)} · Macaulay duration = <b>${fmt(s.mac,3)}</b> yrs · Modified duration = <b>${fmt(s.mod,3)}</b> · Convexity = <b>${fmt(s.conv,2)}</b><br>PVBP (per 100) ≈ ModDur × P × 0.0001 = <b>${fmt(s.mod*s.P*0.0001,4)}</b><br>For Δy = ${v.dy} bp: duration only ${pct(lin,3)} · duration + convexity <b>${pct(full,3)}</b> · actual ${pct(actual,3)}`}},
 approx:{t:"Approximate (or effective) duration & convexity from three prices",i:[["v0","Current price V₀",100],["vm","Price if yield/curve falls (V₋)",102.5],["vp","Price if yield/curve rises (V₊)",97.6],["dy","Change Δ (bp)",50]],
  f:v=>{const d=v.dy/10000;const D=(v.vm-v.vp)/(2*v.v0*d);const C=(+v.vm+ +v.vp-2*v.v0)/(d*d*v.v0);return `Duration ≈ (V₋ − V₊)/(2 × V₀ × Δ) = <b>${fmt(D,3)}</b><br>Convexity ≈ (V₋ + V₊ − 2V₀)/(Δ² × V₀) = <b>${fmt(C,2)}</b> ${C<0?"(<b>negative</b>: typical of callable bonds/MBS at low yields)":""}`}},
 credit:{t:"Expected loss & credit spread",i:[["pd","Probability of default %",2],["rr","Recovery rate %",40],["exp","Exposure at default",1000],["md","Modified (spread) duration",6],["ds","Spread change (bp)",50]],
  f:v=>{const lgd=1-v.rr/100;const el=v.pd/100*lgd;return `Loss severity (LGD %) = 1 − recovery = <b>${pct(lgd,1)}</b> · LGD amount = ${fmt(v.exp*lgd)}<br>Expected loss = PD × LGD = <b>${pct(el,3)}</b> (= ${fmt(el*v.exp)} on ${fmt(v.exp,0)}) → credit spread ≈ <b>${fmt(el*10000,0)} bp</b><br>Price impact of a ${v.ds} bp spread change ≈ −${v.md} × ${v.ds/100}% = <b>${pct(-v.md*v.ds/10000,2)}</b>`}},
 opt:{t:"Option payoff & profit at expiration",i:[["typ","Type: 1 = call, 0 = put",1],["pos","Position: 1 = long, 0 = short",1],["x","Exercise price X",50],["prem","Premium",3],["s","Underlying price at expiration Sₜ",56]],
  f:v=>{const call=+v.typ===1,long=+v.pos===1;const pay=call?Math.max(0,v.s-v.x):Math.max(0,v.x-v.s);const sign=long?1:-1;const profit=sign*(pay-v.prem);const be=call?+v.x+ +v.prem:v.x-v.prem;const money=call?(v.s>v.x?"in the money":v.s<v.x?"out of the money":"at the money"):(v.s<v.x?"in the money":v.s>v.x?"out of the money":"at the money");return `${long?"Long":"Short"} ${call?"call":"put"} · option is <b>${money}</b> at Sₜ = ${v.s}<br>Payoff (value at expiration) = ${call?"max(0, Sₜ − X)":"max(0, X − Sₜ)"} = ${fmt(pay)} → to this position <b>${fmt(sign*pay)}</b><br>Profit = <b>${fmt(profit)}</b> · Breakeven Sₜ = <b>${fmt(be)}</b><br>${long?`Max loss = premium ${fmt(+v.prem)} · Max gain = ${call?"unlimited":fmt(v.x-v.prem)}`:`Max gain = premium ${fmt(+v.prem)} · Max loss = ${call?"unlimited":fmt(v.x-v.prem)}`}`}},
 fwd:{t:"Forward price & value (cost of carry)",i:[["s0","Spot S₀",100],["r","Risk-free rate % (annual)",5],["T","Contract term T (years)",1],["pvc","PV of carrying costs",0],["pvb","PV of benefits (income, convenience)",2],["t","Time elapsed t (years)",0.5],["st","Spot at time t, Sₜ",104]],
  f:v=>{const F=(v.s0+ +v.pvc-v.pvb)*Math.pow(1+v.r/100,v.T);const rem=v.T-v.t;const val=v.st-F/Math.pow(1+v.r/100,rem);return `F₀(T) = (S₀ + PV costs − PV benefits)(1 + r)<sup>T</sup> = <b>${fmt(F,4)}</b><br>Value at initiation = 0<br>Value to long at t (ignoring remaining benefits) = Sₜ − F₀/(1 + r)<sup>T−t</sup> = ${v.st} − ${fmt(F/Math.pow(1+v.r/100,rem),4)} = <b>${fmt(val,4)}</b> (short = ${fmt(-val,4)})<br>At expiration: value to long = S<sub>T</sub> − F₀`}},
 swap:{t:"Par swap rate from spot rates",i:[["s","Annual spot rates % (years 1..N)",'3,3.5,4',"text"],["nf","Notional",10000000],["fx","Fixed rate in an existing swap % (for value)",3.2]],
  f:v=>{const s=String(v.s).split(/[,\s]+/).filter(Boolean).map(x=>+x/100);if(s.some(isNaN)||!s.length)return"Enter rates.";const df=s.map((r,i)=>Math.pow(1+r,-(i+1)));const sum=df.reduce((a,b)=>a+b,0);const sr=(1-df[df.length-1])/sum;const val=(sr-v.fx/100)*sum*v.nf;return `Discount factors: ${df.map(d=>fmt(d,4)).join(", ")} (sum ${fmt(sum,4)})<br>Par swap rate = (1 − DF<sub>N</sub>) / ΣDF = <b>${pct(sr,4)}</b><br>Value to the <b>fixed-rate payer</b> of a swap paying ${v.fx}% on ${fmt(v.nf,0)} = (par rate − fixed) × ΣDF × notional = <b>${fmt(val,0)}</b> ${val>0?"(gain: rates rose above the contract rate)":val<0?"(loss)":""}`}},
 pcp:{t:"Put-call parity (European)",i:[["s","Stock price S₀",50],["x","Exercise price X",50],["r","Risk-free rate % (annual)",5],["T","Years to expiration",1],["c","Call price c₀",6]],
  f:v=>{const pvx=v.x/Math.pow(1+v.r/100,v.T);const p=v.c-v.s+pvx;return `PV(X) = ${v.x}/(1 + ${v.r}%)<sup>${v.T}</sup> = ${fmt(pvx,4)}<br>Fiduciary call c + PV(X) = <b>${fmt(+v.c+pvx,4)}</b> must equal protective put S + p<br>Implied put p₀ = c − S + PV(X) = <b>${fmt(p,4)}</b>${p<0?" (negative: inputs violate no-arbitrage)":""}<br>Synthetic stock = c − p + PV(X) · Synthetic bond = S + p − c`}},
 binom:{t:"One-period binomial option model",i:[["s","Spot S₀",50],["u","Up factor u",1.2],["d","Down factor d",0.8],["x","Exercise price X",50],["r","Risk-free rate % (per period)",5]],
  f:v=>{const su=v.s*v.u,sd=v.s*v.d;const cu=Math.max(0,su-v.x),cd=Math.max(0,sd-v.x),pu=Math.max(0,v.x-su),pdn=Math.max(0,v.x-sd);const R=1+v.r/100;const pi=(R-v.d)/(v.u-v.d);const c=(pi*cu+(1-pi)*cd)/R,p=(pi*pu+(1-pi)*pdn)/R;const h=(cu-cd)/(su-sd);return `S⁺ = ${fmt(su)}, S⁻ = ${fmt(sd)} · call payoffs ${fmt(cu)}/${fmt(cd)} · put payoffs ${fmt(pu)}/${fmt(pdn)}<br>Risk-neutral π<sub>up</sub> = (1 + r − d)/(u − d) = <b>${fmt(pi,4)}</b>${pi<0||pi>1?" (invalid: arbitrage)":""}<br>Call = [π c⁺ + (1 − π) c⁻]/(1 + r) = <b>${fmt(c,4)}</b> · Put = <b>${fmt(p,4)}</b><br>Hedge ratio (shares per call) = (c⁺ − c⁻)/(S⁺ − S⁻) = <b>${fmt(h,4)}</b> · Check parity: c − p = ${fmt(c-p,4)} = S − PV(X) = ${fmt(v.s-v.x/R,4)}`}},
 impfwd:{t:"Implied forward rate (e.g., 2y3y)",i:[["s1","Spot rate, shorter (A years) %",3],["a","A (years)",2],["s2","Spot rate, longer (B years) %",4],["b","B (years)",5]],
  f:v=>{if(v.b<=v.a)return"B must exceed A.";const f=Math.pow(Math.pow(1+v.s2/100,v.b)/Math.pow(1+v.s1/100,v.a),1/(v.b-v.a))-1;return `(1 + S<sub>B</sub>)<sup>B</sup> = (1 + S<sub>A</sub>)<sup>A</sup>(1 + F)<sup>B−A</sup><br>Forward rate "${v.a}y${v.b-v.a}y" = <b>${pct(f,4)}</b> (approx. ${fmt((v.s2*v.b-v.s1*v.a)/(v.b-v.a),3)}%)`}}
};

function renderCalcs(){
  document.querySelectorAll(".calc[data-calc]").forEach(el=>{
    const c=CALCS[el.dataset.calc]; if(!c||el.dataset.ready) return; el.dataset.ready=1;
    el.innerHTML=`<h5>${c.t}</h5><div class="cgrid">${c.i.map(([k,l,d,ty])=>ty==="range"?`<label class="wide">${l}: <span data-rv="${k}">${d}</span><input type="range" min="-1" max="1" step="0.05" data-k="${k}" value="${d}"></label>`:`<label${ty==="text"?' class="wide"':""}>${l}<input ${ty==="text"?'type="text"':'type="number" step="any"'} data-k="${k}" value="${d}"></label>`).join("")}</div><div class="cout"></div>`;
    const run=()=>{const v={};el.querySelectorAll("input").forEach(i=>{v[i.dataset.k]=i.type==="text"?i.value:parseFloat(i.value);const rv=el.querySelector(`[data-rv="${i.dataset.k}"]`);if(rv)rv.textContent=(+i.value).toFixed(2)});let out;try{out=c.f(v)}catch(e){out="Check inputs."}el.querySelector(".cout").innerHTML=out};
    el.querySelectorAll("input").forEach(i=>i.addEventListener("input",run)); run();
  });
}


/* ---- site routing: every reading/section has its own URL (#r12-math), back/forward work ---- */
const _go=go,_home=home;let _boot=true,_pop=false;const _SK=SECS.map(s=>s[0]);
function _sync(h){if(_pop)return;const cur=location.hash||"";if(cur===(h||""))return;const url=h||(location.pathname+location.search);try{_boot?history.replaceState(null,"",url):history.pushState(null,"",url)}catch(e){}}
go=function(n,sec,noscroll){_go(n,sec,noscroll);if(state.r===n){_sync("#r"+n+(state.all?"":"-"+state.s));store.set("last",{r:n,s:state.s,t:Date.now()})}};
home=function(){_home();_sync("")};
function _route(ns){const h=decodeURIComponent(location.hash.slice(1));let m=h.match(/^r(\d+)(?:-(\w+))?$/);
  if(m&&R.find(x=>x.n===+m[1])){go(+m[1],_SK.includes(m[2])?m[2]:"eli5",ns);return true}
  m=h.match(/^topic-(\w+)$/);if(m){const r=R.find(x=>x.topic===m[1]);if(r){go(r.n,"eli5",ns);return true}}
  if(h==="home"){home();return true}return false}
window.addEventListener("popstate",()=>{_pop=true;if(!_route(false))_home();_pop=false;window.scrollTo(0,0)});
if(location.protocol==="file:")document.querySelectorAll("a.allbooks").forEach(a=>a.setAttribute("href","../index.html"));
const last=store.get("last",null);
if(!_route(true)){if(last&&R.find(x=>x.n===last.r)) go(last.r,last.s,true); else home();}
_boot=false;
})();
</script>
