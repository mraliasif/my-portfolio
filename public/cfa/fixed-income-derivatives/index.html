add({n:59,topic:"fi",title:"The Term Structure of Interest Rates: Spot, Par, and Forward Curves",
los:["59.a Define spot rates and the spot curve, and calculate the price of a bond using spot rates.","59.b Define par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using forward rates.","59.c Compare the spot curve, par curve, and forward curve."],
s:{
eli5:`<p>Money due in 1 year and money due in 3 years shouldn't be discounted at the same rate, because markets charge different rates for different waiting times. A <strong>spot rate</strong> is the rate for one single payment at one specific future date.</p>
<p>A <strong>forward rate</strong> is a rate you can lock in today for borrowing later, like booking a hotel room for next year at today's agreed price. If 1-year money costs 3% and 2-year money costs 4% a year, then the market is implying that next year's 1-year rate is about 5%, because doing 3% then 5% gets you to the same place as 4% twice.</p>
<p>A <strong>par rate</strong> is the coupon a bond would need to sell at exactly 100 today.</p>`,
core:`<p><strong>What problem is this solving?</strong> Using a single YTM to discount all of a bond's cash flows ignores that rates differ by maturity. Spot rates price each cash flow correctly and allow arbitrage-free valuation; forward rates reveal the market's implied future borrowing rates; par rates connect the curve to real coupon bonds.</p>
<ul><li><strong>No-arbitrage pricing:</strong> a coupon bond is a bundle of zero-coupon bonds, each discounted at its own spot rate. If the bond's price differed, you could strip or rebuild it for riskless profit.</li>
<li><strong>Spot rates are geometric averages of forward rates:</strong> (1 + S<sub>N</sub>)<sup>N</sup> = (1 + F₁)(1 + F₂)…(1 + F<sub>N</sub>). So if spot rates rise with maturity, the forward rates must be even higher (to pull the average up).</li>
<li><strong>Par rates are a weighted average of spot rates</strong> (weights from the coupon cash flows), so they sit closest to the short end: in an upward-sloping curve, par &lt; spot &lt; forward; inverted: forward &lt; spot &lt; par; flat: all equal.</li></ul>`,
formal:`<h4>Spot rates and the spot curve</h4>
<p>Spot rate S<sub>t</sub>: yield on a zero-coupon instrument maturing at t; the spot curve (zero curve) plots S<sub>t</sub> vs maturity, derived from zero-coupon bonds or stripped Treasuries. Price = Σ CF<sub>t</sub>/(1 + S<sub>t</sub>)<sup>t</sup> (no-arbitrage price). The bond's YTM is a weighted average of the spot rates.</p>
<h4>Par rates</h4>
<p>Par rate for maturity N: coupon rate that makes a bond's price equal par given spot rates: 1 = c × Σ DF<sub>t</sub> + DF<sub>N</sub>, so c = (1 − DF<sub>N</sub>)/Σ DF<sub>t</sub>. The par curve plots par yields vs maturity.</p>
<h4>Forward rates</h4>
<ul><li>Forward rate: rate for a loan starting in the future, agreed today. Notation "AyBy" = B-year rate starting A years from now (e.g., 1y1y, 2y3y).</li>
<li>(1 + S<sub>A+B</sub>)<sup>A+B</sup> = (1 + S<sub>A</sub>)<sup>A</sup>(1 + AyBy)<sup>B</sup>.</li>
<li>Spot from forwards: (1 + S<sub>N</sub>)<sup>N</sup> = (1 + S₁)(1 + 1y1y)(1 + 2y1y)…</li>
<li>Pricing with forwards: discount each cash flow by the product of (1 + forward) factors up to its date.</li></ul>
<h4>Comparing curves</h4>
<ul><li>Upward sloping: forward &gt; spot &gt; par.</li>
<li>Downward sloping: forward &lt; spot &lt; par.</li>
<li>Flat: forward = spot = par.</li></ul>`,
math:`<div class="f"><span class="lbl">Price with spot rates</span>P = C/(1 + S₁) + C/(1 + S₂)² + … + (C + FV)/(1 + S<sub>N</sub>)<sup>N</sup></div>
<div class="f"><span class="lbl">Forward from spot</span>(1 + S<sub>A+B</sub>)<sup>A+B</sup> = (1 + S<sub>A</sub>)<sup>A</sup> × (1 + F<sub>AyBy</sub>)<sup>B</sup></div>
<p><strong>Why:</strong> two ways to invest for A + B years (all at once, or A years then roll at the forward) must give the same result, or there's arbitrage.</p>
<div class="f"><span class="lbl">Par rate</span>Par<sub>N</sub> = (1 − DF<sub>N</sub>) / (DF₁ + DF₂ + … + DF<sub>N</sub>), DF<sub>t</sub> = 1/(1 + S<sub>t</sub>)<sup>t</sup></div>
<div class="f"><span class="lbl">Approximation</span>F<sub>AyBy</sub> ≈ [(A + B)S<sub>A+B</sub> − A × S<sub>A</sub>] / B</div>
<div class="dir"><div>Upward-sloping spot curve → forwards above spots → par below spots</div><div>Spot rates <span class="up">↑</span> → discount factors <span class="dn">↓</span> → bond price <span class="dn">↓</span></div></div>
<div class="calc" data-calc="curve"></div>
<div class="calc" data-calc="impfwd"></div>`,
example:`<div class="q">Spot rates: S₁ = 3%, S₂ = 4%, S₃ = 5% (annual). (a) Price a 3-year, 6% annual-coupon bond (par 100). (b) Find the 1y1y and 2y1y forward rates. (c) Find the 3-year par rate. (d) Price the same bond using forward rates and check.</div>
<ol class="steps"><li><strong>Price</strong> = 6/1.03 + 6/1.04² + 106/1.05³ = 5.8252 + 5.5473 + 91.5668 = <strong>102.94</strong>.</li>
<li><strong>1y1y</strong> = 1.04²/1.03 − 1 = <strong>5.01%</strong>. <strong>2y1y</strong> = 1.05³/1.04² − 1 = <strong>7.03%</strong>.</li>
<li><strong>Par rate:</strong> DFs = 0.97087, 0.92456, 0.86384 (sum 2.75927). Par₃ = (1 − 0.86384)/2.75927 = <strong>4.93%</strong>, slightly below the 5% spot rate, as expected with an upward-sloping curve.</li>
<li><strong>With forwards:</strong> 6/1.03 + 6/(1.03 × 1.0501) + 106/(1.03 × 1.0501 × 1.0703) = <strong>102.94</strong>. Same price.</li></ol>
<p class="ans">Answers: 102.94 · 5.01%, 7.03% · 4.93% · 102.94 ✓ (forward 7.03% &gt; spot 5% &gt; par 4.93%)</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Discounting all cash flows at one spot rate. <b>Fix:</b> each cash flow at its own spot rate.</li>
<li><b>Trap:</b> Misreading "2y3y". <b>Fix:</b> 3-year rate starting 2 years from now.</li>
<li><b>Trap:</b> Ranking curves wrong. <b>Fix:</b> upward: forward &gt; spot &gt; par.</li>
<li><b>Trap:</b> Using arithmetic averages when precision matters. <b>Fix:</b> use the geometric relationship; the approximation only narrows choices.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> price a bond with spot rates; compute a forward from two spots; spot from forwards; par rate; rank curves.</li>
<li><strong>Speed:</strong> for 1-period forwards, F = (1 + S<sub>n</sub>)<sup>n</sup>/(1 + S<sub>n−1</sub>)<sup>n−1</sup> − 1; use the approximation to eliminate choices quickly.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>A bond is a bag of zeros</b>Price each zero with its own spot rate.</div>
<div class="anchor"><b>Book the hotel now</b>Forward rate = lock in future borrowing today.</div>
<div class="anchor"><b>"F-S-P going up"</b>Upward curve: Forward &gt; Spot &gt; Par.</div>
<div class="anchor"><b>Average pulled up by the tail</b>Spot = geometric average of forwards.</div></div>`,
summary:`Spot rates are yields on zero-coupon instruments for single future payments, plotted as the spot curve; a bond's no-arbitrage price discounts each cash flow at its own spot rate. Par rates are the coupon rates at which bonds of each maturity would be priced at par (par<sub>N</sub> = (1 − DF<sub>N</sub>)/ΣDF), effectively weighted averages of spot rates. Forward rates are rates agreed today for future periods (AyBy notation), linked by (1 + S<sub>A+B</sub>)<sup>A+B</sup> = (1 + S<sub>A</sub>)<sup>A</sup>(1 + F)<sup>B</sup>; a spot rate is the geometric mean of the forward rates up to its maturity, and bonds can equivalently be priced by discounting with products of forward rates. In an upward-sloping curve, forward > spot > par; in an inverted curve, forward < spot < par; in a flat curve, all are equal.`
},
quiz:[
{q:"If the 1-year spot rate is 2% and the 2-year spot rate is 3%, the 1y1y forward rate is closest to:",o:["2.5%","3.0%","4.0%"],a:2,e:"1.03²/1.02 − 1 = 4.01%."},
{q:"With an upward-sloping yield curve:",o:["par rates > spot rates > forward rates","forward rates > spot rates > par rates","all rates are equal"],a:1,e:"Forwards pull spots up; par rates are weighted toward shorter spots."},
{q:"Spot rates are 2%, 3%, 4% for years 1–3. A 3-year, 4% annual bond's price is closest to:",o:["100.00","100.15","102.89"],a:1,e:"4/1.02 + 4/1.03² + 104/1.04³ = 3.922 + 3.770 + 92.456 = 100.15. Using a single 4% rate (giving 100.00) is the trap."}]
});

add({n:60,topic:"fi",title:"Interest Rate Risk and Return",
los:["60.a Calculate and interpret the sources of return from investing in a fixed-rate bond.","60.b Describe the relationships among a bond's holding period return, its Macaulay duration, and the investment horizon.","60.c Define, calculate, and interpret Macaulay duration."],
s:{
eli5:`<p>A bond pays you three ways: the coupons, the interest you earn by reinvesting those coupons, and whatever you get when you sell or when it matures.</p>
<p>Now suppose rates go up right after you buy. Bad news: your bond's price drops. Good news: every coupon you reinvest now earns more. These two effects fight each other. If you plan to sell soon, the price drop wins (bad). If you hold for a long time, the extra reinvestment income wins (good).</p>
<p>There's a sweet spot, a holding period where the two effects roughly cancel out. That sweet spot is the bond's <strong>Macaulay duration</strong>. It's also the "average time" until you get your money back, weighted by how much each payment is worth.</p>`,
core:`<p><strong>What problem is this solving?</strong> Investors care about the return over <em>their</em> horizon, not just the YTM. Rate changes create two opposite risks, and duration tells you how to balance them.</p>
<ul><li><strong>Sources of return:</strong> (1) coupons and principal received, (2) reinvestment income on coupons, (3) capital gain/loss if sold before maturity (including amortization of premium/discount).</li>
<li><strong>YTM is realized only if</strong> the bond is held to maturity, all payments are made on time, and coupons are reinvested at the YTM.</li>
<li><strong>Two risks, opposite directions:</strong> market price risk (rates up → price down) and coupon reinvestment risk (rates up → reinvestment income up).</li>
<li><strong>Horizon decides which dominates:</strong> short horizon → price risk dominates; long horizon → reinvestment risk dominates. At a horizon equal to Macaulay duration, they approximately offset (for a one-time parallel shift), immunizing the horizon return.</li>
<li><strong>Duration gap</strong> = Macaulay duration − horizon. Positive gap → exposed to rising rates (price risk). Negative gap → exposed to falling rates (reinvestment risk).</li></ul>`,
formal:`<h4>Sources of return and realized return</h4>
<ul><li>Horizon return depends on coupons, reinvestment rate, and sale price at horizon.</li>
<li>If rates change immediately after purchase and the bond is held to maturity, realized return moves toward the new rate (higher if rates rise, because reinvestment income rises).</li>
<li>If sold before maturity, carrying value (amortized cost at original YTM) vs sale price determines capital gain/loss.</li></ul>
<h4>Macaulay duration</h4>
<p>MacDur = Σ t × w<sub>t</sub>, where w<sub>t</sub> = PV(CF<sub>t</sub>)/Price: the weighted average time (in periods) to receive cash flows. Divide by periodicity for years.</p>
<ul><li>Zero-coupon bond: MacDur = maturity.</li>
<li>Coupon bond: MacDur &lt; maturity; lower coupon or lower yield → higher duration.</li>
<li>Duration gap = MacDur − investment horizon; zero gap → price and reinvestment effects roughly offset.</li></ul>`,
math:`<div class="f"><span class="lbl">Macaulay duration</span>MacDur = Σ t × [PV(CF<sub>t</sub>) / Price] &nbsp;(in periods; ÷ m for years)</div>
<div class="vars"><div><code>t</code><span>Time (period) of each cash flow</span></div><div><code>PV(CF<sub>t</sub>)/Price</code><span>Share of the bond's value received at t</span></div></div>
<p><strong>Why it works:</strong> it's a center of gravity: where on the timeline the bond's value is "balanced". A big final principal pulls it toward maturity; large early coupons pull it earlier.</p>
<div class="f"><span class="lbl">Horizon (realized) return</span>Horizon return = [(coupons + reinvestment income + sale price)/purchase price]<sup>1/H</sup> − 1</div>
<div class="f"><span class="lbl">Duration gap</span>Gap = MacDur − investment horizon</div>
<div class="dir"><div>Gap &gt; 0 → rates <span class="up">↑</span> hurt (price risk dominates)</div><div>Gap &lt; 0 → rates <span class="dn">↓</span> hurt (reinvestment risk dominates)</div><div>Coupon <span class="dn">↓</span> or YTM <span class="dn">↓</span> or maturity <span class="up">↑</span> → MacDur <span class="up">↑</span></div></div>
<div class="calc" data-calc="dur"></div>`,
example:`<div class="q">You buy a 3-year, 5% annual-coupon bond at par (YTM 5%). (a) Compute Macaulay duration. (b) Right after purchase the yield drops to 4%. What is your annualized return if you hold to maturity, reinvesting coupons at 4%? (c) What if you sell after 1 year instead?</div>
<ol class="steps"><li><strong>PVs at 5%:</strong> 4.7619, 4.5351, 90.7029 (sum 100). Weights × time: 1 × 0.0476 + 2 × 0.0454 + 3 × 0.9070 → MacDur = <strong>2.86 years</strong>.</li>
<li><strong>Hold 3 years:</strong> 5 × 1.04² + 5 × 1.04 + 105 = 5.408 + 5.200 + 105 = 115.608 → (1.15608)<sup>1/3</sup> − 1 = <strong>4.95%</strong>, below 5% because reinvestment earned less.</li>
<li><strong>Sell after 1 year:</strong> price of a 2-year 5% bond at 4% = 5/1.04 + 105/1.04² = 101.886; plus coupon 5 → 106.886 → return <strong>6.89%</strong>. The price gain dominates over a short horizon.</li>
<li><strong>Lesson:</strong> horizon (1 yr) &lt; duration (2.86) → falling rates helped; horizon (3 yrs) &gt; duration → falling rates hurt slightly. Near a 2.86-year horizon, the effects offset.</li></ol>
<p class="ans">Answers: 2.86 years · 4.95% · 6.89%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Assuming realized return always equals YTM. <b>Fix:</b> only with hold-to-maturity, no default, reinvestment at YTM.</li>
<li><b>Trap:</b> Thinking rising rates always hurt. <b>Fix:</b> for long horizons (negative gap), rising rates help via reinvestment.</li>
<li><b>Trap:</b> Forgetting to divide by periodicity. <b>Fix:</b> semiannual MacDur in periods ÷ 2 = years.</li>
<li><b>Trap:</b> Saying a coupon bond's duration equals maturity. <b>Fix:</b> only zero-coupon bonds.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> sources of return; horizon return after a rate change (short vs long horizon); compute MacDur for a short bond; interpret duration gap.</li>
<li><strong>Pattern:</strong> "horizon shorter than duration" → price risk dominates → rising rates hurt.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Tug of war</b>Price risk vs reinvestment risk.</div>
<div class="anchor"><b>Seesaw's balance point</b>Macaulay duration = center of gravity of cash flows.</div>
<div class="anchor"><b>Gap = Dur − Horizon</b>Positive gap fears rising rates.</div></div>`,
summary:`A fixed-rate bond's return comes from coupons and principal, reinvestment income on coupons, and any capital gain or loss on sale before maturity; YTM is realized only if the bond is held to maturity, pays as promised and coupons are reinvested at the YTM. A rise in yields lowers price (market price risk) but raises reinvestment income (coupon reinvestment risk): over short horizons the price effect dominates, over long horizons the reinvestment effect dominates. Macaulay duration, the PV-weighted average time to receipt of cash flows (equal to maturity for a zero and shorter for coupon bonds), is the horizon at which the two effects approximately offset; the duration gap (Macaulay duration − horizon) indicates exposure: positive gap to rising rates, negative gap to falling rates.`
},
quiz:[
{q:"An investor's horizon is shorter than her bond's Macaulay duration. She is most exposed to:",o:["falling rates","rising rates","neither"],a:1,e:"Positive duration gap → price risk dominates → rising rates hurt."},
{q:"The Macaulay duration of a 5-year zero-coupon bond is:",o:["less than 5 years","5 years","more than 5 years"],a:1,e:"A zero has one cash flow at maturity."},
{q:"Which source of return benefits from an increase in interest rates?",o:["Coupon reinvestment income","Capital gain on sale before maturity","Neither"],a:0,e:"Higher rates raise reinvestment income while lowering bond prices."}]
});

/* ===================== READING 61 ===================== */
add({n:61,topic:"fi",title:"Yield-Based Bond Duration Measures and Properties",
los:["61.a Define, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).","61.b Explain how a bond's maturity, coupon, and yield level affect its interest rate risk."],
s:{
eli5:`<p>Duration is like a "rate-sensitivity score". A bond with a modified duration of 7 loses about 7% of its value if interest rates rise 1%, and gains about 7% if they fall 1%.</p>
<p><strong>Money duration</strong> says the same thing in dollars: "if rates rise 1%, my position loses about $70,000". The <strong>PVBP</strong> zooms in further: "for every 0.01% move, I gain or lose $700".</p>
<p>Long bonds, low-coupon bonds and bonds in low-rate environments are the most sensitive, because more of their value sits far in the future.</p>`,
core:`<p><strong>What problem is this solving?</strong> Investors need a quick, comparable estimate of how much a bond's price will change when yields move, in % terms (for comparing bonds) and in currency terms (for hedging and risk limits).</p>
<ul><li><strong>Modified duration</strong> converts Macaulay duration (a time) into a sensitivity: %ΔP ≈ −ModDur × ΔYTM. It's the slope of the price-yield curve divided by price, a linear (tangent-line) estimate.</li>
<li><strong>Approximate modified duration</strong> can be computed by repricing the bond at slightly higher and lower yields: useful with any pricing model.</li>
<li><strong>Money duration and PVBP</strong> translate the sensitivity into currency, which is what hedgers and risk managers need (e.g., how many futures to sell).</li>
<li><strong>Drivers:</strong> longer maturity → higher duration (usually); higher coupon → lower duration; higher yield → lower duration (distant cash flows weigh less). Duration falls as time passes but jumps up slightly right after each coupon payment (sawtooth).</li></ul>`,
formal:`<h4>Modified duration</h4>
<ul><li>ModDur = MacDur / (1 + r), r = periodic yield (YTM/m); annualize by dividing period-based durations by m.</li>
<li>%ΔPV<sup>Full</sup> ≈ −AnnModDur × ΔYield.</li>
<li>Approximate modified duration: (V₋ − V₊)/(2 × V₀ × ΔYield).</li></ul>
<h4>Money duration and PVBP</h4>
<ul><li>Money duration = AnnModDur × full price of position (currency change per 100% change in yield; × ΔYield gives currency change). Often quoted per 100 of par.</li>
<li>PVBP (price value of a basis point, also DV01/BPV) = [(V₋ − V₊)/2] for a 1 bp shift = money duration × 0.0001.</li></ul>
<h4>Properties</h4>
<ul><li>Maturity ↑ → duration ↑ (generally; very long discount bonds can be an exception).</li>
<li>Coupon ↑ → duration ↓.</li>
<li>Yield ↑ → duration ↓.</li>
<li>Time passing → duration ↓, with small jumps up on coupon dates.</li>
<li>Floating-rate notes: duration ≈ time to next reset (very low). Zero-coupon: MacDur = maturity.</li>
<li>Callable bonds: duration falls when the call is likely; use effective duration (Reading 63).</li></ul>`,
math:`<div class="f"><span class="lbl">Modified duration and price change</span>ModDur = MacDur / (1 + YTM/m) &nbsp;·&nbsp; %ΔP ≈ −ModDur × ΔYTM</div>
<div class="f"><span class="lbl">Approximate modified duration</span>ApproxModDur = (V₋ − V₊) / (2 × V₀ × ΔYTM)</div>
<p><strong>Why it works:</strong> the difference between prices just below and above the current yield, divided by the total yield change, is the slope; dividing by V₀ makes it a percentage.</p>
<div class="f"><span class="lbl">Money duration and PVBP</span>MoneyDur = ModDur × full value of position &nbsp;·&nbsp; PVBP = MoneyDur × 0.0001</div>
<div class="dir"><div>Maturity <span class="up">↑</span> → duration <span class="up">↑</span> · Coupon <span class="up">↑</span> → duration <span class="dn">↓</span> · Yield <span class="up">↑</span> → duration <span class="dn">↓</span></div><div>Duration estimate is linear: understates price gains and overstates losses for large moves (convexity fixes this)</div></div>
<div class="calc" data-calc="dur"></div>
<div class="calc" data-calc="approx"></div>`,
example:`<div class="q">A 10-year, 5% annual-coupon bond yields 6%. (a) Price, Macaulay and modified duration. (b) Estimate the % price change if yields rise 100 bp. (c) For a $1,000,000 par position, find money duration and PVBP. (d) Rank by duration: 10-year 2% coupon, 10-year 8% coupon, 3-year 2% coupon.</div>
<ol class="steps"><li><strong>Price</strong> = 92.64 (per 100). MacDur = <strong>8.02 years</strong>; ModDur = 8.02/1.06 = <strong>7.57</strong>.</li>
<li><strong>%ΔP</strong> ≈ −7.57 × 1% = <strong>−7.57%</strong> (actual is −7.22%; the gap is convexity, Reading 62).</li>
<li><strong>Position value</strong> = $926,399 → money duration = 7.57 × 926,399 ≈ <strong>$7.01m</strong> (≈ $70,100 per 100 bp); PVBP ≈ <strong>$701</strong> per bp.</li>
<li><strong>Ranking:</strong> 10-year 2% (highest) &gt; 10-year 8% &gt; 3-year 2% (lowest).</li></ol>
<p class="ans">Answers: 92.64, MacDur 8.02, ModDur 7.57 · −7.57% · ≈$7.01m money duration, PVBP ≈ $701 · 10y 2% &gt; 10y 8% &gt; 3y 2%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using Macaulay duration to estimate % price change. <b>Fix:</b> use modified duration.</li>
<li><b>Trap:</b> Forgetting the minus sign. <b>Fix:</b> yields up → price down.</li>
<li><b>Trap:</b> ΔYTM in percent units with ModDur (e.g., 7.57 × 100bp = 757%). <b>Fix:</b> use decimals (0.01) or "% × %" consistently.</li>
<li><b>Trap:</b> Higher coupon → higher duration. <b>Fix:</b> higher coupon → lower duration.</li>
<li><b>Trap:</b> PVBP on par value instead of market value. <b>Fix:</b> based on full price of the position.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute ModDur from MacDur; approximate ModDur from three prices; %ΔP from duration; money duration/PVBP; rank bonds by duration; effect of time passing.</li>
<li><strong>Shortcut:</strong> PVBP per 100 ≈ ModDur × price × 0.0001.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Duration 7 → 7% per 1%</b>Modified duration as a sensitivity score.</div>
<div class="anchor"><b>Long, Low coupon, Low yield = Loud</b>The most rate-sensitive bonds.</div>
<div class="anchor"><b>Dollars per bp</b>PVBP = money duration × 0.0001.</div></div>`,
summary:`Modified duration (Macaulay duration ÷ (1 + periodic yield), annualized) estimates the percentage change in a bond's full price for a change in yield: %ΔP ≈ −ModDur × ΔYTM; it can be approximated as (V₋ − V₊)/(2V₀ΔYTM). Money duration = ModDur × full value of the position expresses sensitivity in currency, and the price value of a basis point (PVBP) = money duration × 0.0001 is the currency change for a 1 bp yield move. Duration rises with maturity and falls with higher coupons and higher yields, and it declines as time passes (with small jumps on coupon dates); floaters have very low duration and zeros have Macaulay duration equal to maturity. Duration is a linear approximation, so it misestimates large yield changes.`
},
quiz:[
{q:"A bond has a Macaulay duration of 6.3 and a YTM of 5% (annual pay). Its modified duration is:",o:["6.00","6.30","6.62"],a:0,e:"6.3/1.05 = 6.0."},
{q:"A bond with modified duration 8 has yields rise by 25 bp. The approximate price change is:",o:["−0.25%","−2.0%","−8.0%"],a:1,e:"−8 × 0.25% = −2.0%."},
{q:"Holding other factors constant, which bond has the highest duration?",o:["High coupon, short maturity","Low coupon, long maturity","High coupon, long maturity"],a:1,e:"Low coupon and long maturity push value further out."}]
});

/* ===================== READING 62 ===================== */
add({n:62,topic:"fi",title:"Yield-Based Bond Convexity and Portfolio Properties",
los:["62.a Calculate and interpret convexity and describe the convexity adjustment.","62.b Calculate the percentage price change of a bond for a specified change in yield, given the bond's duration and convexity.","62.c Calculate portfolio duration and convexity and explain the limitations of these measures."],
s:{
eli5:`<p>Duration draws a straight line to guess price changes, but the real price-yield relationship is a curve that bends upward like a smile. Because of that bend, when rates fall, prices rise <em>more</em> than the straight line says, and when rates rise, prices fall <em>less</em>. That bend is <strong>convexity</strong>, and it's good for the bond owner.</p>
<p>For small rate moves, duration alone is fine. For big moves, you add a convexity "correction" to get closer to the truth.</p>
<p>For a whole portfolio, you can roughly average the durations (weighted by value), as long as all rates move together.</p>`,
core:`<p><strong>What problem is this solving?</strong> Duration's straight-line estimate is wrong for larger yield changes. Convexity measures the curvature and corrects the estimate; it's also a desirable property, since more convexity means better performance in big moves either way.</p>
<ul><li><strong>Convexity adjustment is always positive</strong> for option-free bonds (+½ × Convexity × ΔY²), because ΔY² is positive whichever way rates move.</li>
<li><strong>What raises convexity:</strong> longer maturity, lower coupon, lower yield, and more dispersed cash flows (a barbell has more convexity than a bullet with the same duration).</li>
<li><strong>Portfolio duration</strong> can be computed from the aggregate cash flows (theoretically correct, needs a single cash-flow yield) or as a market-value-weighted average of bond durations (practical, but assumes parallel yield curve shifts).</li>
<li><strong>Limitations:</strong> both measures assume a single yield and parallel shifts; real curves twist and steepen; bonds with options need effective measures (Reading 63).</li></ul>`,
formal:`<h4>Convexity</h4>
<ul><li>Convexity of a cash flow at period t: [t(t + 1)] / (1 + r)²; bond convexity = PV-weighted average, divided by m² to annualize.</li>
<li>Approximate convexity: (V₋ + V₊ − 2V₀)/(ΔYTM² × V₀).</li>
<li>%ΔP<sup>Full</sup> ≈ −AnnModDur × ΔYTM + ½ × AnnConvexity × (ΔYTM)².</li>
<li>Money convexity = AnnConvexity × full value; ΔP ≈ −MoneyDur × ΔYTM + ½ × MoneyCon × ΔYTM².</li>
<li>Option-free bonds have positive convexity; callable bonds and MBS can show negative convexity at low yields.</li></ul>
<h4>Portfolio duration and convexity</h4>
<ol><li><strong>Cash-flow yield method:</strong> combine all cash flows, compute the portfolio's yield and duration (theoretically sound, impractical, fails with options).</li>
<li><strong>Weighted average:</strong> Σ wᵢ × Durᵢ (and Σ wᵢ × Convᵢ), weights = market values; most used; assumes parallel shifts (all yields change equally).</li></ol>`,
math:`<div class="f"><span class="lbl">Duration + convexity estimate</span>%ΔP ≈ −ModDur × ΔY + ½ × Convexity × (ΔY)²</div>
<div class="vars"><div><code>ΔY</code><span>Yield change in decimals (e.g., 0.01 for 100 bp)</span></div><div><code>Convexity</code><span>Annualized curvature measure (e.g., 72.6)</span></div></div>
<p><strong>Why:</strong> it's a second-order Taylor approximation: the first term is the tangent line, the second bends it to follow the curve. Squaring ΔY makes the correction positive in both directions.</p>
<div class="f"><span class="lbl">Approximate convexity</span>ApproxCon = (V₋ + V₊ − 2V₀) / (ΔY² × V₀)</div>
<div class="f"><span class="lbl">Portfolio</span>Dur<sub>p</sub> ≈ Σ wᵢ Durᵢ &nbsp;·&nbsp; Conv<sub>p</sub> ≈ Σ wᵢ Convᵢ</div>
<div class="dir"><div>Bigger ΔY → convexity term matters more (it grows with ΔY²)</div><div>Positive convexity → gains &gt; losses for equal up/down moves</div><div>Maturity <span class="up">↑</span>, coupon <span class="dn">↓</span>, yield <span class="dn">↓</span>, cash-flow dispersion <span class="up">↑</span> → convexity <span class="up">↑</span></div></div>
<div class="calc" data-calc="dur"></div>
<div class="calc" data-calc="approx"></div>`,
example:`<div class="q">The 10-year 5% bond from Reading 61 has ModDur 7.57 and convexity 72.6 (yield 6%). (a) Estimate the % price change for +100 bp and −100 bp using duration and convexity. (b) A portfolio holds 60% (by value) of a bond with duration 4 and 40% of a bond with duration 10. Portfolio duration? (c) Prices: V₀ = 100, V₋ = 102.5, V₊ = 97.6 for ±50 bp. Approximate duration and convexity?</div>
<ol class="steps"><li><strong>+100 bp:</strong> −7.57 × 0.01 + ½ × 72.6 × 0.0001 = −7.57% + 0.36% = <strong>−7.21%</strong> (actual −7.22%).</li>
<li><strong>−100 bp:</strong> +7.57% + 0.36% = <strong>+7.93%</strong>: gain exceeds loss, thanks to positive convexity.</li>
<li><strong>Portfolio duration</strong> = 0.6 × 4 + 0.4 × 10 = <strong>6.4</strong> (valid for parallel shifts).</li>
<li><strong>Approximations:</strong> Dur = (102.5 − 97.6)/(2 × 100 × 0.005) = <strong>4.90</strong>; Conv = (102.5 + 97.6 − 200)/(0.005² × 100) = <strong>40</strong>.</li></ol>
<p class="ans">Answers: −7.21% / +7.93% · 6.4 · 4.90 and 40</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Subtracting the convexity adjustment when yields fall. <b>Fix:</b> for option-free bonds it's always added.</li>
<li><b>Trap:</b> Forgetting the ½. <b>Fix:</b> + ½ × C × ΔY².</li>
<li><b>Trap:</b> Squaring ΔY in percent (1² = 1). <b>Fix:</b> use decimals (0.01² = 0.0001).</li>
<li><b>Trap:</b> Weighted-average duration works for any curve change. <b>Fix:</b> it assumes parallel shifts.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> %ΔP with duration and convexity; approximate convexity from three prices; portfolio duration; which bond has more convexity; limitations.</li>
<li><strong>Check:</strong> your +Δ and −Δ answers should be asymmetric, with the gain larger.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Smile curve</b>Convexity bends the line upward: more up, less down.</div>
<div class="anchor"><b>"Minus D, plus half C"</b>%ΔP ≈ −DΔy + ½CΔy².</div>
<div class="anchor"><b>Barbell beats bullet in curvature</b>Spread-out cash flows → more convexity.</div></div>`,
summary:`Convexity measures the curvature of the price-yield relationship; for an option-free bond it is positive, so the duration-only estimate understates price gains and overstates losses. Convexity is the PV-weighted average of t(t + 1)/(1 + r)² (annualized by dividing by m²) or approximately (V₋ + V₊ − 2V₀)/(ΔY² V₀), and it is higher for longer maturities, lower coupons, lower yields and more dispersed cash flows. The full price change is %ΔP ≈ −ModDur × ΔY + ½ × Convexity × ΔY² (in currency terms using money duration and money convexity). Portfolio duration and convexity can be computed from aggregate cash flows or, more commonly, as market-value-weighted averages of individual measures, which assume parallel yield curve shifts.`
},
quiz:[
{q:"A bond has modified duration 5 and convexity 40. For a 200 bp increase in yield, the estimated price change is:",o:["−10.0%","−9.2%","−10.8%"],a:1,e:"−5 × 0.02 + 0.5 × 40 × 0.0004 = −0.10 + 0.008 = −9.2%."},
{q:"For an option-free bond, the convexity adjustment is:",o:["always positive","positive only when yields fall","always negative"],a:0,e:"ΔY² is positive in both directions and convexity is positive."},
{q:"The weighted-average method of computing portfolio duration assumes:",o:["parallel shifts in the yield curve","no coupon payments","bonds with embedded options"],a:0,e:"All yields must change by the same amount for the average to be accurate."}]
});

/* ===================== READING 63 ===================== */
add({n:63,topic:"fi",title:"Curve-Based and Empirical Fixed-Income Risk Measures",
los:["63.a Explain why effective duration and effective convexity are the most appropriate measures of interest rate risk for bonds with embedded options.","63.b Calculate the percentage price change of a bond for a specified change in benchmark yield, given the bond's effective duration and convexity.","63.c Define key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark yield curve changes.","63.d Describe the difference between empirical duration and analytical duration."],
s:{
eli5:`<p>Some bonds have "escape hatches". A callable bond can be repaid early by the issuer, so if rates fall a lot, its price can't climb much: investors know it'll probably be called at, say, 102. Its cash flows change as rates change, so the regular duration formulas (which assume fixed cash flows) don't work.</p>
<p>Instead, we nudge the whole benchmark yield curve up and down in a pricing model, see how the price responds, and measure the sensitivity: that's <strong>effective duration</strong>.</p>
<p>And because real yield curves don't move in neat parallel lines (short rates may rise while long rates fall), <strong>key rate durations</strong> measure sensitivity to each part of the curve separately.</p>`,
core:`<p><strong>What problem is this solving?</strong> Yield-based duration assumes fixed cash flows and a single yield. Bonds with embedded options have cash flows that depend on rates, and real curves change shape. Curve-based and empirical measures handle both.</p>
<ul><li><strong>Effective duration/convexity</strong> shift the benchmark curve (not the bond's own YTM) in a model that captures option exercise. They're the right measures for callable, putable and mortgage-backed bonds.</li>
<li><strong>Negative convexity:</strong> callable bonds and MBS at low yields: when rates fall, price gains are capped (call/prepayment), so the curve bends the wrong way: gains smaller than losses.</li>
<li><strong>Putable bonds</strong> have extra positive convexity at high yields (price floor at the put price).</li>
<li><strong>Key rate (partial) durations</strong> measure sensitivity to a shift at one maturity; they sum to effective duration and reveal exposure to curve shape changes (steepening, flattening, twists).</li>
<li><strong>Empirical duration</strong> comes from regressing actual price changes on benchmark yield changes. For credit-risky bonds, government yields and credit spreads often move in opposite directions (flight to quality), so empirical duration can be lower than analytical duration.</li></ul>`,
formal:`<h4>Effective duration and convexity</h4>
<ul><li>EffDur = (PV₋ − PV₊)/(2 × ΔCurve × PV₀); EffCon = (PV₋ + PV₊ − 2PV₀)/(ΔCurve² × PV₀). Prices from an option-pricing model given shifts of the benchmark curve.</li>
<li>%ΔP ≈ −EffDur × ΔCurve + ½ × EffCon × ΔCurve².</li>
<li>Used when cash flows are uncertain (bonds with embedded options, MBS) or when there's no well-defined yield.</li>
<li>Callable: EffDur &lt; straight bond's when the call is in the money; negative convexity at low yields. Putable: lower duration at high yields; positive convexity enhanced.</li></ul>
<h4>Key rate duration</h4>
<p>Sensitivity of price to a change in yield at a single maturity (key rate) holding others constant; Σ key rate durations = effective duration. Used to measure shaping risk and to build hedges matching curve exposures.</p>
<h4>Analytical vs empirical duration</h4>
<ul><li><strong>Analytical:</strong> Macaulay, modified, effective (from mathematical models/assumptions).</li>
<li><strong>Empirical:</strong> statistically estimated from historical price and yield data; captures actual co-movement of benchmark yields and spreads.</li>
<li>For high-quality government bonds, empirical ≈ analytical. For credit-risky bonds (especially high yield), spread changes often offset benchmark moves (flight to quality) → empirical duration &lt; analytical.</li></ul>`,
math:`<div class="f"><span class="lbl">Effective duration and convexity</span>EffDur = (PV₋ − PV₊)/(2 × ΔCurve × PV₀) &nbsp;·&nbsp; EffCon = (PV₋ + PV₊ − 2PV₀)/(ΔCurve² × PV₀)</div>
<div class="f"><span class="lbl">Price change</span>%ΔP ≈ −EffDur × ΔCurve + ½ × EffCon × ΔCurve²</div>
<div class="f"><span class="lbl">Key rate durations</span>%ΔP ≈ −Σ KeyRateDur<sub>k</sub> × ΔY<sub>k</sub> &nbsp;·&nbsp; Σ KRD<sub>k</sub> = EffDur</div>
<p><strong>Why curve-based:</strong> you can't use a bond's own yield because its future cash flows depend on whether the option is exercised; moving the benchmark curve and repricing with the model captures that.</p>
<div class="dir"><div>Rates fall toward call price → callable price capped → EffCon <span class="dn">negative</span></div><div>Rates rise toward put threshold → putable price floored → duration <span class="dn">↓</span></div><div>Credit spreads move opposite to Treasuries → empirical duration <span class="dn">&lt;</span> analytical</div></div>
<div class="calc" data-calc="approx"></div>`,
example:`<div class="q">(a) A callable bond is priced at 101.00. A model shows it at 102.00 if the benchmark curve falls 50 bp and 99.00 if it rises 50 bp. Compute effective duration and convexity and interpret. (b) Estimate the % price change for a +50 bp shift. (c) A portfolio's key rate durations are 2-year 0.5, 5-year 1.5, 10-year 3.0. Effective duration? Estimated price change if only the 10-year rate rises 20 bp? (d) A high-yield bond has analytical duration 5 but empirical duration 3. Why?</div>
<ol class="steps"><li><strong>EffDur</strong> = (102 − 99)/(2 × 0.005 × 101) = <strong>2.97</strong>. <strong>EffCon</strong> = (102 + 99 − 202)/(0.005² × 101) = <strong>−396</strong>: negative convexity, since upside is capped by the call.</li>
<li><strong>+50 bp:</strong> −2.97 × 0.005 + ½ × (−396) × 0.000025 = −1.485% − 0.495% = <strong>−1.98%</strong> (≈ (99 − 101)/101).</li>
<li><strong>Effective duration</strong> = 0.5 + 1.5 + 3.0 = <strong>5.0</strong>. 10-year +20 bp: −3.0 × 0.002 = <strong>−0.60%</strong>.</li>
<li><strong>Empirical &lt; analytical</strong> because when Treasury yields fall in a risk-off episode, the bond's credit spread widens, offsetting part of the benchmark move.</li></ol>
<p class="ans">Answers: EffDur 2.97, EffCon −396 · −1.98% · 5.0 and −0.60% · spread/benchmark offset</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using modified duration for callable bonds/MBS. <b>Fix:</b> effective duration.</li>
<li><b>Trap:</b> Effective duration uses the bond's YTM change. <b>Fix:</b> it uses benchmark curve shifts.</li>
<li><b>Trap:</b> All bonds have positive convexity. <b>Fix:</b> callables and MBS can be negatively convex at low yields.</li>
<li><b>Trap:</b> Key rate durations don't add up. <b>Fix:</b> they sum to effective duration.</li>
<li><b>Trap:</b> Empirical duration is always higher. <b>Fix:</b> for credit-risky bonds it's often lower.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> why effective measures for embedded options; compute EffDur/EffCon; price change with effective measures; interpret negative convexity; key rate durations; empirical vs analytical.</li>
<li><strong>Sign check:</strong> if V₋ + V₊ &lt; 2V₀, convexity is negative.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Escape hatches need models</b>Embedded options → effective duration.</div>
<div class="anchor"><b>Call caps the smile</b>Negative convexity at low yields.</div>
<div class="anchor"><b>Piano keys</b>Key rate durations: press one maturity at a time.</div>
<div class="anchor"><b>Spreads cushion Treasuries</b>Empirical &lt; analytical for credit bonds.</div></div>`,
summary:`Bonds with embedded options (callable, putable, MBS) have rate-dependent cash flows and no well-defined yield, so their risk is measured with effective duration ((PV₋ − PV₊)/(2 × ΔCurve × PV₀)) and effective convexity ((PV₋ + PV₊ − 2PV₀)/(ΔCurve² × PV₀)), computed by shifting the benchmark curve in an option-pricing model; %ΔP ≈ −EffDur × ΔCurve + ½ × EffCon × ΔCurve². Callable bonds and MBS can exhibit negative convexity at low yields; putable bonds gain convexity at high yields. Key rate durations measure sensitivity to changes at individual maturities, sum to effective duration and capture shaping risk. Analytical durations (Macaulay, modified, effective) come from models; empirical duration is estimated from historical data and may be lower than analytical duration for credit-risky bonds because spreads tend to widen when benchmark yields fall.`
},
quiz:[
{q:"The most appropriate duration measure for a callable bond is:",o:["Macaulay duration","modified duration","effective duration"],a:2,e:"Cash flows change with rates; effective duration uses benchmark curve shifts in an option model."},
{q:"A bond's effective convexity is negative. This is most likely a:",o:["putable bond at high yields","callable bond at low yields","zero-coupon government bond"],a:1,e:"Calls cap price appreciation when rates fall → negative convexity."},
{q:"For a high-yield corporate bond in a flight-to-quality environment, empirical duration is most likely:",o:["greater than analytical duration","less than analytical duration","equal to analytical duration"],a:1,e:"Widening spreads offset falling Treasury yields, damping price sensitivity."}]
});

/* ===================== READING 64 ===================== */
add({n:64,topic:"fi",title:"Credit Risk",
los:["64.a Describe credit risk and its components, probability of default and loss given default.","64.b Describe the uses of ratings from credit rating agencies and their limitations.","64.c Describe macroeconomic, market, and issuer-specific factors that influence the level and volatility of yield spreads."],
s:{
eli5:`<p>Lending money has one big fear: the borrower doesn't pay you back. Two questions decide how worried to be: <strong>How likely</strong> is it they won't pay (probability of default)? And <strong>if they don't, how much do I lose</strong> after selling whatever they pledged (loss given default)? Multiply them and you get the <strong>expected loss</strong>, roughly the extra interest a lender should demand.</p>
<p>Rating agencies give borrowers grades (AAA is top, BBB− is the lowest "safe" grade, below that is "junk"). Useful, but they can be slow or wrong, and bond prices often react before ratings change.</p>`,
core:`<p><strong>What problem is this solving?</strong> Pricing and managing the chance of not being repaid. Credit spreads compensate for expected loss (plus liquidity and uncertainty), so analysts need to estimate default probability and recovery and understand what moves spreads.</p>
<ul><li><strong>Expected loss = PD × LGD.</strong> LGD (loss severity) = 1 − recovery rate. Seniority and collateral lower LGD; strong profitability, coverage and low leverage lower PD.</li>
<li><strong>Credit analysis frameworks:</strong> bottom-up "5 Cs": capacity (ability to pay from cash flows), capital (balance-sheet strength), collateral, covenants, character (management quality and integrity); top-down "3 Cs": conditions (economy), country (legal, political), currency (FX risk).</li>
<li><strong>Ratings:</strong> issuer and issue ratings, investment grade vs high yield; useful for comparability and regulation, but agencies can be wrong, can't foresee event risk (M&amp;A, lawsuits, disasters), and markets often move first. Downgrades of IG bonds to HY ("fallen angels") cause forced selling.</li>
<li><strong>Spreads widen</strong> when the credit cycle and economy weaken, financial markets are stressed, dealer capital is scarce, or issuance supply is heavy; they narrow in the opposite conditions. Spread = liquidity component (estimated from bid-ask) + credit component.</li>
<li><strong>Spread risk</strong> is measured like rate risk: %ΔP ≈ −ModDur × ΔSpread + ½ × Convexity × ΔSpread².</li></ul>`,
formal:`<h4>Components of credit risk</h4>
<ul><li><strong>Default risk / probability of default (POD):</strong> likelihood the borrower fails to pay interest or principal on time.</li>
<li><strong>Loss given default (LGD) / loss severity:</strong> loss if default occurs; LGD% = 1 − recovery rate.</li>
<li><strong>Expected loss</strong> = POD × LGD; credit spread ≈ POD × LGD% (simplified).</li>
<li>Also: downgrade risk (spread widening from rating cuts), market liquidity risk.</li></ul>
<h4>Credit analysis</h4>
<ul><li>Bottom-up: capacity, capital, collateral, covenants, character. Top-down: conditions, country, currency.</li>
<li>Indicators of high credit quality: high EBIT margin, high interest coverage, low leverage (debt/EBITDA), high cash flow to net debt.</li></ul>
<h4>Credit ratings</h4>
<table><tr><th></th><th>Moody's</th><th>S&amp;P / Fitch</th></tr>
<tr><td>Investment grade</td><td>Aaa, Aa, A, Baa (1–3)</td><td>AAA, AA, A, BBB (+/−)</td></tr>
<tr><td>High yield</td><td>Ba, B, Caa, Ca, C</td><td>BB, B, CCC, CC, C; D = default</td></tr></table>
<p>Issuer (corporate family) ratings vs issue ratings (notching up/down for seniority and collateral). Limitations: ratings can be wrong; event risk (natural disasters, acquisitions, scandals) not captured; ratings lag market prices.</p>
<h4>Factors affecting yield spreads</h4>
<ul><li><strong>Macro:</strong> credit cycle, business cycle (spreads widen in contractions).</li>
<li><strong>Market:</strong> broker-dealer capital and market-making capacity; supply of new issues; investor demand; general market conditions (flight to quality).</li>
<li><strong>Issuer-specific:</strong> financial performance, leverage, events.</li>
<li>Lower-rated bonds have higher and more volatile spreads.</li>
<li>Liquidity spread ≈ yield at bid − yield at offer; remainder ≈ credit spread.</li></ul>`,
math:`<div class="f"><span class="lbl">Expected loss</span>Expected loss = POD × LGD &nbsp;·&nbsp; LGD% = 1 − recovery rate &nbsp;·&nbsp; Credit spread ≈ POD × LGD%</div>
<div class="vars"><div><code>POD</code><span>Probability of default over the period</span></div><div><code>LGD</code><span>Loss given default (amount or %)</span></div><div><code>Recovery</code><span>Fraction of exposure recovered after default</span></div></div>
<p><strong>Why it approximates the spread:</strong> a lender that expects to lose 1.2% a year on average needs about 1.2% extra yield just to break even versus a risk-free bond.</p>
<div class="f"><span class="lbl">Spread change and price</span>%ΔP ≈ −ModDur × ΔSpread + ½ × Convexity × (ΔSpread)²</div>
<div class="dir"><div>Recession / weak credit cycle → spreads <span class="up">↑</span>, more for low ratings</div><div>Seniority/collateral <span class="up">↑</span> → recovery <span class="up">↑</span> → LGD <span class="dn">↓</span></div><div>Heavy new issuance or scarce dealer capital → spreads <span class="up">↑</span></div></div>
<div class="calc" data-calc="credit"></div>`,
example:`<div class="q">(a) A bond has a 2% annual default probability and 40% expected recovery. Find LGD%, expected loss and the approximate credit spread. For a $1,000 exposure, the expected dollar loss? (b) The bond's spread duration is 6. If its spread widens 50 bp, estimate the price change. (c) A bond's yield is 6.80% at the bid and 6.65% at the offer; the government yield is 4.50%. Split the spread into liquidity and credit components (using the bid yield).</div>
<ol class="steps"><li><strong>LGD%</strong> = 1 − 0.40 = 60%. <strong>Expected loss</strong> = 0.02 × 0.60 = <strong>1.2%</strong> → spread ≈ <strong>120 bp</strong>; dollar EL = $12.</li>
<li><strong>Price change</strong> ≈ −6 × 0.005 = <strong>−3.0%</strong> (convexity small).</li>
<li><strong>Total spread</strong> (at bid) = 6.80 − 4.50 = 230 bp. Liquidity ≈ 6.80 − 6.65 = <strong>15 bp</strong>; credit ≈ <strong>215 bp</strong>.</li></ol>
<p class="ans">Answers: LGD 60%, EL 1.2% (≈120 bp, $12) · −3.0% · 15 bp liquidity, 215 bp credit</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> LGD = recovery rate. <b>Fix:</b> LGD = 1 − recovery.</li>
<li><b>Trap:</b> Relying solely on ratings. <b>Fix:</b> they lag markets and miss event risk.</li>
<li><b>Trap:</b> BBB− is high yield. <b>Fix:</b> BBB−/Baa3 is the lowest investment grade.</li>
<li><b>Trap:</b> Spreads narrow in recessions. <b>Fix:</b> they widen.</li>
<li><b>Trap:</b> Confusing capacity with capital. <b>Fix:</b> capacity = cash-flow ability to pay; capital = balance-sheet cushion.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute expected loss/spread; LGD from recovery; 5 Cs and 3 Cs; rating scales and limitations; factors widening/narrowing spreads; spread duration price impact.</li>
<li><strong>Shortcut:</strong> spread (bp) ≈ PD% × LGD% × 100.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>How likely × How bad</b>Expected loss = PD × LGD.</div>
<div class="anchor"><b>5 Cs bottom-up, 3 Cs top-down</b>Capacity, Capital, Collateral, Covenants, Character + Conditions, Country, Currency.</div>
<div class="anchor"><b>BBB− is the cliff edge</b>Below = high yield.</div>
<div class="anchor"><b>Spreads breathe with the cycle</b>Widen in fear, narrow in greed.</div></div>`,
summary:`Credit risk is the risk a borrower fails to pay interest or principal as promised; its components are the probability of default and loss given default (loss severity = 1 − recovery rate), and expected loss = POD × LGD approximates the credit spread investors should require. Analysis uses bottom-up factors (capacity, capital, collateral, covenants, character) and top-down factors (conditions, country, currency); profitable, well-covered, low-leverage firms have low default probability, and senior secured debt has lower LGD. Ratings of BBB−/Baa3 and above are investment grade, BB+/Ba1 and below high yield; ratings aid comparison but can be wrong, miss event risk and lag market prices. Spreads (liquidity + credit components) widen with weak credit and business cycles, stressed markets, scarce dealer capital and heavy issuance, and narrow in the opposite conditions; spread changes affect prices via −ModDur × ΔSpread + ½ × Convexity × ΔSpread².`
},
quiz:[
{q:"A bond has a 3% probability of default and a 30% recovery rate. Its expected loss is closest to:",o:["0.9%","2.1%","3.0%"],a:1,e:"0.03 × (1 − 0.30) = 2.1%."},
{q:"Which is a limitation of credit ratings?",o:["They are not comparable across issuers","They may lag market price changes","They ignore seniority"],a:1,e:"Market prices typically adjust before ratings."},
{q:"Credit spreads are most likely to narrow when:",o:["the economy is contracting","broker-dealer capital is scarce","the credit cycle is improving"],a:2,e:"Improving credit and economic conditions narrow spreads."}]
});

/* ===================== READING 65 ===================== */
add({n:65,topic:"fi",title:"Credit Analysis for Government Issuers",
los:["65.a Explain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues."],
s:{
eli5:`<p>Judging whether a country will repay is like judging a family's finances, but with superpowers. The country can raise taxes and, if it borrows in its own currency, even print money. So the questions are: Is the government stable and trustworthy? Can it raise taxes or cut spending if needed? Does its central bank work well? Is the economy diverse and growing? Does it owe a lot to foreigners in foreign currencies?</p>
<p>Cities and regions can't print money, so they depend on their tax base or on the income of specific projects like a toll road.</p>`,
core:`<p><strong>What problem is this solving?</strong> Sovereign debt underpins every market, but sovereign default happens (Argentina, Greece, Russia). Analysts assess both the <em>ability</em> (economic and fiscal capacity) and <em>willingness</em> (institutions, politics) to pay, plus external vulnerabilities.</p>
<ul><li><strong>Willingness matters:</strong> unlike companies, sovereigns can't be liquidated; creditors rely on the government choosing to pay, so institutions and politics are central.</li>
<li><strong>Local vs foreign currency debt:</strong> local-currency debt can be "repaid" by printing money (inflation risk instead of default risk); foreign-currency debt needs export earnings or reserves, so it's riskier. Ratings often differ for the two.</li>
<li><strong>Reserve-currency issuers</strong> (USD, EUR, JPY…) have extra borrowing capacity.</li>
<li><strong>Non-sovereigns:</strong> agencies (often implicit support), supranationals (strong backing), regional governments. GO bonds rely on taxing power (analyze economy, tax base, debt levels, pensions); revenue bonds rely on project cash flows (analyze like a business, with debt-service coverage).</li></ul>`,
formal:`<h4>Sovereign credit: qualitative factors</h4>
<ol><li><strong>Institutions and policy:</strong> political stability, rule of law, transparency, corruption, property rights, willingness to pay, policy predictability.</li>
<li><strong>Fiscal flexibility:</strong> ability and willingness to raise revenue or cut spending; debt affordability.</li>
<li><strong>Monetary effectiveness:</strong> independent, credible central bank; exchange rate regime; reserve currency status.</li>
<li><strong>Economic flexibility:</strong> growth potential, income per capita, diversification, labor market.</li>
<li><strong>External status:</strong> international reserves, external debt, current account, reliance on foreign capital.</li></ol>
<h4>Sovereign credit: quantitative factors</h4>
<ol><li><strong>Fiscal strength:</strong> debt/GDP, interest expense/revenue, budget balance/GDP.</li>
<li><strong>Economic growth and stability:</strong> GDP size, GDP per capita, real growth, volatility.</li>
<li><strong>External stability:</strong> current account/GDP, foreign reserves/external debt, external debt/GDP.</li></ol>
<p>Local-currency vs foreign-currency ratings; sovereign ceiling (issuers within a country rarely rated above the sovereign).</p>
<h4>Non-sovereign government issuers</h4>
<ul><li><strong>Agencies:</strong> government-sponsored entities; credit often linked to sovereign (explicit/implicit guarantees).</li>
<li><strong>Government sector banks</strong> and development banks.</li>
<li><strong>Supranationals:</strong> backed by member governments; often AAA.</li>
<li><strong>Regional/local governments:</strong> GO bonds (backed by tax-raising power; analyze economic base, tax revenue, debt and pension burdens, budget) vs revenue bonds (backed by project revenues; analyze project economics, debt service coverage ratio). Regional governments typically can't use monetary policy and may face balanced-budget rules.</li></ul>`,
math:`<p>Sovereign analysis is ratio-driven rather than formula-heavy.</p>
<div class="f"><span class="lbl">Key ratios</span>Debt/GDP · Interest/Revenue · Budget balance/GDP · Current account/GDP · Reserves/External debt · External debt/GDP</div>
<div class="f"><span class="lbl">Revenue bond coverage</span>Debt service coverage ratio (DSCR) = project net revenue / debt service</div>
<div class="dir"><div>Debt/GDP <span class="up">↑</span>, interest/revenue <span class="up">↑</span> → credit quality <span class="dn">↓</span></div><div>Reserve currency, independent central bank, diversified economy → credit quality <span class="up">↑</span></div><div>Heavy foreign-currency external debt + low reserves → default risk <span class="up">↑</span></div></div>`,
example:`<div class="q">Compare Country A (debt/GDP 60%, interest/revenue 6%, independent central bank, diversified economy, reserves cover external debt 2×, mostly local-currency debt) with Country B (debt/GDP 55%, interest/revenue 18%, central bank financing deficits, economy reliant on oil, reserves cover external debt 0.4×, mostly USD debt). (a) Which is the stronger credit and why? (b) A city issues bonds to build a parking garage, repaid only from parking fees projected at $5m a year against $4m annual debt service. Bond type and DSCR?</div>
<ol class="steps"><li><strong>Fiscal:</strong> similar debt/GDP, but B's interest burden (18% of revenue) is far heavier.</li>
<li><strong>Monetary/economic:</strong> A has an independent central bank and diversified economy; B monetizes deficits and depends on oil.</li>
<li><strong>External:</strong> A's reserves cover external debt twice; B's cover only 40%, and B owes in USD (can't print it).</li>
<li><strong>Conclusion:</strong> <strong>Country A</strong> is the stronger credit despite slightly higher debt/GDP.</li>
<li><strong>Garage:</strong> revenue bond; DSCR = 5/4 = <strong>1.25×</strong>.</li></ol>
<p class="ans">Answers: Country A · revenue bond, DSCR 1.25×</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Judging sovereigns only by debt/GDP. <b>Fix:</b> combine fiscal, monetary, economic, external and institutional factors.</li>
<li><b>Trap:</b> Local- and foreign-currency debt carry equal risk. <b>Fix:</b> foreign-currency debt is usually riskier.</li>
<li><b>Trap:</b> Revenue bonds are backed by taxes. <b>Fix:</b> backed by project revenues; GO bonds by taxes.</li>
<li><b>Trap:</b> Regional governments can print money. <b>Fix:</b> they lack monetary tools.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> list the five qualitative and three quantitative sovereign factors; compare two countries; GO vs revenue bonds; local vs foreign currency debt.</li>
<li><strong>Mnemonic (qualitative):</strong> "<em>I Feel Much Economic Exposure</em>": Institutions, Fiscal flexibility, Monetary effectiveness, Economic flexibility, External status.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Ability + willingness</b>Countries can't be liquidated; they must choose to pay.</div>
<div class="anchor"><b>Own currency = printing press</b>Foreign currency = need reserves.</div>
<div class="anchor"><b>I-F-M-E-E</b>The five qualitative factors.</div>
<div class="anchor"><b>GO = Government taxes</b>Revenue = project cash.</div></div>`,
summary:`Sovereign credit analysis assesses both ability and willingness to pay. The five qualitative factors are institutions and policy, fiscal flexibility, monetary effectiveness (central bank independence, credibility, reserve-currency status), economic flexibility, and external status; the three quantitative factors are fiscal strength (debt/GDP, interest/revenue), economic growth and stability, and external stability (current account, reserves relative to external debt). Foreign-currency debt is generally riskier than local-currency debt, which can be serviced by money creation at the cost of inflation. Non-sovereign government issuers include agencies, government sector banks, supranationals (often highly rated) and regional governments, whose general obligation bonds are backed by tax-raising powers and whose revenue bonds depend on specific project cash flows (assessed with debt service coverage).`
},
quiz:[
{q:"Which is a qualitative factor in sovereign credit analysis?",o:["Debt-to-GDP ratio","Monetary effectiveness","Current account balance as % of GDP"],a:1,e:"Monetary effectiveness is one of the five qualitative factors; the others listed are quantitative."},
{q:"Relative to its local-currency debt, a sovereign's foreign-currency debt is generally:",o:["less risky","more risky","equally risky"],a:1,e:"The government cannot print foreign currency to repay it."},
{q:"A bond repaid from tolls on a specific bridge is a:",o:["general obligation bond","revenue bond","supranational bond"],a:1,e:"Repaid from project revenue."}]
});

/* ===================== READING 66 ===================== */
add({n:66,topic:"fi",title:"Credit Analysis for Corporate Issuers",
los:["66.a Describe the qualitative and quantitative factors used to evaluate a corporate borrower's creditworthiness.","66.b Calculate and interpret financial ratios used in credit analysis.","66.c Describe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings."],
s:{
eli5:`<p>Would you lend to a lemonade stand? You'd check: Is the business steady? Does it have lots of competitors? Is the owner honest? Then the numbers: Does it make good profits? Does it earn many times what it owes in interest each year? How big is its debt compared with what it earns?</p>
<p>And if the stand goes bust, the lenders line up to be paid from what's left, in a strict order. Lenders holding a claim on the lemon squeezer itself (secured) go first; others go later. Being near the front of the line means less risk.</p>`,
core:`<p><strong>What problem is this solving?</strong> Estimating a company's probability of default and the loss to each class of creditor, so debt can be priced and rated.</p>
<ul><li><strong>Qualitative:</strong> business model stability, industry competition and structure, business risk (cyclicality, operating leverage), corporate governance and management.</li>
<li><strong>Quantitative:</strong> profitability (EBIT margin), coverage (EBIT/interest), leverage (debt/EBITDA, retained cash flow/net debt), liquidity, recurring revenue.</li>
<li><strong>Ratios tell the story:</strong> high margin + high coverage + low leverage = low PD.</li>
<li><strong>Priority of claims</strong> determines recovery: secured (by lien order) → senior unsecured → subordinated. In practice, bankruptcy negotiations can deviate from strict priority (lower classes sometimes get something to speed agreement).</li>
<li><strong>Notching:</strong> issue ratings are moved up or down from the issuer rating (usually tied to senior unsecured) depending on seniority and collateral; more notching for lower-rated issuers, where recovery differences matter more.</li></ul>`,
formal:`<h4>Qualitative factors</h4>
<p>Business model (stability, recurring revenue, diversification), industry competition (market share, barriers), business risk (cyclicality, regulation, operating leverage), corporate governance (management track record, accounting quality, ownership structure).</p>
<h4>Quantitative factors and ratios</h4>
<ul><li><strong>Profitability:</strong> EBIT margin = EBIT/revenue.</li>
<li><strong>Coverage:</strong> EBIT/interest expense (also EBITDA/interest).</li>
<li><strong>Leverage:</strong> debt/EBITDA; retained cash flow (RCF)/net debt (RCF = CFO before working capital − dividends); FFO/debt; debt/capital.</li>
<li><strong>Liquidity:</strong> cash and available lines vs short-term obligations.</li>
<li>Higher margins and coverage, lower debt/EBITDA, higher RCF/net debt → stronger credit.</li></ul>
<h4>Seniority and priority of claims</h4>
<ol><li>First lien / first mortgage</li><li>Senior secured (second lien)</li><li>Junior secured</li><li>Senior unsecured</li><li>Senior subordinated</li><li>Subordinated</li><li>Junior subordinated</li></ol>
<ul><li>Secured debt has a direct claim on specific assets; unsecured debt a general claim. <strong>Pari passu:</strong> same-rank claims share equally.</li>
<li>Absolute priority rule (strict) vs negotiated outcomes in practice.</li>
<li><strong>Issuer (corporate family) rating:</strong> overall creditworthiness, typically for senior unsecured. <strong>Issue rating:</strong> specific debt; <strong>notching</strong> for seniority/collateral. Structural subordination: holding-company debt ranks behind operating-subsidiary debt for subsidiary assets.</li></ul>`,
math:`<div class="f"><span class="lbl">Key credit ratios</span>EBIT margin = EBIT / revenue &nbsp;·&nbsp; Coverage = EBIT / interest &nbsp;·&nbsp; Leverage = Debt / EBITDA &nbsp;·&nbsp; RCF / Net debt</div>
<div class="vars"><div><code>Net debt</code><span>Debt − cash and equivalents</span></div><div><code>RCF</code><span>Retained cash flow: operating cash flow (before working capital) minus dividends</span></div></div>
<p><strong>Why these ratios:</strong> margins show the cushion to absorb shocks, coverage shows how comfortably interest is paid, leverage shows how many years of earnings the debt represents.</p>
<div class="f"><span class="lbl">Recovery waterfall</span>Pay each class in priority order until assets run out; recovery % = amount paid / claim</div>
<div class="dir"><div>Debt/EBITDA <span class="up">↑</span> → credit quality <span class="dn">↓</span></div><div>Coverage <span class="up">↑</span>, margin <span class="up">↑</span> → credit quality <span class="up">↑</span></div><div>Higher seniority/collateral → recovery <span class="up">↑</span> → issue rating notched up</div></div>`,
example:`<div class="q">A company has revenue $1,000m, EBIT $200m, EBITDA $300m, interest $40m, debt $600m, cash $100m, retained cash flow $150m. (a) Compute EBIT margin, coverage, debt/EBITDA and RCF/net debt. (b) In liquidation, assets fetch $500m. Claims: first-lien loan $300m, senior unsecured bonds $300m, subordinated bonds $200m. Recovery for each class (strict priority)?</div>
<ol class="steps"><li><strong>EBIT margin</strong> = 200/1,000 = <strong>20%</strong>.</li>
<li><strong>Coverage</strong> = 200/40 = <strong>5.0×</strong>. <strong>Debt/EBITDA</strong> = 600/300 = <strong>2.0×</strong>.</li>
<li><strong>Net debt</strong> = 600 − 100 = 500 → <strong>RCF/net debt</strong> = 150/500 = <strong>30%</strong>.</li>
<li><strong>Waterfall:</strong> first lien gets $300m (<strong>100%</strong>); $200m remains for senior unsecured (<strong>66.7%</strong> of $300m); subordinated gets <strong>0%</strong>.</li></ol>
<p class="ans">Answers: 20%, 5.0×, 2.0×, 30% · recoveries 100% / 66.7% / 0%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Senior subordinated ranks above senior unsecured. <b>Fix:</b> senior unsecured ranks above all subordinated debt.</li>
<li><b>Trap:</b> Higher debt/EBITDA is better. <b>Fix:</b> higher = more leverage = weaker credit.</li>
<li><b>Trap:</b> Strict priority always holds. <b>Fix:</b> negotiated outcomes can deviate.</li>
<li><b>Trap:</b> Issue ratings always equal issuer ratings. <b>Fix:</b> notched for seniority/collateral.</li>
<li><b>Trap:</b> Using gross debt in RCF/net debt. <b>Fix:</b> net debt = debt − cash.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute and compare credit ratios across firms; rank debt by priority; recovery calculation; notching logic.</li>
<li><strong>Comparison tip:</strong> for "which firm is the stronger credit", tick each ratio for the better firm and count.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Margin, Coverage, Leverage</b>Profit cushion, interest comfort, debt load.</div>
<div class="anchor"><b>The bankruptcy queue</b>Secured → senior unsecured → subordinated.</div>
<div class="anchor"><b>Notch for where you stand in line</b>Issue ratings move with seniority.</div></div>`,
summary:`Corporate creditworthiness depends on qualitative factors (stable business model, low industry competition, low business risk, adequate governance) and quantitative factors (strong profitability and recurring revenue, low leverage, high coverage, ample liquidity). Key ratios are EBIT margin (EBIT/revenue), coverage (EBIT/interest), leverage (debt/EBITDA) and retained cash flow/net debt. In bankruptcy, claims are paid by priority: first lien, senior secured (second lien), junior secured, senior unsecured, senior subordinated, subordinated, junior subordinated (equal-ranking claims share pari passu), though negotiated outcomes may deviate. Issuer (corporate family) ratings reflect overall creditworthiness, typically for senior unsecured debt; issue ratings are notched up or down for seniority and collateral, since secured and senior debt have lower credit risk.`
},
quiz:[
{q:"Which ranks highest in priority of claims?",o:["Senior subordinated debt","Senior unsecured debt","Junior secured debt"],a:2,e:"Secured debt (even junior secured) ranks above unsecured debt."},
{q:"A firm has EBITDA of $250m and debt of $1,000m. Its debt/EBITDA ratio is:",o:["0.25×","4.0×","2.5×"],a:1,e:"1,000/250 = 4.0×."},
{q:"Notching refers to:",o:["adjusting an issue rating from the issuer rating based on seniority","changing a sovereign's rating","adjusting coupon rates after a downgrade"],a:0,e:"Issue ratings are notched up/down relative to the issuer rating."}]
});

add({n:67,topic:"fi",title:"Fixed-Income Securitization",
los:["67.a Explain benefits of securitization for issuers, investors, economies, and financial markets.","67.b Describe securitization, including the parties and the roles they play."],
s:{
eli5:`<p>A bank has made 10,000 car loans. That money is stuck until borrowers repay over five years. With <strong>securitization</strong>, the bank sells the whole bundle of loans to a separate company created just for this purpose. That company pays for them by selling bonds to investors, and the borrowers' monthly payments flow through to those investors.</p>
<p>The bank gets its cash back right away and can lend again. Investors get a new kind of bond backed by thousands of loans, sliced to suit different appetites for risk.</p>`,
core:`<p><strong>What problem is this solving?</strong> Loans on bank balance sheets are illiquid and tie up capital. Securitization turns them into tradable securities, moving funding from banks to capital markets, lowering funding costs and spreading risk to investors who want it.</p>
<ul><li><strong>The SPE is the key:</strong> it's legally separate (bankruptcy-remote) from the seller, so investors are exposed only to the asset pool, not the seller's other problems. That can let the securities earn a higher rating than the seller.</li>
<li><strong>Benefits:</strong> originators get liquidity, fee income, capital relief and can lend more; investors get tailored risk/return (tranches) and access to assets they couldn't buy directly; economies get lower financing costs, more lending, better liquidity and efficiency.</li>
<li><strong>Risks to investors:</strong> uncertain timing and amount of cash flows (prepayments, defaults), credit risk of the collateral, complexity, and misaligned incentives (originate-to-distribute can weaken lending standards, as in 2007–08).</li></ul>`,
formal:`<h4>Parties and roles</h4>
<ul><li><strong>Seller (originator/depositor):</strong> originates loans and sells them to the SPE to raise funds.</li>
<li><strong>Special purpose entity (SPE/SPV, issuer, trust):</strong> bankruptcy-remote entity that buys the assets and issues asset-backed securities (ABS) backed by them.</li>
<li><strong>Servicer:</strong> collects payments, handles delinquencies and foreclosures; may be the seller or a third party.</li>
<li>Others: underwriters/arrangers, trustee (represents investors), rating agencies, credit enhancement providers.</li></ul>
<h4>Process</h4>
<ol><li>Seller originates loans (collateral pool).</li><li>Sells pool to SPE (true sale).</li><li>SPE issues ABS (often in tranches) to investors; proceeds pay the seller.</li><li>Servicer collects borrower payments; cash flows to investors per the waterfall.</li></ol>
<h4>Benefits</h4>
<ul><li><strong>Originators:</strong> increased business activity by re-lending proceeds; profit from fees for originating and arranging; lower capital reserves (assets off balance sheet); increased liquidity of the collateral.</li>
<li><strong>Investors:</strong> risk/return tailored via tranching; access to collateral otherwise hard to buy; more liquidity than underlying loans.</li>
<li><strong>Economies and markets:</strong> lower liquidity risk; improved market efficiency; lower financing costs and leverage for originators; disintermediation (capital markets fund lending).</li></ul>
<h4>Risks</h4><p>Uncertain size and timing of cash flows (prepayment and default), credit risk of collateral, complexity/model risk, moral hazard in origination.</p>`,
math:`<p>Securitization is structural; the "math" is the cash-flow chain.</p>
<div class="f"><span class="lbl">Cash-flow chain</span>Borrowers' payments → Servicer → SPE (trust) → Investors (by tranche priority) &nbsp;·&nbsp; Investor money → SPE → Seller</div>
<div class="f"><span class="lbl">Bankruptcy remoteness</span>Seller bankrupt ≠ SPE assets at risk → ABS credit depends on the pool, not the seller</div>
<div class="dir"><div>Better collateral quality → higher ABS ratings, lower yields</div><div>Weaker lending standards (originate-to-distribute) → hidden credit risk <span class="up">↑</span></div></div>`,
example:`<div class="q">An auto finance company (rated BB) holds $1 billion of prime auto loans. It sells them to a newly formed trust, which issues $1 billion of bonds to investors; the company continues to collect payments for a fee. (a) Identify the seller, SPE and servicer. (b) Why can the senior bonds be rated AAA even though the company is BB? (c) List two benefits to the company and one risk to investors.</div>
<ol class="steps"><li><strong>Seller:</strong> the auto finance company. <strong>SPE:</strong> the trust. <strong>Servicer:</strong> the auto finance company (for a fee).</li>
<li><strong>Rating:</strong> the trust is bankruptcy-remote; investors rely on the loan pool and credit enhancement (e.g., subordination), not on the company's own creditworthiness.</li>
<li><strong>Benefits:</strong> immediate liquidity to make new loans; servicing/arranging fees; capital relief. <strong>Risk:</strong> prepayment/default variability in the pool's cash flows (and servicer risk).</li></ol>
<p class="ans">Answers: company/trust/company · bankruptcy remoteness + enhancement · liquidity, fees, capital relief; cash-flow uncertainty</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> ABS investors are exposed to the seller's credit. <b>Fix:</b> mainly to the collateral pool (bankruptcy-remote SPE); servicer risk aside.</li>
<li><b>Trap:</b> The servicer must be a third party. <b>Fix:</b> often the seller itself.</li>
<li><b>Trap:</b> Securitization increases banks' capital requirements. <b>Fix:</b> it reduces them (assets off balance sheet).</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> identify parties; benefits to originators/investors/economy; why SPE matters; risks.</li>
<li>Quick definitional reading.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Loans → bonds</b>Securitization repackages illiquid loans into tradable securities.</div>
<div class="anchor"><b>Seller, SPE, Servicer</b>The three S's.</div>
<div class="anchor"><b>Firewall</b>The SPE shields investors from the seller's bankruptcy.</div></div>`,
summary:`Securitization pools financial assets (loans, receivables) and sells them to a bankruptcy-remote special purpose entity, which issues asset-backed securities whose payments come from the pool; the seller (originator) raises funds, the SPE issues the securities, and the servicer (often the seller) collects payments. Originators benefit from re-lending proceeds, fee income, lower capital reserves and more liquid collateral; investors gain tailored risk/return through tranching, access to otherwise unavailable collateral and greater liquidity; economies and markets benefit from lower liquidity risk, greater efficiency and lower financing costs. Investors face uncertain timing and size of cash flows and the credit risk of the collateral.`
},
quiz:[
{q:"In a securitization, the entity that purchases the assets and issues the securities is the:",o:["servicer","special purpose entity","originator"],a:1,e:"The SPE buys the pool and issues ABS."},
{q:"A key benefit of securitization for the originating bank is:",o:["higher capital reserve requirements","the ability to re-lend the proceeds","eliminating all credit risk for investors"],a:1,e:"Selling loans frees funds to originate new loans and reduces capital needs."},
{q:"Because the SPE is bankruptcy-remote, ABS investors are primarily exposed to:",o:["the seller's overall credit risk","the credit risk of the collateral pool","no credit risk at all"],a:1,e:"Payments depend on the pool, not the seller's solvency."}]
});
