add({n:72,topic:"der",title:"Derivative Benefits, Risks, and Issuer and Investor Uses",
los:["72.a Describe benefits and risks of derivative instruments.","72.b Compare the use of derivatives among issuers and investors."],
s:{
eli5:`<p>Derivatives are power tools. Used well, they let a company protect itself from swings in fuel prices, interest rates or currencies, and let investors adjust their portfolios quickly and cheaply. Used badly, they can blow up, because a small amount of money controls a big bet, and if your hedge doesn't exactly match what you're protecting, or the other side can't pay, you can get hurt.</p>`,
core:`<p><strong>What problem is this solving?</strong> Separating and transferring risk to those best able to bear it, and doing so efficiently, while being aware of the dangers.</p>
<ul><li><strong>Benefits:</strong> risk transfer and hedging; price and volatility discovery (futures prices and implied volatilities reveal expectations); operational advantages: low transaction costs, easy shorting, leverage, liquidity; improved market efficiency (arbitrage keeps prices aligned).</li>
<li><strong>Risks:</strong> implicit leverage (large exposure for little cash), basis risk (hedge underlying ≠ exposure, or timing mismatch), liquidity risk (margin calls and settlement cash needs), counterparty credit risk (OTC), systemic risk (interconnections, as in 2008), plus complexity and model risk.</li>
<li><strong>Issuers (corporations, governments)</strong> mainly hedge: interest-rate swaps to change fixed/floating debt mix, FX forwards for foreign sales/costs, commodity hedges for inputs, often under hedge accounting to reduce earnings volatility (cash flow hedges, fair value hedges, net investment hedges).</li>
<li><strong>Investors</strong> use derivatives to modify portfolio exposures: add or reduce market exposure (index futures), change duration (bond futures, swaps), hedge currency, express views, replicate asset classes cheaply, generate income (covered calls).</li></ul>`,
formal:`<h4>Benefits</h4>
<ul><li>Risk allocation, transfer and management.</li>
<li>Information discovery: expected prices (futures/forwards) and volatility (options).</li>
<li>Operational advantages: lower transaction costs than cash markets; ease of short positions; leverage; greater liquidity.</li>
<li>Market efficiency: arbitrage corrects mispricing.</li></ul>
<h4>Risks</h4>
<ul><li><strong>Implicit leverage:</strong> small price moves create large % gains/losses on capital.</li>
<li><strong>Basis risk:</strong> imperfect hedge (different underlying, maturity, or location).</li>
<li><strong>Liquidity risk:</strong> cash needed for margin/settlement before the hedged item generates cash.</li>
<li><strong>Counterparty credit risk:</strong> OTC counterparty may default (mitigated by collateral and central clearing).</li>
<li><strong>Systemic risk:</strong> excessive speculation and interconnected exposures can destabilize markets.</li></ul>
<h4>Uses by issuers</h4>
<ul><li>Hedge interest rate, currency and commodity risks to stabilize cash flows, asset/liability values and earnings.</li>
<li><strong>Hedge accounting:</strong> cash flow hedge (variable cash flows, e.g., floating-rate debt swapped to fixed), fair value hedge (fixed-rate debt swapped to floating, inventory), net investment hedge (foreign subsidiary's value, e.g., FX forwards or foreign-currency debt).</li></ul>
<h4>Uses by investors</h4>
<ul><li>Modify exposure (beta, duration, currency) quickly and cheaply; replicate cash positions; implement views; hedge; create leverage; generate income; arbitrage.</li>
<li>Investors usually manage risk at the portfolio level and do not need hedge accounting.</li></ul>`,
math:`<div class="f"><span class="lbl">Implicit leverage</span>Return on margin ≈ (exposure / margin) × underlying return</div>
<div class="f"><span class="lbl">Basis</span>Basis = spot price of hedged item − futures price of hedge instrument → basis risk = uncertainty in the basis</div>
<p><strong>Why leverage cuts both ways:</strong> with $10 of margin controlling $100 of exposure, a 5% move in the underlying is a 50% gain or loss on the margin.</p>
<div class="dir"><div>Hedge underlying differs from exposure → basis risk <span class="up">↑</span></div><div>Central clearing/collateral → counterparty risk <span class="dn">↓</span> but liquidity needs <span class="up">↑</span></div></div>`,
example:`<div class="q">Classify each use and the main risk: (a) An airline hedges jet fuel costs with crude oil futures. (b) A company with floating-rate bank debt enters a swap to pay fixed. (c) A pension fund sells equity index futures to temporarily cut equity exposure without selling stocks. (d) A US company hedges the euro value of its German subsidiary with a EUR forward. (e) A trader posts $10,000 margin to control $200,000 of futures; the underlying falls 5%.</div>
<ol class="steps"><li><strong>(a)</strong> Issuer hedge (cash flow); <strong>basis risk</strong> (crude ≠ jet fuel).</li>
<li><strong>(b)</strong> Issuer hedge: <strong>cash flow hedge</strong> (fixes variable interest payments).</li>
<li><strong>(c)</strong> Investor use: modify exposure cheaply and quickly (lower transaction costs); risk: basis/tracking between portfolio and index.</li>
<li><strong>(d)</strong> Issuer: <strong>net investment hedge</strong>.</li>
<li><strong>(e)</strong> Loss = 5% × 200,000 = $10,000 = <strong>100% of margin</strong>: implicit leverage (20×).</li></ol>
<p class="ans">Answers: cash flow hedge/basis risk · cash flow hedge · investor exposure change · net investment hedge · −100% of margin</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Derivatives eliminate all risk when hedging. <b>Fix:</b> basis, liquidity and counterparty risks remain.</li>
<li><b>Trap:</b> Swapping fixed debt to floating is a cash flow hedge. <b>Fix:</b> that's a fair value hedge; floating → fixed is a cash flow hedge.</li>
<li><b>Trap:</b> Investors need hedge accounting like issuers. <b>Fix:</b> typically not; they manage at portfolio level.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> list benefits/risks; identify basis risk; classify hedge type; issuer vs investor use.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Power tool</b>Useful, cheap, fast, dangerous if misused.</div>
<div class="anchor"><b>Hedge with crude, fly on jet fuel</b>Basis risk.</div>
<div class="anchor"><b>Float→Fix = Cash flow; Fix→Float = Fair value</b>Hedge accounting types.</div></div>`,
summary:`Derivatives let users transfer and manage risk, reveal information about expected prices and volatility, offer operational advantages (low costs, easy shorting, leverage, liquidity) and improve market efficiency. Their risks include implicit leverage, basis risk from imperfect hedges, liquidity risk from margin and settlement cash needs, counterparty credit risk and systemic risk. Issuers use derivatives to hedge interest rate, currency and commodity exposures and reduce volatility in cash flows, balance sheet values and earnings, often qualifying for hedge accounting (cash flow, fair value and net investment hedges). Investors use derivatives to modify portfolio exposures, replicate positions, express views, hedge and generate income, usually without hedge accounting.`
},
quiz:[
{q:"An airline hedges jet fuel purchases using heating oil futures. The main risk that remains is:",o:["systemic risk","basis risk","no risk"],a:1,e:"The hedge instrument's underlying differs from the exposure."},
{q:"A company swaps its floating-rate debt into fixed-rate payments. For accounting purposes this is most likely a:",o:["fair value hedge","cash flow hedge","net investment hedge"],a:1,e:"It stabilizes variable interest cash flows."},
{q:"Which is a benefit of derivatives?",o:["Implicit leverage that magnifies losses","Information discovery about expected volatility","Counterparty credit risk"],a:1,e:"Option prices reveal implied volatility; the others are risks."}]
});

/* ===================== READING 73 ===================== */
add({n:73,topic:"der",title:"Arbitrage, Replication, and the Cost of Carry in Pricing Derivatives",
los:["73.a Explain how the concepts of arbitrage and replication are used in pricing derivatives.","73.b Explain the difference between the spot and expected future price of an underlying and the cost of carry associated with holding the underlying asset."],
s:{
eli5:`<p>If the same apple sells for $1 at one shop and $1.20 next door, you'd buy at one and sell at the other for free money. That's <strong>arbitrage</strong>, and traders pounce on it so fast that prices quickly line up.</p>
<p>A forward price works the same way. Instead of agreeing to buy gold in a year, you could buy it today with borrowed money and store it. So the fair forward price is just: today's price + the interest on the borrowed money + storage costs − any income the asset pays you. If the forward price were anything else, someone could make free money. That's the <strong>cost of carry</strong>.</p>`,
core:`<p><strong>What problem is this solving?</strong> Pricing derivatives without needing to predict the future. If a derivative can be <em>replicated</em> with the underlying and borrowing/lending, its price must equal the replication cost; otherwise arbitrage profits exist.</p>
<ul><li><strong>Law of one price:</strong> identical future cash flows must have the same price today.</li>
<li><strong>Replication:</strong> long forward ≡ buy the asset with borrowed money (and hold to T). So F₀ = S₀(1 + r)<sup>T</sup> with no carry costs/benefits.</li>
<li><strong>Forward price ≠ expected future spot:</strong> the forward price doesn't depend on investors' expectations or risk premia; it's set by no-arbitrage. The expected spot price includes a risk premium; the forward doesn't need one because the replicating position is riskless.</li>
<li><strong>Cost of carry:</strong> costs of holding (financing, storage, insurance) raise the forward price; benefits (dividends, coupons, convenience yield) lower it.</li>
<li><strong>Arbitrage direction:</strong> forward too high → sell forward, buy spot (cash-and-carry); forward too low → buy forward, short spot (reverse cash-and-carry).</li></ul>`,
formal:`<h4>Arbitrage and replication</h4>
<ul><li>Arbitrage: riskless profit with no net investment, from mispricing between equivalent positions. Arbitrage activity pushes prices to no-arbitrage values.</li>
<li>Replication: creating a portfolio of cash-market instruments (underlying + risk-free borrowing/lending) with the same payoff as the derivative in all states.</li>
<li>Assumptions: no transaction costs, ability to short sell, borrow/lend at risk-free rate (in practice, costs create a no-arbitrage band).</li></ul>
<h4>No-arbitrage forward price</h4>
<ul><li>No carry: F₀(T) = S₀(1 + r)<sup>T</sup>.</li>
<li>With costs and benefits: F₀(T) = (S₀ + PV(costs) − PV(benefits)) × (1 + r)<sup>T</sup>; continuous form F₀ = S₀e<sup>(r + c − i)T</sup>.</li>
<li><strong>Cash-and-carry arbitrage</strong> (forward too high): borrow S₀, buy asset, sell forward; at T deliver asset, repay loan, keep difference.</li>
<li><strong>Reverse cash-and-carry</strong> (forward too low): short asset, invest proceeds, buy forward; at T take delivery, return asset.</li></ul>
<h4>Spot vs expected future price</h4>
<p>Expected future spot price E(S<sub>T</sub>) = S₀(1 + r + λ)<sup>T</sup> (includes risk premium λ); forward price uses only r (and carry), because the hedged replicating position is riskless. Hence derivative pricing is "risk-neutral".</p>`,
math:`<div class="f"><span class="lbl">Forward price (cost of carry)</span>F₀(T) = [S₀ + PV(costs) − PV(benefits)] × (1 + r)<sup>T</sup> &nbsp;·&nbsp; continuous: F₀ = S₀ × e<sup>(r + c − i)T</sup></div>
<div class="vars"><div><code>S₀</code><span>Spot price today</span></div><div><code>r</code><span>Risk-free rate (financing cost)</span></div><div><code>costs</code><span>Storage, insurance (raise F)</span></div><div><code>benefits</code><span>Dividends, coupons, convenience yield (lower F)</span></div></div>
<p><strong>Why it works:</strong> the forward buyer avoids paying for the asset now (saving interest) and avoids storage costs, but forgoes income. The forward price must make owning-now and buying-forward equally attractive.</p>
<div class="f"><span class="lbl">Arbitrage rules</span>F<sub>market</sub> &gt; F<sub>no-arb</sub> → sell forward + buy spot &nbsp;·&nbsp; F<sub>market</sub> &lt; F<sub>no-arb</sub> → buy forward + short spot</div>
<div class="dir"><div>r <span class="up">↑</span> or storage costs <span class="up">↑</span> → F <span class="up">↑</span></div><div>Dividends/coupons/convenience yield <span class="up">↑</span> → F <span class="dn">↓</span></div></div>
<div class="calc" data-calc="fwd"></div>`,
example:`<div class="q">A non-dividend stock trades at $100; the 1-year risk-free rate is 5%. (a) No-arbitrage 1-year forward price? (b) A dealer quotes $107. Show the arbitrage and profit per share. (c) If instead the stock will pay dividends with PV $2, what's the forward price? (d) Why doesn't the forward price depend on the expected return of the stock (say 10%)?</div>
<ol class="steps"><li><strong>F₀</strong> = 100 × 1.05 = <strong>$105</strong>.</li>
<li><strong>Forward too high (107 &gt; 105):</strong> cash-and-carry: borrow $100 at 5%, buy the stock, sell forward at $107. At T: deliver the stock for $107, repay $105 → <strong>$2 riskless profit</strong>.</li>
<li><strong>With dividends:</strong> (100 − 2) × 1.05 = <strong>$102.90</strong>: income lowers the forward price.</li>
<li><strong>No expectations needed:</strong> the forward can be replicated with a riskless combination of stock + borrowing, so only the risk-free rate (and carry) matters; the 10% expected return includes a risk premium that hedgers don't need.</li></ol>
<p class="ans">Answers: $105 · borrow, buy, sell forward → $2 · $102.90 · replication is riskless</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Forward price = expected future spot price. <b>Fix:</b> forward is a no-arbitrage price using r, not expectations.</li>
<li><b>Trap:</b> Benefits raise forward prices. <b>Fix:</b> benefits lower them; costs raise them.</li>
<li><b>Trap:</b> Getting the arbitrage direction backwards. <b>Fix:</b> sell what's expensive, buy what's cheap: forward too high → sell forward.</li>
<li><b>Trap:</b> Compounding the dividend instead of subtracting its PV first. <b>Fix:</b> (S₀ − PV(div)) × (1 + r)<sup>T</sup>.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute no-arbitrage forward with/without carry; describe arbitrage steps; effect of carry costs/benefits; forward vs expected spot.</li>
<li><strong>Arbitrage checklist:</strong> (1) compute fair F; (2) compare with market; (3) sell the expensive side, buy the cheap side; (4) profit = difference.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Two shops, one apple</b>Same payoff, same price.</div>
<div class="anchor"><b>Buy now with borrowed money</b>Replicating a long forward.</div>
<div class="anchor"><b>Costs up, benefits down</b>Carry costs raise F; income lowers F.</div>
<div class="anchor"><b>Sell high, buy low</b>Arbitrage direction.</div></div>`,
summary:`Derivative pricing relies on no-arbitrage: positions with identical future payoffs must have the same price, and arbitrage trades (selling the overpriced side, buying the underpriced side) push prices back into line. Replication creates the derivative's payoff from the underlying plus risk-free borrowing or lending, so a forward's no-arbitrage price is the spot price compounded at the risk-free rate, F₀ = S₀(1 + r)<sup>T</sup>, adjusted for carry: costs of holding (financing, storage) raise the forward price and benefits (dividends, coupons, convenience yield) lower it: F₀ = (S₀ + PV costs − PV benefits)(1 + r)<sup>T</sup>. If the forward is too high, do cash-and-carry (borrow, buy spot, sell forward); if too low, reverse cash-and-carry. The forward price differs from the expected future spot price, which includes a risk premium, because the replicating position is riskless.`
},
quiz:[
{q:"A stock trades at 50 and pays no dividends; r = 4% for 1 year. The forward is quoted at 51. An arbitrageur should:",o:["sell the forward and buy the stock","buy the forward and short the stock","do nothing"],a:1,e:"Fair F = 52; market 51 is too low → buy forward, short stock, invest proceeds: profit 1."},
{q:"An increase in the convenience yield of a commodity will:",o:["increase its no-arbitrage forward price","decrease its no-arbitrage forward price","not affect the forward price"],a:1,e:"Benefits of holding reduce the forward price."},
{q:"The no-arbitrage forward price of an asset depends on:",o:["investors' expected future spot price","the spot price, risk-free rate and carry costs/benefits","the asset's risk premium"],a:1,e:"Replication uses only S₀, r and carry."}]
});

/* ===================== READING 74 ===================== */
add({n:74,topic:"der",title:"Pricing and Valuation of Forward Contracts and for an Underlying with Varying Maturities",
los:["74.a Explain how the value and price of a forward contract are determined at initiation, during the life of the contract, and at expiration.","74.b Explain how forward rates are determined for interest rate forward contracts and describe the uses of these forward rates."],
s:{
eli5:`<p>The <strong>price</strong> of a forward is the number written in the contract: "I'll buy at $105 in a year". That never changes. The <strong>value</strong> is how good the deal is for you right now. On day one, it's a fair deal: value zero. Six months later, if the asset has jumped in price, your right to buy at $105 is worth something: positive value for the buyer, negative for the seller. At the end, the value is simply the market price minus $105.</p>
<p>For interest rates, a <strong>forward rate agreement (FRA)</strong> locks in a borrowing rate for a future period, like reserving next year's mortgage rate today.</p>`,
core:`<p><strong>What problem is this solving?</strong> Distinguishing the fixed contract price from the changing contract value, so positions can be marked to market, and pricing forward interest rates for hedging future borrowing/lending.</p>
<ul><li><strong>At initiation:</strong> value = 0, price F₀(T) set by no-arbitrage.</li>
<li><strong>During the life:</strong> value to long = current spot (adjusted for carry) − PV of the contract price: you could replicate a new position, and the difference between the old and new deal is the value.</li>
<li><strong>At expiration:</strong> value to long = S<sub>T</sub> − F₀(T).</li>
<li><strong>Implied forward rates</strong> come from spot (zero) rates: investing for the long period must equal investing for the short period and rolling at the forward rate.</li>
<li><strong>FRAs:</strong> the long (fixed-rate payer) pays the FRA rate and receives the reference rate on a notional; gains if rates rise. Used by banks and companies to hedge future borrowing/lending rates.</li></ul>`,
formal:`<h4>Forward value over time</h4>
<ul><li>t = 0: V₀ = 0; F₀(T) = S₀(1 + r)<sup>T</sup> (adjusted for carry).</li>
<li>0 &lt; t &lt; T: V<sub>t</sub>(long) = S<sub>t</sub> − F₀(T)/(1 + r)<sup>T−t</sup> (minus PV of remaining benefits, plus PV of remaining costs if any). V<sub>t</sub>(short) = −V<sub>t</sub>(long).</li>
<li>t = T: V<sub>T</sub>(long) = S<sub>T</sub> − F₀(T).</li>
<li>The price (F₀) is fixed; the value fluctuates with the underlying and rates.</li></ul>
<h4>Interest rate forwards</h4>
<ul><li>Implied forward rate F<sub>A,B−A</sub> from zero rates: (1 + z<sub>B</sub>)<sup>B</sup> = (1 + z<sub>A</sub>)<sup>A</sup>(1 + F)<sup>B−A</sup>. Notation "AyBy" (e.g., 2y3y = 3-year rate 2 years forward).</li>
<li>Implied forwards can only be derived for periods within the range of available zero rates.</li>
<li><strong>Forward rate agreement (FRA):</strong> OTC contract; fixed-rate payer (long) pays the FRA rate, receives the market reference rate (MRR) on a notional for a future period; cash-settled (usually discounted to settlement date). Long FRA gains when rates rise (hedges future borrowing); short gains when rates fall (hedges future lending).</li>
<li>Uses: hedging future funding costs, managing interest-sensitive assets/liabilities, locking in reinvestment rates; forward curve indicates break-even rates for investment decisions.</li></ul>`,
math:`<div class="f"><span class="lbl">Forward value</span>t = 0: V = 0 &nbsp;·&nbsp; 0 &lt; t &lt; T: V<sub>long</sub> = S<sub>t</sub> − F₀(T)/(1 + r)<sup>T−t</sup> &nbsp;·&nbsp; t = T: V<sub>long</sub> = S<sub>T</sub> − F₀(T)</div>
<p><strong>Why:</strong> if you entered a new forward now, its price would be S<sub>t</sub>(1 + r)<sup>T−t</sup>. Your old contract lets you buy at F₀ instead; the PV of that difference is the value.</p>
<div class="f"><span class="lbl">Implied forward rate</span>(1 + z<sub>B</sub>)<sup>B</sup> = (1 + z<sub>A</sub>)<sup>A</sup> × (1 + F<sub>AyB−A</sub>)<sup>B−A</sup></div>
<div class="f"><span class="lbl">FRA payoff to long (fixed payer), simplified</span>Payoff = (MRR − FRA rate) × notional × (days/360), discounted at MRR to settlement</div>
<div class="dir"><div>S<sub>t</sub> <span class="up">↑</span> → long forward value <span class="up">↑</span></div><div>Reference rate &gt; FRA rate → long FRA gains</div></div>
<div class="calc" data-calc="fwd"></div>
<div class="calc" data-calc="impfwd"></div>`,
example:`<div class="q">(a) A 1-year forward on a non-dividend stock is entered at S₀ = $100, r = 5%. Forward price? (b) Six months later S = $104 and r is still 5%. Value to long and short? (c) At expiration S = $98. Value to long? (d) Zero rates: 2-year 3%, 5-year 4%. Find the 2y3y implied forward rate. (e) A company will borrow in 6 months for 3 months and fears rising rates. Long or short FRA?</div>
<ol class="steps"><li><strong>F₀</strong> = 100 × 1.05 = <strong>$105</strong>.</li>
<li><strong>t = 0.5:</strong> V<sub>long</sub> = 104 − 105/1.05<sup>0.5</sup> = 104 − 102.47 = <strong>+$1.53</strong>; short = <strong>−$1.53</strong>.</li>
<li><strong>Expiration:</strong> V<sub>long</sub> = 98 − 105 = <strong>−$7</strong> (short +$7).</li>
<li><strong>2y3y:</strong> (1.04<sup>5</sup>/1.03<sup>2</sup>)<sup>1/3</sup> − 1 = <strong>4.67%</strong>.</li>
<li><strong>Long FRA</strong> (pay fixed, receive floating): gains if rates rise, offsetting higher borrowing cost.</li></ol>
<p class="ans">Answers: $105 · +$1.53 / −$1.53 · −$7 · 4.67% · long FRA</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Confusing price and value. <b>Fix:</b> price fixed in the contract; value changes (starts at zero).</li>
<li><b>Trap:</b> Value during life = S<sub>t</sub> − F₀. <b>Fix:</b> discount F₀ to time t.</li>
<li><b>Trap:</b> A company hedging future borrowing should short an FRA. <b>Fix:</b> go long (receive floating if rates rise).</li>
<li><b>Trap:</b> Deriving forwards beyond the available zero curve. <b>Fix:</b> can't compute, e.g., a 4-year forward from rates up to 3 years.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> forward value at initiation/during/expiration; AyBy notation; implied forward from zero rates; FRA long/short logic.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Price is the number, value is the deal</b>Price fixed, value floats.</div>
<div class="anchor"><b>Zero, then S − PV(F), then S − F</b>Value at start, middle, end.</div>
<div class="anchor"><b>Long FRA = borrower's shield</b>Gains when rates rise.</div></div>`,
summary:`A forward contract's price F₀(T) is fixed at initiation by no-arbitrage, and its value is zero at that time. During its life, the value to the long is the spot price minus the present value of the forward price (S<sub>t</sub> − F₀(T)/(1 + r)<sup>T−t</sup>, adjusted for remaining carry), with the short's value the negative of this; at expiration the long's value is S<sub>T</sub> − F₀(T). Implied forward rates (AyBy notation) are the rates that equate investing for the full period with investing for the shorter period and rolling over: (1 + z<sub>B</sub>)<sup>B</sup> = (1 + z<sub>A</sub>)<sup>A</sup>(1 + F)<sup>B−A</sup>, derivable only within the available zero curve. In a forward rate agreement, the fixed-rate payer (long) pays the forward rate and receives the reference rate on a notional, gaining when rates rise; FRAs are used mainly by financial institutions to manage interest-sensitive assets and liabilities.`
},
quiz:[
{q:"At initiation, the value of a forward contract to the long is:",o:["S₀","zero","F₀"],a:1,e:"Price set so value is zero."},
{q:"'2y3y' refers to a:",o:["2-year rate starting in 3 years","3-year rate starting in 2 years","5-year spot rate"],a:1,e:"AyBy: B-year rate A years forward."},
{q:"During the life of a forward, if the spot price of the underlying rises significantly, the value of the contract:",o:["rises for the long","rises for the short","stays at zero"],a:0,e:"The long's right to buy at the fixed price becomes more valuable."}]
});

/* ===================== READING 75 ===================== */
add({n:75,topic:"der",title:"Pricing and Valuation of Futures Contracts",
los:["75.a Compare the value and price of forward and futures contracts.","75.b Explain why forward and futures prices differ."],
s:{
eli5:`<p>A forward is like settling a bet once at the end. A future is like settling the same bet every evening: whoever lost that day pays the winner, and the "bet price" is reset to today's closing price. So at the end of each day a futures contract is worth zero again; all gains and losses have already been paid.</p>
<p>Usually forward and futures prices are nearly the same. They differ slightly when daily cash flows can be reinvested at rates that move with the futures price: if you tend to receive cash when rates are high (and pay when they're low), futures are a bit better for you.</p>`,
core:`<p><strong>What problem is this solving?</strong> Understanding how daily settlement changes the value and price of futures relative to forwards, and why interest rate futures and FRAs can differ (convexity bias).</p>
<ul><li><strong>Forward:</strong> price fixed; value accumulates over the life and is paid at expiration.</li>
<li><strong>Futures:</strong> marked to market daily; gains/losses settled in cash; contract price resets to the settlement price, so value returns to zero after each settlement.</li>
<li><strong>Why prices differ:</strong> with daily settlement, the timing of cash flows matters if interest rates are correlated with futures prices. Positive correlation → long futures receives cash when rates are high (reinvest at high rates) and pays when rates are low (borrow cheaply) → futures more valuable → futures price &gt; forward price. Negative correlation → futures price &lt; forward. No correlation/constant rates → equal.</li>
<li><strong>Interest rate futures</strong> are quoted on a price basis: 100 − (100 × annualized MRR). Their price moves inversely to rates, while an FRA's payoff is linear in rates; the difference creates a convexity bias between futures-implied and forward rates.</li></ul>`,
formal:`<h4>Value vs price</h4>
<table><tr><th></th><th>Forward</th><th>Futures</th></tr>
<tr><td>Price over life</td><td>Constant (contract price)</td><td>Changes daily (reset to settlement price)</td></tr>
<tr><td>Value over life</td><td>Fluctuates; realized at expiration</td><td>Zero after each daily settlement; between settlements = change in futures price since last settlement</td></tr>
<tr><td>Cash flows</td><td>At expiration</td><td>Daily (variation margin)</td></tr>
<tr><td>Credit risk</td><td>Counterparty</td><td>Minimal (clearinghouse)</td></tr></table>
<h4>Why forward and futures prices differ</h4>
<ul><li>Positive correlation between interest rates and futures prices → futures more attractive to longs → futures price &gt; forward price.</li>
<li>Negative correlation → futures price &lt; forward price.</li>
<li>Uncorrelated or constant rates → futures price = forward price.</li>
<li>Other differences: liquidity, credit risk, transaction costs.</li></ul>
<h4>Interest rate futures</h4>
<ul><li>Quote: futures price = 100 − (100 × MRR<sub>A,B−A</sub>), i.e., 100 minus the annualized rate in %.</li>
<li>Basis point value of a contract = notional × 0.0001 × period (e.g., 3-month on $1m: $25 per bp).</li>
<li><strong>Convexity bias:</strong> futures price is linear in the rate, but FRA value is nonlinear (discounted), so futures-implied rates differ from forward rates; the long FRA position benefits from convexity.</li></ul>`,
math:`<div class="f"><span class="lbl">Daily settlement</span>Daily gain/loss = (today's settlement − yesterday's settlement) × contract size → contract value resets to 0</div>
<div class="f"><span class="lbl">Interest rate futures quote</span>Futures price = 100 − (100 × MRR) &nbsp;(MRR in decimals; e.g., 3.25% → 96.75)</div>
<div class="f"><span class="lbl">Price relationship</span>corr(rates, futures price) &gt; 0 → F<sub>futures</sub> &gt; F<sub>forward</sub>; &lt; 0 → F<sub>futures</sub> &lt; F<sub>forward</sub>; = 0 → equal</div>
<p><strong>Why correlation matters:</strong> a long futures position gets daily cash when prices rise. If that's also when rates are high, the cash earns more, a small built-in advantage that the market prices in.</p>
<div class="dir"><div>Rates <span class="up">↑</span> → interest rate futures price <span class="dn">↓</span></div><div>Positive rate/price correlation → futures preferred → higher futures price</div></div>`,
example:`<div class="q">(a) A trader buys one futures contract on 1,000 units at $50.00. Daily settlements: Day 1 $51.20, Day 2 $50.40. Daily cash flows to the long, and the contract value after each settlement? (b) A 3-month MRR futures contract is priced at 96.75. Implied rate? If the rate rises to 3.50%, the new price? (c) If interest rates are positively correlated with gold futures prices, will gold futures trade above or below gold forwards?</div>
<ol class="steps"><li><strong>Day 1:</strong> (51.20 − 50.00) × 1,000 = <strong>+$1,200</strong> credited; value resets to 0, contract price now 51.20.</li>
<li><strong>Day 2:</strong> (50.40 − 51.20) × 1,000 = <strong>−$800</strong> debited; value resets to 0.</li>
<li><strong>Implied rate</strong> = 100 − 96.75 = <strong>3.25%</strong>; at 3.50%, price = <strong>96.50</strong>.</li>
<li><strong>Positive correlation</strong> → futures more valuable to longs → futures price <strong>above</strong> forward price.</li></ol>
<p class="ans">Answers: +$1,200 then −$800, value 0 after each settlement · 3.25% → 96.50 · above</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Futures value accumulates like a forward. <b>Fix:</b> marked to market daily; value resets to zero.</li>
<li><b>Trap:</b> Interest rate futures price rises with rates. <b>Fix:</b> price = 100 − rate → moves inversely.</li>
<li><b>Trap:</b> Positive correlation makes futures cheaper. <b>Fix:</b> it makes futures more valuable → higher price.</li>
<li><b>Trap:</b> Forward and futures prices always equal. <b>Fix:</b> only when rates are constant or uncorrelated with futures prices.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> value of futures after settlement; daily margin flows; forward vs futures price under correlation; interest rate futures quotes; convexity bias concept.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Settle every evening</b>Futures value back to zero daily.</div>
<div class="anchor"><b>Cash when rates are high = bonus</b>Positive correlation → futures &gt; forwards.</div>
<div class="anchor"><b>100 minus the rate</b>Interest rate futures quote.</div></div>`,
summary:`A forward contract's price is constant while its value fluctuates and is realized at expiration; a futures contract is marked to market daily, with gains and losses settled in cash and the contract price reset to the settlement price, so its value returns to zero after each settlement. Forward and futures prices are equal if interest rates are constant or uncorrelated with futures prices; if rates and futures prices are positively correlated, futures are more valuable and priced above forwards, and if negatively correlated, below. Interest rate futures are quoted as 100 − (100 × annualized MRR), so prices move inversely with rates, and the difference between their linear payoff and the nonlinear value of FRAs creates a convexity bias.`
},
quiz:[
{q:"Immediately after daily settlement, the value of a futures contract is:",o:["equal to the futures price","zero","equal to the cumulative gain"],a:1,e:"Mark-to-market resets value to zero."},
{q:"If interest rates are negatively correlated with futures prices, futures prices will be:",o:["above forward prices","below forward prices","equal to forward prices"],a:1,e:"Longs receive cash when rates are low → futures less attractive."},
{q:"A 3-month interest rate futures contract quoted at 95.80 implies a rate of:",o:["4.20%","95.80%","0.42%"],a:0,e:"100 − 95.80 = 4.20%."}]
});

/* ===================== READING 76 ===================== */
add({n:76,topic:"der",title:"Pricing and Valuation of Interest Rates and Other Swaps",
los:["76.a Describe how swap contracts are similar to but different from a series of forward contracts.","76.b Contrast the value and price of swaps."],
s:{
eli5:`<p>In an interest rate swap, two parties trade interest payments on an imaginary loan amount: one pays a fixed rate, the other pays a floating rate that changes with the market. No principal changes hands.</p>
<p>It's like a series of mini-bets on future rates, one for each payment date. The fixed rate is chosen so the deal is fair on day one (value zero). If rates later rise, the person paying fixed is happy: they keep paying the old low rate while receiving the new higher floating rate. So the swap becomes valuable to them.</p>`,
core:`<p><strong>What problem is this solving?</strong> Swaps let companies and investors change the type of their interest cash flows (fixed ↔ floating) without refinancing. Pricing a swap means finding the fixed rate that makes it fair; valuing it later means measuring how rate changes moved the deal.</p>
<ul><li><strong>Swap = portfolio of forwards (FRAs):</strong> each settlement is like an FRA. But unlike a series of separately priced forwards (each with its own fair forward rate, so different values), a swap uses one fixed rate for all periods: some embedded forwards have positive value and others negative, summing to zero at initiation.</li>
<li><strong>The first floating payment is known at initiation</strong> (set at the start), the rest are uncertain.</li>
<li><strong>Price = the fixed swap rate</strong> (par swap rate) that sets the PV of fixed payments equal to the PV of expected floating payments: equivalently, the coupon of a par bond priced off the same discount curve.</li>
<li><strong>Value</strong> after initiation depends on rate changes: if expected future floating rates rise, the fixed payer gains (value = PV of the difference between the new par swap rate and the old fixed rate, on the remaining notional schedule).</li></ul>`,
formal:`<h4>Swaps vs series of forwards</h4>
<ul><li>A plain vanilla interest rate swap exchanges fixed for floating payments on a notional principal; net settlement on each date.</li>
<li>Equivalent to a series of FRAs, but all at the same fixed rate (the swap rate) rather than at each period's forward rate; individual "FRAs" in a swap have non-zero values that sum to zero at initiation.</li>
<li>Also: currency swaps (exchange principal and interest in two currencies), equity swaps (equity return vs fixed/floating).</li></ul>
<h4>Price vs value</h4>
<ul><li><strong>Price (par swap rate):</strong> fixed rate making PV(fixed) = PV(floating) at initiation: s = (1 − DF<sub>N</sub>)/Σ DF<sub>t</sub>.</li>
<li><strong>Value</strong> at initiation = 0; later, value to fixed payer = PV of (current par swap rate − contract fixed rate) × notional over remaining periods = Σ DF<sub>t</sub> × (s<sub>new</sub> − s<sub>old</sub>) × notional × period fraction.</li>
<li>Rising expected short-term rates → fixed-rate payer (pay fixed, receive floating) gains; falling → loses. Receive-fixed is the opposite.</li>
<li>Value also changes as payments are made and time passes, and can be decomposed into the values of the remaining FRAs.</li></ul>`,
math:`<div class="f"><span class="lbl">Par swap rate</span>s<sub>N</sub> = (1 − DF<sub>N</sub>) / (DF₁ + DF₂ + … + DF<sub>N</sub>), &nbsp;DF<sub>t</sub> = 1/(1 + z<sub>t</sub>)<sup>t</sup></div>
<div class="vars"><div><code>DF<sub>t</sub></code><span>Discount factor for payment t (from spot/zero rates)</span></div><div><code>s</code><span>Fixed rate that makes the swap worth zero</span></div></div>
<p><strong>Why it's the par-bond formula:</strong> a pay-floating leg is like a floating-rate note worth par; a pay-fixed leg is like a fixed-coupon bond. They're equal when the fixed coupon is the par rate.</p>
<div class="f"><span class="lbl">Value to fixed payer later</span>V<sub>pay-fixed</sub> = (s<sub>current</sub> − s<sub>contract</sub>) × Σ DF<sub>remaining</sub> × notional</div>
<div class="dir"><div>Expected future rates <span class="up">↑</span> → pay-fixed value <span class="up">↑</span>, receive-fixed <span class="dn">↓</span></div><div>Upward-sloping curve → early FRAs in a pay-fixed swap negative, later ones positive (sum zero at start)</div></div>
<div class="calc" data-calc="swap"></div>`,
example:`<div class="q">Spot rates: 1-year 3.0%, 2-year 3.5%, 3-year 4.0%. (a) Compute discount factors and the 3-year annual par swap rate. (b) A firm entered a 3-year pay-fixed swap at 3.20% on $10 million; today's curve is the one above (so the market swap rate is your answer to (a)). Estimate the swap's value to the firm. (c) How is this swap like and unlike three FRAs?</div>
<ol class="steps"><li><strong>DFs:</strong> 1/1.03 = 0.9709; 1/1.035² = 0.9335; 1/1.04³ = 0.8890; sum = 2.7934.</li>
<li><strong>Par swap rate</strong> = (1 − 0.8890)/2.7934 = <strong>3.974%</strong>.</li>
<li><strong>Value to pay-fixed at 3.20%:</strong> (3.974% − 3.20%) × 2.7934 × $10m ≈ <strong>+$216,000</strong>: rates rose, so paying the old lower fixed rate is valuable.</li>
<li><strong>Like FRAs:</strong> each settlement exchanges fixed vs floating for a period. <strong>Unlike:</strong> one fixed rate for all periods (not each period's own forward rate), so individual legs have non-zero values that offset at inception.</li></ol>
<p class="ans">Answers: DFs 0.9709/0.9335/0.8890 · 3.974% · ≈ +$216,000 · same structure, single fixed rate</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Swap price = swap value. <b>Fix:</b> price is the fixed rate; value is the PV gain/loss.</li>
<li><b>Trap:</b> Fixed payer gains when rates fall. <b>Fix:</b> fixed payer gains when rates rise.</li>
<li><b>Trap:</b> Each embedded FRA in a swap has zero value. <b>Fix:</b> only their sum is zero at initiation.</li>
<li><b>Trap:</b> Notional principal is exchanged in an interest rate swap. <b>Fix:</b> not exchanged (it is in many currency swaps).</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> swap vs FRAs; compute par swap rate from spot rates/discount factors; direction of value change for pay-fixed vs receive-fixed; price vs value.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Bundle of FRAs at one rate</b>Swap structure.</div>
<div class="anchor"><b>Swap rate = par bond coupon</b>(1 − DF<sub>N</sub>)/ΣDF.</div>
<div class="anchor"><b>Pay fixed, pray rates rise</b>Fixed payer gains when rates go up.</div></div>`,
summary:`An interest rate swap exchanges fixed and floating interest payments on a notional principal and resembles a series of forward rate agreements; the first floating payment is known at initiation, later ones are uncertain. Unlike a series of separately priced forwards, a swap uses a single fixed rate, so its embedded forwards have non-zero values that sum to zero at initiation. The swap's price is its fixed (par swap) rate, s = (1 − DF<sub>N</sub>)/ΣDF, which makes the PV of fixed payments equal to the PV of floating payments; its value is zero at initiation and later changes with expected rates: a rise in expected future short-term rates increases the value to the fixed-rate payer, approximately (current swap rate − contract rate) × ΣDF<sub>remaining</sub> × notional, and a fall decreases it.`
},
quiz:[
{q:"The 'price' of an interest rate swap refers to:",o:["its market value","the fixed swap rate","the notional principal"],a:1,e:"Price = fixed rate set at initiation; value changes later."},
{q:"After initiation, expected future short-term rates rise. The value of a pay-fixed swap position:",o:["increases","decreases","stays at zero"],a:0,e:"The fixed payer receives higher floating payments while paying the old fixed rate."},
{q:"Compared with a series of separately priced forward contracts, an interest rate swap:",o:["uses a single fixed rate for all periods","has each settlement valued at zero at initiation","exchanges notional principal"],a:0,e:"One swap rate for all periods; only the total value is zero at inception."}]
});

/* ===================== READING 77 ===================== */
add({n:77,topic:"der",title:"Pricing and Valuation of Options",
los:["77.a Explain the exercise value, moneyness, and time value of an option.","77.b Contrast the use of arbitrage and replication concepts in pricing forward commitments and contingent claims.","77.c Identify the factors that determine the value of an option and describe how each factor affects the value of an option."],
s:{
eli5:`<p>An option's price has two parts. The <strong>exercise value</strong> is what you'd get if you used it right now (a $50 call on a $55 stock is worth at least $5 today). The <strong>time value</strong> is extra you pay for the chance that things get even better before it expires, like paying for "maybe".</p>
<p>The more the stock bounces around and the more time is left, the more valuable that "maybe" becomes, for both calls and puts, because the option holder enjoys the good surprises but is protected from the bad ones.</p>`,
core:`<p><strong>What problem is this solving?</strong> Understanding what drives an option's price, and why option pricing differs from forward pricing (one-sided payoffs, non-zero initial value).</p>
<ul><li><strong>Moneyness:</strong> call in the money if S &gt; X, out if S &lt; X; put in the money if S &lt; X, out if S &gt; X; at the money if S = X.</li>
<li><strong>Option value = exercise (intrinsic) value + time value.</strong> Time value ≥ 0 before expiration (except possibly some deep-ITM European puts) and = 0 at expiration.</li>
<li><strong>Replication differs:</strong> forwards are replicated with a fixed position in the underlying + borrowing; options need a position that's adjusted as prices change, and an option's value at initiation is not zero (premium).</li>
<li><strong>Factors:</strong> underlying price, exercise price, risk-free rate, volatility, time, carry costs/benefits. Volatility and time raise both calls and puts (asymmetric payoffs love uncertainty). Higher rates help calls (pay X later = cheaper in PV) and hurt puts (receive X later). Dividends/benefits lower calls and raise puts; carrying costs do the reverse.</li>
<li><strong>Lower bounds (European):</strong> c ≥ max(0, S − PV(X)); p ≥ max(0, PV(X) − S).</li></ul>`,
formal:`<h4>Exercise value, moneyness, time value</h4>
<ul><li>Exercise (intrinsic) value: call max(0, S − X); put max(0, X − S).</li>
<li>Moneyness: ITM, ATM, OTM as above.</li>
<li>Time value = option premium − exercise value; decays to zero at expiration (time decay).</li>
<li>Lower bounds for European options: c₀ ≥ max(0, S₀ − X/(1 + r)<sup>T</sup>); p₀ ≥ max(0, X/(1 + r)<sup>T</sup> − S₀). Upper bounds: c₀ ≤ S₀; p₀ ≤ X/(1 + r)<sup>T</sup> (European).</li></ul>
<h4>Arbitrage and replication: forwards vs options</h4>
<ul><li>Forward commitments: replicated with underlying + financing; symmetric payoffs; zero value at initiation.</li>
<li>Contingent claims: one-sided payoffs; positive value at initiation; replication uses the underlying, a risk-free bond and a hedge ratio that changes with the underlying price (e.g., call ≈ long fraction of the underlying financed partly by borrowing; put ≈ short underlying + lending).</li></ul>
<h4>Factors affecting option values</h4>
<table><tr><th>Increase in…</th><th>Call value</th><th>Put value</th></tr>
<tr><td>Underlying price</td><td>↑</td><td>↓</td></tr>
<tr><td>Exercise price</td><td>↓</td><td>↑</td></tr>
<tr><td>Risk-free rate</td><td>↑</td><td>↓</td></tr>
<tr><td>Volatility</td><td>↑</td><td>↑</td></tr>
<tr><td>Time to expiration</td><td>↑</td><td>↑ (except some deep-ITM European puts)</td></tr>
<tr><td>Costs of holding underlying</td><td>↑</td><td>↓</td></tr>
<tr><td>Benefits of holding underlying (dividends, convenience)</td><td>↓</td><td>↑</td></tr></table>`,
math:`<div class="f"><span class="lbl">Decomposition</span>Option value = exercise value + time value</div>
<div class="f"><span class="lbl">European lower bounds</span>c₀ ≥ max[0, S₀ − X/(1 + r)<sup>T</sup>] &nbsp;·&nbsp; p₀ ≥ max[0, X/(1 + r)<sup>T</sup> − S₀]</div>
<p><strong>Why PV(X) not X:</strong> with a European call, you pay X only at expiration, so its cost today is PV(X). A call must be worth at least owning the stock minus the PV of what you'll pay.</p>
<div class="dir"><div>Volatility <span class="up">↑</span> → calls <span class="up">↑</span>, puts <span class="up">↑</span> (more upside, downside capped)</div><div>r <span class="up">↑</span> → PV(X) <span class="dn">↓</span> → calls <span class="up">↑</span>, puts <span class="dn">↓</span></div><div>Dividends <span class="up">↑</span> → calls <span class="dn">↓</span>, puts <span class="up">↑</span></div></div>
<div class="calc" data-calc="opt"></div>`,
example:`<div class="q">S = $55. (a) A call with X = $50 trades at $7. Moneyness, exercise value, time value? (b) A put with X = $50 trades at $1.50. Same questions. (c) For a 1-year European call with X = $50 and r = 5%, what's the lower bound? (d) Predict the effect on the call and the put of: volatility rising; the company announcing a large dividend; interest rates rising.</div>
<ol class="steps"><li><strong>Call:</strong> in the money; exercise value = 55 − 50 = <strong>$5</strong>; time value = 7 − 5 = <strong>$2</strong>.</li>
<li><strong>Put:</strong> out of the money; exercise value = <strong>$0</strong>; time value = <strong>$1.50</strong>.</li>
<li><strong>Lower bound:</strong> 55 − 50/1.05 = 55 − 47.62 = <strong>$7.38</strong>. The $7.00 call price violates it → arbitrage (buy call, short stock, lend PV(X)).</li>
<li><strong>Volatility ↑:</strong> both ↑. <strong>Dividend ↑:</strong> call ↓, put ↑. <strong>Rates ↑:</strong> call ↑, put ↓.</li></ol>
<p class="ans">Answers: ITM, $5 + $2 · OTM, $0 + $1.50 · $7.38 (price too low) · as listed</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Higher volatility helps calls but hurts puts. <b>Fix:</b> it increases both.</li>
<li><b>Trap:</b> Higher rates increase put values. <b>Fix:</b> they decrease puts (PV of X received falls).</li>
<li><b>Trap:</b> OTM options are worthless before expiration. <b>Fix:</b> they have time value.</li>
<li><b>Trap:</b> Lower bound uses X. <b>Fix:</b> European lower bounds use PV(X).</li>
<li><b>Trap:</b> Longer time always raises European put values. <b>Fix:</b> deep-ITM European puts can lose value with longer time (waiting delays receiving X).</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> identify moneyness; split premium into exercise and time value; factor effects table; contrast option vs forward replication; lower bounds.</li>
<li><strong>Table memory:</strong> only S and X move calls and puts in opposite directions in an obvious way; volatility and time move both the same way; r and carry move them oppositely.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Now + maybe</b>Exercise value + time value.</div>
<div class="anchor"><b>Options love uncertainty</b>Volatility and time raise both.</div>
<div class="anchor"><b>Rates help the payer of X later</b>Calls ↑, puts ↓.</div>
<div class="anchor"><b>Dividends drain calls</b>Calls ↓, puts ↑.</div></div>`,
summary:`An option's exercise value is max(0, S − X) for a call and max(0, X − S) for a put; options are in, at or out of the money accordingly, and time value (premium minus exercise value) is positive before expiration and zero at expiration. Unlike forward commitments, contingent claims have one-sided payoffs and positive initial values, and are replicated with the underlying, a risk-free bond and a changing hedge ratio. Call values rise with the underlying price, risk-free rate, volatility, time to expiration and carrying costs, and fall with the exercise price and benefits of holding the underlying; put values rise with the exercise price, volatility, time (except some deep in-the-money European puts) and benefits, and fall with the underlying price, the risk-free rate and carrying costs. European lower bounds are c ≥ max(0, S − PV(X)) and p ≥ max(0, PV(X) − S).`
},
quiz:[
{q:"A put with X = 40 trades at 3.50 when the stock is at 38. Its time value is:",o:["1.50","2.00","3.50"],a:0,e:"Exercise value = 2; time value = 3.50 − 2 = 1.50."},
{q:"An increase in the volatility of the underlying will most likely:",o:["increase call values and decrease put values","increase both call and put values","decrease both"],a:1,e:"Asymmetric payoffs benefit from more uncertainty."},
{q:"An increase in the risk-free rate will most likely:",o:["increase put values","increase call values","have no effect on options"],a:1,e:"Higher r lowers PV(X): good for calls, bad for puts."}]
});

/* ===================== READING 78 ===================== */
add({n:78,topic:"der",title:"Option Replication Using Put-Call Parity",
los:["78.a Explain put-call parity for European options.","78.b Explain put-call forward parity for European options."],
s:{
eli5:`<p>Two different shopping baskets that always end up with exactly the same stuff must cost the same.</p>
<p><strong>Basket 1:</strong> a call option (right to buy the stock at $50) plus enough cash in a safe account to have $50 at expiration. <strong>Basket 2:</strong> the stock itself plus a put (insurance that lets you sell at $50).</p>
<p>At expiration, both baskets are worth "whichever is bigger: the stock price or $50". Same outcome → same price today. That's <strong>put-call parity</strong>, and it lets you build any one of the four pieces from the other three.</p>`,
core:`<p><strong>What problem is this solving?</strong> Linking calls, puts, the underlying and risk-free bonds through no-arbitrage, so options can be priced relative to each other, synthetic positions can be built, and mispricings exploited.</p>
<ul><li><strong>Fiduciary call</strong> (call + bond paying X) ≡ <strong>protective put</strong> (stock + put): c + PV(X) = S + p.</li>
<li><strong>Synthetics:</strong> rearrange to create any instrument: synthetic call = S + p − PV(X); synthetic put = c − S + PV(X); synthetic stock = c − p + PV(X); synthetic bond = S + p − c.</li>
<li><strong>Put-call forward parity:</strong> replace the stock with a forward contract plus a bond paying F: c + PV(X) = PV(F) + p.</li>
<li><strong>Corporate finance view:</strong> equity holders own a call on the firm's assets with strike = face value of debt; debt holders own a risk-free bond minus a put (the default option the shareholders hold).</li></ul>`,
formal:`<h4>Put-call parity (European, same X and T)</h4>
<p>c₀ + X/(1 + r)<sup>T</sup> = S₀ + p₀.</p>
<ul><li>Fiduciary call: long call + long risk-free zero paying X at T. Protective put: long stock + long put.</li>
<li>Both pay max(S<sub>T</sub>, X) at expiration → equal prices by no-arbitrage.</li>
<li>Rearrangements: c = S + p − PV(X); p = c − S + PV(X); S = c − p + PV(X); PV(X) = S + p − c.</li>
<li>If parity is violated: buy the cheap side, sell the expensive side for riskless profit.</li></ul>
<h4>Put-call forward parity</h4>
<p>c₀ + X/(1 + r)<sup>T</sup> = F₀(T)/(1 + r)<sup>T</sup> + p₀, because a long forward plus a bond paying F₀(T) replicates the underlying at T.</p>
<h4>Firm value as options</h4>
<ul><li>Shareholders: long call on firm assets with X = face value of debt; equivalently assets + long put.</li>
<li>Debtholders: risk-free claim to face value of debt − short put (the put represents default risk: shareholders "put" the assets to debtholders if insolvent).</li></ul>`,
math:`<div class="f"><span class="lbl">Put-call parity</span>c₀ + PV(X) = S₀ + p₀ &nbsp;·&nbsp; PV(X) = X/(1 + r)<sup>T</sup></div>
<div class="f"><span class="lbl">Synthetic positions</span>Call = S + p − PV(X) · Put = c − S + PV(X) · Stock = c − p + PV(X) · Bond = S + p − c</div>
<div class="f"><span class="lbl">Put-call forward parity</span>c₀ + PV(X) = PV(F₀) + p₀</div>
<p><strong>Why it works:</strong> at expiration, if S<sub>T</sub> &gt; X both baskets are worth S<sub>T</sub>; if S<sub>T</sub> ≤ X both are worth X. Identical payoffs in every state → identical prices.</p>
<div class="dir"><div>Call price <span class="up">↑</span> (others fixed) → implied put <span class="up">↑</span> by the same amount</div><div>Signs: "+" = long, "−" = short (borrow for −PV(X))</div></div>
<div class="calc" data-calc="pcp"></div>`,
example:`<div class="q">S = $50, X = $50, r = 5%, T = 1 year, European call = $6.00. (a) What put price does parity imply? (b) If the put trades at $4.50, describe the arbitrage and profit. (c) If the 1-year forward price is $52.50, verify put-call forward parity. (d) A firm's assets are worth $100m and its zero-coupon debt has face value $80m. Describe shareholders' and debtholders' positions in option terms.</div>
<ol class="steps"><li><strong>PV(X)</strong> = 50/1.05 = 47.619. <strong>p</strong> = 6.00 − 50 + 47.619 = <strong>$3.62</strong>.</li>
<li><strong>Put overpriced (4.50 &gt; 3.62):</strong> sell the put, buy the synthetic put (buy call 6.00, short stock +50, lend 47.619): net inflow = 4.50 − 6.00 + 50 − 47.619 = <strong>$0.88</strong> today, with offsetting payoffs at expiration.</li>
<li><strong>Forward parity:</strong> PV(F) = 52.50/1.05 = 50.00 = S, so c + PV(X) = 6 + 47.62 = 53.62 = PV(F) + p = 50 + 3.62 ✓.</li>
<li><strong>Shareholders:</strong> long call on assets with X = $80m (or assets + long put). <strong>Debtholders:</strong> risk-free $80m claim minus a short put sold to shareholders (default risk).</li></ol>
<p class="ans">Answers: $3.62 · sell put, buy synthetic put → $0.88 · ✓ · call on assets / risk-free debt − put</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using X instead of PV(X). <b>Fix:</b> the bond pays X at T; today it's worth PV(X).</li>
<li><b>Trap:</b> Applying parity to American options exactly. <b>Fix:</b> parity holds exactly for European options with the same X and T.</li>
<li><b>Trap:</b> Sign errors in synthetics. <b>Fix:</b> start from c + PV(X) = S + p, move terms across, flipping signs.</li>
<li><b>Trap:</b> Debtholders own a put. <b>Fix:</b> they're short the put; shareholders are long it.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute a missing price from parity; identify the synthetic for an instrument; describe an arbitrage when parity fails; put-call forward parity; firm-as-option interpretation.</li>
<li><strong>Memory:</strong> "<em>C + B = S + P</em>": call + bond = stock + put.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>C + B = S + P</b>Call plus bond equals stock plus put.</div>
<div class="anchor"><b>Two baskets, same groceries</b>Fiduciary call vs protective put.</div>
<div class="anchor"><b>Move it, flip it</b>Moving a term across the equals sign flips long ↔ short.</div>
<div class="anchor"><b>Equity is a call on the firm</b>Debt = safe bond − put.</div></div>`,
summary:`Put-call parity for European options with the same exercise price and expiration states that a fiduciary call (call + risk-free bond paying X) and a protective put (stock + put) have identical payoffs, max(S<sub>T</sub>, X), so c₀ + X/(1 + r)<sup>T</sup> = S₀ + p₀. Rearranging creates synthetic instruments (c = S + p − PV(X); p = c − S + PV(X); S = c − p + PV(X); PV(X) = S + p − c), and violations allow arbitrage by buying the cheap side and selling the expensive side. Put-call forward parity replaces the stock with a forward plus a bond paying the forward price: c₀ + PV(X) = PV(F₀(T)) + p₀. Shareholders can be viewed as holding a call on the firm's assets with an exercise price equal to the face value of debt (or assets plus a put), and debtholders as holding a risk-free claim minus a short put that represents default risk.`
},
quiz:[
{q:"Put-call parity states that a long call plus a risk-free bond paying X equals:",o:["a long stock plus a long put","a long stock minus a long put","a short stock plus a long put"],a:0,e:"c + PV(X) = S + p."},
{q:"S = 40, X = 40, PV(X) = 38, p = 2. The call price implied by parity is:",o:["2","4","0"],a:1,e:"c = S + p − PV(X) = 40 + 2 − 38 = 4."},
{q:"A synthetic put can be created by:",o:["long call, long stock, borrow PV(X)","long call, short stock, lend PV(X)","short call, long stock, lend PV(X)"],a:1,e:"p = c − S + PV(X)."}]
});

add({n:79,topic:"der",title:"Valuing a Derivative Using a One-Period Binomial Model",
los:["79.a Explain how to value a derivative using a one-period binomial model.","79.b Describe the concept of risk neutrality in derivatives pricing."],
s:{
eli5:`<p>Imagine a stock at $50 that, in one year, can only go to $60 or $40. A call option to buy at $50 will be worth $10 or $0. How much should you pay for it today?</p>
<p>Trick: build a combination of stock and borrowing that pays exactly the same $10 or $0. Buy half a share ($25) and borrow enough that you owe $20 next year. If the stock goes to $60, half a share is $30, repay $20 → $10 ✓. If it goes to $40, half a share is $20, repay $20 → $0 ✓. Same payoffs, so the call must cost what that combination costs today.</p>
<p>A shortcut gives the same answer: pretend everyone is risk-neutral, find the "fake" probability that makes the stock earn just the risk-free rate, average the option payoffs with it, and discount at the risk-free rate.</p>`,
core:`<p><strong>What problem is this solving?</strong> Pricing options without knowing investors' risk preferences or the real probabilities, using no-arbitrage. It's the foundation of all option pricing models.</p>
<ul><li><strong>Hedge ratio (delta):</strong> the number of shares per option that makes a hedged portfolio riskless: h = (c⁺ − c⁻)/(S⁺ − S⁻). A riskless portfolio must earn the risk-free rate.</li>
<li><strong>Risk-neutral probability:</strong> π = (1 + r − d)/(u − d). It's not the real-world probability; it's the probability that makes the stock's expected return equal the risk-free rate. Using it, option value = PV of expected payoff at r.</li>
<li><strong>Why risk-neutral works:</strong> because the option can be replicated risklessly, its price can't depend on risk preferences; so we may compute it as if everyone were risk-neutral. Real probabilities and expected returns don't appear.</li>
<li><strong>No-arbitrage condition:</strong> d &lt; 1 + r &lt; u; otherwise π falls outside 0–1 and arbitrage exists.</li></ul>`,
formal:`<h4>Inputs</h4>
<p>S₀, up factor u (S⁺ = uS₀), down factor d (S⁻ = dS₀), exercise price X, risk-free rate r for the period, option payoffs c⁺, c⁻ (or p⁺, p⁻).</p>
<h4>Replication / hedging approach</h4>
<ul><li>Hedge ratio h = (c⁺ − c⁻)/(S⁺ − S⁻).</li>
<li>Replicating portfolio: buy h shares, borrow PV of (hS⁻ − c⁻) → c₀ = hS₀ − (hS⁻ − c⁻)/(1 + r).</li>
<li>Equivalently, long h shares and short 1 call is riskless and earns r.</li>
<li>For puts, the hedge ratio is negative (short shares) and the replicating portfolio lends.</li></ul>
<h4>Risk-neutral valuation</h4>
<ul><li>π = (1 + r − d)/(u − d); 1 − π for the down state.</li>
<li>c₀ = [πc⁺ + (1 − π)c⁻]/(1 + r); p₀ = [πp⁺ + (1 − π)p⁻]/(1 + r).</li>
<li>Risk neutrality: derivative prices don't depend on risk preferences or actual probabilities because the derivative can be hedged; the discount rate is the risk-free rate.</li>
<li>Results satisfy put-call parity.</li></ul>`,
math:`<div class="f"><span class="lbl">Risk-neutral probability</span>π = (1 + r − d) / (u − d)</div>
<div class="vars"><div><code>u, d</code><span>Up and down factors (S⁺ = uS₀, S⁻ = dS₀)</span></div><div><code>r</code><span>Risk-free rate per period</span></div></div>
<p><strong>Why:</strong> it's the probability that solves π × u + (1 − π) × d = 1 + r, i.e., the stock's expected growth equals the risk-free rate.</p>
<div class="f"><span class="lbl">Option value</span>c₀ = [π × c⁺ + (1 − π) × c⁻] / (1 + r) &nbsp;·&nbsp; p₀ = [π × p⁺ + (1 − π) × p⁻] / (1 + r)</div>
<div class="f"><span class="lbl">Hedge ratio</span>h = (c⁺ − c⁻) / (S⁺ − S⁻)</div>
<div class="dir"><div>u − d <span class="up">↑</span> (more volatility) → option values <span class="up">↑</span></div><div>r <span class="up">↑</span> → π <span class="up">↑</span> → calls <span class="up">↑</span>, puts <span class="dn">↓</span></div><div>Real-world probability of an up-move does not enter the price</div></div>
<div class="calc" data-calc="binom"></div>`,
example:`<div class="q">S₀ = $50; in one period the price goes up 20% or down 20%; r = 5% per period; X = $50. (a) Risk-neutral probability. (b) Value the call. (c) Value the put. (d) Hedge ratio and replicating portfolio for the call. (e) Check put-call parity.</div>
<ol class="steps"><li><strong>Prices:</strong> S⁺ = 60, S⁻ = 40. <strong>π</strong> = (1.05 − 0.80)/(1.20 − 0.80) = 0.25/0.40 = <strong>0.625</strong>.</li>
<li><strong>Call:</strong> c⁺ = 10, c⁻ = 0 → c₀ = (0.625 × 10)/1.05 = <strong>$5.95</strong>.</li>
<li><strong>Put:</strong> p⁺ = 0, p⁻ = 10 → p₀ = (0.375 × 10)/1.05 = <strong>$3.57</strong>.</li>
<li><strong>Hedge ratio</strong> = (10 − 0)/(60 − 40) = <strong>0.5</strong>. Replicate: buy 0.5 share ($25), borrow 20/1.05 = $19.05 → cost $5.95 ✓.</li>
<li><strong>Parity:</strong> c − p = 5.95 − 3.57 = 2.38; S − PV(X) = 50 − 47.62 = 2.38 ✓.</li></ol>
<p class="ans">Answers: π = 0.625 · call $5.95 · put $3.57 · h = 0.5 (buy ½ share, borrow $19.05) · parity holds</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using the real-world probability. <b>Fix:</b> use risk-neutral π and discount at r.</li>
<li><b>Trap:</b> Discounting at the stock's expected return. <b>Fix:</b> risk-free rate.</li>
<li><b>Trap:</b> Forgetting to discount the expected payoff. <b>Fix:</b> divide by (1 + r).</li>
<li><b>Trap:</b> π = (u − 1 − r)/(u − d). <b>Fix:</b> π = (1 + r − d)/(u − d).</li>
<li><b>Trap:</b> Hedge ratio uses option prices today. <b>Fix:</b> uses the up/down payoffs.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute π; value a call or put; hedge ratio; explain risk neutrality; check with parity.</li>
<li><strong>Speed:</strong> write S⁺, S⁻, payoffs, π, then one line for the value. Under 90 seconds.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Copy the payoff, copy the price</b>Replicate with shares + borrowing.</div>
<div class="anchor"><b>"One plus r minus d over u minus d"</b>Risk-neutral probability.</div>
<div class="anchor"><b>Average with fake odds, discount at r</b>Risk-neutral valuation.</div>
<div class="anchor"><b>Real odds don't matter</b>Hedging removes risk preferences.</div></div>`,
summary:`A one-period binomial model values an option from the current price S₀, up and down factors u and d, the exercise price and the risk-free rate. A portfolio of the underlying hedged with the option can be made riskless using the hedge ratio h = (c⁺ − c⁻)/(S⁺ − S⁻); since its value is certain, it must earn the risk-free rate, which pins down the option's price (equivalently, the option equals h shares financed partly by borrowing). With risk-neutral probability π = (1 + r − d)/(u − d), the option value is the expected payoff under π discounted at the risk-free rate: c₀ = [πc⁺ + (1 − π)c⁻]/(1 + r) and similarly for puts. Risk neutrality means derivative prices do not depend on investors' risk preferences or actual probabilities, because the derivative can be replicated and hedged; results are consistent with put-call parity.`
},
quiz:[
{q:"S₀ = 100, u = 1.25, d = 0.80, r = 5%. The risk-neutral probability of an up-move is:",o:["0.444","0.556","0.500"],a:1,e:"π = (1.05 − 0.80)/(1.25 − 0.80) = 0.25/0.45 = 0.556. (0.444 is 1 − π, the down-move probability.)"},
{q:"Using the inputs above, a call with X = 100 is worth closest to:",o:["10.58","13.23","25.00"],a:1,e:"c⁺ = 25, c⁻ = 0 → 0.556 × 25/1.05 = 13.23. (10.58 uses the down-move probability by mistake.)"},
{q:"In risk-neutral valuation, expected option payoffs are discounted at:",o:["the stock's expected return","the risk-free rate","the option's expected return"],a:1,e:"Risk neutrality → risk-free discounting."}]
});
