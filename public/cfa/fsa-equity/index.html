<script>

/* ===================== READING 27 ===================== */
add({n:27,topic:"fsa",title:"Introduction to Financial Statement Analysis",
los:["27.a Describe the steps in the financial statement analysis framework.","27.b Describe the roles of financial statement analysis.","27.c Describe the importance of regulatory filings, financial statement notes and supplementary information, management's commentary, and audit reports.","27.d Describe implications for financial analysis of alternative financial reporting systems and the importance of monitoring developments in financial reporting standards.","27.e Describe information sources that analysts use in financial statement analysis besides annual and interim financial reports."],
s:{
eli5:`<p>A company's financial statements are its report card. The <strong>income statement</strong> says how much it earned this year. The <strong>balance sheet</strong> is a snapshot of what it owns and owes today. The <strong>cash flow statement</strong> shows where the actual cash came from and went.</p>
<p>Financial statement analysis is reading that report card carefully to decide something: Should I buy this stock? Should I lend this company money? To do it well you read the fine print (the notes), listen to what management says, check the referee's verdict (the auditor), and look at other sources too.</p>`,
core:`<p><strong>What problem is this solving?</strong> Investors and lenders must decide with incomplete information. Financial reports compress a company's economic activity into standardized numbers; analysis turns those numbers into judgments about future earnings, cash flow and risk.</p>
<ul><li><strong>Reporting vs analysis:</strong> financial reporting provides useful information about performance and position; financial statement analysis uses it (plus other information) to make economic decisions: invest, lend, rate, acquire.</li>
<li><strong>The numbers rest on choices:</strong> accounting methods, estimates and assumptions appear in the notes and management commentary; two firms with identical economics can report different numbers.</li>
<li><strong>Trust needs checks:</strong> auditors give reasonable (not absolute) assurance; regulators enforce standards; management certifies internal controls.</li>
<li><strong>Standards differ</strong> (IFRS vs US GAAP) and evolve; analysts adjust for differences and watch for new standards and new transaction types.</li>
<li><strong>A disciplined process</strong> (the six-step framework) keeps analysis focused on the question being answered.</li></ul>`,
formal:`<h4>Financial statement analysis framework</h4>
<ol><li><strong>State the objective and context:</strong> questions to answer, form of output, resources, time.</li>
<li><strong>Gather data:</strong> financial statements, industry and economic data, discussions with management, suppliers, customers; site visits.</li>
<li><strong>Process the data:</strong> adjustments, ratios, common-size statements, forecasts, graphs.</li>
<li><strong>Analyze and interpret:</strong> answer the questions; reach conclusions.</li>
<li><strong>Report conclusions/recommendations:</strong> communicate in line with the Code and Standards.</li>
<li><strong>Update the analysis:</strong> periodically revise.</li></ol>
<h4>Information sources</h4>
<ul><li><strong>Primary statements:</strong> balance sheet (statement of financial position), income statement (and statement of comprehensive income), statement of changes in equity, cash flow statement.</li>
<li><strong>Notes and supplementary schedules:</strong> accounting methods, estimates, assumptions; segment data; commitments and contingencies; legal proceedings; acquisitions/divestitures; stock options; employee benefit plans.</li>
<li><strong>Management commentary (MD&amp;A):</strong> business overview, trends, liquidity, capital needs, significant events, critical accounting policies and estimates.</li>
<li><strong>Audit report:</strong> independent opinion on fairness; <em>unqualified</em> (clean), <em>qualified</em> (exceptions), <em>adverse</em> (not fairly presented), <em>disclaimer</em> (unable to express opinion). Key audit matters (IFRS) / critical audit matters (US). US: auditor also opines on internal control over financial reporting; management is responsible for internal controls.</li>
<li><strong>Other sources:</strong> quarterly/semiannual reports, proxy statements, press releases, earnings guidance and calls, industry and peer data, economic data, regulatory filings (e.g., SEC Form 10-K, 10-Q, 8-K, proxy DEF 14A).</li></ul>
<h4>Standard setters and regulators</h4>
<ul><li><strong>Standard-setting bodies</strong> (private sector): IASB (IFRS), FASB (US GAAP).</li>
<li><strong>Regulatory authorities</strong> (government): SEC (US), FCA (UK), etc.; many belong to IOSCO.</li>
<li>Analysts must understand IFRS vs US GAAP differences and monitor new standards and emerging transaction types.</li></ul>`,
math:`<p>No formulas in this reading. The "structure" to remember:</p>
<div class="f"><span class="lbl">Framework</span>Objective → Gather → Process → Analyze → Report → Update</div>
<div class="f"><span class="lbl">Audit opinion ladder (best to worst)</span>Unqualified (clean) → Qualified (exceptions) → Adverse (not fair) · Disclaimer (no opinion possible)</div>
<div class="f"><span class="lbl">Who does what</span>Standard setters (IASB, FASB) WRITE the rules · Regulators (SEC, FCA) ENFORCE them · Auditors CHECK them · Management PREPARES the statements</div>`,
example:`<div class="q">Match each to the correct source or step: (a) An analyst computes common-size income statements for five years. (b) Details of a pending lawsuit and stock option grants. (c) Management explains why margins fell and how much capex is planned. (d) The auditor states the statements are fairly presented except for the treatment of one lease. (e) Board compensation details and shareholder proposals. (f) Six months later the analyst revises her rating after new results.</div>
<ol class="steps"><li><strong>(a)</strong> Step 3: process the data.</li>
<li><strong>(b)</strong> Notes to the financial statements.</li>
<li><strong>(c)</strong> Management commentary (MD&amp;A).</li>
<li><strong>(d)</strong> <strong>Qualified</strong> audit opinion.</li>
<li><strong>(e)</strong> Proxy statement.</li>
<li><strong>(f)</strong> Step 6: update the analysis.</li></ol>
<p class="ans">Answers: process · notes · MD&amp;A · qualified · proxy · update</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> An unqualified opinion guarantees no fraud. <b>Fix:</b> reasonable assurance only.</li>
<li><b>Trap:</b> The SEC writes US GAAP. <b>Fix:</b> FASB sets standards; the SEC enforces/regulates.</li>
<li><b>Trap:</b> Adverse vs disclaimer. <b>Fix:</b> adverse = not fairly presented; disclaimer = auditor can't form an opinion.</li>
<li><b>Trap:</b> Skipping the notes. <b>Fix:</b> they contain the methods and estimates behind every number.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> order of framework steps; where information is found; types of audit opinions; standard setters vs regulators; other information sources.</li>
<li>Easy points: memorize the step order and the four opinions.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>O-G-P-A-R-U</b>Objective, Gather, Process, Analyze, Report, Update.</div>
<div class="anchor"><b>Report card + fine print + referee</b>Statements, notes, auditor.</div>
<div class="anchor"><b>Writers vs police</b>IASB/FASB write; SEC/FCA enforce.</div></div>`,
summary:`Financial reporting provides information about a company's performance and position; financial statement analysis uses it, with other information, to make economic decisions such as investing, lending and rating. The framework is: state the objective, gather data, process data, analyze and interpret, report conclusions, and update. Key information comes from the financial statements, the notes and supplementary schedules (methods, estimates, segments, contingencies, options, pensions), management commentary (trends, liquidity, capital needs, critical policies) and the audit report (unqualified, qualified, adverse or disclaimer; reasonable assurance only), supplemented by interim reports, proxy statements, press releases, guidance and industry and economic data. Standard setters (IASB, FASB) set rules and regulators (SEC, FCA, members of IOSCO) enforce them; analysts must account for IFRS/US GAAP differences and monitor evolving standards.`
},
quiz:[
{q:"An auditor concludes the financial statements are not fairly presented. This is a(n):",o:["qualified opinion","adverse opinion","disclaimer of opinion"],a:1,e:"Adverse = not presented fairly; disclaimer = unable to express an opinion."},
{q:"Which organization is a standard-setting body?",o:["Securities and Exchange Commission","International Accounting Standards Board","IOSCO"],a:1,e:"IASB sets IFRS; SEC and IOSCO members are regulators."},
{q:"Calculating ratios and preparing common-size statements is part of which step?",o:["Gather data","Process the data","Report conclusions"],a:1,e:"Processing the data."}]
});

add({n:28,topic:"fsa",title:"Analyzing Income Statements",
los:["28.a Describe general principles of revenue recognition, specific revenue recognition applications, and implications of revenue recognition choices for financial analysis.","28.b Describe general principles of expense recognition, specific expense recognition applications, implications of expense recognition choices for financial analysis and contrast costs that are capitalized versus those that are expensed in the period in which they are incurred.","28.c Describe the financial reporting treatment and analysis of non-recurring items (including discontinued operations, unusual or infrequent items) and changes in accounting policies.","28.d Describe how earnings per share is calculated and calculate and interpret a company's basic and diluted earnings per share for companies with simple and complex capital structures including those with antidilutive securities.","28.e Evaluate a company's financial performance using common-size income statements and financial ratios based on the income statement."],
s:{
eli5:`<p>The income statement answers: "Did the company make money this period?" It's revenue (what customers paid for what was delivered) minus expenses (what it cost to deliver it).</p>
<p>The tricky part is <em>timing</em>. If you sell a 3-year phone plan, you don't count all 3 years of revenue on day one; you count it as you provide the service. And if you buy a machine that lasts 10 years, you don't count its whole cost this year; you spread it out (that's "capitalizing").</p>
<p>Finally, <strong>earnings per share</strong> divides profit among owners. If there are things that could turn into more shares (like options or convertible bonds), you also calculate a "worst-case" diluted version.</p>`,
core:`<p><strong>What problem is this solving?</strong> Measuring performance for a period requires deciding <em>when</em> revenue is earned and <em>which</em> costs belong to it. Those choices drive reported profit, so analysts must understand and, if needed, adjust them.</p>
<ul><li><strong>Revenue recognition (5 steps):</strong> identify the contract → identify performance obligations → determine the price → allocate the price → recognize revenue as obligations are satisfied (at a point in time or over time). Judgment: progress toward completion, variable consideration, contract modifications, principal vs agent (gross vs net revenue).</li>
<li><strong>Matching principle:</strong> expenses are recognized with the revenues they generate (COGS) or in the period incurred (period costs).</li>
<li><strong>Capitalize vs expense</strong> is a timing choice with big effects: capitalizing raises current income, assets, equity and CFO (outflow goes to CFI), lowers leverage ratios, and lowers future income through depreciation.</li>
<li><strong>Non-recurring items</strong> must be separated to forecast sustainable earnings: discontinued operations (below continuing operations, net of tax), unusual or infrequent items (in continuing operations, pretax). Policy changes are applied retrospectively; estimate changes prospectively.</li>
<li><strong>EPS:</strong> basic uses actual weighted shares; diluted assumes conversion of all <em>dilutive</em> securities (antidilutive ones are excluded, since diluted EPS can never exceed basic).</li></ul>`,
formal:`<h4>Revenue recognition</h4>
<ul><li>Five-step model (IFRS 15/ASC 606). Revenue recognized when (or as) control of goods/services transfers.</li>
<li>Over-time recognition (e.g., long-term contracts) based on progress (costs incurred, outputs).</li>
<li>Principal (gross revenue) vs agent (net commission).</li>
<li>Disclosures: contract balances (contract assets/liabilities), remaining performance obligations, judgments.</li></ul>
<h4>Expense recognition</h4>
<ul><li>Matching; period costs; inventory cost flows (FIFO, weighted average; LIFO in US GAAP only); depreciation (straight-line, accelerated, units of production); bad debts and warranty estimates.</li>
<li>Capitalized (asset, then depreciation/amortization) vs expensed (immediately).</li></ul>
<table><tr><th>Effect of capitalizing vs expensing</th><th>Year 1</th><th>Later years</th></tr>
<tr><td>Net income</td><td>Higher</td><td>Lower (depreciation)</td></tr>
<tr><td>Assets, equity</td><td>Higher</td><td>Higher (declining)</td></tr>
<tr><td>CFO / CFI</td><td>CFO higher, CFI lower (total cash same)</td><td>—</td></tr>
<tr><td>ROA, ROE</td><td>Higher</td><td>Lower</td></tr>
<tr><td>Debt/assets, debt/equity</td><td>Lower</td><td>Lower</td></tr>
<tr><td>Income variability</td><td>Lower (smoothed)</td><td></td></tr></table>
<h4>Non-recurring items and accounting changes</h4>
<ul><li><strong>Discontinued operations:</strong> component disposed of or held for sale; reported net of tax below income from continuing operations.</li>
<li><strong>Unusual or infrequent items:</strong> reported pretax within continuing operations (e.g., restructuring, gains on asset sales). IFRS and US GAAP do not allow "extraordinary items".</li>
<li><strong>Change in accounting policy:</strong> retrospective application (restate prior periods). <strong>Change in estimate:</strong> prospective. <strong>Correction of error:</strong> restatement of prior periods.</li></ul>
<h4>EPS</h4>
<ul><li>Basic EPS = (NI − preferred dividends)/weighted average common shares (adjust retroactively for stock splits/dividends).</li>
<li>Diluted EPS = [NI − pref div + convertible pref div + convertible debt interest × (1 − t)]/[WASO + shares from conv. preferred + shares from conv. debt + net shares from options (treasury stock method)].</li>
<li>Treasury stock method: new shares = n − (n × X/average price), only if average price &gt; X.</li>
<li>A security is antidilutive if including it would raise EPS; exclude it. Simple capital structure: no potentially dilutive securities.</li></ul>
<h4>Common-size analysis and ratios</h4>
<p>Vertical common-size: each line as % of revenue. Gross margin = gross profit/revenue; operating margin; net margin = NI/revenue. Comprehensive income = NI + OCI (e.g., FX translation, certain pension remeasurements, FVOCI gains, cash flow hedge gains).</p>`,
math:`<div class="f"><span class="lbl">Basic EPS</span>Basic EPS = (Net income − preferred dividends) / weighted average common shares</div>
<div class="f"><span class="lbl">Diluted EPS</span>Diluted = [NI − pref div + conv. pref div + conv. debt interest × (1 − t)] / [WASO + conv. pref shares + conv. debt shares + (n − n × X/P̄)]</div>
<div class="vars"><div><code>conv. pref div</code><span>Added back: if converted, these dividends wouldn't be paid</span></div><div><code>interest × (1 − t)</code><span>Added back after tax: no interest if converted, but tax shield lost</span></div><div><code>n − nX/P̄</code><span>Treasury stock method: option proceeds buy back shares at the average price</span></div></div>
<p><strong>Antidilution test:</strong> compute each security's "per-share contribution" (added numerator ÷ added shares). If it's below basic EPS, it dilutes; if above, exclude it.</p>
<div class="f"><span class="lbl">Weighted average shares</span>WASO = Σ shares outstanding × fraction of year outstanding (splits applied retroactively)</div>
<div class="dir"><div>Capitalizing <span class="up">↑</span> → current NI <span class="up">↑</span>, CFO <span class="up">↑</span>, leverage ratios <span class="dn">↓</span></div><div>Option average price <span class="up">↑</span> → more dilution</div><div>Recognize revenue earlier → current NI <span class="up">↑</span> (and a warning sign if aggressive)</div></div>
<div class="calc" data-calc="eps"></div>`,
example:`<div class="q">Net income $1,000; preferred dividends $100 (of which $50 is on convertible preferred convertible into 40 shares); 500 weighted average common shares; convertible bonds with $60 interest, convertible into 30 shares; tax rate 25%; 20 options with exercise price $30, average share price $40. (a) Basic EPS. (b) Diluted EPS, checking each security for dilution.</div>
<ol class="steps"><li><strong>Basic</strong> = (1,000 − 100)/500 = <strong>$1.80</strong>.</li>
<li><strong>Convertible preferred:</strong> +$50 numerator, +40 shares → 1.25 &lt; 1.80 → dilutive.</li>
<li><strong>Convertible debt:</strong> +60 × 0.75 = $45, +30 shares → 1.50 &lt; 1.80 → dilutive.</li>
<li><strong>Options:</strong> proceeds 20 × 30 = 600 buy back 600/40 = 15 shares → net <strong>5</strong> new shares (dilutive since 40 &gt; 30).</li>
<li><strong>Diluted EPS</strong> = (900 + 50 + 45)/(500 + 40 + 30 + 5) = 995/575 = <strong>$1.73</strong>.</li></ol>
<p class="ans">Answers: basic $1.80 · diluted $1.73</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Adding back pre-tax interest on convertible debt. <b>Fix:</b> add back interest × (1 − t).</li>
<li><b>Trap:</b> Including antidilutive securities. <b>Fix:</b> test each; diluted EPS ≤ basic EPS always.</li>
<li><b>Trap:</b> Forgetting stock splits retroactively. <b>Fix:</b> restate all prior shares as if the split happened at the start.</li>
<li><b>Trap:</b> Discontinued operations reported pretax. <b>Fix:</b> net of tax, below continuing operations.</li>
<li><b>Trap:</b> Change in estimate restated retroactively. <b>Fix:</b> prospective only; policy changes are retrospective.</li>
<li><b>Trap:</b> Capitalizing raises total cash flow. <b>Fix:</b> total cash same; it shifts from CFO to CFI.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> 5-step revenue model; principal vs agent; capitalize vs expense effects; classify non-recurring items; policy vs estimate changes; basic and diluted EPS with treasury stock method and antidilution; common-size margins.</li>
<li><strong>EPS speed tip:</strong> compute basic first, then each security's per-share effect; include only those below basic.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>C-O-P-A-R</b>Contract, Obligations, Price, Allocate, Recognize.</div>
<div class="anchor"><b>Capitalize = smooth now, pay later</b>Higher income today, depreciation tomorrow.</div>
<div class="anchor"><b>Policies go back, estimates go forward</b>Retrospective vs prospective.</div>
<div class="anchor"><b>Diluted never beats basic</b>Exclude antidilutive securities.</div></div>`,
summary:`Revenue is recognized using a five-step model (identify contract, identify performance obligations, determine transaction price, allocate it, recognize revenue as obligations are satisfied), with judgment about progress, variable consideration, modifications and principal vs agent status. Expenses follow the matching principle or are period costs; capitalizing a cost (rather than expensing) raises current income, assets, equity, CFO and early ROA/ROE, lowers leverage ratios and CFI, and lowers later income through depreciation. Discontinued operations are reported net of tax below continuing operations; unusual or infrequent items are reported pretax within continuing operations; accounting policy changes and error corrections are applied retrospectively, estimate changes prospectively. Basic EPS = (NI − preferred dividends)/weighted average shares; diluted EPS adds back convertible preferred dividends and after-tax convertible interest and adds shares from conversions and options (treasury stock method), excluding antidilutive securities. Common-size income statements (each item as % of revenue) and margins support trend and peer comparison.`
},
quiz:[
{q:"Compared with expensing, capitalizing a cost in the year incurred most likely results in:",o:["lower CFO","higher net income","higher debt-to-equity"],a:1,e:"Only depreciation hits income in year 1; outflow goes to CFI; equity higher → lower D/E."},
{q:"A company changes the estimated useful life of its equipment. This change is applied:",o:["retrospectively","prospectively","only in the notes"],a:1,e:"Changes in estimates are prospective."},
{q:"Basic EPS is $2.00. A convertible bond would add $0.9m of after-tax interest and 0.4m shares. It is:",o:["dilutive","antidilutive","irrelevant to diluted EPS because it's debt"],a:1,e:"Per-share effect 0.9/0.4 = $2.25 > $2.00 → antidilutive, excluded."}]
});

add({n:29,topic:"fsa",title:"Analyzing Balance Sheets",
los:["29.a Explain the financial reporting and disclosures related to intangible assets.","29.b Explain the financial reporting and disclosures related to goodwill.","29.c Explain the financial reporting and disclosures related to financial instruments.","29.d Explain the financial reporting and disclosures related to non-current liabilities.","29.e Calculate and interpret common-size balance sheets and related financial ratios."],
s:{
eli5:`<p>The balance sheet is a snapshot: everything the company owns (assets) = everything it owes (liabilities) + what's left for the owners (equity).</p>
<p>Some assets you can't touch: patents, brands, software, customer lists. Those are <strong>intangibles</strong>. If a company buys another company for more than its identifiable stuff is worth, the extra is called <strong>goodwill</strong>: you paid for reputation, team, synergies.</p>
<p>Investments in other companies' shares and bonds are recorded in different ways depending on why you hold them, and that changes whether their price swings show up in profit or not.</p>`,
core:`<p><strong>What problem is this solving?</strong> Showing what a company owns and owes, measured consistently enough to judge liquidity (can it pay bills soon?) and solvency (can it survive long-term?), while recognizing that many important assets are intangible and hard to value.</p>
<ul><li><strong>Intangibles:</strong> internally created ones are usually expensed (so they're invisible on the balance sheet); purchased ones are capitalized. Finite-lived intangibles are amortized; indefinite-lived (and goodwill) are tested for impairment, not amortized. IFRS capitalizes development costs if criteria are met; US GAAP expenses both R&amp;D (except certain software).</li>
<li><strong>Goodwill</strong> = purchase price − fair value of identifiable net assets; never amortized; tested annually for impairment; impairments signal an overpaid acquisition.</li>
<li><strong>Financial assets:</strong> measurement depends on business model/intent: amortized cost (hold to collect), fair value through OCI (collect and sell), fair value through P&amp;L (trading, equities, derivatives). The choice determines whether unrealized gains hit net income.</li>
<li><strong>Non-current liabilities:</strong> bonds at amortized cost (discount/premium amortized toward par), deferred tax liabilities, lease liabilities, pension liabilities.</li>
<li><strong>Common-size balance sheet</strong> (each item as % of total assets) and ratios standardize for size.</li></ul>`,
formal:`<h4>Intangible assets</h4>
<ul><li>Identifiable (patents, trademarks, licenses, customer lists) vs unidentifiable (goodwill).</li>
<li>Internally created: expensed (exceptions: IFRS development costs meeting criteria; US GAAP certain software development costs).</li>
<li>Purchased: recorded at cost; acquired in business combination: at fair value.</li>
<li>Finite life: amortized over useful life; indefinite life: not amortized, tested for impairment at least annually.</li>
<li>IFRS permits revaluation model for intangibles with active markets (rare); US GAAP cost model only.</li></ul>
<h4>Goodwill</h4>
<p>Excess of purchase price over fair value of identifiable net assets acquired. Not amortized; tested for impairment at least annually; impairment reduces assets and equity and is a non-cash loss. Analysts often exclude goodwill when computing ratios and examine impairments as evidence of overpayment.</p>
<h4>Financial instruments</h4>
<table><tr><th>IFRS 9 category</th><th>US GAAP analogue</th><th>Balance sheet</th><th>Unrealized gains/losses</th></tr>
<tr><td>Amortized cost (hold to collect; debt only)</td><td>Held-to-maturity</td><td>Amortized cost</td><td>Not recognized</td></tr>
<tr><td>FVOCI (debt: collect and sell; equities by irrevocable election)</td><td>Available-for-sale (debt)</td><td>Fair value</td><td>OCI (equity)</td></tr>
<tr><td>FVPL (trading debt, equities, derivatives; or election)</td><td>Trading; equity securities; derivatives</td><td>Fair value</td><td>Net income</td></tr></table>
<p>Interest and dividend income and realized gains go to income in all cases (except FVOCI equity under IFRS, where realized gains stay in equity).</p>
<h4>Non-current liabilities</h4>
<ul><li>Bonds at amortized cost: carrying value moves toward par as discount/premium is amortized (effective interest method); held-for-trading and derivative liabilities at fair value.</li>
<li>Deferred tax liabilities (temporary differences); lease liabilities; pension obligations.</li></ul>
<h4>Common-size balance sheet and ratios</h4>
<ul><li>Vertical common-size: each item as % of total assets; for time-series and cross-sectional comparison.</li>
<li>Liquidity: current, quick, cash ratios. Solvency: LT debt-to-equity, debt-to-equity, debt ratio (debt/assets), financial leverage (assets/equity).</li></ul>`,
math:`<div class="f"><span class="lbl">Goodwill</span>Goodwill = purchase price − fair value of identifiable net assets</div>
<div class="f"><span class="lbl">Liquidity</span>Current = CA/CL · Quick = (cash + marketable securities + receivables)/CL · Cash = (cash + marketable securities)/CL</div>
<div class="f"><span class="lbl">Solvency</span>Debt/equity · Debt/assets · Financial leverage = average assets/average equity</div>
<div class="f"><span class="lbl">Common-size</span>Item % = item / total assets</div>
<div class="dir"><div>Goodwill impairment → assets <span class="dn">↓</span>, equity <span class="dn">↓</span>, leverage ratios <span class="up">↑</span>, no cash effect</div><div>FVPL classification → more income volatility than FVOCI or amortized cost</div><div>Expensing R&amp;D → understated assets for knowledge-intensive firms</div></div>
<div class="calc" data-calc="ratios"></div>`,
example:`<div class="q">(a) Alpha buys Beta for $500m; Beta's identifiable assets have fair value $650m and liabilities $270m. Goodwill? (b) A firm holds a bond it intends to hold to maturity and a stock bought for trading; both rose $10m in value this year. Under IFRS, how does each affect net income? (c) Given cash $50, receivables $150, inventory $200, current liabilities $250, debt $400, equity $600, total assets $1,200: current, quick, debt/equity, debt/assets.</div>
<ol class="steps"><li><strong>Goodwill</strong> = 500 − (650 − 270) = 500 − 380 = <strong>$120m</strong>.</li>
<li><strong>Bond (amortized cost):</strong> no unrealized gain recognized. <strong>Trading stock (FVPL):</strong> +$10m in net income.</li>
<li><strong>Current</strong> = 400/250 = <strong>1.60</strong>; <strong>quick</strong> = 200/250 = <strong>0.80</strong>.</li>
<li><strong>Debt/equity</strong> = 400/600 = <strong>0.67</strong>; <strong>debt/assets</strong> = 400/1,200 = <strong>33.3%</strong>.</li></ol>
<p class="ans">Answers: $120m · bond none, stock +$10m NI · 1.60 / 0.80 · 0.67 / 33.3%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Goodwill is amortized. <b>Fix:</b> tested for impairment (at least annually), not amortized.</li>
<li><b>Trap:</b> US GAAP capitalizes development costs like IFRS. <b>Fix:</b> US GAAP expenses R&amp;D (except certain software).</li>
<li><b>Trap:</b> FVOCI unrealized gains go to net income. <b>Fix:</b> they go to OCI.</li>
<li><b>Trap:</b> Indefinite-lived intangibles amortized over 40 years. <b>Fix:</b> not amortized; impairment-tested.</li>
<li><b>Trap:</b> Using book value of goodwill as a real asset in credit analysis. <b>Fix:</b> many analysts exclude it.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> goodwill calculation; amortize vs impairment-test; R&amp;D under IFRS vs GAAP; financial asset classification and where gains go; bond carrying value; common-size and liquidity/solvency ratios.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Snapshot</b>Assets = Liabilities + Equity, on one date.</div>
<div class="anchor"><b>Goodwill = price − fair net assets</b>The premium for the intangible "whole".</div>
<div class="anchor"><b>Hold → cost; Hold &amp; sell → OCI; Trade → P&amp;L</b>Financial asset buckets.</div>
<div class="anchor"><b>Finite amortize, indefinite test</b>Intangibles rule.</div></div>`,
summary:`Internally created intangibles are generally expensed (IFRS allows development costs to be capitalized when criteria are met; US GAAP expenses R&amp;D except certain software), purchased intangibles are capitalized, finite-lived intangibles are amortized and indefinite-lived intangibles are tested for impairment. Goodwill, the excess of purchase price over the fair value of identifiable net assets, is not amortized but tested for impairment at least annually. Under IFRS, debt held to collect is at amortized cost, debt held to collect and sell at FVOCI, and trading debt, equities and derivatives at FVPL (with elections available); under US GAAP, held-to-maturity is at amortized cost, trading and available-for-sale at fair value with unrealized gains in income or OCI respectively. Financial liabilities are at amortized cost (moving to par), trading and derivative liabilities at fair value, and deferred tax liabilities arise from temporary differences. Common-size balance sheets (% of total assets) and liquidity (current, quick, cash) and solvency (debt-to-equity, debt ratio, financial leverage) ratios support comparison.`
},
quiz:[
{q:"Under US GAAP, development costs for a new drug are:",o:["capitalized if technically feasible","expensed as incurred","amortized over 5 years"],a:1,e:"US GAAP expenses R&D (software is the main exception)."},
{q:"Under IFRS, unrealized gains on debt securities held to collect cash flows and to sell are reported in:",o:["net income","other comprehensive income","not reported"],a:1,e:"FVOCI category."},
{q:"A firm pays $300m for a company whose identifiable net assets have a fair value of $220m. Goodwill is:",o:["$80m","$220m","$300m"],a:0,e:"300 − 220 = $80m."}]
});
