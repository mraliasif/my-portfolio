add({n:46,topic:"eq",title:"Financial Statement Forecasting in Equity Valuation",
los:["46.a Describe approaches to forecasting revenues, expenses, assets, and financing needs in a disaggregated valuation model.","46.b Explain how the appropriate valuation model varies with a company's life cycle stage, including the venture capital method.","46.c Use outputs from a financial statement forecast model to value an equity security."],
s:{
eli5:`<p>Valuation needs forecasts. Break the company into pieces (revenue, costs, assets, financing) and forecast each, rather than guessing one number for profit.</p>
<p>The right valuation method depends on the company's age. A start-up with no profits? Guess what it might be worth when it grows up, then work backward at a very high required return (that's what venture capitalists do). A mature business? Use a steady-growth model.</p>`,
core:`<p><strong>What problem is this solving?</strong> Building forecasts that feed valuation models and choosing a model that fits where the company is in its life cycle.</p>
<ul><li><strong>Disaggregated models</strong> let analysts incorporate industry projections, competition and company specifics.</li>
<li><strong>Revenue:</strong> historical growth, bottom-up (units × price, segments, store counts), top-down (GDP → industry → market share).</li>
<li><strong>Expenses:</strong> historical relationships, itemizing significant expenses, or a direct profit-margin approach.</li>
<li><strong>Assets:</strong> grow with sales (constant growth) or individual forecasts (regression).</li>
<li><strong>Financing needs</strong> = Δoperating assets − Δnon-debt liabilities − Δretained earnings: the gap filled by debt or new equity.</li>
<li><strong>Life cycle:</strong> start-ups → multiple of future sales / VC method; growth firms → most value in terminal value; mature → constant growth; decline → probability-weighted going-concern vs liquidation values.</li></ul>`,
formal:`<h4>Forecasting components</h4>
<ul><li>Revenue: historical; bottom-up (sum of segments, volume × price); top-down (macro → industry → share); hybrid.</li>
<li>Expenses: historical ratio to sales; itemized (COGS, SG&amp;A, R&amp;D separately, fixed vs variable); direct margin.</li>
<li>Assets: constant growth with sales; regression on drivers; working capital via days ratios; PP&amp;E via capex and depreciation.</li>
<li>Financing needs = Δ operating assets − Δ non-debt liabilities − Δ retained earnings.</li></ul>
<h4>Valuation by life-cycle stage</h4>
<table><tr><th>Stage</th><th>Approach</th></tr>
<tr><td>Start-up</td><td>Multiple of anticipated future sales; VC method; scenario analysis</td></tr>
<tr><td>Growth</td><td>Multistage DCF; most value in terminal value</td></tr>
<tr><td>Mature</td><td>Constant growth DDM/FCF; multiples</td></tr>
<tr><td>Decline</td><td>Probability-weighted going-concern and liquidation values</td></tr></table>
<h4>Venture capital method</h4>
<ul><li>ROI multiple = (1 + r)<sup>t</sup> (r is high, e.g., 30–60%).</li>
<li>Post-money value = expected exit value / ROI multiple.</li>
<li>Pre-money value = post-money − VC investment.</li>
<li>VC ownership = investment / post-money.</li></ul>`,
math:`<div class="f"><span class="lbl">Financing needs</span>Δ operating assets − Δ non-debt liabilities − Δ retained earnings</div>
<div class="f"><span class="lbl">VC method</span>Multiple = (1 + r)<sup>t</sup> · Post = exit/multiple · Pre = post − investment · Ownership = investment/post</div>
<p><strong>Why it works:</strong> the VC discounts the exit value back at a target return to find what the whole company is worth today after the cash comes in.</p>
<div class="dir"><div>Higher required return r → post-money <span class="dn">↓</span> → VC ownership <span class="up">↑</span></div></div>
<div class="calc" data-calc="vc"></div>`,
example:`<div class="q">(a) A VC invests $10m in a start-up expected to be worth $200m at exit in 5 years; required return 40%. Calculate the ROI multiple, post-money and pre-money values, and the VC's ownership. (b) Operating assets increase by $80m, non-debt liabilities by $20m and retained earnings by $35m. Financing needs?</div>
<ol class="steps"><li><strong>Multiple</strong> = 1.40<sup>5</sup> = <strong>5.378×</strong>.</li>
<li><strong>Post-money</strong> = 200/5.378 = <strong>$37.19m</strong>.</li>
<li><strong>Pre-money</strong> = 37.19 − 10 = <strong>$27.19m</strong>.</li>
<li><strong>Ownership</strong> = 10/37.19 = <strong>26.9%</strong>.</li>
<li><strong>Financing needs</strong> = 80 − 20 − 35 = <strong>$25m</strong> (debt or new equity).</li></ol>
<p class="ans">Answers: 5.378× · post $37.19m · pre $27.19m · 26.9% · $25m</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Ownership = investment / pre-money. <b>Fix:</b> divide by post-money.</li>
<li><b>Trap:</b> Constant-growth model for start-ups. <b>Fix:</b> use VC method or sales multiples.</li>
<li><b>Trap:</b> Forgetting retained earnings when computing external financing. <b>Fix:</b> internal funding reduces needs.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> revenue/expense forecasting approaches; financing needs; model by life-cycle stage; VC method calculations.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Exit ÷ (1+r)<sup>t</sup> = post-money</b>VC method.</div>
<div class="anchor"><b>Model fits the life stage</b>Start-up → VC; mature → Gordon; decline → liquidation weight.</div>
<div class="anchor"><b>Assets up, minus free funding = need</b>Financing gap.</div></div>`,
summary:`Disaggregated valuation models incorporate industry projections, the competitive environment and company attributes. Revenue forecasts can be based on historical growth, a bottom-up approach or a top-down approach; expense forecasts on historical relationships, itemizing significant expenses, or a direct profit margin approach; assets on constant growth or regression on drivers. Financing needs = Δoperating assets − Δnon-debt liabilities − Δretained earnings. Valuation models vary by life-cycle stage: start-ups are valued as a multiple of anticipated sales or with the venture capital method (ROI multiple = (1 + r)<sup>t</sup>; post-money = exit value/multiple; pre-money = post-money − investment; VC ownership = investment/post-money); growth firms derive most value from terminal value; mature firms tend to be valued with constant growth models; decline-phase firms with a probability-weighted average of going-concern and liquidation values. Forecast outputs feed the chosen valuation method.`
},
quiz:[
{q:"Expected exit value $150m in 4 years; required return 50%; investment $5m. VC ownership is closest to:",o:["3.3%","16.9%","20.3%"],a:1,e:"1.5⁴ = 5.0625; post = 29.63; 5/29.63 = 16.9%."},
{q:"A firm in decline is most appropriately valued using:",o:["a constant growth model","a probability-weighted average of going-concern and liquidation values","a multiple of anticipated future sales"],a:1,e:"Reflects possible distress."},
{q:"Forecasting revenue from GDP growth and expected market share is a:",o:["bottom-up approach","top-down approach","historical approach"],a:1,e:"Macro → industry → company."}]
});

add({n:47,topic:"eq",title:"Industry and Competitive Analysis",
los:["47.a Describe the steps in an industry and competitive analysis.","47.b Describe industry classification systems and their limitations, and alternative ways to group companies.","47.c Evaluate an industry's size, growth, profitability, and market share trends.","47.d Analyze an industry's structure and external influences using Porter's five forces and PESTLE."],
s:{
eli5:`<p>Before judging a player, understand the game. Is the industry growing? Are there many rivals fighting on price, or a few big players? Can suppliers or customers push the company around? Could new firms or substitute products steal business? And what outside forces (laws, technology, the economy) are changing the rules?</p>`,
core:`<p><strong>What problem is this solving?</strong> Understanding the economics of the industry a company operates in, which shapes its growth, margins and risk.</p>
<ul><li><strong>Five steps:</strong> define the industry; survey size, growth, profitability and market share; analyze structure; analyze external influences; determine competitive strategies.</li>
<li><strong>Classification systems:</strong> GICS (sector → industry group → industry → sub-industry), ICB (industry → supersector → sector → subsector), TRBC (economic sector → business sector → industry group → industry → activity). Limitations: mixed business models, multi-product firms, local markets, changes over time. Alternatives: geography, business-cycle sensitivity (cyclical vs defensive).</li>
<li><strong>Measures:</strong> size (total annual sales of the product; top-down or bottom-up), growth vs economy, profitability (operating margin, ROIC), market share and concentration (HHI).</li>
<li><strong>Structure:</strong> Porter's five forces. <strong>External influences:</strong> PESTLE (political, economic, social, technological, legal, environmental).</li></ul>`,
formal:`<h4>Industry metrics</h4>
<ul><li>Industry size = total annual sales of the product (not necessarily all sales of firms in the industry). Top-down: government/third-party data; bottom-up: sum of producers' revenues for the product.</li>
<li>Growth industries expand faster than the economy; mature industries grow with or below it.</li>
<li>Operating margin = operating income/revenue; ROIC = NOPAT/average invested capital.</li>
<li>Market share = company revenue/industry sales.</li>
<li><strong>HHI</strong> = Σ (market share %)². Higher = more concentrated (e.g., &gt; 2,500 highly concentrated; &lt; 1,500 unconcentrated).</li></ul>
<h4>Porter's five forces</h4>
<table><tr><th>Force</th><th>Profitability is lower when</th></tr>
<tr><td>Threat of new entrants</td><td>Low barriers (capital, regulation, scale, brand)</td></tr>
<tr><td>Threat of substitutes</td><td>Close substitutes, low switching costs</td></tr>
<tr><td>Bargaining power of customers</td><td>Concentrated buyers, standardized products</td></tr>
<tr><td>Bargaining power of suppliers</td><td>Few suppliers, unique inputs</td></tr>
<tr><td>Rivalry</td><td>Many similar competitors, slow growth, high fixed costs, high exit barriers</td></tr></table>
<h4>PESTLE</h4>
<p>Political (policy, trade), Economic (cycle, rates, FX), Social (demographics, tastes), Technological (innovation, disruption), Legal (regulation, litigation), Environmental (climate, resource constraints).</p>`,
math:`<div class="f"><span class="lbl">HHI</span>HHI = Σ s<sub>i</sub>² (shares in %; max 10,000 for a monopoly)</div>
<div class="f"><span class="lbl">Profitability</span>Operating margin = EBIT/revenue · ROIC = NOPAT/avg invested capital</div>
<p><strong>Why square shares?</strong> Squaring gives large firms more weight, so concentration in a few firms shows up strongly.</p>
<div class="dir"><div>Higher HHI → less rivalry → more pricing power (usually)</div></div>`,
example:`<div class="q">An industry has four firms with market shares of 40%, 30%, 20% and 10%. (a) HHI and interpretation. (b) If the two smallest merge? (c) Industry sales grew 2% while GDP grew 3%: classify.</div>
<ol class="steps"><li><strong>HHI</strong> = 40² + 30² + 20² + 10² = 1,600 + 900 + 400 + 100 = <strong>3,000</strong> → highly concentrated.</li>
<li><strong>After merger</strong> (40, 30, 30): 1,600 + 900 + 900 = <strong>3,400</strong>.</li>
<li><strong>Growth</strong> below GDP → <strong>mature</strong> (possibly declining).</li></ol>
<p class="ans">Answers: HHI 3,000 → 3,400 · mature industry</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Industry size = sum of all revenues of firms in the industry. <b>Fix:</b> total sales of the product only.</li>
<li><b>Trap:</b> Using decimal shares in HHI then comparing with thresholds in thousands. <b>Fix:</b> use percentages.</li>
<li><b>Trap:</b> Confusing GICS and ICB hierarchies. <b>Fix:</b> GICS: sector first; ICB: industry first.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> order of steps; classification system tiers and limitations; HHI calculation; five forces effects; categorize PESTLE factors.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Define · Survey · Structure · External · Strategy</b>Five steps.</div>
<div class="anchor"><b>Entrants · Substitutes · Buyers · Suppliers · Rivals</b>Five forces.</div>
<div class="anchor"><b>PESTLE</b>Political, Economic, Social, Tech, Legal, Environmental.</div></div>`,
summary:`Industry and competitive analysis has five steps: define the industry; survey its size, growth, profitability and market share trends; analyze its structure; analyze external influences; and determine participants' competitive strategies. Commercial classification systems include GICS (sector, industry group, industry, sub-industry), ICB (industry, supersector, sector, subsector) and TRBC (economic sector, business sector, industry group, industry, activity); limitations include grouping firms with different business models, misclassifying multi-product firms, ignoring local markets and changes over time. Companies can also be grouped by geography or business-cycle sensitivity. Industry size is total annual sales of the product (top-down or bottom-up); growth industries outpace the economy and mature industries grow in line or slower; profitability is measured by operating margin and ROIC; concentration by market shares and the HHI (sum of squared market shares). Porter's five forces (new entrants, substitutes, customer power, supplier power, rivalry) describe industry structure, and PESTLE (political, economic, social, technological, legal, environmental) external influences.`
},
quiz:[
{q:"Three firms have equal market shares. The HHI is closest to:",o:["1,111","3,333","10,000"],a:1,e:"3 × 33.3² ≈ 3,333."},
{q:"Which is part of the GICS hierarchy?",o:["Supersector","Sub-industry","Activity"],a:1,e:"Supersector is ICB; activity is TRBC."},
{q:"High switching costs for customers most likely:",o:["increase the threat of substitutes","decrease the threat of substitutes","increase rivalry"],a:1,e:"Switching costs protect incumbents."}]
});

add({n:48,topic:"eq",title:"Company Analysis: Past, Present, and Future",
los:["48.a Describe a company's competitive strategy in relation to its life-cycle stage and generic strategies.","48.b Analyze revenue drivers, operating profitability metrics, and pricing power.","48.c Evaluate a company's capital investment, working capital, cash flow, return on invested capital, and capital structure."],
s:{
eli5:`<p>Now look at the player. Is it a newborn, a teenager growing fast, a grown-up, or getting old? How does it win: being the cheapest, being special, or serving a niche? Can it raise prices without losing customers? Does it turn profit into cash? And does it earn more on its investments than its money costs?</p>`,
core:`<p><strong>What problem is this solving?</strong> Evaluating how a company creates value relative to peers and how sustainable that is.</p>
<ul><li><strong>Life cycle:</strong> start-up (little revenue, negative cash flow), growth (fast revenue, cash flow ±), mature (growth slows, cash flow steadies; risk of "stuck in the middle"), decline (falling revenue; cost cuts, restructuring, exit).</li>
<li><strong>Generic strategies:</strong> cost leadership (lowest cost/price, volume), differentiation (distinct type, quality or delivery; premium price), focus (niche, with cost or differentiation elements).</li>
<li><strong>Profit metrics:</strong> EBITDA (ignores asset replacement), EBIT (affected by capex/depreciation policies), net income (affected by capital structure; less useful for start-ups/cyclicals).</li>
<li><strong>Pricing power:</strong> low in competitive markets and with elastic demand; high with differentiation, few substitutes, entry barriers, loyalty and switching costs.</li>
<li><strong>Cash and capital:</strong> FCFE, working capital efficiency (CCC), net capex (maintain vs expand), ROIC vs WACC (value creation), leverage risk via DFL.</li></ul>`,
formal:`<h4>Revenue drivers</h4>
<p>Bottom-up: volume × price by segment, geography, customer; top-down: economic and industry drivers. Consider product mix, pricing, market share gains.</p>
<h4>Operating profitability</h4>
<ul><li>EBITDA = revenue − COGS − operating expenses (excl. D&amp;A): compares firms with different investment, leverage and tax; ignores asset replacement costs.</li>
<li>EBIT = EBITDA − D&amp;A: distorted by capital investment policies but comparable within an industry.</li>
<li>Net income = EBIT − interest − taxes: affected by capital structure.</li></ul>
<h4>Cash flow and capital</h4>
<ul><li>FCFE = NI + D&amp;A − ΔWC − ΔLT assets + Δdebt.</li>
<li>Working capital = CA − CL; CCC = DIO + DSO − DPO (longer → more financing needs).</li>
<li>Net capex vs depreciation: &gt; D&amp;A suggests expansion; ≈ D&amp;A maintenance.</li>
<li>ROIC = NOPAT/invested capital; value created when ROIC &gt; WACC.</li>
<li>DFL = %ΔNI / %ΔEBIT (≈ EBIT/(EBIT − interest)): higher leverage → more volatile NI.</li></ul>`,
math:`<div class="f"><span class="lbl">FCFE</span>NI + D&amp;A − ΔWC − ΔLT assets + Δdebt</div>
<div class="f"><span class="lbl">Cash conversion cycle</span>DIO + DSO − DPO</div>
<div class="f"><span class="lbl">Degree of financial leverage</span>DFL = %ΔNI / %ΔEBIT ≈ EBIT/(EBIT − interest)</div>
<div class="dir"><div>ROIC &gt; WACC → value created; growth adds value</div><div>ROIC &lt; WACC → growth destroys value</div></div>`,
example:`<div class="q">(a) NI $200m; D&amp;A $60m; working capital increases $30m; LT assets increase $90m; net borrowing $40m. FCFE? (b) DIO 50, DSO 40, DPO 35: CCC. (c) EBIT rises 20% and NI rises 30%: DFL. (d) ROIC 9%, WACC 10%: is growth valuable?</div>
<ol class="steps"><li><strong>FCFE</strong> = 200 + 60 − 30 − 90 + 40 = <strong>$180m</strong>.</li>
<li><strong>CCC</strong> = 50 + 40 − 35 = <strong>55 days</strong>.</li>
<li><strong>DFL</strong> = 30%/20% = <strong>1.5</strong>.</li>
<li><strong>ROIC &lt; WACC</strong> → growth <strong>destroys</strong> value.</li></ol>
<p class="ans">Answers: $180m · 55 days · 1.5 · no</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> EBITDA reflects capital needs. <b>Fix:</b> ignores asset replacement.</li>
<li><b>Trap:</b> Adding ΔWC in FCFE. <b>Fix:</b> an increase in WC is subtracted.</li>
<li><b>Trap:</b> Any growth adds value. <b>Fix:</b> only if ROIC &gt; WACC.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> match life-cycle stage and strategy; choose profit metric; pricing power drivers; FCFE, CCC, DFL calculations; ROIC vs WACC.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Cheapest · Special · Niche</b>Generic strategies.</div>
<div class="anchor"><b>ROIC &gt; WACC</b>The value-creation test.</div>
<div class="anchor"><b>DFL = %ΔNI ÷ %ΔEBIT</b>Leverage magnifies.</div></div>`,
summary:`Analysts evaluate how a company creates value relative to peers through its competitive strategy (advantage, industry position, resources and capabilities), influenced by its life-cycle stage: start-ups have little revenue and negative cash flow; growth firms have rapid revenue growth; mature firms see growth plateau and must avoid being stuck in the middle; declining firms focus on cost management, restructuring or exit. Generic strategies are cost leadership, differentiation and focus. Revenue drivers can be analyzed bottom-up or top-down. EBITDA compares firms with different investment, leverage and taxes but ignores asset replacement; EBIT is comparable within an industry; net income is affected by capital structure and less useful for start-ups and cyclicals. Pricing power is low in competitive markets and with elastic demand, higher with differentiation, few substitutes, entry barriers, loyalty and switching costs. FCFE = NI + D&amp;A − ΔWC − ΔLT assets + Δdebt; the cash conversion cycle measures working capital efficiency; net capex shows maintenance vs expansion; ROIC &gt; WACC indicates value creation; DFL = %ΔNI/%ΔEBIT measures financial risk.`
},
quiz:[
{q:"Which metric is least affected by differences in capital structure?",o:["Net income","EBIT","Net profit margin"],a:1,e:"EBIT is before interest."},
{q:"A company's ROIC is below its WACC. Rapid expansion will most likely:",o:["create value","destroy value","have no effect on value"],a:1,e:"Each dollar invested earns less than it costs."},
{q:"NI $50m, D&A $10m, ΔWC +$5m, ΔLT assets +$20m, Δdebt +$15m. FCFE is:",o:["$40m","$50m","$60m"],a:1,e:"50 + 10 − 5 − 20 + 15 = 50."}]
});

/* ===================== READING 49 ===================== */
add({n:49,topic:"eq",title:"Equity Analyst Research Reports",
los:["49.a Describe the key elements of initial and subsequent company research reports.","49.b Compare sell-side and buy-side research reports.","49.c Explain why valuations of the same stock can differ across analysts."],
s:{
eli5:`<p>An analyst's first report on a company is like a full medical check-up: what the business does, its industry, finances, valuation, risks and a verdict. Later reports are follow-up visits: what's new, did the numbers change, is the verdict still the same?</p>
<p>Bank analysts (sell-side) write for clients outside; fund analysts (buy-side) write for their own team. Different analysts reach different values mostly because they assume different growth and long-term outcomes.</p>`,
core:`<p><strong>What problem is this solving?</strong> Communicating analysis clearly and recognizing who research is for and why conclusions differ.</p>
<ul><li><strong>Initial report:</strong> front page (recommendation, target price, key data), business model, industry and competitive positioning, financial analysis and valuation, investment risks, ESG factors, recommendation.</li>
<li><strong>Subsequent reports:</strong> front matter, recommendation (rationale for changes), analysis of new information, valuation changes with rationale, changes in risks.</li>
<li><strong>Sell-side:</strong> investment banks/brokers; external clients; standardized; regulated for conflicts of interest. <strong>Buy-side:</strong> asset managers; internal investment committees; customized and in-depth; mostly unregulated (not public). <strong>Activist short sellers</strong> (buy-side) publish to expose overvaluation or fraud.</li>
<li><strong>Why valuations differ:</strong> mainly revenue/profit growth, terminal value and capital investment assumptions; financing choices matter less.</li></ul>`,
formal:`<h4>Comparison</h4>
<table><tr><th></th><th>Sell-side</th><th>Buy-side</th></tr>
<tr><td>Objective</td><td>Inform clients, recommend; support banking relationships</td><td>Support internal decisions and monitoring</td></tr>
<tr><td>Detail</td><td>Broad coverage, standardized format</td><td>Customized, in-depth, focused</td></tr>
<tr><td>Audience</td><td>External investors and traders</td><td>Internal teams, PMs</td></tr>
<tr><td>Valuation</td><td>DCF, multiples; focus on future earnings</td><td>Traditional plus proprietary models</td></tr>
<tr><td>Regulation</td><td>Conflict-of-interest rules</td><td>Mostly unregulated</td></tr></table>
<h4>Good report characteristics</h4>
<p>Clear recommendation and target price with time horizon; key assumptions and sensitivity; distinguish facts from opinions; disclose conflicts; consistent with the analysis; timely.</p>
<h4>Sources of valuation differences</h4>
<p>Revenue growth and margins, terminal value assumptions (long-run growth, exit multiple), capex/working capital needs; discount rates; financing assumptions (smaller impact).</p>`,
math:`<p>No new formulas. Sensitivity illustration (Gordon): V = CF₁/(r − g).</p>
<div class="f"><span class="lbl">Terminal growth sensitivity</span>CF₁ = 10, r = 9%: g = 3% → 166.7; g = 4% → 200 (a 1-point change moves value 20%)</div>`,
example:`<div class="q">Two analysts value the same firm with next-year FCFE of $10 and cost of equity 9%. Analyst A uses long-run growth 3%; Analyst B 4%. (a) Values. (b) Which elements of their reports should disclose this? (c) A buy-side analyst at a fund holding the stock writes a report: who reads it and is it regulated like sell-side research?</div>
<ol class="steps"><li><strong>A:</strong> 10/0.06 = <strong>$166.7</strong>; <strong>B:</strong> 10/0.05 = <strong>$200</strong>.</li>
<li><strong>Disclosure:</strong> valuation section (key assumptions, sensitivity) and investment risks.</li>
<li><strong>Buy-side:</strong> internal investment team/committee; largely unregulated since not public.</li></ol>
<p class="ans">Answers: $166.7 vs $200 (terminal growth drives the difference)</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Financing choices drive most valuation differences. <b>Fix:</b> growth, terminal value and capex assumptions dominate.</li>
<li><b>Trap:</b> Buy-side reports are heavily regulated. <b>Fix:</b> mostly unregulated; sell-side faces conflict rules.</li></ul>`,

anchors:`<div class="anchors"><div class="anchor"><b>Check-up then follow-ups</b>Initial vs subsequent reports.</div>
<div class="anchor"><b>Sell = outside; Buy = inside</b>Audience.</div>
<div class="anchor"><b>Growth, terminal, capex</b>Why values differ.</div></div>`,
summary:`An initial company research report typically includes a front page, analysis of the business model, industry overview and competitive positioning, financial analysis and valuation, investment risks, ESG factors and a recommendation; subsequent reports include front matter, the recommendation with rationale for changes, analysis of new information, valuation changes and changes in risks. Sell-side research, produced by investment banks for clients, aims to inform and recommend, covers many stocks in a standardized format, targets external investors and traders and is subject to conflict-of-interest regulation. Buy-side research supports internal decisions, is customized and in-depth, targets internal teams and is mostly unregulated; activist short sellers are a branch seeking to expose misinformation or fraud. Valuations of the same stock differ mainly because of assumptions about revenue and profitability growth, terminal value and capital investment needs; financing choices matter less.`

quiz:[
{q:"Which is most characteristic of buy-side research?",o:["Standardized format for external clients","Customized analysis for internal decision-making","Strict conflict-of-interest regulation"],a:1,e:"Buy-side supports internal decisions."},

/* ===================== READING 50 ===================== */
add({n:50,topic:"eq",title:"The Capital Asset Pricing Model, Market Model, and Other Factor-Based Equity Models",
los:["50.a Calculate and interpret the required return on equity using the CAPM, including beta estimation (market model, adjusted beta, unlevering and relevering), market risk premium estimates, and country risk premiums.","50.b Describe arbitrage pricing theory and multifactor models, including the four-factor model."],
s:{
eli5:`<p>Investors want extra return for risk they can't diversify away. CAPM says: required return = safe rate + beta × market premium. Beta measures how much the stock swings with the market.</p>
<p>No good history for your company's beta? Borrow a similar company's beta, strip out the effect of its debt, then add back your company's debt. For emerging markets, add a country risk premium. Multifactor models add more risk drivers like size, value and momentum.</p>`,
core:`<p><strong>What problem is this solving?</strong> Estimating the required return (cost of equity) used to discount equity cash flows.</p>
<ul><li><strong>CAPM:</strong> E(R) = R<sub>f</sub> + β[E(R<sub>m</sub>) − R<sub>f</sub>]: single factor, prices only systematic risk.</li>
<li><strong>Market model:</strong> R<sub>i</sub> = α + βR<sub>m</sub> + ε; regress historical returns to estimate β.</li>
<li><strong>Adjusted beta</strong> = ⅔ raw + ⅓(1): betas mean-revert toward 1.</li>
<li><strong>Pure-play (comparables) beta:</strong> unlever the comparable's beta with its D/E, then relever with the subject's D/E.</li>
<li><strong>Market risk premium:</strong> historical (arithmetic or geometric mean excess return) or forward-looking (D/P + g − R<sub>f</sub>).</li>
<li><strong>Country risk premium</strong> = sovereign yield spread × (σ equity / σ sovereign bond), added for emerging markets.</li>
<li><strong>APT</strong> allows multiple factors without specifying them; the <strong>four-factor model</strong> adds size, value and momentum to the market.</li></ul>`,
formal:`<h4>Beta estimation</h4>
<ul><li>Regression choices: index, frequency, period length; standard errors.</li>
<li>Adjusted (Blume) beta = 0.67 × raw + 0.33 × 1.0.</li>
<li>Unlever: β<sub>U</sub> = β<sub>L,comp</sub> / [1 + (1 − t<sub>comp</sub>)(D/E)<sub>comp</sub>].</li>
<li>Relever: β<sub>L,subject</sub> = β<sub>U</sub>[1 + (1 − t<sub>subject</sub>)(D/E)<sub>subject</sub>].</li></ul>
<h4>Equity risk premium</h4>
<ul><li>Historical: arithmetic mean (preferred for single-period forecasts; higher) vs geometric mean (compound; lower); survivorship bias inflates it.</li>
<li>Forward-looking (Gordon): ERP = D₁/P₀ + g − R<sub>f</sub>.</li>
<li>Emerging markets: E(R) = R<sub>f</sub> + β(ERP + CRP), CRP = sovereign spread × σ<sub>equity</sub>/σ<sub>sovereign bond</sub>.</li></ul>
<h4>Multifactor models</h4>
<ul><li>APT: E(R<sub>i</sub>) = R<sub>f</sub> + Σ β<sub>ik</sub>λ<sub>k</sub>; requires no arbitrage, does not specify factors.</li>
<li>Four-factor (Carhart): market + SMB (size) + HML (value) + WML/UMD (momentum).</li>
<li>Macroeconomic factor models (inflation, GDP surprises) and fundamental factor models.</li></ul>`,
math:`<div class="f"><span class="lbl">CAPM</span>r<sub>e</sub> = R<sub>f</sub> + β × ERP (+ β × CRP for emerging markets)</div>
<div class="f"><span class="lbl">Adjusted beta</span>β<sub>adj</sub> = ⅔ β<sub>raw</sub> + ⅓</div>
<div class="f"><span class="lbl">Unlever / relever</span>β<sub>U</sub> = β<sub>L</sub>/[1 + (1 − t)D/E] · β<sub>L</sub> = β<sub>U</sub>[1 + (1 − t)D/E]</div>
<div class="f"><span class="lbl">Forward ERP</span>ERP = D₁/P₀ + g − R<sub>f</sub></div>
<div class="f"><span class="lbl">CRP</span>Sovereign spread × σ<sub>equity</sub>/σ<sub>bond</sub></div>
<div class="dir"><div>More debt → levered beta <span class="up">↑</span> → cost of equity <span class="up">↑</span></div><div>Raw β &gt; 1 → adjusted β smaller; raw β &lt; 1 → adjusted β larger</div></div>
<div class="calc" data-calc="beta"></div>`,
example:`<div class="q">(a) Raw regression beta 1.3: adjusted beta. (b) Private target; comparable has levered beta 1.2, D/E 0.5, tax 25%; target D/E 0.8, tax 25%; R<sub>f</sub> 4%, ERP 5%. Target's cost of equity. (c) Emerging market: sovereign spread 3%, σ equity 24%, σ sovereign bonds 16%: CRP. (d) Dividend yield 2%, long-run growth 5%, R<sub>f</sub> 4%: forward ERP.</div>
<ol class="steps"><li><strong>Adjusted β</strong> = ⅔ × 1.3 + ⅓ = <strong>1.20</strong>.</li>
<li><strong>Unlever:</strong> 1.2/(1 + 0.75 × 0.5) = 1.2/1.375 = <strong>0.8727</strong>.</li>
<li><strong>Relever:</strong> 0.8727 × (1 + 0.75 × 0.8) = 0.8727 × 1.6 = <strong>1.3964</strong>.</li>
<li><strong>r<sub>e</sub></strong> = 4% + 1.3964 × 5% = <strong>10.98%</strong>.</li>
<li><strong>CRP</strong> = 3% × 24/16 = <strong>4.5%</strong>.</li>
<li><strong>Forward ERP</strong> = 2% + 5% − 4% = <strong>3.0%</strong>.</li></ol>
<p class="ans">Answers: 1.20 · β<sub>U</sub> 0.873 → β<sub>L</sub> 1.396 → 10.98% · CRP 4.5% · ERP 3.0%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Relevering with the comparable's D/E. <b>Fix:</b> unlever with comparable's, relever with subject's.</li>
<li><b>Trap:</b> CRP = sovereign spread only. <b>Fix:</b> scale by σ equity/σ bond.</li>
<li><b>Trap:</b> APT specifies factors. <b>Fix:</b> it doesn't; four-factor model does.</li>
<li><b>Trap:</b> Adjusted beta moves away from 1. <b>Fix:</b> toward 1.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> CAPM return; adjusted beta; unlever/relever; forward ERP; CRP; identify four-factor model factors; APT assumptions.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Safe + beta × premium</b>CAPM.</div>
<div class="anchor"><b>Strip their debt, add yours</b>Pure-play beta.</div>
<div class="anchor"><b>Market · Size · Value · Momentum</b>Four factors.</div></div>`,
summary:`The CAPM prices only systematic risk: E(R) = R<sub>f</sub> + β[E(R<sub>m</sub>) − R<sub>f</sub>]. The market model regresses historical stock returns on market returns to estimate beta; adjusted beta (⅔ raw + ⅓) accounts for mean reversion toward one. A comparable's beta is unlevered using its debt-to-equity and tax rate and relevered with the subject's. The market risk premium can be estimated historically (arithmetic or geometric mean excess returns) or forward-looking (dividend yield + growth − risk-free rate). For emerging markets, a country risk premium equal to the sovereign yield spread times the ratio of equity to sovereign bond volatility is added. Arbitrage pricing theory provides a multifactor framework without specifying the factors; the four-factor model adds size, value (style) and momentum factors to the market factor.`
},
quiz:[
{q:"R_f = 3%, β = 1.2, ERP = 6%. CAPM required return is:",o:["7.2%","10.2%","9.0%"],a:1,e:"3 + 1.2 × 6 = 10.2%."},
{q:"A raw beta of 0.7 has an adjusted beta closest to:",o:["0.47","0.80","1.00"],a:1,e:"⅔ × 0.7 + ⅓ = 0.80."},
{q:"Which is NOT one of the four-factor model's factors?",o:["Momentum","Size","Inflation"],a:2,e:"Market, size, value, momentum."}]
});

<script>
(function(){
const TOPICS={fsa:{name:"Financial Statement Analysis",short:"FSA",color:"var(--quant)",blurb:"The analysis framework; income statement, balance sheet and cash flows; inventories, long-term assets, leases, pensions and taxes; reporting quality, ratios and modeling."},
eq:{name:"Equity Investments",short:"Equity",color:"var(--econ)",blurb:"Equity instruments, voting, issuance and trading, sources of return, valuation (DCF, multiples, forecasting), industry and company analysis, research reports and the CAPM."}};
const SECS=[["eli5","Ultra-Simple (ELI5)"],["core","Intuitive Core Idea"],["formal","Formal CFA-Level"],["math","Mathematics Made Intuitive"],["example","Worked Example"],["traps","Common Mistakes & Traps"],["exam","Thinking in the Exam"],["anchors","Memory Anchors"],["summary","One-Paragraph Summary"],["quiz","Quick Quiz"]];
const R=window.READINGS.sort((a,b)=>a.n-b.n);
const store={get(k,d){try{const v=localStorage.getItem("cfa1fsaeq:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("cfa1fsaeq:"+k,JSON.stringify(v))}catch(e){}}};
let done=store.get("done",{});
let state={r:null,s:"eli5",all:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=h=>h.replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ").replace(/\s+/g," ");

/* theme */
const th=store.get("theme",null); if(th) document.documentElement.setAttribute("data-theme",th);
$("#theme").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const nx=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);store.set("theme",nx)};

function nav(filter){
  const f=(filter||"").trim().toLowerCase();
  let h="";
  for(const t of Object.keys(TOPICS)){
    const rs=R.filter(r=>r.topic===t);
    const dn=rs.filter(r=>done[r.n]).length;
    let items="";
    for(const r of rs){
      let snip="";
      if(f){
        if(!r.title.toLowerCase().includes(f)&&!String(r.n).startsWith(f)){
          const txt=r._txt||(r._txt=strip(Object.values(r.s).join(" ")));
          const i=txt.toLowerCase().indexOf(f);
          if(i<0) continue;
          snip=`<span class="hit">…${esc(txt.slice(Math.max(0,i-30),i+50))}…</span>`;
        }
      }
      items+=`<button class="rlink${state.r===r.n?" on":""}${done[r.n]?" done":""}" data-r="${r.n}" style="--tc:${TOPICS[t].color}"><span class="n">${r.n}</span><span>${esc(r.title)}${snip}</span><span class="ok">✓</span></button>`;
    }
    if(!items&&f) continue;
    h+=`<div class="topic" style="--tc:${TOPICS[t].color}"><div class="topic-h">${TOPICS[t].name}<span>${dn}/${rs.length}</span></div>${items||""}</div>`;
  }
  $("#nav").innerHTML=h||`<div class="overall">No matches.</div>`;
  const tot=Object.keys(done).filter(k=>done[k]).length;
  $("#ovtxt").textContent=`${tot} of ${R.length} readings marked done`;
  $("#ovbar").style.width=(100*tot/R.length)+"%";
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest(".rlink");if(b){go(+b.dataset.r,"eli5");document.body.classList.remove("nav")}});
$("#q").addEventListener("input",e=>nav(e.target.value));
$("#scrim").onclick=()=>document.body.classList.remove("nav");

function home(){
  state.r=null;
  const counts=k=>R.filter(r=>r.topic===k);
  let cards="";
  for(const k of Object.keys(TOPICS)){const rs=counts(k);if(!rs.length)continue;const dn=rs.filter(r=>done[r.n]).length;
    cards+=`<button class="tcard" data-r="${rs[0].n}" style="--tc:${TOPICS[k].color}"><h3>${TOPICS[k].name}</h3><p>${TOPICS[k].blurb}</p><div style="font-size:13px;color:var(--ink3)">Readings ${rs[0].n}–${rs[rs.length-1].n} · ${dn}/${rs.length} done</div><div class="bar"><i style="width:${100*dn/rs.length}%;background:var(--tc)"></i></div></button>`}
  $("#main").innerHTML=`<div class="topbar"><button class="iconbtn" id="burger" aria-label="Menu">☰</button><span class="t">CFA L1 · FSA &amp; Equity</span></div>
  <div class="home" style="padding-top:26px"><div class="kicker" style="--tc:var(--accent)">SchweserNotes 2027 · FSA &amp; Equity</div><h2>Learn every reading three times over: simply, intuitively, then exam-precise.</h2>
  <p class="lead">24 readings, each taught in the same nine layers, plus a quick quiz. Pick a topic to start, or jump in from the sidebar. Calculators inside the maths sections let you move the inputs and watch the answer change.</p>
  <div class="cards">${cards}</div>
  <div class="legend">${SECS.map((s,i)=>`<div><b>${i+1}.</b> ${s[1]}</div>`).join("")}</div>
  <p class="hint">Keys: <kbd>←</kbd> <kbd>→</kbd> move between sections · <kbd>[</kbd> <kbd>]</kbd> previous/next reading · <kbd>/</kbd> search</p></div>`;
  $("#main").querySelectorAll(".tcard").forEach(b=>b.onclick=()=>go(+b.dataset.r,"eli5"));
  $("#burger").onclick=()=>document.body.classList.add("nav");
  nav($("#q").value);
}

function secHTML(r,key,label,i){
  if(key==="quiz") return `<section class="sec" id="s-quiz"><h3>${i+1}. ${label}</h3>${quizHTML(r)}</section>`;
  const body=r.s[key]||"<p><em>—</em></p>";
  const cls=key==="summary"?"prose summary":"prose";
  return `<section class="sec" id="s-${key}"><h3>${i+1}. ${label}</h3><div class="${cls}">${body}</div></section>`;
}
function quizHTML(r){
  if(!r.quiz||!r.quiz.length) return "<p>No quiz.</p>";
  return `<div class="quiz"><p class="score" data-score>Answer each question; feedback is instant.</p>${r.quiz.map((q,qi)=>`<div class="qq" data-qi="${qi}"><p class="stem">${qi+1}. ${q.q}</p>${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join("")}<div class="expl">${q.e}</div></div>`).join("")}</div>`;
}
function wireQuiz(r){
  const root=$("#main");
  root.querySelectorAll(".qq").forEach(div=>{
    div.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const q=r.quiz[+div.dataset.qi];const pick=+b.dataset.oi;
      div.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(i===q.a)x.classList.add("right")});
      if(pick!==q.a)b.classList.add("wrong");
      div.classList.add("answered");div.dataset.ok=pick===q.a?"1":"0";
      const all=root.querySelectorAll(".qq"),ans=root.querySelectorAll(".qq.answered");
      const ok=[...ans].filter(x=>x.dataset.ok==="1").length;
      const sc=root.querySelector("[data-score]");
      if(sc) sc.textContent=ans.length===all.length?`Score: ${ok}/${all.length}${ok===all.length?" — perfect.":" — re-read the explanations for the misses."}`:`${ok}/${ans.length} correct so far`;
    });
  });
}

function go(n,sec,noscroll){
  const r=R.find(x=>x.n===n); if(!r) return home();
  state.r=n; state.s=sec||state.s||"eli5";
  const t=TOPICS[r.topic]; const idx=R.indexOf(r); const prev=R[idx-1],next=R[idx+1];
  document.documentElement.style.setProperty("--tc",t.color);
  const tabs=SECS.map((s,i)=>`<button class="tab${!state.all&&state.s===s[0]?" on":""}" data-s="${s[0]}"><b>${i+1}</b>${s[1]}</button>`).join("");
  const body=state.all?SECS.map((s,i)=>secHTML(r,s[0],s[1],i)).join(""):(()=>{const i=SECS.findIndex(s=>s[0]===state.s);return secHTML(r,SECS[i][0],SECS[i][1],i)})();
  const si=SECS.findIndex(s=>s[0]===state.s);
  const secPager=state.all?"":`<div class="pager">${si>0?`<button class="btn" data-sp="${SECS[si-1][0]}">← ${SECS[si-1][1]}</button>`:"<span></span>"}${si<SECS.length-1?`<button class="btn primary" data-sp="${SECS[si+1][0]}">${SECS[si+1][1]} →</button>`:(next?`<button class="btn primary" data-go="${next.n}">Next: R${next.n} ${esc(next.title)} →</button>`:"<span></span>")}</div>`;
  $("#main").innerHTML=`<div class="topbar"><button class="iconbtn" id="burger" aria-label="Menu">☰</button><span class="t">R${r.n} · ${esc(r.title)}</span></div>
  <header class="rhead" style="--tc:${t.color}"><div class="kicker"><a href="#" id="homelink" style="color:inherit;text-decoration:none">Home</a> · ${t.name} · Reading ${r.n}</div><h2>${esc(r.title)}</h2>
  <details class="los"><summary>Learning outcomes (LOS)</summary><ul>${r.los.map(l=>`<li>${l}</li>`).join("")}</ul></details>
  <div class="actions"><button class="btn${done[r.n]?" on":""}" id="markdone">${done[r.n]?"✓ Marked done":"Mark reading done"}</button><button class="btn" id="toggleall">${state.all?"Show one section at a time":"Show all sections on one page"}</button></div></header>
  <div class="tabs" id="tabs">${tabs}</div>
  <div id="body">${body}</div>${secPager}
  <div class="pager">${prev?`<button class="btn" data-go="${prev.n}">← R${prev.n} ${esc(prev.title)}</button>`:"<span></span>"}${next?`<button class="btn" data-go="${next.n}">R${next.n} ${esc(next.title)} →</button>`:"<span></span>"}</div>`;
  $("#burger").onclick=()=>document.body.classList.add("nav");
  $("#homelink").onclick=e=>{e.preventDefault();home();window.scrollTo(0,0)};
  $("#markdone").onclick=()=>{done[r.n]=!done[r.n];store.set("done",done);go(n,state.s,true)};
  $("#toggleall").onclick=()=>{state.all=!state.all;go(n,state.s,true)};
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    if(state.all){const el=document.getElementById("s-"+b.dataset.s);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-70,behavior:"smooth"});return}
    go(n,b.dataset.s)});
  $("#main").querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>go(n,b.dataset.sp));
  $("#main").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go,"eli5"));
  const on=$("#tabs .tab.on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
  renderCalcs(); wireQuiz(r);
  store.set("last",{r:n,s:state.s});
  if(!noscroll){const tb=$("#tabs");const y=tb.getBoundingClientRect().top+scrollY-(innerWidth<=860?55:0);if(scrollY>y)window.scrollTo(0,y)}
  nav($("#q").value);
}

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){e.preventDefault();$("#q").focus();return}
  if(state.r==null)return;
  const si=SECS.findIndex(s=>s[0]===state.s);const idx=R.findIndex(x=>x.n===state.r);
  if(e.key==="ArrowRight"&&!state.all&&si<SECS.length-1)go(state.r,SECS[si+1][0]);
  if(e.key==="ArrowLeft"&&!state.all&&si>0)go(state.r,SECS[si-1][0]);
  if(e.key==="]"&&R[idx+1])go(R[idx+1].n,"eli5");
  if(e.key==="["&&R[idx-1])go(R[idx-1].n,"eli5");
});

/* ---------- calculators ---------- */
const fmt=(x,d=2)=>isFinite(x)?Number(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const pct=(x,d=2)=>isFinite(x)?fmt(100*x,d)+"%":"—";
function irr(cfs){let lo=-0.99,hi=10;const npv=r=>cfs.reduce((s,c,t)=>s+c/Math.pow(1+r,t),0);let flo=npv(lo),fhi=npv(hi);if(flo*fhi>0)return NaN;for(let i=0;i<200;i++){const m=(lo+hi)/2,fm=npv(m);if(flo*fm<=0){hi=m;fhi=fm}else{lo=m;flo=fm}}return (lo+hi)/2}
const CALCS={
 eps:{t:"Basic & diluted EPS (with antidilution check)",i:[["ni","Net income",1000],["pd","Preferred dividends (all preferred)",100],["w","Weighted avg common shares",500],["cpd","Dividends on CONVERTIBLE preferred",50],["cps","Shares if convertible preferred converted",40],["int","Interest on convertible debt",60],["t","Tax rate %",25],["cds","Shares if convertible debt converted",30],["opt","Options outstanding",20],["x","Option exercise price",30],["p","Average market price",40]],
  f:v=>{const basic=(v.ni-v.pd)/v.w;let num=v.ni-v.pd,den=+v.w,notes=[];const tryAdd=(name,dn,dd)=>{const per=dd>0?dn/dd:Infinity;if(per<basic){num+=dn;den+=dd;notes.push(`${name}: +${fmt(dn)} / +${fmt(dd)} sh (per-share ${fmt(per)} &lt; basic → <b>dilutive</b>)`)}else notes.push(`${name}: per-share ${fmt(per)} ≥ basic → <b>antidilutive, excluded</b>`)};tryAdd("Conv. preferred",+v.cpd,+v.cps);tryAdd("Conv. debt",v.int*(1-v.t/100),+v.cds);const tsm=v.p>v.x?v.opt-(v.opt*v.x/v.p):0;if(v.p>v.x){den+=tsm;notes.push(`Options (treasury stock method): ${v.opt} − ${v.opt}×${v.x}/${v.p} = <b>${fmt(tsm,2)}</b> net new shares (dilutive)`)}else notes.push("Options: exercise price ≥ avg price → antidilutive, excluded");return `Basic EPS = (NI − pref div)/shares = <b>${fmt(basic,3)}</b><br>${notes.join("<br>")}<br>Diluted EPS = ${fmt(num)}/${fmt(den,2)} = <b>${fmt(num/den,3)}</b>`}},
 dupont:{t:"DuPont decomposition of ROE",i:[["ni","Net income",120],["ebt","Earnings before tax",160],["ebit","EBIT",200],["rev","Revenue",1000],["ta","Average total assets",800],["te","Average equity",400]],
  f:v=>{const tb=v.ni/v.ebt,ib=v.ebt/v.ebit,om=v.ebit/v.rev,at=v.rev/v.ta,lev=v.ta/v.te;return `Tax burden NI/EBT = <b>${fmt(tb,3)}</b> × Interest burden EBT/EBIT = <b>${fmt(ib,3)}</b> × EBIT margin = <b>${pct(om)}</b> × Asset turnover = <b>${fmt(at,3)}</b> × Leverage = <b>${fmt(lev,3)}</b><br>ROE = <b>${pct(tb*ib*om*at*lev)}</b> · 3-step: net margin ${pct(v.ni/v.rev)} × turnover ${fmt(at,3)} × leverage ${fmt(lev,3)} · ROA = ${pct(v.ni/v.ta)}`}},
 ratios:{t:"Liquidity & solvency ratios",i:[["cash","Cash + marketable securities",50],["ar","Receivables",150],["inv","Inventory",200],["cl","Current liabilities",250],["debt","Total debt",400],["eq","Total equity",600],["ta","Total assets",1200],["ebit","EBIT",180],["int","Interest expense",30]],
  f:v=>{const ca=+v.cash+ +v.ar+ +v.inv;return `Current = ${fmt(ca)}/${v.cl} = <b>${fmt(ca/v.cl,2)}</b> · Quick = <b>${fmt((+v.cash+ +v.ar)/v.cl,2)}</b> · Cash = <b>${fmt(v.cash/v.cl,2)}</b><br>Debt/equity = <b>${fmt(v.debt/v.eq,2)}</b> · Debt/capital = <b>${pct(v.debt/(+v.debt+ +v.eq))}</b> · Debt/assets = <b>${pct(v.debt/v.ta)}</b> · Financial leverage (A/E) = <b>${fmt(v.ta/v.eq,2)}</b><br>Interest coverage EBIT/interest = <b>${fmt(v.ebit/v.int,2)}×</b>`}},
 inv:{t:"Inventory: FIFO vs LIFO vs weighted average (periodic)",i:[["lots","Beginning + purchases as units@cost, in order",'100@10, 200@12, 100@15',"text"],["sold","Units sold",250],["price","Selling price per unit",20]],
  f:v=>{const lots=String(v.lots).split(/,/).map(s=>s.trim().split('@').map(Number)).filter(a=>a.length===2&&!a.some(isNaN));const total=lots.reduce((s,[u])=>s+u,0);const cost=lots.reduce((s,[u,c])=>s+u*c,0);let n=+v.sold;if(n>total)return"Units sold exceed units available.";const take=(arr)=>{let rem=n,c=0;for(const [u,p] of arr){const q=Math.min(u,rem);c+=q*p;rem-=q;if(!rem)break}return c};const fifo=take(lots),lifo=take([...lots].reverse()),avg=n*cost/total;const rev=n*v.price;return `Goods available: ${total} units costing ${fmt(cost)} (avg ${fmt(cost/total,3)})<br>COGS — FIFO <b>${fmt(fifo)}</b> · LIFO <b>${fmt(lifo)}</b> · Avg <b>${fmt(avg)}</b><br>Ending inventory — FIFO <b>${fmt(cost-fifo)}</b> · LIFO <b>${fmt(cost-lifo)}</b> · Avg <b>${fmt(cost-avg)}</b><br>Gross profit — FIFO ${fmt(rev-fifo)} · LIFO ${fmt(rev-lifo)} · Avg ${fmt(rev-avg)} (rising costs → FIFO highest)`}},
 dep:{t:"Depreciation: straight-line vs double-declining balance",i:[["c","Cost",10000],["s","Salvage value",1000],["n","Useful life (years)",5],["y","Show year",2]],
  f:v=>{const sl=(v.c-v.s)/v.n;let bv=+v.c,rows=[];for(let k=1;k<=v.n;k++){let d=bv*2/v.n;if(bv-d<v.s)d=bv-v.s;if(k===+v.n&&bv-d>v.s)d=bv-v.s;bv-=d;rows.push([d,bv])}const y=Math.min(Math.max(1,Math.round(v.y)),v.n);const r=rows[y-1];return `Straight-line: <b>${fmt(sl)}</b> per year → book value end of year ${y} = <b>${fmt(v.c-sl*y)}</b><br>DDB (rate ${pct(2/v.n,0)} of opening BV, stop at salvage): year ${y} depreciation <b>${fmt(r[0])}</b>, ending BV <b>${fmt(r[1])}</b><br>DDB schedule: ${rows.map((x,i)=>`Y${i+1} ${fmt(x[0],0)}`).join(" · ")}`}},
 imp:{t:"Impairment: IFRS vs US GAAP",i:[["cv","Carrying value",900],["ucf","Undiscounted future cash flows",850],["fv","Fair value",700],["sc","Costs to sell",20],["viu","Value in use (PV of cash flows)",720]],
  f:v=>{const rec=Math.max(v.fv-v.sc,+v.viu);const ifrs=Math.max(0,v.cv-rec);const gaapImpaired=v.cv>v.ucf;const gaap=gaapImpaired?Math.max(0,v.cv-v.fv):0;return `IFRS: recoverable amount = max(FV − costs to sell ${fmt(v.fv-v.sc)}, value in use ${fmt(+v.viu)}) = ${fmt(rec)} → loss <b>${fmt(ifrs)}</b> (reversals allowed later, up to original cost basis)<br>US GAAP: recoverability test CV ${fmt(+v.cv)} vs undiscounted CF ${fmt(+v.ucf)} → ${gaapImpaired?"<b>impaired</b>":"<b>not impaired</b>"}; loss = CV − fair value = <b>${fmt(gaap)}</b> (no reversals for assets held for use)`}},
 tax:{t:"Deferred taxes & tax rates",i:[["cv","Asset carrying value (books)",800],["tb","Asset tax base",650],["t","Tax rate %",25],["tp","Taxes payable (tax return)",90],["ddtl","Change in DTL",15],["ddta","Change in DTA",5],["pti","Pretax income (books)",400],["cash","Cash taxes paid",85]],
  f:v=>{const diff=v.cv-v.tb;const dt=diff*v.t/100;const exp=+v.tp+ +v.ddtl-v.ddta;return `Asset: carrying ${v.cv} vs tax base ${v.tb} → ${diff>0?"<b>DTL</b>":diff<0?"<b>DTA</b>":"none"} of ${fmt(Math.abs(dt))} (difference × tax rate)<br>Income tax expense = taxes payable + ΔDTL − ΔDTA = ${v.tp} + ${v.ddtl} − ${v.ddta} = <b>${fmt(exp)}</b><br>Effective tax rate = expense/pretax income = <b>${pct(exp/v.pti)}</b> · Cash tax rate = cash taxes/pretax income = <b>${pct(v.cash/v.pti)}</b> · Statutory ${v.t}%`}},
 cfo:{t:"Indirect CFO → FCFF & FCFE",i:[["ni","Net income",500],["da","Depreciation & amortization",120],["gain","Gain on asset sale",20],["dar","Increase in receivables",40],["dinv","Increase in inventory",30],["dap","Increase in payables",25],["int","Interest paid",50],["t","Tax rate %",25],["fc","Fixed capital investment (capex)",200],["nb","Net borrowing",60]],
  f:v=>{const cfo=+v.ni+ +v.da-v.gain-v.dar-v.dinv+ +v.dap;const fcff=cfo+v.int*(1-v.t/100)-v.fc;const fcfe=cfo-v.fc+ +v.nb;return `CFO = NI + D&amp;A − gain − ΔAR − ΔInv + ΔAP = <b>${fmt(cfo)}</b><br>FCFF = CFO + interest × (1 − t) − FCInv = ${fmt(cfo)} + ${fmt(v.int*(1-v.t/100))} − ${v.fc} = <b>${fmt(fcff)}</b><br>FCFE = CFO − FCInv + net borrowing = <b>${fmt(fcfe)}</b> (also = FCFF − int(1 − t) + net borrowing = ${fmt(fcff-v.int*(1-v.t/100)+ +v.nb)})`}},
 lease:{t:"Lessee lease accounting (year 1)",i:[["pmt","Annual payment (end of year)",10000],["r","Discount rate %",6],["n","Lease term (years)",5]],
  f:v=>{const r=v.r/100;const pv=v.pmt*(1-Math.pow(1+r,-v.n))/r;const int=pv*r;const amort=pv/v.n;const princ=v.pmt-int;return `Initial ROU asset = lease liability = PV of payments = <b>${fmt(pv)}</b><br>Year 1 interest = ${fmt(int)} · principal reduction = ${fmt(princ)} → liability end Y1 = ${fmt(pv-princ)}<br>Finance lease (IFRS all leases; GAAP finance): expense = interest ${fmt(int)} + ROU amortization ${fmt(amort)} = <b>${fmt(int+amort)}</b> (front-loaded)<br>US GAAP operating lease: single straight-line lease expense = <b>${fmt(+v.pmt)}</b>; CFO outflow = full payment (finance lease: interest in CFO or CFF under IFRS, principal in CFF)`}},
 ret:{t:"Equity price return & total return",i:[["p0","Beginning price",50],["p1","Ending price",54],["d","Dividend per share",2],["pdd","Price on dividend payment date",52]],
  f:v=>{const pr=v.p1/v.p0-1,tr=(+v.p1+ +v.d-v.p0)/v.p0,re=(v.p1*(1+v.d/v.pdd)-v.p0)/v.p0;return `Price return = (P₁ − P₀)/P₀ = <b>${pct(pr)}</b><br>Total return = (P₁ − P₀ + D)/P₀ = <b>${pct(tr)}</b><br>Return with dividend reinvested at ${v.pdd}: [P₁(1 + D/P<sub>DD</sub>) − P₀]/P₀ = <b>${pct(re)}</b>`}},
 ddm:{t:"Dividend discount model: constant & two-stage",i:[["d0","Current dividend D₀",2],["g1","High growth % (stage 1)",12],["n","Years of high growth",3],["g2","Long-run growth % (stage 2)",4],["r","Required return %",10]],
  f:v=>{const r=v.r/100,g1=v.g1/100,g2=v.g2/100;if(r<=g2)return"r must exceed long-run growth.";let pv=0,d=+v.d0,rows=[];for(let t=1;t<=v.n;t++){d*=1+g1;pv+=d/Math.pow(1+r,t);rows.push(fmt(d,3))}const dn1=d*(1+g2);const tv=dn1/(r-g2);const pvtv=tv/Math.pow(1+r,v.n);const gordon=v.d0*(1+g2)/(r-g2);return `Constant growth at ${v.g2}%: V₀ = D₀(1 + g)/(r − g) = <b>${fmt(gordon)}</b><br>Two-stage: dividends ${rows.join(", ")} → PV = ${fmt(pv)}<br>Terminal value at year ${v.n} = D<sub>${+v.n+1}</sub>/(r − g) = ${fmt(dn1,3)}/${fmt(r-g2,3)} = ${fmt(tv)} → PV = ${fmt(pvtv)}<br>Value = <b>${fmt(pv+pvtv)}</b> (terminal value = ${pct(pvtv/(pv+pvtv),0)} of total)`}},
 fcfv:{t:"FCFF / FCFE valuation (constant growth)",i:[["fcff","Next year FCFF",120],["wacc","WACC %",9],["gf","FCFF growth %",3],["debt","Market value of debt",500],["fcfe","Next year FCFE",90],["re","Cost of equity %",11],["ge","FCFE growth %",4],["sh","Shares outstanding",100]],
  f:v=>{const firm=v.fcff/((v.wacc-v.gf)/100);const eq1=firm-v.debt;const eq2=v.fcfe/((v.re-v.ge)/100);return `Firm value = FCFF₁/(WACC − g) = <b>${fmt(firm)}</b> → equity = firm − debt = <b>${fmt(eq1)}</b> (${fmt(eq1/v.sh)} per share)<br>Equity value = FCFE₁/(r − g) = <b>${fmt(eq2)}</b> (${fmt(eq2/v.sh)} per share)<br>Rule: FCFF ↔ WACC; FCFE and dividends ↔ cost of equity`}},
 mult:{t:"Justified multiples, PVGO & PEG",i:[["b","Payout ratio %",40],["roe","ROE %",12.5],["r","Required return %",10],["eps1","Next year EPS",5],["bvps","Book value per share",30],["pm","Net profit margin %",8],["price","Current price",80]],
  f:v=>{const r=v.r/100,g=(1-v.b/100)*v.roe/100;if(r<=g)return`g = (1 − payout) × ROE = ${pct(g)} ≥ r: model breaks.`;const pe=(v.b/100)/(r-g);const pb=(v.roe/100-g)/(r-g);const ps=(v.pm/100)*(v.b/100)*(1+g)/(r-g);const pvgo=v.price-v.eps1/r;const actpe=v.price/v.eps1;return `Sustainable g = (1 − payout) × ROE = <b>${pct(g)}</b><br>Justified leading P/E = payout/(r − g) = <b>${fmt(pe,2)}</b> → value = ${fmt(pe*v.eps1)} · Actual P/E = ${fmt(actpe,2)}<br>Justified P/B = (ROE − g)/(r − g) = <b>${fmt(pb,2)}</b> → value = ${fmt(pb*v.bvps)}<br>Justified P/S (trailing) = margin × payout × (1 + g)/(r − g) = <b>${fmt(ps,3)}</b><br>PVGO = P − E₁/r = <b>${fmt(pvgo)}</b> (${pct(pvgo/v.price,0)} of price) · PEG = (P/E)/(g in %) = <b>${fmt(actpe/(g*100),2)}</b>`}},
 ev:{t:"Market cap, enterprise value & EV/EBITDA",i:[["p","Share price",40],["sh","Shares outstanding",100],["pref","Preferred stock (market value)",200],["debt","Debt (market value)",1500],["cash","Cash & short-term investments",300],["mi","Noncontrolling interest",0],["ebitda","EBITDA",700],["bv","Book value of equity",2500]],
  f:v=>{const mc=v.p*v.sh;const ev=mc+ +v.pref+ +v.debt+ +v.mi-v.cash;return `Market cap = <b>${fmt(mc)}</b> · P/B = ${fmt(mc/v.bv,2)} (${mc>v.bv?"market sees value creation":"value shortfall"})<br>EV = market cap + preferred + debt + NCI − cash = <b>${fmt(ev)}</b><br>EV/EBITDA = <b>${fmt(ev/v.ebitda,2)}×</b>`}},
 vc:{t:"Venture capital method",i:[["exit","Expected value at exit",200],["r","Required return %",40],["t","Years to exit",5],["inv","VC investment",10]],
  f:v=>{const m=Math.pow(1+v.r/100,v.t);const post=v.exit/m;return `ROI multiple = (1 + r)<sup>t</sup> = <b>${fmt(m,3)}×</b><br>Post-money value = exit value / ROI multiple = <b>${fmt(post)}</b> · Pre-money = post − investment = <b>${fmt(post-v.inv)}</b><br>VC ownership = investment / post-money = <b>${pct(v.inv/post)}</b>`}},
 beta:{t:"Beta: adjust, unlever, relever & CAPM",i:[["raw","Raw regression beta",1.3],["bc","Comparable's levered beta",1.2],["dec","Comparable D/E",0.5],["tc","Comparable tax rate %",25],["det","Target D/E",0.8],["tt","Target tax rate %",25],["rf","Risk-free rate %",4],["erp","Equity risk premium %",5],["crp","Country risk premium %",0]],
  f:v=>{const adj=2/3*v.raw+1/3;const bu=v.bc/(1+(1-v.tc/100)*v.dec);const bl=bu*(1+(1-v.tt/100)*v.det);const re=+v.rf+bl*(+v.erp+ +v.crp);return `Adjusted beta = ⅔ × raw + ⅓ × 1 = <b>${fmt(adj,3)}</b><br>Unlevered (asset) beta = β<sub>L</sub>/[1 + (1 − t)D/E] = <b>${fmt(bu,3)}</b> → relevered for target = β<sub>U</sub>[1 + (1 − t)D/E] = <b>${fmt(bl,3)}</b><br>Cost of equity = R<sub>f</sub> + β(ERP + CRP) = ${v.rf}% + ${fmt(bl,3)} × ${fmt(+v.erp+ +v.crp)}% = <b>${fmt(re)}%</b>`}},
 float:{t:"Float, average daily volume & turnover",i:[["out","Shares outstanding (m)",200],["closely","Shares held by insiders/controlling holders (m)",60],["vol","Total volume over period (m)",70],["days","Trading days in period",20],["p","Share price",25]],
  f:v=>{const fl=v.out-v.closely;const adv=v.vol/v.days;return `Float = outstanding − closely held = <b>${fmt(fl)}m</b> shares (market float ${fmt(fl*v.p)}m) · free float ${pct(fl/v.out,0)}<br>Average daily volume = <b>${fmt(adv,2)}m</b> shares/day<br>Turnover = ADV / float = <b>${pct(adv/fl,2)}</b> per day`}}
};

function renderCalcs(){
  document.querySelectorAll(".calc[data-calc]").forEach(el=>{
    const c=CALCS[el.dataset.calc]; if(!c||el.dataset.ready) return; el.dataset.ready=1;
    el.innerHTML=`<h5>${c.t}</h5><div class="cgrid">${c.i.map(([k,l,d,ty])=>ty==="range"?`<label class="wide">${l}: <span data-rv="${k}">${d}</span><input type="range" min="-1" max="1" step="0.05" data-k="${k}" value="${d}"></label>`:`<label${ty==="text"?' class="wide"':""}>${l}<input ${ty==="text"?'type="text"':'type="number" step="any"'} data-k="${k}" value="${d}"></label>`).join("")}</div><div class="cout"></div>`;
    const run=()=>{const v={};el.querySelectorAll("input").forEach(i=>{v[i.dataset.k]=i.type==="text"?i.value:parseFloat(i.value);const rv=el.querySelector(`[data-rv="${i.dataset.k}"]`);if(rv)rv.textContent=(+i.value).toFixed(2)});let out;try{out=c.f(v)}catch(e){out="Check inputs."}el.querySelector(".cout").innerHTML=out};
    el.querySelectorAll("input").forEach(i=>i.addEventListener("input",run)); run();
  });
}


/* ---- site routing: every reading/section has its own URL (#r12-math), back/forward work ---- */
const _go=go,_home=home;let _boot=true,_pop=false;const _SK=SECS.map(s=>s[0]);
function _sync(h){if(_pop)return;const cur=location.hash||"";if(cur===(h||""))return;const url=h||(location.pathname+location.search);try{_boot?history.replaceState(null,"",url):history.pushState(null,"",url)}catch(e){}}
go=function(n,sec,noscroll){_go(n,sec,noscroll);if(state.r===n){_sync("#r"+n+(state.all?"":"-"+state.s));store.set("last",{r:n,s:state.s,t:Date.now()})}};
home=function(){_home();_sync("")};
function _route(ns){const h=decodeURIComponent(location.hash.slice(1));let m=h.match(/^r(\d+)(?:-(\w+))?$/);
  if(m&&R.find(x=>x.n===+m[1])){go(+m[1],_SK.includes(m[2])?m[2]:"eli5",ns);return true}
  m=h.match(/^topic-(\w+)$/);if(m){const r=R.find(x=>x.topic===m[1]);if(r){go(r.n,"eli5",ns);return true}}
  if(h==="home"){home();return true}return false}
window.addEventListener("popstate",()=>{_pop=true;if(!_route(false))_home();_pop=false;window.scrollTo(0,0)});
if(location.protocol==="file:")document.querySelectorAll("a.allbooks").forEach(a=>a.setAttribute("href","../index.html"));
const last=store.get("last",null);
if(!_route(true)){if(last&&R.find(x=>x.n===last.r)) go(last.r,last.s,true); else home();}
_boot=false;
})();
</script>
