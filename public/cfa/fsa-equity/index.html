add({n:30,topic:"fsa",title:"Analyzing Statements of Cash Flows I",
los:["30.a Describe how the cash flow statement is linked to the income statement and the balance sheet.","30.b Describe the steps in the preparation of direct and indirect cash flow statements, including how cash flows can be computed using income statement and balance sheet data.","30.c Demonstrate the conversion of cash flows from the indirect to direct method.","30.d Contrast cash flow statements prepared under International Financial Reporting Standards (IFRS) and US generally accepted accounting principles (US GAAP)."],
s:{
eli5:`<p>Profit isn't cash. If you sell lemonade on credit, you've earned the money but haven't got it yet. If you buy a big stock of lemons, cash leaves today even though you'll use them over weeks. The cash flow statement tracks the actual money moving in and out.</p>
<p>It sorts cash into three buckets: <strong>operating</strong> (running the business), <strong>investing</strong> (buying or selling long-term assets), and <strong>financing</strong> (borrowing, repaying, issuing shares, paying dividends).</p>`,
core:`<p><strong>What problem is this solving?</strong> Accrual accounting shows performance but can hide cash shortfalls; a profitable company can still run out of cash. The cash flow statement reconciles profit to cash and shows how operations, investment and financing are funded.</p>
<ul><li><strong>Linkages:</strong> changes in balance sheet accounts explain the gap between income and cash. Operating ↔ current assets/liabilities; investing ↔ non-current assets; financing ↔ non-current liabilities and equity.</li>
<li><strong>Direct method</strong> lists cash receipts and payments (clear picture of operating cash). <strong>Indirect method</strong> starts from net income and adjusts for non-cash items and working capital changes (shows why earnings differ from cash: a quality-of-earnings lens).</li>
<li><strong>Rule for working capital:</strong> increase in an operating asset uses cash (subtract); increase in an operating liability provides cash (add).</li>
<li><strong>Non-cash and non-operating items</strong> (depreciation, gains/losses on sales) are reversed in the indirect method; the full sale proceeds appear in CFI.</li>
<li><strong>IFRS gives more classification choice</strong> for interest and dividends than US GAAP.</li></ul>`,
formal:`<h4>Classification</h4>
<ul><li><strong>CFO:</strong> cash from customers, payments to suppliers and employees, operating expenses, taxes (and per US GAAP: interest paid, interest and dividends received).</li>
<li><strong>CFI:</strong> purchase/sale of PP&amp;E, intangibles, investments (other than trading securities), loans made/collected.</li>
<li><strong>CFF:</strong> issuing/repurchasing shares, borrowing/repaying debt, dividends paid (US GAAP).</li>
<li>Non-cash investing/financing activities (e.g., debt-for-asset swaps, conversions) disclosed separately.</li></ul>
<h4>IFRS vs US GAAP</h4>
<table><tr><th>Item</th><th>US GAAP</th><th>IFRS</th></tr>
<tr><td>Interest received</td><td>CFO</td><td>CFO or CFI</td></tr>
<tr><td>Interest paid</td><td>CFO</td><td>CFO or CFF</td></tr>
<tr><td>Dividends received</td><td>CFO</td><td>CFO or CFI</td></tr>
<tr><td>Dividends paid</td><td>CFF</td><td>CFO or CFF</td></tr>
<tr><td>Bank overdraft</td><td>Debt (financing)</td><td>Part of cash</td></tr>
<tr><td>Taxes paid</td><td>CFO</td><td>Generally CFO; may be allocated to CFI/CFF</td></tr>
<tr><td>Format</td><td>Direct encouraged; if direct, reconciliation (indirect) required</td><td>Direct encouraged; indirect allowed</td></tr></table>
<h4>Indirect method steps</h4>
<ol><li>Start with net income.</li><li>Add back non-cash expenses (depreciation, amortization, impairments); subtract non-cash gains; reverse gains/losses on investing/financing activities.</li><li>Subtract increases (add decreases) in operating assets; add increases (subtract decreases) in operating liabilities.</li></ol>
<h4>Direct method items</h4>
<ul><li>Cash collected from customers = revenue − ΔAR (+ Δunearned revenue).</li>
<li>Cash paid to suppliers = COGS + ΔInventory − ΔAP.</li>
<li>Cash paid to employees = wage expense − Δwages payable.</li>
<li>Cash interest = interest expense − Δinterest payable (+ discount amortization adjustments).</li>
<li>Cash taxes = tax expense − Δtaxes payable + ΔDTA − ΔDTL.</li></ul>
<h4>CFI and CFF details</h4>
<ul><li>Proceeds from asset sale = book value of asset sold + gain (− loss). Book value sold = beginning gross − ending gross + capex (for gross accounts; adjust accumulated depreciation).</li>
<li>CFF = (new borrowing − repayments) + (shares issued − repurchased − dividends paid). Dividends paid = beginning RE + NI − ending RE (if no other RE changes).</li></ul>`,
math:`<div class="f"><span class="lbl">Indirect CFO</span>CFO = NI + non-cash charges − gains (+ losses) − ↑operating assets + ↑operating liabilities</div>
<p><strong>Why the signs:</strong> if receivables rise, revenue was booked but not collected (less cash than income). If payables rise, expenses were booked but not paid (more cash than income).</p>
<div class="f"><span class="lbl">Direct method examples</span>Cash from customers = Revenue − ΔAR &nbsp;·&nbsp; Cash to suppliers = COGS + ΔInventory − ΔAP</div>
<div class="f"><span class="lbl">Sale of asset</span>Cash proceeds (CFI) = book value + gain (or − loss)</div>
<div class="dir"><div>AR <span class="up">↑</span> → CFO <span class="dn">↓</span> · Inventory <span class="up">↑</span> → CFO <span class="dn">↓</span> · AP <span class="up">↑</span> → CFO <span class="up">↑</span></div><div>Gain on sale: subtract from NI in CFO; include full proceeds in CFI</div></div>
<div class="calc" data-calc="cfo"></div>`,
example:`<div class="q">Net income $500; depreciation $120; gain on sale of equipment $20 (equipment had book value $80); receivables up $40; inventory up $30; payables up $25. Revenue $2,000; COGS $1,200. (a) CFO by the indirect method. (b) Cash collected from customers and cash paid to suppliers (direct method). (c) Cash proceeds from the equipment sale and its classification.</div>
<ol class="steps"><li><strong>CFO</strong> = 500 + 120 − 20 − 40 − 30 + 25 = <strong>$555</strong>.</li>
<li><strong>Collections</strong> = 2,000 − 40 = <strong>$1,960</strong>. <strong>Paid to suppliers</strong> = 1,200 + 30 − 25 = <strong>$1,205</strong>.</li>
<li><strong>Sale proceeds</strong> = 80 + 20 = <strong>$100</strong>, an inflow in <strong>CFI</strong> (the $20 gain was removed from CFO to avoid double counting).</li></ol>
<p class="ans">Answers: CFO $555 · $1,960 / $1,205 · $100 in CFI</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Adding increases in receivables. <b>Fix:</b> asset ↑ = cash ↓ (subtract).</li>
<li><b>Trap:</b> Leaving gains in CFO. <b>Fix:</b> subtract gains, add losses; proceeds go to CFI.</li>
<li><b>Trap:</b> Dividends paid in CFO under US GAAP. <b>Fix:</b> CFF under US GAAP (IFRS: CFO or CFF).</li>
<li><b>Trap:</b> Interest paid in CFF under US GAAP. <b>Fix:</b> CFO under US GAAP.</li>
<li><b>Trap:</b> The direct and indirect methods give different CFO. <b>Fix:</b> same CFO, different presentation.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute CFO (indirect); direct method line items; classify transactions; asset sale proceeds; IFRS vs GAAP classification; CFF computations.</li>
<li><strong>Sign rule:</strong> "Assets opposite, liabilities same".</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Profit ≠ cash</b>The statement bridges them.</div>
<div class="anchor"><b>Assets opposite, liabilities same</b>Working capital sign rule.</div>
<div class="anchor"><b>Operating · Investing · Financing</b>Run it, build it, fund it.</div>
<div class="anchor"><b>GAAP is strict, IFRS lets you choose</b>Interest and dividends classification.</div></div>`,
summary:`The cash flow statement links the income statement and balance sheet: cash flows equal income statement amounts adjusted for changes in related balance sheet accounts (operating activities relate to current assets and liabilities, investing to non-current assets, financing to non-current liabilities and equity). The direct method shows operating receipts and payments (e.g., collections = revenue − ΔAR; payments to suppliers = COGS + Δinventory − ΔAP); the indirect method starts from net income, adds non-cash charges, reverses gains and losses, subtracts increases in operating assets and adds increases in operating liabilities, highlighting differences between earnings and cash. CFI reflects asset purchases and sales (proceeds = book value + gain); CFF reflects net borrowing and net equity flows, including dividends. Under US GAAP interest and dividends received and interest paid are CFO and dividends paid are CFF; IFRS allows interest and dividends received in CFO or CFI, interest and dividends paid in CFO or CFF, and treats bank overdrafts as cash.`
},
quiz:[
{q:"Net income $200, depreciation $50, increase in receivables $30, decrease in payables $10. CFO is:",o:["$210","$230","$290"],a:0,e:"200 + 50 − 30 − 10 = 210."},
{q:"Under US GAAP, dividends paid to shareholders are classified as:",o:["CFO","CFI","CFF"],a:2,e:"Financing activity under US GAAP."},
{q:"Equipment with a book value of $60 is sold for a $15 loss. The cash inflow in CFI is:",o:["$45","$60","$75"],a:0,e:"Proceeds = 60 − 15 = 45; the loss is added back in CFO."}]
});

/* ===================== READING 31 ===================== */
add({n:31,topic:"fsa",title:"Analyzing Statements of Cash Flows II",
los:["31.a Analyze and interpret both reported and common-size cash flow statements.","31.b Calculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios."],
s:{
eli5:`<p>Healthy companies make more cash from running the business than they need to keep the business going (replacing machines, etc.). What's left over is <strong>free cash flow</strong>: money that could be handed to lenders and owners.</p>
<p><strong>FCFF</strong> is the leftover cash for everyone who funded the firm (lenders + owners). <strong>FCFE</strong> is what's left just for owners after lenders get paid and new borrowing comes in.</p>`,
core:`<p><strong>What problem is this solving?</strong> Judging whether a company's operations genuinely fund its investment needs and its obligations, and measuring cash available to investors for valuation.</p>
<ul><li><strong>What to look for:</strong> CFO positive and growing, exceeding capex over time; CFO tracking net income (big gaps suggest aggressive accruals); major sources of cash (operations good; asset sales or borrowing to fund operations is a warning).</li>
<li><strong>Life cycle patterns:</strong> start-ups: negative CFO, negative CFI, positive CFF. Mature firms: positive CFO funding CFI and returning cash (negative CFF).</li>
<li><strong>Common-size cash flow statements:</strong> items as % of revenue, or inflows as % of total inflows and outflows as % of total outflows.</li>
<li><strong>FCFF</strong> adds back after-tax interest because interest belongs to debtholders, who are among the "firm's" capital providers. <strong>FCFE</strong> = FCFF − after-tax interest + net borrowing.</li>
<li><strong>Cash ratios</strong> measure performance (cash generated relative to revenue, assets, equity) and coverage (ability to pay debt, interest, dividends, reinvest).</li></ul>`,
formal:`<h4>Interpreting cash flows</h4>
<ul><li>Evaluate major sources and uses; whether CFO covers capex and dividends; trends; differences between CFO and NI; one-off items.</li>
<li>Common-size: (1) each line as % of revenue, or (2) each inflow as % of total inflows, each outflow as % of total outflows.</li></ul>
<h4>Free cash flow</h4>
<ul><li>FCFF = NI + NCC + Int(1 − t) − FCInv − WCInv.</li>
<li>FCFF = CFO + Int(1 − t) − FCInv (US GAAP: interest paid is in CFO; under IFRS adjust if interest is in CFF).</li>
<li>FCFE = CFO − FCInv + net borrowing (= FCFF − Int(1 − t) + net borrowing).</li>
<li>Dividends paid included in CFO (IFRS option) must be added back.</li></ul>
<h4>Cash flow ratios</h4>
<table><tr><th>Performance</th><th>Formula</th></tr>
<tr><td>Cash flow to revenue</td><td>CFO / net revenue</td></tr>
<tr><td>Cash return on assets</td><td>CFO / average total assets</td></tr>
<tr><td>Cash return on equity</td><td>CFO / average equity</td></tr>
<tr><td>Cash to income</td><td>CFO / operating income</td></tr>
<tr><td>Cash flow per share</td><td>(CFO − preferred dividends) / weighted shares</td></tr>
<tr><th>Coverage</th><th></th></tr>
<tr><td>Debt coverage</td><td>CFO / total debt</td></tr>
<tr><td>Interest coverage</td><td>(CFO + interest paid + taxes paid) / interest paid</td></tr>
<tr><td>Reinvestment</td><td>CFO / cash paid for long-term assets</td></tr>
<tr><td>Debt payment</td><td>CFO / cash long-term debt repayment</td></tr>
<tr><td>Dividend payment</td><td>CFO / dividends paid</td></tr>
<tr><td>Investing and financing</td><td>CFO / cash outflows for investing and financing</td></tr></table>`,
math:`<div class="f"><span class="lbl">FCFF</span>FCFF = CFO + interest × (1 − t) − FCInv &nbsp;=&nbsp; NI + NCC + Int(1 − t) − FCInv − WCInv</div>
<div class="f"><span class="lbl">FCFE</span>FCFE = CFO − FCInv + net borrowing &nbsp;=&nbsp; FCFF − Int(1 − t) + net borrowing</div>
<div class="vars"><div><code>NCC</code><span>Non-cash charges (depreciation, amortization, impairments)</span></div><div><code>FCInv</code><span>Capex net of asset sale proceeds</span></div><div><code>WCInv</code><span>Increase in working capital (excluding cash and short-term debt)</span></div><div><code>Net borrowing</code><span>New debt − repayments</span></div></div>
<p><strong>Why add back after-tax interest for FCFF:</strong> CFO already deducted interest, but FCFF is cash available to <em>all</em> capital providers, so interest (net of its tax shield) is put back.</p>
<div class="dir"><div>Capex <span class="up">↑</span> → FCFF and FCFE <span class="dn">↓</span></div><div>Net borrowing <span class="up">↑</span> → FCFE <span class="up">↑</span>, FCFF unchanged</div><div>CFO persistently &lt; NI → earnings-quality warning</div></div>
<div class="calc" data-calc="cfo"></div>`,
example:`<div class="q">From Reading 30's company: CFO $555, interest paid $50, tax rate 25%, capex $200, net borrowing $60. Total debt $1,000; dividends paid $100. (a) FCFF. (b) FCFE. (c) Debt coverage and dividend payment ratios. (d) Interpret: net income was $500.</div>
<ol class="steps"><li><strong>FCFF</strong> = 555 + 50 × 0.75 − 200 = 555 + 37.5 − 200 = <strong>$392.5</strong>.</li>
<li><strong>FCFE</strong> = 555 − 200 + 60 = <strong>$415</strong> (check: 392.5 − 37.5 + 60 = 415).</li>
<li><strong>Debt coverage</strong> = 555/1,000 = <strong>0.555</strong>. <strong>Dividend payment</strong> = 555/100 = <strong>5.55×</strong>.</li>
<li><strong>Interpretation:</strong> CFO (555) exceeds NI (500) and covers capex comfortably → good earnings quality and capacity to pay dividends or reduce debt.</li></ol>
<p class="ans">Answers: FCFF $392.5 · FCFE $415 · 0.555 / 5.55× · healthy</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Adding back pre-tax interest in FCFF. <b>Fix:</b> interest × (1 − t).</li>
<li><b>Trap:</b> Adding net borrowing to FCFF. <b>Fix:</b> only to FCFE.</li>
<li><b>Trap:</b> Ignoring IFRS classification (interest paid in CFF). <b>Fix:</b> don't add it back again if it was never deducted in CFO.</li>
<li><b>Trap:</b> Treating rising CFO from shrinking receivables as sustainable. <b>Fix:</b> check sources of CFO.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute FCFF/FCFE from CFO or NI; interpret cash ratios; life-cycle cash patterns; common-size cash flows.</li>
<li><strong>Speed:</strong> FCFE from CFO is the quickest formula: CFO − capex + net borrowing.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>FCFF = everyone's leftovers</b>Lenders + owners.</div>
<div class="anchor"><b>FCFE = owners' leftovers</b>After lenders, plus new borrowing.</div>
<div class="anchor"><b>CFO should beat NI and capex</b>Healthy-company rule.</div></div>`,
summary:`Analysts assess whether CFO is positive, sustainable, close to (or above) net income and sufficient to fund capital spending, and identify the major sources and uses of cash; common-size cash flow statements express items as a percentage of revenue or of total inflows/outflows. FCFF, cash available to all capital providers, equals CFO + interest × (1 − t) − fixed capital investment (or NI + non-cash charges + after-tax interest − fixed capital investment − working capital investment); FCFE, cash available to common shareholders, equals CFO − fixed capital investment + net borrowing. Cash flow performance ratios (cash flow to revenue, cash ROA, cash ROE, cash to income, cash flow per share) and coverage ratios (debt coverage, interest coverage, reinvestment, debt payment, dividend payment, investing and financing) measure operating performance and financial strength.`
},
quiz:[
{q:"CFO = $400, capex = $150, interest paid = $40, tax rate 30%, net borrowing = $20. FCFF is:",o:["$278","$270","$290"],a:0,e:"400 + 40 × 0.7 − 150 = 278."},
{q:"Using the same data, FCFE is:",o:["$250","$270","$298"],a:1,e:"400 − 150 + 20 = 270."},
{q:"Which pattern is most typical of a mature, healthy company?",o:["CFO negative, CFF positive","CFO positive, CFI negative, CFF negative","CFO negative, CFI positive"],a:1,e:"Operations fund investment and cash is returned to investors."}]
});

/* ===================== READING 32 ===================== */
add({n:32,topic:"fsa",title:"Analysis of Inventories",
los:["32.a Describe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios.","32.b Calculate and explain how inflation and deflation of inventory costs affect the financial statements and ratios of companies that use different inventory valuation methods.","32.c Describe the presentation and disclosures relating to inventories and explain issues that analysts should consider when examining a company's inventory disclosures and other sources of information."],
s:{
eli5:`<p>A shop buys 100 widgets at $10, then 200 at $12, then 100 at $15, and sells 250. Which ones did it sell? It doesn't really matter physically, but it matters for profit. If you assume the <strong>oldest</strong> (cheapest) ones were sold first (FIFO), cost of sales is low and profit high. If you assume the <strong>newest</strong> (most expensive) were sold first (LIFO), cost of sales is high and profit low. An average is in between.</p>
<p>And if inventory becomes worth less than you paid (old phones nobody wants), you must write it down.</p>`,
core:`<p><strong>What problem is this solving?</strong> When purchase costs change, the cost flow assumption splits the same total cost differently between the income statement (COGS) and the balance sheet (ending inventory), changing profits, taxes, ratios and comparability.</p>
<ul><li><strong>Rising prices:</strong> FIFO → lower COGS, higher profit, higher ending inventory (current costs on the balance sheet), higher taxes. LIFO → higher COGS (current costs in income), lower profit and taxes, lower (outdated) inventory. Weighted average in between.</li>
<li><strong>Which is "better"?</strong> LIFO's COGS reflects current costs (better income measure); FIFO's inventory reflects current costs (better balance sheet measure).</li>
<li><strong>LIFO liquidation:</strong> if inventory quantities fall under LIFO, old cheap layers flow into COGS → artificially inflated margins, unsustainable.</li>
<li><strong>Lower of cost and NRV:</strong> write-downs hit income and assets; IFRS allows reversals (up to original write-down), US GAAP doesn't.</li>
<li><strong>Disclosures</strong> (raw materials vs WIP vs finished goods, write-downs) can signal demand changes or obsolescence.</li></ul>`,
formal:`<h4>Measurement</h4>
<ul><li><strong>IFRS:</strong> lower of cost and net realizable value (NRV = estimated selling price − estimated costs to complete and sell). Reversal of write-downs allowed up to original cost. LIFO not permitted.</li>
<li><strong>US GAAP:</strong> lower of cost and NRV for FIFO/average; LIFO and retail method use lower of cost or market (market = replacement cost, between NRV − normal profit margin and NRV). No reversals.</li>
<li>Exceptions: agricultural/forest products and minerals may be carried at NRV/fair value less costs to sell (changes in income).</li>
<li>Write-down: inventory ↓, assets and equity ↓, COGS ↑ (or separate line), NI ↓; turnover ratios ↑; debt/equity ↑; margins, ROA, ROE ↓ (typical firm).</li></ul>
<h4>Cost flow methods (rising prices, stable/increasing quantities)</h4>
<table><tr><th></th><th>FIFO</th><th>LIFO</th><th>Weighted average</th></tr>
<tr><td>COGS</td><td>Lowest</td><td>Highest</td><td>Middle</td></tr>
<tr><td>Ending inventory</td><td>Highest</td><td>Lowest</td><td>Middle</td></tr>
<tr><td>Gross profit, NI, taxes</td><td>Highest</td><td>Lowest</td><td>Middle</td></tr>
<tr><td>Current ratio, working capital</td><td>Higher</td><td>Lower</td><td></td></tr>
<tr><td>Inventory turnover</td><td>Lower</td><td>Higher</td><td></td></tr>
<tr><td>Debt/equity (solvency)</td><td>Lower (better)</td><td>Higher</td><td></td></tr>
<tr><td>CFO (with taxes)</td><td>Lower (more tax)</td><td>Higher</td><td></td></tr></table>
<p>Falling prices reverse the results. Specific identification for unique items.</p>
<h4>LIFO reserve and conversion (US GAAP firms)</h4>
<ul><li>LIFO reserve = FIFO inventory − LIFO inventory. Inventory<sub>FIFO</sub> = Inventory<sub>LIFO</sub> + LIFO reserve; COGS<sub>FIFO</sub> = COGS<sub>LIFO</sub> − ΔLIFO reserve; equity adjusts by reserve × (1 − t), deferred taxes by reserve × t.</li>
<li>LIFO liquidation: falling quantities → old low-cost layers in COGS → higher gross margin (one-time).</li></ul>
<h4>Disclosures and analysis</h4>
<ul><li>Cost method; carrying amounts by classification; amounts at fair value less costs to sell; COGS; write-downs and reversals (IFRS); inventory pledged as collateral.</li>
<li>Finished goods growing faster than sales while raw materials/WIP fall → weakening demand, future write-downs. Raw materials/WIP rising → expected demand growth.</li>
<li>Low turnover (high days on hand) → slow-moving/obsolete inventory. High turnover + low sales growth vs industry → stockouts; high turnover + high growth → efficiency.</li></ul>`,
math:`<div class="f"><span class="lbl">Basic identity</span>Beginning inventory + purchases = COGS + ending inventory</div>
<p><strong>Why methods matter:</strong> goods available for sale is fixed; the method only decides which costs go to COGS and which stay in inventory.</p>
<div class="f"><span class="lbl">LIFO reserve adjustments</span>Inv<sub>FIFO</sub> = Inv<sub>LIFO</sub> + LIFO reserve · COGS<sub>FIFO</sub> = COGS<sub>LIFO</sub> − ΔLIFO reserve</div>
<div class="f"><span class="lbl">Activity ratios</span>Inventory turnover = COGS / average inventory · Days on hand = 365 / turnover</div>
<div class="dir"><div>Rising costs: FIFO NI <span class="up">↑</span>, LIFO COGS <span class="up">↑</span>, LIFO taxes <span class="dn">↓</span></div><div>NRV write-down → NI <span class="dn">↓</span>, turnover <span class="up">↑</span>, D/E <span class="up">↑</span></div></div>
<div class="calc" data-calc="inv"></div>`,
example:`<div class="q">Purchases in order: 100 units @ $10, 200 @ $12, 100 @ $15 (periodic system). 250 units are sold at $20. (a) COGS and ending inventory under FIFO, LIFO, weighted average. (b) Which gives the highest gross profit? (c) A US firm reports LIFO inventory of $1,600 and a LIFO reserve of $500. What is FIFO inventory? (d) Inventory costing $1,000 now has NRV $900. Effects?</div>
<ol class="steps"><li><strong>Goods available</strong> = 1,000 + 2,400 + 1,500 = $4,900 for 400 units (avg $12.25).</li>
<li><strong>FIFO COGS</strong> = 100 × 10 + 150 × 12 = <strong>$2,800</strong>; ending inventory <strong>$2,100</strong>.</li>
<li><strong>LIFO COGS</strong> = 100 × 15 + 150 × 12 = <strong>$3,300</strong>; ending inventory <strong>$1,600</strong>.</li>
<li><strong>Average COGS</strong> = 250 × 12.25 = <strong>$3,062.50</strong>; ending <strong>$1,837.50</strong>.</li>
<li><strong>Gross profit</strong> (revenue $5,000): FIFO $2,200 &gt; avg $1,937.50 &gt; LIFO $1,700. FIFO highest (rising costs).</li>
<li><strong>(c)</strong> FIFO inventory = 1,600 + 500 = <strong>$2,100</strong>.</li>
<li><strong>(d)</strong> Write down $100: inventory and equity ↓, NI ↓ $100 (pretax), turnover ↑. IFRS may reverse later if NRV recovers; US GAAP may not.</li></ol>
<p class="ans">Answers: FIFO 2,800/2,100 · LIFO 3,300/1,600 · Avg 3,062.50/1,837.50 · FIFO highest GP · $2,100 · $100 write-down</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> LIFO under IFRS. <b>Fix:</b> not permitted.</li>
<li><b>Trap:</b> Reversing write-downs under US GAAP. <b>Fix:</b> not allowed (IFRS allows up to original write-down).</li>
<li><b>Trap:</b> Thinking LIFO gives higher cash flow in all cases. <b>Fix:</b> only with rising prices (via lower taxes).</li>
<li><b>Trap:</b> Treating LIFO liquidation profits as sustainable. <b>Fix:</b> one-time margin boost.</li>
<li><b>Trap:</b> Reversing ratio effects. <b>Fix:</b> FIFO (rising prices) → higher current ratio, lower turnover.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute COGS/ending inventory by method; effect of rising/falling prices on ratios; LIFO reserve conversion; LIFO liquidation; NRV write-downs IFRS vs GAAP; interpreting inventory disclosures.</li>
<li><strong>Shortcut:</strong> with rising prices, "FIFO = higher everything good on paper (profit, inventory, current ratio); LIFO = higher COGS and cash flow (lower tax)".</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>FIFO = First in, first gone</b>Old (cheap) costs to COGS when prices rise.</div>
<div class="anchor"><b>LIFO = Last in, first gone</b>New (expensive) costs to COGS; lower tax.</div>
<div class="anchor"><b>Reserve bridges LIFO to FIFO</b>Add it to inventory.</div>
<div class="anchor"><b>IFRS forgives, GAAP doesn't</b>Write-down reversals.</div></div>`,
summary:`Under IFRS inventories are measured at the lower of cost and net realizable value, with write-downs reversible up to the original write-down; under US GAAP the lower of cost and NRV applies to FIFO and average cost, lower of cost or market to LIFO and retail, and reversals are prohibited. A write-down reduces inventory, assets, equity, net income, margins, ROA and ROE and raises turnover and leverage ratios. With rising costs and stable or rising quantities, FIFO gives the lowest COGS and highest ending inventory, profits, taxes and current ratio; LIFO the highest COGS and lowest inventory, profit and taxes (higher CFO); weighted average lies between; falling costs reverse these effects. A LIFO reserve converts LIFO to FIFO (inventory + reserve; COGS − Δreserve), and LIFO liquidations temporarily inflate margins. Disclosures (method, classification, write-downs, reversals, pledged inventory) and turnover trends help detect weakening demand, obsolescence or stockouts.`
},
quiz:[
{q:"During a period of rising prices and stable inventory quantities, a firm using LIFO compared to FIFO will report:",o:["higher net income","higher inventory turnover","higher current ratio"],a:1,e:"LIFO: higher COGS and lower inventory → higher turnover."},
{q:"Which is permitted under IFRS but not under US GAAP?",o:["LIFO","Reversal of inventory write-downs","FIFO"],a:1,e:"IFRS allows reversals; LIFO is GAAP-only."},
{q:"LIFO inventory is $800 and the LIFO reserve is $150. FIFO inventory is:",o:["$650","$800","$950"],a:2,e:"800 + 150 = 950."}]
});

/* ===================== READING 33 ===================== */
add({n:33,topic:"fsa",title:"Analysis of Long-Term Assets",
los:["33.a Compare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business combination.","33.b Explain and evaluate how impairment and derecognition of property, plant, and equipment and intangible assets affect the financial statements and ratios.","33.c Analyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets."],
s:{
eli5:`<p>When a company buys something that lasts for years (a truck, a factory, a patent), it doesn't count the whole cost as an expense this year. It records it as an asset and spreads the cost over its useful life (depreciation for physical things, amortization for intangibles).</p>
<p>Sometimes an asset suddenly becomes worth much less than its recorded value (a factory for a product nobody buys any more). Then the company must write it down: an <strong>impairment</strong>. It's a paper loss; no cash leaves the company.</p>
<p>From the notes, you can even estimate how old a company's equipment is, which hints at whether big spending is coming.</p>`,
core:`<p><strong>What problem is this solving?</strong> Allocating the cost of long-lived assets to the periods that benefit, recognizing when assets lose value, and using disclosures to assess the age and condition of a firm's asset base.</p>
<ul><li><strong>How the intangible was obtained matters:</strong> purchased → capitalize at cost; internally developed → mostly expensed (IFRS capitalizes development costs meeting criteria; US GAAP expenses R&amp;D except some software); acquired in a business combination → recorded at fair value, with the excess as goodwill.</li>
<li><strong>Capitalize vs expense</strong> shifts profit across time and cash from CFO to CFI.</li>
<li><strong>Depreciation method</strong> (straight-line vs accelerated) and estimates (useful life, salvage) are management choices that change reported income; longer lives and higher salvage raise current income.</li>
<li><strong>Impairment:</strong> IFRS compares carrying value with recoverable amount (higher of fair value less costs to sell and value in use) and allows reversals. US GAAP first tests recoverability with undiscounted cash flows, then writes down to fair value; no reversals for held-for-use assets. Impairments are non-cash and can signal past overinvestment.</li>
<li><strong>Derecognition:</strong> sale → gain/loss = proceeds − carrying value; abandonment → loss of carrying value; exchange → gain/loss vs fair value.</li>
<li><strong>Disclosures</strong> let analysts estimate average age, total useful life and remaining life of PP&amp;E.</li></ul>`,
formal:`<h4>Intangible assets by source</h4>
<table><tr><th>Source</th><th>Treatment</th></tr>
<tr><td>Purchased (outside a business combination)</td><td>Capitalized at cost; finite life → amortized; indefinite → impairment tests</td></tr>
<tr><td>Internally developed</td><td>Generally expensed. IFRS: research expensed, development capitalized if criteria met. US GAAP: R&amp;D expensed; software for sale capitalized after technological feasibility, internal-use software after the application development stage</td></tr>
<tr><td>Acquired in a business combination (acquisition method)</td><td>Identifiable intangibles at fair value; residual = goodwill (not amortized, tested annually)</td></tr></table>
<h4>Depreciation</h4>
<ul><li>Straight-line: (cost − salvage)/useful life. Double-declining balance: 2/life × beginning book value (not below salvage). Units of production.</li>
<li>IFRS: component depreciation required; revaluation model permitted. US GAAP: cost model only.</li></ul>
<h4>Impairment</h4>
<ul><li><strong>IFRS:</strong> annual assessment for indications; impaired if carrying value &gt; recoverable amount = max(fair value − costs to sell, value in use). Write down to recoverable amount. Reversals allowed (not above carrying value that would have existed without impairment); not for goodwill.</li>
<li><strong>US GAAP:</strong> test when events indicate. Step 1 recoverability: carrying value &gt; undiscounted future cash flows → impaired. Step 2: loss = carrying value − fair value (or PV of cash flows). No reversals for held-for-use assets; held-for-sale assets may recover up to the impairment.</li>
<li>Effects: NI, assets, equity ↓; ROA, ROE ↓ (year of impairment), later depreciation ↓ (future NI ↑, ROA ↑); D/E, D/A ↑; no cash flow effect.</li></ul>
<h4>Derecognition</h4>
<p>Sale: gain/loss = proceeds − carrying value (CFI gets proceeds). Abandonment: loss = carrying value. Exchange: gain/loss = fair value of old asset (or new asset if clearer) − carrying value of old. Held for sale: reclassified, not depreciated, measured at lower of carrying value and fair value less costs to sell.</p>
<h4>Disclosures and age estimates</h4>
<p>Carrying values by class, accumulated depreciation/amortization, methods and lives, pledged assets and title restrictions, impairment losses and circumstances, revaluation details (IFRS).</p>`,
math:`<div class="f"><span class="lbl">Depreciation</span>Straight-line = (cost − salvage)/life &nbsp;·&nbsp; DDB<sub>year</sub> = (2/life) × beginning book value</div>
<div class="f"><span class="lbl">Asset age estimates</span>Average age = accumulated depreciation / annual depreciation · Total useful life = historical cost / annual depreciation · Remaining life = net PP&amp;E / annual depreciation</div>
<p><strong>Why it works:</strong> with straight-line depreciation, each year of age adds one year's depreciation to the accumulated total, and net PP&amp;E is the undepreciated years remaining.</p>
<div class="f"><span class="lbl">Impairment</span>IFRS loss = CV − max(FV − costs to sell, value in use) &nbsp;·&nbsp; GAAP: if CV &gt; undiscounted CF, loss = CV − FV</div>
<div class="dir"><div>Longer useful life or higher salvage → depreciation <span class="dn">↓</span> → NI <span class="up">↑</span></div><div>Accelerated method → early NI <span class="dn">↓</span>, early book value <span class="dn">↓</span></div><div>High average age relative to total life → big capex likely soon</div></div>
<div class="calc" data-calc="dep"></div>
<div class="calc" data-calc="imp"></div>`,
example:`<div class="q">(a) A machine costs $10,000, salvage $1,000, 5-year life. Year-2 depreciation and ending book value under straight-line and DDB. (b) An asset has carrying value $900; undiscounted cash flows $850; fair value $700; costs to sell $20; value in use $720. Impairment loss under IFRS and US GAAP. (c) Historical cost of PP&amp;E $12,000; accumulated depreciation $4,000; annual depreciation $1,000. Estimate average age, total useful life and remaining life. (d) Equipment with carrying value $300 is sold for $260. Effect?</div>
<ol class="steps"><li><strong>SL</strong> = 9,000/5 = $1,800 per year → year-2 BV = 10,000 − 3,600 = <strong>$6,400</strong>.</li>
<li><strong>DDB</strong> (40%): Y1 4,000 (BV 6,000); Y2 0.4 × 6,000 = <strong>$2,400</strong> → BV <strong>$3,600</strong>.</li>
<li><strong>IFRS:</strong> recoverable = max(680, 720) = 720 → loss <strong>$180</strong>. <strong>US GAAP:</strong> 900 &gt; 850 → impaired; loss = 900 − 700 = <strong>$200</strong>.</li>
<li><strong>Ages:</strong> average age = 4,000/1,000 = <strong>4 years</strong>; total life = 12,000/1,000 = <strong>12 years</strong>; remaining = 8,000/1,000 = <strong>8 years</strong>.</li>
<li><strong>Sale:</strong> loss of <strong>$40</strong> in the income statement; $260 inflow in CFI; loss added back in CFO.</li></ol>
<p class="ans">Answers: SL $1,800 (BV $6,400); DDB $2,400 (BV $3,600) · IFRS $180, GAAP $200 · 4 / 12 / 8 years · $40 loss</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Impairments reduce CFO. <b>Fix:</b> non-cash; no cash effect until disposal (tax effects aside).</li>
<li><b>Trap:</b> US GAAP compares carrying value with discounted cash flows in step 1. <b>Fix:</b> step 1 uses undiscounted cash flows.</li>
<li><b>Trap:</b> Reversing impairments under US GAAP for assets held for use. <b>Fix:</b> not allowed.</li>
<li><b>Trap:</b> Deducting salvage before applying DDB. <b>Fix:</b> DDB applies to full book value, but stops at salvage.</li>
<li><b>Trap:</b> Goodwill impairment reversals under IFRS. <b>Fix:</b> never reversed.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> intangible treatment by source; depreciation calculations and effects of estimates; impairment tests IFRS vs GAAP; effects of impairment on ratios; gain/loss on sale; average age computations.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Spread the cost over the useful years</b>Depreciation/amortization.</div>
<div class="anchor"><b>IFRS: higher of two; GAAP: two steps</b>Recoverable amount vs undiscounted test, then fair value.</div>
<div class="anchor"><b>Paper loss, real signal</b>Impairments cost no cash but reveal overinvestment.</div>
<div class="anchor"><b>Accumulated ÷ annual = age</b>Asset age shortcut.</div></div>`,
summary:`Purchased finite-lived intangibles are capitalized and amortized; indefinite-lived intangibles are tested for impairment at least annually; internally developed intangibles are generally expensed (IFRS capitalizes development costs meeting criteria; US GAAP expenses R&amp;D except certain software); intangibles acquired in a business combination are recorded at fair value, with any excess purchase price recorded as goodwill. Capitalizing raises early income, assets, equity and CFO (lowers CFI) and lowers leverage ratios. Under IFRS an asset is impaired when carrying value exceeds the recoverable amount (higher of fair value less costs to sell and value in use), with reversals permitted; under US GAAP impairment exists when carrying value exceeds undiscounted future cash flows, the loss is measured against fair value, and reversals are not allowed for assets held for use. Impairments reduce income, assets, equity, ROA and ROE, raise leverage ratios and have no cash effect. Derecognition by sale, abandonment or exchange produces gains or losses. Disclosures allow estimates of average age (accumulated depreciation/annual depreciation), total useful life (gross cost/annual depreciation) and remaining life (net PP&amp;E/annual depreciation).`
},
quiz:[
{q:"Under US GAAP, an asset is considered impaired if its carrying value exceeds its:",o:["fair value","undiscounted future cash flows","value in use"],a:1,e:"Step 1 recoverability test uses undiscounted cash flows."},
{q:"An impairment charge in the current year will most likely:",o:["decrease CFO","increase debt-to-equity","increase ROA in the current year"],a:1,e:"Equity falls; no cash impact; current ROA falls."},
{q:"Gross PP&E $50m, accumulated depreciation $20m, annual depreciation $5m. Remaining useful life is approximately:",o:["4 years","6 years","10 years"],a:1,e:"Net PP&E 30/5 = 6 years."}]
});

/* ===================== READING 34 ===================== */
add({n:34,topic:"fsa",title:"Topics in Long-Term Liabilities and Equity",
los:["34.a Explain the financial reporting of leases from the perspectives of lessors and lessees.","34.b Explain the financial reporting of defined contribution, defined benefit, and stock-based compensation plans.","34.c Describe the financial statement presentation of and disclosures relating to long-term liabilities and share-based compensation."],
s:{
eli5:`<p>Renting something for years is a lot like borrowing money to buy it: you get to use it, and you owe a stream of payments. So accounting puts most leases on the balance sheet: a "right-of-use" asset (what you get to use) and a lease liability (what you owe).</p>
<p>Pensions: with a <strong>defined contribution</strong> plan, the company just puts money in each year and is done. With a <strong>defined benefit</strong> plan, the company promises a future pension amount, so it carries the risk; if the investments fall short of the promise, that gap is a liability.</p>
<p>Paying employees with shares or options costs no cash today, but it's still a real cost (it dilutes owners), so it's expensed.</p>`,
core:`<p><strong>What problem is this solving?</strong> Making long-term obligations visible: leases, pension promises and share-based pay are real economic commitments that once sat off the balance sheet or out of the income statement.</p>
<ul><li><strong>Leases:</strong> a lease transfers the right to use an asset. Lessees (except short-term/low-value) recognize a right-of-use (ROU) asset and lease liability = PV of payments. IFRS treats all such leases as finance leases (interest + amortization, front-loaded expense); US GAAP distinguishes finance leases (same as IFRS) and operating leases (single straight-line lease expense).</li>
<li><strong>Lessors:</strong> finance (sales-type or direct financing) leases → derecognize the asset, record a lease receivable, earn interest; operating leases → keep the asset, earn lease income, depreciate.</li>
<li><strong>Pensions:</strong> DC plans expense contributions, no balance sheet item beyond unpaid contributions. DB plans report funded status (plan assets − obligation) on the balance sheet; periodic cost is split between income statement and OCI, differently under IFRS and US GAAP.</li>
<li><strong>Share-based compensation</strong> aligns employees with shareholders and saves cash, but dilutes and may encourage risk-taking (options). Fair value at grant date is expensed over the vesting (service) period.</li></ul>`,
formal:`<h4>Leases</h4>
<ul><li>Finance lease criteria (any one): ownership transfers; purchase option reasonably certain to be exercised; lease term is major part of economic life; PV of payments ≥ substantially all of fair value; specialized asset with no alternative use to lessor.</li>
<li><strong>Lessee, IFRS:</strong> single model (except short-term ≤ 12 months and low-value): ROU asset and lease liability at PV of payments; interest expense + amortization of ROU (front-loaded); cash: principal in CFF, interest in CFO or CFF.</li>
<li><strong>Lessee, US GAAP:</strong> finance lease as IFRS (interest in CFO, principal in CFF); operating lease: ROU and liability on balance sheet but single straight-line lease expense, entire payment in CFO; ROU amortization = plug so that total expense = payment.</li>
<li><strong>Lessor:</strong> finance lease → derecognize asset, recognize lease receivable, interest income; sales-type lease (manufacturer/dealer) recognizes selling profit at inception; direct financing lease defers gain over the lease (US GAAP). Operating lease → asset stays, lease revenue, depreciation.</li>
<li>Advantages of leasing: less initial cash, cheaper financing, less obsolescence risk.</li></ul>
<h4>Pensions</h4>
<ul><li><strong>DC:</strong> pension expense = employer contribution.</li>
<li><strong>DB:</strong> net pension asset/liability = fair value of plan assets − PVDBO (IFRS) / PBO (US GAAP).</li>
<li>Periodic cost components: service cost (P&amp;L both); interest cost and expected return (IFRS nets them as net interest on the net liability using the discount rate; US GAAP shows interest cost and expected return separately in P&amp;L); remeasurements/actuarial gains and losses and actual minus expected return → OCI (US GAAP may amortize into P&amp;L, IFRS never recycles); past service cost → IFRS P&amp;L immediately, US GAAP OCI then amortized.</li>
<li>Total periodic pension cost (same under both) = ΔPBO − actual return on plan assets... equivalently contributions − Δfunded status.</li></ul>
<h4>Share-based compensation</h4>
<ul><li><strong>Stock grants:</strong> fair value at grant date (share price); immediate vesting → expense immediately; otherwise straight-line over service period; credit common stock/APIC.</li>
<li><strong>Stock options:</strong> fair value estimated with option-pricing models (subjective inputs: volatility, expected life, dividends, rates); expensed straight-line over vesting period; APIC credited; on exercise, cash and equity increase; on expiry, no reversal of expense.</li>
<li>Disclosures: plan descriptions, assumptions, compensation cost, unvested amounts; lease maturity analysis, ROU assets, weighted average rates; pension assumptions and reconciliations.</li></ul>`,
math:`<div class="f"><span class="lbl">Lease liability</span>Lease liability₀ = ROU asset₀ = PV of lease payments at the lease rate</div>
<div class="f"><span class="lbl">Finance lease expense (year t)</span>Interest = rate × opening liability · ROU amortization = ROU₀ / term · Total = interest + amortization (declines over time)</div>
<div class="f"><span class="lbl">US GAAP operating lease</span>Lease expense = payment (straight-line) · ROU amortization = payment − interest</div>
<div class="f"><span class="lbl">DB funded status (IFRS net interest)</span>Net liability = PVDBO − plan assets · Net interest = discount rate × net liability</div>
<div class="f"><span class="lbl">Options expense</span>Annual expense = (options × grant-date fair value)/vesting years</div>
<div class="dir"><div>Leases on balance sheet → assets <span class="up">↑</span>, liabilities <span class="up">↑</span>, D/E <span class="up">↑</span>, asset turnover <span class="dn">↓</span></div><div>Finance-lease treatment → EBITDA <span class="up">↑</span> (no rent expense), early NI <span class="dn">↓</span></div><div>Discount rate <span class="dn">↓</span> → PBO <span class="up">↑</span> → pension liability <span class="up">↑</span></div></div>
<div class="calc" data-calc="lease"></div>`,
example:`<div class="q">(a) A lessee signs a 5-year lease with $10,000 annual payments (year-end) at 6%. Initial ROU asset/liability; year-1 interest, amortization and total expense (finance lease); year-1 expense under a US GAAP operating lease. (b) A DB plan has PVDBO of $1,000 and plan assets of $900; service cost $50; discount rate 5%. Balance sheet item and IFRS P&amp;L pension expense. (c) A firm grants 10,000 options with a grant-date fair value of $6, vesting over 3 years. Annual expense?</div>
<ol class="steps"><li><strong>PV</strong> = 10,000 × annuity factor (6%, 5) = <strong>$42,124</strong>.</li>
<li><strong>Year 1 (finance):</strong> interest = 6% × 42,124 = $2,527; amortization = 42,124/5 = $8,425; total = <strong>$10,952</strong> (higher than the $10,000 payment: front-loaded).</li>
<li><strong>US GAAP operating:</strong> lease expense = <strong>$10,000</strong> (entire payment in CFO).</li>
<li><strong>Pension:</strong> net liability = 1,000 − 900 = <strong>$100</strong>; IFRS P&amp;L = service cost 50 + net interest 5% × 100 = <strong>$55</strong>.</li>
<li><strong>Options:</strong> 10,000 × 6/3 = <strong>$20,000</strong> per year (credited to APIC).</li></ol>
<p class="ans">Answers: $42,124 · $10,952 finance vs $10,000 operating · liability $100, expense $55 · $20,000/yr</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> IFRS has operating leases for lessees. <b>Fix:</b> single (finance) model except short-term/low-value.</li>
<li><b>Trap:</b> US GAAP operating leases are off balance sheet. <b>Fix:</b> ROU asset and liability are recognized; only the expense pattern differs.</li>
<li><b>Trap:</b> Expensing options at exercise. <b>Fix:</b> fair value at grant date, expensed over vesting period.</li>
<li><b>Trap:</b> DC plans create balance sheet liabilities. <b>Fix:</b> none if contributions are paid.</li>
<li><b>Trap:</b> Actuarial gains/losses go to P&amp;L under IFRS. <b>Fix:</b> OCI (remeasurements), never recycled.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> finance lease criteria; lessee accounting IFRS vs GAAP (expense pattern, cash flow classification); lessor finance vs operating; DB funded status and expense components IFRS vs GAAP; stock grant/option expense.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Renting = borrowing to buy</b>ROU asset + lease liability.</div>
<div class="anchor"><b>IFRS: one model; GAAP: two</b>Operating leases only under GAAP.</div>
<div class="anchor"><b>DC = done; DB = debt</b>Who bears the pension risk.</div>
<div class="anchor"><b>Grant-date value, spread over vesting</b>Share-based pay.</div></div>`,
summary:`Leases transfer the right to use an asset. Lessees recognize a right-of-use asset and lease liability equal to the present value of payments (except short-term or low-value leases). IFRS uses a single model with interest expense plus ROU amortization (front-loaded); US GAAP finance leases are the same, while operating leases show a single straight-line lease expense with the full payment in CFO. A lease is a finance lease if ownership transfers, a purchase option is expected to be exercised, the term covers most of the asset's life, the PV of payments is at least substantially all of fair value, or the asset is specialized. Lessors derecognize the asset and record a receivable under finance (sales-type or direct financing) leases, or keep the asset and record lease income under operating leases. DC plans expense contributions; DB plans report funded status (plan assets − PVDBO/PBO), with service cost and net interest in P&amp;L under IFRS (US GAAP shows interest cost and expected return separately) and remeasurements in OCI (US GAAP may amortize them). Stock grants and options are measured at grant-date fair value and expensed over the vesting period, aligning incentives at the cost of dilution.`
},
quiz:[
{q:"Under IFRS, a lessee's 5-year equipment lease (not low-value) is reported with:",o:["only rent expense","a right-of-use asset and lease liability, with interest and amortization expense","a right-of-use asset and a single straight-line lease expense"],a:1,e:"IFRS single (finance) lessee model."},
{q:"Under a US GAAP operating lease, the lessee's cash payment is classified in:",o:["CFO entirely","CFF entirely","CFO for interest and CFF for principal"],a:0,e:"Operating lease payments are operating cash flows."},
{q:"A defined benefit plan has plan assets of $500 and a PBO of $620. The firm reports:",o:["a net pension asset of $120","a net pension liability of $120","no balance sheet item"],a:1,e:"Underfunded by 120 → net liability."}]
});

/* ===================== READING 35 ===================== */
add({n:35,topic:"fsa",title:"Analysis of Income Taxes",
los:["35.a Contrast accounting profit, taxable income, taxes payable, and income tax expense and temporary versus permanent differences between accounting profit and taxable income.","35.b Explain how deferred tax liabilities and assets are created and the factors that determine how a company's deferred tax liabilities and assets should be treated for the purposes of financial analysis.","35.c Calculate, interpret, and contrast an issuer's effective tax rate, statutory tax rate, and cash tax rate.","35.d Analyze disclosures relating to deferred tax items and the effective tax rate reconciliation and explain how information included in these disclosures affects a company's financial statements and financial ratios."],
s:{
eli5:`<p>Companies keep two sets of books, both legal: one for investors (accounting rules) and one for the tax office (tax rules). The two often count things at different times. For example, the tax rules may let you deduct a machine's cost faster than you show it to investors.</p>
<p>That means you pay less tax now and more later. The "more later" is recorded as a <strong>deferred tax liability</strong>: tax you'll owe in the future because of a timing difference. The opposite case (paying more tax now, less later) creates a <strong>deferred tax asset</strong>.</p>
<p>Some differences never reverse (like tax-free interest). Those just change the effective tax rate.</p>`,
core:`<p><strong>What problem is this solving?</strong> Matching tax expense with the accounting profit it relates to, even when the tax return follows different timing, so the income statement isn't distorted by tax timing.</p>
<ul><li><strong>Four key numbers:</strong> accounting profit (pretax income, books), taxable income (tax return), taxes payable (taxable income × rate), income tax expense (P&amp;L) = taxes payable + ΔDTL − ΔDTA.</li>
<li><strong>Temporary differences</strong> (reverse over time) create DTLs/DTAs; <strong>permanent differences</strong> (never reverse) don't; they make the effective rate differ from the statutory rate.</li>
<li><strong>DTL arises</strong> when revenue is recognized in the books before it's taxed, or expenses are deducted for tax before they're expensed in the books (e.g., accelerated tax depreciation). <strong>DTA arises</strong> when taxes are paid before the books recognize the income or when expenses hit the books before they're deductible (e.g., warranty reserves, impairments, tax loss carryforwards).</li>
<li><strong>Analysis:</strong> if a DTL is unlikely to reverse (growing capex keeps it rolling), treat it as equity; if it will reverse, treat it as a liability. DTAs need future taxable income; a valuation allowance (US GAAP) reduces DTAs whose realization is doubtful, and changes in it can be used to manage earnings.</li>
<li><strong>Rate changes</strong> remeasure DTLs/DTAs immediately, flowing through tax expense.</li></ul>`,
formal:`<h4>Terminology</h4>
<ul><li><strong>Accounting profit:</strong> pretax income per financial reporting standards. <strong>Taxable income:</strong> per tax return.</li>
<li><strong>Taxes payable:</strong> current tax liability from the return. <strong>Income tax expense</strong> = taxes payable + ΔDTL − ΔDTA.</li>
<li><strong>Tax base:</strong> the value of an asset/liability for tax purposes. <strong>Carrying value:</strong> value on the balance sheet.</li>
<li><strong>Valuation allowance</strong> (US GAAP): contra-asset reducing DTAs when it's more likely than not they won't be realized. IFRS recognizes DTAs only to the extent probable.</li></ul>
<h4>Creating DTLs and DTAs</h4>
<table><tr><th>Situation</th><th>Result</th></tr>
<tr><td>Asset carrying value &gt; tax base</td><td>DTL</td></tr>
<tr><td>Asset carrying value &lt; tax base</td><td>DTA</td></tr>
<tr><td>Liability carrying value &gt; tax base</td><td>DTA</td></tr>
<tr><td>Liability carrying value &lt; tax base</td><td>DTL</td></tr></table>
<p>DTL/DTA = (carrying value − tax base) × tax rate. Tax base of a depreciable asset = remaining tax-deductible amount. Tax base of a liability (e.g., unearned revenue) = carrying value − amounts not taxable in future.</p>
<h4>Permanent differences</h4>
<p>Tax-exempt income, non-deductible expenses (e.g., certain fines), tax credits → no deferred taxes; effective rate ≠ statutory rate.</p>
<h4>Tax rates</h4>
<ul><li>Statutory rate: corporate rate in domicile.</li>
<li>Effective tax rate = income tax expense / pretax income.</li>
<li>Cash tax rate = cash taxes paid / pretax income.</li>
<li>Reconciliation of statutory to effective rate (foreign rate differences, permanent items, credits, valuation allowance changes) helps forecast future rates.</li></ul>
<h4>Analytical treatment</h4>
<ul><li>DTLs not expected to reverse → equity; expected to reverse → liability (often at PV); uncertain → excluded from both.</li>
<li>Changes in tax rates: DTLs and DTAs remeasured; rate increase raises DTL (higher expense) and DTA (lower expense).</li>
<li>Disclosures: DTLs, DTAs, valuation allowance and changes; unrecognized DTL on undistributed foreign earnings; components of tax expense; rate reconciliation; loss carryforwards and credits.</li></ul>`,
math:`<div class="f"><span class="lbl">Tax expense identity</span>Income tax expense = taxes payable + ΔDTL − ΔDTA</div>
<div class="f"><span class="lbl">Deferred tax balance</span>DTL (DTA) = (carrying value − tax base) × tax rate</div>
<div class="f"><span class="lbl">Rates</span>Effective = tax expense / pretax income · Cash = cash taxes / pretax income</div>
<p><strong>Why expense ≠ payable:</strong> the expense is the tax "belonging" to this year's book profit; the payable is what the tax code demands now. The DTL/DTA is the bridge.</p>
<div class="dir"><div>Accelerated tax depreciation → taxes payable <span class="dn">↓</span> now → DTL <span class="up">↑</span></div><div>Tax rate <span class="up">↑</span> → DTL <span class="up">↑</span> (expense <span class="up">↑</span>), DTA <span class="up">↑</span> (expense <span class="dn">↓</span>)</div><div>Valuation allowance <span class="up">↑</span> → DTA <span class="dn">↓</span> → tax expense <span class="up">↑</span>, NI <span class="dn">↓</span></div></div>
<div class="calc" data-calc="tax"></div>`,
example:`<div class="q">A company buys equipment for $900 at the start of year 1. For the books it depreciates straight-line over 3 years ($300/yr); for tax it deducts $450 in year 1. Pretax income (books) is $400; tax rate 25%; no other differences. (a) Taxable income and taxes payable. (b) Carrying value, tax base and DTL at year-end. (c) Income tax expense and effective tax rate. (d) If $40 of the pretax income were tax-exempt interest instead, what changes?</div>
<ol class="steps"><li><strong>Taxable income</strong> = 400 − (450 − 300) = <strong>$250</strong> → taxes payable = <strong>$62.50</strong>.</li>
<li><strong>Carrying value</strong> = 600; <strong>tax base</strong> = 450 → DTL = 150 × 25% = <strong>$37.50</strong>.</li>
<li><strong>Tax expense</strong> = 62.50 + 37.50 = <strong>$100</strong>; effective rate = 100/400 = <strong>25%</strong> (temporary differences don't change the ETR).</li>
<li><strong>Permanent difference:</strong> taxable income falls by $40 → taxes payable and expense fall by $10 → expense $90 → ETR = 90/400 = <strong>22.5%</strong>; no deferred tax created.</li></ol>
<p class="ans">Answers: $250 / $62.50 · DTL $37.50 · $100 / 25% · ETR 22.5%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Permanent differences create DTLs/DTAs. <b>Fix:</b> they don't; they change the effective rate.</li>
<li><b>Trap:</b> Asset carrying value &gt; tax base → DTA. <b>Fix:</b> → DTL (for assets).</li>
<li><b>Trap:</b> Tax expense = taxes payable. <b>Fix:</b> + ΔDTL − ΔDTA.</li>
<li><b>Trap:</b> Always treating DTLs as debt. <b>Fix:</b> if not expected to reverse, treat as equity.</li>
<li><b>Trap:</b> IFRS uses a valuation allowance. <b>Fix:</b> IFRS reports a smaller DTA directly; US GAAP uses a valuation allowance.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute taxes payable, tax expense, DTL/DTA; identify temporary vs permanent; effect of rate changes; ETR vs statutory vs cash rate; analytical treatment of DTLs; valuation allowance effects.</li>
<li><strong>Quick check:</strong> book income &gt; taxable income (timing) → DTL.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Two sets of books</b>Investors' and the taxman's.</div>
<div class="anchor"><b>Pay less now → owe later → DTL</b>Pay more now → save later → DTA.</div>
<div class="anchor"><b>Expense = Payable + ΔDTL − ΔDTA</b>The bridge equation.</div>
<div class="anchor"><b>Permanent = rate changer</b>Temporary = deferred tax maker.</div></div>`,
summary:`Accounting profit is pretax income under financial reporting rules; taxable income is income per the tax return; taxes payable are the current tax due; income tax expense = taxes payable + ΔDTL − ΔDTA. Temporary differences between book and tax reporting create deferred tax liabilities (taxes deferred to the future: e.g., accelerated tax depreciation, revenue booked before taxed) and deferred tax assets (taxes prepaid or future deductions: e.g., warranty reserves, impairments, loss carryforwards), measured as (carrying value − tax base) × tax rate; permanent differences create none but cause the effective tax rate (tax expense/pretax income) to differ from the statutory rate. DTAs are reduced by a valuation allowance (US GAAP) when realization is unlikely; tax rate changes remeasure DTLs and DTAs through tax expense. Analysts treat DTLs expected to reverse as liabilities and those not expected to reverse as equity, and use the tax rate reconciliation and the cash tax rate (cash taxes/pretax income) to forecast taxes and assess earnings quality.`
},
quiz:[
{q:"A company uses accelerated depreciation for tax and straight-line for financial reporting. This most likely creates a:",o:["deferred tax asset","deferred tax liability","permanent difference"],a:1,e:"Lower taxes now, higher later → DTL."},
{q:"Taxes payable $80, increase in DTL $10, increase in DTA $4. Income tax expense is:",o:["$74","$86","$94"],a:1,e:"80 + 10 − 4 = 86."},
{q:"Tax-exempt municipal bond interest most likely causes:",o:["a DTL","a DTA","the effective tax rate to be below the statutory rate"],a:2,e:"Permanent difference lowers the effective rate; no deferred tax."}]
});

add({n:36,topic:"fsa",title:"Financial Reporting Quality",
los:["36.a Compare financial reporting quality with the quality of reported results (including quality of earnings, cash flow, and balance sheet items).","36.b Describe a spectrum for assessing financial reporting quality.","36.c Explain the difference between conservative and aggressive accounting.","36.d Describe motivations that might cause management to issue financial reports that are not high quality and conditions that are conducive to issuing low-quality, or even fraudulent, financial reports.","36.e Describe mechanisms that discipline financial reporting quality and the potential limitations of those mechanisms.","36.f Describe presentation choices, including non-GAAP measures, that could be used to influence an analyst's opinion.","36.g Describe accounting methods (choices and estimates) that could be used to manage earnings, cash flow, and balance sheet items.","36.h Describe accounting warning signs and methods for detecting manipulation of information in financial reports."],
s:{
eli5:`<p>Two questions about any report card: Is it <em>honest and clear</em>? And are the <em>grades actually good and likely to last</em>? A student can have an honest report card with poor grades, or a doctored one with great grades.</p>
<p>Companies have lots of legal wiggle room (estimates, timing choices) that can make results look better or smoother than reality. Sometimes they cross the line into fraud. Analysts learn the warning signs: profits that don't turn into cash, sales growing much faster than rivals', lots of "one-time" charges every year, and big emphasis on custom "adjusted" numbers.</p>`,
core:`<p><strong>What problem is this solving?</strong> Reported numbers can be biased or manipulated. Analysts must judge both the reliability of reporting and the sustainability of results before using the numbers.</p>
<ul><li><strong>Reporting quality vs results quality:</strong> reporting quality = GAAP-compliant, decision-useful, faithful; results (earnings) quality = earnings that are adequate (cover cost of capital) and sustainable. High-quality earnings require high-quality reporting, but good reporting can describe poor results.</li>
<li><strong>Bias within GAAP:</strong> conservative choices lower current earnings/position; aggressive choices raise them. Both distort; "cookie jar" reserves let managers shift income across periods (smoothing).</li>
<li><strong>Fraud triangle:</strong> motivation (meet targets, compensation, covenants, careers), opportunity (weak controls, weak board oversight, wide range of acceptable methods), rationalization.</li>
<li><strong>Discipline mechanisms</strong> (regulators, auditors, private contracts) help but have limits (auditors are paid by the company; audits give reasonable assurance only).</li>
<li><strong>Presentation games:</strong> non-GAAP metrics (must be reconciled to GAAP), selective emphasis, classification shifts (e.g., moving costs to "non-recurring").</li></ul>`,
formal:`<h4>Quality spectrum (highest to lowest)</h4>
<ol><li>GAAP-compliant, decision-useful; sustainable, adequate earnings.</li>
<li>GAAP, decision-useful, but low earnings quality (not sustainable or not adequate).</li>
<li>GAAP, but biased accounting choices (aggressive or conservative).</li>
<li>GAAP, but earnings management (real actions or accounting choices to hit targets).</li>
<li>Non-compliant reporting, but numbers reflect actual economic activity.</li>
<li>Non-compliant, fictitious/fraudulent numbers.</li></ol>
<h4>Conservative vs aggressive accounting</h4>
<p>Conservative: understate current earnings/assets (e.g., large reserves, rapid write-offs). Aggressive: overstate current earnings/position (e.g., premature revenue recognition, capitalizing operating costs, long useful lives). Big-bath restructuring charges can create reserves to boost later earnings.</p>
<h4>Motivations and conditions</h4>
<p>Motivations: meet earnings expectations, avoid covenant violations, compensation, career concerns, perceptions of customers/suppliers. Conditions: opportunity (weak controls, poor board oversight, latitude in standards), motivation, rationalization.</p>
<h4>Discipline mechanisms</h4>
<p>Market discipline (cost of capital), regulators (registration, disclosure, review, enforcement), auditors (opinion, internal control audit), private contracting (covenants, contracts referencing accounting numbers). Limitations: auditors chosen and paid by the firm; audits sample; regulators have limited resources.</p>
<h4>Methods to manage results</h4>
<ul><li>Revenue: shipping terms (FOB shipping point vs destination), channel stuffing, bill-and-hold, barter, related-party sales.</li>
<li>Estimates: bad debt and warranty reserves, DTA valuation allowance, depreciation lives/salvage, impairment timing, inventory methods.</li>
<li>Capitalizing expenses; cash flow management (delaying payables, selling receivables, classifying interest/dividends under IFRS options, capitalized interest in CFI).</li>
<li>Balance sheet: goodwill and intangibles, off-balance-sheet arrangements.</li></ul>
<h4>Warning signs</h4>
<p>Revenue growth out of line with peers; changes in revenue recognition; declining turnover ratios (receivables, inventory, total assets); bill-and-hold, barter, related-party transactions; net income not supported by CFO; capitalization or depreciation policies out of line with peers; fourth-quarter patterns not explained by seasonality; recurring "non-recurring" items; emphasis on non-GAAP measures; minimal disclosure.</p>`,
math:`<p>No required formulas. Two simple quality checks:</p>
<div class="f"><span class="lbl">Cash vs earnings</span>CFO / net income persistently &lt; 1 → earnings may be accrual-driven (lower quality)</div>
<div class="f"><span class="lbl">Accruals (balance-sheet approach)</span>Aggregate accruals ≈ NI − CFO; scaled by average assets → higher ratio = more accrual-driven earnings</div>
<div class="f"><span class="lbl">Revenue quality</span>DSO rising while revenue jumps → possible premature or fictitious revenue</div>
<div class="dir"><div>Longer useful lives, higher salvage, lower reserves → current earnings <span class="up">↑</span> (aggressive)</div><div>Big bath now → future earnings <span class="up">↑</span></div></div>`,
example:`<div class="q">A company reports: revenue +35% vs peers +8%; DSO up from 45 to 70 days; net income $200m but CFO $40m; useful lives of equipment extended from 8 to 12 years; restructuring charges in each of the last four years; heavy emphasis on "adjusted EBITDA". (a) List the warning signs. (b) Where on the quality spectrum might this fall? (c) What should the analyst do?</div>
<ol class="steps"><li><strong>Revenue</strong> growth far above peers + rising DSO → possible aggressive/premature revenue recognition or channel stuffing.</li>
<li><strong>NI ≫ CFO</strong> → earnings driven by accruals.</li>
<li><strong>Longer useful lives</strong> → lower depreciation, boosted earnings (estimate change out of line with peers?).</li>
<li><strong>Recurring "non-recurring" charges</strong> → treat as ongoing costs; possible cookie-jar reserves.</li>
<li><strong>Non-GAAP emphasis</strong> → reconcile to GAAP and scrutinize exclusions.</li>
<li><strong>Spectrum:</strong> at best biased/managed earnings within GAAP; possibly non-compliant. <strong>Action:</strong> adjust earnings (normalize depreciation, include restructuring), analyze receivables and revenue recognition notes, compare with peers, lower confidence in forecasts.</li></ol>
<p class="ans">Answer: multiple red flags → biased/managed reporting at best; adjust and investigate</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> High-quality reporting means high-quality earnings. <b>Fix:</b> compliant reporting can describe poor or unsustainable results.</li>
<li><b>Trap:</b> Conservative accounting is always good. <b>Fix:</b> it's still biased and can be used to smooth earnings.</li>
<li><b>Trap:</b> A clean audit guarantees no fraud. <b>Fix:</b> reasonable assurance only.</li>
<li><b>Trap:</b> Non-GAAP measures are prohibited. <b>Fix:</b> allowed, but must be defined and reconciled to GAAP.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> distinguish reporting vs earnings quality; order the spectrum; conservative vs aggressive examples; fraud triangle; discipline mechanisms and limits; identify warning signs and manipulation methods.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Honest card vs good grades</b>Reporting quality vs results quality.</div>
<div class="anchor"><b>Motive · Opportunity · Excuse</b>Fraud triangle.</div>
<div class="anchor"><b>Profit without cash is a red flag</b>NI ≫ CFO.</div>
<div class="anchor"><b>"One-time" every time</b>Recurring non-recurring items.</div></div>`,
summary:`Financial reporting quality concerns whether statements comply with GAAP and are decision-useful (relevant, faithfully representative); quality of reported results concerns whether earnings, cash flows and balance sheet items are adequate and sustainable. A spectrum runs from GAAP-compliant, decision-useful reports with sustainable earnings, through low earnings quality, biased choices and earnings management, to non-compliant and finally fraudulent reporting. Conservative choices understate and aggressive choices overstate current performance; both can be used to smooth earnings. Low-quality reporting arises from motivations (targets, compensation, covenants, careers), opportunities (weak controls and oversight, flexible standards) and rationalization. Regulators, auditors and private contracts discipline reporting, with limitations (auditors paid by the firm, reasonable assurance only). Presentation choices such as non-GAAP measures (which must be reconciled) and accounting choices (revenue timing, reserves, valuation allowances, depreciation, impairments, inventory methods, capitalization, related-party transactions) can manage results. Warning signs include revenue growth out of line with peers, falling turnover ratios, unusual transactions, income not backed by CFO, aggressive capitalization or lives, odd fourth-quarter patterns, frequent non-recurring items, and emphasis on non-GAAP metrics.`
},
quiz:[
{q:"A firm's financial statements comply with GAAP and are decision-useful, but its earnings depend on a one-time asset sale. This is best described as:",o:["high reporting quality and low earnings quality","low reporting quality and high earnings quality","fraudulent reporting"],a:0,e:"Compliant, useful reporting of unsustainable earnings."},
{q:"Which is an aggressive accounting choice?",o:["Shortening the useful lives of assets","Increasing the allowance for doubtful accounts","Capitalizing costs that peers expense"],a:2,e:"Capitalizing boosts current earnings."},
{q:"Which most likely indicates a need for closer scrutiny?",o:["CFO consistently exceeds net income","Receivables turnover declining while revenue surges","Stable gross margins in line with peers"],a:1,e:"Possible premature or fictitious revenue recognition."}]
});
