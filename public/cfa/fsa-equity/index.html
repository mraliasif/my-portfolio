add({n:37,topic:"fsa",title:"Financial Analysis Techniques",
los:["37.a Describe tools and techniques used in financial analysis, including their uses and limitations.","37.b Calculate and interpret activity, liquidity, solvency, and profitability ratios.","37.c Describe relationships among ratios and evaluate a company using ratio analysis.","37.d Demonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components.","37.e Describe the uses of industry-specific ratios used in financial analysis.","37.f Describe how ratio analysis and other techniques can be used to model and forecast earnings."],
s:{
eli5:`<p>Raw numbers mean little: is $1 million profit good? Depends on the company's size. Ratios turn numbers into comparable scores: profit per dollar of sales, how fast inventory sells, how much debt per dollar of equity.</p>
<p>The most famous breakdown, <strong>DuPont</strong>, explains a company's return to owners (ROE) as three levers: how much profit it squeezes from each sale, how much it sells with its assets, and how much it borrows. Two firms can have the same ROE for very different (and differently risky) reasons.</p>`,
core:`<p><strong>What problem is this solving?</strong> Comparing firms and periods on a like-for-like basis, diagnosing strengths and weaknesses, and building forecasts.</p>
<ul><li><strong>Tools:</strong> ratios, common-size statements (vertical: % of sales/assets; horizontal: % of base year), graphs, regression.</li>
<li><strong>Four ratio families:</strong> activity (efficiency of using assets), liquidity (short-term obligations), solvency (long-term obligations, leverage, coverage), profitability (margins and returns).</li>
<li><strong>Ratios are connected:</strong> a higher ROE could come from better margins (good) or more leverage (riskier); DuPont reveals which.</li>
<li><strong>Limitations:</strong> ratios in isolation mean little; different accounting methods; multi-industry firms; judgment about acceptable ranges; window dressing.</li>
<li><strong>Industry-specific ratios</strong> (e.g., bank capital ratios, same-store sales, revenue per available room) capture what drives that industry.</li></ul>`,
formal:`<h4>Activity ratios</h4>
<p>Receivables turnover = revenue/avg receivables; DSO = 365/turnover. Inventory turnover = COGS/avg inventory; DOH = 365/turnover. Payables turnover = purchases/avg payables; number of days of payables = 365/turnover. Total asset turnover = revenue/avg assets; fixed asset turnover = revenue/avg net fixed assets; working capital turnover = revenue/avg working capital.</p>
<h4>Liquidity ratios</h4>
<p>Current = CA/CL; quick = (cash + ST securities + receivables)/CL; cash = (cash + ST securities)/CL; defensive interval = (cash + ST securities + receivables)/daily cash expenditures; cash conversion cycle = DOH + DSO − days of payables.</p>
<h4>Solvency ratios</h4>
<p>Debt-to-assets; debt-to-capital = debt/(debt + equity); debt-to-equity; financial leverage = avg assets/avg equity; interest coverage = EBIT/interest; fixed charge coverage = (EBIT + lease payments)/(interest + lease payments).</p>
<h4>Profitability ratios</h4>
<p>Gross margin; operating margin = EBIT/revenue; pretax margin = EBT/revenue; net margin = NI/revenue; ROA = NI/avg assets (or (NI + interest(1 − t))/assets); operating ROA = EBIT/avg assets; return on total capital = EBIT/(debt + equity); ROE = NI/avg equity; return on common equity = (NI − pref div)/avg common equity.</p>
<h4>DuPont</h4>
<ul><li>2-step: ROE = ROA × leverage.</li>
<li>3-step: ROE = net margin × asset turnover × leverage.</li>
<li>5-step: ROE = tax burden (NI/EBT) × interest burden (EBT/EBIT) × EBIT margin × asset turnover × leverage.</li>
<li>Higher leverage raises ROE (if ROA &gt; cost of debt) but also raises interest burden (lowers EBT/EBIT) and risk.</li></ul>
<h4>Industry-specific and forecasting uses</h4>
<p>Banks: capital adequacy, liquidity coverage, net interest margin; retail: same-store sales, sales per square foot; hotels: occupancy, RevPAR; services: revenue per employee. Pro forma statements forecast sales growth and relate other items to sales (percent-of-sales), with sensitivity analysis, scenario analysis and simulation.</p>`,
math:`<div class="f"><span class="lbl">DuPont 5-step</span>ROE = (NI/EBT) × (EBT/EBIT) × (EBIT/Revenue) × (Revenue/Assets) × (Assets/Equity)</div>
<div class="vars"><div><code>Tax burden</code><span>NI/EBT = 1 − tax rate (share of pretax profit kept)</span></div><div><code>Interest burden</code><span>EBT/EBIT (share of operating profit left after interest)</span></div><div><code>EBIT margin</code><span>Operating profitability</span></div><div><code>Asset turnover</code><span>Sales per dollar of assets</span></div><div><code>Leverage</code><span>Assets per dollar of equity</span></div></div>
<p><strong>Why it works:</strong> the intermediate terms cancel (EBT, EBIT, revenue, assets), leaving NI/equity, but each factor isolates one driver.</p>
<div class="f"><span class="lbl">Turnovers and days</span>DSO = 365 / (revenue/avg AR) · DOH = 365 / (COGS/avg inventory) · CCC = DOH + DSO − days payables</div>
<div class="dir"><div>Leverage <span class="up">↑</span> → ROE <span class="up">↑</span> (if ROA &gt; after-tax cost of debt) but interest burden <span class="dn">↓</span> and risk <span class="up">↑</span></div><div>Turnover <span class="dn">↓</span> with stable sales → inefficiency or obsolete assets</div></div>
<div class="calc" data-calc="dupont"></div>
<div class="calc" data-calc="ratios"></div>`,
example:`<div class="q">Net income $120; EBT $160; EBIT $200; revenue $1,000; average assets $800; average equity $400. (a) 5-step DuPont. (b) If the company borrows to buy back shares so average equity falls to $320 (assets unchanged) and interest rises so EBT falls to $150 (NI $112.50), what is the new ROE? Interpret. (c) Revenue $1,000, average receivables $125: receivables turnover and DSO.</div>
<ol class="steps"><li><strong>Tax burden</strong> = 120/160 = 0.75; <strong>interest burden</strong> = 160/200 = 0.80; <strong>EBIT margin</strong> = 20%; <strong>asset turnover</strong> = 1.25; <strong>leverage</strong> = 2.0.</li>
<li><strong>ROE</strong> = 0.75 × 0.80 × 0.20 × 1.25 × 2.0 = <strong>30.0%</strong> (check: 120/400).</li>
<li><strong>After recap:</strong> leverage = 800/320 = 2.5; interest burden = 150/200 = 0.75; tax burden 0.75 → ROE = 0.75 × 0.75 × 0.20 × 1.25 × 2.5 = <strong>35.2%</strong> (= 112.5/320).</li>
<li><strong>Interpretation:</strong> ROE rose purely from leverage; operating performance (margin, turnover) didn't change, but financial risk increased.</li>
<li><strong>Receivables turnover</strong> = 1,000/125 = 8.0 → <strong>DSO</strong> = 365/8 = <strong>45.6 days</strong>.</li></ol>
<p class="ans">Answers: ROE 30.0% · 35.2% (leverage-driven) · 8.0× / 45.6 days</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using revenue for inventory turnover. <b>Fix:</b> COGS/average inventory.</li>
<li><b>Trap:</b> Higher ROE always good. <b>Fix:</b> check whether leverage drove it.</li>
<li><b>Trap:</b> Interest burden rises with more debt. <b>Fix:</b> EBT/EBIT falls (more interest).</li>
<li><b>Trap:</b> Year-end balances when averages are required. <b>Fix:</b> use averages for flow/stock ratios when available.</li>
<li><b>Trap:</b> Judging a ratio without peers/history. <b>Fix:</b> compare cross-sectionally and over time.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute ratios; interpret changes; DuPont decomposition and what drove ROE change; CCC; industry-specific ratios; limitations.</li>
<li><strong>Speed:</strong> for "what drove ROE?", compute each DuPont factor for both years and see which moved.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Activity · Liquidity · Solvency · Profitability</b>The four ratio families.</div>
<div class="anchor"><b>Tax × Interest × Margin × Turnover × Leverage</b>5-step DuPont.</div>
<div class="anchor"><b>Same ROE, different stories</b>Margin-driven vs leverage-driven.</div>
<div class="anchor"><b>Days = 365 ÷ turnover</b>Turnover-to-days conversion.</div></div>`,
summary:`Financial analysis uses ratios, common-size statements (vertical and horizontal), graphs and regression to compare firms over time and against peers, recognizing limitations such as accounting differences, multi-industry firms, isolated interpretation and judgment about acceptable ranges. Activity ratios (turnovers and days for receivables, inventory, payables; total, fixed and working capital turnover) measure efficiency; liquidity ratios (current, quick, cash, defensive interval, cash conversion cycle) measure short-term solvency; solvency ratios (debt-to-assets, debt-to-capital, debt-to-equity, financial leverage, interest and fixed charge coverage) measure long-term risk; profitability ratios (gross, operating, pretax and net margins; ROA, operating ROA, return on total capital, ROE) measure returns. DuPont analysis decomposes ROE into tax burden × interest burden × EBIT margin × asset turnover × leverage, revealing whether ROE changes stem from operations or leverage. Industry-specific ratios capture sector drivers, and ratio relationships support pro forma forecasting with sensitivity, scenario and simulation analysis.`
},
quiz:[
{q:"Net margin 5%, asset turnover 2.0, leverage 1.5. ROE is:",o:["10.0%","15.0%","7.5%"],a:1,e:"5% × 2.0 × 1.5 = 15%."},
{q:"A company's ROE rose while its net margin and asset turnover were unchanged. The most likely cause is:",o:["higher financial leverage","lower tax rate only","higher interest burden ratio"],a:0,e:"With margin and turnover constant, leverage must have increased."},
{q:"Inventory turnover is calculated as:",o:["revenue / average inventory","COGS / average inventory","average inventory / COGS"],a:1,e:"Inventory is at cost, so use COGS."}]
});

add({n:38,topic:"fsa",title:"Introduction to Financial Statement Modeling",
los:["38.a Demonstrate the development of a sales-based pro forma company model.","38.b Explain how behavioral factors affect analyst forecasts and recommend remedial actions for analyst biases.","38.c Explain how the competitive position of a company based on a Porter's five forces analysis affects prices and costs.","38.d Explain how to forecast industry and company sales and costs when they are subject to price inflation or deflation.","38.e Explain considerations in the choice of an explicit forecast horizon and an analyst's choices in developing projections beyond the short-term forecast horizon."],
s:{
eli5:`<p>Forecasting a company is like planning next year's household budget. Start with income (sales), then estimate costs that move with income (groceries for more guests), fixed costs (rent), interest on loans and taxes. Then check that your savings, loans and spending add up.</p>
<p>Watch your own blind spots: being too sure of yourself, sticking to last year's guess, or only noticing news that agrees with you. And think about the neighborhood: can the company raise prices, or will competitors and customers push back?</p>`,
core:`<p><strong>What problem is this solving?</strong> Turning analysis into forward-looking estimates of earnings, cash flows and balance sheets that drive valuation, while controlling for analyst biases and industry economics.</p>
<ul><li><strong>Sales drive the model:</strong> forecast revenue (top-down from GDP/industry, bottom-up from units × price, or hybrid), then link costs, working capital and capex to sales.</li>
<li><strong>Costs:</strong> COGS (variable, as % of sales, adjusted for input prices and hedges), SG&amp;A (fixed and variable parts), financing costs (debt × rate), taxes (effective rate; cash vs book), D&amp;A from capex.</li>
<li><strong>Balance sheet and cash flow</strong> follow: working capital via turnover/days assumptions; PP&amp;E via capex and depreciation; financing plug.</li>
<li><strong>Behavioral biases:</strong> overconfidence (narrow ranges), illusion of control (more data/complexity feels like accuracy), conservatism/anchoring (slow to update), representativeness (stereotyping, base-rate neglect), confirmation (seeking supporting evidence). Remedies: scenario ranges, track records, simpler models, base rates, seeking contrary views.</li>
<li><strong>Competitive position (Porter)</strong> determines pricing power and cost pressures; <strong>inflation/deflation</strong> pass-through depends on elasticity, competition and timing.</li>
<li><strong>Forecast horizon:</strong> long enough to capture a full cycle (normalized earnings) and the effects of strategic events; beyond it, use a terminal value (multiple or DCF), recognizing high sensitivity to growth assumptions.</li></ul>`,
formal:`<h4>Sales-based pro forma model steps</h4>
<ol><li>Estimate revenue growth and future revenue.</li>
<li>Estimate COGS (often % of revenue; adjust for input costs, hedges).</li>
<li>Estimate SG&amp;A (fixed and variable components).</li>
<li>Estimate financing costs (interest on average debt).</li>
<li>Estimate income tax expense and cash taxes (effective rate, deferred taxes).</li>
<li>Model balance sheet items from the income statement and working capital assumptions (DSO, DOH, days payables).</li>
<li>Estimate capex and net PP&amp;E using historical depreciation and capex (maintenance vs growth).</li>
<li>Build the pro forma cash flow statement.</li></ol>
<h4>Behavioral biases and remedies</h4>
<table><tr><th>Bias</th><th>Remedy</th></tr>
<tr><td>Overconfidence</td><td>Record and review forecast accuracy; use scenario analysis and wider ranges</td></tr>
<tr><td>Illusion of control</td><td>Use simpler models; focus on key drivers</td></tr>
<tr><td>Conservatism / anchoring</td><td>Update with new information; consider base rates</td></tr>
<tr><td>Representativeness</td><td>Use base rates and statistical evidence rather than stereotypes</td></tr>
<tr><td>Confirmation</td><td>Seek disconfirming evidence; devil's advocate</td></tr></table>
<h4>Porter's five forces and pricing/costs</h4>
<p>Threat of substitutes (high + low switching costs → less pricing power); rivalry (high → less pricing power); supplier power (high → input cost pressure); buyer power (high → less pricing power); threat of entry (low → more pricing power).</p>
<h4>Inflation and deflation</h4>
<ul><li>Input price increases raise COGS unless hedged or vertically integrated; ability to pass on depends on demand elasticity, competitors' actions and timing.</li>
<li>Industry sales: volume × price; inflation can raise nominal sales while depressing volume.</li></ul>
<h4>Forecast horizon</h4>
<p>Buy-side: expected holding period; cyclical firms: include mid-cycle (normalized earnings); M&amp;A/restructuring: long enough for benefits; beyond: long-run growth (e.g., historical average over a cycle) and terminal value via multiples or DCF.</p>`,
math:`<div class="f"><span class="lbl">Percent-of-sales model</span>Revenue<sub>t</sub> = Revenue<sub>t−1</sub> × (1 + g) · COGS = Revenue × COGS% · SG&amp;A = fixed + variable% × Revenue</div>
<div class="f"><span class="lbl">Interest and tax</span>Interest = average debt × rate · Tax = EBT × effective rate</div>
<div class="f"><span class="lbl">Working capital</span>Receivables = Revenue × DSO/365 · Inventory = COGS × DOH/365 · Payables = COGS × days payables/365</div>
<div class="dir"><div>Higher input inflation with low pricing power → margins <span class="dn">↓</span></div><div>Small change in long-run g → large change in terminal value</div></div>`,
example:`<div class="q">Revenue last year $1,000; expected growth 8%. COGS 60% of revenue; SG&amp;A = $100 fixed + 5% of revenue; debt $400 at 5%; tax rate 25%. DSO 45 days. (a) Build next year's income statement. (b) Forecast receivables. (c) If input costs rise 10% and the company can pass through only half, what happens to the COGS %?</div>
<ol class="steps"><li><strong>Revenue</strong> = 1,000 × 1.08 = <strong>$1,080</strong>.</li>
<li><strong>COGS</strong> = 0.60 × 1,080 = $648 → gross profit $432.</li>
<li><strong>SG&amp;A</strong> = 100 + 0.05 × 1,080 = $154 → EBIT = <strong>$278</strong>.</li>
<li><strong>Interest</strong> = 0.05 × 400 = $20 → EBT $258; tax 25% = $64.50 → <strong>NI = $193.50</strong>.</li>
<li><strong>Receivables</strong> = 1,080 × 45/365 = <strong>$133.2</strong>.</li>
<li><strong>Inflation:</strong> COGS per unit +10%, prices +5% (half pass-through, assuming volume unchanged) → COGS% ≈ 60% × 1.10/1.05 ≈ <strong>62.9%</strong>: margin squeeze.</li></ol>
<p class="ans">Answers: revenue $1,080, EBIT $278, NI $193.50 · AR $133.2 · COGS ≈ 62.9% of revenue</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Treating all costs as variable. <b>Fix:</b> separate fixed and variable (operating leverage).</li>
<li><b>Trap:</b> More detailed models are always more accurate. <b>Fix:</b> illusion of control; focus on key drivers.</li>
<li><b>Trap:</b> Forecasting a cyclical firm from peak earnings. <b>Fix:</b> use normalized (mid-cycle) earnings.</li>
<li><b>Trap:</b> Assuming full pass-through of inflation. <b>Fix:</b> depends on competition and elasticity.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> order of pro forma steps; compute next-year items; identify behavioral bias and remedy; five forces effects on pricing/costs; inflation pass-through; forecast horizon choice.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Sales first, everything follows</b>Revenue drives the model.</div>
<div class="anchor"><b>Five forces, one question</b>Who captures the profit: firm, rivals, suppliers or customers?</div>
<div class="anchor"><b>Mid-cycle for cyclicals</b>Normalize before you extrapolate.</div></div>`,
summary:`A sales-based pro forma model forecasts revenue, then COGS, SG&amp;A (fixed and variable), financing costs, income taxes and cash taxes, models balance sheet items from the income statement and working capital assumptions, forecasts capex and PP&amp;E from historical relationships, and derives the pro forma cash flow statement. Analyst forecasts can suffer from overconfidence, illusion of control, conservatism/anchoring, representativeness and confirmation biases, mitigated by tracking accuracy, scenario analysis, simpler models, base rates and seeking contrary evidence. Porter's five forces (substitutes, rivalry, supplier power, buyer power, threat of entry) shape pricing power and cost pressure; inflation in input costs raises COGS unless hedged or offset by vertical integration or price increases, whose success depends on demand elasticity and competitors. The explicit forecast horizon should reflect the holding period, include a mid-cycle point for cyclical firms and allow strategic events to play out; beyond it, analysts use long-run growth assumptions and a terminal value, whose estimate is highly sensitive to growth assumptions.`
},
quiz:[
{q:"An analyst who builds an extremely detailed model and believes it makes her forecasts more accurate is most likely exhibiting:",o:["illusion of control","conservatism bias","representativeness bias"],a:0,e:"Complexity creates a false sense of control/accuracy."},
{q:"Under Porter's framework, pricing power is greatest when:",o:["buyer power is high","threat of new entrants is low","rivalry is intense"],a:1,e:"High barriers to entry support pricing power."},
{q:"For a highly cyclical company, the forecast horizon should most appropriately:",o:["end at the current peak","include the middle of a cycle","be limited to one year"],a:1,e:"Normalized, mid-cycle earnings are more representative."}]
});

add({n:39,topic:"eq",title:"Equity Instrument Features",
los:["39.a Compare characteristics of common and preferred shares and describe the features of each.","39.b Compare features of public and private equity and describe the stages of the company life cycle at which private equity investments occur."],
s:{
eli5:`<p>Owning a share means owning a small slice of a company. <strong>Common shareholders</strong> are the true owners: they vote and get whatever is left after everyone else is paid. Great when things go well, painful when they don't.</p>
<p><strong>Preferred shareholders</strong> are in between owners and lenders. They usually get a fixed dividend and are paid before common shareholders, but usually can't vote. Extra features can be bolted on: missed dividends must be caught up (cumulative), a share of extra profits (participating), the right to swap into common shares (convertible).</p>
<p><strong>Private equity</strong> is owning companies that don't trade on a stock exchange: harder to sell, less information, but closer to control.</p>`,
core:`<p><strong>What problem is this solving?</strong> Understanding what rights each kind of equity gives you (cash flows, control, priority) and how that changes risk and value.</p>
<ul><li><strong>Common shares:</strong> residual claim; voting rights; variable dividends the firm has no obligation to pay; highest risk and highest potential return among a firm's securities.</li>
<li><strong>Preferred shares:</strong> fixed dividends (not a legal obligation; skipping one is not default), priority over common in dividends and liquidation, usually no vote and no maturity. Less risky than common.</li>
<li><strong>Preferred features:</strong> cumulative (arrears paid before common), participating (extra dividends above a profit threshold, can receive more than par in liquidation), convertible (to common at a set ratio), callable (issuer can repurchase → worth less to investor), putable (holder can sell back → worth more).</li>
<li><strong>Public vs private:</strong> private equity has less liquidity, fewer disclosure requirements, closer ownership-management overlap, more concentrated ownership and restrictions on resale.</li>
<li><strong>Life cycle:</strong> venture capital (early stage), growth equity (growth stage, often minority stakes), buyouts (mature firms, control, often leveraged), special situations (distressed, restructuring).</li></ul>`,
formal:`<h4>Common shares</h4>
<ul><li>Residual claim on assets and earnings after creditors and preferred holders.</li>
<li>Voting: elect the board, approve major changes. Statutory voting (one vote per share per seat) vs cumulative voting (concentrate votes on one director: helps minority holders get representation).</li>
<li>Callable common shares (issuer can buy back at set price) and putable common shares (holder can sell back) exist.</li></ul>
<h4>Preferred shares</h4>
<table><tr><th>Feature</th><th>Effect</th></tr>
<tr><td>Cumulative</td><td>Unpaid dividends (arrears) must be paid before common dividends</td></tr>
<tr><td>Non-cumulative</td><td>Missed dividends are lost</td></tr>
<tr><td>Participating</td><td>Extra dividends if profits exceed a level; may get more than par on liquidation</td></tr>
<tr><td>Convertible</td><td>Exchangeable into common at a conversion ratio: upside participation, lower dividend</td></tr>
<tr><td>Callable</td><td>Issuer option → lower value to investor</td></tr>
<tr><td>Putable</td><td>Investor option → higher value</td></tr></table>
<h4>Public vs private equity</h4>
<table><tr><th></th><th>Public</th><th>Private</th></tr>
<tr><td>Liquidity</td><td>High</td><td>Low; resale restrictions</td></tr>
<tr><td>Disclosure</td><td>Extensive, regulated</td><td>Limited</td></tr>
<tr><td>Ownership</td><td>Dispersed, separate from management</td><td>Concentrated, overlaps management</td></tr>
<tr><td>Typical stage</td><td>Mature</td><td>Any: early (VC), growth, mature (buyout), distressed</td></tr></table>
<p>Private equity can let managers focus on long-term value away from quarterly reporting, but valuations are less transparent and exit is uncertain.</p>`,
math:`<div class="f"><span class="lbl">Cumulative preferred arrears</span>Amount due before common = missed dividends + current dividend</div>
<div class="f"><span class="lbl">Perpetual preferred value</span>V = D / r<sub>p</sub> (covered in Reading 44)</div>
<div class="dir"><div>Callable feature → value to holder <span class="dn">↓</span></div><div>Putable or convertible feature → value to holder <span class="up">↑</span></div><div>Cumulative feature → risk to holder <span class="dn">↓</span></div></div>`,
example:`<div class="q">A company has 100,000 cumulative preferred shares, $50 par, 6% dividend. It skipped preferred dividends for the past two years. This year it wants to pay a dividend to common shareholders. (a) How much must go to preferred holders first? (b) If the shares were non-cumulative? (c) Rank the claims of a bondholder, a preferred holder and a common holder in liquidation.</div>
<ol class="steps"><li><strong>Annual preferred dividend</strong> = 6% × $50 = $3 per share → $300,000 per year.</li>
<li><strong>Cumulative:</strong> 2 years arrears + current year = 3 × 300,000 = <strong>$900,000</strong> before any common dividend.</li>
<li><strong>Non-cumulative:</strong> only the current year, <strong>$300,000</strong>.</li>
<li><strong>Liquidation order:</strong> bondholders → preferred → common (residual).</li></ol>
<p class="ans">Answers: $900,000 · $300,000 · debt &gt; preferred &gt; common</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Missing a preferred dividend is default. <b>Fix:</b> preferred dividends are not a legal obligation.</li>
<li><b>Trap:</b> Callable preferred is worth more. <b>Fix:</b> the issuer holds the option → worth less.</li>
<li><b>Trap:</b> Private equity only funds start-ups. <b>Fix:</b> VC, growth, buyout and special situations span the whole life cycle.</li>
<li><b>Trap:</b> Participating means voting. <b>Fix:</b> participating refers to extra dividends/liquidation proceeds.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> preferred feature effects on value/risk; cumulative arrears calculations; public vs private characteristics; match PE type to life-cycle stage.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Common = owner; preferred = hybrid</b>Vote and residual vs fixed dividend and priority.</div>
<div class="anchor"><b>Whoever holds the option gains</b>Callable ↓ value; putable/convertible ↑.</div>
<div class="anchor"><b>VC → Growth → Buyout → Special</b>PE across the life cycle.</div></div>`,
summary:`Common shares give a residual claim on assets and earnings and voting rights, with variable dividends the firm is not obliged to pay. Preferred shares usually have fixed dividends that are not a legal obligation, priority over common shareholders, no maturity and no vote. Cumulative preferred requires missed dividends to be paid before common dividends; participating preferred can receive extra dividends and more than par in liquidation; convertible preferred can be exchanged into common; callable shares (issuer's option) are worth less and putable shares (holder's option) worth more. Compared with public equity, private equity is less liquid, has fewer disclosures, more concentrated ownership overlapping with management and resale restrictions. Venture capital funds early-stage companies, growth equity funds expanding firms, buyouts target mature firms, and special situations involve distressed or restructuring companies.`
},
quiz:[
{q:"Which feature most likely decreases the value of a preferred share to an investor?",o:["Convertible","Callable","Cumulative"],a:1,e:"The issuer holds the call option."},
{q:"A firm with 8% non-cumulative preferred ($100 par) skipped last year's dividend. Before paying common dividends this year it must pay preferred holders per share:",o:["$0","$8","$16"],a:1,e:"Non-cumulative: only the current year's dividend."},
{q:"Private equity invested in a mature company to take control, often with significant debt, is best described as:",o:["venture capital","growth equity","buyout equity"],a:2,e:"Buyouts target mature firms."}]
});

add({n:40,topic:"eq",title:"Equity Investment Jurisdictions, Classes, and the Voting Process",
los:["40.a Compare direct investing with depository receipts and describe dual-class share structures.","40.b Describe the shareholder voting process, including proxy statements, record dates, and the role of proxy advisors."],
s:{
eli5:`<p>Want to own a Japanese company from New York? You could open an account in Tokyo, change your dollars into yen and buy there (direct investing). Or you could buy a <strong>depository receipt</strong>: a certificate traded in New York, in dollars, that stands for shares held in Japan. Easier, but the yen still affects its value.</p>
<p>Some companies issue two kinds of shares where one kind gets many more votes, so founders keep control. And once a year owners vote at a meeting; most vote by "proxy" (mail/online), often with help from advisory firms.</p>`,
core:`<p><strong>What problem is this solving?</strong> How investors access foreign equity, how control can be separated from ownership, and how shareholders actually exercise their votes.</p>
<ul><li><strong>Direct investing:</strong> buy shares in the foreign market and currency; FX risk plus costs of foreign accounts, unfamiliar rules and monitoring.</li>
<li><strong>Depository receipts (DRs):</strong> issued by a depository bank, trade in the local market and currency, represent foreign shares held by a custodian. No currency conversion for the investor, but DR value still reflects FX changes. Sponsored (firm involved, voting rights pass through) vs unsponsored (no firm involvement, depository votes).</li>
<li><strong>Dual-class shares:</strong> classes differ in voting or economic rights (e.g., 10 votes vs 1), letting founders control with a minority of capital; governance risk for outside holders.</li>
<li><strong>Voting:</strong> management and board propose routine items; shareholders can propose items (typically non-binding). Votes happen at the annual meeting; the <strong>proxy statement</strong> gives the agenda, proposals and voting deadlines; the <strong>record date</strong> (often 30+ days before) determines who may vote; custodians determine holders of record; investors can delegate votes to asset managers; <strong>proxy advisors</strong> help institutions research and cast votes.</li></ul>`,
formal:`<h4>Accessing foreign equity</h4>
<table><tr><th></th><th>Direct investing</th><th>Depository receipts</th></tr>
<tr><td>Currency</td><td>Foreign</td><td>Local (but FX affects value)</td></tr>
<tr><td>Market</td><td>Foreign exchange/market</td><td>Local exchange or OTC</td></tr>
<tr><td>Costs/complexity</td><td>Higher: accounts, regulations, monitoring</td><td>Lower</td></tr>
<tr><td>Other</td><td>Full shareholder rights</td><td>Sponsored DRs pass voting rights; unsponsored do not</td></tr></table>
<p>Global depository receipts (GDRs) trade outside both the issuer's home and the US; American depository receipts (ADRs) trade in the US in USD. Other routes: global registered shares, baskets of listed DRs, funds/ETFs.</p>
<h4>Dual-class structures</h4>
<p>Superior-voting shares held by founders/insiders give control disproportionate to economic ownership; may protect long-term strategy but entrench management. Some indexes limit inclusion of firms with dual-class structures.</p>
<h4>Voting process</h4>
<ul><li>Routine items: election of directors, auditor ratification, say-on-pay. Shareholder proposals (e.g., ESG, governance) are usually advisory.</li>
<li><strong>Proxy statement:</strong> agenda, proposals, board recommendations, voting requirements and deadlines.</li>
<li><strong>Record date:</strong> holders on this date are eligible to vote (custodian identifies beneficial owners).</li>
<li><strong>Proxy voting:</strong> vote without attending; delegate to asset managers; proxy advisors provide research and voting platforms (criticized for one-size-fits-all policies and influence).</li></ul>`,
math:`<div class="f"><span class="lbl">DR value</span>DR price (local currency) ≈ foreign share price × shares per DR × exchange rate (local per foreign)</div>
<div class="f"><span class="lbl">Voting power vs economic interest</span>Voting % = votes held / total votes · Economic % = shares held / total shares</div>
<div class="dir"><div>Foreign currency appreciates → DR value in local currency <span class="up">↑</span></div></div>`,
example:`<div class="q">(a) A Japanese share trades at ¥3,000; one ADR represents 2 shares; USD/JPY = 150 (¥ per $). Approximate ADR price? What if the yen strengthens to 120? (b) Founders hold 10 million Class B shares (10 votes each); the public holds 90 million Class A shares (1 vote each). Founders' economic and voting percentages?</div>
<ol class="steps"><li><strong>ADR</strong> = 2 × 3,000 / 150 = <strong>$40</strong>. At 120: 6,000/120 = <strong>$50</strong>: the DR gains purely from FX.</li>
<li><strong>Economic share</strong> = 10/(10 + 90) = <strong>10%</strong>.</li>
<li><strong>Votes</strong> = 100m founder votes vs 90m public → 100/190 = <strong>52.6%</strong>: control with 10% of the equity.</li></ol>
<p class="ans">Answers: $40 → $50 · 10% economic, 52.6% voting</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> DRs eliminate currency risk. <b>Fix:</b> they eliminate currency conversion, not FX exposure.</li>
<li><b>Trap:</b> Shareholder proposals are binding. <b>Fix:</b> usually non-binding but signal concerns.</li>
<li><b>Trap:</b> Anyone holding shares on meeting day votes. <b>Fix:</b> eligibility set by the record date.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> direct vs DR investing; sponsored vs unsponsored; dual-class control math; contents of proxy statement; record date; role of proxy advisors.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>DR = foreign share in local clothes</b>Currency still matters underneath.</div>
<div class="anchor"><b>Two classes, one boss</b>Dual-class shares separate votes from capital.</div>
<div class="anchor"><b>Proxy · Record date · Advisor</b>Voting mechanics.</div></div>`,
summary:`Direct investing means buying a foreign company's shares in its home market and currency, which involves foreign exchange risk and the costs of operating in unfamiliar markets. Depository receipts trade in the investor's local market and currency, avoiding currency conversion, though their value still reflects exchange rate changes. Dual-class share structures give some classes greater voting or economic rights, allowing groups such as founders to control a company with a minority of its capital. Management and the board propose routine matters for shareholder votes; shareholders may submit typically non-binding proposals. Voting takes place at the annual meeting, with the proxy statement providing the agenda, proposals and voting requirements and deadlines. Custodians determine shareholders of record as of a record date, often 30 or more days before the meeting. Investors can vote proxies themselves or delegate to asset managers, and proxy advisors help institutional investors manage their votes.`
},
quiz:[
{q:"A US investor buying an ADR of a German company most likely:",o:["has no exposure to EUR/USD movements","avoids converting USD to EUR but is still exposed to EUR/USD movements","must open a brokerage account in Germany"],a:1,e:"DR prices reflect exchange rates."},
{q:"Eligibility to vote at an annual meeting is determined by the:",o:["meeting date","record date","proxy filing date"],a:1,e:"Holders of record on the record date vote."},
{q:"Founders hold 20% of shares with 10 votes each; others hold 80% with 1 vote each. Founders' voting power is closest to:",o:["20%","71%","91%"],a:1,e:"200/(200+80) = 71.4%."}]
});

add({n:41,topic:"eq",title:"Equity Issuance and Trading",
los:["41.a Describe primary and secondary equity markets and the IPO process.","41.b Compare exchange trading, off-exchange trading, and over-the-counter trading of equities.","41.c Calculate and interpret market float, average daily volume, and turnover ratio, and describe other measures of equity market liquidity.","41.d Describe types of equity market indexes."],
s:{
eli5:`<p>When a company sells brand-new shares to raise money, that's the <strong>primary market</strong> (the first sale is the IPO). After that, investors trade those shares among themselves in the <strong>secondary market</strong>; the company gets no new money but the prices tell everyone what the company is worth.</p>
<p>How easy is it to trade? Look at how many shares are actually available to the public (<strong>float</strong>), how many trade each day (<strong>volume</strong>), and what fraction of the float changes hands daily (<strong>turnover</strong>).</p>`,
core:`<p><strong>What problem is this solving?</strong> How equity is created and traded, where trades happen, and how to measure how liquid a stock is.</p>
<ul><li><strong>Primary market / IPO:</strong> firm issues new shares; requires a prospectus (registration), underwriters solicit investors (book building), set the offer price, and list the shares.</li>
<li><strong>Secondary market:</strong> trading among investors; provides price discovery, liquidity and a way to assess performance.</li>
<li><strong>Venues:</strong> exchanges (rules-based, transparent, regular trading); off-exchange (block trades ≥ 10,000 shares or illiquid stocks; dark pools, internalization) to limit price impact; OTC (dealer network, less transparency, often smaller/unlisted firms).</li>
<li><strong>Liquidity measures:</strong> float (shares available to the public, excluding controlling/closely held), average daily volume, turnover ratio = ADV / float; plus depth (size at best prices), breadth (number of participants/orders) and resiliency (how quickly prices recover after large trades).</li>
<li><strong>Index types:</strong> broad-based, sector, thematic, alternatively weighted (equal, fundamental, factor), multi-market.</li></ul>`,
formal:`<h4>IPO process</h4>
<ol><li>Hire investment bank(s)/underwriters; due diligence.</li>
<li>File registration and prospectus with the regulator.</li>
<li>Roadshow and book building to gauge demand; set price range and final price.</li>
<li>Allocate shares, list and begin trading; possible greenshoe (over-allotment) and lock-up periods for insiders.</li></ol>
<p>Alternatives: direct listing (no new shares raised), SPAC merger, seasoned offerings (follow-on), private placements, rights offerings.</p>
<h4>Trading venues</h4>
<table><tr><th>Venue</th><th>Features</th></tr>
<tr><td>Exchange</td><td>Rules-based, central order book, transparent prices, listing standards</td></tr>
<tr><td>Off-exchange</td><td>Block trades (≥10,000 shares), dark pools, broker internalization: limit market impact; less pre-trade transparency</td></tr>
<tr><td>OTC</td><td>Broker-dealer network; less transparency and regulation; often small or unlisted firms</td></tr></table>
<h4>Liquidity</h4>
<ul><li><strong>Market float</strong> = shares outstanding − shares held by controlling/closely held holders (often expressed in value: × price).</li>
<li><strong>Average daily volume (ADV)</strong> = total shares traded / trading days.</li>
<li><strong>Turnover ratio</strong> = ADV / float: proportion of float traded per day.</li>
<li>Depth, breadth, resiliency.</li></ul>
<h4>Indexes</h4>
<p>Broad-based (whole market), sector, investment theme (e.g., ESG, AI), alternatively weighted (equal, fundamental, factor/smart beta), multi-market (regional/global). Most broad indexes are float-adjusted market-cap weighted.</p>`,
math:`<div class="f"><span class="lbl">Float and liquidity</span>Float = outstanding − closely held · ADV = total volume / days · Turnover = ADV / float</div>
<p><strong>Interpretation:</strong> a high turnover ratio means a larger share of available stock trades each day → more liquid, lower price impact for a given order.</p>
<div class="dir"><div>Insider holdings <span class="up">↑</span> → float <span class="dn">↓</span> → turnover (for given ADV) <span class="up">↑</span>, but capacity for large orders <span class="dn">↓</span></div></div>
<div class="calc" data-calc="float"></div>`,
example:`<div class="q">A company has 200 million shares outstanding; founders and strategic holders own 60 million. Over the last 20 trading days 70 million shares traded. Share price $25. Calculate float (shares and value), ADV and turnover ratio. Would an order of 1 million shares likely move the price much?</div>
<ol class="steps"><li><strong>Float</strong> = 200 − 60 = <strong>140 million</strong> shares; value = 140 × $25 = <strong>$3.5 billion</strong>.</li>
<li><strong>ADV</strong> = 70/20 = <strong>3.5 million</strong> shares/day.</li>
<li><strong>Turnover</strong> = 3.5/140 = <strong>2.5%</strong> per day.</li>
<li><strong>Order size:</strong> 1m ≈ 29% of ADV → noticeable; consider working it over days or using a block/off-exchange venue.</li></ol>
<p class="ans">Answers: float 140m ($3.5bn) · ADV 3.5m · turnover 2.5%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Company receives money in secondary trades. <b>Fix:</b> only primary issuance raises capital.</li>
<li><b>Trap:</b> Turnover = ADV / shares outstanding. <b>Fix:</b> ADV / float.</li>
<li><b>Trap:</b> OTC is more transparent than exchanges. <b>Fix:</b> less transparent.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute float, ADV, turnover; identify venue for a block trade; define depth/breadth/resiliency; classify index types; IPO steps.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Primary = new money; secondary = new owners</b>Market roles.</div>
<div class="anchor"><b>Float → Volume → Turnover</b>Liquidity chain.</div>
<div class="anchor"><b>Depth · Breadth · Resiliency</b>Other liquidity dimensions.</div></div>`,
summary:`Primary equity markets involve issuing new securities to the public: the IPO process requires a prospectus and soliciting investors through underwriters before listing. Secondary markets are where shares trade after issuance; their prices let investors assess returns and company performance. Exchanges are rules-based venues for regular trading; off-exchange trading usually involves block trades (often 10,000 shares or more) or illiquid stocks; OTC trading uses broker-dealer networks with less transparency. Market float is the value (or number) of shares available to the public, excluding controlling holders; average daily volume is average shares traded per day; turnover ratio = ADV / float, the proportion of float traded daily. Depth, breadth and resiliency are additional liquidity measures. Equity indexes may be broad-based, sector, investment-theme, alternatively weighted or multi-market.`
},
quiz:[
{q:"Shares outstanding 50m, insiders hold 10m, ADV 0.8m. The turnover ratio is:",o:["1.6%","2.0%","8.0%"],a:1,e:"0.8/40 = 2%."},
{q:"An institution wishing to sell 500,000 shares with minimal price impact would most likely use:",o:["the exchange's public limit order book","off-exchange block trading","a rights offering"],a:1,e:"Block trades often occur off-exchange."},
{q:"Market resiliency refers to:",o:["the number of participants in the market","how quickly prices return to fair value after a large trade","the volume available at the best bid and ask"],a:1,e:"Breadth = participants; depth = volume at best prices."}]
});

add({n:42,topic:"eq",title:"Sources of Equity Returns",
los:["42.a Describe types of corporate distributions to shareholders: cash dividends, stock dividends and splits, and share repurchases.","42.b Describe the dividend payment chronology.","42.c Calculate and interpret price return and total return, including with dividend reinvestment."],
s:{
eli5:`<p>You make money from a stock in two ways: the price goes up, and the company pays you cash (dividends). Price change alone is the <strong>price return</strong>; add dividends and you get the <strong>total return</strong>.</p>
<p>A stock split is like cutting a pizza into more slices: more pieces, each smaller, same pizza. Buybacks are the company using cash to buy its own shares, so each remaining share owns a bit more.</p>`,
core:`<p><strong>What problem is this solving?</strong> Measuring what shareholders actually earn and understanding the different ways companies return value.</p>
<ul><li><strong>Distributions:</strong> regular cash dividends; special (one-time) dividends; stock dividends and splits (more shares, lower price per share, unchanged total value and ownership %); reverse splits (fewer shares, higher price); share repurchases (alternative to dividends; reduce shares outstanding; flexible, tax-efficient in some jurisdictions).</li>
<li><strong>Chronology:</strong> declaration date (board approves) → ex-dividend date (first day trading without the dividend; price drops by about the dividend; 1–2 business days before record date) → record date (owners identified) → payment date.</li>
<li><strong>Returns:</strong> price return uses price change only; total return adds dividends; with dividend reinvestment, dividends buy more shares on the payment date.</li></ul>`,
formal:`<h4>Distributions</h4>
<table><tr><th>Type</th><th>Shares</th><th>Price per share</th><th>Total value</th></tr>
<tr><td>Cash dividend</td><td>Same</td><td>Drops by dividend on ex-date</td><td>Shareholders receive cash; firm's equity ↓</td></tr>
<tr><td>Stock dividend / split</td><td>↑</td><td>↓ proportionally</td><td>Unchanged</td></tr>
<tr><td>Reverse split</td><td>↓</td><td>↑ proportionally</td><td>Unchanged</td></tr>
<tr><td>Repurchase</td><td>↓ (outstanding)</td><td>Unchanged in theory if bought at fair value</td><td>Cash to sellers; EPS may rise</td></tr></table>
<p>Repurchase methods: open market, fixed-price tender offer, Dutch auction, direct negotiation. Motives: signal undervaluation, offset dilution from options, adjust capital structure, flexibility vs dividends.</p>
<h4>Chronology</h4>
<p>Declaration → ex-dividend → record → payment. Buy before the ex-date to receive the dividend.</p>
<h4>Return measures</h4>
<ul><li>Price return = (P<sub>1</sub> − P<sub>0</sub>)/P<sub>0</sub>.</li>
<li>Total return = (P<sub>1</sub> − P<sub>0</sub> + D)/P<sub>0</sub>.</li>
<li>HPR with dividend reinvestment = [P<sub>1</sub>(1 + D/P<sub>PD</sub>) − P<sub>0</sub>]/P<sub>0</sub>, where P<sub>PD</sub> = price on payment date.</li></ul>`,
math:`<div class="f"><span class="lbl">Price return</span>(P₁ − P₀)/P₀</div>
<div class="f"><span class="lbl">Total return</span>(P₁ − P₀ + D)/P₀</div>
<div class="f"><span class="lbl">With reinvestment</span>[P₁ × (1 + D/P<sub>PD</sub>) − P₀]/P₀</div>
<p><strong>Why it works:</strong> reinvesting D at P<sub>PD</sub> buys D/P<sub>PD</sub> extra shares, each worth P₁ at the end.</p>
<div class="f"><span class="lbl">Split</span>New price = old price / split ratio · New shares = old shares × split ratio</div>
<div class="calc" data-calc="ret"></div>`,
example:`<div class="q">An investor buys a stock at $50. It pays a $2 dividend when the price is $52 and ends the year at $54. (a) Price return. (b) Total return. (c) Total return with dividend reinvestment. (d) The company then does a 2-for-1 split when the price is $80; the investor owns 100 shares. New position?</div>
<ol class="steps"><li><strong>Price return</strong> = (54 − 50)/50 = <strong>8.0%</strong>.</li>
<li><strong>Total return</strong> = (54 − 50 + 2)/50 = <strong>12.0%</strong>.</li>
<li><strong>Reinvested:</strong> 2/52 = 0.03846 extra shares → 1.03846 × 54 = 56.077 → (56.077 − 50)/50 = <strong>12.15%</strong>.</li>
<li><strong>Split:</strong> 200 shares at <strong>$40</strong> = $8,000 (unchanged value and ownership %).</li></ol>
<p class="ans">Answers: 8.0% · 12.0% · 12.15% · 200 shares × $40</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Buying on the record date gets the dividend. <b>Fix:</b> must buy before the ex-dividend date.</li>
<li><b>Trap:</b> Stock splits create value. <b>Fix:</b> total value and ownership unchanged.</li>
<li><b>Trap:</b> Using the ending price to reinvest dividends. <b>Fix:</b> reinvest at the payment-date price.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute price/total return; reinvested return; effect of splits/stock dividends/reverse splits; order of dividend dates; why repurchase.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Declare · Ex · Record · Pay</b>Dividend timeline.</div>
<div class="anchor"><b>Same pizza, more slices</b>Stock splits and dividends.</div>
<div class="anchor"><b>Price + dividends = total</b>Return measure.</div></div>`,
summary:`Regular cash dividends are paid at set intervals; special dividends are one-time payments. Stock dividends and splits increase the number of shares and lower price per share, leaving total value and ownership proportions unchanged; reverse splits do the opposite. Share repurchases are an alternative way to distribute cash. The dividend chronology is declaration date (board approval), ex-dividend date (first day without the dividend, one or two business days before the record date, when the price drops by about the dividend), record date (owners identified) and payment date. Price return reflects only price change; total return includes dividends; holding period return with dividend reinvestment = [P₁(1 + D/P<sub>PD</sub>) − P₀]/P₀.`
},
quiz:[
{q:"An investor must purchase shares before which date to receive a declared dividend?",o:["Record date","Ex-dividend date","Payment date"],a:1,e:"From the ex-date, shares trade without the dividend."},
{q:"A stock bought at $40 pays a $1 dividend and ends at $42. Total return is:",o:["5.0%","7.5%","2.5%"],a:1,e:"(42 − 40 + 1)/40 = 7.5%."},
{q:"After a 1-for-4 reverse split, a $3 stock should trade at approximately:",o:["$0.75","$3","$12"],a:2,e:"Four shares become one: $3 × 4 = $12."}]
});

add({n:43,topic:"eq",title:"Introduction to Equity Valuation",
los:["43.a Contrast intrinsic value with perceived value and describe approaches to estimating perceived value.","43.b Calculate and interpret book value, market capitalization, and enterprise value.","43.c Compare absolute and relative valuation models."],
s:{
eli5:`<p>A house's "true" value depends on what it can earn or provide over time; its price is whatever buyers pay today. A stock's <strong>intrinsic value</strong> is what it's really worth given everything about the business; the <strong>market price</strong> reflects what investors think it's worth. If you believe the price is below the true value, buy.</p>
<p>Three ways to size a company: what the accounts say it's worth (book value), what the stock market says the shares are worth (market cap), and what it would cost to buy the whole business including its debts, minus its cash (enterprise value).</p>`,
core:`<p><strong>What problem is this solving?</strong> Deciding whether a stock is under- or overvalued by estimating value and comparing it with price.</p>
<ul><li><strong>Intrinsic value:</strong> rational value given full knowledge of the company. <strong>Perceived value:</strong> varies with investors' assumptions, from naive/story-based (narratives) to relative valuation (multiples) to absolute valuation (DCF).</li>
<li><strong>Book value</strong> = assets − liabilities − minority interest; BVPS = BV/shares. Accounting-based, historical.</li>
<li><strong>Market capitalization</strong> = price × shares. Market cap &gt; book value → market expects value creation; &lt; → value shortfall.</li>
<li><strong>Enterprise value</strong> = market value of common + preferred + debt (+ minority interest) − cash and short-term investments: the value of the operating business to all capital providers. EV/EBITDA is a common capital-structure-neutral multiple.</li>
<li><strong>Absolute models</strong> (DDM, FCF, residual income, asset-based) estimate intrinsic value directly; <strong>relative models</strong> (P/E, P/B, EV/EBITDA) compare with peers.</li></ul>`,
formal:`<h4>Value vs price</h4>
<ul><li>Intrinsic value &gt; price → undervalued (buy); &lt; price → overvalued (sell). Account for confidence in the model and possible catalysts.</li>
<li>Perceived value approaches: naive or story-based; relative (multiples); absolute (PV models).</li></ul>
<h4>Book, market and enterprise value</h4>
<ul><li>Book value of equity = total assets − total liabilities − minority (noncontrolling) interest.</li>
<li>Market cap = share price × shares outstanding.</li>
<li>EV = market cap + market value of preferred + market value of debt + noncontrolling interest − cash and short-term investments.</li>
<li>P/B = market cap/book value; EV/EBITDA for firms with different leverage and D&amp;A intensity.</li></ul>
<h4>Models</h4>
<table><tr><th>Absolute</th><th>Relative</th></tr>
<tr><td>Present value: DDM, FCFE/FCFF, residual income</td><td>Price multiples: P/E, P/B, P/S, P/CF</td></tr>
<tr><td>Asset-based: fair value of assets − liabilities − preferred (good for resource firms, financials, liquidation)</td><td>EV multiples: EV/EBITDA, EV/sales</td></tr>
<tr><td>Independent of market pricing; sensitive to inputs</td><td>Simple, market-based; can propagate sector mispricing</td></tr></table>`,
math:`<div class="f"><span class="lbl">Enterprise value</span>EV = market cap + preferred + debt + NCI − cash &amp; ST investments</div>
<div class="f"><span class="lbl">Multiples</span>P/B = market cap / book equity · EV/EBITDA</div>
<p><strong>Why subtract cash?</strong> A buyer of the whole firm gets its cash, which effectively reduces the net purchase price.</p>
<div class="calc" data-calc="ev"></div>`,
example:`<div class="q">Share price $40; 100 shares outstanding; preferred stock $200; debt $1,500; cash $300; EBITDA $700; book value of equity $2,500. Calculate market cap, EV, EV/EBITDA and P/B. An analyst's DCF gives $45 per share: under- or overvalued?</div>
<ol class="steps"><li><strong>Market cap</strong> = 40 × 100 = <strong>$4,000</strong>.</li>
<li><strong>EV</strong> = 4,000 + 200 + 1,500 − 300 = <strong>$5,400</strong>.</li>
<li><strong>EV/EBITDA</strong> = 5,400/700 = <strong>7.71×</strong>.</li>
<li><strong>P/B</strong> = 4,000/2,500 = <strong>1.6×</strong> (market expects value creation).</li>
<li><strong>Intrinsic $45 &gt; price $40</strong> → <strong>undervalued</strong> (if the analyst is confident in the inputs).</li></ol>
<p class="ans">Answers: $4,000 · $5,400 · 7.71× · 1.6× · undervalued</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Adding cash in EV. <b>Fix:</b> subtract cash and short-term investments.</li>
<li><b>Trap:</b> Using book values of debt/equity in EV. <b>Fix:</b> market values (book debt often used as proxy).</li>
<li><b>Trap:</b> P/E for comparing firms with very different leverage. <b>Fix:</b> EV/EBITDA is capital-structure neutral.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute EV and multiples; classify models as absolute vs relative; intrinsic vs market price decision; when asset-based models fit.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Value vs price</b>Buy when value &gt; price.</div>
<div class="anchor"><b>EV = what you'd pay for the whole firm</b>Equity + debt + preferred − cash.</div>
<div class="anchor"><b>Absolute = own model; relative = peers</b>Model families.</div></div>`,
summary:`Intrinsic value is the rational value investors would assign with full knowledge of a company; perceived value varies with investors' assumptions and may come from naive/story-based, relative or absolute valuation. Book value of equity is assets minus liabilities and minority interest; book value per share divides by shares outstanding. Market capitalization is price × shares; when it exceeds (falls short of) book value, the firm is creating value (has a value shortfall). Enterprise value is the market value of common and preferred stock plus market value of debt, minus cash and short-term investments; EV/EBITDA is widely used in relative valuation. Absolute valuation models include present value models based on dividends, free cash flow or residual income, and asset-based models; relative valuation compares multiples such as P/E, P/B and EV/EBITDA with peers.`
},
quiz:[
{q:"Market cap $800m, debt $300m, preferred $50m, cash $100m. EV is:",o:["$1,050m","$1,150m","$1,250m"],a:0,e:"800 + 300 + 50 − 100 = 1,050."},
{q:"Which is an absolute valuation model?",o:["P/E relative to peers","Free cash flow to equity model","EV/EBITDA comparison"],a:1,e:"PV models are absolute."},
{q:"A firm's market cap is below its book value. This most likely indicates:",o:["the market expects a value shortfall","the firm is undervalued with certainty","the firm has negative debt"],a:0,e:"Market value < book suggests a value shortfall."}]
});

/* ===================== READING 44 ===================== */
add({n:44,topic:"eq",title:"Discounted Cash Flow (DCF) and Growth Models",
los:["44.a Evaluate whether a dividend discount, free cash flow, or residual income model is appropriate for valuing a company's equity, and describe the steps in DCF valuation.","44.b Calculate the intrinsic value of equity using constant-growth and multistage dividend discount and free cash flow models, and estimate the sustainable growth rate.","44.c Explain sources of uncertainty in DCF valuation.","44.d Calculate the value of preferred stock and explain how embedded options affect its value."],
s:{
eli5:`<p>A stock is worth all the cash it will ever give you, adjusted for the fact that money later is worth less than money now. If dividends grow steadily forever, there's a neat shortcut: next year's dividend divided by (your required return minus growth).</p>
<p>If the company grows fast for a few years and then settles down, value the fast years one by one, then use the shortcut for "forever after," and bring everything back to today.</p>`,
core:`<p><strong>What problem is this solving?</strong> Estimating intrinsic value from the cash flows a share is expected to generate.</p>
<ul><li><strong>Choosing the model:</strong> DDM for stable, dividend-paying firms (minority perspective); FCFE for non-payers with stable capital structure (control perspective); FCFF when FCFE is negative or capital structure is changing; residual income when FCF is negative but accounting is clean-surplus.</li>
<li><strong>Five steps:</strong> choose the cash flow, forecast it, choose the matching discount rate (equity flows → r<sub>e</sub>; FCFF → WACC), compute a terminal value, discount.</li>
<li><strong>Gordon growth:</strong> V₀ = D₁/(r − g), requires r &gt; g and constant growth.</li>
<li><strong>Sustainable growth</strong> g = retention ratio × ROE = (1 − payout) × ROE.</li>
<li><strong>Uncertainty:</strong> value is very sensitive to r, g and terminal value: garbage in, garbage out.</li>
<li><strong>Preferred:</strong> perpetual V = D/r; callable worth less; putable/convertible worth more.</li></ul>`,
formal:`<h4>Model selection</h4>
<table><tr><th>Model</th><th>Best when</th><th>Discount at</th></tr>
<tr><td>DDM</td><td>Positive, stable earnings; high, consistent payout; minority perspective</td><td>r<sub>e</sub></td></tr>
<tr><td>FCFE</td><td>No/low dividends; stable capital structure; control perspective</td><td>r<sub>e</sub></td></tr>
<tr><td>FCFF</td><td>Negative FCFE or changing leverage</td><td>WACC (then subtract debt)</td></tr>
<tr><td>Residual income</td><td>Negative FCF; clean-surplus book values</td><td>r<sub>e</sub></td></tr></table>
<h4>Constant growth</h4>
<p>V₀ = D₁/(r − g) = D₀(1 + g)/(r − g). Firm value = FCFF₁/(WACC − g); equity = firm value − debt. Equity value = FCFE₁/(r<sub>e</sub> − g).</p>
<h4>Multistage</h4>
<p>V₀ = Σ D<sub>t</sub>/(1 + r)<sup>t</sup> + [D<sub>n+1</sub>/(r − g<sub>L</sub>)]/(1 + r)<sup>n</sup>. Terminal value can also use a multiple.</p>
<h4>Growth rate estimates</h4>
<p>Historical averages, analyst forecasts, or fundamentals: g = b × ROE.</p>
<h4>Preferred stock</h4>
<p>V = D<sub>p</sub>/r<sub>p</sub> (perpetual). Callable: issuer will call if rates fall → lower value. Putable/convertible: investor option → higher value.</p>
<h4>Uncertainty</h4>
<p>Estimation error in the cash flow metric, its amount and growth, horizon, discount rate and terminal value; use scenarios and sensitivity tables.</p>`,
math:`<div class="f"><span class="lbl">Gordon growth</span>V₀ = D₁ / (r − g)</div>
<div class="f"><span class="lbl">Sustainable growth</span>g = (1 − payout) × ROE</div>
<div class="f"><span class="lbl">Two-stage</span>V₀ = Σ<sub>t=1..n</sub> D<sub>t</sub>/(1+r)<sup>t</sup> + [D<sub>n+1</sub>/(r − g<sub>L</sub>)]/(1+r)<sup>n</sup></div>
<div class="f"><span class="lbl">FCF models</span>Equity = FCFF₁/(WACC − g) − debt &nbsp;·&nbsp; Equity = FCFE₁/(r<sub>e</sub> − g)</div>
<div class="f"><span class="lbl">Preferred</span>V = D / r</div>
<p><strong>Why r − g?</strong> A growing perpetuity's PV: each year's cash flow grows by g but is discounted by r, so the effective discount is the gap.</p>
<div class="dir"><div>r <span class="up">↑</span> or g <span class="dn">↓</span> → value <span class="dn">↓</span> (very sensitive when r − g is small)</div></div>
<div class="calc" data-calc="ddm"></div>
<div class="calc" data-calc="fcfv"></div>`,
example:`<div class="q">(a) D₀ = $2.00; growth 12% for 3 years, then 4% forever; r = 10%. Value the stock. Compare with constant 4% growth. (b) FCFF next year $120, WACC 9%, g 3%, debt $500, 100 shares: equity value per share. (c) FCFE next year $90, r<sub>e</sub> 11%, g 4%: equity value. (d) Perpetual preferred paying $5, r = 8%. (e) Payout 40%, ROE 12.5%: sustainable g.</div>
<ol class="steps"><li><strong>Dividends:</strong> D₁ 2.24; D₂ 2.5088; D₃ 2.8099; D₄ = 2.8099 × 1.04 = 2.9223.</li>
<li><strong>TV₃</strong> = 2.9223/(0.10 − 0.04) = 48.705.</li>
<li><strong>PV</strong> = 2.24/1.1 + 2.5088/1.21 + (2.8099 + 48.705)/1.331 = 2.036 + 2.073 + 38.704 = <strong>$42.81</strong>. Constant 4%: 2.08/0.06 = <strong>$34.67</strong>.</li>
<li><strong>FCFF:</strong> firm = 120/0.06 = 2,000; equity = 2,000 − 500 = 1,500 → <strong>$15.00/share</strong>.</li>
<li><strong>FCFE:</strong> 90/0.07 = <strong>$1,285.71</strong>.</li>
<li><strong>Preferred</strong> = 5/0.08 = <strong>$62.50</strong>.</li>
<li><strong>g</strong> = 0.6 × 12.5% = <strong>7.5%</strong>.</li></ol>
<p class="ans">Answers: $42.81 (vs $34.67) · $15.00 · $1,285.71 · $62.50 · 7.5%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using D₀ in Gordon. <b>Fix:</b> use D₁ = D₀(1 + g).</li>
<li><b>Trap:</b> Discounting the terminal value n+1 periods. <b>Fix:</b> TV at time n is discounted n periods.</li>
<li><b>Trap:</b> Discounting FCFF at r<sub>e</sub>. <b>Fix:</b> WACC, then subtract debt.</li>
<li><b>Trap:</b> Forgetting to add D<sub>n</sub> in the final year. <b>Fix:</b> year n cash flow = D<sub>n</sub> + TV<sub>n</sub>.</li>
<li><b>Trap:</b> Using Gordon when g ≥ r. <b>Fix:</b> model invalid; use multistage.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> choose a model; Gordon and two-stage valuations; FCFF vs FCFE; sustainable g; preferred values and option effects; sources of uncertainty.</li>
<li><strong>Calculator:</strong> use CF worksheet: CF1 = D₁, CF2 = D₂, CF3 = D₃ + TV₃, I = r, NPV.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Next dividend ÷ (r − g)</b>Gordon growth.</div>
<div class="anchor"><b>Equity flows → r<sub>e</sub>; firm flows → WACC</b>Match cash flows to rates.</div>
<div class="anchor"><b>g = b × ROE</b>Retained earnings fund growth.</div>
<div class="anchor"><b>Option holder wins</b>Callable ↓, putable/convertible ↑.</div></div>`,
summary:`Dividend discount models suit firms with positive, stable earnings that pay out a consistent, high proportion of earnings (a minority perspective); FCFE models suit non-dividend payers with stable capital structures, and FCFF models are used when FCFE is negative or leverage is changing (control perspective); residual income models work when free cash flow is negative, given clean-surplus accounting. DCF valuation steps: choose the cash flow, forecast it, choose the matching required return, compute a terminal value and discount everything to the present. With constant growth, V₀ = D₁/(r − g); the sustainable growth rate is (1 − payout) × ROE. Multistage models forecast cash flows explicitly and then apply constant growth. Dividends, FCFE and residual income are discounted at the cost of equity; FCFF at WACC. DCF values are only as good as their inputs. Perpetual preferred stock is valued as D/r; callable preferred is worth less, and putable or convertible preferred worth more, than option-free preferred.`
},
quiz:[
{q:"D₀ = $1.50, g = 5%, r = 9%. Value is closest to:",o:["$37.50","$39.38","$31.50"],a:1,e:"1.575/0.04 = 39.375."},
{q:"A firm with negative FCFE and a changing capital structure is best valued with:",o:["a DDM","an FCFF model","an FCFE model"],a:1,e:"FCFF suits negative FCFE or changing leverage."},
{q:"A firm pays out 30% of earnings and has ROE of 15%. Sustainable growth is:",o:["4.5%","10.5%","15.0%"],a:1,e:"0.7 × 15% = 10.5%."}]
});

/* ===================== READING 45 ===================== */
add({n:45,topic:"eq",title:"Relative Value Equity Valuation Approaches",
los:["45.a Describe the method of comparables and the method of forecasted fundamentals, and calculate and interpret the PEG ratio.","45.b Calculate and interpret justified multiples (P/E, P/B, P/S, dividend yield, EV-based) and PVGO, and explain normalized earnings.","45.c Describe approaches to identifying peer groups and their limitations.","45.d Describe concerns with comparables-based valuation and alternatives such as historical comparisons."],
s:{
eli5:`<p>To price a house, you look at what similar houses nearby sold for per square foot. Stocks work the same way: compare <strong>price per dollar of earnings</strong> (P/E), per dollar of book value (P/B), or per dollar of sales (P/S) with similar companies.</p>
<p>But "similar" is tricky: a faster-growing company deserves a higher P/E. So we can also work out what multiple a company <em>should</em> have from its growth, profitability and risk: its <strong>justified</strong> multiple.</p>`,
core:`<p><strong>What problem is this solving?</strong> Valuing a stock quickly and in line with the market by comparing prices relative to fundamentals.</p>
<ul><li><strong>Method of comparables:</strong> apply peers' average/median multiple to the subject's fundamental. Assumes peers are fairly priced (law of one price).</li>
<li><strong>Method of forecasted fundamentals:</strong> derive the justified multiple from a DCF (e.g., Gordon model divided by EPS).</li>
<li><strong>PEG</strong> = P/E ÷ growth (in %): adjusts P/E for growth; lower PEG looks cheaper.</li>
<li><strong>PVGO:</strong> P₀ = E₁/r + PVGO: price beyond the no-growth value reflects growth opportunities.</li>
<li><strong>Which multiple?</strong> P/E (profitable firms; use normalized earnings for cyclicals), P/B (financials, asset-heavy), P/S (cyclicals, negative earnings, start-ups), EV/EBITDA (different leverage, capital intensive), dividend yield (income focus).</li>
<li><strong>Peer groups:</strong> same industry or same factor exposures; problems with unique, multi-industry, different life-cycle or jurisdiction firms. Comparables fail if the whole peer group is mispriced.</li></ul>`,
formal:`<h4>Justified multiples (from Gordon growth)</h4>
<ul><li>Justified leading P/E = P₀/E₁ = payout/(r − g); trailing P/E = payout × (1 + g)/(r − g).</li>
<li>Justified P/B = (ROE − g)/(r − g).</li>
<li>Justified P/S = profit margin × payout × (1 + g)/(r − g) (trailing).</li>
<li>Justified dividend yield (D₀/P₀) = (r − g)/(1 + g).</li>
<li>Justified value-to-book (EV-based) = ROIC × (1 − reinvestment rate)/(WACC − g).</li></ul>
<h4>PVGO</h4>
<p>P₀ = E₁/r + PVGO; leading P/E = 1/r + PVGO/E₁: P/E rises with growth opportunities.</p>
<h4>Normalized and core earnings</h4>
<p>Core earnings exclude nonrecurring items. Normalized EPS for cyclicals: average EPS over the most recent cycle, or average ROE over the cycle × current BVPS (better: reflects size changes).</p>
<h4>Multiples choices</h4>
<table><tr><th>Multiple</th><th>Good for</th><th>Weakness</th></tr>
<tr><td>P/E</td><td>Stable profitable firms; widely used</td><td>Negative/volatile earnings; accounting choices</td></tr>
<tr><td>P/B</td><td>Banks, insurers, asset-heavy</td><td>Intangibles, differing accounting</td></tr>
<tr><td>P/S</td><td>Mature, cyclical, loss-making firms</td><td>Ignores costs and margins</td></tr>
<tr><td>EV/EBITDA</td><td>Different leverage, high D&amp;A</td><td>Ignores capex needs</td></tr></table>
<h4>Peer groups and concerns</h4>
<p>Industry-based (same principal activity) or statistical (factor exposure). Issues: unique firms, multi-industry firms, different life-cycle stages, tax/regulatory differences. Comparables can propagate mispricing; multiples rely on accounting data; alternatives include comparing with the subject's own history or historical peer averages.</p>`,
math:`<div class="f"><span class="lbl">Justified leading P/E</span>P₀/E₁ = (1 − b)/(r − g), g = b × ROE</div>
<div class="f"><span class="lbl">Justified P/B</span>(ROE − g)/(r − g)</div>
<div class="f"><span class="lbl">Justified P/S</span>PM × payout × (1 + g)/(r − g)</div>
<div class="f"><span class="lbl">PVGO and PEG</span>PVGO = P₀ − E₁/r · PEG = (P/E)/g(%)</div>
<p><strong>Why it works:</strong> each justified multiple is just Gordon value divided by the fundamental: P₀ = D₁/(r − g), so P₀/E₁ = (D₁/E₁)/(r − g).</p>
<div class="dir"><div>ROE &gt; r → P/B &gt; 1 (value creation)</div><div>Higher g or payout (holding ROE) → P/E <span class="up">↑</span>; higher r → all multiples <span class="dn">↓</span></div></div>
<div class="calc" data-calc="mult"></div>`,
example:`<div class="q">Payout 40%, ROE 12.5%, r = 10%. Next-year EPS $5; BVPS $30; net margin 8%; current price $80. (a) g, justified leading P/E and implied price. (b) Justified P/B and implied price. (c) Justified (trailing) P/S. (d) PVGO. (e) PEG.</div>
<ol class="steps"><li><strong>g</strong> = 0.60 × 12.5% = <strong>7.5%</strong>.</li>
<li><strong>P/E</strong> = 0.40/(0.10 − 0.075) = <strong>16.0×</strong> → 16 × 5 = <strong>$80</strong>.</li>
<li><strong>P/B</strong> = (12.5 − 7.5)/(10 − 7.5) = <strong>2.0×</strong> → 2 × 30 = <strong>$60</strong>.</li>
<li><strong>P/S</strong> = 0.08 × 0.40 × 1.075/0.025 = <strong>1.376×</strong>.</li>
<li><strong>PVGO</strong> = 80 − 5/0.10 = <strong>$30</strong> (37.5% of price from growth).</li>
<li><strong>PEG</strong> = 16/7.5 = <strong>2.13</strong>.</li></ol>
<p class="ans">Answers: 7.5%, 16×, $80 · 2.0×, $60 · 1.376× · PVGO $30 · PEG 2.13</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using P/E for a loss-making firm. <b>Fix:</b> use P/S or EV/sales.</li>
<li><b>Trap:</b> Peer average multiple is always "right". <b>Fix:</b> whole sector can be mispriced.</li>
<li><b>Trap:</b> Leading vs trailing confusion. <b>Fix:</b> leading = payout/(r − g); trailing multiplies by (1 + g).</li>
<li><b>Trap:</b> Normalizing with average EPS when the firm has grown. <b>Fix:</b> average ROE × current BVPS adjusts for size.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> justified multiples; PVGO; PEG comparisons; best multiple for a firm type; normalized EPS methods; peer group issues.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Justified multiple = Gordon ÷ fundamental</b>One formula, many multiples.</div>
<div class="anchor"><b>Price = no-growth value + PVGO</b>Growth is extra.</div>
<div class="anchor"><b>Losses? Use sales</b>P/S for negative earnings.</div></div>`,
summary:`The method of comparables values a stock using the average or median multiple of peers; the method of forecasted fundamentals derives a justified multiple from a DCF model. The PEG ratio (P/E ÷ growth) controls for growth differences; regressions can control for several fundamentals. Price equals the no-growth value E₁/r plus the present value of growth opportunities. Core earnings exclude nonrecurring items; normalized EPS for cyclicals uses average EPS over the cycle or average ROE times current book value (adjusting for size changes). P/S suits mature, cyclical and loss-making firms; EV/EBITDA suits firms with different capital structures and capital-intensive industries. Justified multiples: P/E = payout/(r − g); P/B = (ROE − g)/(r − g); P/S = margin × payout × (1 + g)/(r − g); dividend yield = (r − g)/(1 + g); value-to-book = ROIC(1 − reinvestment rate)/(WACC − g). Peer groups may be industry-based or statistical; issues include unique, multi-industry, different-stage and different-jurisdiction firms. Comparables can fail when peers are mispriced and depend on accounting data; analysts also compare with historical values.`
},
quiz:[
{q:"Payout 50%, r = 11%, g = 6%. Justified leading P/E is:",o:["9.1×","10.0×","10.6×"],a:1,e:"0.5/0.05 = 10."},
{q:"Which multiple is most appropriate for a company with negative earnings?",o:["P/E","P/S","Dividend yield"],a:1,e:"Sales remain positive."},
{q:"Price $60, E₁ = $4, r = 10%. PVGO is:",o:["$20","$40","$56"],a:0,e:"60 − 4/0.10 = 20."}]
});
