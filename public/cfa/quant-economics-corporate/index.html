add({n:5,topic:"quant",title:"Statistical Characteristics of Asset Returns",
los:["5.a Calculate, interpret, and evaluate various measures of (1) central tendency and location and (2) dispersion.","5.b Describe, interpret, and evaluate measures of skewness and kurtosis.","5.c Calculate, interpret, and evaluate covariance and correlation.","5.d Calculate, interpret, and evaluate semi-deviation and coefficient of variation."],
s:{
eli5:`<p>Suppose you track how a fund did over five years. You want to describe it in a few words to a friend. You'd say: "On a <strong>typical</strong> year it made about 9%" (that's <em>central tendency</em>), "but it bounced around a lot, sometimes −4%, sometimes +20%" (that's <em>dispersion</em>).</p>
<p>Then you might add: "The bad surprises were bigger than the good ones" (that's <em>skew</em>) and "every so often something crazy happens" (that's <em>kurtosis</em>, fat tails).</p>
<p>And if you own two funds, you'd want to know: "When one zigs, does the other zig too?" That's <em>correlation</em>. Funds that don't zig together smooth out your ride.</p>`,
core:`<p><strong>What problem is this solving?</strong> A list of 60 monthly returns is unreadable. Statistics compress it into a handful of numbers that answer the investor's real questions: <em>What do I typically get? How wrong could I be? Are the surprises lopsided? Are extreme events more common than I think? Does this move with my other holdings?</em></p>
<ul><li><strong>Center:</strong> mean (uses every value, sensitive to outliers), median (middle value, robust), mode (most frequent). Trimmed and winsorized means tame outliers.</li>
<li><strong>Spread = risk.</strong> Range is crude; mean absolute deviation is intuitive; variance squares deviations (punishing big misses more) and standard deviation brings it back to percent units.</li>
<li><strong>Downside focus.</strong> Investors don't mind upside surprises. Semideviation and target downside deviation count only the bad side.</li>
<li><strong>Risk per unit of return:</strong> coefficient of variation lets you compare a 5%-return fund with a 12%-return fund on a level field.</li>
<li><strong>Shape:</strong> most asset returns are <em>negatively skewed with fat tails</em>: frequent small gains, occasional large crashes. A normal distribution underestimates that crash risk.</li>
<li><strong>Co-movement:</strong> covariance tells direction; correlation rescales it to −1…+1 so you can compare. Correlation ≠ causation, and it only sees <em>linear</em> relationships.</li></ul>`,
formal:`<h4>Central tendency and location</h4>
<ul><li>Arithmetic mean; median (middle observation, or average of two middle ones); mode (and modal interval for continuous data).</li>
<li><strong>Trimmed mean</strong> drops a % of the lowest and highest values; <strong>winsorized mean</strong> replaces them with the nearest retained value.</li>
<li><strong>Quantiles:</strong> quartiles, quintiles, deciles, percentiles. Location of the y-th percentile: L<sub>y</sub> = (n + 1)(y/100). Interquartile range (IQR) = Q3 − Q1 (the middle 50%).</li></ul>
<h4>Dispersion</h4>
<ul><li>Range = max − min; MAD = Σ|xᵢ − x̄|/n.</li>
<li>Sample variance s² = Σ(xᵢ − x̄)²/(n − 1); sample standard deviation s = √s². (Dividing by n − 1 corrects the bias from estimating the mean from the same data.)</li>
<li>Target downside deviation (semideviation if target = mean) = √[Σ over xᵢ &lt; B of (xᵢ − B)² / (n − 1)].</li>
<li>Coefficient of variation CV = s / x̄ (lower = less risk per unit of return).</li></ul>
<h4>Shape</h4>
<ul><li><strong>Skewness:</strong> positive (right) → mean &gt; median &gt; mode; long right tail. Negative (left) → mean &lt; median &lt; mode; long left tail.</li>
<li><strong>Kurtosis:</strong> normal = 3. Excess kurtosis = kurtosis − 3. Positive excess (leptokurtic) → fatter tails, more extreme outcomes; negative (platykurtic) → thinner tails.</li></ul>
<h4>Covariance and correlation</h4>
<ul><li>Sample covariance = Σ(Xᵢ − X̄)(Yᵢ − Ȳ)/(n − 1).</li>
<li>Correlation ρ = Cov(X,Y)/(s<sub>X</sub>s<sub>Y</sub>), between −1 and +1, unit-free.</li>
<li>Limitations: sensitive to outliers; misses nonlinear relationships (use scatter plots); spurious correlation from chance or a third variable; correlation does not imply causation.</li></ul>`,
math:`<div class="f"><span class="lbl">Sample variance and standard deviation</span>s² = Σ(xᵢ − x̄)² / (n − 1) &nbsp;&nbsp;·&nbsp;&nbsp; s = √s²</div>
<p><strong>Why square?</strong> Deviations above and below the mean would cancel to zero; squaring makes them all positive and penalizes big misses more. <strong>Why n − 1?</strong> The sample mean is fitted to the same data, so deviations are a bit too small; dividing by n − 1 corrects that (degrees of freedom).</p>
<div class="f"><span class="lbl">Target downside deviation</span>s<sub>target</sub> = √[ Σ<sub>xᵢ &lt; B</sub> (xᵢ − B)² / (n − 1) ]</div>
<p>Only observations below the target B enter the numerator, but the denominator still uses the full sample n − 1.</p>
<div class="f"><span class="lbl">Coefficient of variation</span>CV = s / x̄ &nbsp;(risk per unit of mean return)</div>
<div class="f"><span class="lbl">Covariance and correlation</span>Cov(X,Y) = Σ(Xᵢ − X̄)(Yᵢ − Ȳ)/(n − 1) &nbsp;&nbsp;·&nbsp;&nbsp; ρ = Cov(X,Y) / (s<sub>X</sub>·s<sub>Y</sub>)</div>
<p><strong>Why it works:</strong> when X is above its mean at the same times Y is above its mean, the products are positive and covariance is positive. Dividing by both standard deviations removes the units, giving a pure "strength of linear co-movement" score.</p>
<div class="dir"><div>One large outlier → mean moves, median barely moves</div><div>Positive skew: mean &gt; median &gt; mode (alphabetical order reversed: <em>Mean → Median → Mode</em> follows the tail)</div><div>Excess kurtosis <span class="up">↑</span> → more crashes and spikes than normal predicts</div></div>
<div class="calc" data-calc="means"></div>`,
example:`<div class="q">Annual returns: 12%, −4%, 8%, 20%, 9%. Find (a) mean and median, (b) range and MAD, (c) sample variance and standard deviation, (d) target downside deviation with target 8%, (e) CV. (f) Two assets have covariance 0.0018 and standard deviations 6% and 5%; find the correlation.</div>
<ol class="steps"><li><strong>Mean</strong> = 45/5 = <strong>9%</strong>. Sorted: −4, 8, 9, 12, 20 → <strong>median 9%</strong>.</li>
<li><strong>Range</strong> = 20 − (−4) = <strong>24%</strong>. Deviations from 9: +3, −13, −1, +11, 0 → <strong>MAD</strong> = 28/5 = <strong>5.6%</strong>.</li>
<li><strong>Variance:</strong> squares 9 + 169 + 1 + 121 + 0 = 300 → s² = 300/4 = <strong>75 (%²)</strong>; s = √75 = <strong>8.66%</strong>.</li>
<li><strong>Downside:</strong> only −4 is below 8: (−4 − 8)² = 144 → 144/4 = 36 → <strong>6.0%</strong>.</li>
<li><strong>CV</strong> = 8.66/9 = <strong>0.96</strong>.</li>
<li><strong>Correlation</strong> = 0.0018/(0.06 × 0.05) = 0.0018/0.003 = <strong>0.60</strong>.</li></ol>
<p class="ans">Answers: 9%/9% · 24%/5.6% · 75/8.66% · 6.0% · 0.96 · 0.60</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Dividing by n for a <em>sample</em> variance. <b>Fix:</b> use n − 1 unless told it's the whole population.</li>
<li><b>Trap:</b> Dividing downside deviation by the number of below-target observations. <b>Fix:</b> denominator is n − 1 of the full sample.</li>
<li><b>Trap:</b> Mixing up skew orderings. <b>Fix:</b> the mean is dragged toward the tail. Long right tail → mean is largest.</li>
<li><b>Trap:</b> Saying "kurtosis of 3 means fat tails". <b>Fix:</b> 3 is normal; <em>excess</em> kurtosis &gt; 0 means fat tails.</li>
<li><b>Trap:</b> Reading correlation of 0 as "no relationship". <b>Fix:</b> zero <em>linear</em> relationship; a curved relationship can still exist.</li>
<li><b>Trap:</b> Preferring the higher-CV investment. <b>Fix:</b> lower CV = less risk per unit of return.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute mean/median/variance from 4–6 numbers; identify skew from mean vs median; interpret excess kurtosis; compute correlation from covariance; pick the lower-CV fund; which mean is robust to outliers.</li>
<li><strong>Calculator:</strong> BA II Plus [2nd][DATA] enter values, then [2nd][STAT] 1-V gives x̄, s<sub>x</sub> (sample) and σ<sub>x</sub> (population). Saves time and errors.</li>
<li><strong>Pattern:</strong> "Fat tails / extreme events more likely than normal" → positive excess kurtosis (leptokurtic).</li>
<li><strong>Pattern:</strong> "Investor concerned only with losses below a threshold" → target downside deviation.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>The tail wags the mean</b>Skew pulls the mean toward the long tail; the median stays put.</div>
<div class="anchor"><b>"3 is normal"</b>Kurtosis 3 = normal; subtract 3 for excess; positive = fat tails = crash risk.</div>
<div class="anchor"><b>Square to stop cancelling</b>Variance squares deviations; standard deviation un-squares the units.</div>
<div class="anchor"><b>CV = risk price tag</b>How much risk you buy per 1% of return.</div>
<div class="anchor"><b>Correlation is a −1 to +1 thermometer</b>It measures linear co-movement only, never cause.</div></div>`,
summary:`Central tendency (mean, median, mode, trimmed/winsorized means) describes the typical outcome; location measures (quartiles, percentiles, IQR) describe where values fall. Dispersion measures risk: range, MAD, sample variance s² = Σ(x − x̄)²/(n − 1) and standard deviation; downside measures (semideviation, target downside deviation) count only bad outcomes, and the coefficient of variation s/x̄ gives risk per unit of return. Skewness describes asymmetry (positive: mean &gt; median &gt; mode) and kurtosis describes tail thickness (normal = 3; positive excess = fat tails). Covariance shows the direction of co-movement and correlation (Cov/(s<sub>X</sub>s<sub>Y</sub>)) standardizes it to −1…+1, but it captures only linear association, is sensitive to outliers, can be spurious, and never proves causation.`
},
quiz:[
{q:"A return distribution has a mean of 5%, a median of 7% and a mode of 8%. It is most likely:",o:["positively skewed","negatively skewed","symmetric"],a:1,e:"Mean < median < mode → the mean is pulled left by a long left tail → negative skew."},
{q:"A distribution with excess kurtosis of +2 has, relative to a normal distribution:",o:["thinner tails","fatter tails","the same tails but a higher mean"],a:1,e:"Positive excess kurtosis (leptokurtic) = more probability in the tails, so extreme outcomes are more likely."},
{q:"Fund X: mean 8%, s 12%. Fund Y: mean 5%, s 6%. Using the coefficient of variation, which has less risk per unit of return?",o:["Fund X","Fund Y","They are equal"],a:1,e:"CV X = 12/8 = 1.5; CV Y = 6/5 = 1.2. Lower CV = Y."}]
});

/* ===================== READING 6 ===================== */
add({n:6,topic:"quant",title:"Statistical Distributions for Financial Asset Prices and Returns",
los:["6.a Calculate, interpret, and evaluate unconditional expected values for mean, variance, and covariance.","6.b Calculate, interpret, and evaluate the principal moments of key statistical distributions used in finance.","6.c Calculate, interpret, and evaluate conditional expectations, variances, and covariances.","6.d Formulate investment problems through Bayesian updating."],
s:{
eli5:`<p>The weather forecaster says: 30% chance of a sunny boom, 50% chance of a normal day, 20% chance of a storm. If a lemonade stand earns $20, $10 or −$10 on those days, what should you <em>expect</em> to earn? Multiply each outcome by its chance and add: $9. That's an <strong>expected value</strong>.</p>
<p>A <strong>probability distribution</strong> is just the full list (or curve) of "what could happen and how likely". Some are lists you can count (heads/tails, number of defaults); others are smooth curves (tomorrow's exact stock return).</p>
<p>And <strong>Bayes</strong> is how a detective thinks: "I thought there was a 30% chance the butler did it. Then I found muddy boots, which are much more likely if he did. Now I think it's 63%." New evidence <em>updates</em> your beliefs.</p>`,
core:`<p><strong>What problem is this solving?</strong> Investing is about the future, which is uncertain. Distributions let us describe that uncertainty precisely so we can price it, measure risk, simulate it, and update it as news arrives.</p>
<ul><li><strong>Expected value</strong> is the probability-weighted center; <strong>variance</strong> is the probability-weighted squared surprise. Same idea as Reading 5 but using forecast probabilities instead of historical frequencies.</li>
<li><strong>Different distributions fit different jobs:</strong> binomial for up/down moves (option trees), Poisson for counting rare events (defaults per year), uniform for random-number generation in simulations, normal for returns over short horizons and for hypothesis tests, lognormal for <em>prices</em> (they can't go below zero), and logistic for binary yes/no outcomes in ML/regression.</li>
<li><strong>Conditional thinking:</strong> "What's the expected return <em>given</em> a recession?" Probability trees and the total probability rule stitch scenario-by-scenario expectations into one unconditional number.</li>
<li><strong>Bayes</strong> formalizes learning: posterior ∝ likelihood × prior. Strong evidence (much more likely under one hypothesis than the other) moves beliefs a lot; weak evidence moves them little.</li></ul>
<div class="call key"><strong>Why lognormal for prices?</strong> If continuously compounded returns are normal, then price = P₀·e<sup>r</sup> is lognormal: never negative and right-skewed. That's exactly how stock prices behave.</div>`,
formal:`<h4>Random variables and distributions</h4>
<ul><li><strong>Discrete</strong> (countable outcomes; probability function p(x)) vs <strong>continuous</strong> (infinite outcomes in a range; probability density function, where P(X = exact value) = 0 and probabilities are areas).</li>
<li><strong>Cumulative distribution function</strong> F(x) = P(X ≤ x).</li></ul>
<h4>Unconditional moments</h4>
<p>E(X) = Σ P(xᵢ)xᵢ; Var(X) = Σ P(xᵢ)[xᵢ − E(X)]²; Cov(X,Y) = Σ P(xᵢ,yⱼ)[xᵢ − E(X)][yⱼ − E(Y)]. Four principal moments: mean, variance, skewness, kurtosis.</p>
<h4>Key distributions</h4>
<table><tr><th>Distribution</th><th>Type</th><th>Use / parameters</th></tr>
<tr><td>Discrete uniform</td><td>Discrete</td><td>All k outcomes equally likely, p = 1/k</td></tr>
<tr><td>Binomial</td><td>Discrete</td><td>n Bernoulli trials, p; mean np, variance np(1−p); binomial trees for asset prices</td></tr>
<tr><td>Poisson</td><td>Discrete</td><td>Count of events in an interval; mean = variance = λ</td></tr>
<tr><td>Continuous uniform</td><td>Continuous</td><td>Between a and b; generates random draws for Monte Carlo</td></tr>
<tr><td>Normal</td><td>Continuous</td><td>Fully described by μ and σ; symmetric; skew 0, kurtosis 3; inference and testing</td></tr>
<tr><td>Lognormal</td><td>Continuous</td><td>Bounded below by 0, right-skewed; models asset prices</td></tr>
<tr><td>Logistic</td><td>Continuous</td><td>Like normal but fatter tails; binary-outcome regressions, ML/AI</td></tr></table>
<p>Normal confidence intervals: ≈68% within ±1σ, 90% within ±1.645σ, 95% within ±1.96σ, 99% within ±2.58σ. Standardize with z = (x − μ)/σ.</p>
<h4>Conditional expectations and Bayes</h4>
<ul><li>Total probability rule: E(X) = Σ E(X | Sᵢ)·P(Sᵢ). Probability trees display multi-period scenarios.</li>
<li>Conditional variance uses the conditional mean and conditional probabilities.</li>
<li>Bayes: P(A|B) = P(B|A)·P(A)/P(B), with P(B) = P(B|A)P(A) + P(B|A<sup>c</sup>)P(A<sup>c</sup>).</li></ul>`,
math:`<div class="f"><span class="lbl">Expected value and variance</span>E(X) = Σ P(xᵢ)·xᵢ &nbsp;&nbsp;·&nbsp;&nbsp; σ² = Σ P(xᵢ)·[xᵢ − E(X)]²</div>
<p><strong>Why:</strong> it's an average where likely outcomes count more. Variance is the same average applied to squared surprises.</p>
<div class="f"><span class="lbl">Binomial</span>P(X = x) = C(n,x)·pˣ·(1 − p)<sup>n−x</sup> &nbsp;·&nbsp; C(n,x) = n! / [x!(n−x)!] &nbsp;·&nbsp; mean np, variance np(1−p)</div>
<div class="vars"><div><code>C(n,x)</code><span>Number of different orderings that give exactly x successes</span></div><div><code>pˣ(1−p)<sup>n−x</sup></code><span>Probability of any <em>one</em> such ordering</span></div></div>
<div class="f"><span class="lbl">Standardizing a normal variable</span>z = (x − μ) / σ</div>
<div class="f"><span class="lbl">Bayes' formula</span>P(Event | Info) = P(Info | Event) × P(Event) / P(Info)</div>
<p><strong>Why it works:</strong> P(Info) is the total chance of seeing the info under all possibilities. The posterior is "the share of that total chance that comes from the Event being true".</p>
<div class="dir"><div>Evidence much more likely if Event true → posterior <span class="up">↑</span> sharply</div><div>Evidence equally likely either way → posterior = prior (no learning)</div><div>Prior near 0 or 1 → hard to move</div></div>
<div class="calc" data-calc="bayes"></div>
<div class="calc" data-calc="binom"></div>`,
example:`<div class="q">(a) Scenarios: boom 30% (return 20%), normal 50% (10%), recession 20% (−10%). Find the expected return and standard deviation. (b) An analyst's prior that a firm will beat earnings is 30%. The CEO raised guidance; firms that later beat raise guidance 80% of the time, others 20%. Update the probability. (c) A bond portfolio has 5 independent issuers, each with 40% chance of upgrade. P(exactly 2 upgrades)?</div>
<ol class="steps"><li><strong>E(R)</strong> = 0.3(20) + 0.5(10) + 0.2(−10) = 6 + 5 − 2 = <strong>9%</strong>.</li>
<li><strong>Variance</strong> = 0.3(11)² + 0.5(1)² + 0.2(−19)² = 36.3 + 0.5 + 72.2 = 109 → σ = <strong>10.44%</strong>.</li>
<li><strong>P(guidance raised)</strong> = 0.8(0.3) + 0.2(0.7) = 0.24 + 0.14 = 0.38.</li>
<li><strong>Posterior</strong> = 0.24/0.38 = <strong>63.2%</strong> (up from 30%).</li>
<li><strong>Binomial:</strong> C(5,2) = 10; 10 × 0.4² × 0.6³ = 10 × 0.16 × 0.216 = <strong>34.56%</strong>.</li></ol>
<p class="ans">Answers: 9% and 10.44% · 63.2% · 34.56%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Asking for P(X = exactly x) for a continuous variable. <b>Fix:</b> it's zero; only intervals have probability.</li>
<li><b>Trap:</b> Forgetting the denominator P(Info) in Bayes. <b>Fix:</b> always build it with the total probability rule.</li>
<li><b>Trap:</b> Modeling prices with a normal distribution. <b>Fix:</b> prices → lognormal (≥ 0, right-skewed); log returns → normal.</li>
<li><b>Trap:</b> Mixing 1.645 and 1.96. <b>Fix:</b> 90% two-sided (or 95% one-sided) = 1.645; 95% two-sided = 1.96; 99% = 2.58.</li>
<li><b>Trap:</b> Using the binomial when trials aren't independent or p changes. <b>Fix:</b> binomial requires fixed n, constant p, independent trials.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> scenario expected value and σ; which distribution suits a task; binomial probability; z-score and normal probability; Bayes posterior from a short table; conditional expectation from a tree.</li>
<li><strong>Bayes shortcut:</strong> build a 2×2 "joint probability" table: P(A and B), P(A<sup>c</sup> and B). Posterior = first ÷ (sum). Works every time and avoids formula errors.</li>
<li><strong>Distribution-matching pattern:</strong> "count of events per period" → Poisson; "two outcomes repeated" → binomial; "random draws for simulation" → uniform; "asset price" → lognormal; "binary outcome in ML" → logistic.</li>
<li><strong>Memorize</strong> 1, 1.645, 1.96, 2.58 → 68%, 90%, 95%, 99%.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Weighted by belief</b>Expected value = average where likelier outcomes vote more.</div>
<div class="anchor"><b>Prices can't go negative → lognormal</b>Returns are bell-shaped; prices lean right.</div>
<div class="anchor"><b>Detective Bayes</b>New clue × old hunch, rescaled by how common the clue is.</div>
<div class="anchor"><b>"1-1.6-2-2.6"</b>z-values for 68/90/95/99% (≈1, 1.645, 1.96, 2.58).</div></div>`,
summary:`A distribution lists outcomes and probabilities: discrete variables have countable outcomes, continuous ones have densities where only intervals carry probability, and the CDF gives P(X ≤ x). Expected value is the probability-weighted mean and variance the probability-weighted squared deviation (with covariance defined analogously). Key distributions: discrete uniform, binomial (np, np(1−p); binomial trees), Poisson (event counts), continuous uniform (random draws for simulation), normal (μ, σ; 1.645/1.96/2.58 for 90/95/99%), lognormal (prices: non-negative, right-skewed) and logistic (binary outcomes in ML). Conditional expectations combine via the total probability rule and probability trees, and Bayes' formula updates a prior into a posterior: P(A|B) = P(B|A)P(A)/P(B).`
},
quiz:[
{q:"Which distribution is most appropriate for modeling a stock's price one year from now?",o:["Normal","Lognormal","Poisson"],a:1,e:"Prices are bounded below by zero and right-skewed, which is the lognormal shape."},
{q:"Prior P(recession) = 20%. An inverted yield curve occurs before 70% of recessions and in 10% of non-recession periods. Given an inversion, P(recession) is closest to:",o:["14%","64%","70%"],a:1,e:"Joint: 0.7×0.2 = 0.14; 0.1×0.8 = 0.08. P(inversion) = 0.22. Posterior = 0.14/0.22 ≈ 63.6%."},
{q:"For a normal distribution, approximately what percentage of outcomes lie within ±1.96 standard deviations of the mean?",o:["90%","95%","99%"],a:1,e:"±1.96σ captures 95%; ±1.645σ captures 90%; ±2.58σ captures 99%."}]
});

/* ===================== READING 7 ===================== */
add({n:7,topic:"quant",title:"Estimation and Hypothesis Testing",
los:["7.a Explain the central limit theorem and the application of confidence intervals and sampling methodologies.","7.b Explain hypothesis testing and its components, including statistical significance, Type I and Type II errors, and the power of a test; construct appropriate hypothesis tests; and interpret the results.","7.c Compare and contrast parametric and non-parametric tests, describe situations in which each is the more appropriate type of test, construct appropriate hypothesis tests, and interpret the results."],
s:{
eli5:`<p>You want to know the average height of everyone in a city, but you can't measure everyone. So you measure 100 random people. Your answer won't be exact, but it'll be close, and you can say <em>how</em> close: "I'm 95% sure the true average is between 168 and 172 cm." That's a <strong>confidence interval</strong>.</p>
<p>A <strong>hypothesis test</strong> is a courtroom. The "null hypothesis" is the defendant, presumed innocent (e.g., "this fund manager has zero skill"). You only convict (reject the null) if the evidence is <em>very</em> unlikely to happen by luck alone. Convicting an innocent person is a <strong>Type I error</strong>; letting a guilty one walk is a <strong>Type II error</strong>.</p>
<p>The magic fact that makes it all work: if you take lots of samples and average each one, those averages form a nice bell curve, even if the original data is weird. That's the <strong>central limit theorem</strong>.</p>`,
core:`<p><strong>What problem is this solving?</strong> We only ever see samples (a few years of returns), but we want to make claims about the underlying truth (the true expected return, true skill, true correlation) and know how much to trust them.</p>
<ul><li><strong>Sampling error is unavoidable;</strong> the standard error measures its typical size: σ/√n. More data → smaller error, but only with √n (four times the data halves the error).</li>
<li><strong>CLT</strong> means the sample mean is ≈ normal for large n (≥ 30), so we can use z/t tables without knowing the population's shape.</li>
<li><strong>Confidence interval</strong> = estimate ± (critical value × standard error). Wider when you want more confidence or have less data.</li>
<li><strong>Hypothesis test</strong> asks: "How many standard errors is my estimate from the claimed value?" If that distance is beyond the critical value, the result is unlikely under the null → reject.</li>
<li><strong>The error trade-off:</strong> lowering α (fewer false convictions) raises β (more guilty go free) unless you get more data. Power (1 − β) is the ability to catch a real effect.</li>
<li><strong>Parametric vs nonparametric:</strong> parametric tests assume a distribution (normal) and test parameters (means, variances); nonparametric tests use ranks/counts and need fewer assumptions. Use them for outliers, ranked data, small non-normal samples, or categorical data.</li></ul>
<div class="call warn"><strong>Data-snooping alert:</strong> test 100 random strategies at 5% and ~5 will "work" by chance. p-hacking deliberately manufactures these Type I errors.</div>`,
formal:`<h4>Estimation</h4>
<ul><li><strong>CLT:</strong> for any population with mean μ and finite variance σ², the sampling distribution of x̄ for n ≥ 30 is ≈ normal with mean μ and variance σ²/n.</li>
<li><strong>Standard error:</strong> σ<sub>x̄</sub> = σ/√n (σ known) or s<sub>x̄</sub> = s/√n (σ unknown).</li>
<li><strong>Estimator properties:</strong> unbiased, efficient (smallest variance), consistent (accuracy improves with n), robust (insensitive to outliers).</li>
<li><strong>CI:</strong> point estimate ± reliability factor × SE. Use z if σ known (or n large); t (df = n − 1) if σ unknown.</li>
<li><strong>Parametric VaR</strong> (mean 0): VaR = z<sub>α</sub> × σ × portfolio value.</li>
<li><strong>Sampling methods:</strong> probability (simple random, systematic, stratified random, cluster) vs non-probability (convenience, judgmental). Bootstrapping resamples with replacement to estimate standard errors.</li></ul>
<h4>Hypothesis testing steps</h4>
<ol><li>State H₀ (always contains "=") and Hₐ.</li><li>Choose the test statistic.</li><li>Specify α.</li><li>State the decision rule (critical values).</li><li>Collect data, compute the statistic.</li><li>Decide: reject or fail to reject H₀; draw the economic conclusion.</li></ol>
<ul><li>Type I error = reject a true H₀ (probability α). Type II = fail to reject a false H₀ (β). <strong>Power = 1 − β</strong>.</li>
<li>p-value = smallest α at which H₀ can be rejected. Reject if p &lt; α.</li></ul>
<table><tr><th>Test of…</th><th>Statistic</th><th>df</th></tr>
<tr><td>Single mean</td><td>t = (x̄ − μ₀)/(s/√n)</td><td>n − 1</td></tr>
<tr><td>Difference in means (independent samples)</td><td>t (pooled)</td><td>n₁ + n₂ − 2</td></tr>
<tr><td>Mean difference (paired / dependent samples)</td><td>t = (d̄ − μ<sub>d0</sub>)/s<sub>d̄</sub></td><td>n − 1</td></tr>
<tr><td>Single variance</td><td>χ² = (n − 1)s²/σ₀²</td><td>n − 1</td></tr>
<tr><td>Equality of two variances</td><td>F = s₁²/s₂² (larger on top)</td><td>n₁ − 1, n₂ − 1</td></tr>
<tr><td>Correlation = 0</td><td>t = r√(n − 2)/√(1 − r²)</td><td>n − 2</td></tr>
<tr><td>Rank correlation (nonparametric)</td><td>Spearman r<sub>s</sub> = 1 − 6Σd²/[n(n² − 1)]; t-test if n &gt; 30</td><td>n − 2</td></tr>
<tr><td>Independence of categories (nonparametric)</td><td>χ² = Σ(O − E)²/E; E = row total × column total / grand total</td><td>(r − 1)(c − 1)</td></tr></table>`,
math:`<div class="f"><span class="lbl">Standard error and confidence interval</span>SE = s / √n &nbsp;&nbsp;·&nbsp;&nbsp; CI = x̄ ± t<sub>α/2</sub> × SE</div>
<p><strong>Why √n?</strong> Averaging n independent draws cancels noise; variance of the average is σ²/n, so its standard deviation is σ/√n.</p>
<div class="f"><span class="lbl">Generic test statistic</span>test stat = (sample statistic − hypothesized value) / standard error</div>
<p><strong>Why:</strong> it converts "how far is my estimate from the claim?" into units of sampling noise. Two standard errors away is unusual; five is very unusual.</p>
<div class="f"><span class="lbl">Correlation test</span>t = r√(n − 2) / √(1 − r²)</div>
<div class="f"><span class="lbl">Variance tests</span>χ² = (n − 1)s² / σ₀² &nbsp;&nbsp;·&nbsp;&nbsp; F = s₁² / s₂²</div>
<div class="f"><span class="lbl">Parametric VaR (zero mean)</span>VaR = z × σ × P</div>
<div class="dir"><div>n <span class="up">↑</span> → SE <span class="dn">↓</span> → narrower CI, bigger test statistic, more power</div><div>Confidence level <span class="up">↑</span> (α <span class="dn">↓</span>) → wider CI, fewer Type I, more Type II errors</div><div>One-tailed test → smaller critical value on the tested side (easier to reject in that direction)</div></div>
<div class="calc" data-calc="ttest"></div>`,
example:`<div class="q">A manager's 36 monthly returns average 1.2% with s = 4%. (a) Test H₀: μ = 0 vs Hₐ: μ ≠ 0 at 5% (t-critical, 35 df ≈ 2.03). (b) Test Hₐ: μ &gt; 0 at 5% (one-tailed critical ≈ 1.69). (c) 95% CI. (d) Is a sample correlation of 0.40 with n = 27 significant at 5% (critical ≈ 2.06)? (e) Daily σ = 2% on a $10m portfolio: 95% one-day parametric VaR.</div>
<ol class="steps"><li><strong>SE</strong> = 4/√36 = 0.667%. t = (1.2 − 0)/0.667 = <strong>1.80</strong>.</li>
<li><strong>Two-tailed:</strong> |1.80| &lt; 2.03 → <strong>fail to reject</strong>. We can't say average return differs from zero.</li>
<li><strong>One-tailed:</strong> 1.80 &gt; 1.69 → <strong>reject</strong>. Evidence of a positive mean. Same data, different conclusion: the alternative hypothesis matters.</li>
<li><strong>CI:</strong> 1.2 ± 2.03 × 0.667 = 1.2 ± 1.35 → <strong>[−0.15%, 2.55%]</strong>. It contains 0, consistent with step 2.</li>
<li><strong>Correlation:</strong> t = 0.40 × √25/√(1 − 0.16) = 2.0/0.9165 = <strong>2.18</strong> &gt; 2.06 → <strong>significant</strong>.</li>
<li><strong>VaR</strong> = 1.645 × 0.02 × $10m = <strong>$329,000</strong>: on 95% of days, losses shouldn't exceed this.</li></ol>
<p class="ans">Answers: t = 1.80 · fail to reject (2-tail) · reject (1-tail) · [−0.15%, 2.55%] · t = 2.18 significant · VaR $329,000</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Saying "accept H₀". <b>Fix:</b> we only "fail to reject"; absence of evidence isn't proof.</li>
<li><b>Trap:</b> Power = 1 − P(Type I error). <b>Fix:</b> power = 1 − P(<em>Type II</em>) = probability of correctly rejecting a false null. (Watch for this misprint in some summaries.)</li>
<li><b>Trap:</b> Using independent-samples t-test on before/after data for the same firms. <b>Fix:</b> dependent samples → paired comparisons test.</li>
<li><b>Trap:</b> Putting the hypothesis you want to prove in H₀. <b>Fix:</b> what you hope to show goes in Hₐ; H₀ gets the "=".</li>
<li><b>Trap:</b> Using z when σ is unknown and n is small. <b>Fix:</b> t-distribution, df = n − 1.</li>
<li><b>Trap:</b> Confusing p-value with the probability H₀ is true. <b>Fix:</b> it's the probability of data this extreme <em>if</em> H₀ were true.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> choose the right test (z, t, paired t, χ², F, correlation t, Spearman, contingency χ²); compute a test statistic; interpret p-values; identify Type I/II errors; CI width effects; parametric VaR.</li>
<li><strong>Test-picker:</strong> mean → t; two means independent → pooled t; same subjects twice → paired t; one variance → χ²; two variances → F; correlation → t with n − 2; ranks → Spearman; categories → contingency χ².</li>
<li><strong>Speed rule:</strong> if p-value &lt; α, reject. No tables needed.</li>
<li><strong>Consistency check:</strong> a two-sided CI excludes μ₀ ⇔ the two-tailed test at the same α rejects.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Courtroom</b>H₀ is innocent until proven guilty. Type I = jail the innocent; Type II = free the guilty.</div>
<div class="anchor"><b>"Signal ÷ noise"</b>Every test statistic is (estimate − claim) ÷ standard error.</div>
<div class="anchor"><b>√n is slow</b>4× the data only halves the error.</div>
<div class="anchor"><b>Low p, H₀ must go</b>p-value below α → reject.</div>
<div class="anchor"><b>Chi for one, F for two</b>One variance → χ²; ratio of two variances → F.</div></div>`,
summary:`The central limit theorem makes sample means ≈ normal (mean μ, variance σ²/n) for n ≥ 30, so the standard error σ/√n (or s/√n) measures sampling error and confidence intervals are estimate ± critical value × SE (z if σ known/large n, t if σ unknown). Good estimators are unbiased, efficient, consistent and robust; sampling can be probability-based (simple random, systematic, stratified, cluster) or not (convenience, judgmental). Hypothesis tests compare (estimate − hypothesized value)/SE to a critical value at significance α: Type I error = rejecting a true null (α), Type II = failing to reject a false null (β), power = 1 − β, and reject when p &lt; α. Use t for means (pooled for independent samples, paired for dependent), χ² for one variance, F for two variances, t with n − 2 df for correlation, and nonparametric tests (Spearman rank correlation, contingency-table χ² with (r−1)(c−1) df) when distributional assumptions fail or data are ranks or categories. Parametric VaR = zσP.`
},
quiz:[
{q:"An analyst tests whether returns on the same 25 stocks differ before and after an index inclusion. The most appropriate test is a:",o:["difference-in-means t-test with pooled variance","paired comparisons t-test","chi-square test"],a:1,e:"Same stocks measured twice → dependent samples → paired comparisons test on the differences."},
{q:"Holding sample size constant, reducing the significance level from 5% to 1% will most likely:",o:["increase the probability of a Type II error","increase the power of the test","increase the probability of a Type I error"],a:0,e:"Lower α makes it harder to reject, so false nulls survive more often (β ↑) and power (1 − β) falls."},

/* ===================== READING 8 ===================== */
add({n:8,topic:"quant",title:"The Return and Risk of a Financial Portfolio",
los:["8.a Calculate, interpret, and evaluate the expected return, variance, standard deviation, covariance, and correlation of portfolio returns.","8.b Describe, calculate, and interpret the minimum-variance portfolio and portfolios that lie on the efficient frontier.","8.c Explain the selection of an optimal portfolio, given an investor's risk aversion and the capital allocation line, and how this extends to the market portfolio and the capital market line."],
s:{
eli5:`<p>You sell umbrellas and sunglasses. On rainy days umbrellas sell, on sunny days sunglasses sell. Each business alone is a rollercoaster, but owning <em>both</em> gives you steady income every day. That's <strong>diversification</strong>: mixing things that don't move together makes the ride smoother <em>without</em> giving up average profit.</p>
<p>Now, of all the possible mixes, some give the most profit for each level of bumpiness. Those best mixes form a curve called the <strong>efficient frontier</strong>.</p>
<p>Then add a totally safe savings account. You can split your money between the "best" risky mix and the safe account, adjusting how brave you want to be. Cautious people keep more in savings; brave people put more (or even borrow) into the risky mix. Everyone uses the <em>same</em> risky mix; they only change the dose.</p>
<p>Finally, the market only pays you for risk you <em>can't</em> diversify away. That leftover risk is measured by <strong>beta</strong>, and CAPM turns beta into a required return.</p>`,
core:`<p><strong>What problem is this solving?</strong> How should you combine assets, and what return should you demand for an asset's risk? This reading is the backbone of modern portfolio theory.</p>
<ol><li><strong>Portfolio return is a weighted average; portfolio risk is not.</strong> Because assets don't move in lockstep, part of their ups and downs cancel. The lower the correlation, the more cancels. With ρ = +1 nothing cancels; with ρ = −1 you can eliminate risk entirely.</li>
<li><strong>Diversification removes unsystematic risk</strong> (company-specific) but not systematic risk (market-wide). About 20–30 stocks capture most of the benefit.</li>
<li><strong>Efficient frontier:</strong> the upper edge of the minimum-variance frontier, starting at the global minimum-variance portfolio. Anything below it is beaten by something above it.</li>
<li><strong>Adding a risk-free asset turns the curve into a straight line</strong> (the CAL). The best line is the one tangent to the frontier, through the portfolio with the highest Sharpe ratio. Investors then pick a point on that line according to risk aversion: indifference curves tangent to the CAL.</li>
<li><strong>If everyone agrees, the tangency portfolio is the market portfolio</strong> → the CAL becomes the CML (two-fund separation / mutual fund theorem).</li>
<li><strong>Pricing:</strong> in a diversified world only beta (sensitivity to the market) matters → CAPM: E(R) = R<sub>f</sub> + β[E(R<sub>m</sub>) − R<sub>f</sub>].</li></ol>`,
formal:`<h4>Portfolio return and risk</h4>
<ul><li>E(R<sub>p</sub>) = Σwᵢ E(Rᵢ). Historical multi-period returns must account for weights drifting (portfolio drift → style drift); geometric average with changing weights compounds each period's weighted return.</li>
<li>Variance (N assets) = ΣΣ wᵢwⱼCov(i,j), with Cov(i,j) = ρᵢⱼσᵢσⱼ. Scenario-based expected variance = Σ P(m)[R<sub>p,m</sub> − E(R<sub>p</sub>)]².</li>
<li>Diversification benefit exists whenever ρ &lt; +1.</li></ul>
<h4>Frontiers</h4>
<ul><li><strong>Minimum-variance frontier:</strong> lowest σ for each expected return. <strong>Global minimum-variance portfolio (GMV):</strong> leftmost point. <strong>Efficient frontier:</strong> portion above the GMV.</li>
<li>Optimization types: return-constrained (min risk for target return), risk-constrained (max return for target risk), risk-adjusted (max Sharpe ratio).</li></ul>
<h4>Risk aversion and the CAL</h4>
<ul><li>Utility U = E(R) − ½Aσ²; A &gt; 0 risk averse, A = 0 risk neutral, A &lt; 0 risk seeking. Steeper indifference curves = more risk aversion; risk tolerance is the inverse of risk aversion.</li>
<li>CAL: E(R<sub>p</sub>) = R<sub>f</sub> + [(E(R<sub>risky</sub>) − R<sub>f</sub>)/σ<sub>risky</sub>]σ<sub>p</sub>; slope = Sharpe ratio. Combined σ = w<sub>risky</sub>σ<sub>risky</sub>.</li>
<li>Optimal portfolio: highest indifference curve tangent to the CAL. Less risk-averse investors choose points further right (possibly borrowing).</li></ul>
<h4>CML and CAPM</h4>
<ul><li>CML: CAL using the market portfolio (all risky assets at market-value weights). E(R<sub>p</sub>) = R<sub>f</sub> + [(E(R<sub>m</sub>) − R<sub>f</sub>)/σ<sub>m</sub>]σ<sub>p</sub>. Points left of M = lending; right of M = borrowing.</li>
<li>CAPM / SML: E(Rᵢ) = R<sub>f</sub> + βᵢ[E(R<sub>m</sub>) − R<sub>f</sub>], βᵢ = Cov(i,m)/σ<sub>m</sub>² = ρᵢ,ₘσᵢ/σ<sub>m</sub>. β &gt; 1 → expected return above market; β &lt; 1 → below. Market β = 1, risk-free β = 0.</li>
<li>CML uses total risk (σ) and only for efficient portfolios; SML uses systematic risk (β) and prices any asset.</li></ul>`,
math:`<div class="f"><span class="lbl">Two-asset portfolio</span>E(R<sub>p</sub>) = w<sub>A</sub>E(R<sub>A</sub>) + w<sub>B</sub>E(R<sub>B</sub>)<br>σ<sub>p</sub>² = w<sub>A</sub>²σ<sub>A</sub>² + w<sub>B</sub>²σ<sub>B</sub>² + 2w<sub>A</sub>w<sub>B</sub>ρ<sub>AB</sub>σ<sub>A</sub>σ<sub>B</sub></div>
<p><strong>Why the third term?</strong> It's the interaction. If A and B move together (ρ &gt; 0) their swings add; if they move oppositely (ρ &lt; 0) the swings offset. With ρ = 1, σ<sub>p</sub> = weighted average of σ's (no benefit); any ρ &lt; 1 gives σ<sub>p</sub> below that average.</p>
<div class="f"><span class="lbl">Minimum-variance weight (two assets)</span>w<sub>A</sub> = (σ<sub>B</sub>² − ρσ<sub>A</sub>σ<sub>B</sub>) / (σ<sub>A</sub>² + σ<sub>B</sub>² − 2ρσ<sub>A</sub>σ<sub>B</sub>)</div>
<div class="f"><span class="lbl">Utility and optimal risky weight</span>U = E(R) − ½Aσ² &nbsp;&nbsp;·&nbsp;&nbsp; y* = [E(R<sub>risky</sub>) − R<sub>f</sub>] / (Aσ<sub>risky</sub>²)</div>
<div class="f"><span class="lbl">Weight in risky portfolio for a target return</span>w<sub>risky</sub> = (r<sub>target</sub> − R<sub>f</sub>) / (E(R<sub>risky</sub>) − R<sub>f</sub>)</div>
<div class="f"><span class="lbl">Sharpe ratio, CML, beta, CAPM</span>Sharpe = (E(R<sub>p</sub>) − R<sub>f</sub>)/σ<sub>p</sub> &nbsp;·&nbsp; β = Cov(i,m)/σ<sub>m</sub>² = ρσᵢ/σ<sub>m</sub> &nbsp;·&nbsp; E(Rᵢ) = R<sub>f</sub> + β(E(R<sub>m</sub>) − R<sub>f</sub>)</div>
<div class="dir"><div>ρ <span class="dn">↓</span> → σ<sub>p</sub> <span class="dn">↓</span> (return unchanged) — the "free lunch"</div><div>A <span class="up">↑</span> → y* <span class="dn">↓</span> (more in risk-free)</div><div>β <span class="up">↑</span> → required return <span class="up">↑</span>; asset above SML = undervalued</div></div>
<div class="calc" data-calc="port"></div>
<div class="calc" data-calc="util"></div>
<div class="calc" data-calc="capm"></div>`,
example:`<div class="q">Asset A: E(R) 10%, σ 20%. Asset B: E(R) 6%, σ 12%. ρ = 0.30. (a) 60/40 portfolio return and σ. (b) Minimum-variance weights. (c) R<sub>f</sub> = 4%; a risky portfolio offers 11% with σ 20%. For an investor with A = 4, find the optimal risky weight and utility. (d) A stock has β = 1.2, R<sub>f</sub> = 3%, E(R<sub>m</sub>) = 9%; you forecast 11%. Is it under- or overvalued?</div>
<ol class="steps"><li><strong>Return:</strong> 0.6(10) + 0.4(6) = <strong>8.4%</strong>.</li>
<li><strong>Variance:</strong> 0.36(0.04) + 0.16(0.0144) + 2(0.6)(0.4)(0.3)(0.20)(0.12) = 0.0144 + 0.002304 + 0.003456 = 0.02016 → σ = <strong>14.20%</strong>, below the 16.8% weighted average: a 2.6-point diversification benefit.</li>
<li><strong>Min-variance:</strong> w<sub>A</sub> = (0.0144 − 0.3×0.2×0.12)/(0.04 + 0.0144 − 2×0.0072) = 0.0072/0.04 = <strong>18% A, 82% B</strong>.</li>
<li><strong>Optimal y*</strong> = (0.11 − 0.04)/(4 × 0.04) = 0.07/0.16 = <strong>43.75%</strong> risky, 56.25% risk-free. Complete portfolio: E = 4 + 0.4375×7 = 7.06%, σ = 8.75%, U = 0.0706 − 2(0.0077) = <strong>5.53%</strong>, better than all-risky (U = 11 − 8 = 3%) or all risk-free (4%).</li>
<li><strong>CAPM:</strong> 3 + 1.2(6) = <strong>10.2%</strong>. Forecast 11% &gt; 10.2% → plots above SML → <strong>undervalued (buy)</strong>.</li></ol>
<p class="ans">Answers: 8.4% / 14.20% · 18% A · y* 43.75%, U 5.53% · required 10.2% → undervalued</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Averaging standard deviations. <b>Fix:</b> only valid when ρ = +1; otherwise use the full variance formula.</li>
<li><b>Trap:</b> Forgetting the "2" in 2w<sub>A</sub>w<sub>B</sub>Cov. <b>Fix:</b> the covariance term appears twice (A with B and B with A).</li>
<li><b>Trap:</b> Using percentages in the utility formula. <b>Fix:</b> use decimals: U = 0.11 − 0.5×4×0.04, not 11 − 0.5×4×400.</li>
<li><b>Trap:</b> Using σ in CAPM or β in the CML. <b>Fix:</b> CML → total risk σ, efficient portfolios only; SML → systematic risk β, any asset.</li>
<li><b>Trap:</b> Thinking a more risk-averse investor picks a different tangency portfolio. <b>Fix:</b> everyone holds the same risky portfolio; only the mix with R<sub>f</sub> differs.</li>
<li><b>Trap:</b> Calling an asset above the SML overvalued. <b>Fix:</b> above SML = expected return too high for its risk = price too low = undervalued.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> two-asset σ; effect of correlation; GMV weight; Sharpe ratio; optimal portfolio choice with utility; weight in risky asset for a target return; CML vs SML; beta from covariance or correlation; under/overvalued from CAPM.</li>
<li><strong>Shortcut:</strong> ρ = −1 → a zero-risk portfolio exists with w<sub>A</sub> = σ<sub>B</sub>/(σ<sub>A</sub> + σ<sub>B</sub>).</li>
<li><strong>Shortcut:</strong> combining R<sub>f</sub> with a risky portfolio: σ = w × σ<sub>risky</sub>; no correlation term since R<sub>f</sub> has zero variance.</li>
<li><strong>Utility questions:</strong> compute U for each choice and pick the highest. Fast and reliable.</li>
<li><strong>Read carefully:</strong> "beta greater than one" → more systematic risk than market, not necessarily more total risk.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Umbrellas + sunglasses</b>Low correlation is the only free lunch in finance.</div>
<div class="anchor"><b>Same cake, different slice</b>Everyone holds the same risky portfolio; risk aversion only decides how big a slice.</div>
<div class="anchor"><b>CML = σ, SML = β</b>Capital Market Line → total risk; Security Market Line → beta.</div>
<div class="anchor"><b>Above the line, buy the line</b>Above SML → undervalued → buy.</div>
<div class="anchor"><b>U = E − ½Aσ²</b>Return minus a risk penalty scaled by how much you hate risk.</div></div>`,
summary:`Portfolio expected return is the weighted average of asset returns, but portfolio variance (Σ Σ wᵢwⱼρᵢⱼσᵢσⱼ) falls below the weighted average whenever correlations are below +1. That diversification removes unsystematic risk (20–30 stocks capture most of it) but not systematic risk. The minimum-variance frontier's upper portion, from the global minimum-variance portfolio upward, is the efficient frontier. With a risk-free asset, investors combine R<sub>f</sub> with the tangency (max-Sharpe) portfolio along the CAL; each investor's point is where their highest indifference curve (U = E(R) − ½Aσ²) touches the CAL, so more risk-averse investors hold more R<sub>f</sub>. When the tangency portfolio is the market portfolio, the CAL becomes the CML (total risk σ, efficient portfolios). Because only systematic risk is priced, the CAPM/SML gives E(Rᵢ) = R<sub>f</sub> + βᵢ(E(R<sub>m</sub>) − R<sub>f</sub>), with β = Cov(i,m)/σ<sub>m</sub>²; assets plotting above the SML are undervalued.`
},
quiz:[
{q:"Two assets each have σ = 20%. A 50/50 portfolio has σ = 10%. The correlation between them is closest to:",o:["−1.0","−0.5","0.0"],a:1,e:"σ² = 0.25(0.04) + 0.25(0.04) + 2(0.25)ρ(0.04) = 0.02 + 0.02ρ = 0.01 → ρ = −0.5."},
{q:"Compared with the capital market line, the security market line:",o:["uses total risk on the horizontal axis","can be used to price individual securities, including inefficient ones","applies only to efficient portfolios"],a:1,e:"The SML uses beta (systematic risk) and applies to any asset; the CML uses σ and applies only to efficient portfolios."},
{q:"R_f = 3%, risky portfolio E(R) = 9%, σ = 15%. To target a 7.5% return an investor should place in the risky portfolio:",o:["50%","75%","83%"],a:1,e:"w = (7.5 − 3)/(9 − 3) = 4.5/6 = 75%. Portfolio σ = 0.75 × 15% = 11.25%."}]
});

/* ===================== READING 9 ===================== */
add({n:9,topic:"quant",title:"Simulation of Financial Asset Prices and Returns",
los:["9.a Describe historical simulation and explain how it can be used in investment applications.","9.b Describe bootstrap resampling, and explain how it can be used in investment applications.","9.c Describe Monte Carlo simulation and explain how it can be used in investment applications."],
s:{
eli5:`<p>You're planning a picnic next Saturday and want to know how likely rain is. Three ways to guess:</p>
<ol><li><strong>Look at the diary:</strong> "On the last 500 Saturdays, it rained on 60." You replay the past exactly as it happened. That's <strong>historical simulation</strong>.</li>
<li><strong>Shuffle the diary:</strong> write each past Saturday on a card, put all cards in a hat, draw one, write it down, <em>put it back</em>, draw again… thousands of times. You build many "possible years" out of real days. That's <strong>bootstrapping</strong>.</li>
<li><strong>Use a weather model:</strong> "rain follows this pattern with this average and this spread." A computer rolls dice according to that model 10,000 times. That's <strong>Monte Carlo simulation</strong>.</li></ol>
<p>Each gives you not one answer but a whole <em>range</em> of possible outcomes, so you can see the bad cases, not just the average.</p>`,
core:`<p><strong>What problem is this solving?</strong> Many investment questions have no neat formula: path-dependent options, retirement plans with withdrawals, portfolios with non-normal returns, tail-risk (VaR) estimates. Simulation generates thousands of plausible futures and reads the answer off the resulting distribution.</p>
<table><tr><th></th><th>Historical simulation</th><th>Bootstrap resampling</th><th>Monte Carlo</th></tr>
<tr><td>Source of scenarios</td><td>Actual past changes, applied in order to today's positions</td><td>Random draws <em>with replacement</em> from past data</td><td>Random draws from an <em>assumed</em> distribution</td></tr>
<tr><td>Distribution assumption</td><td>None (nonparametric)</td><td>None (empirical distribution)</td><td>Yes (normal, lognormal, etc.; parametric)</td></tr>
<tr><td>Strengths</td><td>Simple, cheap; captures real fat tails and volatility clustering</td><td>Many new samples from limited data; works with small samples and complex statistics</td><td>Flexible; can model any distribution, path, correlation; high precision with many trials; can test "what if"</td></tr>
<tr><td>Weaknesses</td><td>Only as many scenarios as history; can't produce events that never happened; assumes past repeats</td><td>Still limited to past values; loses time ordering (unless adapted)</td><td>Computationally heavy; "garbage in, garbage out" (model risk)</td></tr></table>
<div class="call key"><strong>Key intuition:</strong> the trade-off is between <em>realism</em> (use real data) and <em>flexibility</em> (assume a model you can change). Historical and bootstrap are faithful to the past; Monte Carlo can explore futures the past never showed.</div>`,
formal:`<h4>Historical simulation</h4>
<ul><li>Take actual historical price/return changes (e.g., the last 500 daily changes) and apply each to <em>current</em> portfolio positions to generate a distribution of profit/loss.</li>
<li>Nonparametric: no distributional assumption; inherently captures fat tails, skew and volatility clustering present in the sample.</li>
<li>Uses: VaR, stress testing, backtesting. Limitation: the future may not resemble the sample; rare events absent from the window are missed.</li></ul>
<h4>Bootstrap resampling</h4>
<ul><li>Treat the sample as the "population"; draw many new samples of the same size <em>with replacement</em>; compute the statistic (mean, Sharpe ratio, VaR) for each.</li>
<li>The spread of those statistics estimates the statistic's standard error/confidence interval, even when no formula exists.</li>
<li>Each observation can appear multiple times (or not at all) in a resample. Nonparametric; flexible; good for small samples and complex statistics.</li></ul>
<h4>Monte Carlo simulation steps</h4>
<ol><li>Specify the quantity of interest (e.g., portfolio value, option payoff) and the underlying variables.</li>
<li>Choose distributions and parameters (mean, volatility, correlations) for those variables, e.g., lognormal prices.</li>
<li>Generate random numbers (uniform draws transformed to the chosen distribution) for each trial and each time step.</li>
<li>Compute the outcome for each trial (value the option, the portfolio, etc.).</li>
<li>Repeat thousands of times; analyze the resulting distribution (mean, percentiles, probability of shortfall). Discount at the appropriate rate if valuing.</li></ol>
<p>Precision improves with more trials (error falls with √trials), at a computational cost. Results are only as good as the assumed model (model risk). Simulation is a complement to, not a substitute for, analytical methods.</p>`,
math:`<p>This reading is mostly conceptual, but two calculations make it concrete.</p>
<div class="f"><span class="lbl">Percentile-based VaR from simulated outcomes</span>VaR<sub>α</sub> = loss at the α-percentile of the sorted simulated P&amp;L &nbsp;·&nbsp; e.g., 5% of 1,000 scenarios → the 50th-worst loss</div>
<p><strong>Why:</strong> with no formula, you just sort the outcomes and read off the cut-off. Every method (historical, bootstrap, Monte Carlo) can end with this step.</p>
<div class="f"><span class="lbl">One Monte Carlo price draw (lognormal)</span>S<sub>T</sub> = S₀ × exp[(μ − σ²/2)T + σ√T × z], &nbsp;z ~ N(0,1)</div>
<div class="vars"><div><code>μ</code><span>Expected (arithmetic) annual return</span></div><div><code>σ</code><span>Annual volatility</span></div><div><code>z</code><span>A random standard normal draw (made from a uniform random number)</span></div><div><code>−σ²/2</code><span>Volatility drag: converts the arithmetic mean into the median log-growth</span></div></div>
<p><strong>Why the exponential?</strong> Log returns are normal, so prices are lognormal and can never go negative. Each z is one possible "luck" outcome; thousands of them trace out the distribution.</p>
<div class="f"><span class="lbl">Precision of a Monte Carlo estimate</span>Standard error ≈ σ<sub>outcomes</sub> / √(number of trials)</div>
<div class="dir"><div>Trials <span class="up">↑</span> 4× → error <span class="dn">↓</span> ½ (but 4× computing time)</div><div>Volatility assumption <span class="up">↑</span> → wider simulated range, bigger tail losses</div></div>
<div class="calc" data-calc="sim"></div>`,
example:`<div class="q">(a) A risk manager applies the last 1,000 daily returns to today's $20m portfolio. Sorted from worst, the 10th-worst simulated return is −3.2%. What is the 1% one-day VaR? (b) Monte Carlo: S₀ = 100, μ = 8%, σ = 25%, T = 1, and the random draw is z = −1.2. What is the simulated price? (c) An analyst has only 24 monthly returns and wants a confidence interval for the fund's Sharpe ratio. Which method fits?</div>
<ol class="steps"><li><strong>Historical VaR:</strong> 1% of 1,000 = 10 → 10th-worst outcome = −3.2% × $20m = <strong>$640,000</strong>. On 1% of days, losses are expected to exceed this.</li>
<li><strong>Monte Carlo draw:</strong> exponent = (0.08 − 0.03125)(1) + 0.25 × (−1.2) = 0.04875 − 0.30 = −0.25125 → S<sub>T</sub> = 100 × e<sup>−0.25125</sup> = <strong>77.78</strong>. One unlucky path; thousands of such draws make the distribution.</li>
<li><strong>Method choice:</strong> small sample, a complex statistic with no simple standard-error formula, no wish to assume normality → <strong>bootstrap resampling</strong>: resample 24 months with replacement thousands of times, compute a Sharpe ratio each time, take the 2.5th and 97.5th percentiles.</li></ol>
<p class="ans">Answers: $640,000 · 77.78 · Bootstrap</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Calling historical simulation parametric. <b>Fix:</b> historical and bootstrap are nonparametric; Monte Carlo is parametric (assumes distributions).</li>
<li><b>Trap:</b> Saying bootstrap samples <em>without</em> replacement. <b>Fix:</b> with replacement, so values can repeat.</li>
<li><b>Trap:</b> Believing historical simulation can generate unprecedented crashes. <b>Fix:</b> it only replays what's in the window; Monte Carlo (or stress tests) can create new scenarios.</li>
<li><b>Trap:</b> Thinking more Monte Carlo trials fix a wrong model. <b>Fix:</b> trials reduce sampling error, not model error.</li>
<li><b>Trap:</b> Forgetting volatility clustering. <b>Fix:</b> historical simulation preserves it (consecutive days stay together); basic bootstrap shuffles it away.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> identify the method from a description; strengths/limitations; parametric vs nonparametric; which method suits a small sample, fat tails, or path-dependent payoffs; read a VaR from sorted outcomes.</li>
<li><strong>Keyword map:</strong> "applies actual past changes to current holdings" → historical. "Draws with replacement" → bootstrap. "Specifies a distribution / random number generator / thousands of trials" → Monte Carlo.</li>
<li><strong>Speed:</strong> answers usually turn on one word: assume vs not assume a distribution.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Diary · Hat · Model</b>Historical replays the diary; bootstrap draws days from a hat (and puts them back); Monte Carlo trusts a model's dice.</div>
<div class="anchor"><b>"Boot puts it back"</b>Bootstrap = with replacement.</div>
<div class="anchor"><b>Monte Carlo = casino</b>Lots of random rolls from rules you choose; the house (your model) decides the odds.</div>
<div class="anchor"><b>√ again</b>4× trials, ½ error, just like standard errors in Reading 7.</div></div>`,
summary:`Simulation produces a distribution of possible outcomes when no closed-form answer exists. Historical simulation applies actual past price/return changes to current positions: it is nonparametric, simple and cheap, and captures real fat tails and volatility clustering, but it cannot produce events absent from the sample. Bootstrap resampling repeatedly draws samples with replacement from historical data to estimate the sampling distribution of any statistic; it is nonparametric and works well with small samples and complex statistics. Monte Carlo simulation draws random values from assumed distributions (e.g., lognormal prices, S<sub>T</sub> = S₀e<sup>(μ−σ²/2)T+σ√Tz</sup>) over thousands of trials; it is flexible and precise and can model new scenarios and paths, but it is computationally intensive and exposed to model risk. All three end by reading means, percentiles (VaR) and shortfall probabilities from the simulated distribution.`
},
quiz:[
{q:"Which method makes an explicit assumption about the probability distribution of returns?",o:["Historical simulation","Bootstrap resampling","Monte Carlo simulation"],a:2,e:"Monte Carlo is parametric: you specify the distribution and parameters. The other two use the empirical data."},
{q:"A key limitation of historical simulation is that it:",o:["cannot capture fat tails present in the data","cannot generate scenarios that did not occur in the sample period","requires a large computational effort"],a:1,e:"It replays the past only. It does capture fat tails that are in the data, and it is computationally cheap."},
{q:"In bootstrap resampling, each new sample is created by:",o:["drawing from the original data with replacement","drawing random numbers from a normal distribution","using the most recent observations in order"],a:0,e:"Resampling with replacement treats the sample as the population; observations can appear more than once."}]
});

add({n:10,topic:"quant",title:"Applications of Simple Linear Regression in Finance",
los:["10.a Describe, interpret, and explain simple linear regression, including coefficient estimation using the least squares criterion.","10.b Describe and compare the assumptions of simple linear regression, identify violations through analyzing residuals, evaluate the estimated model's goodness-of-fit and regression coefficients, and results of ANOVA estimates.","10.c Calculate and interpret predicted values, the standard error of the estimate, and prediction intervals for the dependent variable in a simple linear regression model and describe different functional forms.","10.d Calculate and interpret the variable estimates of the capital asset pricing model (CAPM)."],
s:{
eli5:`<p>Put dots on a chart: each dot is a month, the left-right position is how the stock market did, the up-down position is how your stock did. The dots form a rough cloud sloping upward. Now draw the <strong>one straight line</strong> that passes as close as possible to all the dots. That's a regression line.</p>
<p>The line has two numbers: where it starts (the <strong>intercept</strong>, what your stock does when the market does nothing) and how steep it is (the <strong>slope</strong>, how much your stock moves when the market moves 1%). For stocks vs the market, that slope is <strong>beta</strong>.</p>
<p>Then you ask: how well does the line fit? If the dots hug the line, it explains a lot (high <strong>R²</strong>). If they're scattered all over, the line is a weak guide.</p>`,
core:`<p><strong>What problem is this solving?</strong> We want to quantify how one variable responds to another (stock vs market, sales vs GDP, spreads vs leverage), test whether that link is real, and use it to forecast with an honest error band.</p>
<ul><li><strong>Least squares</strong> picks the line that minimizes the sum of squared vertical misses (SSE). Squaring stops positive and negative misses from cancelling and punishes big misses.</li>
<li><strong>The slope is covariance scaled by X's variance:</strong> "how much X and Y move together per unit of X's own movement". The line always passes through the point of means (X̄, Ȳ).</li>
<li><strong>Splitting the variation (ANOVA):</strong> total variation in Y (SST) = what the line explains (SSR) + what it misses (SSE). R² = SSR/SST.</li>
<li><strong>Trust the results only if the assumptions hold:</strong> linearity, constant residual variance (homoskedasticity), independent residuals, normal residuals. Residual plots are how you check.</li>
<li><strong>Forecasts are never exact:</strong> the prediction interval widens with the model's scatter (SEE) and with how far the X you plug in is from its average.</li>
<li><strong>CAPM link:</strong> regress a stock's excess return on the market's excess return → slope = beta, intercept = alpha (abnormal return).</li></ul>`,
formal:`<h4>Model</h4>
<p>Yᵢ = b₀ + b₁Xᵢ + εᵢ. Y = dependent (explained) variable; X = independent (explanatory) variable; εᵢ = residual. Estimated by ordinary least squares (OLS), minimizing SSE = Σ(Yᵢ − Ŷᵢ)².</p>
<ul><li>b̂₁ = Cov(X,Y)/Var(X); b̂₀ = Ȳ − b̂₁X̄.</li>
<li>b̂₀ = predicted Y when X = 0; b̂₁ = change in Y for a one-unit change in X.</li></ul>
<h4>Assumptions (and violations)</h4>
<ol><li>Linear relationship (violation: curved residual pattern → try a transformation).</li>
<li>Homoskedasticity: constant residual variance (violation: fanning residuals = heteroskedasticity).</li>
<li>Independence: residuals uncorrelated (violation: serial correlation, common in time series; seasonality → patterns).</li>
<li>Normality of residuals (violation: outliers, fat tails; matters for small-sample tests).</li></ol>
<h4>ANOVA and goodness of fit</h4>
<table><tr><th>Source</th><th>df</th><th>Sum of squares</th><th>Mean square</th></tr>
<tr><td>Regression</td><td>k = 1</td><td>SSR = Σ(Ŷ − Ȳ)²</td><td>MSR = SSR/1</td></tr>
<tr><td>Error</td><td>n − 2</td><td>SSE = Σ(Y − Ŷ)²</td><td>MSE = SSE/(n − 2)</td></tr>
<tr><td>Total</td><td>n − 1</td><td>SST = Σ(Y − Ȳ)²</td><td></td></tr></table>
<ul><li>R² = SSR/SST = 1 − SSE/SST. In simple regression, R² = r² (correlation squared).</li>
<li>SEE = √MSE (typical size of a residual).</li>
<li>F = MSR/MSE with 1 and n − 2 df. In simple regression it tests H₀: b₁ = 0 and F = t².</li>
<li>Coefficient tests: t = (b̂₁ − B₁)/s<sub>b̂₁</sub>, df = n − 2. Same for b₀.</li>
<li>Indicator (dummy) variable: X = 1 when a condition holds, else 0; slope = difference in mean Y between the two states.</li></ul>
<h4>Prediction and functional forms</h4>
<ul><li>Ŷ = b̂₀ + b̂₁X<sub>p</sub>; prediction interval Ŷ ± t<sub>c</sub> × s<sub>f</sub>, where s<sub>f</sub> grows with SEE and with (X<sub>p</sub> − X̄)².</li>
<li><strong>Log-lin</strong> (ln Y on X): slope = relative (%) change in Y per unit change in X; suits constant growth.</li>
<li><strong>Lin-log</strong> (Y on ln X): slope = absolute change in Y per relative change in X.</li>
<li><strong>Log-log</strong> (ln Y on ln X): slope = elasticity (% change in Y per % change in X).</li></ul>
<h4>CAPM by regression</h4>
<p>(Rᵢ − R<sub>f</sub>) = α + β(R<sub>m</sub> − R<sub>f</sub>) + ε. β̂ = estimated systematic risk; α̂ = abnormal return; R² = share of total risk that is systematic. Then E(Rᵢ) = R<sub>f</sub> + β̂[E(R<sub>m</sub>) − R<sub>f</sub>].</p>`,
math:`<div class="f"><span class="lbl">OLS estimates</span>b̂₁ = Cov(X,Y) / Var(X) &nbsp;&nbsp;·&nbsp;&nbsp; b̂₀ = Ȳ − b̂₁X̄</div>
<p><strong>Why:</strong> if Y moves with X (high covariance) relative to how much X moves on its own (variance), the line is steep. Forcing the line through (X̄, Ȳ) fixes the intercept.</p>
<div class="f"><span class="lbl">Variation split</span>SST = SSR + SSE &nbsp;·&nbsp; R² = SSR/SST &nbsp;·&nbsp; MSE = SSE/(n − 2) &nbsp;·&nbsp; SEE = √MSE &nbsp;·&nbsp; F = MSR/MSE</div>
<div class="vars"><div><code>SST</code><span>All the variation in Y around its mean</span></div><div><code>SSR</code><span>Part captured by the line</span></div><div><code>SSE</code><span>Part the line misses</span></div><div><code>n − 2</code><span>Degrees of freedom: n observations minus 2 estimated parameters</span></div></div>
<div class="f"><span class="lbl">Slope t-test</span>t = (b̂₁ − hypothesized value) / s<sub>b̂₁</sub>, &nbsp;df = n − 2</div>
<div class="dir"><div>Points closer to line → SSE <span class="dn">↓</span> → R² <span class="up">↑</span>, SEE <span class="dn">↓</span>, F <span class="up">↑</span></div><div>Forecast X far from X̄ → prediction interval <span class="up">wider</span></div><div>More data (n <span class="up">↑</span>) → smaller s<sub>b̂</sub>, more significant coefficients</div></div>
<div class="calc" data-calc="reg"></div>`,
example:`<div class="q">Monthly excess returns over 30 months: Cov(X,Y) = 0.0024, Var(X) = 0.0020, mean stock excess return 1.1%, mean market excess return 0.5%. SST = 100, SSE = 40. The slope's standard error is 0.185. (a) Estimate the intercept and slope. (b) Predict Y if the market excess return is 4%. (c) Find R², SEE and F. (d) Is beta significantly different from 0? From 1? (t-critical, 28 df, 5% ≈ 2.05)</div>
<ol class="steps"><li><strong>Slope</strong> = 0.0024/0.0020 = <strong>1.20</strong> (beta). <strong>Intercept</strong> = 1.1 − 1.2 × 0.5 = <strong>0.50%</strong> (alpha per month).</li>
<li><strong>Prediction:</strong> Ŷ = 0.5 + 1.2 × 4 = <strong>5.3%</strong>.</li>
<li><strong>Fit:</strong> SSR = 100 − 40 = 60 → R² = <strong>60%</strong> (60% of variation is market-driven). MSE = 40/28 = 1.429 → SEE = <strong>1.195</strong>. F = 60/1.429 = <strong>42.0</strong>.</li>
<li><strong>β vs 0:</strong> t = 1.2/0.185 = <strong>6.49</strong> &gt; 2.05 → significant. Check: t² ≈ 42 = F, as it must be with one regressor.</li>
<li><strong>β vs 1:</strong> t = (1.2 − 1)/0.185 = <strong>1.08</strong> &lt; 2.05 → <strong>cannot</strong> conclude beta differs from 1.</li></ol>
<p class="ans">Answers: b₀ = 0.50%, b₁ = 1.20 · Ŷ = 5.3% · R² 60%, SEE 1.195, F 42 · t = 6.49 (β ≠ 0) · t = 1.08 (β not ≠ 1)</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using n − 1 df for the error term. <b>Fix:</b> simple regression estimates two parameters → n − 2.</li>
<li><b>Trap:</b> Testing beta only against zero. <b>Fix:</b> read what H₀ claims; "is beta different from 1?" uses (b̂ − 1)/s<sub>b̂</sub>.</li>
<li><b>Trap:</b> Calling high R² proof of causation. <b>Fix:</b> regression shows association; the economic logic must justify direction.</li>
<li><b>Trap:</b> Mixing up SSR and SSE. <b>Fix:</b> R for "Regression explained", E for "Error unexplained".</li>
<li><b>Trap:</b> Misreading log-log slopes. <b>Fix:</b> log-log slope is an elasticity: % change per % change.</li>
<li><b>Trap:</b> Thinking prediction intervals are the same width everywhere. <b>Fix:</b> they widen as X<sub>p</sub> moves away from X̄.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> fill in a missing ANOVA cell; compute R², SEE, F; compute a forecast; test a coefficient; identify a violated assumption from a residual description; interpret a log-lin or log-log slope; read CAPM alpha/beta from output.</li>
<li><strong>ANOVA chain:</strong> SST = SSR + SSE → divide by df → MSR, MSE → F = MSR/MSE, SEE = √MSE, R² = SSR/SST. Knowing any three values usually unlocks the rest.</li>
<li><strong>Shortcut:</strong> in simple regression, R² = r², F = t²<sub>slope</sub>, and the sign of r equals the sign of the slope.</li>
<li><strong>Residual pictures:</strong> funnel → heteroskedasticity; wave/runs → serial correlation; curve → nonlinearity.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Best-fit ruler</b>Least squares lays the ruler where squared misses are smallest.</div>
<div class="anchor"><b>Total = Explained + Error</b>SST = SSR + SSE; R² is the explained share.</div>
<div class="anchor"><b>"n minus 2 for two"</b>Two parameters estimated → n − 2 df.</div>
<div class="anchor"><b>LINE assumptions</b>Linear, Independent errors, Normal errors, Equal variance.</div>
<div class="anchor"><b>Log-log = elasticity</b>% for %.</div></div>`,
summary:`Simple linear regression fits Yᵢ = b₀ + b₁Xᵢ + εᵢ by least squares (minimizing SSE), giving b̂₁ = Cov(X,Y)/Var(X) and b̂₀ = Ȳ − b̂₁X̄; the slope is the change in Y per unit change in X. Valid inference requires linearity, homoskedastic, independent and normally distributed residuals, checked with residual plots. ANOVA splits SST into SSR (explained) and SSE (unexplained): R² = SSR/SST, MSE = SSE/(n − 2), SEE = √MSE and F = MSR/MSE (with one regressor F tests b₁ = 0 and equals t²). Coefficients are tested with t = (b̂ − hypothesized)/s<sub>b̂</sub> using n − 2 df. Forecasts Ŷ = b̂₀ + b̂₁X<sub>p</sub> come with prediction intervals that widen with SEE and distance from X̄. Log-lin, lin-log and log-log forms handle nonlinear relationships (log-log slope = elasticity). Regressing excess stock returns on excess market returns estimates CAPM beta (slope) and alpha (intercept).`
},
quiz:[
{q:"In a simple regression with n = 42, SST = 200 and SSE = 80. The F-statistic is closest to:",o:["1.5","15","60"],a:2,e:"SSR = 120 = MSR. MSE = 80/40 = 2. F = 120/2 = 60. R² = 60%."},
{q:"A residual plot shows the spread of residuals increasing as X increases. This most likely indicates:",o:["serial correlation","heteroskedasticity","nonlinearity"],a:1,e:"A fanning (funnel) pattern means residual variance is not constant: heteroskedasticity."},
{q:"In a log-log regression of sales on advertising, a slope of 0.3 means:",o:["a $1 increase in advertising raises sales by $0.30","a 1% increase in advertising raises sales by about 0.3%","a 1% increase in advertising raises sales by $0.30"],a:1,e:"Log-log slope is an elasticity: % change in Y per % change in X."}]
});
