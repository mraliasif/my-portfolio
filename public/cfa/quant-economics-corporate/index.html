/* ===================== READING 25 ===================== */
add({n:25,topic:"cf",title:"Capital Structure",
los:["25.a Calculate and interpret the weighted-average cost of capital for a company.","25.b Explain factors affecting capital structure and the weighted-average cost of capital.","25.c Explain the Modigliani-Miller propositions regarding capital structure.","25.d Describe optimal and target capital structures."],
s:{
eli5:`<p>A company buys its "fuel" (money) from two pumps: <strong>debt</strong> (cheaper, because lenders get paid first and interest cuts the tax bill) and <strong>equity</strong> (pricier, because owners take the leftovers and the risk). The blended price of all the fuel is the <strong>WACC</strong>. Projects must earn more than the WACC to be worth doing.</p>
<p>So why not use only the cheap debt pump? Because the more you borrow, the riskier the company becomes. Owners then demand more, lenders charge more, and at some point the danger of going bust (lawyers, lost customers, fire-sale assets) outweighs the tax savings. The sweet spot in between is the <strong>optimal capital structure</strong>.</p>
<p>A famous thought experiment (Modigliani-Miller) says: in a perfect world without taxes or bankruptcy costs, it wouldn't matter at all how you slice the pizza between debt and equity; the pizza is the same size.</p>`,
core:`<p><strong>What problem is this solving?</strong> How a company's mix of debt and equity affects its cost of capital and value, and what determines the mix in practice.</p>
<ul><li><strong>WACC</strong> is the hurdle rate for average-risk projects and the discount rate for firm value. Use target (or market-value) weights and the after-tax cost of debt.</li>
<li><strong>MM no taxes:</strong> the firm's value depends on its assets' cash flows, not on how they're split. Borrowing more makes equity riskier, so the cost of equity rises exactly enough to keep WACC constant. "Cheap" debt is an illusion.</li>
<li><strong>MM with taxes:</strong> interest is tax-deductible, so debt creates a tax shield (worth t × D if permanent). Value rises and WACC falls with more debt, implying 100% debt.</li>
<li><strong>Real world (static trade-off):</strong> add expected costs of financial distress, which rise with leverage. Value first increases (tax shield), then decreases (distress costs) → an optimal debt level.</li>
<li><strong>Other theories:</strong> pecking order (asymmetric information: internal funds → debt → equity; issuing equity signals overvaluation), free cash flow hypothesis (debt disciplines managers and reduces agency costs), signaling (debt shows confidence).</li>
<li><strong>What drives actual structures:</strong> business risk and cash flow predictability, asset tangibility (collateral), existing leverage, tax rate, life-cycle stage (start-ups little debt, mature firms more), market conditions, and management's opportunism, so actual structure fluctuates around a target.</li></ul>`,
formal:`<h4>WACC</h4>
<p>WACC = w<sub>d</sub>r<sub>d</sub>(1 − t) + w<sub>p</sub>r<sub>p</sub> + w<sub>e</sub>r<sub>e</sub>. Weights should reflect the target capital structure (market values; if unavailable, current market values or peer averages). Cost of debt is the marginal pre-tax yield, adjusted for tax deductibility.</p>
<h4>Factors affecting capital structure</h4>
<ul><li><strong>Internal:</strong> business model and cash flow predictability, asset type (tangible, liquid collateral supports debt), existing leverage, corporate tax rate, capital intensity, ownership and governance, life-cycle stage.</li>
<li><strong>Life cycle:</strong> start-up (negative/uncertain cash flows, little or no debt; equity-financed), growth (positive cash flows, lower business risk; modest debt), mature (stable cash flows; significant debt).</li>
<li><strong>External:</strong> market and business cycle conditions (credit availability, interest rates), regulatory constraints, industry norms.</li></ul>
<h4>Modigliani-Miller propositions</h4>
<table><tr><th></th><th>No taxes</th><th>With taxes</th></tr>
<tr><td>Proposition I (value)</td><td>V<sub>L</sub> = V<sub>U</sub>: capital structure irrelevant</td><td>V<sub>L</sub> = V<sub>U</sub> + tD: value ↑ with debt</td></tr>
<tr><td>Proposition II (cost of equity)</td><td>r<sub>e</sub> = r₀ + (r₀ − r<sub>d</sub>)(D/E): rises linearly; WACC constant</td><td>r<sub>e</sub> = r₀ + (r₀ − r<sub>d</sub>)(1 − t)(D/E): rises more slowly; WACC falls</td></tr>
<tr><td>Implication</td><td>No optimal structure</td><td>100% debt optimal</td></tr></table>
<p>Assumptions: perfect markets, no transaction/bankruptcy costs, symmetric information, investors can borrow at the same rate as firms, investment decisions unaffected by financing.</p>
<h4>Optimal and target structures</h4>
<ul><li><strong>Static trade-off:</strong> V<sub>L</sub> = V<sub>U</sub> + tD − PV(costs of financial distress). Optimal where marginal tax benefit = marginal expected distress cost; WACC minimized there.</li>
<li>Costs of financial distress: direct (legal, administrative) and indirect (lost customers/suppliers, foregone investment, fire sales). Higher for firms with intangible assets and lower for firms with liquid tangible assets.</li>
<li><strong>Target capital structure:</strong> management's goal; actual structure fluctuates around it due to market value changes and opportunistic issuance.</li>
<li><strong>Pecking order:</strong> internal funds → debt → new equity. <strong>Free cash flow hypothesis:</strong> debt reduces agency costs of equity. Credit ratings also constrain leverage choices.</li></ul>`,
math:`<div class="f"><span class="lbl">Weighted-average cost of capital</span>WACC = w<sub>d</sub> × r<sub>d</sub> × (1 − t) + w<sub>p</sub> × r<sub>p</sub> + w<sub>e</sub> × r<sub>e</sub></div>
<div class="vars"><div><code>w</code><span>Target weights of debt, preferred, equity (market values)</span></div><div><code>r<sub>d</sub>(1 − t)</code><span>After-tax cost of debt (interest is deductible)</span></div><div><code>r<sub>e</sub></code><span>Cost of equity (e.g., from CAPM)</span></div></div>
<div class="f"><span class="lbl">MM Proposition II</span>No tax: r<sub>e</sub> = r₀ + (r₀ − r<sub>d</sub>) × D/E &nbsp;&nbsp;·&nbsp;&nbsp; With tax: r<sub>e</sub> = r₀ + (r₀ − r<sub>d</sub>) × (1 − t) × D/E</div>
<p><strong>Why the cost of equity rises:</strong> debt holders are paid first, so the same business risk is squeezed onto a thinner slice of equity. The (r₀ − r<sub>d</sub>) spread is the extra risk per unit of leverage; taxes soften it because the government shares the interest cost.</p>
<div class="f"><span class="lbl">MM Proposition I (with taxes) and trade-off</span>V<sub>L</sub> = V<sub>U</sub> + t × D &nbsp;&nbsp;·&nbsp;&nbsp; V<sub>L</sub> = V<sub>U</sub> + tD − PV(financial distress costs)</div>
<div class="dir"><div>Tax rate <span class="up">↑</span> → after-tax cost of debt <span class="dn">↓</span>, tax shield <span class="up">↑</span> → more debt attractive</div><div>Leverage <span class="up">↑</span> → r<sub>e</sub> <span class="up">↑</span> and (eventually) r<sub>d</sub> <span class="up">↑</span></div><div>Business risk <span class="up">↑</span> or intangible assets → optimal debt <span class="dn">↓</span></div></div>
<div class="calc" data-calc="wacc"></div>
<div class="calc" data-calc="mm"></div>
<div class="calc" data-calc="lev"></div>`,
example:`<div class="q">(a) Target weights: 40% debt, 60% equity. Pre-tax cost of debt 6%, tax rate 25%, cost of equity 11%. Find WACC. (b) An unlevered firm has r₀ = 10%; it moves to D/E = 0.5 with r<sub>d</sub> = 6%. Find r<sub>e</sub> and WACC with no taxes and with 25% taxes. (c) V<sub>U</sub> = $1,000, D = $400, t = 25%. Value under MM with taxes?</div>
<ol class="steps"><li><strong>WACC</strong> = 0.40 × 6% × 0.75 + 0.60 × 11% = 1.8% + 6.6% = <strong>8.4%</strong>.</li>
<li><strong>No taxes:</strong> r<sub>e</sub> = 10 + (10 − 6)(0.5) = <strong>12%</strong>. Weights at D/E = 0.5: w<sub>d</sub> = 1/3, w<sub>e</sub> = 2/3 → WACC = (1/3)(6) + (2/3)(12) = 2 + 8 = <strong>10%</strong>, unchanged = r₀.</li>
<li><strong>With taxes:</strong> r<sub>e</sub> = 10 + (4)(0.75)(0.5) = <strong>11.5%</strong>. WACC = (1/3)(6)(0.75) + (2/3)(11.5) = 1.5 + 7.67 = <strong>9.17%</strong>: falls because of the tax shield.</li>
<li><strong>Value:</strong> V<sub>L</sub> = 1,000 + 0.25 × 400 = <strong>$1,100</strong>. In practice subtract expected distress costs.</li></ol>
<p class="ans">Answers: WACC 8.4% · 12% / 10% (no tax) · 11.5% / 9.17% (tax) · $1,100</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using the pre-tax cost of debt in WACC. <b>Fix:</b> multiply by (1 − t).</li>
<li><b>Trap:</b> Using book-value weights when market/target weights are available. <b>Fix:</b> target, market-based weights.</li>
<li><b>Trap:</b> Concluding debt is "cheaper" so more debt always lowers WACC. <b>Fix:</b> without taxes, r<sub>e</sub> rises to offset it exactly (MM); with distress costs, WACC eventually rises.</li>
<li><b>Trap:</b> Forgetting (1 − t) in MM Prop II with taxes. <b>Fix:</b> r<sub>e</sub> rises more slowly with taxes.</li>
<li><b>Trap:</b> Pecking order: equity first. <b>Fix:</b> internal funds → debt → equity last.</li>
<li><b>Trap:</b> Expecting start-ups to use lots of debt. <b>Fix:</b> uncertain cash flows and few tangible assets → little debt.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute WACC; effect of a tax change on WACC; MM propositions with/without taxes (statements and r<sub>e</sub> calculation); static trade-off logic; pecking order ranking; life-cycle debt use; factors that support more debt.</li>
<li><strong>Shortcut:</strong> D/E → weights: w<sub>d</sub> = (D/E)/(1 + D/E). D/E = 0.5 → 1/3 debt.</li>
<li><strong>Sanity check:</strong> MM no-tax WACC must equal r₀ at every leverage.</li>
<li><strong>Pattern:</strong> "management issues equity" → market reads it as overvaluation signal → price drop (pecking order/signaling).</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Two fuel pumps</b>Debt is cheaper (after tax) but each litre makes the engine riskier.</div>
<div class="anchor"><b>Pizza slices</b>MM no tax: slicing doesn't change the pizza.</div>
<div class="anchor"><b>Government shares the bill</b>Interest deductibility = tax shield tD.</div>
<div class="anchor"><b>Hill-shaped value</b>Tax shield pushes up, distress costs pull down → peak = optimal structure.</div>
<div class="anchor"><b>"Retained, then Debt, then Equity"</b>Pecking order: RDE.</div></div>`,
summary:`WACC = w<sub>d</sub>r<sub>d</sub>(1 − t) + w<sub>p</sub>r<sub>p</sub> + w<sub>e</sub>r<sub>e</sub>, using target market-value weights, and is the hurdle rate for average-risk projects. Capital structure depends on business risk and cash flow predictability, tangible collateral, existing leverage, tax rates, life-cycle stage (start-ups little debt, growth firms modest, mature firms more) and market conditions. Modigliani-Miller without taxes: firm value and WACC are independent of leverage because the cost of equity rises linearly, r<sub>e</sub> = r₀ + (r₀ − r<sub>d</sub>)D/E. With taxes: the interest tax shield adds tD, r<sub>e</sub> rises more slowly (× (1 − t)), WACC falls, and 100% debt is optimal. The static trade-off theory adds expected financial distress costs, so value first rises then falls with leverage, giving an optimal (WACC-minimizing) structure; actual structures fluctuate around a target. Pecking order theory (internal funds → debt → equity) reflects asymmetric information and signaling, and the free cash flow hypothesis says debt reduces the agency costs of equity.`
},
quiz:[
{q:"According to MM Proposition I without taxes, increasing leverage will:",o:["increase firm value","decrease the WACC","leave firm value unchanged"],a:2,e:"Without taxes and frictions, capital structure is irrelevant: value and WACC stay constant."},
{q:"Under pecking order theory, the least preferred source of financing is:",o:["retained earnings","new debt","new equity"],a:2,e:"Issuing equity signals managers think shares are overvalued, so it comes last."},
{q:"Debt 30% (pre-tax 5%), equity 70% (cost 10%), tax rate 20%. WACC is closest to:",o:["8.20%","8.50%","7.85%"],a:0,e:"0.30 × 5% × 0.8 + 0.70 × 10% = 1.2% + 7.0% = 8.2%."}]
});

/* ===================== READING 26 ===================== */
add({n:26,topic:"cf",title:"Business Models",
los:["26.a Describe key features of business models.","26.b Describe various types of business models."],
s:{
eli5:`<p>A business model is the recipe for how a company makes money. It answers: <strong>Who</strong> are the customers? <strong>What</strong> do we sell them and why would they want it? <strong>How</strong> do we reach them? <strong>How much</strong> do we charge? And <strong>what do we need</strong> (machines, suppliers, people) to make it happen?</p>
<p>Two lemonade stands can sell the same lemonade with totally different recipes: one sells cups for $2; another sells a $10 monthly "unlimited lemonade" pass; a third sells nothing itself and just takes a small cut from every stand in town that uses its app. Same drink, very different businesses.</p>`,
core:`<p><strong>What problem is this solving?</strong> Before valuing a company or lending to it, an analyst must understand <em>how</em> it creates and captures value, because that determines growth, margins, capital needs and risks.</p>
<ul><li><strong>Value proposition</strong> = why customers choose this product over alternatives (price, quality, convenience, features). <strong>Value chain</strong> = the activities and resources the firm uses to deliver that proposition (sourcing, production, distribution, service).</li>
<li><strong>Pricing reveals strategy.</strong> Firms with pricing power can use value-based pricing; commodity producers are price takers. Pricing models (subscription, freemium, tiered, bundling, razor-and-blades, dynamic) shape revenue stability.</li>
<li><strong>Unit economics</strong> tell whether growth creates value: does each customer generate more lifetime gross profit than it costs to acquire?</li>
<li><strong>Network effects</strong> (value rises with each new user) can create winner-take-most markets and strong moats, but need heavy upfront investment and can unwind.</li>
<li><strong>Asset-light vs asset-heavy:</strong> outsourcing, licensing and franchising grow with less capital (higher ROIC), but with less control and thinner share of the value.</li></ul>`,
formal:`<h4>Key features of a business model</h4>
<ul><li><strong>Customers / target market:</strong> who, where, segment (B2B, B2C), geography.</li>
<li><strong>Products/services and value proposition:</strong> what is offered and why customers value it.</li>
<li><strong>Channels:</strong> how the firm reaches and sells to customers (direct, intermediaries, online, omnichannel).</li>
<li><strong>Pricing:</strong> value-based, cost-plus, price discrimination (tiered, dynamic, auction), penetration pricing, freemium, subscription, bundling, razor-and-blades (cheap device, profitable consumables), optional/add-on products.</li>
<li><strong>Key assets, suppliers and value chain:</strong> what resources and partners are needed; what's done in-house vs outsourced.</li></ul>
<h4>Types of business models</h4>
<table><tr><th>Model</th><th>How it works</th></tr>
<tr><td>Conventional (industry-specific)</td><td>Standard approaches within an industry (e.g., manufacturer, retailer, distributor)</td></tr>
<tr><td>Private label / contract manufacturer</td><td>Produces goods sold under another company's brand</td></tr>
<tr><td>Value-added reseller (VAR)</td><td>Resells products with added services (installation, customization, support)</td></tr>
<tr><td>Licensing</td><td>Earns royalties by allowing others to use IP, brands or technology</td></tr>
<tr><td>Franchising</td><td>Franchisees operate under the franchisor's brand and system, paying fees/royalties</td></tr>
<tr><td>Subscription / recurring revenue</td><td>Customers pay periodically for ongoing access</td></tr>
<tr><td>Platform / network-effect businesses</td><td>Connect two or more user groups (marketplaces, payment networks, social media); value grows with users</td></tr>
<tr><td>Crowdsourcing</td><td>Users contribute content or work (reviews, open source)</td></tr>
<tr><td>Hybrid / asset-light</td><td>Combine approaches; outsource capital-intensive steps</td></tr></table>
<h4>Analyst considerations</h4>
<p>Fit of the model to industry structure; scalability; customer acquisition cost and retention; margin structure and operating leverage; capital intensity; dependence on key suppliers/partners; sustainability of competitive advantage; risks to the model (disruption, regulation).</p>`,
math:`<p>No formulas are required, but unit economics turn a business model into numbers.</p>
<div class="f"><span class="lbl">Customer lifetime value (simple)</span>LTV ≈ (revenue per period × gross margin) / churn rate per period</div>
<div class="f"><span class="lbl">Unit economics test</span>LTV / CAC &gt; 1 (comfortably, e.g., ≥ 3) → growth creates value</div>
<div class="vars"><div><code>CAC</code><span>Customer acquisition cost (marketing + sales per new customer)</span></div><div><code>Churn</code><span>% of customers lost per period; 1/churn ≈ average customer lifetime</span></div></div>
<p><strong>Why:</strong> a subscription business spends money now to win a customer and recovers it slowly through margin. If customers leave before that cost is recovered, faster growth means faster losses.</p>
<div class="dir"><div>Churn <span class="dn">↓</span> → LTV <span class="up">↑</span> (sharply: halving churn doubles lifetime)</div><div>Network effects <span class="up">↑</span> → CAC <span class="dn">↓</span> over time, pricing power <span class="up">↑</span></div><div>Asset-light model → capital needs <span class="dn">↓</span>, ROIC <span class="up">↑</span>, but control <span class="dn">↓</span></div></div>`,
example:`<div class="q">(a) A software firm charges $20/month, gross margin 75%, monthly churn 3%, and spends $120 to acquire each customer. Are its unit economics sound? (b) Identify the model: (i) a store-brand cereal made by a branded-cereal company; (ii) a firm installs and configures servers it buys from a manufacturer; (iii) a ride-hailing app matching drivers and riders; (iv) a printer sold near cost with high-margin ink cartridges; (v) a fast-food chain whose outlets are owned by local operators paying royalties.</div>
<ol class="steps"><li><strong>Monthly gross profit per customer</strong> = 20 × 0.75 = $15. Average lifetime ≈ 1/0.03 ≈ 33 months.</li>
<li><strong>LTV</strong> ≈ 15/0.03 = <strong>$500</strong>; LTV/CAC = 500/120 ≈ <strong>4.2</strong> → sound; growth adds value. Payback ≈ 120/15 = 8 months.</li>
<li><strong>(i)</strong> Private label / contract manufacturing. <strong>(ii)</strong> Value-added reseller. <strong>(iii)</strong> Platform with network effects (two-sided). <strong>(iv)</strong> Razor-and-blades pricing. <strong>(v)</strong> Franchising.</li></ol>
<p class="ans">Answers: LTV ≈ $500, LTV/CAC ≈ 4.2 · private label · VAR · platform · razor-and-blades · franchising</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Confusing value proposition with value chain. <b>Fix:</b> proposition = <em>why</em> customers buy; chain = <em>how</em> the firm delivers.</li>
<li><b>Trap:</b> Assuming revenue growth means value creation. <b>Fix:</b> check unit economics (LTV vs CAC) and capital needs.</li>
<li><b>Trap:</b> Mixing up licensing and franchising. <b>Fix:</b> licensing grants use of IP/technology; franchising provides a whole operating system and brand.</li>
<li><b>Trap:</b> Treating network effects as permanent. <b>Fix:</b> they can reverse if users leave (negative feedback loop).</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> list key features of a business model; distinguish value proposition vs value chain; identify a model type or pricing strategy from a description; pros/cons of asset-light models.</li>
<li><strong>Keyword map:</strong> "sells under another's brand" → private label; "adds installation/support" → VAR; "royalties for IP" → licensing; "connects buyers and sellers" → platform; "cheap base, profitable refills" → razor-and-blades.</li>
<li>Low calculation load: answer quickly and save time for Reading 24–25 math.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Who · What · How · How much · With what</b>Customers, offer, channels, pricing, assets/suppliers.</div>
<div class="anchor"><b>"Why buy?" vs "How made?"</b>Value proposition vs value chain.</div>
<div class="anchor"><b>Razor and blades</b>Give away the handle, sell the refills.</div>
<div class="anchor"><b>LTV beats CAC</b>Each customer must be worth more than it costs to win.</div></div>`,
summary:`A business model explains how a firm creates and captures value: its target customers, products and value proposition (why customers choose it), channels, pricing strategy, and the key assets, suppliers and value chain (how it delivers the proposition). Pricing approaches include value-based, cost-plus, price discrimination (tiered, dynamic, auctions), penetration, freemium, subscription, bundling and razor-and-blades. Beyond conventional industry models, firms use private-label/contract manufacturing, value-added reselling, licensing, franchising, subscription, platform/network-effect, crowdsourcing and asset-light hybrids. Analysts should test scalability and unit economics (customer lifetime value vs acquisition cost), capital intensity, dependence on partners and the durability of the competitive advantage.`
},
quiz:[
{q:"A firm sells products under a retailer's brand name rather than its own. This is best described as a:",o:["licensing model","private label model","value-added reseller"],a:1,e:"Manufacturing goods sold under another company's brand is private label (contract) manufacturing."},
{q:"The value chain of a business refers to:",o:["why customers prefer its products","the activities and resources used to deliver its value proposition","the prices it charges different customer segments"],a:1,e:"Value proposition = why customers buy; value chain = how the firm delivers it."},
{q:"A company sells game consoles at a loss and earns high margins on game sales. This pricing strategy is:",o:["penetration pricing","razor-and-blades","cost-plus pricing"],a:1,e:"Cheap base product, profitable consumables/complements = razor-and-blades."}]
});

</script>
<script>
(function(){
const TOPICS={quant:{name:"Quantitative Methods",short:"Quant",color:"var(--quant)",blurb:"Returns, time value, statistics, probability, hypothesis tests, portfolio math, simulation, regression and data science."},
econ:{name:"Economics",short:"Econ",color:"var(--econ)",blurb:"Market structures, business and credit cycles, fiscal and monetary policy, geopolitics, trade, and FX."},
cf:{name:"Corporate Finance",short:"Corp Fin",color:"var(--cf)",blurb:"Issuer forms, stakeholders, governance, working capital, capital investment, capital structure and business models."}};
const SECS=[["eli5","Ultra-Simple (ELI5)"],["core","Intuitive Core Idea"],["formal","Formal CFA-Level"],["math","Mathematics Made Intuitive"],["example","Worked Example"],["traps","Common Mistakes & Traps"],["exam","Thinking in the Exam"],["anchors","Memory Anchors"],["summary","One-Paragraph Summary"],["quiz","Quick Quiz"]];
const R=window.READINGS.sort((a,b)=>a.n-b.n);
const store={get(k,d){try{const v=localStorage.getItem("cfa1b1:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("cfa1b1:"+k,JSON.stringify(v))}catch(e){}}};
let done=store.get("done",{});
let state={r:null,s:"eli5",all:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=h=>h.replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ").replace(/\s+/g," ");

/* theme */
const th=store.get("theme",null); if(th) document.documentElement.setAttribute("data-theme",th);
$("#theme").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const nx=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);store.set("theme",nx)};

function nav(filter){
  const f=(filter||"").trim().toLowerCase();
  let h="";
  for(const t of Object.keys(TOPICS)){
    const rs=R.filter(r=>r.topic===t);
    const dn=rs.filter(r=>done[r.n]).length;
    let items="";
    for(const r of rs){
      let snip="";
      if(f){
        if(!r.title.toLowerCase().includes(f)&&!String(r.n).startsWith(f)){
          const txt=r._txt||(r._txt=strip(Object.values(r.s).join(" ")));
          const i=txt.toLowerCase().indexOf(f);
          if(i<0) continue;
          snip=`<span class="hit">…${esc(txt.slice(Math.max(0,i-30),i+50))}…</span>`;
        }
      }
      items+=`<button class="rlink${state.r===r.n?" on":""}${done[r.n]?" done":""}" data-r="${r.n}" style="--tc:${TOPICS[t].color}"><span class="n">${r.n}</span><span>${esc(r.title)}${snip}</span><span class="ok">✓</span></button>`;
    }
    if(!items&&f) continue;
    h+=`<div class="topic" style="--tc:${TOPICS[t].color}"><div class="topic-h">${TOPICS[t].name}<span>${dn}/${rs.length}</span></div>${items||""}</div>`;
  }
  $("#nav").innerHTML=h||`<div class="overall">No matches.</div>`;
  const tot=Object.keys(done).filter(k=>done[k]).length;
  $("#ovtxt").textContent=`${tot} of ${R.length} readings marked done`;
  $("#ovbar").style.width=(100*tot/R.length)+"%";
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest(".rlink");if(b){go(+b.dataset.r,"eli5");document.body.classList.remove("nav")}});
$("#q").addEventListener("input",e=>nav(e.target.value));
$("#scrim").onclick=()=>document.body.classList.remove("nav");

function home(){
  state.r=null;
  const counts=k=>R.filter(r=>r.topic===k);
  let cards="";
  for(const k of Object.keys(TOPICS)){const rs=counts(k);if(!rs.length)continue;const dn=rs.filter(r=>done[r.n]).length;
    cards+=`<button class="tcard" data-r="${rs[0].n}" style="--tc:${TOPICS[k].color}"><h3>${TOPICS[k].name}</h3><p>${TOPICS[k].blurb}</p><div style="font-size:13px;color:var(--ink3)">Readings ${rs[0].n}–${rs[rs.length-1].n} · ${dn}/${rs.length} done</div><div class="bar"><i style="width:${100*dn/rs.length}%;background:var(--tc)"></i></div></button>`}
  $("#main").innerHTML=`<div class="topbar"><button class="iconbtn" id="burger" aria-label="Menu">☰</button><span class="t">CFA L1 · Book 1</span></div>
  <div class="home" style="padding-top:26px"><div class="kicker" style="--tc:var(--accent)">SchweserNotes 2027 · Book 1</div><h2>Learn every reading three times over: simply, intuitively, then exam-precise.</h2>
  <p class="lead">26 readings, each taught in the same nine layers, plus a quick quiz. Pick a topic to start, or jump in from the sidebar. Calculators inside the maths sections let you move the inputs and watch the answer change.</p>
  <div class="cards">${cards}</div>
  <div class="legend">${SECS.map((s,i)=>`<div><b>${i+1}.</b> ${s[1]}</div>`).join("")}</div>
  <p class="hint">Keys: <kbd>←</kbd> <kbd>→</kbd> move between sections · <kbd>[</kbd> <kbd>]</kbd> previous/next reading · <kbd>/</kbd> search</p></div>`;
  $("#main").querySelectorAll(".tcard").forEach(b=>b.onclick=()=>go(+b.dataset.r,"eli5"));
  $("#burger").onclick=()=>document.body.classList.add("nav");
  nav($("#q").value);
}

function secHTML(r,key,label,i){
  if(key==="quiz") return `<section class="sec" id="s-quiz"><h3>${i+1}. ${label}</h3>${quizHTML(r)}</section>`;
  const body=r.s[key]||"<p><em>—</em></p>";
  const cls=key==="summary"?"prose summary":"prose";
  return `<section class="sec" id="s-${key}"><h3>${i+1}. ${label}</h3><div class="${cls}">${body}</div></section>`;
}
function quizHTML(r){
  if(!r.quiz||!r.quiz.length) return "<p>No quiz.</p>";
  return `<div class="quiz"><p class="score" data-score>Answer each question; feedback is instant.</p>${r.quiz.map((q,qi)=>`<div class="qq" data-qi="${qi}"><p class="stem">${qi+1}. ${q.q}</p>${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join("")}<div class="expl">${q.e}</div></div>`).join("")}</div>`;
}
function wireQuiz(r){
  const root=$("#main");
  root.querySelectorAll(".qq").forEach(div=>{
    div.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const q=r.quiz[+div.dataset.qi];const pick=+b.dataset.oi;
      div.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(i===q.a)x.classList.add("right")});
      if(pick!==q.a)b.classList.add("wrong");
      div.classList.add("answered");div.dataset.ok=pick===q.a?"1":"0";
      const all=root.querySelectorAll(".qq"),ans=root.querySelectorAll(".qq.answered");
      const ok=[...ans].filter(x=>x.dataset.ok==="1").length;
      const sc=root.querySelector("[data-score]");
      if(sc) sc.textContent=ans.length===all.length?`Score: ${ok}/${all.length}${ok===all.length?" — perfect.":" — re-read the explanations for the misses."}`:`${ok}/${ans.length} correct so far`;
    });
  });
}

function go(n,sec,noscroll){
  const r=R.find(x=>x.n===n); if(!r) return home();
  state.r=n; state.s=sec||state.s||"eli5";
  const t=TOPICS[r.topic]; const idx=R.indexOf(r); const prev=R[idx-1],next=R[idx+1];
  document.documentElement.style.setProperty("--tc",t.color);
  const tabs=SECS.map((s,i)=>`<button class="tab${!state.all&&state.s===s[0]?" on":""}" data-s="${s[0]}"><b>${i+1}</b>${s[1]}</button>`).join("");
  const body=state.all?SECS.map((s,i)=>secHTML(r,s[0],s[1],i)).join(""):(()=>{const i=SECS.findIndex(s=>s[0]===state.s);return secHTML(r,SECS[i][0],SECS[i][1],i)})();
  const si=SECS.findIndex(s=>s[0]===state.s);
  const secPager=state.all?"":`<div class="pager">${si>0?`<button class="btn" data-sp="${SECS[si-1][0]}">← ${SECS[si-1][1]}</button>`:"<span></span>"}${si<SECS.length-1?`<button class="btn primary" data-sp="${SECS[si+1][0]}">${SECS[si+1][1]} →</button>`:(next?`<button class="btn primary" data-go="${next.n}">Next: R${next.n} ${esc(next.title)} →</button>`:"<span></span>")}</div>`;
  $("#main").innerHTML=`<div class="topbar"><button class="iconbtn" id="burger" aria-label="Menu">☰</button><span class="t">R${r.n} · ${esc(r.title)}</span></div>
  <header class="rhead" style="--tc:${t.color}"><div class="kicker"><a href="#" id="homelink" style="color:inherit;text-decoration:none">Book 1</a> · ${t.name} · Reading ${r.n}</div><h2>${esc(r.title)}</h2>
  <details class="los"><summary>Learning outcomes (LOS)</summary><ul>${r.los.map(l=>`<li>${l}</li>`).join("")}</ul></details>
  <div class="actions"><button class="btn${done[r.n]?" on":""}" id="markdone">${done[r.n]?"✓ Marked done":"Mark reading done"}</button><button class="btn" id="toggleall">${state.all?"Show one section at a time":"Show all sections on one page"}</button></div></header>
  <div class="tabs" id="tabs">${tabs}</div>
  <div id="body">${body}</div>${secPager}
  <div class="pager">${prev?`<button class="btn" data-go="${prev.n}">← R${prev.n} ${esc(prev.title)}</button>`:"<span></span>"}${next?`<button class="btn" data-go="${next.n}">R${next.n} ${esc(next.title)} →</button>`:"<span></span>"}</div>`;
  $("#burger").onclick=()=>document.body.classList.add("nav");
  $("#homelink").onclick=e=>{e.preventDefault();home();window.scrollTo(0,0)};
  $("#markdone").onclick=()=>{done[r.n]=!done[r.n];store.set("done",done);go(n,state.s,true)};
  $("#toggleall").onclick=()=>{state.all=!state.all;go(n,state.s,true)};
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    if(state.all){const el=document.getElementById("s-"+b.dataset.s);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-70,behavior:"smooth"});return}
    go(n,b.dataset.s)});
  $("#main").querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>go(n,b.dataset.sp));
  $("#main").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go,"eli5"));
  const on=$("#tabs .tab.on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
  renderCalcs(); wireQuiz(r);
  store.set("last",{r:n,s:state.s});
  if(!noscroll){const tb=$("#tabs");const y=tb.getBoundingClientRect().top+scrollY-(innerWidth<=860?55:0);if(scrollY>y)window.scrollTo(0,y)}
  nav($("#q").value);
}

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){e.preventDefault();$("#q").focus();return}
  if(state.r==null)return;
  const si=SECS.findIndex(s=>s[0]===state.s);const idx=R.findIndex(x=>x.n===state.r);
  if(e.key==="ArrowRight"&&!state.all&&si<SECS.length-1)go(state.r,SECS[si+1][0]);
  if(e.key==="ArrowLeft"&&!state.all&&si>0)go(state.r,SECS[si-1][0]);
  if(e.key==="]"&&R[idx+1])go(R[idx+1].n,"eli5");
  if(e.key==="["&&R[idx-1])go(R[idx-1].n,"eli5");
});

/* ---------- calculators ---------- */
const fmt=(x,d=2)=>isFinite(x)?Number(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const pct=(x,d=2)=>isFinite(x)?fmt(100*x,d)+"%":"—";
function irr(cfs){let lo=-0.99,hi=10;const npv=r=>cfs.reduce((s,c,t)=>s+c/Math.pow(1+r,t),0);let flo=npv(lo),fhi=npv(hi);if(flo*fhi>0)return NaN;for(let i=0;i<200;i++){const m=(lo+hi)/2,fm=npv(m);if(flo*fm<=0){hi=m;fhi=fm}else{lo=m;flo=fm}}return (lo+hi)/2}
const CALCS={
 hpr:{t:"Holding period return & annualizing",i:[["p0","Beginning price",100],["p1","Ending price",108],["d","Income received",2],["days","Holding days",180]],
  f:v=>{const h=(v.p1-v.p0+v.d)/v.p0;const a=Math.pow(1+h,365/v.days)-1;return `HPR = (${v.p1} − ${v.p0} + ${v.d}) / ${v.p0} = <b>${pct(h)}</b><br>Annualized = (1 + HPR)<sup>365/${v.days}</sup> − 1 = <b>${pct(a)}</b><br>Continuously compounded (per period) = ln(1 + HPR) = <b>${pct(Math.log(1+h))}</b>`}},
 means:{t:"Arithmetic vs geometric mean (enter yearly returns in %)",i:[["r","Returns, comma-separated",'30,-20,10,5',"text"]],
  f:v=>{const a=String(v.r).split(/[,\s]+/).filter(Boolean).map(Number).map(x=>x/100);if(!a.length||a.some(isNaN))return"Enter numbers.";const am=a.reduce((s,x)=>s+x,0)/a.length;const gm=Math.pow(a.reduce((p,x)=>p*(1+x),1),1/a.length)-1;const hm=a.every(x=>x>-1)?a.length/a.reduce((s,x)=>s+1/(1+x),0)-1:NaN;const sd=Math.sqrt(a.reduce((s,x)=>s+(x-am)**2,0)/Math.max(1,a.length-1));return `Arithmetic mean = <b>${pct(am)}</b> · Geometric mean = <b>${pct(gm)}</b> · Harmonic (of 1+R) = <b>${pct(hm)}</b><br>Sample std. dev. = <b>${pct(sd)}</b> · Gap AM − GM = <b>${pct(am-gm)}</b> (≈ σ²/2 = ${pct(sd*sd/2)})`}},
 twr:{t:"Money-weighted vs time-weighted",i:[["p0","Price at t=0 (buy 1 share)",100],["p1","Price at t=1 (buy 1 more)",120],["p2","Price at t=2 (sell both)",130],["d","Dividend per share each year",0]],
  f:v=>{const cfs=[-v.p0,v.d-v.p1,2*(v.p2+v.d)];const m=irr(cfs);const r1=(v.p1+v.d-v.p0)/v.p0,r2=(v.p2+v.d-v.p1)/v.p1;const tw=Math.sqrt((1+r1)*(1+r2))-1;return `Cash flows (investor): ${cfs.map(x=>fmt(x)).join(" , ")}<br>MWR (IRR) = <b>${pct(m)}</b> · TWR = √[(1+${pct(r1,1)})(1+${pct(r2,1)})] − 1 = <b>${pct(tw)}</b><br>${m>tw?"MWR > TWR: more money was invested before the better period.":m<tw?"MWR < TWR: more money was invested before the weaker period.":"Equal."}`}},
 bond:{t:"Bond price from yield",i:[["fv","Face value",1000],["c","Annual coupon rate %",6],["y","Annual yield (YTM) %",8],["n","Years to maturity",5],["m","Payments per year",2]],
  f:v=>{const r=v.y/100/v.m,N=v.n*v.m,C=v.fv*v.c/100/v.m;const pv=r===0?C*N+v.fv:C*(1-Math.pow(1+r,-N))/r+v.fv*Math.pow(1+r,-N);return `Periodic coupon = ${fmt(C)}, periodic yield = ${pct(r,3)}, periods = ${N}<br>Price = <b>${fmt(pv)}</b> (${pv<v.fv-0.005?"discount: yield > coupon":pv>v.fv+0.005?"premium: coupon > yield":"par: coupon = yield"})`}},
 ggm:{t:"Gordon growth (constant-growth DDM)",i:[["d0","Last dividend D₀",2],["g","Growth g %",4],["r","Required return r %",9]],
  f:v=>{const g=v.g/100,r=v.r/100;if(r<=g)return"r must exceed g — otherwise value is infinite/negative.";const d1=v.d0*(1+g);const p=d1/(r-g);return `D₁ = ${v.d0} × (1 + ${v.g}%) = ${fmt(d1,4)}<br>V₀ = D₁ / (r − g) = <b>${fmt(p)}</b> · Dividend yield D₁/V₀ = ${pct(d1/p)} + growth ${pct(g)} = r`}},
 fwd:{t:"Implied forward rate from spot rates",i:[["s1","Spot rate, shorter (A years) %",3],["a","A (years)",1],["s2","Spot rate, longer (B years) %",4],["b","B (years)",2]],
  f:v=>{const A=v.a,B=v.b;if(B<=A)return"B must exceed A.";const f=Math.pow(Math.pow(1+v.s2/100,B)/Math.pow(1+v.s1/100,A),1/(B-A))-1;return `(1+S<sub>B</sub>)<sup>B</sup> = (1+S<sub>A</sub>)<sup>A</sup> × (1+F)<sup>B−A</sup><br>Forward rate from year ${A} to ${B} = <b>${pct(f,3)}</b> (≈ arithmetic shortcut ${pct((v.s2*B-v.s1*A)/(B-A)/100,2)})`}},
 bayes:{t:"Bayes' formula",i:[["pa","Prior P(Event) %",30],["pba","P(Info | Event) %",80],["pbn","P(Info | no Event) %",20]],
  f:v=>{const pa=v.pa/100,l1=v.pba/100,l0=v.pbn/100;const pi=l1*pa+l0*(1-pa);const post=l1*pa/pi;return `P(Info) = ${pct(l1,0)}×${pct(pa,0)} + ${pct(l0,0)}×${pct(1-pa,0)} = ${pct(pi)}<br>Updated P(Event | Info) = <b>${pct(post)}</b> (prior was ${pct(pa,0)})`}},
 binom:{t:"Binomial probability",i:[["n","Trials n",5],["x","Successes x",2],["p","P(success) %",40]],
  f:v=>{const n=Math.round(v.n),x=Math.round(v.x),p=v.p/100;if(x>n||x<0)return"x must be between 0 and n.";let c=1;for(let i=0;i<x;i++)c=c*(n-i)/(i+1);const pr=c*Math.pow(p,x)*Math.pow(1-p,n-x);return `C(${n},${x}) = ${fmt(c,0)}<br>P(X = ${x}) = ${fmt(c,0)} × ${p.toFixed(2)}<sup>${x}</sup> × ${(1-p).toFixed(2)}<sup>${n-x}</sup> = <b>${pct(pr,3)}</b><br>Mean np = <b>${fmt(n*p)}</b> · Variance np(1−p) = <b>${fmt(n*p*(1-p),3)}</b>`}},
 ttest:{t:"Test of a mean (t-statistic & confidence interval)",i:[["xb","Sample mean",1.2],["mu","Hypothesized mean μ₀",0],["s","Sample std. dev. s",4],["n","Sample size n",36],["cv","Critical value (two-tailed)",1.96]],
  f:v=>{const se=v.s/Math.sqrt(v.n);const t=(v.xb-v.mu)/se;return `Standard error = s/√n = ${fmt(se,4)}<br>Test statistic = (x̄ − μ₀)/SE = <b>${fmt(t,3)}</b> → ${Math.abs(t)>v.cv?"<b>reject H₀</b> (|t| > critical value)":"<b>fail to reject H₀</b>"}<br>Confidence interval = x̄ ± ${v.cv} × SE = [<b>${fmt(v.xb-v.cv*se,3)}</b>, <b>${fmt(v.xb+v.cv*se,3)}</b>]`}},
 port:{t:"Two-asset portfolio — drag the correlation",i:[["w","Weight in A %",60],["ea","E(R) A %",10],["sa","σ A %",20],["eb","E(R) B %",6],["sb","σ B %",12],["rho","Correlation ρ (−1 to +1)",0.3,"range"]],
  f:v=>{const w=v.w/100,ea=v.ea/100,sa=v.sa/100,eb=v.eb/100,sb=v.sb/100,p=+v.rho;const er=w*ea+(1-w)*eb;const vr=w*w*sa*sa+(1-w)**2*sb*sb+2*w*(1-w)*p*sa*sb;const lin=w*sa+(1-w)*sb;const den=sa*sa+sb*sb-2*p*sa*sb;const wmin=den>0?(sb*sb-p*sa*sb)/den:NaN;return `ρ = <b>${p.toFixed(2)}</b> · Cov = ρσ<sub>A</sub>σ<sub>B</sub> = ${fmt(p*sa*sb,4)}<br>E(R<sub>p</sub>) = <b>${pct(er)}</b> · σ<sub>p</sub> = <b>${pct(Math.sqrt(Math.max(vr,0)))}</b> vs weighted-average σ ${pct(lin)} → diversification benefit ${pct(lin-Math.sqrt(Math.max(vr,0)))}<br>Minimum-variance weight in A = <b>${pct(wmin,1)}</b>`}},
 util:{t:"Utility & capital allocation line",i:[["rf","Risk-free rate %",4],["em","E(R) risky portfolio %",11],["sm","σ risky portfolio %",20],["A","Risk aversion A",4]],
  f:v=>{const rf=v.rf/100,em=v.em/100,sm=v.sm/100;const sh=(em-rf)/sm;const y=(em-rf)/(v.A*sm*sm);const er=rf+y*(em-rf),sd=y*sm;const U=er-0.5*v.A*sd*sd;return `Sharpe ratio (slope of CAL) = <b>${fmt(sh,3)}</b><br>Optimal weight in risky portfolio y* = (E−R<sub>f</sub>)/(Aσ²) = <b>${pct(y,1)}</b>${y>1?" (borrowing at R<sub>f</sub>)":""}<br>Complete portfolio: E(R) = ${pct(er)}, σ = ${pct(sd)}, Utility U = E(R) − ½Aσ² = <b>${pct(U)}</b>`}},
 capm:{t:"CAPM required return & beta",i:[["rf","Risk-free rate %",3],["rm","Market return %",9],["beta","Beta β",1.2],["exp","Your forecast return %",11]],
  f:v=>{const req=v.rf+v.beta*(v.rm-v.rf);const a=v.exp-req;return `Required return = R<sub>f</sub> + β(R<sub>m</sub> − R<sub>f</sub>) = ${v.rf}% + ${v.beta}×${fmt(v.rm-v.rf)}% = <b>${fmt(req)}%</b><br>Forecast − required (Jensen-style alpha) = <b>${fmt(a)}%</b> → ${a>0?"plots <b>above</b> the SML: undervalued, buy":a<0?"plots <b>below</b> the SML: overvalued, sell":"on the SML: fairly priced"}`}},
 reg:{t:"Simple regression from summary stats",i:[["b0","Intercept b̂₀",0.5],["b1","Slope b̂₁",1.2],["x","Forecast X",4],["sst","SST (total variation)",100],["sse","SSE (unexplained)",40],["n","n",30]],
  f:v=>{const yh=v.b0+v.b1*v.x;const rss=v.sst-v.sse;const r2=rss/v.sst;const msr=rss/1,mse=v.sse/(v.n-2);const F=msr/mse;const see=Math.sqrt(mse);return `Ŷ = ${v.b0} + ${v.b1}×${v.x} = <b>${fmt(yh,3)}</b><br>RSS (explained) = SST − SSE = ${fmt(rss)} · R² = RSS/SST = <b>${pct(r2,1)}</b> · |r| = ${fmt(Math.sqrt(Math.max(r2,0)),3)}<br>MSE = SSE/(n−2) = ${fmt(mse,3)} · SEE = √MSE = <b>${fmt(see,3)}</b> · F = MSR/MSE = <b>${fmt(F,2)}</b>`}},
 sim:{t:"Monte Carlo: simulate a stock price (lognormal)",i:[["s0","Starting price",100],["mu","Expected annual return %",8],["sig","Annual volatility %",25],["T","Years",1],["n","Trials",5000]],
  f:v=>{const N=Math.min(20000,Math.max(100,Math.round(v.n)));const mu=v.mu/100,s=v.sig/100;let out=[];for(let i=0;i<N;i++){let u=0,w=0;while(u===0)u=Math.random();while(w===0)w=Math.random();const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*w);out.push(v.s0*Math.exp((mu-0.5*s*s)*v.T+s*Math.sqrt(v.T)*z))}out.sort((a,b)=>a-b);const mean=out.reduce((a,b)=>a+b,0)/N;const lo=out[Math.floor(.05*N)],med=out[Math.floor(.5*N)],hi=out[Math.floor(.95*N)];const loss=out.filter(x=>x<v.s0).length/N;return `${N.toLocaleString()} random paths (recomputes on every change)<br>Mean ending price <b>${fmt(mean)}</b> · Median <b>${fmt(med)}</b> (median &lt; mean: right skew of lognormal)<br>5th–95th percentile: <b>${fmt(lo)}</b> to <b>${fmt(hi)}</b> · P(loss) ≈ <b>${pct(loss,1)}</b>`}},
 conc:{t:"Concentration: N-firm ratio & HHI (market shares in %)",i:[["s","Market shares, comma-separated",'35,25,15,10,10,5',"text"],["k","N for concentration ratio",4]],
  f:v=>{const a=String(v.s).split(/[,\s]+/).filter(Boolean).map(Number).sort((x,y)=>y-x);if(a.some(isNaN))return"Enter numbers.";const k=Math.round(v.k);const cr=a.slice(0,k).reduce((x,y)=>x+y,0);const hhi=a.slice(0,k).reduce((x,y)=>x+(y/100)**2,0);const all=a.reduce((x,y)=>x+(y/100)**2,0);return `${k}-firm concentration ratio = <b>${fmt(cr,1)}%</b><br>${k}-firm HHI = Σ(share²) = <b>${fmt(hhi,4)}</b> (all firms: ${fmt(all,4)}) → equivalent to ~<b>${fmt(1/all,1)}</b> equal-sized firms`}},
 be:{t:"Breakeven & shutdown (perfect competition)",i:[["p","Market price (= MR)",12],["atc","Min ATC",14],["avc","Min AVC",9]],
  f:v=>{let msg=v.p>=v.atc?"P ≥ ATC: <b>economic profit ≥ 0 — operate</b> (long run fine).":v.p>=v.avc?"AVC ≤ P < ATC: <b>losing money but keep operating in the short run</b> — revenue covers variable costs and part of fixed costs; exit in the long run if it persists.":"P < AVC: <b>shut down now</b> — every unit produced adds to losses; loss is limited to fixed cost.";return `Breakeven price = min ATC = ${v.atc} · Shutdown price = min AVC = ${v.avc}<br>${msg}`}},
 mult:{t:"Fiscal multiplier",i:[["c","Marginal propensity to consume MPC",0.8],["t","Tax rate t",0.25],["dg","Change in govt spending",100]],
  f:v=>{const m=1/(1-v.c*(1-v.t));const tm=-v.c/(1-v.c*(1-v.t));return `Spending multiplier = 1/[1 − MPC(1 − t)] = <b>${fmt(m,3)}</b> → ΔGDP ≈ <b>${fmt(m*v.dg)}</b><br>Balanced budget (ΔG = ΔT = ${v.dg}) adds ≈ ${fmt((m+tm)*v.dg)} — positive, because part of a tax cut is saved but spending is spent in full.`}},
 fx:{t:"Forward exchange rate (covered interest parity)",i:[["s","Spot (price/base)",1.25],["ip","Interest rate, price currency %",5],["ib","Interest rate, base currency %",3],["d","Days",180]],
  f:v=>{const T=v.d/360;const F=v.s*(1+v.ip/100*T)/(1+v.ib/100*T);const pts=(F-v.s)*10000;return `F = S × (1 + i<sub>price</sub>×T) / (1 + i<sub>base</sub>×T)<br>Forward = <b>${fmt(F,4)}</b> · Forward points = <b>${fmt(pts,1)}</b> pips · Base currency trades at a forward <b>${F>v.s?"premium":"discount"}</b> (${pct(F/v.s-1,3)})`}},
 cross:{t:"Cross rate",i:[["ab","USD/EUR (USD per EUR)",1.10],["cb","JPY/USD (JPY per USD)",150]],
  f:v=>`JPY/EUR = JPY/USD × USD/EUR = ${v.cb} × ${v.ab} = <b>${fmt(v.ab*v.cb,3)}</b> yen per euro<br>Inverse EUR/JPY = <b>${fmt(1/(v.ab*v.cb),6)}</b>`},
 ccc:{t:"Cash conversion cycle",i:[["sales","Annual sales",3650],["cogs","Annual COGS",2555],["ar","Avg receivables",300],["inv","Avg inventory",350],["ap","Avg payables",210]],
  f:v=>{const dso=v.ar/(v.sales/365),doh=v.inv/(v.cogs/365),dpo=v.ap/(v.cogs/365);return `DSO = AR ÷ (sales/365) = <b>${fmt(dso,1)}</b> · DOH = Inv ÷ (COGS/365) = <b>${fmt(doh,1)}</b> · DPO = AP ÷ (purchases/365) = <b>${fmt(dpo,1)}</b> days<br>Cash conversion cycle = DSO + DOH − DPO = <b>${fmt(dso+doh-dpo,1)} days</b> (shorter = less cash tied up)`}},
 npv:{t:"NPV & IRR (cash flows from t=0)",i:[["cf","Cash flows, comma-separated",'-1000,300,400,500,200',"text"],["r","Discount rate %",10]],
  f:v=>{const c=String(v.cf).split(/[,\s]+/).filter(Boolean).map(Number);if(c.some(isNaN)||c.length<2)return"Enter at least two numbers.";const r=v.r/100;const npv=c.reduce((s,x,t)=>s+x/Math.pow(1+r,t),0);const i=irr(c);const pvIn=c.slice(1).reduce((s,x,t)=>s+x/Math.pow(1+r,t+1),0);return `NPV @ ${v.r}% = <b>${fmt(npv)}</b> → ${npv>0?"accept":"reject"}<br>IRR = <b>${pct(i)}</b> ${isFinite(i)?(i>r?"> cost of capital: accept":"< cost of capital: reject"):""}<br>Profitability index = PV inflows / initial outlay = <b>${fmt(pvIn/Math.abs(c[0]),3)}</b>`}},
 wacc:{t:"WACC",i:[["wd","Weight of debt %",40],["rd","Pre-tax cost of debt %",6],["t","Tax rate %",25],["wp","Weight of preferred %",0],["rp","Cost of preferred %",7],["re","Cost of equity %",11]],
  f:v=>{const we=100-v.wd-v.wp;const w=(v.wd*v.rd*(1-v.t/100)+v.wp*v.rp+we*v.re)/100;return `Weight of equity = ${fmt(we,1)}% · After-tax cost of debt = ${fmt(v.rd*(1-v.t/100))}%<br>WACC = w<sub>d</sub>r<sub>d</sub>(1−t) + w<sub>p</sub>r<sub>p</sub> + w<sub>e</sub>r<sub>e</sub> = <b>${fmt(w)}%</b>`}},
 mm:{t:"MM Proposition II with taxes",i:[["r0","Unlevered cost of equity r₀ %",10],["rd","Cost of debt %",6],["de","Debt/Equity",0.5],["t","Tax rate %",25]],
  f:v=>{const t=v.t/100;const re0=v.r0+(v.r0-v.rd)*v.de;const ret=v.r0+(v.r0-v.rd)*(1-t)*v.de;const wd=v.de/(1+v.de),we=1-wd;const w0=wd*v.rd+we*re0,wt=wd*v.rd*(1-t)+we*ret;return `No taxes: r<sub>e</sub> = r₀ + (r₀ − r<sub>d</sub>)(D/E) = <b>${fmt(re0)}%</b>, WACC = <b>${fmt(w0)}%</b> (always = r₀)<br>With taxes: r<sub>e</sub> = r₀ + (r₀ − r<sub>d</sub>)(1 − t)(D/E) = <b>${fmt(ret)}%</b>, WACC = <b>${fmt(wt)}%</b> (falls as D/E rises)`}},
 lev:{t:"Leverage: ROE amplification",i:[["roa","Return on assets (EBIT/assets) %",10],["rd","Cost of debt %",6],["de","Debt/Equity",1],["t","Tax rate %",0]],
  f:v=>{const t=v.t/100;const roe=(v.roa+(v.roa-v.rd)*v.de)*(1-t);return `ROE = [ROA + (ROA − r<sub>d</sub>) × D/E] × (1 − t) = <b>${fmt(roe)}%</b><br>${v.roa>v.rd?"ROA > cost of debt: leverage <b>boosts</b> ROE":"ROA < cost of debt: leverage <b>hurts</b> ROE"}`}}
};
function renderCalcs(){
  document.querySelectorAll(".calc[data-calc]").forEach(el=>{
    const c=CALCS[el.dataset.calc]; if(!c||el.dataset.ready) return; el.dataset.ready=1;
    el.innerHTML=`<h5>${c.t}</h5><div class="cgrid">${c.i.map(([k,l,d,ty])=>ty==="range"?`<label class="wide">${l}: <span data-rv="${k}">${d}</span><input type="range" min="-1" max="1" step="0.05" data-k="${k}" value="${d}"></label>`:`<label${ty==="text"?' class="wide"':""}>${l}<input ${ty==="text"?'type="text"':'type="number" step="any"'} data-k="${k}" value="${d}"></label>`).join("")}</div><div class="cout"></div>`;
    const run=()=>{const v={};el.querySelectorAll("input").forEach(i=>{v[i.dataset.k]=i.type==="text"?i.value:parseFloat(i.value);const rv=el.querySelector(`[data-rv="${i.dataset.k}"]`);if(rv)rv.textContent=(+i.value).toFixed(2)});let out;try{out=c.f(v)}catch(e){out="Check inputs."}el.querySelector(".cout").innerHTML=out};
    el.querySelectorAll("input").forEach(i=>i.addEventListener("input",run)); run();
  });
}


/* ---- site routing: every reading/section has its own URL (#r12-math), back/forward work ---- */
const _go=go,_home=home;let _boot=true,_pop=false;const _SK=SECS.map(s=>s[0]);
function _sync(h){if(_pop)return;const cur=location.hash||"";if(cur===(h||""))return;const url=h||(location.pathname+location.search);try{_boot?history.replaceState(null,"",url):history.pushState(null,"",url)}catch(e){}}
go=function(n,sec,noscroll){_go(n,sec,noscroll);if(state.r===n){_sync("#r"+n+(state.all?"":"-"+state.s));store.set("last",{r:n,s:state.s,t:Date.now()})}};
home=function(){_home();_sync("")};
function _route(ns){const h=decodeURIComponent(location.hash.slice(1));let m=h.match(/^r(\d+)(?:-(\w+))?$/);
  if(m&&R.find(x=>x.n===+m[1])){go(+m[1],_SK.includes(m[2])?m[2]:"eli5",ns);return true}
  m=h.match(/^topic-(\w+)$/);if(m){const r=R.find(x=>x.topic===m[1]);if(r){go(r.n,"eli5",ns);return true}}
  if(h==="home"){home();return true}return false}
window.addEventListener("popstate",()=>{_pop=true;if(!_route(false))_home();_pop=false;window.scrollTo(0,0)});
if(location.protocol==="file:")document.querySelectorAll("a.allbooks").forEach(a=>a.setAttribute("href","../index.html"));
const last=store.get("last",null);
if(!_route(true)){if(last&&R.find(x=>x.n===last.r)) go(last.r,last.s,true); else home();}
_boot=false;
})();
</script>
