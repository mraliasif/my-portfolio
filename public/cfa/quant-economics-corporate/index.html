add({n:21,topic:"cf",title:"Investors and Other Stakeholders",
los:["21.a Compare the financial claims and motivations of lenders and shareholders.","21.b Describe a company's stakeholder groups and compare their interests.","21.c Describe environmental, social, and governance factors of corporate issuers considered by investors."],
s:{
eli5:`<p>A lemonade stand has a lender and an owner. The <strong>lender</strong> said: "I'll give you $80; pay me back $80 plus a bit of interest, no matter how well you do." The <strong>owner</strong> said: "I'll put in $20 and keep whatever is left after the lender is paid."</p>
<p>If the stand does amazingly, the lender still just gets $80 plus interest; the owner gets everything else. If the stand flops, the lender gets paid first and the owner may get nothing. So the owner likes <em>bold</em> bets (huge upside, limited downside), and the lender likes <em>safe</em> ones (no upside, real downside). That's the classic tension.</p>
<p>Lots of other people care about the stand too: the kid working there, the lemon supplier, the neighbors, the town. They're all <strong>stakeholders</strong>. And investors now also ask: is the stand wasteful? Does it treat workers well? Is it run honestly? That's <strong>ESG</strong>.</p>`,
core:`<p><strong>What problem is this solving?</strong> Understanding <em>whose interests</em> a company serves, where they conflict, and what non-financial factors affect long-term value and risk.</p>
<ul><li><strong>Debt is a fixed claim; equity is a residual claim.</strong> Debtholders get contractual interest and principal and have priority in liquidation, but their upside is capped. Shareholders get what's left: unlimited upside, downside limited to their investment.</li>
<li><strong>Different payoffs → different preferences.</strong> Equity behaves like a call option on the firm's assets: more volatility raises its value. Debt behaves like a short put: more volatility hurts it. Hence conflicts over risk-taking, dividends, and new borrowing. Lenders defend themselves with covenants and collateral.</li>
<li><strong>Each stakeholder has a different "currency":</strong> shareholders want value; creditors want repayment and safety; managers want compensation, job security, prestige; employees want pay, security, conditions; customers want quality and price; suppliers want timely payment and steady orders; governments want taxes, jobs and compliance.</li>
<li><strong>Shareholder theory vs stakeholder theory:</strong> maximize shareholder value vs balance all stakeholders' interests (which may better protect long-run value).</li>
<li><strong>ESG factors</strong> are material risks and opportunities: environmental (climate, pollution), social (labor, privacy, community) and governance (board, pay, ethics).</li></ul>`,
formal:`<h4>Lenders vs shareholders</h4>
<table><tr><th></th><th>Debtholders</th><th>Shareholders</th></tr>
<tr><td>Claim</td><td>Legal claim to promised interest and principal; priority</td><td>Residual claim on net assets after creditors</td></tr>
<tr><td>Upside</td><td>Limited (promised payments)</td><td>Theoretically unlimited</td></tr>
<tr><td>Downside</td><td>Loss if default and recovery &lt; claim</td><td>Can lose entire investment (limited liability)</td></tr>
<tr><td>Control</td><td>Covenants; no vote (unless in distress/bankruptcy)</td><td>Voting rights (board elections, major decisions)</td></tr>
<tr><td>Preference</td><td>Stability, low risk, strong cash flow coverage</td><td>Growth, higher risk can be welcome</td></tr>
<tr><td>Return volatility</td><td>Lower</td><td>Higher</td></tr></table>
<p>Conflicts: risky investments, large dividends/buybacks, additional debt issuance (claim dilution), asset sales: all can transfer value from debtholders to shareholders.</p>
<h4>Stakeholder groups</h4>
<p>Shareholders, creditors (bondholders, banks), board of directors, senior management, employees, customers, suppliers, governments/regulators (and communities). Interests can align (long-term health benefits all) or conflict (cost cuts vs job security; prices vs margins).</p>
<h4>ESG factors</h4>
<ul><li><strong>Environmental:</strong> climate change contributions, air and water pollution, deforestation, energy efficiency, waste management, water scarcity, biodiversity. Risks: physical risk (climate events) and transition risk (regulation, technology, changing demand); stranded assets.</li>
<li><strong>Social:</strong> customer privacy and data security, customer satisfaction, employee engagement, diversity and inclusion, labor relations and standards, human rights, community relations.</li>
<li><strong>Governance:</strong> board composition and independence, executive compensation, internal audit, bribery and corruption, political contributions, lobbying, shareholder rights.</li>
<li>Investors integrate ESG via exclusions/negative screening, positive screening, ESG integration in valuation, thematic/impact investing, and engagement/stewardship. Materiality varies by industry.</li></ul>`,
math:`<div class="f"><span class="lbl">Payoffs at maturity (firm value V, debt face D)</span>Debtholders receive min(V, D) &nbsp;&nbsp;·&nbsp;&nbsp; Shareholders receive max(V − D, 0)</div>
<p><strong>Why the conflict:</strong> the shareholders' payoff is shaped like a call option (zero below D, rising above it), so spreading outcomes wider raises its expected value. Debtholders' payoff is capped at D, so wider outcomes only add downside.</p>
<div class="dir"><div>Asset risk <span class="up">↑</span> (same expected V) → equity value <span class="up">↑</span>, debt value <span class="dn">↓</span> (wealth transfer)</div><div>Large dividend funded by debt → creditors' cushion <span class="dn">↓</span></div><div>Covenants <span class="up">↑</span> → borrowing cost <span class="dn">↓</span>, management flexibility <span class="dn">↓</span></div></div>`,
example:`<div class="q">A firm owes $80 of debt due next year. Project S (safe) leaves the firm worth $100 for sure. Project R (risky) leaves it worth $60 or $140 with equal probability. (a) Expected firm value under each? (b) Expected payoff to debt and equity under each? (c) Which do shareholders prefer, and why do lenders write covenants?</div>
<ol class="steps"><li><strong>Firm value:</strong> S = 100; R = 0.5(60) + 0.5(140) = <strong>100</strong>. Same total value.</li>
<li><strong>Project S:</strong> debt = min(100, 80) = <strong>80</strong>; equity = 100 − 80 = <strong>20</strong>.</li>
<li><strong>Project R:</strong> debt = 0.5 × min(60, 80) + 0.5 × 80 = 0.5 × 60 + 40 = <strong>70</strong>; equity = 0.5 × 0 + 0.5 × 60 = <strong>30</strong>.</li>
<li><strong>Conclusion:</strong> shareholders prefer R (30 &gt; 20) even though it creates no value: $10 is transferred from debtholders. Lenders anticipate this and use covenants (limits on risky investment, dividends, extra debt) or charge higher rates.</li></ol>
<p class="ans">Answers: both 100 · S: debt 80/equity 20 · R: debt 70/equity 30 · shareholders prefer R → covenants</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Thinking debtholders benefit from higher risk because returns rise. <b>Fix:</b> their upside is capped; more risk only adds downside.</li>
<li><b>Trap:</b> Saying shareholders have unlimited downside. <b>Fix:</b> limited liability caps losses at the investment.</li>
<li><b>Trap:</b> Classifying executive compensation as a social factor. <b>Fix:</b> it's governance.</li>
<li><b>Trap:</b> Classifying data privacy as governance. <b>Fix:</b> it's social (customers).</li>
<li><b>Trap:</b> Treating stakeholders' interests as always opposed. <b>Fix:</b> many align around long-term firm health.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compare debt vs equity claims; identify a conflict between creditors and shareholders; classify ESG factors; match stakeholders to interests; stakeholder vs shareholder theory.</li>
<li><strong>ESG sorting rule:</strong> nature → E; people (employees, customers, communities) → S; how the company is run and controlled → G.</li>
<li><strong>Pattern:</strong> any action that makes the firm riskier or pays cash out to shareholders → hurts creditors.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Lender = fixed seat, Owner = leftovers</b>Debt has priority but a capped payoff; equity gets the rest.</div>
<div class="anchor"><b>Equity is a call option</b>Volatility helps calls, hurts lenders.</div>
<div class="anchor"><b>Nature · People · Rules</b>E · S · G.</div>
<div class="anchor"><b>Everyone has a different currency</b>Value, safety, pay, quality, payment, taxes.</div></div>`,
summary:`Debtholders hold a contractual, prior claim to interest and principal with limited upside and lower volatility; shareholders hold a residual claim with unlimited upside, losses limited to their investment, and voting control. Because equity behaves like a call option on the firm's assets, shareholders may favor riskier projects, large payouts or added debt that transfer value from creditors, who protect themselves with covenants, collateral and pricing. Stakeholders (shareholders, creditors, board, management, employees, customers, suppliers, governments and communities) have differing and sometimes conflicting interests; stakeholder theory holds that a firm should balance them. Investors assess ESG factors: environmental (climate, pollution, deforestation, energy and water use, waste), social (privacy and data security, customer satisfaction, employee engagement, diversity, labor and community relations) and governance (board composition, executive pay, internal audit, bribery and corruption, political contributions and lobbying), because they affect risk and long-term value.`
},
quiz:[
{q:"Compared with shareholders, debtholders most likely prefer that the company:",o:["undertakes high-risk, high-return projects","maintains stable cash flows and lower leverage","pays large special dividends"],a:1,e:"With a capped upside, lenders prefer safety and strong coverage of their fixed claims."},
{q:"Which of the following is a governance factor?",o:["Employee diversity and inclusion","Executive compensation structure","Water scarcity in operating regions"],a:1,e:"Executive pay is governance. Diversity is social; water scarcity is environmental."},
{q:"Equity holders may benefit from an increase in a firm's asset volatility because:",o:["their payoff resembles a call option on the firm's assets","their claims have priority over debt","their upside is capped"],a:0,e:"A call-like payoff gains from wider outcomes since the downside is floored at zero."}]
});

/* ===================== READING 22 ===================== */
add({n:22,topic:"cf",title:"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits",
los:["22.a Describe the principal-agent relationship and conflicts that may arise between stakeholder groups.","22.b Describe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks.","22.c Describe potential risks of poor corporate governance and stakeholder management and benefits of effective corporate governance and stakeholder management."],
s:{
eli5:`<p>You own a shop but hire a manager to run it while you travel. The manager might work hard for you, or might pay themselves a fat bonus, buy a fancy company car, avoid risky-but-smart ideas to keep their job safe, or hide bad news. You're the <strong>principal</strong>, they're the <strong>agent</strong>, and their interests aren't automatically yours.</p>
<p><strong>Corporate governance</strong> is the set of rules and watchers that keep everyone honest: a board that hires, pays and can fire the manager; auditors who check the books; votes for owners; contracts for lenders, workers and suppliers; and laws from the government.</p>
<p>Good governance means fewer nasty surprises, cheaper borrowing and a more valuable company. Bad governance can end in fraud, lawsuits or collapse.</p>`,
core:`<p><strong>What problem is this solving?</strong> Separation of ownership and control means those running the firm aren't the ones whose money is at risk. Without checks, value leaks to whoever controls the firm. Governance aligns incentives and creates accountability.</p>
<ul><li><strong>Principal-agent conflicts</strong> arise from different incentives plus information asymmetry (managers know more). Key conflicts: shareholders vs managers (perquisites, empire building, excessive risk aversion or risk-taking, entrenchment); controlling vs minority shareholders (related-party deals, unequal voting rights); shareholders vs creditors (risk shifting, dividends, more debt); also with employees, customers, suppliers, governments.</li>
<li><strong>Mechanisms fit each relationship:</strong> shareholders use votes and engagement; creditors use contracts (indentures, covenants) and committees; employees use labor law, contracts and unions; customers and suppliers use contracts; governments use regulation.</li>
<li><strong>The board is the central mechanism</strong>: it selects, pays and oversees management, sets strategy and risk appetite, approves big decisions, and ensures reliable reporting. Independence matters because insiders can't objectively monitor themselves.</li>
<li><strong>Market discipline:</strong> activist investors, proxy contests and the threat of hostile takeovers pressure poor managers. Takeover defenses (poison pills, staggered boards) can entrench them.</li></ul>`,
formal:`<h4>Principal-agent conflicts</h4>
<ul><li><strong>Shareholders vs managers/directors:</strong> insufficient effort, excessive pay and perquisites, empire building, entrenchment, inappropriate risk appetite, information asymmetry.</li>
<li><strong>Controlling vs minority shareholders:</strong> controlling holders can elect the board, approve related-party transactions, use dual-class shares (unequal voting) to expropriate minorities.</li>
<li><strong>Shareholders vs creditors:</strong> risk shifting, excessive distributions, additional borrowing.</li>
<li><strong>Others:</strong> employees (job security vs cost cutting), customers/suppliers (terms, quality), governments (taxes, compliance).</li></ul>
<h4>Governance mechanisms</h4>
<table><tr><th>Stakeholder</th><th>Mechanisms</th></tr>
<tr><td>Shareholders</td><td>General meetings, proxy voting (primary mechanism), ordinary vs special resolutions, cumulative voting, shareholder proposals, activism, proxy contests, derivative lawsuits, hostile takeovers; corporate reporting and transparency</td></tr>
<tr><td>Creditors</td><td>Bond indentures and covenants, collateral, creditor committees, credit ratings</td></tr>
<tr><td>Board</td><td>Committees: audit, governance, remuneration/compensation, nomination, risk, investment; independent directors; separation of CEO and chair</td></tr>
<tr><td>Employees</td><td>Labor laws, employment contracts, unions, employee share ownership</td></tr>
<tr><td>Customers, suppliers</td><td>Contracts, reputation</td></tr>
<tr><td>Governments</td><td>Laws, regulations, regulatory agencies, corporate governance codes</td></tr></table>
<h4>Board duties</h4>
<p>Select, evaluate and set pay for senior management; set strategic direction; approve capital structure changes, major acquisitions and large investments; review performance and take corrective action; plan CEO succession; oversee internal controls and risk management; ensure quality of financial reporting and internal audit.</p>
<p>Board structures: one-tier (single board, executive and non-executive members) or two-tier (separate supervisory and management boards). Staggered boards slow takeovers.</p>
<h4>Risks and benefits</h4>
<ul><li><strong>Risks of poor governance:</strong> weak control systems, poor decision-making (information asymmetry), legal and regulatory risk, reputational risk, default risk.</li>
<li><strong>Benefits of effective governance:</strong> better operational efficiency and control, better performance, lower default risk and cost of debt, better financial performance and higher firm value.</li></ul>`,
math:`<p>No formulas are central, but cumulative voting is a common quantitative illustration of minority-shareholder protection.</p>
<div class="f"><span class="lbl">Cumulative voting</span>Total votes = shares owned × seats up for election (can all go to one candidate)<br>Shares needed to guarantee d directors ≈ [d × total shares voting / (seats + 1)] + 1</div>
<p><strong>Why it protects minorities:</strong> under straight voting each seat is a separate contest, so the majority wins every seat. Pooling votes lets a minority concentrate on a few candidates.</p>
<div class="dir"><div>Board independence <span class="up">↑</span> → monitoring quality <span class="up">↑</span>, agency costs <span class="dn">↓</span></div><div>Staggered board / poison pill → takeover threat <span class="dn">↓</span> → entrenchment risk <span class="up">↑</span></div><div>Dual-class shares → control without proportional ownership → minority risk <span class="up">↑</span></div></div>`,
example:`<div class="q">A company has 1,000 voting shares and 5 board seats up for election. You own 200 shares; a single investor owns the other 800. (a) How many directors can you elect under straight voting? (b) Under cumulative voting? (c) The CEO also chairs the board, sets her own pay through a committee of insiders, and the company recently bought land from her brother at an above-market price. Identify the conflicts and suggest mechanisms.</div>
<ol class="steps"><li><strong>Straight voting:</strong> each seat is voted separately; 800 beats 200 every time → <strong>0 directors</strong>.</li>
<li><strong>Cumulative voting:</strong> you have 200 × 5 = 1,000 votes; the majority has 4,000. To guarantee a seat you need more than 5,000/6 = 833 votes. Putting all 1,000 on one candidate → <strong>1 director</strong> guaranteed.</li>
<li><strong>Conflicts:</strong> CEO-chair duality (weak oversight), self-set pay (shareholder-manager conflict), related-party transaction (expropriation of shareholders).</li>
<li><strong>Mechanisms:</strong> separate CEO and chair or appoint a lead independent director; independent remuneration committee; independent audit committee to review related-party deals; shareholder say-on-pay votes; enhanced disclosure.</li></ol>
<p class="ans">Answers: 0 seats · 1 seat · duality, pay, related-party → independent board/committees, disclosure</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Thinking good governance eliminates all risk. <b>Fix:</b> it reduces agency, legal, reputational and default risk; business risk remains.</li>
<li><b>Trap:</b> Seeing takeover defenses as protecting shareholders. <b>Fix:</b> they often entrench management at shareholders' expense.</li>
<li><b>Trap:</b> Mixing up committee roles. <b>Fix:</b> audit → financial reporting and auditors; remuneration → pay; nomination → board candidates; governance → policies/code; risk → risk appetite.</li>
<li><b>Trap:</b> Treating the board as part of management. <b>Fix:</b> the board oversees management on shareholders' behalf.</li>
<li><b>Trap:</b> Forgetting creditors' main mechanism. <b>Fix:</b> the bond indenture and its covenants.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> identify a principal-agent conflict; match a mechanism to a stakeholder; list board duties; which committee handles X; risks of poor governance; benefits of good governance; cumulative voting arithmetic.</li>
<li><strong>Pattern:</strong> "related party", "dual-class", "controlling shareholder" → controlling vs minority conflict.</li>
<li><strong>Pattern:</strong> "proxy voting" is the primary shareholder mechanism; "indenture" is the primary creditor mechanism.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Owner travels, manager plays</b>Separation of ownership and control = agency problem.</div>
<div class="anchor"><b>Votes, Contracts, Laws</b>Shareholders vote; creditors, employees, suppliers contract; governments legislate.</div>
<div class="anchor"><b>Board = referee with hiring power</b>Picks, pays, watches and replaces management.</div>
<div class="anchor"><b>Good governance is cheap money</b>Lower default risk → lower cost of debt → higher value.</div></div>`,
summary:`The principal-agent relationship arises when owners employ agents (managers, directors) whose incentives and information differ from theirs, producing conflicts between shareholders and managers, controlling and minority shareholders, shareholders and creditors, and the firm and other stakeholders. Corporate governance is the system of internal controls and procedures that defines rights and responsibilities and resolves those conflicts. Shareholders rely mainly on proxy voting (plus cumulative voting, activism, proxy contests, lawsuits and takeovers); creditors on indentures, covenants and committees; employees on labor law and unions; customers and suppliers on contracts; governments on regulation. The board selects, pays and evaluates management, sets strategy, approves major capital decisions, plans succession and oversees risk, internal controls and reporting, often via audit, remuneration, nomination, governance and risk committees. Poor governance brings weak controls, poor decisions, and legal, reputational and default risk; good governance improves efficiency and performance, lowers default risk and the cost of debt, and raises firm value.`
},
quiz:[
{q:"The primary mechanism through which shareholders exercise their rights is:",o:["bond covenants","proxy voting","labor contracts"],a:1,e:"Shareholders vote, often by proxy, on directors and major matters."},
{q:"A controlling shareholder approves a contract to buy supplies from a firm she owns at above-market prices. This is primarily a conflict between:",o:["shareholders and creditors","controlling and minority shareholders","managers and employees"],a:1,e:"A related-party transaction transfers value from minority shareholders to the controlling holder."},
{q:"Which is a likely benefit of effective corporate governance?",o:["Lower cost of debt","Elimination of business risk","Higher executive perquisites"],a:0,e:"Better governance reduces default and agency risk, lowering borrowing costs."}]
});

/* ===================== READING 23 ===================== */
add({n:23,topic:"cf",title:"Working Capital and Liquidity",
los:["23.a Explain the cash conversion cycle and compare issuers' cash conversion cycles.","23.b Explain liquidity and compare issuers' liquidity levels.","23.c Describe issuers' objectives and compare methods for managing working capital and liquidity."],
s:{
eli5:`<p>A toy shop pays for toys, keeps them on shelves for a while, sells them (often on credit, so customers pay later), and only then gets cash. Meanwhile, the shop's own suppliers let it pay a bit later too. The <strong>cash conversion cycle</strong> is how many days the shop's own money is stuck between paying for toys and getting paid by customers.</p>
<p>Shorter is better: less money stuck = less borrowing needed. You can shorten it by selling toys faster, getting customers to pay faster, or paying suppliers later.</p>
<p><strong>Liquidity</strong> is simply: can you pay this month's bills? Cash in the till, money owed to you soon, and a bank that will lend you some all help. Running out of liquidity can sink even a profitable shop.</p>`,
core:`<p><strong>What problem is this solving?</strong> Profits don't pay bills; cash does. A growing, profitable firm can still fail if too much cash is tied up in inventory and receivables. Working capital management balances having enough liquidity against the cost of holding idle assets.</p>
<ul><li><strong>CCC = DOH + DSO − DPO.</strong> Inventory days and receivable days lengthen the cash gap; payable days (supplier financing) shorten it. A negative CCC (common in some retailers/platforms) means suppliers effectively finance the business.</li>
<li><strong>Drags vs pulls on liquidity:</strong> a <em>drag</em> slows cash coming in (customers pay late, inventory goes obsolete); a <em>pull</em> speeds cash going out (suppliers demand faster payment, credit lines cut).</li>
<li><strong>Primary vs secondary liquidity:</strong> primary sources are routine (cash, marketable securities, bank lines, operating cash flow); secondary sources (cutting dividends, delaying capex, selling assets, issuing equity, renegotiating debt, bankruptcy protection) change the firm's operations or financial structure and send negative signals.</li>
<li><strong>Conservative vs aggressive policy:</strong> more current assets financed long-term = safer but costlier (lower return); fewer current assets financed short-term = cheaper and higher return but riskier (refinancing risk).</li>
<li><strong>Comparisons must be industry-relative:</strong> a grocer and a shipbuilder have naturally different cycles and ratios.</li></ul>`,
formal:`<h4>Working capital definitions</h4>
<ul><li>Total working capital = current assets − current liabilities.</li>
<li>Net working capital = (current assets excluding cash and marketable securities) − (current liabilities excluding short-term and current debt). This is the operating working capital needing financing.</li></ul>
<h4>Cash conversion cycle</h4>
<ul><li>DOH (days of inventory on hand) = inventory / (COGS/365).</li>
<li>DSO (days sales outstanding) = receivables / (sales/365).</li>
<li>DPO (days payables outstanding) = payables / (purchases/365) (COGS often used as a proxy).</li>
<li>CCC = DOH + DSO − DPO. Increases with DOH and DSO; decreases with DPO.</li></ul>
<h4>Liquidity measures</h4>
<ul><li>Current ratio = current assets / current liabilities.</li>
<li>Quick ratio = (cash + marketable securities + receivables) / current liabilities.</li>
<li>Cash ratio = (cash + marketable securities) / current liabilities.</li>
<li>Strict ordering: current ≥ quick ≥ cash.</li></ul>
<h4>Sources of liquidity</h4>
<ul><li><strong>Primary:</strong> cash and marketable securities, bank borrowings (lines of credit), cash from operations; also trade credit and efficient cash management.</li>
<li><strong>Secondary:</strong> suspending/reducing dividends, delaying capital investments, selling assets, issuing equity, renegotiating/restructuring debt, filing for bankruptcy protection. Using them signals weakness and incurs a cost of liquidity.</li></ul>
<h4>Working capital approaches</h4>
<table><tr><th></th><th>Conservative</th><th>Aggressive</th></tr>
<tr><td>Level of current assets</td><td>High</td><td>Low</td></tr>
<tr><td>Financing of working capital</td><td>Long-term debt and equity</td><td>Short-term debt</td></tr>
<tr><td>Liquidity / financial risk</td><td>More liquidity, less risk</td><td>Less liquidity, more risk (rollover)</td></tr>
<tr><td>Financing cost / returns</td><td>Higher cost, lower returns</td><td>Lower cost, higher returns</td></tr></table>
<p>A moderate approach matches maturities: permanent working capital financed long-term, seasonal needs short-term. Other tools: trade credit terms, early-payment discounts, factoring receivables, inventory management (just-in-time), short-term investment policy.</p>`,
math:`<div class="f"><span class="lbl">Cash conversion cycle</span>CCC = DOH + DSO − DPO</div>
<div class="vars"><div><code>DOH</code><span>Inventory ÷ (COGS/365): days goods sit on the shelf</span></div><div><code>DSO</code><span>Receivables ÷ (Sales/365): days to collect from customers</span></div><div><code>DPO</code><span>Payables ÷ (Purchases/365): days the firm takes to pay suppliers</span></div></div>
<p><strong>Why:</strong> trace one dollar. It leaves when you pay suppliers (day DPO), but the goods take DOH days to sell and then DSO days to collect. The gap you must finance is DOH + DSO − DPO.</p>
<div class="f"><span class="lbl">Liquidity ratios</span>Current = CA/CL &nbsp;·&nbsp; Quick = (Cash + MS + AR)/CL &nbsp;·&nbsp; Cash = (Cash + MS)/CL</div>
<p><strong>Why three ratios:</strong> each removes a less-liquid layer. Inventory may be slow to sell, so the quick ratio drops it; receivables may not be collected, so the cash ratio drops those too.</p>
<div class="f"><span class="lbl">Cost of forgoing a trade discount (e.g., 2/10 net 30)</span>Cost = (1 + discount/(1 − discount))<sup>365/(days paid − discount days)</sup> − 1</div>
<div class="dir"><div>DSO <span class="up">↑</span> or DOH <span class="up">↑</span> → CCC <span class="up">↑</span> → more financing needed (drag on liquidity)</div><div>DPO <span class="dn">↓</span> (suppliers tighten terms) → CCC <span class="up">↑</span> (pull on liquidity)</div><div>Aggressive policy → return <span class="up">↑</span>, liquidity risk <span class="up">↑</span></div></div>
<div class="calc" data-calc="ccc"></div>`,
example:`<div class="q">Annual sales $3,650, COGS $2,555 (use as purchases), average receivables $300, inventory $350, payables $210. Balance sheet: cash $50, marketable securities $30, receivables $120, inventory $200; current liabilities $250. (a) Compute DSO, DOH, DPO and CCC. (b) Compute the current, quick and cash ratios. (c) A supplier offers 2/10 net 30. What is the annual cost of not taking the discount?</div>
<ol class="steps"><li><strong>Daily figures:</strong> sales/365 = 10; COGS/365 = 7.</li>
<li><strong>DSO</strong> = 300/10 = <strong>30</strong>; <strong>DOH</strong> = 350/7 = <strong>50</strong>; <strong>DPO</strong> = 210/7 = <strong>30</strong>. <strong>CCC</strong> = 50 + 30 − 30 = <strong>50 days</strong>.</li>
<li><strong>Current assets</strong> = 50 + 30 + 120 + 200 = 400 → current ratio = 400/250 = <strong>1.60</strong>.</li>
<li><strong>Quick</strong> = (50 + 30 + 120)/250 = <strong>0.80</strong>. <strong>Cash</strong> = 80/250 = <strong>0.32</strong>. Inventory makes up half the current assets: the comfortable current ratio overstates liquidity.</li>
<li><strong>Trade credit:</strong> paying on day 30 instead of day 10 "borrows" 98 for 20 days at a cost of 2. Cost = (1 + 2/98)<sup>365/20</sup> − 1 = (1.0204)<sup>18.25</sup> − 1 ≈ <strong>44.6%</strong> per year: take the discount unless funds cost more than that.</li></ol>
<p class="ans">Answers: DSO 30, DOH 50, DPO 30, CCC 50 · 1.60 / 0.80 / 0.32 · ≈ 44.6%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Adding DPO in the CCC. <b>Fix:</b> subtract it; paying suppliers later <em>shortens</em> the cycle.</li>
<li><b>Trap:</b> Using sales for DOH. <b>Fix:</b> inventory is at cost → use COGS.</li>
<li><b>Trap:</b> Including inventory in the quick ratio. <b>Fix:</b> quick = cash + marketable securities + receivables.</li>
<li><b>Trap:</b> Calling a dividend cut a primary liquidity source. <b>Fix:</b> it's secondary (and a negative signal).</li>
<li><b>Trap:</b> Thinking a conservative policy maximizes returns. <b>Fix:</b> conservative = safer but costlier → lower returns.</li>
<li><b>Trap:</b> Comparing CCCs across unrelated industries. <b>Fix:</b> benchmark against peers.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute CCC; effect of changes in DSO/DOH/DPO; compute and rank liquidity ratios; classify primary vs secondary sources; identify drag vs pull; conservative vs aggressive trade-offs; cost of trade credit.</li>
<li><strong>Shortcut:</strong> "customers paying slower" or "inventory obsolete" → drag; "suppliers want faster payment" or "credit line reduced" → pull.</li>
<li><strong>Sanity check:</strong> current ≥ quick ≥ cash always.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Shelf + Collect − Pay</b>CCC = days on the shelf + days to collect − days to pay.</div>
<div class="anchor"><b>Peel the onion</b>Current → peel off inventory → quick → peel off receivables → cash.</div>
<div class="anchor"><b>Drag in, pull out</b>Drag = inflows slow; pull = outflows speed up.</div>
<div class="anchor"><b>Belt and braces vs tightrope</b>Conservative = safe and costly; aggressive = cheap and risky.</div></div>`,
summary:`The cash conversion cycle, CCC = DOH + DSO − DPO, measures how long a firm's cash is tied up between paying for inputs and collecting from customers; it lengthens with slower inventory turnover or collections and shortens with slower payment to suppliers. Total working capital is current assets minus current liabilities; net (operating) working capital excludes cash, marketable securities and short-term debt. Liquidity is assessed with the current, quick ((cash + securities + receivables)/CL) and cash ratios. Primary liquidity sources are cash and securities, bank lines and operating cash flow; secondary sources (cutting dividends, delaying capex, selling assets, issuing equity, restructuring debt, bankruptcy protection) signal distress and are costly. Drags slow cash inflows; pulls accelerate outflows. A conservative working capital policy holds more current assets financed long-term (more liquidity, lower risk, higher cost, lower return); an aggressive policy holds fewer, financed short-term (lower cost, higher return, more liquidity risk). Compare issuers against industry peers.`
},
quiz:[
{q:"DOH = 45, DSO = 35, DPO = 40. The cash conversion cycle is:",o:["40 days","50 days","120 days"],a:0,e:"45 + 35 − 40 = 40 days."},
{q:"Which is a secondary source of liquidity?",o:["Drawing on an existing bank line of credit","Selling marketable securities","Suspending the dividend"],a:2,e:"Dividend cuts alter financial policy and signal weakness: secondary. Bank lines and securities are primary."},
{q:"Compared with a conservative working capital approach, an aggressive approach most likely has:",o:["higher liquidity and lower returns","lower financing costs and higher financial risk","more long-term financing of current assets"],a:1,e:"Aggressive = fewer current assets, short-term financing → cheaper and higher return but more rollover/liquidity risk."}]
});

/* ===================== READING 24 ===================== */
add({n:24,topic:"cf",title:"Capital Investments and Capital Allocation",
los:["24.a Describe types of capital investments.","24.b Describe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and contrast their use in capital allocation.","24.c Describe principles of capital allocation and common capital allocation pitfalls.","24.d Describe types of real options relevant to capital investments."],
s:{
eli5:`<p>You're thinking of buying a $1,000 ice-cream machine. Over the next four years it'll bring in extra cash: $300, $400, $500, $200. Is it worth it? Money later is worth less than money now (Reading 4), so shrink each future amount back to today using the return you could get elsewhere, say 10%. Add them up: about $1,116. You pay $1,000 and get $1,116 of value: you're $116 richer. That's a positive <strong>NPV</strong>: buy it.</p>
<p>Another way to ask: "What interest rate is this machine secretly paying me?" That's the <strong>IRR</strong>, about 15%. Since 15% beats the 10% you need, buy it.</p>
<p>And flexibility has value: if you can later buy a second machine when business booms, or sell the first one if it flops, that "option" makes the project worth more than the plain numbers show.</p>`,
core:`<p><strong>What problem is this solving?</strong> Long-lived investments determine a company's future. Capital allocation decides which projects create value (return more than the cost of the capital they use) and which destroy it.</p>
<ul><li><strong>NPV is the gold standard:</strong> it measures the dollar change in firm value from taking the project. Positive NPV → value created.</li>
<li><strong>IRR is the project's own break-even return.</strong> It's intuitive (a percentage) and agrees with NPV for single, independent, conventional projects. But it can mislead for mutually exclusive projects of different size or timing, and for non-conventional cash flows (multiple or no IRRs), because it implicitly assumes reinvestment at the IRR itself. NPV assumes reinvestment at the cost of capital, which is more realistic.</li>
<li><strong>ROIC</strong> checks value creation at the company level: if after-tax operating return on invested capital exceeds the cost of capital, the firm has been creating value.</li>
<li><strong>Principles:</strong> use incremental, after-tax <em>cash flows</em>, not accounting profits; timing matters; ignore sunk costs; include opportunity costs and externalities (cannibalization or positive spillovers); exclude financing costs from cash flows (they're in the discount rate).</li>
<li><strong>Real options</strong> (timing, abandonment, expansion, flexibility, fundamental) add value because management can react to new information. Project NPV = NPV without options + value of options − cost of options.</li></ul>`,
formal:`<h4>Types of capital investments</h4>
<ul><li><strong>Going concern projects:</strong> maintain the business or reduce costs (replacement of equipment).</li>
<li><strong>Regulatory/compliance projects:</strong> required by regulators or insurers; often negative NPV in isolation but necessary.</li>
<li><strong>Expansion projects:</strong> grow the business; more uncertainty and analysis.</li>
<li><strong>Other:</strong> pet projects, high-risk new ventures, R&amp;D.</li></ul>
<h4>Capital allocation process</h4>
<ol><li>Generate investment ideas (the most important step).</li>
<li>Analyze project proposals (forecast cash flows, evaluate).</li>
<li>Create the firm-wide capital budget (prioritize, schedule, fund).</li>
<li>Monitor decisions and conduct a post-audit (compare actual vs forecast; improve forecasting).</li></ol>
<h4>Evaluation methods</h4>
<ul><li><strong>NPV</strong> = Σ CF<sub>t</sub>/(1 + r)<sup>t</sup> − CF₀. Accept if NPV &gt; 0. Additive across projects.</li>
<li><strong>IRR:</strong> discount rate where NPV = 0. Accept if IRR &gt; required return.</li>
<li><strong>NPV vs IRR conflicts</strong> (mutually exclusive projects): scale differences and timing differences can rank projects differently. Use NPV. Non-conventional cash flows can give multiple or no IRRs.</li>
<li><strong>ROIC</strong> = after-tax operating profit / average book value of invested capital (debt + equity). Compare with the cost of capital. Limitations: backward-looking, accounting-based, firm-wide (not project-specific).</li></ul>
<h4>Principles and pitfalls</h4>
<p>Principles: after-tax incremental cash flows; timing; ignore sunk costs; include opportunity costs and externalities. Pitfalls: inertia and static budgets; failing to generate alternatives; pet projects with optimistic assumptions; basing long-term decisions on short-term EPS/ROE; poor cash flow estimation (overhead, inflation); ignoring the cost of internally generated funds.</p>
<h4>Real options</h4>
<ul><li><strong>Timing:</strong> delay to learn more.</li>
<li><strong>Abandonment:</strong> exit if PV(exit) &gt; PV(continue).</li>
<li><strong>Expansion:</strong> invest more if successful.</li>
<li><strong>Flexibility:</strong> price-setting or production-flexibility (e.g., switch inputs, add shifts).</li>
<li><strong>Fundamental:</strong> project payoffs depend on an underlying asset price (e.g., a mine whose value depends on gold).</li></ul>`,
math:`<div class="f"><span class="lbl">Net present value</span>NPV = −CF₀ + CF₁/(1 + r) + CF₂/(1 + r)² + … + CF<sub>n</sub>/(1 + r)<sup>n</sup></div>
<div class="vars"><div><code>CF<sub>t</sub></code><span>Incremental after-tax cash flow at time t</span></div><div><code>r</code><span>Required return (project's cost of capital, adjusted for risk)</span></div></div>
<p><strong>Why it works:</strong> it's the price you'd pay today for the future cash flows minus what you actually pay. The difference is wealth created for shareholders.</p>
<div class="f"><span class="lbl">Internal rate of return</span>0 = −CF₀ + Σ CF<sub>t</sub>/(1 + IRR)<sup>t</sup></div>
<div class="f"><span class="lbl">Return on invested capital</span>ROIC = NOPAT / average invested capital = EBIT(1 − t) / (debt + equity)</div>
<div class="f"><span class="lbl">Profitability index (bonus)</span>PI = PV of future cash flows / initial investment = 1 + NPV/CF₀</div>
<div class="dir"><div>Discount rate <span class="up">↑</span> → NPV <span class="dn">↓</span> (more for long-dated projects)</div><div>NPV &gt; 0 ⇔ IRR &gt; r ⇔ PI &gt; 1 (for conventional independent projects)</div><div>More flexibility (real options) → project value <span class="up">↑</span></div></div>
<div class="calc" data-calc="npv"></div>`,
example:`<div class="q">(a) A project costs $1,000 and returns $300, $400, $500, $200 over four years; cost of capital 10%. Find NPV, IRR and PI. (b) Mutually exclusive: Project A costs $100, returns $150 in one year; Project B costs $1,000, returns $1,250 in one year; r = 10%. Rank by NPV and IRR. (c) A firm has EBIT $150, tax 25%, average invested capital $900, cost of capital 10%. Is it creating value? (d) A $50 consulting study was done last year. Include it?</div>
<ol class="steps"><li><strong>NPV:</strong> 300/1.1 + 400/1.1² + 500/1.1³ + 200/1.1⁴ = 272.73 + 330.58 + 375.66 + 136.60 = 1,115.57 → NPV = <strong>$115.57</strong>. Accept.</li>
<li><strong>IRR</strong> (CF worksheet): ≈ <strong>15.3%</strong> &gt; 10%. <strong>PI</strong> = 1,115.57/1,000 = <strong>1.12</strong>.</li>
<li><strong>A:</strong> NPV = 150/1.1 − 100 = <strong>$36.36</strong>; IRR = <strong>50%</strong>. <strong>B:</strong> NPV = 1,250/1.1 − 1,000 = <strong>$136.36</strong>; IRR = <strong>25%</strong>. IRR prefers A, NPV prefers B. Choose <strong>B</strong>: it adds $100 more to firm value (scale conflict).</li>
<li><strong>ROIC</strong> = 150 × 0.75/900 = 112.5/900 = <strong>12.5%</strong> &gt; 10% → creating value.</li>
<li><strong>Consulting study:</strong> sunk cost → <strong>exclude</strong>.</li></ol>
<p class="ans">Answers: NPV $115.57, IRR ≈ 15.3%, PI 1.12 · choose B by NPV · ROIC 12.5% → value creating · exclude sunk cost</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Choosing the higher-IRR project among mutually exclusive ones. <b>Fix:</b> pick the higher NPV.</li>
<li><b>Trap:</b> Subtracting interest expense from project cash flows. <b>Fix:</b> financing costs are captured in the discount rate.</li>
<li><b>Trap:</b> Including sunk costs or omitting opportunity costs. <b>Fix:</b> only incremental flows; include what you give up (e.g., market value of land you already own).</li>
<li><b>Trap:</b> Ignoring cannibalization. <b>Fix:</b> lost sales from existing products are a negative externality.</li>
<li><b>Trap:</b> Treating regulatory projects as optional when NPV &lt; 0. <b>Fix:</b> they may be required to keep operating.</li>
<li><b>Trap:</b> Assuming a project with negative static NPV must be rejected. <b>Fix:</b> add the value of embedded real options.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute NPV/IRR; accept/reject; NPV vs IRR conflict; identify relevant vs irrelevant cash flows; compute ROIC; order the capital allocation steps; name the real option in a scenario; spot a pitfall.</li>
<li><strong>Calculator:</strong> CF worksheet: CF0 (negative), C01…, then NPV (enter I) and IRR. Clear with 2nd CLR WORK.</li>
<li><strong>Keyword map:</strong> "wait for more information" → timing option; "shut down if…" → abandonment; "add capacity if demand is strong" → expansion; "switch fuel/inputs" → flexibility; "value depends on oil price" → fundamental.</li>
<li><strong>Most important step</strong> in the process: idea generation.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>NPV = wealth created today</b>Positive → do it. Biggest among exclusives → do that one.</div>
<div class="anchor"><b>"IRR loves small and fast"</b>It can favor small or quick projects that add less value.</div>
<div class="anchor"><b>Cash, After-tax, Incremental, No sunk</b>The four rules for relevant cash flows.</div>
<div class="anchor"><b>Options are free gifts with a price tag</b>Flexibility adds value: wait, quit, grow, switch.</div></div>`,
summary:`Capital investments include going-concern (maintenance/cost reduction), regulatory/compliance, expansion and other projects. The capital allocation process is: generate ideas, analyze proposals, build a firm-wide capital budget, and monitor with post-audits. NPV (PV of incremental after-tax cash flows minus the investment) measures the change in firm value: accept positive-NPV projects. IRR (the rate that makes NPV zero) gives the same accept/reject decision for independent conventional projects, but for mutually exclusive projects with different scale or timing, or non-conventional cash flows, rely on NPV (IRR assumes reinvestment at the IRR). ROIC (after-tax operating profit ÷ invested capital) above the cost of capital indicates value creation at the firm level. Use after-tax incremental cash flows, respect timing, ignore sunk costs, include opportunity costs and externalities, and keep financing costs in the discount rate. Pitfalls include inertia, pet projects, short-term EPS focus, poor cash flow estimates and failing to generate alternatives. Real options (timing, abandonment, expansion, flexibility, fundamental) add value beyond static NPV.`
},
quiz:[
{q:"Two mutually exclusive projects: X has NPV $50 and IRR 25%; Y has NPV $80 and IRR 18%. The cost of capital is 12%. The firm should choose:",o:["X, because it has the higher IRR","Y, because it has the higher NPV","both, because both IRRs exceed 12%"],a:1,e:"For mutually exclusive projects, NPV is the correct criterion: Y adds more value."},
