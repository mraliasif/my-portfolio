add({n:16,topic:"econ",title:"Introduction to Geopolitics",
los:["16.a Describe geopolitics from a cooperation versus competition perspective.","16.b Describe geopolitics and its relationship with globalization.","16.c Describe functions and objectives of the international organizations that facilitate trade, including the World Bank, the International Monetary Fund, and the World Trade Organization.","16.d Describe geopolitical risk.","16.e Describe tools of geopolitics and their impact on regions and economies.","16.f Describe the impact of geopolitical risk on investments."],
s:{
eli5:`<p>Think of countries as neighbors on a street. Some neighbors share tools, throw block parties and agree on rules (<strong>cooperation</strong>). Others build tall fences and keep to themselves (<strong>non-cooperation</strong>). Some want to be part of the whole street's life, trading and mixing (<strong>globalization</strong>); others want to do everything themselves (<strong>nationalism</strong>).</p>
<p>When neighbors argue (trade fights, sanctions, even wars), it affects everyone's house prices on the street. Investors call that <strong>geopolitical risk</strong>. Some arguments are scheduled (an election), some come out of nowhere (a sudden invasion), and some are slow-burning (a long rivalry).</p>
<p>There are also "street committees" that help: the IMF lends to neighbors in a cash crunch, the World Bank helps poorer neighbors build things, and the WTO referees trade rules.</p>`,
core:`<p><strong>What problem is this solving?</strong> Investment returns depend not only on economics but on how countries interact: tariffs, sanctions, alliances, wars and treaties change costs, supply chains, capital flows and risk premia. Analysts need a framework to classify and assess these forces.</p>
<ul><li><strong>Cooperation vs competition</strong> is a spectrum, issue by issue. Countries cooperate when interests align (trade, climate) and compete when they don't (security, technology). Motives include national security, access to resources, economic interests, and cultural/ideological factors. Cooperation is more likely with shared standards and repeated interaction.</li>
<li><strong>Actors:</strong> state actors (governments) and non-state actors (multinationals, NGOs, international organizations, individuals) both shape outcomes.</li>
<li><strong>Two axes give four archetypes:</strong> cooperation vs non-cooperation crossed with globalization vs nationalism.</li>
<li><strong>Geopolitical tools:</strong> national security tools (military force, alliances, espionage), economic tools (trade agreements, tariffs, quotas, nationalization), financial tools (currency use, foreign investment rules, sanctions). Each can be cooperative or confrontational.</li>
<li><strong>Risk assessment:</strong> how likely is it, how big an impact, and how fast does it hit markets (velocity)? Investors respond with scenario analysis, diversification, hedging and adjusted risk premia.</li></ul>`,
formal:`<h4>Four archetypes (cooperation × globalization)</h4>
<table><tr><th></th><th>Nationalism</th><th>Globalization</th></tr>
<tr><td><strong>Non-cooperation</strong></td><td><strong>Autarky:</strong> self-sufficiency, state control, minimal trade (e.g., isolated regimes)</td><td><strong>Hegemony:</strong> a dominant power shapes global rules and flows on its own terms</td></tr>
<tr><td><strong>Cooperation</strong></td><td><strong>Bilateralism:</strong> one-to-one deals between two countries</td><td><strong>Multilateralism:</strong> many countries under shared rules (WTO, trade blocs)</td></tr></table>
<p>Globalization brings efficiency, scale, access to markets and capital, and knowledge transfer; drawbacks include job displacement, inequality, supply-chain fragility and exposure to foreign shocks.</p>
<h4>International organizations</h4>
<ul><li><strong>IMF:</strong> promotes international monetary cooperation and exchange rate stability; helps set up international payments systems; lends to members with balance-of-payments problems; surveillance and policy advice.</li>
<li><strong>World Bank:</strong> low-interest loans, interest-free credits and grants to developing countries (infrastructure, education, health); knowledge and public-private partnerships; goal: fight poverty.</li>
<li><strong>WTO:</strong> ensures trade flows freely and smoothly; institutes, interprets and enforces multilateral trade agreements; settles trade disputes.</li></ul>
<h4>Geopolitical risk</h4>
<ul><li><strong>Event risk:</strong> timing known (elections, referendums, scheduled summits).</li>
<li><strong>Exogenous risk:</strong> unanticipated (sudden conflict, coup, terrorist attack, natural disaster with political fallout).</li>
<li><strong>Thematic risk:</strong> known, long-lasting forces (climate change, cyber threats, great-power rivalry, migration).</li>
<li>Assess likelihood, impact (size, breadth) and <strong>velocity</strong> (how fast it affects markets: high velocity → sharp short-term volatility; low velocity → slow, structural, often larger long-run effects).</li></ul>
<h4>Tools and their effects</h4>
<ul><li>National security tools: armed conflict disrupts supply chains, raises commodity prices and risk premia.</li>
<li>Economic tools: tariffs/quotas/subsidies raise costs and reshape trade; nationalization expropriates investors.</li>
<li>Financial tools: sanctions, capital controls and currency restrictions limit access to capital and markets.</li></ul>
<h4>Impact on investments</h4>
<p>Higher volatility and risk premia; sector and regional repricing; supply-chain reconfiguration (reshoring, "friend-shoring"); currency moves; flight to safe-haven assets. Tools: scenario analysis, stress tests, signposts (indicators to monitor), diversification, hedging.</p>`,
math:`<p>No formulas. Use this two-question "calculator" for any scenario.</p>
<div class="f"><span class="lbl">Step 1: classify the archetype</span>Cooperating? (yes/no) × Globalizing? (yes/no) → Multilateralism / Bilateralism / Hegemony / Autarky</div>
<div class="f"><span class="lbl">Step 2: classify the risk</span>Timing known → event &nbsp;·&nbsp; Surprise → exogenous &nbsp;·&nbsp; Long, known force → thematic</div>
<div class="f"><span class="lbl">Step 3: size it</span>Risk importance ≈ likelihood × impact, adjusted for velocity</div>
<div class="dir"><div>High velocity → sharp market drop, may reverse quickly</div><div>Low velocity, high impact → slow structural repricing (often the bigger long-term threat)</div><div>More cooperation/globalization → lower trade costs, higher efficiency, but more contagion</div></div>`,
example:`<div class="q">Classify each: (a) A country pursues self-sufficiency, restricts imports and has few alliances. (b) Two countries sign a free-trade agreement with each other only. (c) Thirty countries adopt common trade rules under an international body. (d) A national election with uncertain outcome next month. (e) A surprise cross-border military strike. (f) Long-running technology rivalry between two large economies. (g) A country with a currency crisis seeks emergency financing; which organization?</div>
<ol class="steps"><li><strong>(a)</strong> Non-cooperation + nationalism → <strong>autarky</strong>.</li>
<li><strong>(b)</strong> Cooperation, one-to-one → <strong>bilateralism</strong>.</li>
<li><strong>(c)</strong> Cooperation + globalization → <strong>multilateralism</strong>.</li>
<li><strong>(d)</strong> Known date → <strong>event risk</strong>.</li>
<li><strong>(e)</strong> Unanticipated → <strong>exogenous risk</strong>, high velocity.</li>
<li><strong>(f)</strong> Persistent, known → <strong>thematic risk</strong>, low velocity, potentially large impact.</li>
<li><strong>(g)</strong> Balance-of-payments problem → <strong>IMF</strong>.</li></ol>
<p class="ans">Answers: autarky · bilateralism · multilateralism · event · exogenous · thematic · IMF</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Mixing up the IMF and the World Bank. <b>Fix:</b> IMF = balance-of-payments/currency stability ("monetary"); World Bank = development and poverty ("building").</li>
<li><b>Trap:</b> Calling hegemony cooperative. <b>Fix:</b> hegemony = non-cooperation + globalization (one power dominates).</li>
<li><b>Trap:</b> Treating an election as exogenous. <b>Fix:</b> scheduled → event risk.</li>
<li><b>Trap:</b> Assuming fast-moving risks are the most damaging. <b>Fix:</b> slow thematic risks can have bigger long-term effects.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> place a scenario in the 2×2 grid; identify the risk type; match an organization to its function; name geopolitical tools; describe investment impact.</li>
<li><strong>Speed:</strong> almost all items are classification. Draw the 2×2 in your head: rows = cooperate?, columns = globalize?</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>The street</b>Fences (non-cooperation) vs block parties (cooperation); shopping local (nationalism) vs everywhere (globalization).</div>
<div class="anchor"><b>A-H-B-M</b>Autarky, Hegemony (alone); Bilateral, Multilateral (together).</div>
<div class="anchor"><b>IMF fixes, WB builds, WTO referees</b>Money crises · development · trade rules.</div>
<div class="anchor"><b>E-E-T</b>Event (on the calendar), Exogenous (out of the blue), Thematic (the long story).</div></div>`,
summary:`Geopolitics is the study of how countries interact, from cooperative to non-cooperative, driven by security, resources, economic interests and culture, with both state and non-state actors. Crossing cooperation with globalization gives four archetypes: autarky (non-cooperative nationalism), hegemony (non-cooperative globalization), bilateralism (cooperative nationalism) and multilateralism (cooperative globalization). The IMF promotes monetary cooperation and exchange-rate stability and lends for balance-of-payments problems; the World Bank finances development to fight poverty; the WTO sets and enforces multilateral trade rules. Geopolitical risk can be event (known timing), exogenous (unanticipated) or thematic (persistent) and is assessed by likelihood, impact and velocity. Tools are national-security, economic (tariffs, trade deals, nationalization) and financial (sanctions, capital and currency restrictions). These affect volatility, risk premia, supply chains, currencies and sector/regional valuations, which investors manage with scenario analysis, signposts, diversification and hedging.`
},
quiz:[
{q:"A dominant country that is non-cooperative but deeply engaged in global trade on its own terms best fits:",o:["autarky","hegemony","multilateralism"],a:1,e:"Non-cooperation + globalization = hegemony."},
{q:"Which organization's primary role is to provide resources to member countries experiencing balance-of-payments problems?",o:["World Bank","International Monetary Fund","World Trade Organization"],a:1,e:"The IMF lends for balance-of-payments problems and promotes exchange rate stability."},
{q:"A scheduled referendum on leaving a trade union is an example of:",o:["event risk","exogenous risk","thematic risk"],a:0,e:"Its timing is known in advance, so it is event risk."}]
});

/* ===================== READING 17 ===================== */
add({n:17,topic:"econ",title:"International Trade",
los:["17.a Describe the benefits and costs of international trade.","17.b Compare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications.","17.c Explain motivations for and advantages of trading blocs, common markets, and economic unions."],
s:{
eli5:`<p>You're great at baking and okay at painting; your friend is terrible at baking but decent at painting. Even if you're better at <em>both</em>, you'll both end up with more cake and more paintings if you bake for both of you and your friend paints for both. That's the magic of <strong>trade</strong>: everyone specializes in what they give up the least to do.</p>
<p>But not everyone wins. The local painter who used to sell you paintings loses business. So governments sometimes protect local producers by adding a tax on imports (a <strong>tariff</strong>) or limiting how much can come in (a <strong>quota</strong>). Local producers smile; shoppers pay more.</p>
<p>Countries also form clubs to trade more easily: some just drop tariffs between members; others go all the way to sharing one currency.</p>`,
core:`<p><strong>What problem is this solving?</strong> Why trade raises total welfare, who wins and loses, what protection costs, and why countries form trading blocs.</p>
<ul><li><strong>Comparative advantage</strong> (lower opportunity cost), not absolute advantage, determines who should produce what. Specialization + trade lets every country consume beyond its own production possibilities.</li>
<li><strong>Extra gains:</strong> economies of scale from serving bigger markets, more product variety, more competition (lower prices, less monopoly power), more efficient resource allocation, technology transfer.</li>
<li><strong>Costs are concentrated, benefits diffuse.</strong> Less efficient domestic producers and their workers lose; unemployment rises during retraining; inequality may increase. But total gains exceed losses, so winners could in principle compensate losers. That's why protection persists politically even though it costs society overall.</li>
<li><strong>Every import restriction has the same core effects</strong> in the importing country: domestic price ↑, imports ↓, domestic production ↑, producer surplus ↑, consumer surplus ↓, deadweight loss. They differ in <em>who captures the "rent"</em>: the government (tariff), license holders (quota), or foreign exporters (voluntary export restraint).</li>
<li><strong>Trading blocs</strong> deepen integration step by step, increasing welfare among members but possibly diverting trade from more efficient outsiders and requiring members to give up policy independence.</li></ul>`,
formal:`<h4>Benefits and costs</h4>
<p>Benefits: specialization by comparative advantage, economies of scale, variety, competition, efficient allocation. Costs: losses for import-competing producers/workers, transitional unemployment, possible greater inequality.</p>
<h4>Trade restrictions (importing country effects)</h4>
<table><tr><th>Restriction</th><th>What it is</th><th>Who gets the extra revenue/rent</th></tr>
<tr><td>Tariff</td><td>Tax on imported goods</td><td>Domestic government</td></tr>
<tr><td>Import quota</td><td>Limit on quantity imported</td><td>Holders of import licenses (domestic or foreign "quota rent"); government if licenses are auctioned</td></tr>
<tr><td>Voluntary export restraint (VER)</td><td>Exporting country limits its own exports (to avoid tariffs/quotas)</td><td>Foreign exporters</td></tr>
<tr><td>Minimum domestic content</td><td>% of product must be domestic</td><td>Domestic suppliers</td></tr>
<tr><td>Export subsidy</td><td>Payment to domestic exporters</td><td>Lowers world export price; benefits importing countries at the exporting government's expense; raises domestic price in exporting country; deadweight loss</td></tr></table>
<p>All import restrictions: ↑ price of imports, ↓ quantity imported, ↑ domestic production, ↑ producer surplus, ↓ consumer surplus, and create deadweight loss (reduced national welfare, unless a large country improves its terms of trade).</p>
<h4>Capital restrictions</h4>
<p>Prohibiting foreign investment in the domestic economy or specific industries, taxing/prohibiting income on foreign investments, restricting repatriation of earnings.</p>
<h4>Trading blocs (each step adds to the previous)</h4>
<ol><li><strong>Free trade area:</strong> no barriers to goods and services among members.</li>
<li><strong>Customs union:</strong> + common external trade policy toward non-members.</li>
<li><strong>Common market:</strong> + free movement of labor and capital.</li>
<li><strong>Economic union:</strong> + common economic institutions and coordinated policy.</li>
<li><strong>Monetary union:</strong> + single currency.</li></ol>
<p>Advantages: larger markets, scale, competition, investment, reduced cross-border costs, political cooperation. Disadvantages: trade diversion, loss of national policy independence, adjustment costs, asymmetric shocks (especially in a monetary union).</p>`,
math:`<div class="f"><span class="lbl">Opportunity cost and comparative advantage</span>Opportunity cost of good X = units of Y given up to make 1 unit of X &nbsp;·&nbsp; lower opportunity cost → comparative advantage</div>
<p><strong>Why it works:</strong> if you're relatively better at X (give up less Y per X), every unit of X you make instead of your partner "frees" more Y for the world. Total output rises even if one country is absolutely better at everything.</p>
<div class="f"><span class="lbl">Tariff welfare accounting (small country)</span>ΔConsumer surplus = −(tariff) × (Q<sub>D,old</sub> + Q<sub>D,new</sub>)/2<br>ΔProducer surplus = +(tariff) × (Q<sub>S,old</sub> + Q<sub>S,new</sub>)/2<br>Government revenue = tariff × imports<sub>new</sub><br>Deadweight loss = −ΔCS − ΔPS − revenue</div>
<div class="dir"><div>Tariff <span class="up">↑</span> → domestic price <span class="up">↑</span>, imports <span class="dn">↓</span>, domestic output <span class="up">↑</span>, consumer surplus <span class="dn">↓</span>, deadweight loss <span class="up">↑</span></div><div>Quota of same size → same price/quantity effects; rent goes to license holders, not government</div></div>`,
example:`<div class="q">(a) In one hour, Country A makes 4 wine or 2 cloth; Country B makes 1 wine or 1 cloth. Who has comparative advantage in what? (b) A small country imports widgets at a world price of $10. Domestic supply is 40 and demand 100. A $2 tariff raises the domestic price to $12, so supply rises to 50 and demand falls to 90. Compute the change in consumer surplus, producer surplus, government revenue and deadweight loss.</div>
<ol class="steps"><li><strong>Opportunity costs:</strong> A: 1 cloth costs 2 wine (1 wine = 0.5 cloth). B: 1 cloth costs 1 wine (1 wine = 1 cloth).</li>
<li><strong>Comparative advantage:</strong> B gives up less wine per cloth → <strong>B: cloth</strong>. A gives up less cloth per wine → <strong>A: wine</strong>, even though A is absolutely better at both.</li>
<li><strong>Consumer surplus:</strong> −2 × (100 + 90)/2 = <strong>−190</strong>.</li>
<li><strong>Producer surplus:</strong> +2 × (40 + 50)/2 = <strong>+90</strong>.</li>
<li><strong>Government revenue:</strong> imports fall from 60 to 40 → 2 × 40 = <strong>+80</strong>.</li>
<li><strong>Deadweight loss:</strong> 190 − 90 − 80 = <strong>20</strong> (the inefficiency from over-producing domestically and under-consuming).</li></ol>
<p class="ans">Answers: A → wine, B → cloth · CS −190, PS +90, revenue +80, DWL 20</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using absolute advantage to decide specialization. <b>Fix:</b> compare opportunity costs.</li>
<li><b>Trap:</b> Thinking quotas raise government revenue. <b>Fix:</b> quota rent goes to license holders (unless licenses are auctioned); VER rent goes to foreign exporters.</li>
<li><b>Trap:</b> Saying export subsidies help the exporting country's consumers. <b>Fix:</b> domestic price in the exporting country rises; foreign consumers benefit.</li>
<li><b>Trap:</b> Mixing up the bloc ladder. <b>Fix:</b> FTA → customs union (common external tariff) → common market (factor mobility) → economic union (institutions) → monetary union (currency).</li>
<li><b>Trap:</b> "Trade restrictions increase national welfare." <b>Fix:</b> for a small country they reduce it (deadweight loss), even though producers gain.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> identify comparative advantage; effects of a tariff/quota/VER/subsidy; who captures rent; welfare areas; order of integration levels; pros/cons of blocs.</li>
<li><strong>Shortcut:</strong> "common external tariff" → customs union; "free movement of labor and capital" → common market; "common currency" → monetary union.</li>
<li><strong>Welfare problems:</strong> use trapezoid areas: tariff × average of old and new quantities.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Baker and painter</b>Specialize where you give up least, not where you're "best".</div>
<div class="anchor"><b>"Prices up, imports down, producers smile, shoppers frown"</b>Every import restriction.</div>
<div class="anchor"><b>Who pockets the rent?</b>Tariff → government; Quota → licensees; VER → foreign exporters.</div>
<div class="anchor"><b>"Free Customers Commonly Eat Money"</b>FTA → Customs union → Common market → Economic union → Monetary union.</div></div>`,
summary:`Free trade raises overall welfare through specialization by comparative advantage (lowest opportunity cost), economies of scale, greater variety, more competition and efficient allocation; its costs fall on less efficient domestic producers and workers (transitional unemployment, possibly more inequality), but gains exceed losses. Tariffs, quotas, voluntary export restraints and minimum domestic content all raise import prices, cut imports, raise domestic output and producer surplus, cut consumer surplus and create deadweight loss; they differ in who captures the rent (government, license holders, foreign exporters). Export subsidies lower export prices, benefiting importing countries at the exporting government's expense. Capital restrictions limit foreign investment, income or repatriation. Trading blocs deepen integration (free trade area → customs union → common market → economic union → monetary union), expanding markets and competition at the cost of trade diversion and lost policy independence.`
},
quiz:[
{q:"Country X can produce 10 cars or 20 computers; Country Y can produce 4 cars or 16 computers. Country Y has a comparative advantage in:",o:["cars","computers","neither"],a:1,e:"Opportunity cost of 1 computer: X = 0.5 car, Y = 0.25 car. Y gives up less → Y specializes in computers."},
{q:"Under a voluntary export restraint, the rent from higher prices accrues primarily to:",o:["the importing country's government","foreign exporters","domestic consumers"],a:1,e:"Exporters sell fewer units at higher prices and keep the difference."},
{q:"A group of countries removes internal trade barriers and adopts common trade policies toward non-members, but restricts movement of labor. This is a:",o:["free trade area","customs union","common market"],a:1,e:"Common external policy without factor mobility = customs union."}]
});

/* ===================== READING 18 ===================== */
add({n:18,topic:"econ",title:"Capital Flows and the FX Market",
los:["18.a Describe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and calculate and interpret the percentage change in a currency relative to another currency.","18.b Describe exchange rate regimes and explain the effects of exchange rates on countries' international trade and capital flows.","18.c Describe common objectives of capital restrictions imposed by governments."],
s:{
eli5:`<p>An exchange rate is just a price tag on a currency. "1.10 USD/EUR" means one euro costs $1.10, exactly like "apples: $1.10 each". The euro is the thing being bought (the <strong>base</strong>); the dollar is what you pay with (the <strong>price</strong> currency).</p>
<p>If the price tag goes from 1.10 to 1.20, euros got more expensive: the euro <em>strengthened</em> and the dollar <em>weakened</em>.</p>
<p>But a stronger euro on the tag doesn't tell you whether a European can buy more <em>stuff</em> in America. If American prices also jumped, a euro might not go any further. The <strong>real</strong> exchange rate adjusts for that: it's about how many baskets of goods, not how many banknotes.</p>`,
core:`<p><strong>What problem is this solving?</strong> Cross-border trade and investment require swapping currencies, and the swap rate changes constantly. Investors and companies need to read quotes correctly, measure currency moves, understand the regime a currency lives under, and see how exchange rates feed back into trade and capital flows.</p>
<ul><li><strong>Quote convention:</strong> A/B = units of A per one unit of B. B is the base, A the price currency. Rate ↑ = base currency appreciates.</li>
<li><strong>Appreciation and depreciation are not symmetric percentages</strong> because the base flips. If the euro falls 1.39% against the dollar, the dollar rises 1.41% against the euro.</li>
<li><strong>Real exchange rate</strong> = nominal rate adjusted for relative price levels. A rise means the base country's goods became relatively more expensive (less competitive).</li>
<li><strong>Market:</strong> the largest financial market by daily turnover; sell side (big dealer banks) and buy side (corporations, real and leveraged money managers, governments, central banks, retail). Hedgers reduce existing FX exposure; speculators take on exposure.</li>
<li><strong>Regimes range from no own currency to free float.</strong> Harder pegs deliver stability and import credibility but sacrifice monetary independence; floats preserve independence but bring volatility (the "impossible trinity": you can't have a fixed rate, free capital flows and independent monetary policy all at once).</li>
<li><strong>Exchange rates and trade:</strong> depreciation makes exports cheaper and imports dearer, improving the trade balance if demand is elastic enough (Marshall-Lerner), often after an initial worsening (J-curve). The trade balance also equals the gap between national saving and investment.</li></ul>`,
formal:`<h4>FX market basics</h4>
<ul><li><strong>Spot</strong> (immediate, usually T+2) vs <strong>forward</strong> (future delivery at a rate agreed today); also FX swaps, futures, options.</li>
<li>Functions: facilitate trade and investment, allow hedging, allow speculation.</li>
<li>Participants: sell side (dealer banks) and buy side (corporations, real money and leveraged accounts, retail, governments, central banks, sovereign wealth funds).</li></ul>
<h4>Nominal vs real</h4>
<p>Real exchange rate (price/base) = nominal (price/base) × (CPI<sub>base</sub> / CPI<sub>price</sub>). It measures relative purchasing power. Real appreciation of the base currency → its goods less competitive abroad.</p>
<h4>Exchange rate regimes (hardest to softest)</h4>
<ol><li><strong>No separate legal tender:</strong> formal dollarization (uses another country's currency); monetary union (shared currency, e.g., euro).</li>
<li><strong>Currency board:</strong> legal commitment to exchange domestic currency at a fixed rate, fully backed by reserves.</li>
<li><strong>Conventional fixed peg:</strong> within ±1% of a currency or basket; central bank intervenes.</li>
<li><strong>Target zone (horizontal bands):</strong> wider bands, e.g., ±2%.</li>
<li><strong>Crawling peg:</strong> peg adjusted periodically (e.g., for inflation differentials).</li>
<li><strong>Crawling bands:</strong> band width widened over time (path to floating).</li>
<li><strong>Managed float:</strong> authorities influence the rate in response to indicators (BoP, inflation, employment), no specific target.</li>
<li><strong>Independent float:</strong> market-determined.</li></ol>
<h4>Exchange rates, trade and capital flows</h4>
<ul><li>Trade balance identity: X − M = (S − I) + (T − G). A current account deficit must be financed by capital inflows (financial account surplus).</li>
<li><strong>Elasticities approach (Marshall-Lerner):</strong> depreciation improves the trade balance if export and import demand elasticities are large enough. J-curve: short-run worsening, then improvement.</li>
<li><strong>Absorption approach:</strong> improvement requires domestic income to rise relative to spending (saving ↑).</li>
<li>Capital flows respond to interest differentials and expected returns; large inflows can appreciate the currency and fuel asset bubbles; sudden reversals cause crises.</li></ul>
<h4>Capital restrictions: objectives</h4>
<p>Reduce volatility of domestic asset prices; maintain fixed exchange rates; keep domestic interest rates low and preserve monetary independence; protect strategic industries from foreign ownership. Costs: misallocated capital, reduced investment, retaliation, evasion.</p>`,
math:`<div class="f"><span class="lbl">% change in the base currency</span>%Δ base = (new rate / old rate) − 1</div>
<div class="f"><span class="lbl">% change in the price currency</span>%Δ price currency = (old rate / new rate) − 1</div>
<p><strong>Why the flip?</strong> The price currency's value is the <em>inverse</em> of the quote. Inverting before taking the % change is all you're doing.</p>
<div class="f"><span class="lbl">Real exchange rate</span>Real<sub>P/B</sub> = Nominal<sub>P/B</sub> × CPI<sub>B</sub> / CPI<sub>P</sub></div>
<div class="vars"><div><code>P/B</code><span>Price currency per unit of base currency</span></div><div><code>CPI<sub>B</sub></code><span>Price level in the base currency's country</span></div><div><code>CPI<sub>P</sub></code><span>Price level in the price currency's country</span></div></div>
<div class="f"><span class="lbl">Balance of payments identity</span>X − M = (S − I) + (T − G)</div>
<div class="dir"><div>Quote <span class="up">↑</span> → base currency <span class="up">appreciates</span>, price currency depreciates</div><div>Base country inflation <span class="up">↑</span> (nominal unchanged) → real rate <span class="up">↑</span> → base country loses competitiveness</div><div>Domestic currency <span class="dn">depreciates</span> → exports <span class="up">↑</span>, imports <span class="dn">↓</span> (after a J-curve lag, if Marshall-Lerner holds)</div></div>`,
example:`<div class="q">(a) USD/EUR moves from 1.4400 to 1.4200. By what % did the euro change against the dollar, and the dollar against the euro? (b) Nominal USD/EUR = 1.10; the euro area CPI is 105 and the US CPI is 110 (same base year). Find the real USD/EUR rate and interpret. (c) A country runs a budget deficit of 3% of GDP and private saving exceeds investment by 1% of GDP. What is its trade balance?</div>
<ol class="steps"><li><strong>Euro (base):</strong> 1.42/1.44 − 1 = <strong>−1.39%</strong> (depreciated).</li>
<li><strong>Dollar (price):</strong> 1.44/1.42 − 1 = <strong>+1.41%</strong> (appreciated). Not the same magnitude.</li>
<li><strong>Real rate:</strong> 1.10 × 105/110 = <strong>1.05</strong>. US prices rose more than euro-area prices, so a euro buys fewer US goods than the nominal 1.10 suggests: in real terms the euro is weaker (euro-area goods relatively more competitive).</li>
<li><strong>Trade balance:</strong> X − M = (S − I) + (T − G) = +1% + (−3%) = <strong>−2% of GDP</strong> (deficit, financed by capital inflows).</li></ol>
<p class="ans">Answers: EUR −1.39%, USD +1.41% · real 1.05 · trade deficit 2% of GDP</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Reading USD/EUR 1.10 as "euros per dollar". <b>Fix:</b> A/B = units of A per one B, so USD/EUR 1.10 = $1.10 per €1.</li>
<li><b>Trap:</b> Assuming the price currency's % change = −(base change). <b>Fix:</b> compute old/new − 1.</li>
<li><b>Trap:</b> Inverting the CPI ratio in the real rate. <b>Fix:</b> CPI of the <em>base</em> on top.</li>
<li><b>Trap:</b> Calling a currency board a "soft" peg. <b>Fix:</b> it's among the hardest (legal commitment, full reserve backing).</li>
<li><b>Trap:</b> Expecting depreciation to improve the trade balance immediately. <b>Fix:</b> J-curve; and only if Marshall-Lerner holds.</li>
<li><b>Trap:</b> Calling an exporter who sells forward FX a speculator. <b>Fix:</b> reducing existing exposure = hedger.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> % appreciation/depreciation; real exchange rate calculation and interpretation; rank regimes by flexibility; trade effects of a currency move; identify hedger vs speculator; objectives of capital controls.</li>
<li><strong>Habit:</strong> write the quote as a fraction with units (USD over EUR) before any calculation. It prevents 90% of errors.</li>
<li><strong>Regime pattern:</strong> "legal commitment + reserve backing" → currency board; "periodic adjustments" → crawling peg; "intervenes without target" → managed float.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Price tag on the base</b>A/B = price of one B in A. Tag up → B stronger.</div>
<div class="anchor"><b>Flip before you percent</b>Price currency % = old/new − 1.</div>
<div class="anchor"><b>Real = baskets, not banknotes</b>Adjust by CPI<sub>base</sub>/CPI<sub>price</sub>.</div>
<div class="anchor"><b>Impossible trinity</b>Pick two: fixed rate, open capital, independent policy.</div>
<div class="anchor"><b>Hedge reduces, speculate adds</b>Exposure direction defines the participant.</div></div>`,
summary:`An exchange rate A/B is the price of one unit of the base currency B in the price currency A; a higher quote means the base appreciates. The base's % change is new/old − 1, the price currency's is old/new − 1. The real exchange rate = nominal × CPI<sub>base</sub>/CPI<sub>price</sub> and measures relative purchasing power and competitiveness. The FX market, the world's largest, includes sell-side dealers and buy-side corporations, investors, governments and central banks; hedgers reduce FX exposure, speculators add it. Regimes range from no own currency (dollarization, monetary union) through currency boards, fixed pegs, target zones, crawling pegs and crawling bands to managed and independent floats, trading stability against monetary independence. Depreciation raises exports and lowers imports (if Marshall-Lerner holds, often after a J-curve), and X − M = (S − I) + (T − G) links trade balances to saving and capital flows. Capital restrictions aim to reduce asset-price volatility, defend pegs, keep rates low with policy independence, and protect strategic industries.`
},
quiz:[
{q:"The JPY/USD rate rises from 140 to 150. The yen has:",o:["appreciated 7.14%","depreciated 6.67%","depreciated 7.14%"],a:1,e:"USD (base) +7.14%. Yen (price currency): 140/150 − 1 = −6.67%."},
{q:"A country commits by law to exchange its currency for US dollars at a fixed rate and holds dollar reserves to back the entire monetary base. This regime is a:",o:["conventional fixed peg","currency board","crawling peg"],a:1,e:"Legal commitment plus full reserve backing defines a currency board."},
{q:"An exporter expecting euro receipts sells euros forward. This participant is a:",o:["hedger","speculator","market maker"],a:0,e:"The forward sale reduces existing FX risk, so it's hedging."}]
});

/* ===================== READING 19 ===================== */
add({n:19,topic:"econ",title:"Exchange Rate Calculations",
los:["19.a Calculate and interpret currency cross-rates.","19.b Explain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in percentage terms, and interpret a forward discount or premium."],
s:{
eli5:`<p>If 1 apple = 2 oranges, and 1 orange = 3 grapes, then 1 apple = 6 grapes. You didn't need an apple-to-grape price list. That's a <strong>cross rate</strong>: chain two exchange rates through a common currency.</p>
<p>Now the future. Say euros earn 4% interest and dollars earn 3%. If you could swap dollars for euros today, earn 4%, and lock in a swap back at today's rate, you'd beat the 3% dollar rate for free. The market won't allow free money, so the <strong>forward</strong> rate for euros must be <em>lower</em> than today's rate, by just enough to wipe out the extra 1%. The higher-interest currency trades at a forward <strong>discount</strong>.</p>`,
core:`<p><strong>What problem is this solving?</strong> Companies and investors need rates between any currency pair and need to lock in rates for future dates. Both come from no-arbitrage logic.</p>
<ul><li><strong>Cross rates:</strong> line up the units so the common currency cancels, like fractions. (MXN/USD) × (USD/EUR) = MXN/EUR. If the quotes don't line up, invert one first.</li>
<li><strong>Covered interest rate parity</strong> is a no-arbitrage condition, not a forecast. Two ways to end up with base currency in the future must cost the same: (1) invest in the price currency and convert at the forward rate, or (2) convert now and invest in the base currency.</li>
<li><strong>Intuition:</strong> the forward rate "absorbs" the interest differential. The higher-yielding currency trades at a forward discount; the lower-yielding at a forward premium. Otherwise borrow the cheap currency, invest the dear one, lock in the forward, profit risk-free.</li>
<li><strong>Points:</strong> dealers quote forwards as a spread from spot (forward points) in units of the last decimal place; a percentage quote gives the same thing as F/S − 1.</li>
<li><strong>Forward ≠ forecast:</strong> forward rates are poor predictors of future spot rates; they simply reflect today's interest differential.</li></ul>`,
formal:`<h4>Cross rates</h4>
<p>Given A/B and B/C: A/C = (A/B) × (B/C). Given A/B and C/B: A/C = (A/B) ÷ (C/B). Always check that the common currency cancels.</p>
<h4>No-arbitrage forward rate</h4>
<p>F/S = (1 + i<sub>price</sub> × T)/(1 + i<sub>base</sub> × T) with T = days/360 (money market convention), so F = S × (1 + i<sub>price</sub>T)/(1 + i<sub>base</sub>T). For annual compounding over whole years: F = S × [(1 + i<sub>price</sub>)/(1 + i<sub>base</sub>)]<sup>T</sup>.</p>
<ul><li>If i<sub>base</sub> &gt; i<sub>price</sub> → F &lt; S → base currency at a forward <strong>discount</strong>.</li>
<li>If i<sub>base</sub> &lt; i<sub>price</sub> → F &gt; S → base currency at a forward <strong>premium</strong>.</li></ul>
<h4>Quoting forwards</h4>
<ul><li><strong>Points:</strong> F = S + points/10,000 for 4-decimal quotes (÷100 for 2-decimal quotes like JPY). Positive points → premium; negative → discount.</li>
<li><strong>Percentage:</strong> F = S × (1 + %). Forward premium/discount = F/S − 1.</li></ul>
<h4>Arbitrage when the quoted forward is wrong</h4>
<p>If the quoted forward ≠ parity forward: borrow the currency that is "too cheap" to repay in forward terms, convert at spot, invest, and convert back at the forward. If F<sub>quoted</sub> &gt; F<sub>parity</sub>, the base currency is overpriced forward → sell base forward (borrow price currency, buy base spot, invest, sell base forward).</p>`,
math:`<div class="f"><span class="lbl">Cross rate</span>A/C = (A/B) × (B/C)</div>
<div class="f"><span class="lbl">Covered interest parity</span>F<sub>P/B</sub> = S<sub>P/B</sub> × (1 + i<sub>P</sub> × days/360) / (1 + i<sub>B</sub> × days/360)</div>
<div class="vars"><div><code>P/B</code><span>Price currency per unit of base currency</span></div><div><code>i<sub>P</sub></code><span>Interest rate in the price currency (numerator, like the quote)</span></div><div><code>i<sub>B</sub></code><span>Interest rate in the base currency (denominator)</span></div></div>
<p><strong>Why it works:</strong> 1 unit of base currency today grows to (1 + i<sub>B</sub>T) units of base. Converted at spot it's S units of price currency, growing to S(1 + i<sub>P</sub>T). Both are the same money at the same date, so F × (1 + i<sub>B</sub>T) = S × (1 + i<sub>P</sub>T).</p>
<div class="f"><span class="lbl">Points and premium</span>Forward points = (F − S) × 10,000 &nbsp;·&nbsp; Premium/discount = F/S − 1 ≈ i<sub>P</sub> − i<sub>B</sub> (for short periods)</div>
<div class="dir"><div>i<sub>base</sub> <span class="up">↑</span> → F <span class="dn">↓</span> (discount deepens)</div><div>Longer maturity → larger premium/discount (differential applies for longer)</div><div>Equal interest rates → F = S</div></div>
<div class="calc" data-calc="cross"></div>
<div class="calc" data-calc="fx"></div>`,
example:`<div class="q">(a) MXN/USD = 12.10 and USD/EUR = 1.42. Find MXN/EUR. (b) EUR/USD = 0.90 and JPY/USD = 150. Find JPY/EUR. (c) Spot USD/EUR = 1.2500; 1-year USD rate 3%, EUR rate 4%. Find the 1-year forward. (d) Same spot and rates, 180 days (360-day basis): forward and points. (e) If a dealer quotes the 1-year forward at 1.2500, show the arbitrage on €1m.</div>
<ol class="steps"><li><strong>MXN/EUR</strong> = 12.10 × 1.42 = <strong>17.18</strong> (USD cancels).</li>
<li><strong>JPY/EUR</strong> = (JPY/USD) ÷ (EUR/USD) = 150/0.90 = <strong>166.67</strong>. The USD is the base in both, so divide.</li>
<li><strong>1-year forward</strong> = 1.25 × 1.03/1.04 = <strong>1.2380</strong>. EUR (higher rate) at a forward discount.</li>
<li><strong>180-day</strong> = 1.25 × (1 + 0.03 × 0.5)/(1 + 0.04 × 0.5) = 1.25 × 1.015/1.02 = <strong>1.2439</strong> → points = (1.2439 − 1.2500) × 10,000 ≈ <strong>−61.3</strong>; discount = −0.49%.</li>
<li><strong>Arbitrage:</strong> quoted 1.2500 &gt; fair 1.2380 → euro overpriced forward → sell EUR forward. Borrow $1.25m at 3%, buy €1m spot, invest at 4% → €1.04m; sell forward at 1.25 → $1.300m; repay $1.25m × 1.03 = $1.2875m → riskless profit <strong>$12,500</strong>.</li></ol>
<p class="ans">Answers: 17.18 · 166.67 · 1.2380 · 1.2439 (−61.3 points) · $12,500 profit</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Multiplying when you should divide in cross rates. <b>Fix:</b> write units as fractions and make the common currency cancel.</li>
<li><b>Trap:</b> Putting the base-currency rate in the numerator. <b>Fix:</b> numerator rate matches the quote's numerator (price currency).</li>
<li><b>Trap:</b> Using 365 days when the question uses a 360-day convention (or forgetting to scale rates for the period). <b>Fix:</b> T = days/360 unless told otherwise.</li>
<li><b>Trap:</b> Dividing points by 10,000 for JPY quotes. <b>Fix:</b> scale by the quote's decimal places (two decimals → ÷100).</li>
<li><b>Trap:</b> Saying the higher-rate currency trades at a forward premium. <b>Fix:</b> higher rate → forward <em>discount</em>.</li>
<li><b>Trap:</b> Treating forward rates as forecasts. <b>Fix:</b> they're no-arbitrage prices, poor predictors of future spot.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> cross rate (with or without inversion); forward from interest rates; forward from points or %; identify premium/discount; describe the arbitrage steps.</li>
<li><strong>Sanity check:</strong> before computing, decide direction: which currency has the higher rate? It must be at a discount. Eliminate wrong choices instantly.</li>
<li><strong>Approximation:</strong> % premium ≈ (i<sub>price</sub> − i<sub>base</sub>) × T. Quick way to pick an answer when choices are spread apart.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Apples → oranges → grapes</b>Chain rates so the middle unit cancels.</div>
<div class="anchor"><b>"Price on top, base below"</b>F = S × (1 + i<sub>price</sub>)/(1 + i<sub>base</sub>), same layout as the quote.</div>
<div class="anchor"><b>High yield, low forward</b>Higher-interest currency trades at a forward discount.</div>
<div class="anchor"><b>No free lunch</b>Forward exists to kill arbitrage, not to predict.</div></div>`,
summary:`Cross rates come from chaining two quotes so the common currency cancels (A/C = A/B × B/C, inverting a quote when needed). Covered interest rate parity is a no-arbitrage condition: F = S × (1 + i<sub>price</sub>T)/(1 + i<sub>base</sub>T), so the currency with the higher interest rate trades at a forward discount and the lower-rate currency at a forward premium. Forward rates are quoted in points (added to spot after scaling by the quote's decimal places) or as a percentage (F = S(1 + %)); the premium or discount on the base is F/S − 1. If a quoted forward deviates from parity, borrowing one currency, converting at spot, investing and converting back at the forward yields riskless profit. Forward rates reflect interest differentials and are poor predictors of future spot rates.`
},
quiz:[
{q:"CAD/USD = 1.35 and USD/GBP = 1.25. The CAD/GBP cross rate is closest to:",o:["1.08","1.69","0.93"],a:1,e:"CAD/USD × USD/GBP = 1.35 × 1.25 = 1.6875 (USD cancels)."},
{q:"Spot USD/AUD = 0.6500. US rates are 5%, Australian rates 3% (1 year). The AUD will trade at a forward:",o:["premium; forward ≈ 0.6626","discount; forward ≈ 0.6376","premium; forward ≈ 0.6376"],a:0,e:"AUD (base) has the lower rate → premium. F = 0.65 × 1.05/1.03 = 0.6626."},
{q:"Spot GBP/EUR = 0.8600 and the 3-month forward is quoted at +18.5 points. The forward rate is:",o:["0.8785","0.86185","0.8418"],a:1,e:"0.8600 + 18.5/10,000 = 0.86185."}]
});

add({n:20,topic:"cf",title:"Organizational Forms, Corporate Issuer Features, and Ownership",
los:["20.a Compare the organizational forms of businesses.","20.b Describe key features of corporate issuers.","20.c Compare publicly and privately owned corporate issuers."],
s:{
eli5:`<p>You start selling cupcakes alone: that's a <strong>sole proprietorship</strong>. You keep all the profit, but if you get sued or go broke, they can take your car and house, because legally you <em>are</em> the business.</p>
<p>You team up with a friend: a <strong>partnership</strong>. Same deal, but shared. Some partners can be "silent" investors whose risk is capped (a <strong>limited</strong> partnership), but at least one must be fully on the hook.</p>
<p>Want to grow big, raise lots of money and protect your house? Form a <strong>corporation</strong>: a separate legal "person". Owners (shareholders) can only lose what they put in. The price: profits can get taxed twice, once at the company and again when paid to you as dividends.</p>
<p>A corporation can be <strong>private</strong> (shares held by a few) or <strong>public</strong> (shares trade on a stock exchange, so anyone can buy, but you must publish lots of information).</p>`,
core:`<p><strong>What problem is this solving?</strong> Every business must decide how to balance <em>control</em>, <em>liability</em>, <em>access to capital</em> and <em>taxes</em>. The legal form is that decision, and it shapes who an investor is actually dealing with.</p>
<ul><li><strong>The core trade-off:</strong> as you move from sole proprietorship → partnership → corporation, owners gain limited liability and access to capital but give up direct control (separation of ownership and management) and may face double taxation.</li>
<li><strong>Separation of ownership and control</strong> in corporations creates the principal-agent problem (Reading 22): shareholders elect a board, the board hires managers.</li>
<li><strong>Going public</strong> unlocks deep, liquid capital markets and a market price for the shares, at the cost of listing requirements, disclosure, regulatory compliance and short-term market scrutiny. Staying private keeps control and confidentiality but limits liquidity and capital.</li>
<li><strong>Routes to public:</strong> IPO (new shares sold, raises capital), direct listing (existing shares listed, no new capital), acquisition by a public company or SPAC. <strong>Going private:</strong> leveraged buyouts, management buyouts.</li></ul>`,
formal:`<h4>Organizational forms</h4>
<table><tr><th>Feature</th><th>Sole proprietorship</th><th>General partnership</th><th>Limited partnership</th><th>Corporation</th></tr>
<tr><td>Separate legal entity?</td><td>No</td><td>No</td><td>No</td><td>Yes</td></tr>
<tr><td>Managed by</td><td>Owner</td><td>Partners</td><td>General partners (GPs)</td><td>Board and managers</td></tr>
<tr><td>Owner liability</td><td>Unlimited</td><td>Unlimited</td><td>GPs unlimited; LPs limited</td><td>Limited</td></tr>
<tr><td>Access to capital</td><td>Limited</td><td>Limited</td><td>Limited</td><td>Virtually unlimited</td></tr>
<tr><td>Taxation of profits</td><td>Pass-through (personal income)</td><td>Pass-through</td><td>Pass-through</td><td>Potential double taxation</td></tr></table>
<p>Some jurisdictions offer hybrids (e.g., LLCs, S corporations) combining limited liability with pass-through taxation, usually with ownership limits.</p>
<h4>Key features of corporate issuers</h4>
<ul><li>Separate legal identity created by registering with a regulator; can own assets, sign contracts, sue and be sued, and has perpetual life.</li>
<li>Shareholders have limited liability, elect the board, vote on major matters, and receive dividends declared by the board.</li>
<li>Separation of ownership and management; profits may be taxed at corporate level and again as dividends/capital gains.</li>
<li>Can issue many classes of securities (common, preferred, debt).</li></ul>
<h4>Public vs private</h4>
<table><tr><th></th><th>Public (listed)</th><th>Private</th></tr>
<tr><td>Share trading</td><td>On an exchange; free float = actively traded shares (fraction of total outstanding)</td><td>No public market; illiquid</td></tr>
<tr><td>Capital raising</td><td>Public offerings; secondary offerings; broad investor base</td><td>Private placements (accredited/institutional investors), venture capital, private equity</td></tr>
<tr><td>Disclosure</td><td>Extensive, regulated; periodic reports</td><td>Limited; negotiated with investors</td></tr>
<tr><td>Valuation</td><td>Observable market price</td><td>Estimated; less transparent</td></tr></table>
<p><strong>Private → public:</strong> IPO (underwritten, new shares, capital raised), direct listing (no new shares, no underwriter), merger with a public company or special purpose acquisition company (SPAC). <strong>Public → private:</strong> buyouts (LBO/MBO).</p>`,
math:`<p>Little formal math here, but tax and liability comparisons are worth quantifying.</p>
<div class="f"><span class="lbl">Double taxation (corporation)</span>After-tax to owner = Pre-tax profit × (1 − t<sub>corp</sub>) × (1 − t<sub>dividend</sub>)<br>Effective tax rate = 1 − (1 − t<sub>corp</sub>)(1 − t<sub>dividend</sub>)</div>
<div class="f"><span class="lbl">Pass-through (proprietorship/partnership)</span>After-tax to owner = Pre-tax profit × (1 − t<sub>personal</sub>)</div>
<p><strong>Why it matters:</strong> two layers compound, so even moderate rates produce a high combined rate; this is the price of limited liability and capital access.</p>
<div class="f"><span class="lbl">Free float</span>Free float % = shares available for public trading / total shares outstanding</div>
<div class="dir"><div>Move toward corporation → liability <span class="dn">↓</span>, capital access <span class="up">↑</span>, owner control <span class="dn">↓</span>, tax layers <span class="up">↑</span></div><div>Free float <span class="dn">↓</span> → liquidity <span class="dn">↓</span>, index weight (float-adjusted) <span class="dn">↓</span></div></div>`,
example:`<div class="q">A business earns $100 pre-tax. (a) As a corporation (25% corporate tax) paying all profits as dividends (20% dividend tax), what does the owner keep and what is the effective tax rate? (b) As a partnership with a 35% personal tax rate? (c) A founder wants to raise substantial capital, protect personal assets, and is willing to disclose information. Which form and route? (d) A company lists existing shares on an exchange without issuing new ones or hiring an underwriter. What is this?</div>
<ol class="steps"><li><strong>Corporation:</strong> 100 × 0.75 = 75 after corporate tax; 75 × 0.80 = <strong>$60</strong> kept. Effective rate = 1 − 0.75 × 0.80 = <strong>40%</strong>.</li>
<li><strong>Partnership:</strong> 100 × 0.65 = <strong>$65</strong> kept (35%). Pass-through wins on tax here, but partners have unlimited liability.</li>
<li><strong>Form:</strong> corporation (limited liability, virtually unlimited capital access) and an <strong>IPO</strong> to raise new capital publicly.</li>
<li><strong>Direct listing:</strong> no new capital raised, no underwriter.</li></ol>
<p class="ans">Answers: $60 (40% effective) · $65 (35%) · corporation via IPO · direct listing</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Assuming limited partners manage the business. <b>Fix:</b> GPs manage and have unlimited liability; LPs are passive with limited liability.</li>
<li><b>Trap:</b> Thinking a direct listing raises capital. <b>Fix:</b> it only lists existing shares.</li>
<li><b>Trap:</b> Believing all corporate profits are always double-taxed. <b>Fix:</b> "potential" double taxation; depends on jurisdiction and distributions.</li>
<li><b>Trap:</b> Confusing free float with shares outstanding. <b>Fix:</b> free float excludes closely held/restricted shares.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> fill in the forms comparison table; identify the form from a description; public vs private characteristics; IPO vs direct listing vs SPAC; double taxation arithmetic.</li>
<li><strong>Keyword map:</strong> "unlimited liability + pass-through" → proprietorship/partnership. "Separate legal entity + board" → corporation. "No new capital, no underwriter" → direct listing. "Shell company that acquires a private firm" → SPAC.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>"You are the business"</b>Proprietorships and partnerships: no legal separation → unlimited liability.</div>
<div class="anchor"><b>Corporation = legal person</b>Lives forever, sues and is sued, shields owners.</div>
<div class="anchor"><b>Limited liability's price tag</b>Possible double tax + loss of direct control.</div>
<div class="anchor"><b>IPO raises, direct listing lists</b>New money vs just a ticker.</div></div>`,
summary:`Sole proprietorships and partnerships are not separate legal entities: owners (or general partners) manage the business, bear unlimited liability, have limited access to capital and are taxed on a pass-through basis; limited partners have limited liability but no management role. Corporations are separate legal entities registered with a regulator: shareholders have limited liability and elect a board that hires management (separating ownership from control), capital access is virtually unlimited, and profits face potential double taxation. Public companies list shares on an exchange (free float = actively traded fraction), gaining liquidity and capital access in exchange for regulatory compliance and extensive disclosure; private companies raise capital through private placements, VC and PE with less disclosure and liquidity. Private firms go public via IPO (new capital), direct listing (no new capital) or acquisition by a public company or SPAC; public firms go private through buyouts.`
},
quiz:[
{q:"Which business form provides limited liability for all owners?",o:["General partnership","Limited partnership","Corporation"],a:2,e:"In a limited partnership at least one GP has unlimited liability; in a corporation all shareholders have limited liability."},
{q:"A private company becomes public by listing its existing shares on an exchange without raising new capital. This is a(n):",o:["initial public offering","direct listing","leveraged buyout"],a:1,e:"Direct listing = existing shares only, no new capital, typically no underwriter."},
{q:"Corporate profits are taxed at 30% and dividends at 15%. The effective tax rate on profits paid out as dividends is closest to:",o:["40.5%","45.0%","35.0%"],a:0,e:"1 − 0.70 × 0.85 = 1 − 0.595 = 40.5%."}]
});
