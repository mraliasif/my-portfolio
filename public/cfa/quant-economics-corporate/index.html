add({n:11,topic:"quant",title:"Introduction to Financial Data Science",
los:["11.a Describe how big data, machine learning, and artificial intelligence are used in financial data science, fintech, and investment management."],
s:{
eli5:`<p>Imagine trying to guess if a shop will have a good month. Old way: read its sales report. New way: count cars in its parking lot from satellite photos, read thousands of online reviews, and track how many people tap its app. That's <strong>big data</strong>: huge, fast, messy, all-kinds-of-shapes information.</p>
<p>No human can read all that, so we teach computers to find patterns. That's <strong>machine learning</strong>: you show the computer lots of examples ("these were good months, these were bad") and it learns a rule. If you show it examples with answers, it's <em>supervised</em>; if you just say "find groups in this", it's <em>unsupervised</em>; if it learns by trial-and-error with rewards, it's <em>reinforcement</em>.</p>
<p>The danger: a student who memorizes last year's exam answers word for word aces that exam and fails the new one. A model that memorizes noise is <strong>overfit</strong>.</p>`,
core:`<p><strong>What problem is this solving?</strong> Information edges in investing come from processing more data, faster and better. Traditional analysis can't handle text, images, sensor feeds or billions of transactions. Data science provides the pipeline (capture → curate → store → search → transfer → model → present) and ML provides pattern-finding at scale.</p>
<ul><li><strong>Big data's 4 V's:</strong> volume (size), velocity (speed of arrival), variety (structured, semi-structured, unstructured), veracity (reliability). Veracity is the investor's big worry: alternative data can be noisy or biased.</li>
<li><strong>Alternative data sources:</strong> individuals (social media, reviews, web searches), business processes (transactions, credit card data, supply-chain records), sensors/IoT (satellites, geolocation).</li>
<li><strong>AI ⊃ ML ⊃ neural networks / deep learning.</strong> AI simulates human cognition; ML improves at a task with experience; neural networks capture nonlinear relationships through hidden layers.</li>
<li><strong>Generalization is everything.</strong> Data are split into training (largest), validation (tune the model) and test (final unbiased check). For time series, split by time (time-based split, rolling windows) so the model never "sees the future".</li>
<li><strong>Two failure modes:</strong> overfitting (treats noise as signal: great in-sample, poor out-of-sample) and underfitting (misses real signal: poor everywhere).</li></ul>`,
formal:`<h4>Definitions</h4>
<ul><li><strong>Financial data science:</strong> quantitative and qualitative analysis of financial information. <strong>Fintech:</strong> technology applied to financial services.</li>
<li><strong>Data mining:</strong> finding patterns in large datasets to predict outputs.</li>
<li><strong>Structured</strong> (tables), <strong>semi-structured</strong> (HTML, JSON), <strong>unstructured</strong> (text, images, audio) data.</li></ul>
<h4>Machine learning types</h4>
<table><tr><th>Type</th><th>Data</th><th>Typical tasks</th></tr>
<tr><td>Supervised</td><td>Labeled inputs and outputs</td><td>Regression (predict a number), classification (predict a category, e.g., default/no default)</td></tr>
<tr><td>Unsupervised</td><td>Inputs only, no labels</td><td>Clustering (group similar stocks), dimension reduction</td></tr>
<tr><td>Reinforcement</td><td>An agent acting in an environment, receiving rewards</td><td>Learning trading/execution policies by trial and error</td></tr></table>
<h4>Neural networks and deep learning</h4>
<p>Input layer → one or more hidden layers (nodes apply weights and nonlinear activation functions) → output layer. <strong>Backpropagation</strong> computes the loss and its gradient and adjusts each neuron's weights to minimize the loss. Deep learning = many hidden layers; strong for images, speech, text.</p>
<h4>Model validation</h4>
<ul><li>Training set (largest) fits the model; validation set tunes hyperparameters and checks fit; test set measures out-of-sample performance.</li>
<li>Time-series data: time-based split, rolling-window validation (avoid look-ahead bias).</li>
<li>Overfitting: too complex, learns noise → low in-sample error, high out-of-sample error. Underfitting: too simple → high error on both.</li></ul>
<h4>Applications in investment management</h4>
<ul><li><strong>Text analytics and NLP:</strong> sentiment from news, earnings calls, filings, social media.</li>
<li><strong>Risk governance:</strong> monitoring, compliance, fraud and anomaly detection, stress testing.</li>
<li><strong>Algorithmic trading:</strong> rules-based execution, order slicing, high-frequency trading.</li>
<li>Also robo-advisers, credit scoring, portfolio construction, alternative-data research.</li></ul>`,
math:`<p>No formulas are tested here, but two "mental models" behave like formulas.</p>
<div class="f"><span class="lbl">Generalization gap</span>Overfitting signal = out-of-sample error − in-sample error (large and positive)</div>
<div class="dir"><div>Model complexity <span class="up">↑</span> → training error <span class="dn">↓</span> continuously, but validation error first <span class="dn">↓</span> then <span class="up">↑</span></div><div>Sweet spot = the complexity where validation error is lowest</div><div>More (relevant, clean) data → overfitting risk <span class="dn">↓</span></div></div>
<div class="f"><span class="lbl">Backpropagation (idea)</span>new weight = old weight − learning rate × ∂Loss/∂weight</div>
<p><strong>Why:</strong> the gradient tells which direction increases the error; step the other way, a little at a time, repeatedly.</p>
<div class="f"><span class="lbl">Data split (typical)</span>Training (largest, e.g., 60–70%) → Validation (≈15–20%) → Test (≈15–20%)</div>`,
example:`<div class="q">Classify each situation. (a) A model predicts bond default (yes/no) from 50,000 past loans with known outcomes. (b) An analyst groups 3,000 stocks by return behavior without predefined categories. (c) A trading agent learns order execution by being rewarded for lower slippage. (d) A model scores 98% accuracy on training data but 61% on the test set. (e) A quant randomly shuffles 20 years of daily data into train/test sets for a return-forecasting model.</div>
<ol class="steps"><li><strong>(a)</strong> Labeled outcomes, categorical target → <strong>supervised learning, classification</strong>.</li>
<li><strong>(b)</strong> No labels, find structure → <strong>unsupervised learning, clustering</strong>.</li>
<li><strong>(c)</strong> Learns by trial and error with rewards → <strong>reinforcement learning</strong>.</li>
<li><strong>(d)</strong> Excellent in-sample, poor out-of-sample → <strong>overfitting</strong>. Remedies: simpler model, more data, regularization, proper validation.</li>
<li><strong>(e)</strong> Random shuffling leaks future information into training → <strong>look-ahead bias</strong>; use a time-based split or rolling-window validation.</li></ol>
<p class="ans">Answers: supervised classification · unsupervised clustering · reinforcement · overfitting · use time-based splits</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Thinking the test set is used to tune the model. <b>Fix:</b> validation tunes; test is touched once for an unbiased final score.</li>
<li><b>Trap:</b> Confusing over- and underfitting. <b>Fix:</b> overfit = memorized noise (great training, bad test); underfit = missed signal (bad both).</li>
<li><b>Trap:</b> Random splits for time series. <b>Fix:</b> respect time order.</li>
<li><b>Trap:</b> "Veracity" = volume. <b>Fix:</b> veracity = trustworthiness/quality.</li>
<li><b>Trap:</b> Assuming more alternative data is always better. <b>Fix:</b> noisy or biased data hurts; check veracity and relevance.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> identify supervised/unsupervised/reinforcement; recognize overfitting from accuracy numbers; define the V's; name applications (NLP sentiment, algorithmic trading, risk governance); purpose of training/validation/test sets; role of backpropagation and hidden layers.</li>
<li><strong>Keyword map:</strong> "labeled" → supervised. "Clusters/groups" → unsupervised. "Reward/agent" → reinforcement. "Nonlinear, layers" → neural network.</li>
<li>Pure recall: move fast and bank the points for heavier readings.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>4 V's: Very Vast, Very Varied</b>Volume, Velocity, Variety, Veracity.</div>
<div class="anchor"><b>Teacher · Explorer · Gamer</b>Supervised has a teacher with answers; unsupervised explores; reinforcement plays for points.</div>
<div class="anchor"><b>Memorizer vs Daydreamer</b>Overfit memorizes noise; underfit ignores signal.</div>
<div class="anchor"><b>Train · Tune · Test</b>Training fits, validation tunes, test grades once.</div></div>`,
summary:`Financial data science analyzes financial information, increasingly big data characterized by volume, velocity, variety and veracity, drawn from traditional and alternative sources (individuals, business processes, sensors). Its pipeline covers capturing, curating, storing, searching and transferring data to models and presenting results; data mining finds predictive patterns. AI simulates human cognition; machine learning improves with experience via supervised (labeled: regression, classification), unsupervised (unlabeled: clustering, dimension reduction) or reinforcement (reward-driven) learning; neural networks use hidden layers and backpropagation to model nonlinear relationships. Data are split into training (largest), validation and test sets, with time-based or rolling-window splits for time series. The key risks are overfitting (noise mistaken for signal) and underfitting (signal mistaken for noise). Investment uses include text analytics and NLP, risk governance, and algorithmic trading.`
},
quiz:[
{q:"A model that clusters companies into groups based on financial characteristics without predefined labels is an example of:",o:["supervised learning","unsupervised learning","reinforcement learning"],a:1,e:"No labels and the goal is to discover structure → unsupervised (clustering)."},
{q:"Which dataset is typically the largest when developing an ML model?",o:["Training set","Validation set","Test set"],a:0,e:"The model learns from the training set, which is the largest; validation tunes, test evaluates."},
{q:"A model with very low error on training data but high error on new data is most likely:",o:["underfitted","overfitted","well-generalized"],a:1,e:"It has learned noise specific to the training sample: overfitting."}]
});

add({n:12,topic:"econ",title:"The Firm and Market Structures",
los:["12.a Determine and interpret breakeven and shutdown points of production, as well as how economies and diseconomies of scale affect costs under perfect and imperfect competition.","12.b Describe characteristics of perfect competition, monopolistic competition, oligopoly, and pure monopoly.","12.c Explain supply and demand relationships under monopolistic competition, including the optimal price and output for firms as well as pricing strategy.","12.d Explain supply and demand relationships under oligopoly, including the optimal price and output for firms as well as pricing strategy.","12.e Identify the type of market structure within which a firm operates and describe the use and limitations of concentration measures."],
s:{
eli5:`<p>Picture four markets. At a <strong>farmers' market</strong>, dozens of stalls sell identical tomatoes; nobody can charge more than the going price or customers walk next door (<em>perfect competition</em>). In a <strong>street of restaurants</strong>, each one is a bit different, so each can charge a little more for its special dish (<em>monopolistic competition</em>). In <strong>phone networks</strong>, three or four big companies watch each other like chess players (<em>oligopoly</em>). And the <strong>only water company</strong> in town can set the price itself (<em>monopoly</em>).</p>
<p>Every business also asks: "Should I keep the shop open?" If sales cover all costs, great. If sales cover the daily costs (staff, ingredients) but not the rent, stay open for now, because the rent is due anyway. If sales don't even cover staff and ingredients, close the doors today.</p>`,
core:`<p><strong>What problem is this solving?</strong> An analyst needs to know how much <em>pricing power</em> a company has and whether its profits can last. The market structure answers both.</p>
<ul><li><strong>Profit-maximizing rule (all structures):</strong> produce where marginal revenue = marginal cost. What differs is the relationship between price and MR. In perfect competition P = MR (you can sell more without cutting price); everywhere else the demand curve slopes down, so MR &lt; P.</li>
<li><strong>Pricing power ⇢ barriers to entry.</strong> Economic profits attract entrants unless something blocks them (patents, scale, licenses, networks). Low barriers → profits competed away (zero economic profit in the long run). High barriers → profits can persist.</li>
<li><strong>Shutdown logic is about which costs you can avoid.</strong> Fixed costs are sunk in the short run. Keep producing as long as revenue covers variable cost, since each unit then chips in toward fixed cost. In the long run everything is variable, so you need price ≥ ATC.</li>
<li><strong>Scale:</strong> as plants grow, average cost first falls (economies of scale: specialization, bulk buying) then rises (diseconomies: bureaucracy, coordination). The bottom of the long-run ATC curve is the minimum efficient scale.</li>
<li><strong>Oligopoly is strategic:</strong> each firm's best price depends on rivals' reactions, so there's no single supply curve; outcomes depend on assumptions (kinked demand, Cournot, Stackelberg, dominant firm, Nash equilibrium, collusion).</li></ul>`,
formal:`<h4>Breakeven and shutdown</h4>
<ul><li>Breakeven: P = ATC (TR = TC); economic profit zero, normal profit earned.</li>
<li>Short-run shutdown: P &lt; AVC (TR &lt; TVC). Between AVC and ATC: operate in the short run, exit in the long run if it persists.</li>
<li>Long-run: exit if P &lt; ATC.</li></ul>
<h4>Market structures</h4>
<table><tr><th></th><th>Perfect competition</th><th>Monopolistic competition</th><th>Oligopoly</th><th>Monopoly</th></tr>
<tr><td>Number of sellers</td><td>Many</td><td>Many</td><td>Few</td><td>One</td></tr>
<tr><td>Barriers to entry</td><td>Very low</td><td>Low</td><td>High</td><td>Very high</td></tr>
<tr><td>Product</td><td>Homogeneous</td><td>Differentiated</td><td>Homogeneous or differentiated</td><td>Unique, no close substitutes</td></tr>
<tr><td>Non-price competition</td><td>None</td><td>Heavy advertising/branding</td><td>Some</td><td>Advertising vs substitutes</td></tr>
<tr><td>Pricing power</td><td>None (price taker)</td><td>Some</td><td>Some to significant</td><td>Significant</td></tr>
<tr><td>Demand curve faced</td><td>Horizontal (perfectly elastic)</td><td>Downward, elastic</td><td>Downward (interdependent)</td><td>Market demand curve</td></tr>
<tr><td>Long-run economic profit</td><td>Zero</td><td>Zero</td><td>Possibly positive</td><td>Positive if barriers hold</td></tr>
<tr><td>Equilibrium</td><td>P = MR = MC = min ATC</td><td>P &gt; MR = MC; P = ATC (LR)</td><td>P &gt; MR = MC</td><td>P &gt; MR = MC</td></tr></table>
<h4>Oligopoly models</h4>
<ul><li><strong>Kinked demand:</strong> rivals match price cuts but not increases → demand elastic above the current price, inelastic below → sticky prices.</li>
<li><strong>Cournot:</strong> firms choose quantities simultaneously; with equal costs they share the market equally; price between monopoly and competitive levels.</li>
<li><strong>Stackelberg:</strong> sequential; the leader moves first and keeps a larger share.</li>
<li><strong>Dominant firm:</strong> a low-cost firm sets the price; small firms are price takers.</li>
<li><strong>Nash equilibrium:</strong> no firm can gain by changing its strategy unilaterally (game theory / prisoner's dilemma). Collusion (cartels) is unstable because each member gains by cheating.</li></ul>
<h4>Identifying structure; concentration measures</h4>
<ul><li>Look at number of firms, product differentiation, barriers, non-price competition. Ideally estimate the firm's demand elasticity, but that's statistically hard, so concentration measures are proxies.</li>
<li><strong>N-firm concentration ratio:</strong> sum of the N largest firms' market shares. Simple, but insensitive to mergers among top firms.</li>
<li><strong>HHI:</strong> sum of squared market shares of the N largest firms; reflects mergers better.</li>
<li>Limitation of both: ignore potential entry (contestable markets) and elasticity; a concentrated industry with low entry barriers can still be competitive.</li></ul>`,
math:`<div class="f"><span class="lbl">Profit maximization (every structure)</span>Produce where MR = MC; charge the price on the demand curve at that quantity</div>
<div class="f"><span class="lbl">Marginal revenue and elasticity</span>MR = P × (1 − 1/|E<sub>P</sub>|)</div>
<p><strong>Why:</strong> selling one more unit earns P, but (if demand slopes down) you must cut the price on all units. The more elastic demand is, the smaller that sacrifice, so MR approaches P. A profit-maximizing monopolist always operates where |E| &gt; 1 (MR &gt; 0).</p>
<div class="f"><span class="lbl">Shutdown rules</span>P ≥ ATC → profitable &nbsp;·&nbsp; AVC ≤ P &lt; ATC → operate short run &nbsp;·&nbsp; P &lt; AVC → shut down</div>
<div class="f"><span class="lbl">Concentration</span>CR<sub>N</sub> = Σ<sub>i=1..N</sub> sᵢ &nbsp;&nbsp;·&nbsp;&nbsp; HHI<sub>N</sub> = Σ<sub>i=1..N</sub> sᵢ² &nbsp;(shares as decimals)</div>
<p><strong>Why squaring helps:</strong> squaring gives big firms disproportionate weight, so merging two firms raises HHI by 2 × s₁ × s₂ even when CR barely moves. 1/HHI ≈ "number of equal-sized firms" the market behaves like.</p>
<div class="dir"><div>Barriers <span class="up">↑</span> → long-run economic profit possible <span class="up">↑</span></div><div>Product differentiation <span class="up">↑</span> → demand less elastic → more pricing power</div><div>Two top firms merge → HHI <span class="up">↑</span> sharply; CR<sub>4</sub> may change little</div></div>
<div class="calc" data-calc="be"></div>
<div class="calc" data-calc="conc"></div>`,
example:`<div class="q">(a) A competitive firm faces P = $12; its minimum ATC is $14 and minimum AVC is $9. What should it do? (b) A monopolist faces demand P = 100 − 2Q and constant MC = $20. Find output and price, compare with perfect competition, and find |E| at the monopoly price. (c) Market shares: 35%, 25%, 15%, 10%, 10%, 5%. Compute CR₄ and HHI (all firms). If the two 10% firms merge, how do CR₄ and HHI change?</div>
<ol class="steps"><li><strong>Shutdown:</strong> AVC (9) ≤ P (12) &lt; ATC (14) → <strong>keep operating short run</strong> (each unit covers variable cost plus $3 toward fixed cost); exit in the long run if price stays below $14.</li>
<li><strong>Monopoly:</strong> TR = 100Q − 2Q² → MR = 100 − 4Q. Set MR = MC: 100 − 4Q = 20 → <strong>Q = 20</strong>, P = 100 − 40 = <strong>$60</strong>.</li>
<li><strong>Competitive benchmark:</strong> P = MC → 100 − 2Q = 20 → Q = 40, P = $20. Monopoly halves output and triples price; deadweight loss = ½ × (60 − 20) × (40 − 20) = 400.</li>
<li><strong>Elasticity:</strong> MR = P(1 − 1/|E|) → 20 = 60(1 − 1/|E|) → |E| = <strong>1.5</strong> (elastic, as expected).</li>
<li><strong>Concentration:</strong> CR₄ = 35 + 25 + 15 + 10 = <strong>85%</strong>. HHI = 0.1225 + 0.0625 + 0.0225 + 0.01 + 0.01 + 0.0025 = <strong>0.23</strong> (≈ 4.3 equal-sized firms).</li>
<li><strong>Merger:</strong> new shares 35, 25, 20, 15, 5 → CR₄ = <strong>95%</strong>; HHI rises by 2 × 0.10 × 0.10 = 0.02 to <strong>0.25</strong>.</li></ol>
<p class="ans">Answers: operate short run · Q = 20, P = $60 (vs 40/$20), |E| = 1.5 · CR₄ 85%, HHI 0.23 → 95%, 0.25</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Shutting down whenever P &lt; ATC. <b>Fix:</b> short-run shutdown is P &lt; <em>AVC</em>; P &lt; ATC is the long-run exit signal.</li>
<li><b>Trap:</b> Setting price = MC for a monopolist. <b>Fix:</b> quantity from MR = MC, price from the demand curve (P &gt; MC).</li>
<li><b>Trap:</b> Thinking monopolistic competitors earn long-run economic profit. <b>Fix:</b> low barriers → entry → zero economic profit (P = ATC), though P &gt; MC.</li>
<li><b>Trap:</b> Using CR or HHI as direct measures of pricing power. <b>Fix:</b> they're proxies; they ignore elasticity and potential entry.</li>
<li><b>Trap:</b> Forgetting HHI uses squared shares (as decimals or as % → 0–10,000 scale). <b>Fix:</b> be consistent with the scale used in the answer choices.</li>
<li><b>Trap:</b> Claiming oligopolies have a supply curve. <b>Fix:</b> interdependence means no well-defined supply curve (same for monopoly and monopolistic competition).</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> match characteristics to a structure; shutdown/breakeven decision; MR = MC with a linear demand; oligopoly model identification; compute CR and HHI; interpret elasticity and MR.</li>
<li><strong>Linear demand shortcut:</strong> if P = a − bQ, then MR = a − 2bQ (same intercept, twice the slope).</li>
<li><strong>Keyword map:</strong> "sticky prices, rivals match cuts" → kinked demand. "First mover" → Stackelberg. "Simultaneous, equal shares" → Cournot. "Low-cost leader sets price" → dominant firm.</li>
<li><strong>Classification shortcut:</strong> ask "how many firms?" then "how hard to enter?" then "how differentiated?".</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Tomatoes · Restaurants · Phones · Water</b>Perfect, monopolistic, oligopoly, monopoly.</div>
<div class="anchor"><b>"Avoid the avoidable"</b>Stay open while price covers variable (avoidable) costs.</div>
<div class="anchor"><b>MR = MC, then look up</b>Find quantity at MR = MC, then go up to the demand curve for price.</div>
<div class="anchor"><b>Walls keep profits</b>High barriers = lasting profits; no walls = zero long-run profit.</div>
<div class="anchor"><b>HHI squares the giants</b>Squaring makes mergers of big firms stand out.</div></div>`,
summary:`Firms maximize profit where MR = MC. Breakeven is P = ATC; a firm keeps operating in the short run while P ≥ AVC (shutting down if P &lt; AVC) and exits in the long run if P &lt; ATC. The long-run ATC curve shows economies of scale (falling costs) then diseconomies (rising costs). Perfect competition has many firms, homogeneous products, no pricing power and P = MR = MC with zero long-run economic profit. Monopolistic competition has many firms, differentiated products, low barriers, P &gt; MR = MC and zero long-run economic profit. Oligopoly has few interdependent firms and high barriers, with outcomes depending on the model (kinked demand, Cournot, Stackelberg, dominant firm, Nash) and possible lasting profits. Monopoly has one firm, very high barriers and significant pricing power. Concentration ratios (sum of top-N shares) and the HHI (sum of squared shares, more sensitive to mergers) proxy for market power but ignore elasticity and potential entry.`
},
quiz:[
{q:"A firm's price is below average total cost but above average variable cost. In the short run, the firm should:",o:["shut down immediately","continue operating","raise its price above ATC"],a:1,e:"Revenue covers all variable costs and part of fixed costs, which are owed anyway. Exit in the long run if this persists."},
{q:"An industry with a few large firms whose prices tend to be sticky because rivals match price cuts but not increases is best described by the:",o:["Cournot model","kinked demand curve model","Stackelberg model"],a:1,e:"Asymmetric reactions create a kink: elastic above, inelastic below the current price, so prices are sticky."},
{q:"Compared with the N-firm concentration ratio, the HHI:",o:["better reflects the effect of mergers among large firms","directly measures the elasticity of demand","accounts for potential new entrants"],a:0,e:"Squaring shares weights large firms heavily, so a merger between two big firms raises HHI noticeably. Neither measure captures elasticity or entry."}]
});

/* ===================== READING 13 ===================== */
add({n:13,topic:"econ",title:"Understanding Business Cycles",
los:["13.a Describe the business cycle and its phases.","13.b Describe credit cycles.","13.c Describe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business cycle and describe their measurement using economic indicators."],
s:{
eli5:`<p>An economy breathes in and out. When it breathes in (<em>expansion</em>), shops are busy, people get hired, factories run flat out and prices creep up. At the top of the breath (<em>peak</em>) things feel great but start to strain. Then it breathes out (<em>contraction</em>): people buy less, firms cut back, some lose jobs. At the bottom (<em>trough</em>) things stop getting worse, and the cycle starts again.</p>
<p>Lending has its own breathing: when times are good, banks hand out loans easily, which pumps the economy up even more; when times are bad, they tighten up, which makes the slump worse. That's the <strong>credit cycle</strong>.</p>
<p>Economists watch "<strong>indicators</strong>" like a doctor watches vital signs. Some warn early (leading), some show what's happening now (coincident), and some confirm afterwards (lagging).</p>`,
core:`<p><strong>What problem is this solving?</strong> Investors and policymakers need to know where the economy is <em>and where it's heading</em>, because asset returns, corporate earnings and policy all depend on the phase.</p>
<ul><li><strong>Cycles are recurring but irregular:</strong> they vary in length, depth and causes. Phases can be defined by the level of real GDP (classical) or by GDP relative to its trend (growth/deviation cycle).</li>
<li><strong>Firms adjust the cheapest, most reversible levers first.</strong> Hiring and firing are costly, so early in a slowdown firms cut hours and overtime, not staff; early in a recovery they add hours before hiring. Likewise with capital: use existing machines more or less intensively before buying new ones or scrapping old ones.</li>
<li><strong>Inventories amplify cycles.</strong> When sales slow unexpectedly, inventories pile up (inventory/sales ratio rises), so firms cut production even more sharply. Near the trough, sales recover before production, so the ratio falls, and restocking then boosts output.</li>
<li><strong>Spending sensitivity:</strong> durable goods (cars, appliances) are postponable → very cyclical. Services are somewhat cyclical. Nondurables (food, toiletries) are least cyclical.</li>
<li><strong>Credit cycles</strong> (easy vs tight lending, high vs low asset values as collateral) amplify business cycles and can create asset bubbles. Credit cycles tend to be longer and deeper than business cycles.</li></ul>`,
formal:`<h4>Phases</h4>
<table><tr><th>Phase</th><th>Real GDP</th><th>Employment / hours</th><th>Inflation</th><th>Typical features</th></tr>
<tr><td>Trough</td><td>Stops falling, starts rising</td><td>Layoffs slowing; hours start to rise</td><td>Moderating</td><td>Confidence improving</td></tr>
<tr><td>Expansion (early → late)</td><td>Rising; above-trend growth late</td><td>Rising; overtime then hiring</td><td>Rising, especially late</td><td>Capex increases; inventories rebuilt; tight labor market late</td></tr>
<tr><td>Peak</td><td>Stops rising</td><td>Unemployment at low</td><td>High, accelerating</td><td>Capacity strained; policy often tightening</td></tr>
<tr><td>Contraction (recession)</td><td>Falling (often ≥ 2 consecutive quarters)</td><td>Hours cut, then layoffs</td><td>Slowing</td><td>Inventory/sales ratio rises; capex cut</td></tr></table>
<h4>Sector behavior over the cycle</h4>
<ul><li><strong>Resource use:</strong> inventory/sales ratio rises late in expansion/early contraction, falls late in contraction/early expansion. Labor: hours adjust before headcount. Capital: utilization adjusts first; new investment only when expansion seems durable; contraction → defer maintenance and replacement rather than sell assets.</li>
<li><strong>Consumers:</strong> durables highly cyclical; services moderately; nondurables least. Measured by retail sales, consumption, consumer confidence.</li>
<li><strong>Housing:</strong> driven by mortgage rates, home prices relative to income, demographics, and speculative demand from recent price trends.</li>
<li><strong>External trade:</strong> imports rise with domestic GDP growth and domestic currency appreciation; exports rise with foreign GDP growth and domestic currency depreciation.</li></ul>
<h4>Credit cycles</h4>
<p>Fluctuations in interest rates and credit availability. Expansion → rising asset prices → more collateral → easier lending → more spending (and potential bubbles). Contraction → falling asset values → tighter lending → deeper downturn.</p>
<h4>Economic indicators</h4>
<table><tr><th>Type</th><th>Turning points</th><th>Examples</th></tr>
<tr><td>Leading</td><td>Before the cycle</td><td>Average weekly manufacturing hours, initial jobless claims, new orders (consumer and capital goods), building permits, stock prices, interest rate spread (10-year minus policy rate), consumer expectations/sentiment, ISM new orders</td></tr>
<tr><td>Coincident</td><td>At the same time</td><td>Nonfarm payroll employment, real personal income less transfers, industrial production, manufacturing and trade sales</td></tr>
<tr><td>Lagging</td><td>After</td><td>Average duration of unemployment, inventory/sales ratio, change in unit labor costs, average prime lending rate, commercial and industrial loans outstanding, consumer credit/income ratio, change in services CPI</td></tr></table>`,
math:`<p>This reading has no tested formulas. The "maths" is directional logic you can apply like equations.</p>
<div class="f"><span class="lbl">Inventory-sales ratio</span>Inventory/Sales ↑ when sales slow faster than firms cut production → firms then cut output further</div>
<div class="f"><span class="lbl">Trade balance drivers</span>Imports ↑ with domestic GDP ↑ and home currency ↑ &nbsp;·&nbsp; Exports ↑ with foreign GDP ↑ and home currency ↓</div>
<div class="f"><span class="lbl">Output gap (concept)</span>Output gap = actual real GDP − potential GDP &nbsp;(positive → inflation pressure; negative → slack)</div>
<div class="dir"><div>Late expansion: hours <span class="up">↑</span>, capacity use <span class="up">↑</span>, inflation <span class="up">↑</span>, inventory/sales starts <span class="up">↑</span></div><div>Early contraction: hours <span class="dn">↓</span> before layoffs; durables spending <span class="dn">↓</span> most</div><div>Credit easy → asset prices <span class="up">↑</span> → collateral <span class="up">↑</span> → more credit (pro-cyclical loop)</div></div>`,
example:`<div class="q">An analyst observes: (1) average weekly manufacturing hours rising for three months; (2) inventory/sales ratio falling; (3) industrial production flat; (4) unit labor costs still falling; (5) building permits up; (6) durable goods orders recovering. Where is the economy, and how should each indicator be classified?</div>
<ol class="steps"><li><strong>Classify:</strong> hours worked (1), building permits (5), new orders (6) → <strong>leading</strong>. Industrial production (3) → <strong>coincident</strong>. Inventory/sales (2) and unit labor costs (4) → <strong>lagging</strong>.</li>
<li><strong>Leading signals all point up</strong> → a turn toward expansion is coming.</li>
<li><strong>Coincident flat</strong> → the economy hasn't turned yet in current output.</li>
<li><strong>Lagging still reflecting contraction</strong> (falling labor costs; firms having drawn down inventories) → we're just past the bottom of a contraction.</li>
<li><strong>Conclusion:</strong> the economy is at or near the <strong>trough</strong>. Firms are adding hours before hiring and will soon restock inventories, boosting production.</li></ol>
<p class="ans">Answer: trough / early recovery. Leading: hours, permits, orders; coincident: industrial production; lagging: inventory/sales, unit labor costs.</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Calling the inventory/sales ratio a leading indicator. <b>Fix:</b> it's lagging.</li>
<li><b>Trap:</b> Expecting firms to hire immediately in a recovery. <b>Fix:</b> they extend hours first; hiring lags.</li>
<li><b>Trap:</b> Thinking nondurable spending is most cyclical. <b>Fix:</b> durables are most cyclical; nondurables least.</li>
<li><b>Trap:</b> Saying domestic currency appreciation boosts exports. <b>Fix:</b> appreciation makes exports dearer abroad and imports cheaper → imports ↑, exports ↓.</li>
<li><b>Trap:</b> Assuming cycles have regular lengths. <b>Fix:</b> they recur but are irregular in length and severity.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> classify an indicator; identify the phase from a description; how inventories, hours, capex behave in each phase; sensitivity of spending categories; trade effects of currency moves; what credit cycles do.</li>
<li><strong>Memorize the leading list</strong>; it's the most tested. If unsure, ask "does this reflect a <em>decision about the future</em>?" (orders, permits, hours, expectations, stock prices) → leading.</li>
<li><strong>Pattern:</strong> "costs of hiring/firing are high" → adjust hours first, so hours lead and employment is coincident.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Breathing economy</b>Inhale (expansion), hold (peak), exhale (contraction), pause (trough).</div>
<div class="anchor"><b>Hours before heads</b>Firms change hours before headcount, machines' use before machines.</div>
<div class="anchor"><b>"Decisions lead, results lag"</b>Orders/permits lead; durations/costs/ratios lag.</div>
<div class="anchor"><b>Durables dance most</b>Cars and fridges swing with the cycle; groceries don't.</div>
<div class="anchor"><b>Credit is the amplifier</b>Easy credit pumps booms; tight credit deepens busts.</div></div>`,
summary:`The business cycle recurs irregularly through expansion (rising real GDP, employment, investment and inflation), peak, contraction and trough, measured either by the level of GDP or by growth relative to trend. Firms first adjust the most reversible inputs: hours before headcount, capital utilization before investment or disposal; inventory/sales ratios rise late in expansions and fall late in contractions, amplifying swings in production. Durable goods spending is the most cyclical, services moderately, nondurables least; housing responds to mortgage rates, affordability, demographics and speculative demand; imports rise with domestic growth and currency strength while exports rise with foreign growth and domestic currency weakness. Credit cycles (fluctuations in interest rates and credit availability) amplify business cycles and can create bubbles. Leading indicators (hours, jobless claims, new orders, building permits, stock prices, yield spread, sentiment) turn before the cycle; coincident indicators (payrolls, real income, industrial production, sales) turn with it; lagging indicators (unemployment duration, inventory/sales, unit labor costs, prime rate, loans outstanding) turn after.`
},
quiz:[
{q:"Which of the following is a lagging economic indicator?",o:["Building permits","Average duration of unemployment","Average weekly manufacturing hours"],a:1,e:"Unemployment duration keeps rising after the economy recovers. Permits and hours are leading."},
{q:"Early in an expansion, firms most likely respond to rising demand by first:",o:["hiring large numbers of new workers","increasing the hours of existing workers","building new production capacity"],a:1,e:"Because hiring is costly and the recovery may not last, firms increase hours/overtime first."},
{q:"Which category of consumer spending is most sensitive to the business cycle?",o:["Durable goods","Nondurable goods","Services"],a:0,e:"Durable purchases can be postponed, so they swing the most."}]
});

/* ===================== READING 14 ===================== */
add({n:14,topic:"econ",title:"Fiscal Policy",
los:["14.a Compare monetary and fiscal policy.","14.b Describe roles and objectives of fiscal policy as well as arguments as to whether the size of a national debt relative to GDP matters.","14.c Describe tools of fiscal policy, including their advantages and disadvantages.","14.d Explain the implementation of fiscal policy and difficulties of implementation as well as whether a fiscal policy is expansionary or contractionary."],
s:{
eli5:`<p>The government is like a giant household that can choose how much to spend (roads, schools, salaries, benefits) and how much to collect (taxes). When the economy is sluggish, it can spend more or tax less to get money flowing. When the economy is overheating, it can spend less or tax more to cool things down. That's <strong>fiscal policy</strong>.</p>
<p>The central bank does something similar with interest rates and money (<strong>monetary policy</strong>), but it's a different player with different tools.</p>
<p>The catch: governments are slow. By the time they notice a problem, argue about the fix, pass a law and actually build the bridge, the economy may have already recovered. And if they borrow a lot, someone has to pay it back eventually.</p>`,
core:`<p><strong>What problem is this solving?</strong> Markets alone don't always keep output near potential or distribute income in a way society accepts. Fiscal policy uses the government's budget to (1) stabilize economic activity, (2) redistribute income and wealth, and (3) allocate resources among sectors (e.g., subsidize clean energy, tax tobacco).</p>
<ul><li><strong>Demand channel:</strong> government spending adds directly to aggregate demand; tax cuts raise disposable income, much (not all) of which is spent. Spending therefore tends to have a bigger first-round effect than an equal tax cut.</li>
<li><strong>Automatic stabilizers</strong> work without new laws: in a recession tax receipts fall and unemployment benefits rise, cushioning demand. This is why the deficit naturally widens in downturns, so analysts judge the stance with the <em>structural</em> (cyclically adjusted) deficit.</li>
<li><strong>Does debt matter?</strong> Concerns: higher future taxes (disincentives), crowding out private investment through higher interest rates, and markets refusing to fund very high debt. Counter-arguments: debt owed to domestic citizens, deficits that fund productive capital, Ricardian equivalence (people save more in anticipation of future taxes), and no crowding out when the economy has slack.</li>
<li><strong>Implementation is hard:</strong> recognition, action and impact lags; uncertainty about the size of the output gap; political pressures; possible conflicts with monetary policy.</li></ul>`,
formal:`<h4>Fiscal vs monetary policy</h4>
<table><tr><th></th><th>Fiscal</th><th>Monetary</th></tr>
<tr><td>Who</td><td>Government (legislature/treasury)</td><td>Central bank</td></tr>
<tr><td>Tools</td><td>Taxation and spending</td><td>Policy rate, reserve requirements, open market operations</td></tr>
<tr><td>Goals</td><td>Stabilization plus redistribution and resource allocation (social/political aims)</td><td>Price stability (and often employment/growth)</td></tr></table>
<h4>Tools</h4>
<ul><li><strong>Spending:</strong> transfer payments (redistribute; don't directly buy output), current spending (goods and services consumed by government), capital spending (infrastructure, investment; boosts future capacity).</li>
<li><strong>Revenue:</strong> direct taxes (on income, wealth, corporate profits) and indirect taxes (on spending: sales tax, VAT, excise duties).</li>
<li><strong>Desirable tax attributes:</strong> simplicity, efficiency (minimal distortion), fairness (horizontal and vertical equity), sufficiency (enough revenue).</li></ul>
<h4>Advantages and disadvantages</h4>
<ul><li>Indirect taxes can be changed quickly, raise revenue cheaply and can target behavior (e.g., excise on alcohol).</li>
<li>Social policies can be implemented quickly through indirect taxes/transfers.</li>
<li>Direct tax changes and capital spending suffer long lags (planning, legislation, construction).</li></ul>
<h4>Deficits and the national debt</h4>
<p>Arguments for concern: higher future taxes reduce incentives and growth; inability to finance at high debt levels; crowding out. Arguments against: domestic ownership of debt; productive capital spending; may prompt tax reform; Ricardian equivalence; no crowding out below full employment.</p>
<h4>Implementation and stance</h4>
<ul><li>Lags: <strong>recognition</strong> (seeing the need), <strong>action</strong> (enacting), <strong>impact</strong> (taking effect).</li>
<li>Other difficulties: misreading the output gap (risk of overheating or crowding out), ignoring supply-side problems, mismatched objectives (e.g., high unemployment with high inflation).</li>
<li>Increasing deficit → generally expansionary; decreasing → contractionary. Judge by the <strong>structural (cyclically adjusted) budget</strong>: change in the deficit at full employment, not the headline deficit.</li></ul>`,
math:`<p>Fiscal policy questions in this reading are mostly conceptual. These relationships are the "maths" to carry.</p>
<div class="f"><span class="lbl">Budget balance</span>Budget balance = Tax revenue − Government spending (incl. transfers) &nbsp;·&nbsp; Actual balance = Structural balance + Cyclical component</div>
<div class="vars"><div><code>Structural</code><span>Balance that would exist at full employment: the discretionary policy stance</span></div><div><code>Cyclical</code><span>Swings from automatic stabilizers (recession → deficit wider)</span></div></div>
<p><strong>Why it matters:</strong> a deficit that widens only because of a recession isn't a policy choice. A wider <em>structural</em> deficit is a deliberate expansion.</p>
<div class="f"><span class="lbl">Background intuition: the fiscal multiplier</span>Spending multiplier = 1 / [1 − MPC(1 − t)]</div>
<p><strong>Why:</strong> $1 of government spending becomes someone's income; they spend MPC(1 − t) of it, which becomes someone else's income, and so on. A larger MPC (more spending) or lower tax rate (less leakage) → bigger multiplier. Tax changes have a smaller multiplier because the first round is partly saved.</p>
<div class="dir"><div>Structural deficit <span class="up">↑</span> → expansionary</div><div>MPC <span class="up">↑</span> or tax rate <span class="dn">↓</span> → multiplier <span class="up">↑</span></div><div>Economy at full employment + more borrowing → interest rates <span class="up">↑</span> → private investment <span class="dn">↓</span> (crowding out)</div></div>
<div class="calc" data-calc="mult"></div>`,
example:`<div class="q">A country's budget deficit rose from 2% to 5% of GDP this year. Over the same period the economy fell into recession, and the government estimates the structural deficit moved from 3% to 2.5% of GDP. (a) Is fiscal policy expansionary or contractionary? (b) Why did the actual deficit rise? (c) If the government now wants to stimulate quickly, which tools act fastest? (d) Using MPC = 0.8 and t = 25%, by roughly how much would GDP rise from an extra 100 of government spending?</div>
<ol class="steps"><li><strong>Stance:</strong> the structural deficit <em>fell</em> (3% → 2.5%) → discretionary policy is mildly <strong>contractionary</strong>, despite the headline deficit rising.</li>
<li><strong>Headline rise</strong> = automatic stabilizers: lower tax receipts and higher benefit payments in recession (cyclical component ≈ 2.5% of GDP).</li>
<li><strong>Fast tools:</strong> indirect tax changes (e.g., VAT cut) and transfer payments; capital projects and direct tax reforms have longer action and impact lags.</li>
<li><strong>Multiplier:</strong> 1/[1 − 0.8 × 0.75] = 1/0.4 = 2.5 → ΔGDP ≈ <strong>250</strong> (illustrative; real-world multipliers are lower with crowding out and imports).</li></ol>
<p class="ans">Answers: contractionary (structural deficit fell) · automatic stabilizers · indirect taxes/transfers · ≈ 250</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Judging stance by the headline deficit. <b>Fix:</b> use the structural (cyclically adjusted) deficit.</li>
<li><b>Trap:</b> Treating transfer payments as government purchases of output. <b>Fix:</b> transfers redistribute income; they don't directly buy goods/services.</li>
<li><b>Trap:</b> Confusing direct and indirect taxes. <b>Fix:</b> direct = on income/wealth; indirect = on spending (VAT, excise).</li>
<li><b>Trap:</b> Thinking Ricardian equivalence makes deficits more powerful. <b>Fix:</b> if it holds, private saving rises to offset the deficit, so stimulus is weaker.</li>
<li><b>Trap:</b> Assuming crowding out always occurs. <b>Fix:</b> less likely when the economy has slack.</li>
<li><b>Trap:</b> Mixing up the lags. <b>Fix:</b> recognize → act → impact.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> fiscal vs monetary differences; classify a tool; arguments for/against worrying about debt; identify a lag; expansionary or contractionary from structural data; advantages of indirect taxes.</li>
<li><strong>Pattern:</strong> "deficit rose due to recession" → automatic stabilizer, not discretionary.</li>
<li><strong>Pattern:</strong> "citizens save in anticipation of future taxes" → Ricardian equivalence.</li>
<li>Answers often hinge on one word ("direct", "capital", "structural"); read the stem slowly but answer fast.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Stabilize · Share · Steer</b>Fiscal goals: stabilize activity, redistribute (share), allocate resources (steer).</div>
<div class="anchor"><b>"See it, sign it, feel it"</b>Recognition, action, impact lags.</div>
<div class="anchor"><b>Look under the weather</b>Structural deficit strips out the economic weather.</div>
<div class="anchor"><b>Indirect = instant</b>Indirect taxes can be changed fast; capital projects are slow.</div></div>`,
summary:`Fiscal policy is the government's use of taxation and spending to stabilize activity, redistribute income and allocate resources; monetary policy is the central bank's control of money and credit, and both seek growth with price stability. Spending tools are transfer payments, current spending and capital spending; revenue tools are direct (income, wealth, profits) and indirect (spending) taxes, ideally simple, efficient, fair and sufficient. Indirect taxes and transfers can be changed quickly; direct taxes and capital spending face long lags. Arguments for worrying about debt include future tax disincentives, financing risk and crowding out; arguments against include domestic ownership, productive capital spending, Ricardian equivalence and slack. Implementation suffers recognition, action and impact lags and output-gap uncertainty. A rising deficit is generally expansionary, but the stance should be judged by the structural (cyclically adjusted) deficit, because automatic stabilizers widen deficits in recessions.`
},
quiz:[
{q:"During a recession, tax revenues fall and unemployment benefits rise without new legislation. This is an example of:",o:["discretionary fiscal policy","automatic stabilizers","Ricardian equivalence"],a:1,e:"These budget changes happen automatically as income falls and joblessness rises."},
{q:"Which fiscal tool can typically be implemented most quickly?",o:["A new highway construction program","A change in a value-added (sales) tax","A reform of the corporate income tax code"],a:1,e:"Indirect taxes like VAT can be changed quickly; capital projects and direct tax reforms face long lags."},
{q:"Which argument suggests that a large fiscal deficit is NOT a cause for concern?",o:["The debt is primarily owned by the country's own citizens","Higher future taxes reduce work incentives","Government borrowing raises interest rates and reduces private investment"],a:0,e:"Domestic ownership means interest is paid within the country. The other two are arguments for concern."}]
});

/* ===================== READING 15 ===================== */
add({n:15,topic:"econ",title:"Monetary Policy",
los:["15.a Describe the roles and objectives of central banks.","15.b Describe tools used to implement monetary policy and the monetary transmission mechanism, and explain the relationships between monetary policy and economic growth, inflation, interest, and exchange rates.","15.c Describe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or contractionary monetary policy; and describe the limitations of monetary policy.","15.d Explain the interaction of monetary and fiscal policy."],
s:{
eli5:`<p>The central bank is like the thermostat for the economy. If the economy is too hot (prices rising fast), it turns the heat down by making borrowing more expensive (raising interest rates). People and businesses borrow and spend less, and prices calm down. If the economy is too cold (people losing jobs, prices barely moving), it makes borrowing cheaper so people spend more.</p>
<p>It also prints the country's money, keeps the banks safe, and lends to banks in a panic (the "lender of last resort").</p>
<p>A thermostat only works if people trust it. If everyone believes the central bank will keep inflation around 2%, they set prices and wages accordingly, and inflation really does stay near 2%. Trust is the central bank's superpower.</p>`,
core:`<p><strong>What problem is this solving?</strong> Keeping inflation low and stable (and, for some central banks, supporting employment and growth) without the government printing money for its own needs.</p>
<ul><li><strong>The lever is the short-term policy rate.</strong> The central bank controls it via open market operations (buying bonds adds reserves → rates fall; selling drains reserves → rates rise), and can also change reserve requirements.</li>
<li><strong>Transmission mechanism:</strong> policy rate → (1) bank lending rates, (2) asset prices (bonds, stocks, houses → wealth effect), (3) expectations and confidence, (4) exchange rate → spending and investment → aggregate demand → output and inflation. It works with long and variable lags.</li>
<li><strong>Neutral rate:</strong> the rate that neither stimulates nor restrains (≈ trend real growth + inflation target). Policy rate above neutral = contractionary; below = expansionary.</li>
<li><strong>Effectiveness = independence + credibility + transparency.</strong> Independence (operational and/or target) keeps politics out; credibility anchors expectations; transparency (publishing forecasts, minutes, inflation reports) builds credibility.</li>
<li><strong>Limits:</strong> long-term rates may not follow (bond markets may expect inflation), liquidity traps (people hoard cash), banks may not lend new reserves, rates can't go much below zero (hence quantitative easing), and developing economies face weak markets and low credibility.</li></ul>`,
formal:`<h4>Roles of central banks</h4>
<p>Monopoly supplier of currency; banker to government and to banks; regulator/supervisor of the payments system and banking; lender of last resort; custodian of gold and FX reserves; conduct of monetary policy.</p>
<h4>Objectives</h4>
<p>Price stability (primary, often an inflation target around 2–3%); some add stable exchange rates, full employment, sustainable growth, moderate long-term rates (e.g., a "dual mandate").</p>
<h4>Tools</h4>
<ul><li><strong>Policy rate</strong> (discount rate in the US; refinancing rate at the ECB; two-week repo rate in the UK).</li>
<li><strong>Reserve requirements.</strong></li>
<li><strong>Open market operations.</strong></li>
<li>Lower rate / lower reserve requirement / OMO purchases = expansionary; the reverse = contractionary.</li></ul>
<h4>Effects</h4>
<p>Contractionary (rate ↑): growth ↓, market rates ↑, inflation ↓, domestic currency appreciates. Expansionary: the opposite.</p>
<h4>Targeting regimes</h4>
<ul><li><strong>Inflation targeting:</strong> the dominant modern framework, with an explicit target and band; act when forecast inflation deviates.</li>
<li><strong>Interest rate targeting:</strong> historically common.</li>
<li><strong>Exchange rate targeting:</strong> peg to a stable currency; must defend it by buying/selling currency and effectively import the anchor country's inflation and monetary policy (loss of independence).</li></ul>
<h4>Limitations</h4>
<p>Long rates moving opposite to short rates (bond market vigilantes), liquidity trap, banks unwilling to lend, zero lower bound (→ QE: large-scale asset purchases), developing-economy problems (shallow markets, rapid innovation, credibility).</p>
<h4>Monetary-fiscal interaction</h4>
<table><tr><th>Monetary</th><th>Fiscal</th><th>Interest rates</th><th>Output</th><th>Private spending</th><th>Public spending</th></tr>
<tr><td>Tight</td><td>Tight</td><td>Higher</td><td>Lower</td><td>Lower</td><td>Lower</td></tr>
<tr><td>Easy</td><td>Easy</td><td>Lower</td><td>Higher</td><td>Higher</td><td>Higher</td></tr>
<tr><td>Tight</td><td>Easy</td><td>Higher</td><td>Higher</td><td>Lower</td><td>Higher</td></tr>
<tr><td>Easy</td><td>Tight</td><td>Lower</td><td>Varies</td><td>Higher</td><td>Lower</td></tr></table>`,
math:`<div class="f"><span class="lbl">Neutral policy rate</span>R<sub>neutral</sub> = trend real GDP growth + inflation target</div>
<p><strong>Why:</strong> in the long run the real rate that keeps the economy at potential is tied to trend growth; add target inflation to make it nominal.</p>
<div class="f"><span class="lbl">Policy stance</span>Policy rate &gt; neutral → contractionary &nbsp;·&nbsp; Policy rate &lt; neutral → expansionary</div>
<div class="f"><span class="lbl">Fisher relationship</span>Nominal rate ≈ real rate + expected inflation (+ risk premium)</div>
<p><strong>Why it matters here:</strong> if markets think the central bank is too loose, expected inflation rises and long-term nominal rates can <em>rise</em> even as the policy rate falls.</p>
<div class="f"><span class="lbl">Background: money creation</span>Money multiplier ≈ 1 / reserve requirement</div>
<div class="dir"><div>Policy rate <span class="up">↑</span> → borrowing <span class="dn">↓</span>, asset prices <span class="dn">↓</span>, currency <span class="up">↑</span> → demand <span class="dn">↓</span> → inflation <span class="dn">↓</span></div><div>Reserve requirement <span class="dn">↓</span> → money multiplier <span class="up">↑</span> → expansionary</div><div>Central bank <em>buys</em> bonds → reserves <span class="up">↑</span> → rates <span class="dn">↓</span></div></div>`,
example:`<div class="q">An economy's trend real growth is 2% and the central bank's inflation target is 2%. The policy rate is 3%, inflation is running at 4%, and unemployment is below its natural rate. Meanwhile the government is running a large expansionary budget. (a) What is the neutral rate and the current stance? (b) What should the central bank do? (c) Describe the transmission. (d) What is the policy mix and its likely effect?</div>
<ol class="steps"><li><strong>Neutral</strong> = 2% + 2% = <strong>4%</strong>. Policy rate 3% &lt; 4% → current stance is <strong>expansionary</strong>.</li>
<li><strong>With inflation above target and a tight labor market,</strong> the bank should <strong>raise the policy rate above 4%</strong> (contractionary), e.g., via open market sales.</li>
<li><strong>Transmission:</strong> higher bank lending rates → less borrowing; bond and equity prices fall → negative wealth effect; currency appreciates → exports fall, imports cheaper; expectations of lower inflation become anchored.</li>
<li><strong>Mix:</strong> tight monetary + easy fiscal → <strong>higher interest rates</strong>, output higher than otherwise, private spending lower (crowded out), public spending higher.</li></ol>
<p class="ans">Answers: neutral 4%, stance expansionary · tighten above 4% · rates/assets/expectations/FX channels · higher rates, lower private share of GDP</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Thinking an open market purchase is contractionary. <b>Fix:</b> buying bonds injects reserves → expansionary.</li>
<li><b>Trap:</b> Expecting a rate hike to weaken the currency. <b>Fix:</b> higher rates attract capital → domestic currency appreciates.</li>
<li><b>Trap:</b> Calling a 3% policy rate "tight" without context. <b>Fix:</b> compare to the neutral rate.</li>
<li><b>Trap:</b> Assuming a pegged-currency country keeps independent monetary policy. <b>Fix:</b> it must follow the anchor country's policy and inflation.</li>
<li><b>Trap:</b> Confusing the liquidity trap with the zero lower bound. <b>Fix:</b> liquidity trap = people hoard cash regardless of rates; ZLB = rates can't fall further.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> list central bank roles; classify tools as expansionary/contractionary; describe transmission; neutral rate calculation; qualities of effective central banks; pros/cons of exchange rate targeting; limitations; read the policy-mix table.</li>
<li><strong>Policy mix shortcut:</strong> interest rates follow <em>monetary</em> policy unless monetary is easy and fiscal tight. Private spending follows monetary; public spending follows fiscal.</li>
<li><strong>Keyword map:</strong> "free from political interference" → independence; "does what it says" → credibility; "publishes forecasts and indicators" → transparency.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Thermostat</b>Rate up = cool down; rate down = warm up.</div>
<div class="anchor"><b>"Buy = Boost"</b>Open market purchases boost money supply.</div>
<div class="anchor"><b>4 channels: L-A-E-X</b>Lending rates, Asset prices, Expectations, eXchange rate.</div>
<div class="anchor"><b>I-C-T</b>Effective central banks are Independent, Credible, Transparent.</div>
<div class="anchor"><b>Neutral = growth + target</b>Above it you're braking; below it you're accelerating.</div></div>`,
summary:`Central banks issue currency, bank for government and banks, supervise the payments system, act as lender of last resort, hold reserves and conduct monetary policy, chiefly to keep inflation low and stable (often a 2–3% target), sometimes also targeting employment, growth or currency stability. Their tools are the policy rate, reserve requirements and open market operations: lowering rates or requirements and buying securities is expansionary. Policy works through bank lending rates, asset prices, expectations and the exchange rate, with long and variable lags; tightening slows growth, raises market rates, lowers inflation and appreciates the currency. A policy rate above the neutral rate (trend growth + inflation target) is contractionary. Effective central banks are independent, credible and transparent; most use inflation targeting, while exchange-rate targeting imports the anchor's inflation and sacrifices independence. Limits include perverse long-rate moves, liquidity traps, reluctant bank lending, the zero lower bound (hence QE) and weak institutions in developing economies. In the policy mix, tight money with easy fiscal raises rates and shifts output toward the public sector.`
},
quiz:[
{q:"A central bank purchases government securities in the open market. This action is most likely to:",o:["increase bank reserves and lower short-term rates","decrease the money supply","appreciate the domestic currency"],a:0,e:"Purchases pay for bonds with new reserves, expanding money and pushing rates down; the currency tends to depreciate."},
{q:"Trend real growth is 2.5% and the inflation target is 2%. A policy rate of 3% is best described as:",o:["contractionary","neutral","expansionary"],a:2,e:"Neutral ≈ 4.5%; 3% is below neutral → expansionary."},
{q:"With easy fiscal policy and tight monetary policy, the most likely result is:",o:["lower interest rates and higher private spending","higher interest rates and a larger public sector share of output","lower output and lower public spending"],a:1,e:"Tight money raises rates and crowds out private spending; easy fiscal expands public spending."}]
});
