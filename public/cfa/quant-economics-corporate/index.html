<style>

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --panel:#1a1b1f; --panel2:#222328; --ink:#ececee; --ink2:#b4b5bb; --ink3:#7d7e85;
    --line:#2e2f35; --quant:#7d9dff; --econ:#4cc79a; --cf:#f0a35c; --accent:#7d9dff;
    --good:#5fd394; --goodbg:#163325; --bad:#ff8a7d; --badbg:#3a1a17; --warnbg:#3a2e14; --warn:#f4c76a;
    --fbg:#202127; --shadow:none; --ontc:#121316;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --panel:#1a1b1f; --panel2:#222328; --ink:#ececee; --ink2:#b4b5bb; --ink3:#7d7e85;
  --line:#2e2f35; --quant:#7d9dff; --econ:#4cc79a; --cf:#f0a35c; --accent:#7d9dff;
  --good:#5fd394; --goodbg:#163325; --bad:#ff8a7d; --badbg:#3a1a17; --warnbg:#3a2e14; --warn:#f4c76a;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

.search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.overall{font-size:12px;color:var(--ink3);margin:2px 4px 12px}
.bar{height:5px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:5px}

<script>
window.READINGS=window.READINGS||[];
function add(o){window.READINGS.push(o)}

/* ===================== READING 1 ===================== */
add({n:1,topic:"quant",title:"Returns of Financial Assets and Instruments",
los:["1.a Describe, compare, and interpret returns.","1.b Describe, compare, and interpret required rates of return, risk-free rates, risk premia, and inflation."],
s:{
eli5:`<p>Imagine you buy a lemonade stand for $100. A year later someone offers you $108 for it, and during the year it also paid you $2 in profits you put in your pocket. How much did you make? You gained $8 from the stand being worth more, plus $2 in cash: $10 on $100, or <strong>10%</strong>. That's a <em>return</em>: how much richer you got, measured as a percentage of what you started with.</p>
<p>Now imagine you did this for three years and got +30%, then −20%, then +10%. What's your "average" year? If you just add them up and divide by 3, you get about 6.7%. But your actual money went $100 → $130 → $104 → $114.40. Growing steadily at 6.7% a year would have given you about $121. The simple average <em>overstates</em> what really happened. The "honest" average that would have turned $100 into $114.40 is about 4.6%. That's the <strong>geometric mean</strong>.</p>
<p>Finally, why would anyone lend you money at all? Because they're giving up buying stuff today, prices might rise while they wait (inflation), and you might not pay them back (risk). The return they demand is the sum of those three "complaints". That's the <strong>required return</strong>.</p>`,
core:`<p><strong>What problem is this solving?</strong> Investors need one common yardstick to compare a stock, a bond, a house and a savings account, held for different lengths of time, with different mixes of income and price change. Returns convert all of it into "percent gained per unit of time".</p>
<h4>Three ideas carry the whole reading</h4>
<ol><li><strong>Return = what you got ÷ what you put in.</strong> What you got has two parts: the price change and the cash paid out (dividends, coupons). Ignoring the cash part makes dividend-heavy assets look worse than they are.</li>
<li><strong>Averaging returns across time is tricky because returns compound.</strong> A −50% year needs a +100% year just to get back to even. Arithmetic averaging treats +100% and −50% as "+25% average" even though you made nothing. The geometric mean respects compounding, so it is the right measure of past <em>growth</em>; the arithmetic mean is the better estimate of a single <em>future</em> period's expected return.</li>
<li><strong>A required return is a price for waiting and for worrying.</strong> Pure time preference (real risk-free rate) + compensation for expected inflation (making it nominal) + compensation for each risk you bear (default, liquidity, maturity, size, value...). Every interest rate you'll ever see in the CFA program is built from these blocks.</li></ol>
<div class="call key"><strong>Cause → effect:</strong> More volatility → bigger gap between arithmetic and geometric means. More inflation expected → higher nominal rates. More risk → higher required return → lower price today for the same future cash flows.</div>
<p>The reading also explains the many "flavours" of return (gross vs net, pre-tax vs after-tax, nominal vs real, leveraged) because each strips out or adds back a different real-world cost. Ask yourself: <em>"what has been deducted so far?"</em></p>`,
formal:`<h4>Holding period return (HPR)</h4>
<p>Total return over a holding period = price return + income (capital distribution) return. It applies to any period length; it is <em>not</em> annualized.</p>
<h4>Averaging returns</h4>
<ul><li><strong>Arithmetic mean:</strong> simple average; unbiased estimate of next period's expected return; overstates multi-period compound growth.</li>
<li><strong>Geometric mean:</strong> the constant compound rate that links beginning and ending wealth. Always ≤ arithmetic mean (equal only if all returns are identical).</li>
<li><strong>Harmonic mean:</strong> used for average cost per share with equal dollar amounts invested (cost averaging). Harmonic ≤ geometric ≤ arithmetic.</li>
<li><strong>Trimmed / winsorized means</strong> limit outliers (covered in Reading 5).</li></ul>
<h4>Annualizing and continuous compounding</h4>
<p>Compound, don't multiply: annualized return = (1 + period return)<sup>periods per year</sup> − 1. A continuously compounded return is ln(1 + HPR); continuously compounded returns are <em>additive</em> across time, which is why they are used in models.</p>
<h4>Other return measures</h4>
<table><tr><th>Measure</th><th>What it shows</th></tr>
<tr><td>Gross return</td><td>After trading costs, <em>before</em> management and admin fees. Best for judging the manager's skill.</td></tr>
<tr><td>Net return</td><td>After all fees: what the investor actually keeps (pre-tax).</td></tr>
<tr><td>Pre-tax vs after-tax nominal</td><td>Before vs after the tax bill.</td></tr>
<tr><td>Real return</td><td>Nominal return stripped of inflation: purchasing-power gain.</td></tr>
<tr><td>Excess return</td><td>Return minus a benchmark (or minus the risk-free rate).</td></tr>
<tr><td>Leveraged return</td><td>Return on the investor's own equity when part of the position is borrowed. Magnifies gains <em>and</em> losses.</td></tr></table>
<h4>Required return, risk-free rates and risk premia</h4>
<p>Interest rates are the <strong>opportunity cost of current consumption</strong> and the required return that induces savers to lend.</p>
<ul><li><strong>Real risk-free rate:</strong> no inflation, no default risk: pure time preference.</li>
<li><strong>Nominal risk-free rate</strong> (e.g., T-bill rate): real risk-free rate + expected inflation premium.</li>
<li><strong>Risk premia:</strong> bonds carry default, liquidity and maturity premia; stocks carry an equity premium plus factors such as size and value.</li></ul>`,
math:`<div class="f"><span class="lbl">Holding period return</span>HPR = (P₁ − P₀ + D₁) / P₀ = price return + income return</div>
<div class="vars"><div><code>P₀, P₁</code><span>Beginning and ending price</span></div><div><code>D₁</code><span>Cash received during the period (dividend, coupon, distribution)</span></div></div>
<p><strong>Why it works:</strong> it's simply "gain ÷ investment". Splitting it shows where the return came from: (P₁ − P₀)/P₀ is the price piece, D₁/P₀ is the yield piece.</p>
<div class="f"><span class="lbl">Arithmetic and geometric mean</span>R̄<sub>A</sub> = (R₁ + R₂ + … + Rₙ) / n<br>R̄<sub>G</sub> = [(1+R₁)(1+R₂)…(1+Rₙ)]<sup>1/n</sup> − 1</div>
<p><strong>Why geometric works:</strong> wealth grows multiplicatively, so we need the single growth factor that, multiplied by itself n times, reproduces the total growth. That's an n-th root. Rule of thumb: R̄<sub>G</sub> ≈ R̄<sub>A</sub> − σ²/2. Volatility drags the compound rate down.</p>
<div class="dir"><div><span class="up">↑</span> Volatility of returns → <span class="up">↑</span> gap between arithmetic and geometric mean</div><div>Identical returns every period → arithmetic = geometric</div></div>
<div class="f"><span class="lbl">Annualizing</span>R<sub>annual</sub> = (1 + R<sub>period</sub>)<sup>c</sup> − 1 &nbsp;where c = periods per year (= 365/days, 12 for monthly, 4 for quarterly)</div>
<p><strong>Why:</strong> if you could repeat the same period c times in a year and reinvest, compounding would give (1+R)<sup>c</sup>. For a period <em>longer</em> than a year, c &lt; 1 (e.g., 2-year return → exponent 1/2).</p>
<div class="f"><span class="lbl">Continuously compounded return</span>r<sub>cc</sub> = ln(1 + HPR) = ln(P₁/P₀) &nbsp;&nbsp;·&nbsp;&nbsp; HPR = e<sup>r<sub>cc</sub></sup> − 1</div>
<p><strong>Why it's handy:</strong> logs turn products into sums, so a 3-day continuously compounded return is just r₁ + r₂ + r₃. It is always smaller than the HPR it corresponds to.</p>
<div class="f"><span class="lbl">Real vs nominal (exact and approximate)</span>(1 + nominal) = (1 + real)(1 + inflation) &nbsp;→&nbsp; real = (1 + nominal)/(1 + inflation) − 1 ≈ nominal − inflation</div>
<div class="f"><span class="lbl">Leveraged return</span>r<sub>L</sub> = [r<sub>p</sub>(V₀ + V<sub>B</sub>) − V<sub>B</sub>·r<sub>D</sub>] / V₀ = r<sub>p</sub> + (V<sub>B</sub>/V₀)(r<sub>p</sub> − r<sub>D</sub>)</div>
<div class="vars"><div><code>r<sub>p</sub></code><span>Return on the whole (unlevered) position</span></div><div><code>V₀</code><span>Your own equity invested</span></div><div><code>V<sub>B</sub></code><span>Amount borrowed</span></div><div><code>r<sub>D</sub></code><span>Borrowing rate</span></div></div>
<p><strong>Why:</strong> you earn r<sub>p</sub> on everything (yours + borrowed), pay r<sub>D</sub> on the borrowed part, and divide by your money only. The second form shows leverage helps only when r<sub>p</sub> &gt; r<sub>D</sub>.</p>
<div class="calc" data-calc="hpr"></div>
<div class="calc" data-calc="means"></div>`,
example:`<div class="q">You bought a share at $40. Over 200 days it paid a $1.20 dividend and now trades at $43. (a) Find the HPR and split it. (b) Annualize it. (c) Find the continuously compounded return. (d) Over three earlier years the stock returned +15%, −10%, +8%; find the arithmetic and geometric means. (e) If you had financed one-third of a $1.5m position with a 5% loan and the position earned 12%, what's your levered return? (f) With 8% nominal and 3% inflation, what's the real return?</div>
<ol class="steps"><li><strong>HPR.</strong> Price return = (43 − 40)/40 = 7.5%. Income return = 1.20/40 = 3.0%. HPR = <strong>10.5%</strong>.</li>
<li><strong>Annualize.</strong> c = 365/200 = 1.825 → (1.105)<sup>1.825</sup> − 1 ≈ <strong>20.0%</strong>. Compounding a 10.5% return 1.825 times gives more than 1.825 × 10.5% = 19.2%.</li>
<li><strong>Continuous.</strong> ln(1.105) = <strong>9.98%</strong>: smaller than the HPR, as always.</li>
<li><strong>Means.</strong> Arithmetic = (15 − 10 + 8)/3 = <strong>4.33%</strong>. Geometric = (1.15 × 0.90 × 1.08)<sup>1/3</sup> − 1 = (1.1178)<sup>1/3</sup> − 1 = <strong>3.78%</strong>. Geometric &lt; arithmetic because returns varied.</li>
<li><strong>Leverage.</strong> V₀ = $1.0m own money, V<sub>B</sub> = $0.5m. Gain on $1.5m = $180,000; interest = $25,000; net $155,000 on $1.0m = <strong>15.5%</strong>. Check: 12% + 0.5 × (12% − 5%) = 15.5%.</li>
<li><strong>Real.</strong> 1.08/1.03 − 1 = <strong>4.85%</strong> (approximation 5% overstates slightly).</li></ol>
<p class="ans">Answers: 10.5% · 20.0% · 9.98% · 4.33% / 3.78% · 15.5% · 4.85%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Annualizing by multiplying (10.5% × 365/200). <b>Fix:</b> always compound: (1 + R)<sup>c</sup> − 1.</li>
<li><b>Trap:</b> Forgetting the dividend/coupon in HPR. <b>Fix:</b> numerator = price change <em>plus</em> income.</li>
<li><b>Trap:</b> Using the arithmetic mean to describe past compound growth. <b>Fix:</b> geometric for "what did my money actually do?"; arithmetic for "what do I expect next single period?"</li>
<li><b>Trap:</b> Thinking gross return = before costs. <b>Fix:</b> gross is <em>after</em> trading costs but <em>before</em> management/admin fees.</li>
<li><b>Trap:</b> Assuming leverage always raises return. <b>Fix:</b> it raises return only when the asset return beats the borrowing rate; it magnifies losses too.</li>
<li><b>Trap:</b> Calling the T-bill rate the <em>real</em> risk-free rate. <b>Fix:</b> T-bill ≈ <em>nominal</em> risk-free = real + expected inflation.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> compute an HPR with income; annualize a 90/180/200-day return; pick which mean fits a purpose; identify which premium (liquidity, maturity, default) explains a yield difference; compute a levered return.</li>
<li><strong>Pattern:</strong> two bonds identical except one trades rarely → the yield gap is the <em>liquidity</em> premium. Same issuer, longer maturity → <em>maturity</em> premium. Same maturity, weaker issuer → <em>default</em> premium.</li>
<li><strong>Calculator shortcut (BA II Plus):</strong> 1.105 [y<sup>x</sup>] 1.825 [=]. For continuous: 1.105 [LN].</li>
<li><strong>Sanity check:</strong> geometric must be ≤ arithmetic. If your geometric is higher, you mis-keyed.</li>
<li><strong>Time pressure:</strong> for real return, the answer choices often include both 5.00% (approx) and 4.85% (exact). Use the exact form unless told to approximate.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>"Price + Pay"</b>Return has two engines: price change and payout. Never forget the payout.</div>
<div class="anchor"><b>−50% then +100% = 0</b>Arithmetic says +25%. Geometric says 0%. Geometric tells the truth about wealth.</div>
<div class="anchor"><b>Compound, never multiply</b>Annualizing is an exponent problem, not a multiplication problem.</div>
<div class="anchor"><b>Rate = Patience + Prices + Peril</b>Real risk-free (patience) + inflation (prices) + risk premia (peril).</div>
<div class="anchor"><b>Leverage is a magnifying glass</b>It enlarges whatever is underneath, good or bad.</div></div>`,
summary:`A return is gain (price change plus income) divided by what you invested. Average returns over time with the geometric mean when you want true compound growth (it is always ≤ the arithmetic mean, and the gap grows with volatility); use the arithmetic mean for a single-period expectation. Annualize by compounding, (1+R)<sup>c</sup> − 1, and use ln(1+R) for continuously compounded returns, which add across periods. Gross returns are after trading costs but before fees, net returns are after fees, real returns strip out inflation, and leverage magnifies returns by (V<sub>B</sub>/V₀)(r<sub>p</sub> − r<sub>D</sub>). Every required return is real risk-free + expected inflation + risk premia (default, liquidity, maturity for bonds; equity, size, value for stocks), so higher perceived risk means a higher required return and a lower price.`
},
quiz:[
{q:"A stock bought at 50 pays a 1.00 dividend and is sold at 52 after 120 days. The annualized return is closest to:",o:["18.3%","19.4%","20.2%"],a:1,e:"HPR = (52 − 50 + 1)/50 = 6%. Annualized = 1.06^(365/120) − 1 = 1.06^3.0417 − 1 ≈ 19.4%. Choice A (18.3%) is the trap: 6% × 365/120 multiplies instead of compounding."},
{q:"Annual returns are +20%, −20%, +20%, −20%. Which statement is correct?",o:["The arithmetic and geometric means are both 0%.","The arithmetic mean is 0% and the geometric mean is negative.","The geometric mean exceeds the arithmetic mean."],a:1,e:"Arithmetic = 0%. Wealth: 1.2 × 0.8 × 1.2 × 0.8 = 0.9216 → geometric = 0.9216^(1/4) − 1 ≈ −2.0%. Volatility drags the compound rate below the simple average."},
{q:"Two bonds have the same issuer and maturity, but Bond X trades far less frequently and yields more. The yield difference is best explained by a:",o:["default risk premium","liquidity premium","maturity premium"],a:1,e:"Same issuer → same default risk; same maturity → same maturity premium. Infrequent trading → harder to sell quickly at fair value → liquidity premium."}]
});

/* ===================== READING 2 ===================== */
add({n:2,topic:"quant",title:"Types of Financial Returns",
los:["2.a Calculate, compare, and interpret different types of returns for financial assets, instruments, and indicators."],
s:{
eli5:`<p>Different investments pay you in different ways. A <strong>stock</strong> is like owning a slice of a bakery: you mostly get rich if the bakery becomes more valuable (price goes up), with a small slice of profits handed to you now and then (dividends). A <strong>bond</strong> is like lending money to the bakery: you mostly get fixed "thank-you" payments (coupons), and the IOU's price wiggles a bit.</p>
<p>Some things aren't investments at all but still move your returns: <strong>interest rates</strong> (when they rise, existing bonds you hold become less valuable), <strong>exchange rates</strong> (if you own a European stock and the euro gets stronger, you make extra money when you convert back), and <strong>indexes</strong> (scoreboards that tell you how a whole market did).</p>
<p>And the golden rule: <strong>if you want a bigger reward, you have to accept a bumpier ride</strong>. Over long periods, stocks have beaten bonds, which have beaten cash, but stocks have also had the scariest drops.</p>`,
core:`<p><strong>What problem is this solving?</strong> "Return" is not one thing. Before you can compare or combine assets, you need to know <em>where each asset's return comes from</em>, because each source responds to different risks.</p>
<ul><li><strong>Equity:</strong> mostly price return (driven by growth expectations and discount rates) plus a variable distribution (dividends a board can cut).</li>
<li><strong>Fixed income:</strong> mostly a fixed distribution (coupons) plus price return driven by changes in interest rates and credit spreads. Prices move <em>inversely</em> to yields, and long-maturity bonds move the most.</li>
<li><strong>Short-term bills:</strong> no coupon; the whole return is the pull from a discounted price up to face value.</li>
<li><strong>Foreign assets:</strong> two returns stacked: the asset's local return and the currency's move. They compound, they don't just add.</li>
<li><strong>Indicators</strong> (rates, FX, indexes): don't pay you anything themselves but drive the value of what you hold.</li></ul>
<div class="call key"><strong>The risk-return tradeoff:</strong> rational investors demand more expected return for more risk (variability). Only <em>systematic</em> (macro) risk is rewarded, because unsystematic (issuer-specific) risk can be diversified away for free. This tradeoff drives asset allocation: an income-focused, risk-averse investor tilts to bonds; a growth-focused, risk-tolerant investor tilts to equities.</div>
<p>The <strong>credit spread</strong> is the extra yield corporate bonds pay over similar government bonds to compensate for default risk. When the market fears default more, spreads widen and corporate bond prices fall even if government yields don't move.</p>`,
formal:`<h4>Financial assets, instruments and indicators</h4>
<table><tr><th>Category</th><th>Main return source</th><th>Key risk driver</th></tr>
<tr><td>Common equity</td><td>Price return (capital appreciation); variable dividends</td><td>Earnings growth, discount rate, market risk</td></tr>
<tr><td>Fixed income (bonds)</td><td>Fixed coupons; smaller price return</td><td>Interest rate changes, credit spread changes</td></tr>
<tr><td>Money market (T-bills)</td><td>Discount accretion to face value</td><td>Virtually none (treated as risk-free)</td></tr>
<tr><td>Foreign assets</td><td>Local return compounded with currency return</td><td>FX moves</td></tr>
<tr><td>Indicators: interest rates, FX rates, indexes</td><td>No direct cash flows</td><td>Affect values of held assets</td></tr></table>
<h4>Key relationships</h4>
<ul><li>Bond prices fall when rates rise; the effect is larger for longer maturities.</li>
<li>Developed-market government bonds: low default risk; short-term bills: considered free of credit risk.</li>
<li>Corporate bond yield = government yield + credit spread; spread widening → corporate price falls.</li>
<li>A domestic investor in foreign assets gains when the foreign currency strengthens.</li></ul>
<h4>Long-term returns</h4>
<p>Historically, equities have earned the highest long-run returns with the highest volatility, followed by government bonds, then bills. Real returns (after inflation) matter for long horizons. Risk is measured by variability (standard deviation); systematic risk cannot be diversified and earns a premium, unsystematic risk can be diversified and earns none.</p>`,
math:`<div class="f"><span class="lbl">Total return on equity or a bond</span>R = (P₁ − P₀ + Income) / P₀</div>
<div class="f"><span class="lbl">Pure discount instrument (T-bill)</span>HPR = Face / Price − 1 &nbsp;·&nbsp; annualized = (1 + HPR)<sup>365/days</sup> − 1</div>
<p><strong>Why:</strong> a bill pays nothing until maturity, so the entire return is the gap between what you pay and the face value you get back.</p>
<div class="f"><span class="lbl">Domestic-currency return on a foreign asset</span>R<sub>DC</sub> = (1 + R<sub>FC</sub>)(1 + R<sub>FX</sub>) − 1</div>
<div class="vars"><div><code>R<sub>FC</sub></code><span>Return in the foreign (local) currency</span></div><div><code>R<sub>FX</sub></code><span>% change in the value of the foreign currency against your home currency</span></div></div>
<p><strong>Why multiply?</strong> Each foreign unit grows by (1 + R<sub>FC</sub>), and then each unit is worth (1 + R<sub>FX</sub>) times more in home currency. The cross term R<sub>FC</sub>×R<sub>FX</sub> is the "return on the return"; adding instead of compounding misses it.</p>
<div class="dir"><div>Foreign currency <span class="up">appreciates</span> → home-currency return <span class="up">↑</span></div><div>Interest rates <span class="up">↑</span> → bond prices <span class="dn">↓</span>, bigger drop for long maturities</div><div>Credit spread <span class="up">widens</span> → corporate bond price <span class="dn">↓</span></div></div>
<div class="f"><span class="lbl">Corporate yield building block</span>Corporate yield = Government yield (same maturity) + Credit spread</div>`,
example:`<div class="q">(a) A 91-day T-bill with face value 100 costs 98.80. Find its holding period and annualized returns. (b) A US investor holds a German stock that returned 6% in euros while the euro appreciated 4% against the dollar. Find the USD return. (c) A bond bought at 98 pays a 5 coupon and is sold at 101. Find its return and the share coming from coupon vs price.</div>
<ol class="steps"><li><strong>T-bill HPR</strong> = 100/98.80 − 1 = <strong>1.215%</strong> for 91 days.</li>
<li><strong>Annualize:</strong> 1.01215<sup>365/91</sup> − 1 = 1.01215<sup>4.011</sup> − 1 ≈ <strong>4.96%</strong>.</li>
<li><strong>Foreign stock:</strong> (1.06)(1.04) − 1 = <strong>10.24%</strong>. Simply adding (10%) misses the 0.24% cross term.</li>
<li><strong>Bond:</strong> (101 − 98 + 5)/98 = 8/98 = <strong>8.16%</strong>. Coupon part = 5/98 = 5.10%; price part = 3/98 = 3.06%. Typical bond profile: income dominates.</li></ol>
<p class="ans">Answers: 1.215% / ≈4.96% · 10.24% · 8.16% (5.10% income + 3.06% price)</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Adding local and currency returns. <b>Fix:</b> compound: (1+R<sub>FC</sub>)(1+R<sub>FX</sub>) − 1.</li>
<li><b>Trap:</b> Getting the currency direction backwards. <b>Fix:</b> you gain when the currency you <em>hold assets in</em> strengthens.</li>
<li><b>Trap:</b> Thinking long-term bonds are "safe" from rate rises. <b>Fix:</b> longer maturity = greater price sensitivity to rates.</li>
<li><b>Trap:</b> Expecting unsystematic risk to be rewarded. <b>Fix:</b> only non-diversifiable (systematic) risk earns a premium.</li>
<li><b>Trap:</b> Treating indexes or exchange rates as assets that generate cash flows. <b>Fix:</b> they are indicators; they affect value but pay nothing.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> foreign-asset return in home currency; T-bill return; which investor should hold more bonds vs equities; what happens to corporate bond prices when spreads widen; ranking long-run asset class returns and volatility.</li>
<li><strong>Pattern:</strong> "income needs + low risk tolerance" → more fixed income. "Growth + high risk tolerance" → more equity.</li>
<li><strong>Speed:</strong> For currency questions write "1.06 × 1.04" immediately; don't overthink quote conventions unless the question gives an exchange rate quote (then convert the % change first).</li>
<li>Expect conceptual questions more than heavy math in this reading.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Stocks grow, bonds pay</b>Equity return is mostly price; bond return is mostly coupon.</div>
<div class="anchor"><b>Two engines abroad</b>Foreign return = local engine × currency engine.</div>
<div class="anchor"><b>Seesaw</b>Rates up, bond prices down; long bonds sit at the far end of the seesaw.</div>
<div class="anchor"><b>Pay for the bumps</b>Higher expected return requires accepting more variability, but only market-wide bumps get paid.</div></div>`,
summary:`Equities earn mainly price return plus variable dividends; bonds earn mainly fixed coupons plus a price return that falls when interest rates or credit spreads rise (most for long maturities); T-bills earn only the discount accretion to face value and are treated as risk-free. Interest rates, exchange rates and indexes are indicators: they pay nothing but drive asset values. A foreign asset's home-currency return is (1+R<sub>FC</sub>)(1+R<sub>FX</sub>) − 1, so a strengthening foreign currency helps. Higher risk must offer higher expected return, but only systematic risk is rewarded; historically equities > bonds > bills in both return and volatility, which is why risk-averse income seekers hold more bonds and growth seekers more equities.`
},
quiz:[
{q:"A Japanese stock returns 8% in yen while the yen depreciates 5% against the euro. A euro-based investor's return is closest to:",o:["2.6%","3.0%","13.4%"],a:0,e:"(1.08)(0.95) − 1 = 2.6%. Adding gives 3.0%, missing the cross term; 13.4% gets the currency direction wrong."},
{q:"Which bond is likely to experience the largest price decline if interest rates rise 1%?",o:["A 1-year government bill","A 5-year corporate bond","A 30-year government bond"],a:2,e:"Price sensitivity to rates increases with maturity. Default risk is not the driver here."},
{q:"Which risk is an investor NOT compensated for bearing?",o:["Risk that the economy enters recession","Risk that a single company's CEO resigns","Risk that interest rates rise across the market"],a:1,e:"CEO departure is issuer-specific (unsystematic) and can be diversified away, so it earns no premium."}]
});

/* ===================== READING 3 ===================== */
add({n:3,topic:"quant",title:"Benchmarking Returns",
los:["3.a Calculate and compare money-weighted and time-weighted rates of return.","3.b Describe the choices and the implications of the different weighting methods used in index construction and management, and calculate, interpret, and explain the value and the returns of an index."],
s:{
eli5:`<p>Two friends, Ana and Ben, invest in the <em>same</em> fund. In year 1 the fund gains 22%; in year 2 it gains 10%. Ana puts $100 in at the start and leaves it. Ben puts $100 in at the start and, excited by year 1, adds another $1,000 at the end of year 1. Ben's big chunk only enjoys the weaker 10% year, so Ben's personal return is lower than Ana's, even though the fund did exactly the same thing for both.</p>
<p>So there are two questions: <strong>"How good was the fund manager?"</strong> (ignore when people added money → <em>time-weighted</em> return) and <strong>"How did my money do?"</strong> (count every dollar for as long as it was in → <em>money-weighted</em> return).</p>
<p>An <strong>index</strong> is a scoreboard for a whole market. But you must decide how much each player counts: by share price (price-weighted), equally, or by company size (cap-weighted). Change the rule and the scoreboard tells a different story.</p>`,
core:`<p><strong>What problem is this solving?</strong> Fair evaluation. Investors need to judge managers and compare portfolios to the market, and both depend on <em>how</em> you measure.</p>
<h4>Money-weighted vs time-weighted</h4>
<p>The <strong>money-weighted return (MWR)</strong> is the IRR of the investor's cash flows. It gives more weight to periods when more money was invested, so it mixes the manager's skill with the investor's timing. The <strong>time-weighted return (TWR)</strong> breaks the horizon at every cash flow, computes each sub-period's return, and links them geometrically. Each sub-period counts equally regardless of how much money was in it, so cash-flow timing disappears. That is why TWR is the industry standard for judging managers (GIPS), unless the manager controls the flows (then MWR is appropriate).</p>
<div class="call key"><strong>Cause → effect:</strong> Money added just before a <em>good</em> period → MWR &gt; TWR. Money added just before a <em>bad</em> period → MWR &lt; TWR.</div>
<h4>Index weighting</h4>
<p>An index is just a weighted portfolio. The weighting decides what the index "believes":</p>
<ul><li><strong>Price-weighted:</strong> high-priced shares dominate. Arbitrary (a stock split changes the weight without changing the company). Like holding one share of each.</li>
<li><strong>Equal-weighted:</strong> small companies count as much as giants → small-cap tilt; needs frequent rebalancing because weights drift.</li>
<li><strong>Market-cap (float-adjusted) weighted:</strong> weight = company size; mirrors the investable market; self-rebalancing; but overweights possibly overvalued, momentum stocks.</li>
<li><strong>Fundamental-weighted:</strong> weights from earnings, sales, book value or cash flow; independent of price, giving a value tilt and contrarian rebalancing.</li></ul>`,
formal:`<h4>Money-weighted return</h4>
<p>The discount rate that sets PV(inflows) = PV(outflows) for the investor's cash flows: contributions are outflows, withdrawals/ending value are inflows. Appropriate when the manager controls the timing of flows.</p>
<h4>Time-weighted return</h4>
<ol><li>Value the portfolio immediately before each external cash flow.</li><li>Compute each sub-period HPR.</li><li>Link: (1+R₁)(1+R₂)…(1+Rₙ) − 1; take the n-th root for an annual figure if the horizon covers several years.</li></ol>
<p>Preferred measure of manager skill because it is unaffected by client deposits/withdrawals.</p>
<h4>Security market indexes</h4>
<p><strong>Price return index</strong> uses prices only; <strong>total return index</strong> also reinvests income. Over long periods the gap is large.</p>
<p>Index management steps: (1) define target market, (2) select constituents, (3) choose weighting, (4) calculate values, (5) rebalance (restore target weights) and reconstitute (change constituents).</p>
<table><tr><th>Method</th><th>Weight of stock i</th><th>Key feature / bias</th></tr>
<tr><td>Price</td><td>Pᵢ / ΣP</td><td>Divisor adjusts for splits/changes; high-priced stocks dominate</td></tr>
<tr><td>Equal</td><td>1/N</td><td>Small-cap bias; frequent rebalancing; high turnover</td></tr>
<tr><td>Market-cap</td><td>PᵢQᵢ / ΣPQ</td><td>Float adjustment uses shares available to trade; large-cap/momentum bias</td></tr>
<tr><td>Fundamental</td><td>Fᵢ / ΣF</td><td>Value tilt; needs rebalancing</td></tr></table>`,
math:`<div class="f"><span class="lbl">Money-weighted return (IRR)</span>Σ CF<sub>t</sub> / (1 + MWR)<sup>t</sup> = 0</div>
<p><strong>Why:</strong> IRR is the single constant rate that "explains" all your cash in and out. Big deposits carry big weight in that equation, which is exactly why MWR reflects the investor's timing.</p>
<div class="f"><span class="lbl">Time-weighted return</span>TWR = [(1 + R₁)(1 + R₂)…(1 + Rₙ)]<sup>1/years</sup> − 1</div>
<p><strong>Why:</strong> each sub-period return is computed per dollar invested, so the size of the pot doesn't matter. Linking geometrically gives the compound growth of $1 left untouched.</p>
<div class="f"><span class="lbl">Price-weighted index</span>Index = ΣPᵢ / Divisor &nbsp;·&nbsp; after a split, choose a new divisor so the index value is unchanged</div>
<div class="f"><span class="lbl">Market-cap-weighted index</span>Index₁ = Index₀ × (ΣP₁Q₁ / ΣP₀Q₀)</div>
<div class="f"><span class="lbl">Equal-weighted index return</span>R = (1/N) ΣRᵢ</div>
<div class="dir"><div>High-priced stock jumps → big effect on price-weighted, smaller on cap-weighted (unless it's also large)</div><div>Small stocks outperform → equal-weighted beats cap-weighted</div><div>Stock splits 2-for-1 → its weight <span class="dn">halves</span> in a price-weighted index</div></div>
<div class="calc" data-calc="twr"></div>`,
example:`<div class="q">(a) An investor buys 1 share at $100 (t=0). At t=1 the stock pays a $2 dividend and she buys another share at $120. At t=2 each share pays $2 and she sells both at $130. Find MWR and TWR. (b) An index has three stocks: A (1,000 shares) $20 → $25; B (300 shares) $50 → $45; C (100 shares) $80 → $88. Find price-, equal- and cap-weighted returns.</div>
<ol class="steps"><li><strong>Cash flows (investor view):</strong> t0: −100; t1: +2 − 120 = −118; t2: 2 × (130 + 2) = +264.</li>
<li><strong>MWR:</strong> solve −100 − 118/(1+r) + 264/(1+r)² = 0 → <strong>r ≈ 13.86%</strong> (CF keys: CF0 −100, C01 −118, C02 264, IRR).</li>
<li><strong>TWR:</strong> year 1: (120 + 2 − 100)/100 = 22%; year 2: (130 + 2 − 120)/120 = 10%. TWR = (1.22 × 1.10)<sup>½</sup> − 1 = <strong>15.84%</strong>. MWR &lt; TWR because she doubled her holding just before the weaker year.</li>
<li><strong>Price-weighted:</strong> sum 150 → 158, so return = 158/150 − 1 = <strong>5.33%</strong>.</li>
<li><strong>Equal-weighted:</strong> (25% − 10% + 10%)/3 = <strong>8.33%</strong>.</li>
<li><strong>Cap-weighted:</strong> begin 20,000 + 15,000 + 8,000 = 43,000; end 25,000 + 13,500 + 8,800 = 47,300 → <strong>10.0%</strong>. Stock A is the largest company and had the best return, so cap weighting wins here.</li></ol>
<p class="ans">Answers: MWR 13.86%, TWR 15.84% · Price 5.33%, Equal 8.33%, Cap 10.0%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using MWR to rank managers who don't control client flows. <b>Fix:</b> TWR for manager skill; MWR only when the manager controls flows.</li>
<li><b>Trap:</b> Averaging sub-period returns arithmetically for TWR. <b>Fix:</b> link geometrically, then take the root for multi-year horizons.</li>
<li><b>Trap:</b> Forgetting dividends as inflows (and new purchases as outflows) in MWR. <b>Fix:</b> list each date's net cash flow before keying.</li>
<li><b>Trap:</b> Thinking a stock split changes a price-weighted index level. <b>Fix:</b> the divisor is adjusted so the level is unchanged; only future weights change.</li>
<li><b>Trap:</b> Believing cap-weighted indexes need lots of rebalancing. <b>Fix:</b> they self-adjust with prices; equal and fundamental weighting need rebalancing.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> calculate MWR/TWR from a short cash-flow table; state which is higher and why; compute index returns under each weighting; identify the bias of each weighting method; effect of a stock split.</li>
<li><strong>Shortcut:</strong> to decide MWR vs TWR without computing: did money arrive before the good or bad period? Good → MWR higher.</li>
<li><strong>Calculator:</strong> MWR is just the CF worksheet IRR. Enter net cash flow per date (deposit negative, withdrawal/ending value positive).</li>
<li><strong>Index trap:</strong> price-weighted return only needs the <em>sum of prices</em>; ignore shares outstanding.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>TWR = the Manager's report card</b>"Time" ignores the client's timing.</div>
<div class="anchor"><b>MWR = My Wallet's Return</b>Your deposits, your timing, your IRR.</div>
<div class="anchor"><b>Price-weighted = "one share of each"</b>Expensive shares shout loudest.</div>
<div class="anchor"><b>Equal = small-cap tilt; Cap = big-cap tilt; Fundamental = value tilt</b>Every weighting has a hidden bet.</div></div>`,
summary:`The money-weighted return is the IRR of an investor's cash flows; it reflects both performance and the timing/size of deposits, so it exceeds the time-weighted return when money is added before strong periods. The time-weighted return links sub-period returns geometrically, removes the effect of external flows, and is the standard for evaluating managers who don't control flows. Indexes are weighted portfolios: price-weighted (sum of prices ÷ divisor, high-priced stocks dominate, divisor adjusts for splits), equal-weighted (small-cap bias, frequent rebalancing), market-cap/float-weighted (mirrors the market, self-rebalancing, large-cap/momentum bias) and fundamental-weighted (value tilt). Price indexes ignore income; total return indexes reinvest it. Managing an index requires periodic rebalancing and reconstitution.`
},
quiz:[
{q:"A client adds a large amount to her account just before the manager's best year. Compared with the TWR, her MWR will most likely be:",o:["higher","lower","the same"],a:0,e:"More money was invested during the high-return period, so the IRR (MWR) gets pulled up above the TWR."},
{q:"Which index weighting method requires the divisor to be adjusted when a constituent splits its stock?",o:["Equal-weighted","Price-weighted","Market-capitalization-weighted"],a:1,e:"A split cuts the price, which would drop a price-weighted index for no economic reason, so the divisor is reduced to keep the level unchanged."},
{q:"Which weighting method is most likely to have a value tilt and contrarian rebalancing?",o:["Fundamental-weighted","Market-cap-weighted","Price-weighted"],a:0,e:"Weights based on earnings/sales/book don't rise with price, so stocks that become expensive get relatively underweighted, which is a value tilt."}]
});

/* ===================== READING 4 ===================== */
add({n:4,topic:"quant",title:"The Time Value of Money in Finance",
los:["4.a Calculate and interpret the present value of fixed-income and equity instruments based on expected future cash flows.","4.b Calculate and interpret the implied return of fixed-income instruments and required return and implied growth of equity instruments given their present value and cash flows.","4.c Explain the cash flow additivity principle and its importance for the no-arbitrage condition, and explain its use in calculating implied forward interest rates, forward exchange rates, and option values."],
s:{
eli5:`<p>Would you rather have $100 today or $100 next year? Today, obviously: you could put it in a bank and have $105 next year. So <strong>$105 next year is "worth" $100 today</strong>. Shrinking future money back to today's value is called <em>discounting</em>, and it's the single most important tool in finance.</p>
<p>A bond is just a list of IOUs: "$60 every year for 5 years, then $1,000 back." A stock is a never-ending list of dividends. To know what either is worth today, shrink each future payment back to today and add them up.</p>
<p>And a neat rule: <strong>if two things pay you exactly the same money at exactly the same times, they must cost the same today</strong>. Otherwise you could buy the cheap one, sell the expensive one, and pocket free money. That's "no arbitrage", and it lets us work out forward interest rates, forward exchange rates, and even option prices.</p>`,
core:`<p><strong>What problem is this solving?</strong> Cash flows arrive at different times and with different risks. TVM converts all of them into one currency: <em>dollars today</em>. Once everything is in today's dollars, you can compare, add and price.</p>
<ul><li><strong>Price and required return move in opposite directions.</strong> The cash flows are fixed by the contract (bonds) or by expectations (stocks); if investors demand a higher return, the only thing that can adjust is today's price, which falls.</li>
<li><strong>Running it backwards gives implied returns.</strong> If you know the price and the cash flows, the discount rate that links them is the market's implied return: the bond's yield to maturity, or a stock's implied required return (dividend yield + growth).</li>
<li><strong>Cash flow additivity:</strong> PV is linear, so you can slice a cash-flow stream any way you like (coupons separately from principal, year 1 separately from year 2), value the pieces, and add them back up. Two routes to the same future cash must cost the same today. That single idea gives forward rates (invest 2 years vs invest 1 year then roll), forward FX rates (hedge via the forward vs borrow/lend in two currencies), and option values (replicate the option with stock + borrowing).</li></ul>
<div class="call key"><strong>Cause → effect:</strong> required return ↑ → PV ↓. Growth ↑ → equity PV ↑. Coupon &gt; yield → bond priced above par (premium); coupon &lt; yield → discount.</div>`,
formal:`<h4>Fixed income</h4>
<ul><li><strong>Zero-coupon (discount) bond:</strong> PV = FV/(1+r)<sup>t</sup>.</li>
<li><strong>Coupon bond:</strong> PV = PV of the coupon annuity + PV of the face value. Use the periodic rate and number of periods (semiannual: r/2 and 2N).</li>
<li><strong>Perpetual bond / preferred stock:</strong> PV = payment / r.</li>
<li><strong>Amortizing loan (annuity):</strong> constant payment covering interest and principal.</li>
<li><strong>Yield to maturity:</strong> the IRR equating price and promised cash flows; assumes holding to maturity, no default, reinvestment at the YTM.</li></ul>
<h4>Equity</h4>
<ul><li><strong>Constant-growth (Gordon) DDM:</strong> V₀ = D₁/(r − g), requires r &gt; g.</li>
<li><strong>Multistage models:</strong> discount the high-growth dividends individually, then add a terminal value using the Gordon model at the start of constant growth, discounted back.</li>
<li>Rearranged: <strong>r = D₁/P₀ + g</strong> (required return) and <strong>g = r − D₁/P₀</strong> (implied growth).</li></ul>
<h4>Cash flow additivity and no arbitrage</h4>
<ul><li><strong>Implied forward rate:</strong> (1+S₂)² = (1+S₁)(1+F₁,₁).</li>
<li><strong>Forward FX:</strong> F = S × (1 + i<sub>price</sub>)/(1 + i<sub>base</sub>).</li>
<li><strong>One-period binomial option:</strong> build a portfolio of the underlying + risk-free borrowing/lending that replicates the option payoffs; its cost is the option value. Equivalently, use risk-neutral probabilities and discount at the risk-free rate.</li></ul>`,
math:`<div class="f"><span class="lbl">Core</span>PV = FV / (1 + r)<sup>t</sup> &nbsp;&nbsp;·&nbsp;&nbsp; FV = PV × (1 + r)<sup>t</sup></div>
<div class="f"><span class="lbl">Coupon bond</span>P = C × [1 − (1+r)<sup>−N</sup>] / r + FV / (1+r)<sup>N</sup></div>
<div class="vars"><div><code>C</code><span>Coupon per period</span></div><div><code>r</code><span>Market yield per period</span></div><div><code>N</code><span>Number of periods</span></div><div><code>FV</code><span>Face (par) value repaid at maturity</span></div></div>
<p><strong>Why:</strong> the bracket is the annuity factor, the sum of N discount factors. You're adding up every coupon's PV plus the face value's PV.</p>
<div class="f"><span class="lbl">Perpetuity and Gordon growth</span>PV<sub>perp</sub> = C / r &nbsp;&nbsp;·&nbsp;&nbsp; V₀ = D₁ / (r − g) = D₀(1 + g) / (r − g)</div>
<p><strong>Why (r − g)?</strong> The dividend stream is a perpetuity whose payments grow at g while being discounted at r; the effective "net" discount rate is r − g. As g approaches r, value explodes. That's why r must exceed g.</p>
<div class="dir"><div>r <span class="up">↑</span> → V₀ <span class="dn">↓</span> &nbsp;·&nbsp; g <span class="up">↑</span> → V₀ <span class="up">↑</span> &nbsp;·&nbsp; small change in (r − g) → huge change in value</div></div>
<div class="f"><span class="lbl">Implied returns</span>r = D₁/P₀ + g &nbsp;(dividend yield + growth) &nbsp;&nbsp;·&nbsp;&nbsp; g = r − D₁/P₀</div>
<div class="f"><span class="lbl">Implied forward rate</span>(1 + S<sub>B</sub>)<sup>B</sup> = (1 + S<sub>A</sub>)<sup>A</sup> × (1 + F<sub>A→B</sub>)<sup>B−A</sup></div>
<p><strong>Why:</strong> investing for B years must give the same as investing for A years then locking in the forward rate for the rest; otherwise arbitrage.</p>
<div class="f"><span class="lbl">Forward exchange rate (price/base quote)</span>F = S × (1 + i<sub>price</sub>) / (1 + i<sub>base</sub>)</div>
<div class="f"><span class="lbl">One-period binomial option</span>Hedge ratio h = (c<sub>u</sub> − c<sub>d</sub>)/(S<sub>u</sub> − S<sub>d</sub>) &nbsp;·&nbsp; π<sub>up</sub> = (1 + R<sub>f</sub> − d)/(u − d) &nbsp;·&nbsp; c₀ = [π c<sub>u</sub> + (1−π) c<sub>d</sub>] / (1 + R<sub>f</sub>)</div>
<div class="calc" data-calc="bond"></div>
<div class="calc" data-calc="ggm"></div>
<div class="calc" data-calc="fwd"></div>`,
example:`<div class="q">(a) Price a 5-year, 6% annual-coupon, $1,000 bond when the market yield is 8%. (b) A stock just paid D₀ = $2.00; dividends grow 4% forever; required return 9%. Value it. If it actually trades at $40, what return does that price imply? (c) 1-year spot rate 3%, 2-year spot rate 4%: find the 1-year rate one year forward. (d) A stock at $50 will be $60 or $40 in a year; R<sub>f</sub> = 5%. Value a 1-year call with strike $50.</div>
<ol class="steps"><li><strong>Bond:</strong> annuity factor = (1 − 1.08<sup>−5</sup>)/0.08 = 3.9927 → coupons PV = 60 × 3.9927 = 239.56; principal PV = 1,000/1.08⁵ = 680.58. <strong>Price = $920.15</strong> (discount, because coupon 6% &lt; yield 8%). Calculator: N=5, I/Y=8, PMT=60, FV=1000, CPT PV.</li>
<li><strong>Stock:</strong> D₁ = 2.00 × 1.04 = 2.08 → V₀ = 2.08/(0.09 − 0.04) = <strong>$41.60</strong>. At $40, implied r = 2.08/40 + 4% = 5.2% + 4% = <strong>9.2%</strong>; the lower price implies a higher return.</li>
<li><strong>Forward:</strong> (1.04)² = 1.03 × (1 + F) → F = 1.0816/1.03 − 1 = <strong>5.01%</strong>. Shortcut: ≈ 2 × 4% − 3% = 5%.</li>
<li><strong>Option:</strong> u = 1.2, d = 0.8. Payoffs: c<sub>u</sub> = 10, c<sub>d</sub> = 0. π = (1.05 − 0.8)/(1.2 − 0.8) = 0.625. c₀ = 0.625 × 10/1.05 = <strong>$5.95</strong>. Replication check: buy h = 0.5 share ($25) and borrow 20/1.05 = $19.05 → cost $5.95. Same answer, by no-arbitrage.</li></ol>
<p class="ans">Answers: $920.15 · $41.60 and 9.2% · 5.01% · $5.95</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using D₀ instead of D₁ in the Gordon model. <b>Fix:</b> numerator is <em>next</em> year's dividend; if given "just paid", grow it once.</li>
<li><b>Trap:</b> Semiannual bonds with annual inputs. <b>Fix:</b> halve the coupon and the yield, double N.</li>
<li><b>Trap:</b> Calculator sign errors (PV and FV same sign). <b>Fix:</b> money you pay is negative, money you receive positive.</li>
<li><b>Trap:</b> Using the real-world probability of an up-move to value the option. <b>Fix:</b> use risk-neutral π and discount at R<sub>f</sub>.</li>
<li><b>Trap:</b> Flipping the FX forward formula. <b>Fix:</b> the <em>price</em> currency's rate goes on top, matching the numerator of the quote.</li>
<li><b>Trap:</b> Applying Gordon when g ≥ r. <b>Fix:</b> invalid; use a multistage model.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> price a bond; find a YTM; value a preferred share; Gordon model value, implied r or implied g; implied forward rate; forward FX from interest rates; a one-period binomial call or put.</li>
<li><strong>Shortcuts:</strong> coupon vs yield tells you premium/discount before calculating; this eliminates answer choices instantly. Forward-rate approximation (weighted difference of spot rates) helps pick the right choice.</li>
<li><strong>Pattern:</strong> "multistage": discount each explicit dividend, add terminal value V<sub>n</sub> = D<sub>n+1</sub>/(r − g) discounted back n periods (not n+1!).</li>
<li><strong>Time:</strong> trust the TVM keys; clear the worksheet (2nd CLR TVM) before each problem.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>A dollar today is a dollar with a job</b>It can earn interest, so future dollars are worth less.</div>
<div class="anchor"><b>Seesaw again</b>Required return up → price down. Always.</div>
<div class="anchor"><b>"Next" dividend over "net" rate</b>V = D<sub>next</sub> / (r − g).</div>
<div class="anchor"><b>Same cash, same price</b>Cash flow additivity + no arbitrage = forward rates, forward FX and options from one rule.</div>
<div class="anchor"><b>Lego bricks</b>Cut cash flows into pieces, value each, snap them back together.</div></div>`,
summary:`Any instrument is worth the present value of its expected cash flows: bonds = PV of coupons (annuity) + PV of face value; perpetuities and preferred stock = payment/r; common stock with constant growth = D₁/(r − g). Price and required return move inversely, and running the formulas backwards gives implied returns (a bond's YTM; a stock's r = D₁/P₀ + g) or implied growth (g = r − D₁/P₀). Cash-flow additivity says PV is linear, so pieces can be valued separately and added; with no arbitrage, identical future cash flows must cost the same today. That principle produces implied forward rates ((1+S₂)² = (1+S₁)(1+F)), forward FX rates (F = S(1+i<sub>price</sub>)/(1+i<sub>base</sub>)) and option values via replication or risk-neutral probabilities.`
},
quiz:[
{q:"A 10-year bond has a 7% coupon and the market yield is 6%. Without calculating, the bond trades:",o:["at a premium","at par","at a discount"],a:0,e:"Coupon above market yield → investors pay more than par for the above-market coupons."},
{q:"A stock trades at $50, next year's dividend is $2.50, and the required return is 11%. The implied constant growth rate is:",o:["5.0%","6.0%","16.0%"],a:1,e:"g = r − D₁/P₀ = 11% − 2.50/50 = 11% − 5% = 6%."},
{q:"The 2-year spot rate is 5% and the 1-year spot rate is 4%. The 1-year forward rate one year from now is closest to:",o:["5.0%","6.0%","4.5%"],a:1,e:"(1.05)²/1.04 − 1 = 1.1025/1.04 − 1 ≈ 6.01%. Approx: 2×5 − 4 = 6%."}]
});
