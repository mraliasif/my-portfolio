los:["87.a Describe characteristics of the major asset classes that investors consider in forming portfolios.","87.b Explain risk aversion and its implications for portfolio selection.","87.c Explain the selection of an optimal portfolio, given an investor's utility (or risk aversion) and the capital allocation line.","87.d Calculate and interpret the mean, variance, and covariance (or correlation) of asset returns based on historical data.","87.e Calculate and interpret portfolio standard deviation.","87.f Describe the effect on a portfolio's risk of investing in assets that are less than perfectly correlated.","87.g Describe and interpret the minimum-variance and efficient frontiers of risky assets and the global minimum-variance portfolio."],
s:{
eli5:`<p>Over the last century, small company stocks have given the biggest rewards but also the scariest drops; big company stocks a bit less of both; bonds less again; and Treasury bills the least of all. Bigger reward, bumpier ride: that's the deal markets offer.</p>
<p>Most people are <strong>risk averse</strong>: offered a sure $100 or a coin flip for $0 or $200, they take the sure $100. They'll only accept bumps if they're paid extra for them.</p>
<p>The clever trick is <strong>mixing</strong>. If you own an ice-cream shop and an umbrella shop, bad weather hurts one and helps the other, so your total income is steadier than either alone. Combine investments that don't move in lockstep and your total ride gets smoother without giving up average return. The best possible mixes trace a curve called the <strong>efficient frontier</strong>.</p>`,
core:`<p><strong>What problem is this solving?</strong> Given many assets with different risks and returns, which combination should an investor hold? The answer depends on (1) what's available (the efficient frontier) and (2) the investor's taste for risk (indifference curves).</p>
<ul><li><strong>History confirms the trade-off:</strong> higher average return has come with higher volatility (small caps &gt; large caps &gt; long corporate bonds &gt; long Treasuries &gt; T-bills). Investors also consider liquidity and non-normal features (skewness, kurtosis).</li>
<li><strong>Risk aversion</strong> shapes choices. Risk-averse investors demand compensation for risk (upward-sloping indifference curves, steeper = more averse); risk-neutral investors care only about expected return; risk seekers prefer risk. Markets are priced by risk-averse investors.</li>
<li><strong>Utility U = E(R) − ½Aσ²</strong> scores portfolios: return minus a risk penalty scaled by aversion A.</li>
<li><strong>Diversification</strong>: portfolio risk depends on correlations. With ρ = +1, no risk reduction; as ρ falls toward −1, portfolio σ falls below the weighted average; at ρ = −1 a zero-risk combination exists.</li>
<li><strong>Frontiers:</strong> the minimum-variance frontier lists the lowest-risk portfolio for each return; its top half (above the global minimum-variance portfolio) is the efficient frontier, the only part a risk-averse investor should choose from.</li>
<li><strong>Optimal portfolio</strong> = where the investor's highest attainable indifference curve touches the opportunity set (the efficient frontier, or the CAL if a risk-free asset exists).</li></ul>`,
formal:`<h4>Major asset classes (historical, long-run)</h4>
<p>Small-cap stocks: highest mean return and σ; large-cap stocks; long-term corporate bonds; long-term government bonds; T-bills: lowest return and σ. Real returns matter after inflation. Returns are not perfectly normal (skewness, kurtosis); liquidity also matters.</p>
<h4>Risk attitudes</h4>
<ul><li>Risk-averse: prefers less risk for the same return; holds risky assets only if compensated.</li>
<li>Risk-neutral: indifferent to σ; maximizes expected return.</li>
<li>Risk-seeking: prefers more risk at the same expected return.</li>
<li>Indifference curves: combinations of E(R) and σ with equal utility; upward sloping and convex for risk-averse investors; steeper = more risk averse; higher curves = more utility.</li></ul>
<h4>Statistics from historical data</h4>
<ul><li>Mean: R̄ = ΣR<sub>t</sub>/T. Population variance σ² = Σ(R<sub>t</sub> − μ)²/T; sample variance s² = Σ(R<sub>t</sub> − R̄)²/(T − 1).</li>
<li>Covariance: Cov₁,₂ = Σ(R₁ − R̄₁)(R₂ − R̄₂)/(T − 1) (sample). Correlation ρ = Cov/(σ₁σ₂), bounded −1 to +1.</li></ul>
<h4>Portfolio risk</h4>
<p>σ<sub>p</sub> = √[w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρ₁,₂σ₁σ₂]. Greatest risk at ρ = +1; risk decreases as ρ decreases; lower correlation = greater diversification benefit.</p>
<h4>Frontiers</h4>
<ul><li>Minimum-variance portfolio: least risk for a given expected return; together they form the minimum-variance frontier.</li>
<li>Global minimum-variance portfolio: leftmost point (lowest risk of any risky portfolio).</li>
<li>Efficient frontier: portion of the minimum-variance frontier above the GMV: highest return for each risk level. Risk-averse investors choose only efficient portfolios.</li>
<li>Optimal portfolio: tangency of the highest indifference curve with the efficient frontier (or CAL). Less risk-averse investors (flatter curves) choose higher-risk, higher-return portfolios with more in risky assets.</li></ul>`,
math:`<div class="f"><span class="lbl">Sample variance and covariance from history</span>s² = Σ(R<sub>t</sub> − R̄)² / (T − 1) &nbsp;&nbsp;·&nbsp;&nbsp; Cov₁,₂ = Σ(R₁,<sub>t</sub> − R̄₁)(R₂,<sub>t</sub> − R̄₂) / (T − 1) &nbsp;&nbsp;·&nbsp;&nbsp; ρ = Cov / (s₁s₂)</div>
<div class="f"><span class="lbl">Two-asset portfolio</span>E(R<sub>p</sub>) = w₁E(R₁) + w₂E(R₂) &nbsp;&nbsp;·&nbsp;&nbsp; σ<sub>p</sub> = √[w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂]</div>
<p><strong>Why risk isn't a weighted average:</strong> the third term captures how the two assets interact. Positive co-movement adds to risk; negative co-movement subtracts. Only at ρ = +1 does σ<sub>p</sub> equal the weighted average of σ's.</p>
<div class="f"><span class="lbl">Utility</span>U = E(R) − ½ × A × σ² &nbsp;(use decimals)</div>
<div class="vars"><div><code>A</code><span>Risk-aversion coefficient: &gt;0 averse, 0 neutral, &lt;0 seeking</span></div><div><code>½Aσ²</code><span>The "risk penalty" deducted from expected return</span></div></div>
<div class="dir"><div>ρ <span class="dn">↓</span> → σ<sub>p</sub> <span class="dn">↓</span> (E(R<sub>p</sub>) unchanged)</div><div>A <span class="up">↑</span> → steeper indifference curves → optimal portfolio has lower risk</div><div>Same E(R), higher σ → lower utility for a risk-averse investor</div></div>
<div class="calc" data-calc="port"></div>
<div class="calc" data-calc="util"></div>`,
example:`<div class="q">Returns over three years: Stock A: 10%, 20%, 0%. Stock B: 5%, 15%, 10%. (a) Means and sample standard deviations. (b) Sample covariance and correlation. (c) σ of a 50/50 portfolio. (d) An investor with A = 4 chooses between Portfolio X (E = 9%, σ = 15%) and Y (E = 7%, σ = 8%). Which?</div>
<ol class="steps"><li><strong>Means:</strong> A = 30/3 = 10%; B = 30/3 = 10%.</li>
<li><strong>Deviations:</strong> A: 0, +10, −10 → s² = 200/2 = 100 → s<sub>A</sub> = <strong>10%</strong>. B: −5, +5, 0 → s² = 50/2 = 25 → s<sub>B</sub> = <strong>5%</strong>.</li>
<li><strong>Covariance:</strong> (0)(−5) + (10)(5) + (−10)(0) = 50 → 50/2 = <strong>25 (%²)</strong>. ρ = 25/(10 × 5) = <strong>0.50</strong>.</li>
<li><strong>Portfolio:</strong> σ² = 0.25(100) + 0.25(25) + 2(0.5)(0.5)(25) = 25 + 6.25 + 12.5 = 43.75 → σ = <strong>6.61%</strong>, below the 7.5% weighted average.</li>
<li><strong>Utility:</strong> U<sub>X</sub> = 0.09 − 0.5 × 4 × 0.0225 = 0.045 (<strong>4.5%</strong>); U<sub>Y</sub> = 0.07 − 2 × 0.0064 = 0.0572 (<strong>5.72%</strong>) → choose <strong>Y</strong>.</li></ol>
<p class="ans">Answers: means 10%/10%, σ 10%/5% · Cov 25, ρ 0.5 · σ<sub>p</sub> 6.61% · choose Y (U 5.72% vs 4.5%)</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Dividing by T for sample variance. <b>Fix:</b> sample → T − 1; population → T.</li>
<li><b>Trap:</b> Using percentages in utility (9 − 0.5×4×225). <b>Fix:</b> decimals.</li>
<li><b>Trap:</b> Thinking a more risk-averse investor has flatter indifference curves. <b>Fix:</b> steeper.</li>
<li><b>Trap:</b> Choosing a portfolio below the GMV on the frontier. <b>Fix:</b> only the upper (efficient) part is optimal for risk-averse investors.</li>
<li><b>Trap:</b> Believing diversification lowers expected return. <b>Fix:</b> it lowers risk; expected return is still the weighted average.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> rank asset classes by historical return/risk; risk-averse vs neutral vs seeking; utility calculation; sample variance/covariance from 3–5 data points; portfolio σ; effect of correlation; identify GMV and efficient frontier on a graph.</li>
<li><strong>Calculator:</strong> 2nd DATA with X and Y, then 2nd STAT (LIN) gives s<sub>x</sub>, s<sub>y</sub> and r. Covariance = r × s<sub>x</sub> × s<sub>y</sub>.</li>
<li><strong>Shortcut:</strong> ρ = −1 allows zero risk with w₁ = σ₂/(σ₁ + σ₂).</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Ice cream + umbrellas</b>Low correlation smooths the ride.</div>
<div class="anchor"><b>U = E − ½Aσ²</b>Return minus a risk penalty that grows with your fear.</div>
<div class="anchor"><b>Steep = scared</b>Steeper indifference curves = more risk averse.</div>
<div class="anchor"><b>Top of the bullet</b>Efficient frontier = upper part of the minimum-variance "bullet".</div></div>`,
summary:`Historically, asset classes with higher average returns (small caps, then large caps, long corporate and government bonds, T-bills) have had higher risk, and investors also weigh liquidity and non-normal features. Risk-averse investors (who set market prices) require compensation for risk; risk-neutral investors ignore it; risk seekers prefer it. Utility U = E(R) − ½Aσ² is represented by upward-sloping indifference curves, steeper for more risk-averse investors, and the optimal portfolio is where the highest indifference curve touches the opportunity set, so less risk-averse investors hold riskier portfolios. From historical data, sample variance and covariance divide by T − 1, and correlation = Cov/(σ₁σ₂). Two-asset portfolio σ = √(w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂) is highest at ρ = +1 and falls as correlation falls. The minimum-variance frontier gives the lowest risk for each return; its leftmost point is the global minimum-variance portfolio, and the portion above it is the efficient frontier.`
},
quiz:[
{q:"Compared with a less risk-averse investor, a more risk-averse investor's indifference curves are:",o:["flatter","steeper","downward sloping"],a:1,e:"A more risk-averse investor needs more return per unit of extra risk, so curves are steeper."},
{q:"Two assets each have σ = 20%. The risk of an equally weighted portfolio will be lowest when correlation is:",o:["+1.0","0.0","−1.0"],a:2,e:"Lower correlation → lower portfolio risk; at ρ = −1 the 50/50 portfolio has zero risk here."},
{q:"With A = 2, which portfolio has higher utility: X (E 12%, σ 20%) or Y (E 10%, σ 12%)?",o:["X","Y","Equal"],a:1,e:"U_X = 0.12 − 0.04 = 8%; U_Y = 0.10 − 0.0144 = 8.56%."}]
});

/* ===================== READING 88 ===================== */
add({n:88,topic:"pm",title:"Portfolio Risk and Return: Part II",
los:["88.a Describe the implications of combining a risk-free asset with a portfolio of risky assets.","88.b Explain the capital allocation line (CAL) and the capital market line (CML).","88.c Explain systematic and nonsystematic risk, including why an investor should not expect to receive additional return for bearing nonsystematic risk.","88.d Explain return generating models (including the market model) and their uses.","88.e Calculate and interpret beta.","88.f Explain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML).","88.g Calculate and interpret the expected return of an asset using the CAPM.","88.h Describe and demonstrate applications of the CAPM and the SML.","88.i Calculate and interpret the Sharpe ratio, Treynor ratio, M², and Jensen's alpha."],
s:{
eli5:`<p>Add a perfectly safe savings account to your choices. Now you can mix "the best risky basket" with "safe cash" in any proportion, like adjusting how strong you make your coffee. Everyone uses the same coffee beans (the market portfolio); cautious people just add more water.</p>
<p>Some risks you can get rid of for free by owning lots of different things (one company's CEO quitting). The market won't pay you for those. Other risks hit everything at once (a recession). Those you can't escape, so the market pays you for bearing them. <strong>Beta</strong> measures how much of that unavoidable, market-wide risk an investment carries.</p>
<p>Then, to grade a fund manager fairly, you can't just look at returns; you ask "how much return per unit of risk?" Different report cards (Sharpe, Treynor, M², Jensen's alpha) measure that in slightly different ways.</p>`,
core:`<p><strong>What problem is this solving?</strong> (1) How to combine risky assets with a risk-free asset, (2) which risk the market rewards, (3) what return any asset <em>should</em> earn, and (4) how to judge whether a manager beat that.</p>
<ul><li><strong>Risk-free asset changes everything:</strong> the opportunity set becomes a straight line (CAL) from R<sub>f</sub> through a risky portfolio. The best CAL is tangent to the efficient frontier; with homogeneous expectations that tangency portfolio is the market portfolio → CML. Left of M = lending; right of M = borrowing.</li>
<li><strong>Two kinds of risk:</strong> total risk = systematic + unsystematic. Diversification eliminates unsystematic risk at no cost, so in equilibrium nobody is paid for bearing it. Only systematic risk, measured by beta, earns a premium.</li>
<li><strong>Return-generating models</strong> explain returns with factors (macro, fundamental, statistical). The simplest is the market model: Rᵢ = αᵢ + βᵢR<sub>m</sub> + eᵢ.</li>
<li><strong>CAPM/SML:</strong> E(Rᵢ) = R<sub>f</sub> + βᵢ[E(R<sub>m</sub>) − R<sub>f</sub>]. Compare your forecast with the CAPM required return: above the SML → undervalued; below → overvalued.</li>
<li><strong>Performance measures:</strong> Sharpe and M² use total risk (right for an investor's whole portfolio); Treynor and Jensen's alpha use beta (right for a well-diversified portfolio or one part of a larger portfolio).</li></ul>`,
formal:`<h4>CAL and CML</h4>
<ul><li>CAL: E(R<sub>p</sub>) = R<sub>f</sub> + [(E(R<sub>i</sub>) − R<sub>f</sub>)/σ<sub>i</sub>]σ<sub>p</sub>; slope = Sharpe ratio of the risky portfolio.</li>
<li>CML: CAL whose risky portfolio is the market portfolio M: E(R<sub>p</sub>) = R<sub>f</sub> + [(E(R<sub>M</sub>) − R<sub>f</sub>)/σ<sub>M</sub>]σ<sub>p</sub>. Two-fund separation: all investors hold R<sub>f</sub> + M; risk aversion only determines the mix.</li>
<li>Lending (w<sub>M</sub> &lt; 1) vs borrowing (w<sub>M</sub> &gt; 1) portfolios.</li></ul>
<h4>Systematic vs unsystematic risk</h4>
<p>Systematic (market) risk from macro factors (GDP, interest rates) cannot be diversified away; unsystematic (firm-specific) risk can. Because diversification is costless (CAPM assumption), only systematic risk is priced.</p>
<h4>Return-generating models</h4>
<ul><li>Multifactor: E(Rᵢ) − R<sub>f</sub> = Σβᵢ,ₖ × factor premium<sub>k</sub> (macro, fundamental, statistical factors; e.g., Fama-French: market, size, value; Carhart adds momentum).</li>
<li>Market model: Rᵢ = αᵢ + βᵢR<sub>m</sub> + eᵢ; used to estimate beta and separate systematic from unsystematic risk.</li></ul>
<h4>Beta</h4>
<p>βᵢ = Cov(Rᵢ, R<sub>m</sub>)/σ<sub>m</sub>² = ρᵢ,ₘσᵢ/σ<sub>m</sub>. Market β = 1 (average stock); β = 0 → uncorrelated with the market (risk-free has β = 0). Total variance = βᵢ²σ<sub>m</sub>² + σ<sub>e</sub>².</p>
<h4>CAPM assumptions</h4>
<p>Risk-averse, utility-maximizing, rational investors; frictionless markets (no costs, taxes); same single holding period; homogeneous expectations; infinitely divisible investments; price takers (trades don't affect prices). Also unlimited borrowing/lending at R<sub>f</sub>.</p>
<h4>SML applications</h4>
<p>Required return / cost of equity; capital budgeting hurdle rates; valuation (over/undervalued); performance evaluation; portfolio construction (indexing, active bets).</p>
<h4>Performance measures</h4>
<table><tr><th>Measure</th><th>Formula</th><th>Risk used</th></tr>
<tr><td>Sharpe ratio</td><td>(R<sub>p</sub> − R<sub>f</sub>)/σ<sub>p</sub></td><td>Total</td></tr>
<tr><td>M² (Modigliani-Modigliani)</td><td>R<sub>f</sub> + (R<sub>p</sub> − R<sub>f</sub>)(σ<sub>m</sub>/σ<sub>p</sub>); M² alpha = M² − R<sub>m</sub></td><td>Total (in % return units, same σ as market)</td></tr>
<tr><td>Treynor ratio</td><td>(R<sub>p</sub> − R<sub>f</sub>)/β<sub>p</sub></td><td>Systematic</td></tr>
<tr><td>Jensen's alpha</td><td>R<sub>p</sub> − [R<sub>f</sub> + β<sub>p</sub>(R<sub>m</sub> − R<sub>f</sub>)]</td><td>Systematic</td></tr></table>
<p>Sharpe and M² rank portfolios identically. Treynor and Jensen's alpha suit well-diversified portfolios.</p>`,
math:`<div class="f"><span class="lbl">Beta</span>β<sub>i</sub> = Cov(R<sub>i</sub>, R<sub>m</sub>) / σ<sub>m</sub>² = ρ<sub>i,m</sub> × σ<sub>i</sub> / σ<sub>m</sub></div>
<p><strong>Why:</strong> beta asks "when the market moves 1%, how much does this asset move on average?" It's the slope of the asset's returns regressed on the market's. Only the correlated part of σᵢ counts, hence ρ × σᵢ.</p>
<div class="f"><span class="lbl">CAPM / SML</span>E(R<sub>i</sub>) = R<sub>f</sub> + β<sub>i</sub> × [E(R<sub>m</sub>) − R<sub>f</sub>]</div>
<div class="f"><span class="lbl">CML</span>E(R<sub>p</sub>) = R<sub>f</sub> + [(E(R<sub>m</sub>) − R<sub>f</sub>)/σ<sub>m</sub>] × σ<sub>p</sub></div>
<div class="f"><span class="lbl">Performance</span>Sharpe = (R<sub>p</sub> − R<sub>f</sub>)/σ<sub>p</sub> &nbsp;·&nbsp; Treynor = (R<sub>p</sub> − R<sub>f</sub>)/β<sub>p</sub> &nbsp;·&nbsp; M² = R<sub>f</sub> + (R<sub>p</sub> − R<sub>f</sub>)σ<sub>m</sub>/σ<sub>p</sub> &nbsp;·&nbsp; α<sub>J</sub> = R<sub>p</sub> − [R<sub>f</sub> + β<sub>p</sub>(R<sub>m</sub> − R<sub>f</sub>)]</div>
<p><strong>Why M² works:</strong> it levers or de-levers the portfolio (mixing with R<sub>f</sub>) until it has the market's σ, then compares its return with the market's: a like-for-like race.</p>
<div class="dir"><div>ρ <span class="up">↑</span> or σᵢ <span class="up">↑</span> → β <span class="up">↑</span> → required return <span class="up">↑</span></div><div>Forecast &gt; CAPM return → above SML → undervalued (buy)</div><div>Portfolio poorly diversified → good Treynor/Jensen can coexist with poor Sharpe/M²</div></div>
<div class="calc" data-calc="beta"></div>
<div class="calc" data-calc="perf"></div>`,
example:`<div class="q">(a) A stock has ρ = 0.6 with the market, σ = 30%; market σ = 20%, R<sub>f</sub> = 3%, E(R<sub>m</sub>) = 9%. Find beta and the CAPM return. An analyst forecasts 11%: buy or sell? (b) Portfolio P: return 12%, σ 25%, β 1.2. Market: return 10%, σ 18%. R<sub>f</sub> = 3%. Compute Sharpe, Treynor, M², M² alpha and Jensen's alpha and interpret.</div>
<ol class="steps"><li><strong>Beta</strong> = 0.6 × 30/20 = <strong>0.90</strong>. CAPM = 3 + 0.9 × 6 = <strong>8.4%</strong>. Forecast 11% &gt; 8.4% → above SML → <strong>undervalued, buy</strong>.</li>
<li><strong>Sharpe:</strong> P = 9/25 = <strong>0.360</strong>; market = 7/18 = <strong>0.389</strong> → P worse on total risk.</li>
<li><strong>M²</strong> = 3 + 9 × 18/25 = 3 + 6.48 = <strong>9.48%</strong> → M² alpha = 9.48 − 10 = <strong>−0.52%</strong> (consistent with Sharpe).</li>
<li><strong>Treynor:</strong> P = 9/1.2 = <strong>7.5%</strong> vs market 7.0% → P better on systematic risk.</li>
<li><strong>Jensen's α</strong> = 12 − (3 + 1.2 × 7) = 12 − 11.4 = <strong>+0.6%</strong>.</li>
<li><strong>Interpretation:</strong> per unit of <em>systematic</em> risk the manager beat the market, but P carries a lot of unsystematic risk. As an investor's whole portfolio it underperformed; as one piece of a diversified portfolio it added value.</li></ol>
<p class="ans">Answers: β 0.90, 8.4%, buy · Sharpe 0.360 vs 0.389 · M² 9.48% (α −0.52%) · Treynor 7.5 vs 7.0 · Jensen +0.6%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Expecting a premium for firm-specific risk. <b>Fix:</b> it's diversifiable, so unpriced.</li>
<li><b>Trap:</b> Using the CML for individual securities. <b>Fix:</b> CML is for efficient portfolios (σ); SML for any asset (β).</li>
<li><b>Trap:</b> β = ρσ<sub>m</sub>/σᵢ. <b>Fix:</b> β = ρσᵢ/σ<sub>m</sub> (or Cov/σ<sub>m</sub>²).</li>
<li><b>Trap:</b> Using Treynor for a client's entire, undiversified portfolio. <b>Fix:</b> use Sharpe/M² (total risk).</li>
<li><b>Trap:</b> "Below the SML = undervalued." <b>Fix:</b> below = expected return too low = price too high = overvalued.</li>
<li><b>Trap:</b> Thinking Sharpe and M² can rank differently. <b>Fix:</b> they always agree.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> CAL vs CML; lending vs borrowing portfolios; which risk is priced; compute beta; CAPM required return; over/undervalued; compute and interpret Sharpe, Treynor, M², Jensen; CAPM assumptions.</li>
<li><strong>Measure-picker:</strong> "entire portfolio / not diversified" → Sharpe or M². "Well-diversified / part of a larger portfolio" → Treynor or Jensen.</li>
<li><strong>Speed:</strong> compute the excess returns (R − R<sub>f</sub>) once and reuse for all four measures.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Same beans, more water</b>Everyone holds M; risk aversion sets the R<sub>f</sub> mix.</div>
<div class="anchor"><b>Pay only for what you can't avoid</b>Systematic risk is priced; diversifiable risk isn't.</div>
<div class="anchor"><b>S-M use σ; T-J use β</b>Sharpe & M² total risk; Treynor & Jensen beta.</div>
<div class="anchor"><b>Above the line, buy the line</b>Above SML = undervalued.</div></div>`,
summary:`Combining a risk-free asset with a risky portfolio creates the capital allocation line, whose slope is the Sharpe ratio; when the risky portfolio is the market portfolio, it becomes the capital market line, and every investor holds a mix of R<sub>f</sub> and M (lending left of M, borrowing right). Total risk splits into systematic risk (macro factors, undiversifiable) and unsystematic risk (firm-specific, diversifiable for free), so only systematic risk earns a premium. Return-generating models relate returns to factors; the market model Rᵢ = αᵢ + βᵢR<sub>m</sub> + eᵢ estimates beta = Cov(Rᵢ,R<sub>m</sub>)/σ<sub>m</sub>² = ρσᵢ/σ<sub>m</sub>. Under its assumptions (rational risk-averse investors, frictionless markets, single period, homogeneous expectations, divisible assets, price takers), the CAPM gives E(Rᵢ) = R<sub>f</sub> + βᵢ[E(R<sub>m</sub>) − R<sub>f</sub>], plotted as the SML; assets above it are undervalued. Performance: Sharpe (excess return/σ) and M² (return at market σ) use total risk; Treynor (excess return/β) and Jensen's alpha (actual minus CAPM return) use systematic risk.`
},
quiz:[
{q:"A stock has a correlation of 0.5 with the market, a standard deviation of 40%, and the market's standard deviation is 20%. Its beta is:",o:["0.25","1.00","2.00"],a:1,e:"β = 0.5 × 40/20 = 1.0."},
{q:"Which performance measure is most appropriate for evaluating an investor's entire, poorly diversified portfolio?",o:["Treynor ratio","Jensen's alpha","Sharpe ratio"],a:2,e:"Total risk matters when the portfolio is the investor's whole holding; Sharpe (or M²) uses σ."},
{q:"R_f = 4%, E(R_m) = 10%, β = 1.5. An analyst expects the stock to return 12%. The stock is:",o:["undervalued","overvalued","properly valued"],a:1,e:"CAPM = 4 + 1.5 × 6 = 13%. Expected 12% < 13% → below SML → overvalued."},
{q:"Under the CAPM, investors should not expect compensation for unsystematic risk because:",o:["it is always small","it can be eliminated through diversification at no cost","it is captured by beta"],a:1,e:"Costless diversification means no one needs to bear it, so it carries no premium."}]
});

/* ===================== READING 89 ===================== */
add({n:89,topic:"pm",title:"Portfolio Management: An Overview",
los:["89.a Describe the portfolio approach to investing.","89.b Describe the steps in the portfolio management process.","89.c Describe types of investors and distinctive characteristics and needs of each.","89.d Describe defined contribution and defined benefit pension plans.","89.e Describe aspects of the asset management industry.","89.f Describe mutual funds and compare them with other pooled investment products."],
s:{
eli5:`<p>Don't judge each ingredient alone; judge the meal. A spoonful of salt is awful, but in soup it's essential. Investing works the same: what matters is how each holding fits the <strong>whole portfolio</strong>.</p>
<p>Managing money is a loop like planning a trip: <strong>plan</strong> (where are you going, how much can you spend, what can't you do?), <strong>execute</strong> (book the flights and hotels), then <strong>feedback</strong> (check you're on track, adjust if a flight is cancelled).</p>
<p>Different travelers need different trips. A bank needs cash on hand every day. A university endowment plans to exist forever. A pension promises retirees fixed paychecks. And most people invest through shared "buses": mutual funds, ETFs, and for the wealthy, hedge funds and private equity.</p>`,
core:`<p><strong>What problem is this solving?</strong> Organizing investment decisions so they fit a specific client's goals and constraints, and understanding the types of clients and products in the industry.</p>
<ul><li><strong>Portfolio approach:</strong> diversification lowers risk for a given expected return. Investors who don't think in portfolio terms bear unrewarded (diversifiable) risk. Downside: diversification may fail when correlations rise in crises.</li>
<li><strong>Process:</strong> planning (understand client → write IPS), execution (asset allocation top-down, security selection bottom-up, portfolio construction and trading), feedback (monitor, rebalance, measure and report performance vs the IPS benchmark).</li>
<li><strong>Investor types differ in risk tolerance, horizon, liquidity needs and income needs:</strong> the IPS translates those differences into portfolios.</li>
<li><strong>DB vs DC pensions:</strong> who bears investment risk is the key: in DC the employee; in DB the employer (sponsor).</li>
<li><strong>Industry:</strong> buy-side asset managers (independent or part of bigger firms; full-service or specialist); active vs passive (passive's share rising due to lower fees and difficulty beating benchmarks); consolidation and technology.</li></ul>`,
formal:`<h4>Portfolio management process</h4>
<ol><li><strong>Planning:</strong> understand client's objectives (return, risk), constraints (liquidity, horizon, taxes, legal/regulatory, unique) and preferences; write and periodically update the IPS.</li>
<li><strong>Execution:</strong> asset allocation using capital market expectations (top-down: inflation, rates, GDP); security analysis and selection (bottom-up); portfolio construction, risk management, trading.</li>
<li><strong>Feedback:</strong> monitor and rebalance; measure and report performance relative to the IPS benchmark.</li></ol>
<h4>Investor types</h4>
<table><tr><th>Investor</th><th>Risk tolerance</th><th>Horizon</th><th>Liquidity needs</th><th>Income needs</th></tr>
<tr><td>Individuals</td><td>Varies</td><td>Varies</td><td>Varies</td><td>Varies</td></tr>
<tr><td>Banks</td><td>Low</td><td>Short</td><td>High</td><td>Pay interest on deposits</td></tr>
<tr><td>Endowments/foundations</td><td>High</td><td>Long (perpetual)</td><td>Low</td><td>Spending level</td></tr>
<tr><td>Insurance (life)</td><td>Low</td><td>Long</td><td>High</td><td>Low</td></tr>
<tr><td>Insurance (P&amp;C)</td><td>Low</td><td>Short</td><td>High</td><td>Low</td></tr>
<tr><td>Mutual funds</td><td>Depends on fund</td><td>Depends</td><td>High (redemptions)</td><td>Depends</td></tr>
<tr><td>DB pension</td><td>High</td><td>Long</td><td>Low</td><td>Depends on age of participants</td></tr></table>
<p>Also sovereign wealth funds (government-owned; long horizons, often high risk tolerance).</p>
<h4>Pension plans</h4>
<ul><li><strong>Defined contribution (DC):</strong> employer contributes a set amount; no promise about future value; employee bears investment risk; portable.</li>
<li><strong>Defined benefit (DB):</strong> employer promises a future benefit (often based on salary and years of service); employer bears investment risk; plan must be funded to meet liabilities.</li></ul>
<h4>Asset management industry</h4>
<p>Buy side (manages client assets) vs sell side (brokers, dealers, investment banks). Firms: independent or captive; full-service or specialist; traditional or alternative. Active management seeks to beat a benchmark; passive replicates an index. Most AUM is active but passive share is rising. Trends: growth of passive, big data/technology, robo-advice, industry consolidation.</p>
<h4>Pooled investment products</h4>
<ul><li><strong>Mutual funds:</strong> open-end (buy/sell at NAV with the fund; shares created/redeemed) or closed-end (fixed shares trading on an exchange at market price, possibly at a premium/discount to NAV). Types: money market, bond, stock, hybrid/balanced; load vs no-load.</li>
<li><strong>ETFs:</strong> trade like stocks intraday; usually index-based; low management fees but brokerage costs; creation/redemption mechanism keeps price near NAV; tax efficient.</li>
<li><strong>Separately managed accounts:</strong> portfolio owned by an individual with substantial assets; personalized; annual fee based on assets.</li>
<li><strong>Hedge funds:</strong> accredited investors; exempt from most reporting; e.g., 2% + 20%.</li>
<li><strong>Buyout funds:</strong> take companies private (mostly with debt), restructure, exit in 3–5 years. <strong>Venture capital funds:</strong> start-ups; provide advice and expertise.</li></ul>`,
math:`<p>Few formulas here; these two relationships are worth knowing.</p>
<div class="f"><span class="lbl">Net asset value per share</span>NAV = (fund assets − fund liabilities) / shares outstanding</div>
<div class="f"><span class="lbl">Closed-end premium/discount</span>Premium (discount) = market price / NAV − 1</div>
<p><strong>Why:</strong> open-end funds always transact at NAV, but closed-end shares trade on supply and demand, so their price can drift away from the value of what they hold.</p>
<div class="dir"><div>DB plan: investment returns <span class="dn">↓</span> → sponsor must contribute more (employer risk)</div><div>DC plan: returns <span class="dn">↓</span> → employee's retirement wealth <span class="dn">↓</span> (employee risk)</div><div>Higher liquidity needs (banks, insurers) → more short-term, high-quality fixed income</div></div>`,
example:`<div class="q">(a) A fund holds assets of $520m and liabilities of $20m with 25m shares outstanding. NAV? If it's closed-end and trades at $18, what's the premium/discount? (b) Match each statement to the step of the process: (i) rebalancing after equities rally; (ii) writing the IPS; (iii) deciding to overweight bonds based on a recession forecast; (iv) reporting returns vs the benchmark. (c) An employee's retirement benefit is 1.5% × final salary × years of service. Who bears investment risk? (d) Which investor likely has the highest liquidity needs: an endowment, a bank or a DB plan with young workers?</div>
<ol class="steps"><li><strong>NAV</strong> = (520 − 20)/25 = <strong>$20.00</strong>. Price 18 → 18/20 − 1 = <strong>10% discount</strong>.</li>
<li><strong>(i)</strong> feedback; <strong>(ii)</strong> planning; <strong>(iii)</strong> execution (top-down asset allocation); <strong>(iv)</strong> feedback.</li>
<li><strong>Defined benefit</strong> formula → the <strong>employer</strong> bears investment risk.</li>
<li><strong>Bank</strong>: deposits can be withdrawn → high liquidity needs, short horizon, low risk tolerance.</li></ol>
<p class="ans">Answers: NAV $20, 10% discount · feedback, planning, execution, feedback · employer · bank</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Saying DC plan sponsors bear investment risk. <b>Fix:</b> DC → employee; DB → employer.</li>
<li><b>Trap:</b> Open-end shares trade at a premium/discount. <b>Fix:</b> open-end at NAV; closed-end can deviate.</li>
<li><b>Trap:</b> Calling security selection "top-down". <b>Fix:</b> asset allocation from macro is top-down; security analysis is bottom-up.</li>
<li><b>Trap:</b> Thinking endowments have high liquidity needs. <b>Fix:</b> low liquidity needs, long horizon, high risk tolerance.</li>
<li><b>Trap:</b> ETFs have no trading costs. <b>Fix:</b> low management fees, but brokerage and bid-ask costs.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> order the steps; classify an activity; match investor type to characteristics; DB vs DC; open- vs closed-end; ETFs vs mutual funds; active vs passive trends.</li>
<li><strong>Table memory trick:</strong> banks and insurers = low risk, high liquidity; endowments and DB plans = high risk, low liquidity, long horizon.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Judge the meal, not the salt</b>The portfolio approach.</div>
<div class="anchor"><b>Plan · Do · Check</b>Planning, execution, feedback.</div>
<div class="anchor"><b>Defined Benefit = Boss bears it</b>DB: employer risk; DC: "Do it yourself".</div>
<div class="anchor"><b>Open = Original price (NAV)</b>Closed = Can drift from NAV.</div></div>`,
summary:`The portfolio approach evaluates investments by their contribution to the whole portfolio, since diversification lowers risk for a given expected return and investors who ignore it bear unrewarded risk. The portfolio management process has three steps: planning (understand the client, write and update the IPS), execution (top-down asset allocation, bottom-up security selection, construction and trading) and feedback (monitoring, rebalancing, performance measurement against the IPS benchmark). Investor types differ: banks and insurers have low risk tolerance and high liquidity needs; endowments and DB plans have long horizons, high risk tolerance and low liquidity needs; individuals and mutual funds vary. In DC plans the employer contributes a set amount and the employee bears investment risk; in DB plans the employer promises benefits and bears the risk. The buy-side asset management industry offers active and passive strategies (passive share rising). Pooled products include open-end funds (trade at NAV), closed-end funds (market price vs NAV), ETFs (exchange-traded, low fees), separately managed accounts, hedge funds, and buyout and venture capital funds.`
},
quiz:[
{q:"In a defined contribution plan, investment risk is borne by:",o:["the employer","the employee","the plan's actuaries"],a:1,e:"The employer only promises contributions; the employee's outcome depends on investment results."},
{q:"Rebalancing a portfolio to its target weights is part of which step of the portfolio management process?",o:["Planning","Execution","Feedback"],a:2,e:"Monitoring and rebalancing are feedback activities."},
{q:"Which investor type typically has the lowest liquidity needs and longest time horizon?",o:["Bank","Property and casualty insurer","Endowment"],a:2,e:"Endowments are intended to last indefinitely and have predictable spending."}]
});

/* ===================== READING 90 ===================== */
add({n:90,topic:"pm",title:"Basics of Portfolio Planning and Construction",
los:["90.a Describe the reasons for a written investment policy statement (IPS).","90.b Describe the major components of an IPS.","90.c Describe risk and return objectives and how they may be developed for a client.","90.d Explain the difference between the willingness and the ability (capacity) to take risk in analyzing an investor's financial risk tolerance.","90.e Describe the investment constraints of liquidity, time horizon, tax concerns, legal and regulatory factors, and unique circumstances and their implications for the choice of portfolio assets.","90.f Explain the specification of asset classes in relation to asset allocation.","90.g Describe the principles of portfolio construction and the role of asset allocation in relation to the IPS.","90.h Describe how environmental, social, and governance (ESG) considerations may be integrated into portfolio planning and construction."],
s:{
eli5:`<p>Before a builder starts a house, everyone signs off on a written plan: how big, what budget, what it must include, what's forbidden, when it must be done. The <strong>Investment Policy Statement (IPS)</strong> is that plan for a portfolio.</p>
<p>It answers two questions. <strong>Objectives:</strong> how much return do you need, and how much risk can you handle? <strong>Constraints:</strong> what limits you (when you need the cash, how long you can wait, taxes, laws, personal wishes like "no tobacco stocks")?</p>
<p>Risk has two sides. <strong>Willingness</strong> is how brave you <em>feel</em>. <strong>Ability</strong> is how much your finances can <em>actually</em> survive. A nervous millionaire has ability but no willingness; a bold student with rent due next month has willingness but no ability. When they disagree, play it safe.</p>`,
core:`<p><strong>What problem is this solving?</strong> Without a written plan, investing drifts with emotions and markets, and client and manager can't agree on what "success" means. The IPS creates discipline, sets realistic goals, defines responsibilities, and becomes the benchmark for evaluating results.</p>
<ul><li><strong>Return objective</strong> comes from goals (e.g., fund spending + inflation + fees), can be absolute or relative, and must be checked against risk tolerance: high required returns may be unrealistic for a low-risk client.</li>
<li><strong>Risk tolerance = min(ability, willingness)</strong> as a starting rule; differences are resolved conservatively and by educating the client. Ability depends on wealth relative to needs, income stability, time horizon; willingness on psychology and knowledge.</li>
<li><strong>Constraints shape which assets fit:</strong> high liquidity needs → more cash/bonds; short horizon → avoid volatile/illiquid assets; taxes → asset location, munis, low turnover; legal/regulatory (e.g., ERISA, insider rules); unique circumstances (ethical preferences, concentrated holdings).</li>
<li><strong>Strategic asset allocation (SAA)</strong> is the policy mix that meets the IPS given capital market expectations; it drives most of a portfolio's risk and return. <strong>Tactical asset allocation</strong> deviates temporarily to exploit short-term views; security selection adds active risk within classes; rebalancing keeps the portfolio near SAA.</li>
<li><strong>Asset classes</strong> must be internally similar (homogeneous), mutually exclusive, and have low correlations with each other, so diversification across them works.</li>
<li><strong>ESG integration</strong> can be done through negative screening, positive screening/best-in-class, thematic and impact investing, ESG integration in analysis, and active ownership; it may change risk and return and must be reflected in the benchmark.</li></ul>`,
formal:`<h4>Why a written IPS</h4>
<p>Forces investment discipline; requires articulating circumstances, objectives and constraints; ensures goals are realistic; provides guidance for managers and continuity if managers change; sets a benchmark for evaluation. First step in the portfolio management process.</p>
<h4>IPS components</h4>
<ul><li>Introduction (describes client); statement of purpose; statement of duties and responsibilities (client, custodian, managers); procedures (updating the IPS, handling unforeseen events); investment objectives (return, risk); investment constraints; investment guidelines (e.g., leverage, derivatives, excluded assets); evaluation and review; appendices (strategic asset allocation/policy portfolio, rebalancing policy).</li></ul>
<h4>Objectives</h4>
<ul><li><strong>Risk objectives:</strong> absolute (e.g., no loss &gt; 10% in any year; σ ≤ 12%) or relative (e.g., tracking error vs FTSE ≤ 2%). Measures: σ, VaR, shortfall probability, tracking error.</li>
<li><strong>Return objectives:</strong> absolute (e.g., 7% per year) or relative (e.g., beat the S&amp;P 500 by 2%); based on goals; achievability depends on risk objectives.</li>
<li><strong>Ability vs willingness:</strong> ability (capacity) depends on financial factors (wealth relative to liabilities, income stability, time horizon, insurance); willingness on psychological factors (personality, financial knowledge). When they conflict, typically adopt the more conservative and counsel the client.</li></ul>
<h4>Constraints</h4>
<ul><li><strong>Liquidity:</strong> anticipated/unanticipated cash needs → higher allocation to cash/bonds.</li>
<li><strong>Time horizon:</strong> often multi-stage; short horizons limit risky/illiquid assets.</li>
<li><strong>Taxes:</strong> treatment of accounts, income vs capital gains, marginal bracket.</li>
<li><strong>Legal and regulatory:</strong> government restrictions, fiduciary rules, insider trading laws.</li>
<li><strong>Unique circumstances:</strong> ethical/religious preferences, concentrated positions, special needs.</li></ul>
<h4>Asset classes and portfolio construction</h4>
<ul><li>Asset class: group of securities with similar risk/performance; should be homogeneous, mutually exclusive, diversifying (low correlation with other classes). Broad (equity, fixed income, cash, real estate) or narrow (large-cap US equity, speculative international bonds, commodities, hedge funds).</li>
<li><strong>Strategic asset allocation:</strong> long-term target weights combining IPS objectives/constraints with capital market expectations; basic structure of the portfolio.</li>
<li><strong>Tactical asset allocation:</strong> short-term deviations to exploit forecasts; adds risk relative to SAA.</li>
<li><strong>Security selection:</strong> active choices within asset classes. <strong>Rebalancing</strong> policy (calendar or corridor/percentage ranges).</li>
<li>Risk budgeting allocates active risk across sources; core-satellite: passive core + active satellites.</li></ul>
<h4>ESG in planning and construction</h4>
<ul><li>Negative (exclusionary) screening; positive screening / best-in-class; ESG integration; thematic investing; impact investing; active ownership (engagement, proxy voting).</li>
<li>Restricting the universe may reduce returns; good governance and low ESG risk may improve them.</li>
<li>Negative screening → benchmark should exclude the screened companies. Positive screening/thematic → customized construction. Active ownership → clarify whether investors vote shares themselves or direct managers to vote by specified ESG factors.</li></ul>`,
math:`<div class="f"><span class="lbl">Required return (additive approximation)</span>Required return ≈ spending rate + expected inflation + fees</div>
<div class="f"><span class="lbl">Required return (multiplicative, exact)</span>(1 + spending)(1 + inflation)(1 + fees) − 1</div>
<div class="vars"><div><code>Spending rate</code><span>Annual cash need ÷ portfolio value</span></div><div><code>Inflation</code><span>Added to preserve purchasing power</span></div></div>
<p><strong>Why:</strong> to spend a fixed real amount forever without shrinking the portfolio, returns must cover what's withdrawn, what inflation erodes, and what fees take.</p>
<div class="f"><span class="lbl">Risk tolerance rule</span>Overall risk tolerance ≈ min(ability, willingness) → then educate the client</div>
<div class="dir"><div>Spending need <span class="up">↑</span> or portfolio <span class="dn">↓</span> → required return <span class="up">↑</span> (may conflict with risk tolerance)</div><div>Longer horizon, stable income, wealth ≫ needs → ability <span class="up">↑</span></div><div>High liquidity needs → more cash/short bonds → expected return <span class="dn">↓</span></div></div>
<div class="calc" data-calc="req"></div>`,
example:`<div class="q">Sara, 62, has a $2m portfolio and wants $80,000 a year from it, rising with inflation (2.5%); fees are 0.5%. She has a secure pension covering basic costs, no debt, and says she "panics when the market drops 10%". She wants no fossil-fuel stocks and needs $150,000 next year for a daughter's wedding. (a) Required return? (b) Ability vs willingness? (c) Constraints? (d) How should ESG preference affect the benchmark?</div>
<ol class="steps"><li><strong>Spending rate</strong> = 80,000/2,000,000 = 4%. Required return ≈ 4 + 2.5 + 0.5 = <strong>7.0%</strong> (multiplicative ≈ <strong>7.13%</strong>).</li>
<li><strong>Ability:</strong> above average (pension covers basics, no debt, sizeable assets). <strong>Willingness:</strong> below average (panics at −10%). → Overall <strong>below-average risk tolerance</strong> (more conservative), plus education on the trade-off; 7% may be hard to reach with low risk, so discuss lowering spending or accepting more risk.</li>
<li><strong>Constraints:</strong> liquidity: $150,000 next year (hold in cash/short-term) plus ongoing spending; time horizon: multi-stage, long (life expectancy 25+ years); taxes: depends on account types; legal: none special; unique: exclude fossil fuels.</li>
<li><strong>ESG:</strong> negative screening → measure performance against a benchmark that also excludes fossil-fuel companies.</li></ol>
<p class="ans">Answers: ≈7.0% (7.13% exact) · below-average tolerance (willingness binds) · liquidity, horizon, taxes, unique · ex-fossil benchmark</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Letting high willingness override low ability. <b>Fix:</b> the more conservative of the two prevails.</li>
<li><b>Trap:</b> Listing "risk tolerance" as a constraint. <b>Fix:</b> risk and return are objectives; constraints are liquidity, horizon, taxes, legal, unique.</li>
<li><b>Trap:</b> Confusing SAA and TAA. <b>Fix:</b> SAA = long-term policy mix; TAA = short-term deviations.</li>
<li><b>Trap:</b> Defining asset classes that overlap. <b>Fix:</b> they must be mutually exclusive and internally homogeneous.</li>
<li><b>Trap:</b> Comparing a screened portfolio to an unscreened benchmark. <b>Fix:</b> use a benchmark with the same exclusions.</li>
<li><b>Trap:</b> Absolute vs relative mix-up. <b>Fix:</b> "beat the index by 2%" is relative; "8% per year" is absolute.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> reasons for an IPS; identify IPS sections; absolute vs relative objectives; judge ability vs willingness from a vignette; classify constraints; SAA vs TAA; asset class criteria; ESG approaches and benchmarking.</li>
<li><strong>Vignette routine:</strong> circle facts about money (ability) and facts about feelings/knowledge (willingness), then take the lower.</li>
<li><strong>Constraints mnemonic:</strong> L-T-T-L-U (Liquidity, Time horizon, Taxes, Legal/regulatory, Unique).</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Blueprint before bricks</b>IPS first, portfolio second.</div>
<div class="anchor"><b>Can vs Want</b>Ability (can) vs willingness (want): the lower one wins.</div>
<div class="anchor"><b>RR + LTTLU</b>Objectives: Return, Risk. Constraints: Liquidity, Time, Taxes, Legal, Unique.</div>
<div class="anchor"><b>SAA = home, TAA = short trip</b>Tactical bets wander, then come home.</div></div>`,
summary:`A written IPS is the first step of portfolio management: it forces discipline, clarifies the client's circumstances, objectives and constraints, ensures realistic goals and provides the evaluation benchmark. Typical sections cover the client, purpose, duties and responsibilities, procedures, objectives, constraints, guidelines, evaluation and review, and appendices (strategic asset allocation, rebalancing policy). Return objectives (absolute or relative) derive from goals such as spending + inflation + fees and must be consistent with risk objectives (absolute or relative). Risk tolerance combines ability (financial capacity) and willingness (psychology); conflicts are resolved conservatively with client education. Constraints are liquidity, time horizon, taxes, legal/regulatory and unique circumstances. Asset classes should be homogeneous, mutually exclusive and diversifying; the strategic asset allocation combines the IPS with capital market expectations and forms the portfolio's basic structure, tactical allocation makes short-term deviations, and security selection and rebalancing follow. ESG can be integrated via negative or positive screening, ESG integration, thematic or impact investing and active ownership, with benchmarks adjusted accordingly.`
},
quiz:[
{q:"A wealthy client with stable income and a long horizon says she cannot tolerate any losses. Her overall risk tolerance is best described as:",o:["above average, because ability is high","below average, because willingness is low","average, by averaging ability and willingness"],a:1,e:"When ability and willingness conflict, the more conservative (lower) one generally prevails, with client education."},
{q:"Which is an investment objective rather than a constraint?",o:["Time horizon","Tax considerations","Risk tolerance"],a:2,e:"Objectives are return and risk; the others are constraints."},
{q:"An allocation that temporarily overweights equities based on a short-term forecast is:",o:["strategic asset allocation","tactical asset allocation","rebalancing"],a:1,e:"TAA deviates from the strategic mix to exploit short-term views."}]
});

/* ===================== READING 91 ===================== */
add({n:91,topic:"pm",title:"The Behavioral Biases of Individuals",
los:["91.a Compare and contrast cognitive errors and emotional biases.","91.b Discuss commonly recognized behavioral biases and their implications for financial decision making.","91.c Describe how behavioral biases of investors can lead to market characteristics that may not be explained by traditional finance."],
s:{
eli5:`<p>Our brains have shortcuts that usually help but sometimes trip us up with money.</p>
<p>Some mistakes are <strong>thinking errors</strong>: like believing the first number you hear ("this stock used to be $100, so $60 is cheap!"), only reading news that agrees with you, or treating "bonus money" as play money. Better information and good habits can fix these.</p>
<p>Other mistakes are <strong>feeling errors</strong>: hating a loss so much you hold a losing stock forever hoping to "get back to even", being too sure you're right, sticking with whatever you already have, or spending today instead of saving for tomorrow. Feelings are hard to change, so advisers often work <em>around</em> them instead.</p>`,
core:`<p><strong>What problem is this solving?</strong> Traditional finance assumes rational investors. Real people make systematic errors. Recognizing biases helps advisers build portfolios clients can stick with, and helps explain market patterns (momentum, bubbles) that rational models struggle with.</p>
<ul><li><strong>Cognitive errors</strong> come from faulty reasoning, limited information or processing. Two groups: <em>belief perseverance</em> (clinging to prior beliefs) and <em>information-processing</em> errors (handling information badly). Because they're about knowledge, they're easier to <strong>correct</strong> with education and process.</li>
<li><strong>Emotional biases</strong> come from feelings, impulses and intuition; they're spontaneous and hard to fix, so advisers usually <strong>adapt</strong> to them (e.g., build a portfolio the client won't abandon).</li>
<li><strong>Rule of thumb for advisers:</strong> moderate (correct) cognitive biases; adapt to emotional biases, especially for clients with high wealth relative to needs, where deviations matter less.</li>
<li><strong>Market effects:</strong> herding, overconfidence and confirmation can feed momentum and bubbles; loss aversion and disposition effects can slow price adjustment; many "anomalies" may also reflect mis-specified risk.</li></ul>`,
formal:`<h4>Cognitive errors: belief perseverance</h4>
<table><tr><th>Bias</th><th>Description</th><th>Consequence / mitigation</th></tr>
<tr><td>Conservatism</td><td>Maintain prior views, underreact to new information</td><td>Slow to update; reassess with new data</td></tr>
<tr><td>Confirmation</td><td>Seek/notice information that confirms beliefs</td><td>Concentration, ignoring warnings; seek contrary evidence</td></tr>
<tr><td>Representativeness</td><td>Classify new info by stereotypes; base-rate neglect, small-sample errors</td><td>Over-extrapolating; use base rates</td></tr>
<tr><td>Illusion of control</td><td>Belief one can control/influence outcomes</td><td>Excessive trading, concentration</td></tr>
<tr><td>Hindsight</td><td>"I knew it all along"; selective memory</td><td>Overestimates predictability; keep records</td></tr></table>
<h4>Cognitive errors: information processing</h4>
<table><tr><th>Bias</th><th>Description</th></tr>
<tr><td>Anchoring and adjustment</td><td>Fixating on an initial value (e.g., purchase price, prior forecast) and adjusting insufficiently</td></tr>
<tr><td>Mental accounting</td><td>Treating money differently by source or "bucket"; ignoring correlations across buckets</td></tr>
<tr><td>Framing</td><td>Decisions depend on how a choice is presented (gains vs losses), narrow framing</td></tr>
<tr><td>Availability</td><td>Judging likelihood by how easily examples come to mind (recent, vivid, familiar)</td></tr></table>
<h4>Emotional biases</h4>
<table><tr><th>Bias</th><th>Description</th><th>Consequence</th></tr>
<tr><td>Loss aversion</td><td>Losses hurt more than equal gains please</td><td>Disposition effect: sell winners too early, hold losers too long</td></tr>
<tr><td>Overconfidence</td><td>Overestimate own knowledge/ability (prediction and certainty overconfidence)</td><td>Underestimate risk, excessive trading, under-diversification</td></tr>
<tr><td>Self-control</td><td>Favor short-term satisfaction over long-term goals</td><td>Undersaving; then taking excess risk to catch up</td></tr>
<tr><td>Status quo</td><td>Prefer to do nothing/keep current choices</td><td>Inertia, unsuitable portfolios persist</td></tr>
<tr><td>Endowment</td><td>Value an asset more just because you own it</td><td>Hold inherited/legacy assets; reluctant to sell</td></tr>
<tr><td>Regret aversion</td><td>Avoid decisions that might cause regret</td><td>Excess conservatism or herding (safety in numbers)</td></tr></table>
<h4>Biases and market characteristics</h4>
<ul><li>Anomalies (momentum, value, size, January effect) may come from inadequate risk specification, or from behavioral biases (e.g., herding, overreaction/underreaction, disposition effect).</li>
<li>Bubbles and crashes: behavioral finance has not fully explained them, but overconfidence, confirmation, hindsight, herding, regret aversion and anchoring may be exhibited.</li>
<li>Value vs growth: halo effect (representativeness) may make investors overpay for "good" companies.</li>
<li>Home bias (preference for domestic stocks) linked to familiarity/overconfidence/availability.</li></ul>`,
math:`<p>No formulas. Use this diagnostic "formula" to classify and respond to any bias.</p>
<div class="f"><span class="lbl">Step 1: source?</span>Faulty reasoning / missing info → COGNITIVE &nbsp;·&nbsp; Feelings / impulse → EMOTIONAL</div>
<div class="f"><span class="lbl">Step 2: if cognitive, which kind?</span>Clinging to an existing belief → BELIEF PERSEVERANCE &nbsp;·&nbsp; Mishandling the numbers/info → INFORMATION PROCESSING</div>
<div class="f"><span class="lbl">Step 3: adviser response</span>Cognitive → MODERATE (educate, correct) &nbsp;·&nbsp; Emotional → ADAPT (work around), especially if wealth is high relative to needs</div>
<div class="f"><span class="lbl">Loss aversion asymmetry (prospect theory intuition)</span>Pain of losing $1 ≈ 2 × pleasure of gaining $1</div>
<div class="dir"><div>Loss aversion <span class="up">↑</span> → hold losers <span class="up">↑</span>, sell winners early <span class="up">↑</span> (disposition effect)</div><div>Overconfidence <span class="up">↑</span> → turnover <span class="up">↑</span>, diversification <span class="dn">↓</span>, net returns <span class="dn">↓</span></div><div>Self-control problems → saving <span class="dn">↓</span> → later risk-taking <span class="up">↑</span></div></div>`,
example:`<div class="q">Identify the bias (and whether cognitive or emotional): (a) "I'll sell XYZ once it gets back to the $50 I paid." (b) An analyst keeps a buy rating despite two profit warnings, saying the long-term thesis holds. (c) An investor buys a fund because its manager was on TV last week. (d) A client keeps 40% of his wealth in his late father's company stock: "Dad built it." (e) A retiree insists on spending dividends only, never capital, even though total return investing would be better. (f) After a crash, a client says the signs were obvious. (g) A client keeps the default allocation in his 401(k) for 15 years.</div>
<ol class="steps"><li><strong>(a)</strong> Anchoring (cognitive, processing) on purchase price, plus loss aversion (emotional) in refusing to realize a loss.</li>
<li><strong>(b)</strong> Conservatism (cognitive, belief perseverance): underreacting to new information. (Confirmation is related if he only seeks supportive data.)</li>
<li><strong>(c)</strong> Availability (cognitive, processing): recent, vivid exposure.</li>
<li><strong>(d)</strong> Endowment bias (emotional), possibly status quo.</li>
<li><strong>(e)</strong> Mental accounting (cognitive, processing): separating income from capital.</li>
<li><strong>(f)</strong> Hindsight bias (cognitive, belief perseverance).</li>
<li><strong>(g)</strong> Status quo bias (emotional): inertia.</li></ol>
<p class="ans">Answers: anchoring + loss aversion · conservatism · availability · endowment · mental accounting · hindsight · status quo</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Classifying overconfidence as cognitive. <b>Fix:</b> in this curriculum, overconfidence is listed as an <em>emotional</em> bias (though it has cognitive elements).</li>
<li><b>Trap:</b> Mixing conservatism bias with being risk-conservative. <b>Fix:</b> conservatism bias = slow to update beliefs.</li>
<li><b>Trap:</b> Endowment vs status quo. <b>Fix:</b> endowment = valuing what you own more; status quo = preferring no change.</li>
<li><b>Trap:</b> Thinking emotional biases are easier to correct. <b>Fix:</b> cognitive are easier to correct; emotional are adapted to.</li>
<li><b>Trap:</b> Saying behavioral finance fully explains bubbles. <b>Fix:</b> it hasn't; biases may be present during them.</li>
<li><b>Trap:</b> Representativeness vs availability. <b>Fix:</b> representativeness = stereotypes/"looks like"; availability = "easy to recall".</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> name the bias in a quote or vignette; classify as cognitive (belief perseverance vs processing) or emotional; adviser response; market anomaly link.</li>
<li><strong>Memorize the 6 emotional biases:</strong> "<em>LOSSER</em>": Loss aversion, Overconfidence, Self-control, Status quo, Endowment, Regret aversion. Everything else at this level is cognitive.</li>
<li><strong>Belief perseverance (5):</strong> "<em>CCRIH</em>": Conservatism, Confirmation, Representativeness, Illusion of control, Hindsight. <strong>Processing (4):</strong> "<em>AMFA</em>": Anchoring, Mental accounting, Framing, Availability.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>LOSSER</b>The six emotional biases.</div>
<div class="anchor"><b>Think-o vs Feel-o</b>Thinking errors get corrected; feeling errors get accommodated.</div>
<div class="anchor"><b>Stuck vs Sloppy</b>Belief perseverance = stuck on beliefs; processing = sloppy with information.</div>
<div class="anchor"><b>"Back to even"</b>Classic loss aversion + anchoring.</div></div>`,
summary:`Cognitive errors stem from faulty reasoning or incomplete information and are easier to correct through education; emotional biases stem from feelings and impulses, are spontaneous and harder to change, so advisers often adapt to them (especially when wealth is high relative to needs). Cognitive belief-perseverance errors are conservatism, confirmation, representativeness, illusion of control and hindsight; information-processing errors are anchoring and adjustment, mental accounting, framing and availability. Emotional biases are loss aversion (disposition effect), overconfidence, self-control, status quo, endowment and regret aversion. Biases can lead to under-diversification, excessive trading, undersaving and holding losers. Some market anomalies may reflect poorly specified risk rather than behavior, and behavioral finance has not fully explained bubbles and crashes, though biases such as overconfidence, herding and confirmation are evident during them.`
},
quiz:[
{q:"An investor refuses to sell a stock until it returns to her purchase price. This most likely reflects:",o:["anchoring and loss aversion","availability bias","illusion of control"],a:0,e:"Fixation on the purchase price (anchoring) and reluctance to realize a loss (loss aversion)."},
{q:"Which of the following is an emotional bias?",o:["Mental accounting","Regret aversion","Representativeness"],a:1,e:"Regret aversion is emotional; the others are cognitive."},
{q:"An analyst slowly revises forecasts after new data show a firm's earnings are deteriorating. This is best described as:",o:["conservatism bias","hindsight bias","self-control bias"],a:0,e:"Underreacting to new information by sticking to prior views = conservatism (belief perseverance)."},
{q:"For an emotional bias in a client whose wealth greatly exceeds their needs, an adviser should most likely:",o:["moderate the bias through education","adapt to the bias","ignore the client's preferences"],a:1,e:"Emotional biases are hard to change; with ample wealth, adapting has a small cost."}]
});

/* ===================== READING 92 ===================== */
add({n:92,topic:"pm",title:"Introduction to Risk Management",
los:["92.a Define risk management.","92.b Describe features of a risk management framework.","92.c Define risk governance and describe elements of effective risk governance.","92.d Explain how risk tolerance affects risk management.","92.e Describe risk budgeting and its role in risk governance.","92.f Identify financial and non-financial sources of risk and describe how they may interact.","92.g Describe methods for measuring and modifying risk exposures and factors to consider in choosing among the methods."],
s:{
eli5:`<p>Risk management isn't about avoiding all risk; you'd never cross the street. It's about choosing <em>which</em> risks are worth taking and making sure you can survive the bad days.</p>
<p>A family does it naturally: decide how much risk is OK (the "risk tolerance"), notice the risks (job loss, illness, car crash), and then for each one choose: <strong>accept it</strong> (keep an emergency fund), <strong>avoid it</strong> (don't ride a motorbike), <strong>spread it</strong> (don't put all savings in one stock), <strong>transfer it</strong> (buy insurance), or <strong>reshape it</strong> (lock in a mortgage rate).</p>
<p>Companies do the same, but with a formal plan, a board that sets the rules, and a "budget" of how much risk each department may use.</p>`,
core:`<p><strong>What problem is this solving?</strong> Organizations must take risk to earn returns, but too much (or the wrong kind) can destroy them. Risk management aligns the risks actually taken with the organization's goals and tolerance, so value is maximized for an acceptable level of risk.</p>
<ul><li><strong>Risk management ≠ risk minimization.</strong> The goal is the <em>optimal bundle</em> of risks, not zero risk.</li>
<li><strong>Top-down governance:</strong> the board/senior management sets risk tolerance (how much risk overall) and oversight; risk management then implements it. Good governance gives an enterprise-wide view, independence, and clear accountability.</li>
<li><strong>Risk tolerance</strong> is set by looking inward (goals, strategy, expertise) and outward (what could go wrong, what the organization could survive).</li>
<li><strong>Risk budgeting</strong> allocates that total risk to activities/assets where the expected reward per unit of risk is highest; it forces explicit trade-offs.</li>
<li><strong>Risks interact:</strong> financial (market, credit, liquidity) and non-financial (operational, legal, compliance, model, tax, settlement, solvency, accounting) can compound each other, especially in stress (e.g., market drop → margin calls → liquidity squeeze → forced sales → credit losses).</li>
<li><strong>Measure, then modify:</strong> standard deviation, beta, duration, Greeks, VaR/CVaR, scenario/stress tests; then accept, avoid/prevent, diversify, transfer (insurance) or shift (derivatives), choosing by cost vs benefit.</li></ul>`,
formal:`<h4>Definition and framework</h4>
<p>Risk management: identifying and measuring risks, establishing risk tolerance, deciding which risks to take/reduce/avoid, and structuring to maintain the bundle of risks that best achieves goals.</p>
<p>Framework activities: identify and measure risks; determine overall risk tolerance; establish risk governance processes and policies; manage and mitigate risks to the optimal bundle; monitor exposures over time; communicate across the organization; perform strategic risk analysis. Infrastructure (people, systems, data) and policies support it.</p>
<h4>Risk governance</h4>
<p>Senior management/board determines risk tolerance, the optimal risk exposure strategy and the oversight framework. Elements: enterprise risk management (ERM) perspective; risk management committee; chief risk officer; clear policies and procedures; independence of risk function; communication.</p>
<h4>Risk tolerance</h4>
<p>Overall amount of risk the organization will take in pursuit of its goals, set by top management (inside view: goals, competitive advantages; outside view: the environment and potential losses it could withstand).</p>
<h4>Risk budgeting</h4>
<p>Allocating total risk (tolerance) across assets/activities, considering their risk characteristics and how they combine. Can use a single measure (e.g., VaR, tracking error) or several risk factors.</p>
<h4>Sources of risk</h4>
<table><tr><th>Financial</th><th>Non-financial</th></tr>
<tr><td>Market risk (prices, rates, FX, commodities)</td><td>Operational (people, processes, systems, external events, cyber)</td></tr>
<tr><td>Credit risk (counterparty default)</td><td>Legal, regulatory and compliance; model risk; tax risk; accounting risk; settlement risk; solvency risk</td></tr>
<tr><td>Liquidity risk (selling only at a significant price concession)</td><td>For individuals: mortality risk (dying early) and longevity risk (outliving assets)</td></tr></table>
<p>Risks interact, especially in periods of stress.</p>
<h4>Measuring risk</h4>
<ul><li>Assets: standard deviation, beta, duration (rate sensitivity).</li>
<li>Derivatives: delta (price), gamma (delta's sensitivity), vega (volatility), rho (interest rate).</li>
<li>Tail risk: VaR (minimum loss in a stated % of cases over a period), conditional VaR (expected loss given that VaR is exceeded); scenario analysis and stress testing.</li>
<li>Some risks (operational, reputational) must be assessed subjectively.</li></ul>
<h4>Modifying risk</h4>
<ul><li><strong>Risk acceptance / self-insurance</strong> (bear it; keep reserves).</li>
<li><strong>Risk prevention and avoidance</strong> (don't engage or take steps to prevent).</li>
<li><strong>Risk transfer</strong> (insurance, surety bonds).</li>
<li><strong>Risk shifting</strong> (derivatives change the distribution of outcomes: forwards, futures, swaps, options).</li>
<li><strong>Diversification</strong> (efficient management of risk).</li>
<li>Choose by weighing costs and benefits; often a combination, to reach a risk profile matching tolerance.</li></ul>`,
math:`<div class="f"><span class="lbl">Parametric value at risk</span>VaR = z × σ × √t × portfolio value</div>
<div class="vars"><div><code>z</code><span>1.65 for 5% tail, 2.33 for 1% (one-tailed)</span></div><div><code>σ</code><span>Volatility per period</span></div><div><code>√t</code><span>Scales volatility over t periods (if independent)</span></div></div>
<p><strong>Why it works:</strong> with normal returns, a known fraction of outcomes lies beyond z standard deviations; multiply by value to express that cut-off in dollars. VaR is a <em>minimum</em> loss in the tail, so CVaR (the average loss beyond VaR) complements it.</p>
<div class="f"><span class="lbl">Duration (rate sensitivity)</span>%ΔPrice ≈ −Duration × ΔYield</div>
<div class="dir"><div>Confidence level <span class="up">↑</span> (z <span class="up">↑</span>) → VaR <span class="up">↑</span></div><div>Horizon <span class="up">↑</span> → VaR <span class="up">↑</span> with √t</div><div>Insurance (transfer) → cost certain, loss uncertainty <span class="dn">↓</span>; Options (shifting) → reshape the distribution</div></div>
<div class="calc" data-calc="var"></div>`,
example:`<div class="q">(a) A $10m portfolio has daily σ = 1.5%. Compute the 5% one-day VaR (z = 1.65) and the 5% 10-day VaR. (b) Match each action to a risk-modification method: (i) a manufacturer buys property insurance; (ii) an exporter sells foreign currency forward; (iii) a bank keeps a loss reserve; (iv) a fund refuses to invest in a country with capital controls; (v) a pension spreads across 2,000 securities. (c) A trader's large position falls 15%, triggering margin calls; the fund sells illiquid bonds at deep discounts. Which risks interacted?</div>
<ol class="steps"><li><strong>1-day VaR</strong> = 1.65 × 0.015 × 10,000,000 = <strong>$247,500</strong>.</li>
<li><strong>10-day VaR</strong> = 247,500 × √10 ≈ <strong>$782,664</strong>.</li>
<li><strong>Methods:</strong> (i) transfer; (ii) shifting (derivatives); (iii) acceptance/self-insurance; (iv) avoidance; (v) diversification.</li>
<li><strong>Interaction:</strong> market risk (price drop) → liquidity risk (margin calls, fire sales at discounts) and possibly credit/counterparty and operational risk; losses compound in stress.</li></ol>
<p class="ans">Answers: $247,500 · ≈$782,664 · transfer, shifting, acceptance, avoidance, diversification · market → liquidity (→ credit)</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> "Risk management aims to minimize risk." <b>Fix:</b> it aims for the optimal risk bundle for the goals.</li>
<li><b>Trap:</b> Reading VaR as the maximum loss. <b>Fix:</b> it's a minimum loss in the worst x% of cases.</li>
<li><b>Trap:</b> Risk transfer vs shifting. <b>Fix:</b> transfer = insurance/surety (another party bears the loss); shifting = derivatives reshape payoff distribution.</li>
<li><b>Trap:</b> Calling liquidity risk non-financial. <b>Fix:</b> market, credit, liquidity are financial.</li>
<li><b>Trap:</b> Thinking risk tolerance is set by the risk department. <b>Fix:</b> set by the board/senior management (governance).</li>
<li><b>Trap:</b> Treating risks as independent. <b>Fix:</b> they interact, especially in crises.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> define risk management/governance/tolerance/budgeting; list framework elements; classify financial vs non-financial risks; match a measure to an exposure (duration → rates, vega → volatility); match an action to a modification method; VaR interpretation.</li>
<li><strong>Greeks:</strong> Delta = price; Gamma = delta change; Vega = Volatility; Rho = Rates.</li>
<li><strong>Pattern:</strong> "self-insurance" = acceptance; "surety bond" = transfer.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Optimal, not minimal</b>Take the right risks, not zero risk.</div>
<div class="anchor"><b>Board sets the dial</b>Governance → tolerance → budget → limits.</div>
<div class="anchor"><b>Accept · Avoid · Diversify · Transfer · Shift</b>The five ways to modify risk.</div>
<div class="anchor"><b>VaR is the floor of the basement</b>The tail starts at VaR; losses can go deeper.</div></div>`,
summary:`Risk management identifies and measures risks, sets risk tolerance, decides which risks to take or avoid, and maintains the bundle of risks that best achieves the organization's goals; it is not risk minimization. A framework covers identification and measurement, risk tolerance, governance, management and mitigation, monitoring, communication and strategic analysis. Risk governance is senior management's setting of tolerance, strategy and oversight, ideally enterprise-wide. Risk tolerance is the overall risk the organization will take, and risk budgeting allocates it across assets and activities. Financial risks are market, credit and liquidity; non-financial risks include operational, legal/regulatory, model, tax, accounting, settlement and solvency risk (and, for individuals, mortality and longevity risk); risks interact, especially in stress. Risk is measured with standard deviation, beta, duration, Greeks (delta, gamma, vega, rho), VaR and CVaR, plus scenario/stress tests and judgment, and modified by acceptance (self-insurance), avoidance/prevention, diversification, transfer (insurance, surety bonds) or shifting (derivatives), chosen on costs and benefits.`
},
quiz:[
{q:"Which of the following is a non-financial risk?",o:["Liquidity risk","Model risk","Credit risk"],a:1,e:"Model risk arises from operations/internal processes; liquidity and credit are financial."},
{q:"A company buys a put option to limit losses on an asset it owns. This method of risk modification is:",o:["risk transfer","risk shifting","risk avoidance"],a:1,e:"Derivatives change the distribution of outcomes: risk shifting. Insurance/surety bonds are risk transfer."},
{q:"Risk tolerance for an organization is primarily determined by:",o:["individual traders","senior management and the board","external regulators"],a:1,e:"Setting risk tolerance is part of risk governance by top management."},
{q:"A 5% daily VaR of $1 million means:",o:["the maximum daily loss is $1 million","on 5% of days, losses are expected to be at least $1 million","on 95% of days, losses will be exactly $1 million"],a:1,e:"VaR is the minimum loss in the worst 5% of outcomes, not a maximum."}]
});

/* ===================== READING 93 ===================== */
add({n:93,topic:"eth",title:"Ethics and Trust in the Investment Profession",
los:["93.a Explain ethics.","93.b Describe the role of a code of ethics in defining a profession.","93.c Describe professions and how they establish trust.","93.d Describe the need for high ethical standards in investment management.","93.e Explain professionalism in investment management.","93.f Identify challenges to ethical behavior.","93.g Compare and contrast ethical standards with legal standards.","93.h Describe a framework for ethical decision making."],
s:{
eli5:`<p>When you go to a doctor, you can't check whether the medicine is right; you just have to <em>trust</em> them. Money management is the same: clients hand over their savings and can't easily see whether the adviser is acting in their interest. So the whole industry runs on trust.</p>
<p><strong>Ethics</strong> are the shared rules about right and wrong behavior. A <strong>profession</strong> (doctors, lawyers, CFA charterholders) earns trust by requiring real expertise, writing down a code of ethics, and punishing members who break it.</p>
<p>And "legal" isn't the same as "ethical": some things are legal but still wrong (like quietly favoring your best clients), and some laws lag behind what's right. A good professional asks "what <em>should</em> I do?", not just "what can I get away with?"</p>`,
core:`<p><strong>What problem is this solving?</strong> Investment services are intangible, complex and full of information asymmetry: clients can't easily judge quality or honesty. Without trust, clients won't participate, capital markets work worse, and everyone loses. High ethical standards and professional codes create the trust that makes the industry function.</p>
<ul><li><strong>Codes of ethics</strong> communicate to the public that members will use their knowledge honestly; they raise confidence and set a floor for conduct.</li>
<li><strong>Professions</strong> establish trust through specialized expertise, ethical standards, ongoing education, and monitoring/enforcement of conduct; members often serve the public interest, not only themselves.</li>
<li><strong>Suitability vs fiduciary:</strong> suitability means recommendations fit the client's needs and risk tolerance; fiduciary means acting in the client's <em>best interest</em> (a higher standard).</li>
<li><strong>Why good people go wrong:</strong> overconfidence in one's own ethics, focusing on short-term consequences (bonuses, targets), and situational influences (peer pressure, loyalty to bosses, money and prestige).</li>
<li><strong>Law vs ethics:</strong> laws are more specific, often reactive to past misconduct, and enforceable; ethics requires judgment and may demand more than the law.</li>
<li><strong>A decision framework</strong> slows decisions down and widens the view: identify the facts, stakeholders, duties and conflicts; consider situational influences, guidance and alternatives; decide and act; then reflect.</li></ul>`,
formal:`<h4>Key definitions</h4>
<ul><li><strong>Ethics:</strong> a set of moral principles and rules of conduct based on shared beliefs about acceptable behavior.</li>
<li><strong>Code of ethics:</strong> written set of moral principles communicating the organization's values to members and the public.</li>
<li><strong>Standards of conduct:</strong> minimum level of acceptable behavior, more specific than a code.</li>
<li><strong>Profession:</strong> occupational group with specialized expert knowledge, ethical standards and monitoring of conduct; establishes trust by high standards of expertise, ethical behavior and enforcement.</li></ul>
<h4>Need for high ethics in investment management</h4>
<p>Clients entrust assets and rely on expertise; product is intangible and outcomes uncertain; information asymmetry is large; unethical behavior harms clients, the firm, the profession and market efficiency (higher costs, less participation).</p>
<h4>Professionalism</h4>
<p>Suitability standard (recommendations consistent with client objectives/constraints) vs fiduciary standard (act in the client's best interest). Professionalism includes continuing competence, client-first behavior, ethical leadership and serving society.</p>
<h4>Challenges to ethical behavior</h4>
<ul><li>Overestimating one's own ethical character.</li>
<li>Considering only near-term consequences.</li>
<li>Situational influences (peer pressure, bonuses, prestige, loyalty, culture) that override judgment.</li></ul>
<h4>Ethical vs legal standards</h4>
<p>Not all unethical actions are illegal; not all illegal actions are unethical (e.g., civil disobedience). Laws are more specific, created in response to past behavior, and vary by jurisdiction; ethics requires judgment and often sets a higher bar.</p>
<h4>Framework for ethical decision making</h4>
<ol><li><strong>Identify:</strong> relevant facts, stakeholders and duties owed, ethical principles, conflicts of interest.</li>
<li><strong>Consider:</strong> situational influences, additional guidance (colleagues, compliance, codes), alternative actions.</li>
<li><strong>Decide and act.</strong></li>
