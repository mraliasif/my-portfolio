<style>

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --panel:#1a1b1f; --panel2:#222328; --ink:#ececee; --ink2:#b4b5bb; --ink3:#7d7e85;
    --line:#2e2f35; --quant:#7d9dff; --econ:#4cc79a; --cf:#f0a35c; --accent:#7d9dff;
    --good:#5fd394; --goodbg:#163325; --bad:#ff8a7d; --badbg:#3a1a17; --warnbg:#3a2e14; --warn:#f4c76a;
    --fbg:#202127; --shadow:none; --ontc:#121316;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --panel:#1a1b1f; --panel2:#222328; --ink:#ececee; --ink2:#b4b5bb; --ink3:#7d7e85;
  --line:#2e2f35; --quant:#7d9dff; --econ:#4cc79a; --cf:#f0a35c; --accent:#7d9dff;
  --good:#5fd394; --goodbg:#163325; --bad:#ff8a7d; --badbg:#3a1a17; --warnbg:#3a2e14; --warn:#f4c76a;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

.brand small{display:block;font-weight:500;color:var(--ink3);font-size:12px}

.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.overall{font-size:12px;color:var(--ink3);margin:2px 4px 12px}

<script>
window.READINGS=window.READINGS||[];
function add(o){window.READINGS.push(o)}

/* ===================== READING 80 ===================== */
add({n:80,topic:"alt",title:"Alternative Investment Features, Methods, and Structures",
los:["80.a Describe features and categories of alternative investments.","80.b Compare direct investment, co-investment, and fund investment methods for alternative investments.","80.c Describe investment ownership and compensation structures commonly used in alternative investments."],
s:{
eli5:`<p>Most people invest in things you can buy with one click: shares of big companies, government bonds, cash. Those are <strong>traditional</strong> investments. <strong>Alternative</strong> investments are everything else: owning part of a private start-up, a shopping mall, a toll road, a forest, or handing money to a hedge fund with clever (and secret) strategies.</p>
<p>They're harder to buy, harder to sell, harder to value, and often need lots of money and patience. In return they can earn extra return and move differently from the stock market, which smooths out a portfolio.</p>
<p>Usually you don't buy these yourself. You join a <strong>club</strong> (a fund) run by an expert manager. You're a "limited partner" (you put in money, your risk is limited to that), the manager is the "general partner" (runs everything). The manager gets paid two ways: a yearly fee just for managing, plus a share of the profits if they do well, like a chef who gets a salary plus a tip.</p>`,
core:`<p><strong>What problem is this solving?</strong> Investors want returns and diversification that public markets can't provide, but those opportunities are illiquid, complex and lumpy. Alternative investment structures solve <em>access</em> (pooling capital), <em>expertise</em> (specialist managers) and <em>incentives</em> (fee structures that reward performance).</p>
<ul><li><strong>Why alts behave differently:</strong> they hold illiquid, specialized assets valued infrequently, so returns show low correlation with stocks and bonds (partly real, partly an artefact of stale appraisals). They need long horizons and big commitments, and the manager's skill matters more than in index investing.</li>
<li><strong>Three ways in, a trade-off ladder:</strong> fund investing (easiest, most diversified, highest fees, least control) → co-investing (fund + the right to invest extra alongside the manager in specific deals, with lower or no fees on that part) → direct investing (most control, lowest fees, but needs in-house expertise and has concentration risk).</li>
<li><strong>Limited partnership structure:</strong> GP manages and has unlimited liability; LPs commit capital that the GP "calls" over time. LPs are typically accredited/institutional investors because these funds are lightly regulated.</li>
<li><strong>Fees align (and misalign) incentives:</strong> management fees pay the bills regardless of performance; performance fees reward gains. Hurdle rates, high-water marks, waterfalls and clawbacks exist to make sure the GP only shares in <em>genuine</em> profits.</li></ul>`,
formal:`<h4>Categories and features</h4>
<ul><li><strong>Categories:</strong> hedge funds; private capital (private equity, private debt); real assets (real estate, natural resources, infrastructure). Digital assets are often treated as an emerging category.</li>
<li><strong>Features vs traditional:</strong> low correlation with traditional assets; specialized manager knowledge; illiquidity and long lockups; less regulation and transparency; high minimums; complex fees and taxes; difficult valuation (appraisals, models); limited historical data.</li>
<li>Suitable for investors with long horizons, ability to commit large amounts, and tolerance for illiquidity.</li></ul>
<h4>Investment methods</h4>
<table><tr><th></th><th>Fund investing</th><th>Co-investing</th><th>Direct investing</th></tr>
<tr><td>How</td><td>Pool with others in a manager's fund</td><td>Fund investment + right to invest directly alongside the GP in deals</td><td>Buy assets yourself, no intermediary manager</td></tr>
<tr><td>Fees</td><td>Highest (management + performance)</td><td>Lower on co-invested portion</td><td>Lowest (no external fees)</td></tr>
<tr><td>Control / selection</td><td>Least</td><td>More; can learn from GP</td><td>Most</td></tr>
<tr><td>Expertise needed</td><td>Least (but manager due diligence)</td><td>Moderate</td><td>Most; large in-house team</td></tr>
<tr><td>Diversification</td><td>Highest</td><td>Moderate</td><td>Lowest (concentration risk)</td></tr>
<tr><td>Risk</td><td>Manager selection risk</td><td>Adverse selection (GP may offer weaker deals)</td><td>Operational, concentration</td></tr></table>
<h4>Ownership and compensation structures</h4>
<ul><li><strong>Limited partnership:</strong> GP (manager, unlimited liability) and LPs (investors, limited liability). <strong>Limited partnership agreement (LPA)</strong> governs; <strong>side letters</strong> give particular LPs special terms (e.g., more disclosure, fee discounts, most-favored-nation clauses).</li>
<li><strong>Committed vs invested capital:</strong> LPs commit an amount; the GP draws it down via capital calls as deals are found.</li>
<li><strong>Management fee:</strong> hedge funds charge % of AUM (e.g., 1–2%); private equity charges % of <em>committed</em> capital during the investment period.</li>
<li><strong>Performance (incentive) fee / carried interest:</strong> % of profits (e.g., 20%), usually only above a <strong>hurdle rate</strong>.</li>
<li><strong>Soft hurdle:</strong> once the hurdle is exceeded, fee is on the <em>entire</em> gain. <strong>Hard hurdle:</strong> fee only on gains <em>above</em> the hurdle.</li>
<li><strong>Catch-up clause:</strong> after the hurdle, GP gets a larger share until it has "caught up" to its full percentage of all profits.</li>
<li><strong>High-water mark:</strong> no incentive fee on gains that merely recover prior losses; fees only above the highest previous value.</li>
<li><strong>Waterfall:</strong> deal-by-deal (American) pays carry as each deal exits (GP-friendly); whole-of-fund (European) pays LPs all capital + hurdle before GP gets carry (LP-friendly).</li>
<li><strong>Clawback:</strong> LPs can recover carry previously paid to the GP if later losses reverse the gains.</li></ul>`,
math:`<div class="f"><span class="lbl">Basic fee structure ("2 and 20")</span>Management fee = m × AUM (hedge funds) or m × committed capital (PE)<br>Incentive fee = p × (gain above hurdle/HWM, per the terms)</div>
<div class="f"><span class="lbl">Soft vs hard hurdle</span>Soft: if return &gt; h → fee = p × (entire gain) &nbsp;·&nbsp; Hard: fee = p × (gain − hurdle amount)</div>
<div class="f"><span class="lbl">High-water mark</span>Fee base = value − max(HWM, beginning value); fee = 0 if value ≤ HWM</div>
<p><strong>Why these exist:</strong> without a hurdle, the GP earns carry on returns the LP could get from a savings account; without a HWM, a manager who loses 20% then gains 20% would be paid twice for getting back to where they started.</p>
<div class="dir"><div>Hard hurdle → GP fee <span class="dn">↓</span>, LP return <span class="up">↑</span> (vs soft)</div><div>European waterfall → GP gets carry <span class="dn">later</span> → LP protection <span class="up">↑</span></div><div>Clawback → protects LPs under an American waterfall</div></div>
<div class="calc" data-calc="fee"></div>`,
example:`<div class="q">(a) A fund starts the year at $100m and ends at $120m before fees. Fees: 2% management on year-end value, 20% incentive on gains after the management fee, 5% hurdle. Find the investor's net return with a soft hurdle and with a hard hurdle. (b) A PE fund with an American waterfall sells Deal A for a $30m gain in year 2 and pays 20% carry. Deal B later loses $20m. Total fund profit is $10m. What clawback applies? (c) An endowment wants control over individual deals but has only a small team. Which method fits?</div>
<ol class="steps"><li><strong>Management fee</strong> = 2% × 120 = 2.4 → value after fee 117.6.</li>
<li><strong>Soft hurdle:</strong> 17.6% &gt; 5% hurdle → incentive = 20% × 17.6 = 3.52 → ending 114.08 → net return <strong>14.08%</strong>.</li>
<li><strong>Hard hurdle:</strong> incentive = 20% × (117.6 − 105) = 2.52 → ending 115.08 → net return <strong>15.08%</strong>. Hard hurdle is better for LPs.</li>
<li><strong>Waterfall:</strong> GP received 20% × 30 = $6m on Deal A. On the whole fund, carry should be 20% × 10 = $2m. Clawback = <strong>$4m</strong> returned to LPs. (A European waterfall would have avoided the overpayment by paying carry only after LPs got capital + hurdle back.)</li>
<li><strong>Method:</strong> <strong>co-investing</strong>: fund exposure plus the option to invest directly in selected deals, learning from the GP without needing a full direct-investment team.</li></ol>
<p class="ans">Answers: 14.08% (soft) · 15.08% (hard) · $4m clawback · co-investing</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> PE management fee on invested capital. <b>Fix:</b> PE fees are on <em>committed</em> capital (hedge funds: on AUM).</li>
<li><b>Trap:</b> Mixing up soft and hard hurdles. <b>Fix:</b> soft = once cleared, fee on everything; hard = fee only on the excess.</li>
<li><b>Trap:</b> Thinking a HWM resets each year. <b>Fix:</b> it's the highest prior (net) value; losses must be recovered first.</li>
<li><b>Trap:</b> Believing American waterfalls favor LPs. <b>Fix:</b> deal-by-deal favors GPs (earlier carry); whole-of-fund favors LPs.</li>
<li><b>Trap:</b> Calling LPs the managers. <b>Fix:</b> GP manages; LPs are passive with limited liability.</li>
<li><b>Trap:</b> Assuming direct investing is always cheaper overall. <b>Fix:</b> lower fees, but large internal costs and concentration risk.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> list features/categories; compare fund vs co- vs direct investing; identify fee terms (hurdle type, HWM, catch-up, clawback, waterfall); compute fees and net returns.</li>
<li><strong>Fee-calculation recipe:</strong> (1) management fee on the stated base; (2) decide whether incentive is computed before or after the management fee (read the question!); (3) check hurdle type; (4) check HWM; (5) net return = ending after all fees ÷ beginning − 1.</li>
<li><strong>Pattern:</strong> "LPs receive all distributions until they get capital plus hurdle" → European/whole-of-fund.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Salary + tip</b>Management fee = salary; incentive fee = tip for good service.</div>
<div class="anchor"><b>Soft = all, Hard = above</b>Soft hurdle: tip on the whole bill; hard: tip only on the part above the hurdle.</div>
<div class="anchor"><b>High-water mark: no pay for repairs</b>Fixing your own losses isn't profit.</div>
<div class="anchor"><b>American = As you go; European = Everyone else first</b>Deal-by-deal vs whole-of-fund.</div>
<div class="anchor"><b>Fund → Co → Direct</b>More control and less fee, but more skill and concentration needed.</div></div>`,
summary:`Alternative investments (hedge funds, private equity and debt, real estate, natural resources, infrastructure) differ from traditional assets through low correlation with stocks and bonds, illiquidity, specialized manager skill, less regulation and transparency, high minimums, complex fees and difficult valuation, suiting investors with long horizons and large capital. Investors access them by fund investing (pooled, diversified, highest fees, least control), co-investing (fund plus direct deal rights, lower fees, adverse selection risk) or direct investing (most control, lowest fees, needs expertise, concentrated). Most are limited partnerships: the GP manages, LPs commit capital that is called over time, governed by an LPA and side letters. Compensation combines a management fee (on AUM for hedge funds, on committed capital for PE) and a performance fee, typically above a hurdle (soft: fee on the whole gain once cleared; hard: only on the excess), subject to a high-water mark, catch-up, a deal-by-deal (American) or whole-of-fund (European) waterfall, and clawback provisions.`
},
quiz:[
{q:"A private equity fund's management fee is typically based on:",o:["assets under management at year-end","committed capital","realized profits"],a:1,e:"PE funds charge management fees on committed capital (especially during the investment period); hedge funds charge on AUM."},
{q:"A fund earns 12% with an 8% hurdle and 20% incentive fee. Under a hard hurdle the incentive fee is based on:",o:["12%","4%","8%"],a:1,e:"Hard hurdle: fee only on returns above the hurdle (12% − 8% = 4%). A soft hurdle would charge on the full 12%."},
{q:"Which waterfall structure is most advantageous to limited partners?",o:["Deal-by-deal (American)","Whole-of-fund (European)","Both are equivalent"],a:1,e:"Whole-of-fund pays LPs their capital plus hurdle before the GP earns carry."}]
});

/* ===================== READING 81 ===================== */
add({n:81,topic:"alt",title:"Alternative Investment Performance and Returns",
los:["81.a Describe the performance appraisal of alternative investments.","81.b Calculate and interpret alternative investment returns both before and after fees."],
s:{
eli5:`<p>Judging a private fund is like judging a new restaurant during its first year. At first it only spends money (rent, kitchen, staff), so it looks like a disaster. Then it starts serving customers. Only years later do the profits roll in. If you judged it after year one, you'd call it a failure. That dip-then-rise shape is the <strong>J-curve</strong>.</p>
<p>Also, nobody tells you the restaurant's true price every day. The owner estimates it once in a while. That makes its value look calm and steady, even if it's really bumpier. So the numbers can make alternatives look <em>safer than they are</em>.</p>
<p>And remember: the manager takes fees first. What you actually earn is the return <em>after</em> those fees.</p>`,
core:`<p><strong>What problem is this solving?</strong> Standard performance tools (time-weighted returns, Sharpe ratios on monthly data) can mislead for alternatives because of irregular cash flows, leverage, stale valuations and complex fees. Analysts need adjusted tools and healthy scepticism.</p>
<ul><li><strong>Timing of cash flows:</strong> the GP decides when to call and return money, so the <strong>IRR</strong> (money-weighted) is the right return measure. <strong>MOIC</strong> (multiple of invested capital) is a simple, timing-free check.</li>
<li><strong>J-curve:</strong> early fees, set-up costs and conservative marks make returns negative during commitment; less negative during deployment; positive during distribution/exits.</li>
<li><strong>Leverage</strong> magnifies returns (and losses), so compare levered and unlevered numbers carefully.</li>
<li><strong>Valuation:</strong> Level 1 (quoted prices), Level 2 (observable inputs), Level 3 (unobservable inputs, model/appraisal-based). Level 3 assets are marked infrequently → <em>smoothed</em> returns → volatility and correlation understated, Sharpe ratios overstated.</li>
<li><strong>Fees and taxes</strong> can eat a large slice of gross returns; investors care about net-of-fee returns, and fee terms (hurdles, HWMs, catch-up) change outcomes a lot.</li>
<li><strong>Other appraisal issues:</strong> short track records, survivorship and backfill bias in databases, non-normal returns (negative skew, fat tails), so downside measures (Sortino, max drawdown) and longer windows help.</li></ul>`,
formal:`<h4>Performance appraisal challenges</h4>
<ul><li>Cash flow timing controlled by managers → use IRR (money-weighted) at fund level; TWR less meaningful.</li>
<li>J-curve: capital commitment phase (negative), capital deployment phase (less negative), capital distribution phase (positive).</li>
<li>Leverage: increases returns and risk; also adds financing costs.</li>
<li>Valuation hierarchy (fair value): Level 1, 2, 3. Infrequent marks bias return measures upward and risk measures downward.</li>
<li>Complex fee structures and taxation; custom terms in side letters make peer comparison hard.</li>
<li>Risk measures beyond σ: Sortino ratio (downside deviation), maximum drawdown, VaR; returns often negatively skewed with excess kurtosis.</li></ul>
<h4>Return measures</h4>
<ul><li><strong>IRR:</strong> discount rate equating PV of contributions and distributions (+ residual NAV).</li>
<li><strong>MOIC</strong> = (realized value + unrealized value) / total invested capital. Ignores timing.</li>
<li><strong>Leveraged return</strong> = [r(V₀ + V<sub>B</sub>) − r<sub>B</sub>V<sub>B</sub>]/V₀.</li></ul>
<h4>Before- and after-fee returns</h4>
<p>Before-fee returns are computed like any return. After-fee returns adjust values/cash flows for management fees (on AUM, committed capital or NAV), incentive fees (with hurdle type, catch-up), high-water marks, and any redemption fees. Key conventions to read in a question: is the management fee based on beginning or ending assets? Is the incentive fee calculated net of the management fee or independently?</p>`,
math:`<div class="f"><span class="lbl">Multiple of invested capital</span>MOIC = (realized value + unrealized value) / total invested capital</div>
<p><strong>Why it's useful (and limited):</strong> it answers "how many dollars back per dollar in?", but 2× over 3 years and 2× over 10 years look identical. Pair it with IRR.</p>
<div class="f"><span class="lbl">Leveraged return</span>r<sub>L</sub> = [r × (V₀ + V<sub>B</sub>) − r<sub>B</sub> × V<sub>B</sub>] / V₀</div>
<div class="vars"><div><code>V₀</code><span>Investor's own capital</span></div><div><code>V<sub>B</sub></code><span>Borrowed funds</span></div><div><code>r</code><span>Return on total investments</span></div><div><code>r<sub>B</sub></code><span>Borrowing rate</span></div></div>
<div class="f"><span class="lbl">After-fee value (one period)</span>End<sub>net</sub> = End<sub>gross</sub> − management fee − incentive fee &nbsp;·&nbsp; Net return = End<sub>net</sub>/Begin − 1</div>
<div class="dir"><div>Infrequent appraisals → measured σ <span class="dn">↓</span>, correlation <span class="dn">↓</span>, Sharpe <span class="up">↑</span> (overstated)</div><div>r &gt; r<sub>B</sub> → leverage <span class="up">↑</span> return; r &lt; r<sub>B</sub> → leverage <span class="dn">↓</span> return</div><div>Prior loss below HWM → incentive fee = 0 until recovered</div></div>
<div class="calc" data-calc="lev"></div>
<div class="calc" data-calc="fee"></div>`,
example:`<div class="q">(a) A PE fund has invested $100m, distributed $90m and holds remaining investments valued at $60m. Find MOIC. (b) A real estate fund invests $100m of equity plus $50m borrowed at 6%; assets return 12%. Find the levered return. (c) A hedge fund (2% management fee on year-end assets, 20% incentive net of the management fee, no hurdle) grows from $100m to $120m gross. Find the net return. (d) Repeat (c) if the high-water mark is $118m.</div>
<ol class="steps"><li><strong>MOIC</strong> = (90 + 60)/100 = <strong>1.5×</strong>.</li>
<li><strong>Levered:</strong> [0.12 × 150 − 0.06 × 50]/100 = (18 − 3)/100 = <strong>15%</strong> vs 12% unlevered.</li>
<li><strong>Fees:</strong> management = 2.4 → 117.6; incentive = 20% × (117.6 − 100) = 3.52 → 114.08 → net <strong>14.08%</strong> (gross 20%).</li>
<li><strong>With HWM = 118:</strong> after management fee value 117.6 &lt; 118 → incentive = 0 → net = 117.6/100 − 1 = <strong>17.6%</strong>. The investor keeps more because earlier losses haven't been recovered yet.</li></ol>
<p class="ans">Answers: 1.5× · 15% · 14.08% · 17.6%</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Using time-weighted return for a PE fund. <b>Fix:</b> GP controls cash flows → IRR.</li>
<li><b>Trap:</b> Trusting low volatility of appraisal-based returns. <b>Fix:</b> smoothing understates risk and correlation.</li>
<li><b>Trap:</b> Computing the incentive fee on gross gain when the question says "net of management fee" (or vice versa). <b>Fix:</b> underline the convention.</li>
<li><b>Trap:</b> Thinking MOIC captures speed. <b>Fix:</b> it ignores timing.</li>
<li><b>Trap:</b> Judging a young PE fund by its early negative IRR. <b>Fix:</b> J-curve.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> describe the J-curve phases; Level 1/2/3 assets; why IRR is used; MOIC; levered return; net-of-fee return with hurdles/HWM.</li>
<li><strong>Speed tip:</strong> lay fee problems out as a mini table: Begin → Gross end → − Mgmt → − Incentive → Net end.</li>
<li><strong>Pattern:</strong> "valued using unobservable inputs" → Level 3.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>New restaurant</b>J-curve: spend first, earn later.</div>
<div class="anchor"><b>Photos, not video</b>Appraisals are snapshots; they hide the bumps between them.</div>
<div class="anchor"><b>Quoted · Observable · Guessed</b>Fair value Levels 1, 2, 3.</div>
<div class="anchor"><b>Fees off the top, then hurdle, then HWM</b>The order of fee calculation.</div></div>`,
summary:`Alternative investments are harder to appraise because managers control cash-flow timing (so IRR is appropriate, with MOIC = (realized + unrealized)/invested as a simple timing-free measure), returns follow a J-curve (negative during commitment, less negative in deployment, positive in distribution), leverage magnifies returns (r<sub>L</sub> = [r(V₀ + V<sub>B</sub>) − r<sub>B</sub>V<sub>B</sub>]/V₀), and many assets are Level 3 (unobservable inputs) with infrequent valuations that bias returns up and measured risk and correlation down. Fees and taxes are complex. Before-fee returns are computed normally; after-fee returns deduct management fees and incentive fees according to the stated base, hurdle type, catch-up and high-water mark.`
},
quiz:[
{q:"During the capital commitment phase of a private equity fund, returns are typically:",o:["negative","near zero","strongly positive"],a:0,e:"Fees and set-up costs before investments mature produce the downward first leg of the J-curve."},
{q:"Infrequent appraisal-based valuations of alternative assets most likely cause:",o:["overstated volatility","understated correlation with public markets","understated Sharpe ratios"],a:1,e:"Smoothing makes returns look less volatile and less correlated, which overstates risk-adjusted performance."},
{q:"A fund invested $80m, has distributed $60m and holds assets valued at $70m. MOIC is closest to:",o:["0.75×","1.63×","1.88×"],a:1,e:"(60 + 70)/80 = 1.625×."}]
});

/* ===================== READING 82 ===================== */
add({n:82,topic:"alt",title:"Investments in Private Capital: Equity and Debt",
los:["82.a Explain features of private equity and its investment characteristics.","82.b Explain features of private debt and its investment characteristics.","82.c Describe the diversification benefits that private capital can provide."],
s:{
eli5:`<p><strong>Private equity</strong> is buying pieces of companies that aren't on the stock market. Sometimes it's a tiny start-up with a big idea (<em>venture capital</em>): most fail, a few become giants. Sometimes it's buying a whole grown-up company using lots of borrowed money, fixing it up, and selling it a few years later for more (<em>leveraged buyout</em>), like flipping a house with a mortgage.</p>
<p><strong>Private debt</strong> is lending money to those private companies directly, instead of through a bank. Lenders get interest and are paid before the owners, so it's safer than private equity, but riskier than lending to big public companies.</p>
<p>Because these deals aren't priced every day and depend on business skill, they can help a portfolio that's mostly stocks and bonds.</p>`,
core:`<p><strong>What problem is this solving?</strong> Many companies need capital that public markets won't or can't provide efficiently: start-ups too young for an IPO, mature firms that would run better with concentrated ownership, borrowers too small or complex for bond markets. Private capital fills these gaps and earns an illiquidity and complexity premium.</p>
<ul><li><strong>Venture capital</strong> earns returns from rare big winners; it's a numbers game with high failure rates. Stages: formative (angel, seed, early) → later (expansion) → mezzanine (pre-IPO).</li>
<li><strong>LBOs</strong> create value through operational improvement, EBITDA growth, debt paydown (equity's share of enterprise value grows as debt shrinks), and multiple expansion. Leverage magnifies all of it, along with risk.</li>
<li><strong>Exit is the payday:</strong> trade sale, IPO, recapitalization, secondary sale, or write-off. Exit timing and market conditions drive returns.</li>
<li><strong>Private debt</strong> trades liquidity for higher yields: direct lending (senior, secured), venture debt (to start-ups, often with warrants), mezzanine (subordinated, with equity kickers), distressed debt (buying debt of troubled firms to profit in restructuring), unitranche (blended senior + subordinated in one loan).</li>
<li><strong>Vintage-year diversification:</strong> fund returns depend heavily on the economic environment when capital is invested, so spread commitments over time.</li></ul>`,
formal:`<h4>Private equity</h4>
<ul><li><strong>Leveraged buyouts (LBOs):</strong> acquire a company (public-to-private or private) using significant debt. <strong>Management buyout (MBO):</strong> existing management participates. <strong>Management buy-in (MBI):</strong> external management replaces existing management.</li>
<li><strong>Venture capital:</strong> formative stage (angel investing, seed, early stage), later stage (expansion), mezzanine stage (preparing for IPO).</li>
<li><strong>Growth/development capital (minority equity):</strong> minority stakes for expansion or restructuring; in public companies = PIPE (private investment in public equity).</li>
<li><strong>Exit routes:</strong> trade sale (to a strategic buyer), IPO, recapitalization (portfolio company issues debt to pay a dividend to the PE fund), secondary sale (to another PE firm or investors), write-off/liquidation.</li></ul>
<h4>Private debt</h4>
<table><tr><th>Type</th><th>Key features</th><th>Risk/return</th></tr>
<tr><td>Direct lending</td><td>Non-bank lenders make senior, secured loans to private firms</td><td>Lower risk within private debt; floating rates</td></tr>
<tr><td>Venture debt</td><td>Loans to start-ups lacking cash flow; often with warrants</td><td>High risk; equity-like upside</td></tr>
<tr><td>Mezzanine debt</td><td>Subordinated, often with warrants/conversion; used in LBOs</td><td>Higher yield than senior; below senior in priority</td></tr>
<tr><td>Distressed debt</td><td>Buying debt of firms in or near default/bankruptcy; may influence restructuring</td><td>High risk, high return; specialized expertise</td></tr>
<tr><td>Unitranche</td><td>Single loan blending senior and subordinated with one blended rate</td><td>Between senior and mezzanine</td></tr></table>
<p>Requires knowledge of debt structure, borrower life cycle and underlying asset features.</p>
<h4>Risk, return and diversification</h4>
<ul><li>Risk/return ladder: senior private debt &lt; mezzanine &lt; LBO equity &lt; venture capital.</li>
<li>Returns can exceed public equivalents (illiquidity premium, skill), but dispersion across managers is wide → manager selection is critical.</li>
<li>Low correlation with traditional assets (partly smoothing) → diversification benefit.</li>
<li><strong>Vintage year</strong> matters: funds starting in expansions do best in early-stage VC; funds starting in contractions do best in distressed strategies. Diversify across vintages.</li></ul>`,
math:`<div class="f"><span class="lbl">LBO equity value at exit</span>Equity<sub>exit</sub> = EBITDA<sub>exit</sub> × exit multiple − net debt<sub>exit</sub></div>
<div class="f"><span class="lbl">Returns</span>MOIC = Equity<sub>exit</sub> / Equity<sub>entry</sub> &nbsp;·&nbsp; IRR = MOIC<sup>1/years</sup> − 1 (single entry and exit)</div>
<p><strong>Why it works:</strong> enterprise value = EBITDA × multiple. Equity is what's left after debt. Three levers raise exit equity: grow EBITDA, sell at a higher multiple, and pay down debt (each dollar of debt repaid becomes a dollar of equity).</p>
<div class="dir"><div>EBITDA <span class="up">↑</span>, exit multiple <span class="up">↑</span>, debt <span class="dn">↓</span> → equity return <span class="up">↑</span></div><div>More initial leverage → higher MOIC if things go well, but more risk of losing all equity</div><div>Longer holding period at the same MOIC → IRR <span class="dn">↓</span></div></div>
<div class="calc" data-calc="lev"></div>`,
example:`<div class="q">A PE fund buys a company with EBITDA $50m at 8× ($400m), financed with 60% debt. Five years later EBITDA is $70m, it sells at 8×, and debt has been paid down to $140m. (a) Entry equity? (b) Exit equity? (c) MOIC and IRR? (d) Which value-creation levers worked? (e) Classify: (i) a loan to a pre-profit start-up with warrants; (ii) buying bonds of a bankrupt retailer; (iii) one loan combining senior and junior tranches.</div>
<ol class="steps"><li><strong>Entry:</strong> debt = 0.6 × 400 = 240 → equity = <strong>$160m</strong>.</li>
<li><strong>Exit:</strong> EV = 70 × 8 = 560 → equity = 560 − 140 = <strong>$420m</strong>.</li>
<li><strong>MOIC</strong> = 420/160 = <strong>2.625×</strong>; IRR = 2.625<sup>1/5</sup> − 1 ≈ <strong>21.3%</strong>.</li>
<li><strong>Levers:</strong> EBITDA growth (+$160m of EV) and debt paydown (+$100m to equity). Multiple unchanged, so no multiple expansion.</li>
<li><strong>Classify:</strong> (i) venture debt; (ii) distressed debt; (iii) unitranche.</li></ol>
<p class="ans">Answers: $160m · $420m · 2.625×, ≈21.3% · EBITDA growth + deleveraging · venture debt, distressed debt, unitranche</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> MBO vs MBI. <b>Fix:</b> MBO = existing managers buy; MBI = outside managers come in.</li>
<li><b>Trap:</b> "Mezzanine" means the same in VC and debt. <b>Fix:</b> VC mezzanine stage = pre-IPO financing; mezzanine debt = subordinated debt with equity kicker.</li>
<li><b>Trap:</b> Recapitalization as an exit means selling the company. <b>Fix:</b> it's issuing portfolio-company debt to pay the fund a dividend; ownership is retained.</li>
<li><b>Trap:</b> Assuming private debt is always low risk. <b>Fix:</b> venture and distressed debt are high risk.</li>
<li><b>Trap:</b> Taking reported low correlations at face value. <b>Fix:</b> part of it is appraisal smoothing.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> identify PE strategy or VC stage; exit routes; types of private debt; risk ranking; vintage-year logic; simple LBO return math.</li>
<li><strong>Vintage pattern:</strong> expansion start → early-stage VC; contraction start → distressed.</li>
<li><strong>Risk ladder:</strong> senior direct lending &lt; unitranche &lt; mezzanine &lt; LBO equity &lt; VC.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>House flipping with a mortgage</b>LBO: borrow, improve, pay down, sell.</div>
<div class="anchor"><b>Lottery of start-ups</b>VC: many small losses, a few huge wins.</div>
<div class="anchor"><b>T-I-R-S-W</b>Exits: Trade sale, IPO, Recap, Secondary, Write-off.</div>
<div class="anchor"><b>Vintage like wine</b>The year you start matters; buy several years.</div></div>`,
summary:`Private equity invests in private companies (or takes public ones private), often with heavy leverage: leveraged buyouts (management buyouts by existing managers, buy-ins by external managers), venture capital (formative: angel, seed, early; later/expansion; mezzanine/pre-IPO) and growth/minority capital (PIPEs for public firms). Exits occur via trade sale, IPO, recapitalization, secondary sale or write-off, and LBO returns come from EBITDA growth, multiple expansion and debt paydown. Private debt lends to private entities through direct lending, venture debt, mezzanine loans, distressed debt and unitranche loans, requiring expertise in structure, life cycle and collateral. Private capital offers higher potential returns with wide manager dispersion and low (partly smoothed) correlation with traditional assets; investors should diversify across vintage years, since early-stage strategies tend to do best when launched in expansions and distressed strategies when launched in contractions.`
},
quiz:[
{q:"An external management team acquires a company and replaces the existing management. This is a:",o:["management buyout","management buy-in","PIPE"],a:1,e:"Buy-in = outside managers; buyout = existing managers."},
{q:"A portfolio company issues new debt and uses the proceeds to pay a dividend to the PE fund. This exit route is a:",o:["trade sale","recapitalization","secondary sale"],a:1,e:"Recapitalization returns cash to the fund while it keeps ownership."},
{q:"Funds that begin investing during a business cycle contraction are most likely to earn higher returns if they specialize in:",o:["early-stage venture capital","distressed debt","growth equity in technology"],a:1,e:"Contractions create cheap distressed opportunities that pay off in recovery."}]
});

/* ===================== READING 83 ===================== */
add({n:83,topic:"alt",title:"Real Estate and Infrastructure",
los:["83.a Explain features and characteristics of real estate.","83.b Explain the investment characteristics of real estate investments.","83.c Explain features and characteristics of infrastructure.","83.d Explain the investment characteristics of infrastructure investments."],
s:{
eli5:`<p>Owning a building is like owning a cow: it gives you "milk" every month (rent), and the cow itself might become worth more or less over time (property value). You can own the cow yourself (lots of work, lots of control), or buy shares in a big dairy company that owns thousands of cows (a <strong>REIT</strong>, which you can sell any day).</p>
<p>You can also <em>lend</em> money to the cow's owner (a mortgage) and get steady interest, which is safer than owning.</p>
<p><strong>Infrastructure</strong> is the stuff a whole town needs: roads, airports, power lines, water pipes, phone towers, hospitals. These are huge, long-lived, and usually earn steady, often inflation-linked, money for decades. A road that's already built and busy is safer than one that only exists on paper.</p>`,
core:`<p><strong>What problem is this solving?</strong> Investors want income, inflation protection and diversification from tangible assets, and economies need private money to build and run property and infrastructure. The investment form chosen (equity vs debt, direct vs indirect, core vs opportunistic, brownfield vs greenfield) decides where you sit on the risk ladder.</p>
<ul><li><strong>Two ways to slice:</strong> equity vs debt (ownership vs lending) and direct vs indirect (own the property vs own a security such as a REIT or mortgage-backed security).</li>
<li><strong>Direct ownership:</strong> control, tax benefits (depreciation, interest deductions), diversification; but illiquid, lumpy, needs expertise, high costs, concentrated.</li>
<li><strong>REITs:</strong> liquid, professionally managed, diversified, avoid double taxation (if they distribute most income), but behave more like equities in the short run.</li>
<li><strong>Strategy risk ladder:</strong> core (stable, high-quality, leased) → core-plus (light improvements) → value-add (major redevelopment/repositioning) → opportunistic (development, distressed, highest risk). Senior debt and core are bond-like; the rest are equity-like.</li>
<li><strong>Infrastructure:</strong> essential services, high barriers to entry, inelastic demand, long life, often regulated or contracted (availability payments) → stable, inflation-linked cash flows. Brownfield (existing) &lt; greenfield (to be built) in risk; demand-based revenue (tolls, traffic) is riskier than availability-based payments.</li></ul>`,
formal:`<h4>Real estate forms</h4>
<table><tr><th></th><th>Debt</th><th>Equity</th></tr>
<tr><td>Direct (private)</td><td>Mortgages, construction loans</td><td>Direct ownership, joint ventures, private real estate funds</td></tr>
<tr><td>Indirect (public)</td><td>Mortgage-backed securities (RMBS, CMBS)</td><td>REITs, real estate operating companies, real estate ETFs</td></tr></table>
<ul><li><strong>Property types:</strong> residential and commercial (office, industrial/warehouse, retail, multifamily, hospitality, specialized).</li>
<li><strong>Direct equity advantages:</strong> operational control, tax benefits, diversification. <strong>Drawbacks:</strong> illiquidity, operational complexity, specialized knowledge, high initial investment, concentration risk.</li>
<li><strong>REITs:</strong> liquidity, professional management, diversified pool, exemption from double taxation (must distribute most taxable income).</li></ul>
<h4>Investment characteristics and strategies</h4>
<ul><li>Return = rental income + appreciation; leverage common.</li>
<li><strong>Core:</strong> high-quality, fully leased properties in major markets (bond-like). <strong>Core-plus:</strong> some improvements. <strong>Value-add:</strong> major redevelopment/repositioning. <strong>Opportunistic:</strong> development, distressed, emerging markets (highest risk).</li>
<li>Bond-like: senior debt (least risky), core. Equity-like: core-plus, value-add, opportunistic, junior debt.</li>
<li>Risks: illiquidity, leverage, appraisal smoothing, interest-rate sensitivity, tenant/vacancy risk, local market cycles. Inflation hedge depends on lease terms.</li></ul>
<h4>Infrastructure</h4>
<ul><li><strong>Categories:</strong> transportation (roads, airports, ports, rail); utilities/energy (power generation, transmission, water, waste); information and communication technology (towers, fiber, data centers); social infrastructure (schools, hospitals, prisons, government buildings).</li>
<li><strong>Brownfield:</strong> existing assets; <strong>secondary-stage brownfield:</strong> fully operational with stable cash flows (lowest risk). <strong>Greenfield:</strong> to be constructed (construction and demand risk).</li>
<li>Public-private partnerships (PPPs); concessions; availability payments vs demand-based (user fee) revenue.</li>
<li>Forms: direct, private infrastructure funds, listed infrastructure companies/funds/ETFs.</li></ul>
<h4>Infrastructure investment characteristics</h4>
<p>Long-lived, stable, often inflation-linked cash flows; high barriers to entry; low correlation of infrastructure <em>equity</em> with public equities; infrastructure <em>debt</em> is safer and less cyclical. Brownfield less risky than greenfield; demand-based projects are riskiest. Risks: regulatory/political, construction, operational, illiquidity, leverage.</p>`,
math:`<div class="f"><span class="lbl">Property value from income (direct capitalization) — useful background</span>Value = Net operating income (NOI) / cap rate</div>
<div class="vars"><div><code>NOI</code><span>Rental income − operating expenses (before financing and taxes)</span></div><div><code>Cap rate</code><span>The income yield investors require on the property (like an earnings yield)</span></div></div>
<p><strong>Why it works:</strong> it's a perpetuity: value = income ÷ required yield. A lower cap rate (investors accept less yield, e.g., when rates fall or the property is safer) means a higher value.</p>
<div class="f"><span class="lbl">Total return</span>Real estate return = income return (NOI/value) + capital appreciation</div>
<div class="dir"><div>Interest rates <span class="up">↑</span> → cap rates <span class="up">↑</span> → values <span class="dn">↓</span></div><div>Core → opportunistic: risk <span class="up">↑</span>, share of return from appreciation <span class="up">↑</span></div><div>Greenfield / demand-based → risk <span class="up">↑</span> vs brownfield / availability-based</div></div>`,
example:`<div class="q">(a) An office building earns NOI of $5m; comparable properties trade at a 6.25% cap rate. Estimate its value, and its value if cap rates rise to 7%. (b) Classify on the risk ladder: (i) buying a fully leased, prime warehouse; (ii) buying an old hotel to gut and reposition as apartments; (iii) developing a mall on raw land in a frontier market; (iv) a senior mortgage on a prime office. (c) Rank by risk: a new toll road to be built; an operating water utility with regulated tariffs; an existing toll road with 10 years of traffic history.</div>
<ol class="steps"><li><strong>Value</strong> = 5/0.0625 = <strong>$80m</strong>. At 7%: 5/0.07 = <strong>$71.4m</strong> (−10.7%): rising cap rates hurt values.</li>
<li><strong>(i)</strong> core; <strong>(ii)</strong> value-add; <strong>(iii)</strong> opportunistic; <strong>(iv)</strong> senior debt (bond-like, least risky).</li>
<li><strong>Infrastructure ranking (low → high):</strong> regulated water utility (secondary-stage brownfield, stable) &lt; existing toll road (brownfield but demand-based) &lt; new toll road (greenfield + demand-based, riskiest).</li></ol>
<p class="ans">Answers: $80m → $71.4m · core, value-add, opportunistic, senior debt · utility &lt; existing toll road &lt; new toll road</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Calling REITs illiquid. <b>Fix:</b> REITs are publicly traded and liquid; direct real estate is illiquid.</li>
<li><b>Trap:</b> Thinking core-plus is bond-like. <b>Fix:</b> only senior debt and core are bond-like.</li>
<li><b>Trap:</b> Mixing brownfield and greenfield. <b>Fix:</b> brownfield = already built (lower risk); greenfield = to be built.</li>
<li><b>Trap:</b> Assuming all infrastructure is low risk. <b>Fix:</b> greenfield and demand-based projects carry significant risk.</li>
<li><b>Trap:</b> Believing appraisal-based real estate indexes show true volatility. <b>Fix:</b> they're smoothed.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> direct vs indirect pros/cons; classify a strategy (core → opportunistic); bond-like vs equity-like; infrastructure categories; brownfield vs greenfield; which is riskiest.</li>
<li><strong>Pattern:</strong> "major redevelopment" → value-add; "development/distressed" → opportunistic.</li>
<li><strong>Pattern:</strong> "fully operational, stable cash flows" → secondary-stage brownfield.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Cow and milk</b>Property value + rent.</div>
<div class="anchor"><b>C · C+ · V · O</b>Core, Core-plus, Value-add, Opportunistic: rising risk.</div>
<div class="anchor"><b>Brown = Built, Green = Grass</b>Brownfield exists; greenfield is still grass.</div>
<div class="anchor"><b>Tolls are traffic bets</b>Demand-based revenue = riskiest infrastructure.</div></div>`,
summary:`Real estate investments can be equity or debt and direct (property, mortgages) or indirect (REITs, real estate operating companies, MBS). Direct equity offers control, tax benefits and diversification but is illiquid, complex, expertise-heavy, lumpy and concentrated; REITs offer liquidity, professional management, diversification and no double taxation. Strategies rise in risk from core (high-quality leased property) to core-plus, value-add (major redevelopment) and opportunistic (highest risk); senior debt and core are bond-like, the others equity-like. Infrastructure (transportation, utilities, ICT, social) consists of long-lived essential assets with high barriers and often inflation-linked cash flows; brownfield (existing, especially fully operational secondary-stage) is less risky than greenfield (to be built), demand-based projects are riskiest, infrastructure equity has low correlation with public equities, and infrastructure debt is safer and less cyclical.`
},
quiz:[
{q:"Which real estate strategy is most bond-like?",o:["Core","Value-add","Opportunistic"],a:0,e:"Core: stable, fully leased, high-quality properties, which along with senior debt have bond-like characteristics."},
{q:"An investment in a fully operational airport with established cash flows is best classified as:",o:["greenfield","secondary-stage brownfield","opportunistic real estate"],a:1,e:"Existing, fully operational infrastructure with stable cash flows = secondary-stage brownfield."},
{q:"Compared with direct real estate ownership, REITs most likely offer:",o:["greater operational control","greater liquidity","greater concentration risk"],a:1,e:"REITs trade on exchanges, offering liquidity and diversification, but less control."}]
});

/* ===================== READING 84 ===================== */
add({n:84,topic:"alt",title:"Natural Resources",
los:["84.a Explain features of raw land, timberland, and farmland and their investment characteristics.","84.b Describe features of commodities and their investment characteristics.","84.c Analyze sources of risk, return, and diversification among natural resource investments."],
s:{
eli5:`<p>Natural resources are things that come from the earth: land, forests, farms, oil, metals, crops.</p>
<p>A <strong>forest</strong> is like a savings account that grows by itself: trees get bigger every year whether you cut them or not. If wood prices are low, just wait; the trees keep growing. A <strong>farm</strong> is more like a shop that has to sell its crop every season, so weather and harvest matter a lot.</p>
<p><strong>Commodities</strong> (oil, gold, wheat) are usually bought through contracts for future delivery, because storing barrels of oil in your garage isn't practical. When those contracts are cheaper than today's price, rolling them over earns you a little bonus; when they're pricier, it costs you a little each time. And when prices across the economy rise (inflation), commodity prices often rise too, which makes them a useful shield.</p>`,
core:`<p><strong>What problem is this solving?</strong> Natural resources give investors exposure to real economic inputs: inflation protection, diversification from financial assets, and returns tied to physical scarcity and production rather than corporate profits.</p>
<ul><li><strong>Raw land:</strong> no income; value comes from future use (development, rezoning) — a real option.</li>
<li><strong>Timberland:</strong> returns from biological growth, timber prices and land value. Its special feature: <em>harvest flexibility</em>. If prices are low, delay cutting; the trees keep growing (a natural storage option).</li>
<li><strong>Farmland:</strong> returns from crop sales, crop prices and land value; less flexible (crops must be harvested), weather-dependent.</li>
<li><strong>Commodities</strong> are mostly accessed through derivatives (futures), so returns come from three sources: <em>spot price change</em>, <em>roll yield</em> (from replacing expiring contracts) and <em>collateral yield</em> (interest on the margin cash).</li>
<li><strong>Futures pricing logic:</strong> holding the physical good costs financing + storage but provides a convenience yield (benefit of having it on hand). F = spot + net cost of carry. High convenience yield → backwardation (F &lt; S) → positive roll yield for longs; low convenience yield → contango (F &gt; S) → negative roll yield.</li></ul>`,
formal:`<h4>Land-based investments</h4>
<table><tr><th></th><th>Raw land</th><th>Timberland</th><th>Farmland</th></tr>
<tr><td>Income</td><td>None</td><td>Timber sales</td><td>Crop/livestock sales; lease income</td></tr>
<tr><td>Return drivers</td><td>Land price appreciation (development option)</td><td>Biological growth, timber prices, land prices</td><td>Crop prices, quantity and quality of harvest, land prices</td></tr>
<tr><td>Flexibility</td><td>Timing of development</td><td>High: harvest can be delayed (storage on the stump)</td><td>Low: crops must be harvested</td></tr>
<tr><td>Risks</td><td>Illiquidity, no cash flow</td><td>Weather, fire, pests, illiquidity</td><td>Weather, disease, natural disasters, illiquidity</td></tr></table>
<p>Also can be accessed via public companies, REITs, and funds. Both timberland and farmland provide inflation hedging and ESG-related considerations (sustainability, carbon).</p>
<h4>Commodities</h4>
<ul><li><strong>Sectors:</strong> energy, industrial metals, precious metals, agriculture (grains, softs), livestock.</li>
<li><strong>Exposure:</strong> most commonly derivatives (futures, forwards, swaps); also commodity ETFs, managed futures funds (CTAs), specialized sector funds, and equities of producers (mixed exposure).</li>
<li><strong>Futures price</strong> = spot price + net cost of carry, where net carry = financing (risk-free rate) + storage − convenience yield.</li>
<li><strong>Contango:</strong> futures &gt; spot (low convenience yield) → negative roll yield for long-only investors. <strong>Backwardation:</strong> futures &lt; spot (high convenience yield) → positive roll yield.</li>
<li><strong>Return of a fully collateralized long futures position</strong> = spot (price) return + roll yield + collateral (risk-free) return.</li></ul>
<h4>Risk, return, diversification</h4>
<ul><li>Commodities: high volatility, low correlation with stocks and bonds, positive correlation with inflation → diversification and inflation hedge; no cash flows (returns rely on price changes and carry).</li>
<li>Timberland/farmland: stable, inflation-linked, low correlation; illiquidity and appraisal smoothing.</li>
<li>Commodity prices are driven by supply and demand shocks, the business cycle, weather, geopolitics and the dollar.</li></ul>`,
math:`<div class="f"><span class="lbl">Futures pricing (cost of carry)</span>Futures price ≈ Spot × (1 + r<sub>f</sub> + storage − convenience yield)<sup>T</sup> &nbsp;(net cost of carry = financing + storage − convenience)</div>
<div class="vars"><div><code>r<sub>f</sub></code><span>Financing cost of buying the commodity now</span></div><div><code>Storage</code><span>Warehousing, insurance, spoilage</span></div><div><code>Convenience yield</code><span>Benefit of physically holding the commodity (avoid shortages, keep production running)</span></div></div>
<p><strong>Why it works:</strong> buying now and storing must cost the same as agreeing to buy later. If holding the good is costly, the future price must be higher; if holding it is valuable (scarcity), the future price can be lower.</p>
<div class="f"><span class="lbl">Total return on a collateralized futures position</span>Total return = spot return + roll return + collateral return</div>
<div class="dir"><div>Convenience yield <span class="up">↑</span> (shortage) → backwardation → roll yield <span class="up">positive</span></div><div>Storage/interest <span class="up">↑</span> (glut) → contango → roll yield <span class="dn">negative</span></div><div>Timber prices <span class="dn">↓</span> → delay harvest; trees keep growing (value preserved)</div></div>
<div class="calc" data-calc="carry"></div>`,
example:`<div class="q">(a) Crude oil spot is $80; risk-free rate 4%, storage 2%, convenience yield 9% (all annual). Estimate the 1-year futures price and identify the curve shape. (b) A commodity index investor earns a +5% spot return, +3% roll yield and 4% on Treasury collateral. Total return? (c) In a glut, the curve flips to contango with roll yield −6% and spot is flat. Total return? (d) Timber prices fall 20% this year. What can a timberland owner do that a farmland owner cannot?</div>
<ol class="steps"><li><strong>Net carry</strong> = 4% + 2% − 9% = −3% → F ≈ 80 × 0.97 = <strong>$77.60</strong>. F &lt; S → <strong>backwardation</strong>.</li>
<li><strong>Total</strong> = 5% + 3% + 4% = <strong>12%</strong>.</li>
<li><strong>Contango case:</strong> 0% − 6% + 4% = <strong>−2%</strong>: the investor loses money even though the price didn't fall.</li>
<li><strong>Timberland:</strong> delay the harvest; trees keep growing and can be sold later at better prices. Crops can't be "stored" in the field.</li></ol>
<p class="ans">Answers: $77.60, backwardation · 12% · −2% · defer harvest</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Contango helps long investors. <b>Fix:</b> contango → negative roll yield for longs; backwardation → positive.</li>
<li><b>Trap:</b> Forgetting collateral return. <b>Fix:</b> fully collateralized futures earn interest on the collateral.</li>
<li><b>Trap:</b> Treating commodities like income-producing assets. <b>Fix:</b> they generate no cash flows.</li>
<li><b>Trap:</b> Mixing up the convenience yield's direction. <b>Fix:</b> it <em>reduces</em> the futures price.</li>
<li><b>Trap:</b> Saying farmland has the same flexibility as timberland. <b>Fix:</b> only timber can be "stored on the stump".</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> return drivers of timberland vs farmland; ways to get commodity exposure; contango vs backwardation and roll yield; futures price via carry; diversification/inflation-hedge role.</li>
<li><strong>Shortcut:</strong> "high convenience yield" ⇒ backwardation ⇒ good for longs.</li>
<li><strong>Pattern:</strong> "most common way to get commodity exposure" ⇒ derivatives (futures).</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Trees are a savings account</b>Timberland grows while you wait.</div>
<div class="anchor"><b>Spot + Roll + Collateral</b>The three sources of commodity futures return.</div>
<div class="anchor"><b>Backwardation = Bonus</b>Longs earn roll yield; Contango = Cost.</div>
<div class="anchor"><b>Carry = cost − convenience</b>Financing + storage − convenience yield.</div></div>`,
summary:`Natural resources include raw land (no income; value from future use), timberland (returns from biological growth, timber prices and land values, with the flexibility to delay harvest) and farmland (returns from crop sales, crop prices, harvest quality/quantity and land values); all are illiquid and exposed to weather, pests and disasters but offer inflation hedging and low correlation. Commodities (energy, metals, agriculture, livestock) are mostly accessed through futures, also via ETFs, managed futures and sector funds. Futures price = spot + net cost of carry (financing + storage − convenience yield): high convenience yield gives backwardation and positive roll yield for long investors, low convenience yield gives contango and negative roll yield. A collateralized futures position earns spot return + roll yield + collateral return. Commodities are volatile, produce no cash flows, have low correlation with traditional assets and hedge inflation.`
},
quiz:[
{q:"When a commodity's futures prices are below the spot price, the market is in:",o:["contango, and long investors earn negative roll yield","backwardation, and long investors earn positive roll yield","backwardation, and long investors earn negative roll yield"],a:1,e:"F < S = backwardation; rolling into cheaper contracts that converge up to spot adds return."},
{q:"A key advantage of timberland over farmland is that timberland:",o:["generates no income","allows harvest to be deferred when prices are low","has no weather risk"],a:1,e:"Trees continue growing if not cut, so the owner can wait for better prices."},
{q:"An increase in a commodity's convenience yield will most likely:",o:["raise the futures price relative to spot","lower the futures price relative to spot","have no effect on futures prices"],a:1,e:"Convenience yield reduces net cost of carry, pushing futures below spot."}]
});

add({n:85,topic:"alt",title:"Hedge Funds",
los:["85.a Explain investment features of hedge funds and contrast them with other asset classes.","85.b Describe investment forms and vehicles used in hedge fund investments.","85.c Analyze sources of risk, return, and diversification among hedge fund investments."],
s:{
eli5:`<p>A normal fund buys stocks and hopes they go up. A <strong>hedge fund</strong> is like a free-roaming chef allowed to use any ingredient: it can bet on prices going up <em>or</em> down (short selling), borrow money to make bets bigger (leverage), and use complex contracts (derivatives). The goal is to make money whether markets rise or fall.</p>
<p>The catch: the chef keeps the recipes secret, charges a lot (often a yearly fee plus a fifth of the profits), only cooks for wealthy diners, and may not let you leave the table for a while (lockups). And the "average hedge fund" in published lists looks better than reality, because the chefs who burned the kitchen down quietly stopped reporting.</p>`,
core:`<p><strong>What problem is this solving?</strong> Investors seek returns that don't depend on the market going up: absolute returns, skill-based alpha, and diversification. Hedge funds get the freedom (shorting, leverage, derivatives, any asset) to pursue that, in exchange for less regulation, transparency and liquidity, and higher fees.</p>
<ul><li><strong>Return = market beta + strategy beta + alpha.</strong> Much of what looks like "hedge fund skill" is actually exposure to market moves or to systematic strategy risk premia (e.g., merger spread, carry, volatility selling) that could be bought more cheaply. True alpha is the residual.</li>
<li><strong>Leverage</strong> magnifies strategy beta and alpha, and losses, and can force selling in crises.</li>
<li><strong>Strategy families:</strong> equity hedge (long/short stocks), event-driven (corporate events), relative value (pricing anomalies between related securities), opportunistic (macro, managed futures). Each has distinct risks: market-neutral funds are exposed to model/crowding risk; merger arbitrage to deal-failure risk; relative value to liquidity and leverage blow-ups.</li>
<li><strong>Data biases</strong> make databases look better: survivorship bias (dead funds drop out), backfill bias (funds join after good runs and add past returns), selection bias (inconsistent categorization).</li>
<li><strong>Vehicles:</strong> commingled funds (often master-feeder for tax efficiency), separately managed accounts (transparency, control, customization), funds of funds (diversification and access, but double fees).</li></ul>`,
formal:`<h4>Features vs other investments</h4>
<p>Compared with mutual funds/ETFs: higher fees (management + incentive), lower transparency, lower regulatory burden, lower liquidity (lockups, notice periods, gates, redemption fees), accredited investors only; flexible mandates using leverage, short positions and derivatives.</p>
<h4>Strategies</h4>
<table><tr><th>Family</th><th>Examples</th><th>Key exposure</th></tr>
<tr><td>Equity hedge</td><td>Market neutral, fundamental growth, fundamental value, fundamental long/short, short bias</td><td>Stock selection; net market exposure varies (short bias = net short)</td></tr>
<tr><td>Event-driven</td><td>Merger arbitrage, distressed/restructuring, activist, special situations</td><td>Deal completion, restructuring outcomes, corporate actions</td></tr>
<tr><td>Relative value</td><td>Fixed income arbitrage, convertible arbitrage, volatility arbitrage</td><td>Mispricing between related securities; leverage and liquidity risk</td></tr>
<tr><td>Opportunistic</td><td>Global macro, managed futures (CTAs, trend following)</td><td>Macro trends in rates, FX, commodities, indices</td></tr>
<tr><td>Multi-manager</td><td>Multi-strategy, funds of funds</td><td>Diversified across strategies</td></tr></table>
<h4>Investment forms and vehicles</h4>
<ul><li><strong>Commingled fund:</strong> investors pool assets; often a <strong>master-feeder</strong> structure (onshore and offshore feeder funds invest in a master fund that trades).</li>
<li><strong>Separately managed account (SMA):</strong> investor owns the assets in their own account; more transparency, control and customization; higher minimums and operational burden.</li>
<li><strong>Fund of funds (FoF):</strong> invests in multiple hedge funds; advantages: diversification across strategies, manager selection expertise, access to closed funds, due diligence; disadvantage: extra layer of fees.</li>
<li>Liquidity terms: lockup period, notice period, redemption frequency, redemption fees, gates.</li></ul>
<h4>Risk, return and diversification</h4>
<ul><li>Return decomposition: market beta, strategy beta, alpha; leverage magnifies strategy beta and alpha.</li>
<li>Biases: <strong>backfill</strong> and <strong>survivorship</strong> overstate performance; <strong>selection bias</strong> causes inconsistent index categorization.</li>
<li>Risks: leverage, illiquidity, counterparty, operational, model, key-person, style drift; non-normal returns (negative skew, fat tails).</li>
<li>With proper due diligence, hedge funds can diversify a traditional portfolio; correlations with equities rise in crises.</li></ul>`,
math:`<div class="f"><span class="lbl">Return decomposition</span>R<sub>HF</sub> = market beta × market return + strategy beta × strategy factor + alpha</div>
<p><strong>Why it matters:</strong> before paying 2-and-20 for alpha, check how much return could be replicated with cheap market and factor exposures.</p>
<div class="f"><span class="lbl">Fee layering in a fund of funds</span>Investor net = gross − underlying fund fees − FoF fees</div>
<div class="f"><span class="lbl">Leverage magnification</span>Levered return ≈ unlevered return + (borrowed/equity) × (unlevered return − borrowing cost)</div>
<div class="dir"><div>Survivorship + backfill bias → reported index returns <span class="up">overstated</span>, risk <span class="dn">understated</span></div><div>Leverage <span class="up">↑</span> → return and drawdown risk <span class="up">↑</span></div><div>Extra FoF layer → net return <span class="dn">↓</span>, diversification <span class="up">↑</span></div></div>
<div class="calc" data-calc="fee"></div>`,
example:`<div class="q">An investor puts $100 in a fund of funds. The FoF charges 1% management (on year-end value) and 10% incentive (on gains after its management fee). It invests in one hedge fund charging 2% management and 20% incentive (same conventions, no hurdles). The hedge fund earns 20% gross. (a) What does the investor earn? (b) What would a direct investor in the hedge fund earn? (c) Classify: (i) buy target, short acquirer in an announced stock merger; (ii) bets on rate and currency moves based on economic views; (iii) long undervalued and short overvalued stocks with near-zero beta.</div>
<ol class="steps"><li><strong>Hedge fund level:</strong> 120 − 2% × 120 = 117.60; incentive 20% × 17.60 = 3.52 → <strong>114.08</strong>.</li>
<li><strong>FoF level:</strong> management 1% × 114.08 = 1.14 → 112.94; incentive 10% × 12.94 = 1.29 → <strong>111.65</strong>. Investor return ≈ <strong>11.65%</strong>.</li>
<li><strong>Direct investor:</strong> <strong>14.08%</strong>. The FoF layer costs ~2.4 points, the price of diversification and manager selection.</li>
<li><strong>Classify:</strong> (i) event-driven, merger arbitrage; (ii) opportunistic, global macro; (iii) equity hedge, market neutral.</li></ol>
<p class="ans">Answers: ≈11.65% · 14.08% · merger arbitrage, global macro, equity market neutral</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Calling all hedge fund return "alpha". <b>Fix:</b> separate market beta and strategy beta first.</li>
<li><b>Trap:</b> Confusing survivorship and backfill bias. <b>Fix:</b> survivorship = failed funds removed; backfill = good past returns added when a fund joins.</li>
<li><b>Trap:</b> Thinking SMAs and commingled funds have the same transparency. <b>Fix:</b> SMAs give full transparency and control.</li>
<li><b>Trap:</b> Placing merger arbitrage in relative value. <b>Fix:</b> it's event-driven.</li>
<li><b>Trap:</b> Assuming hedge funds always diversify in crises. <b>Fix:</b> correlations and liquidity often worsen exactly then.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> contrast hedge funds with mutual funds; classify a strategy; master-feeder, SMA, FoF pros/cons; return decomposition; biases in hedge fund indexes; fee calculations including FoF layers.</li>
<li><strong>Strategy keyword map:</strong> "merger/distressed/activist" → event-driven; "convertible/fixed income arbitrage" → relative value; "macro/managed futures/trend" → opportunistic; "long/short stocks" → equity hedge.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Free-roaming chef</b>Shorts, leverage, derivatives, any market.</div>
<div class="anchor"><b>β + β + α</b>Market beta, strategy beta, and only then alpha.</div>
<div class="anchor"><b>Graveyard missing from the brochure</b>Survivorship and backfill bias flatter returns.</div>
<div class="anchor"><b>Fees on fees</b>Fund of funds = diversification + double charge.</div></div>`,
summary:`Hedge funds use leverage, short positions and derivatives with flexible mandates, and compared with mutual funds and ETFs have higher fees, less transparency, lighter regulation and lower liquidity (lockups, notice periods, gates), being open only to accredited investors. Strategies include equity hedge (market neutral, growth, value, long/short, short bias), event-driven (merger arbitrage, distressed/restructuring, activist, special situations), relative value (pricing anomalies) and opportunistic (macro, managed futures). Vehicles are commingled funds (often master-feeder), separately managed accounts (transparency and control) and funds of funds (diversification, expertise and access, but an extra fee layer). Returns decompose into market beta, strategy beta and alpha, often magnified by leverage; reported performance is overstated by backfill and survivorship bias, with selection bias in categorization. With due diligence, hedge funds can diversify traditional portfolios, though crisis correlations rise.`
},
quiz:[
{q:"Which hedge fund vehicle offers investors the greatest transparency and control over holdings?",o:["Master-feeder fund","Separately managed account","Fund of funds"],a:1,e:"In an SMA, the investor owns the assets in their own account and sees every position."},
{q:"Hedge fund index returns are most likely overstated because of:",o:["survivorship and backfill bias","look-ahead bias and fee waivers","selection bias only"],a:0,e:"Failed funds disappear and new funds add their good histories, both inflating reported averages."},
{q:"A strategy that buys the shares of a takeover target and shorts the acquirer is classified as:",o:["relative value","event-driven","opportunistic"],a:1,e:"Merger arbitrage is an event-driven strategy."}]
});

add({n:86,topic:"alt",title:"Introduction to Digital Assets",
los:["86.a Describe financial applications of distributed ledger technology.","86.b Explain investment features of digital assets and contrast them with other asset classes.","86.c Describe investment forms and vehicles used in digital asset investments.","86.d Analyze sources of risk, return, and diversification among digital asset investments."],
s:{
eli5:`<p>Imagine a class notebook where every student has an identical copy. Whenever someone trades a sticker, everyone writes it down in their own copy, and the class agrees on what's true by majority. No teacher is needed to keep score, and nobody can secretly erase a page because everyone else's copy would disagree. That's a <strong>distributed ledger</strong>; a <strong>blockchain</strong> is one where entries are added page by page (blocks), each linked to the last.</p>
<p><strong>Digital assets</strong> are things that live on these notebooks: cryptocurrencies like bitcoin, "stablecoins" that try to always be worth $1, digital collectibles, and "tokens" that represent real things like a share of a building.</p>
<p>Unlike a company share, most cryptocurrencies don't produce profits or pay dividends. Their price depends on how many people want them and how scarce they are, so prices swing wildly.</p>`,
core:`<p><strong>What problem is this solving?</strong> Transferring and recording ownership traditionally requires trusted intermediaries (banks, custodians, exchanges). Distributed ledger technology (DLT) lets strangers agree on a shared record without a central authority, potentially cutting costs, speeding settlement and enabling new assets. Investors need to understand what they're buying, how to hold it, and its unusual risks.</p>
<ul><li><strong>Consensus</strong> replaces the central bookkeeper. <em>Proof of work:</em> miners spend computing power to validate blocks (secure but energy-intensive). <em>Proof of stake:</em> validators pledge collateral (stake) that can be lost if they cheat (more energy-efficient).</li>
<li><strong>Permissionless</strong> networks are open to anyone with full visibility; <strong>permissioned</strong> networks restrict who can view/validate (common for institutions).</li>
<li><strong>Why digital assets are different:</strong> most have no underlying cash flows, so no fundamental value from discounting; recorded on decentralized ledgers; positioned as alternatives to fiat money; and regulation is still developing.</li>
<li><strong>Return drivers:</strong> demand/adoption, limited supply (e.g., capped issuance), sentiment, liquidity. History: very high returns and very high volatility, low correlation with traditional assets (though correlations can rise in stress).</li>
<li><strong>Access trade-off:</strong> direct ownership (wallets, keys: theft/scam risk, no protections) vs indirect (trusts, futures, ETPs, crypto-related stocks, hedge funds: easier, regulated wrappers, but tracking issues and fees).</li></ul>`,
formal:`<h4>DLT and blockchain</h4>
<ul><li><strong>Digital assets:</strong> electronically created, stored and transferred: cryptocurrencies, tokens, digital collectibles (NFTs).</li>
<li><strong>Blockchain:</strong> digital ledger recording transactions sequentially in blocks, each cryptographically linked to the previous → tamper-resistant.</li>
<li><strong>Consensus mechanisms:</strong> proof of work (PoW) and proof of stake (PoS).</li>
<li><strong>Permissionless vs permissioned</strong> networks.</li>
<li><strong>Financial applications:</strong> cryptocurrencies; tokenization of real assets (real estate, art, securities) to track ownership; smart contracts (self-executing code); post-trade clearing and settlement; compliance/record-keeping; decentralized finance (DeFi).</li></ul>
<h4>Types of digital assets</h4>
<table><tr><th>Type</th><th>Description</th></tr>
<tr><td>Cryptocurrency</td><td>Privately issued digital currency, no central bank backing</td></tr>
<tr><td>Stablecoin</td><td>Linked to another asset (e.g., USD) to keep a stable value</td></tr>
<tr><td>Meme coin</td><td>Launched for entertainment/community; highly speculative</td></tr>
<tr><td>CBDC</td><td>Central bank digital currency: digital version of banknotes/coins issued by a central bank</td></tr>
<tr><td>Tokens</td><td>Utility tokens (access to a platform), security tokens (ownership/claims), asset-backed tokens (digital ownership of nondigital assets), NFTs</td></tr></table>
<h4>Contrast with other asset classes</h4>
<ul><li>No backing by assets or cash flows (most) → no expected earnings → no fundamental value.</li>
<li>Decentralized ledgers vs private ledgers kept by central intermediaries.</li>
<li>Alternative to fiat currency, mainly for online transactions, vs priced in fiat.</li>
<li>Regulation still developing vs established rules.</li></ul>
<h4>Investment forms and vehicles</h4>
<ul><li><strong>Exchanges:</strong> centralized (trade on private servers, custodial) and decentralized (DEXs on distributed networks); both raise investor-protection concerns.</li>
<li><strong>Direct investment:</strong> transaction recorded on the blockchain; risks include scam ICOs, pump-and-dump, manipulation, theft, wallet credential attacks.</li>
<li><strong>Indirect:</strong> coin trusts, futures, exchange-traded products (ETFs/ETNs), stocks of crypto-related firms, hedge funds.</li>
<li><strong>Asset-backed tokens</strong> and <strong>DeFi</strong> products and services.</li></ul>
<h4>Risk, return, diversification</h4>
<p>Values driven by appreciation and limited supply; historically high returns and high volatility; low correlation with traditional assets → potential diversification. Risks: extreme volatility, regulatory, custody/cyber, fraud, liquidity, technological, concentration of holdings.</p>`,
math:`<p>There are no required formulas, but the portfolio-math intuition from Reading 87 explains why a small allocation can make sense.</p>
<div class="f"><span class="lbl">Adding a volatile, low-correlation asset</span>σ<sub>p</sub>² = w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂</div>
<p><strong>Why a small slice can be tolerable:</strong> the very high volatility enters as w², so a 5% weight contributes only 0.25% × σ². Low correlation keeps the cross term small.</p>
<div class="f"><span class="lbl">Valuation intuition</span>No cash flows → no DCF value; price = supply/demand equilibrium (scarcity × adoption × sentiment)</div>
<div class="dir"><div>Adoption/demand <span class="up">↑</span> with fixed supply → price <span class="up">↑</span></div><div>Correlation with equities <span class="up">↑</span> (as in stress periods) → diversification benefit <span class="dn">↓</span></div><div>PoW → energy use <span class="up">↑</span>; PoS → collateral at risk instead</div></div>
<div class="calc" data-calc="port"></div>`,
example:`<div class="q">(a) A balanced portfolio has σ = 10%. An investor adds a 5% allocation to a cryptocurrency with σ = 70% and correlation 0.2 with the balanced portfolio. Estimate the new portfolio σ. (b) Classify: (i) a token giving fractional ownership of an office building; (ii) a digital euro issued by the ECB; (iii) a coin pegged 1:1 to the US dollar; (iv) validators lock up coins to verify transactions. (c) An investor wants crypto exposure but is worried about losing private keys. Suggest vehicles.</div>
<ol class="steps"><li><strong>Variance</strong> = 0.95² × 0.10² + 0.05² × 0.70² + 2 × 0.95 × 0.05 × 0.2 × 0.10 × 0.70 = 0.009025 + 0.001225 + 0.00133 = 0.01158 → σ ≈ <strong>10.76%</strong>. A 5% slice of a 70%-vol asset adds less than 1 point of risk.</li>
<li><strong>(i)</strong> asset-backed (security) token / tokenization; <strong>(ii)</strong> CBDC; <strong>(iii)</strong> stablecoin; <strong>(iv)</strong> proof of stake.</li>
<li><strong>Indirect vehicles:</strong> exchange-traded products, futures, coin trusts, crypto-related stocks or a hedge fund: no self-custody of keys, though fees and tracking differences apply.</li></ol>
<p class="ans">Answers: ≈10.76% · asset-backed token, CBDC, stablecoin, PoS · ETPs/futures/trusts/stocks</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Calling a CBDC a cryptocurrency. <b>Fix:</b> CBDCs are issued and backed by a central bank; cryptocurrencies are private with no central bank backing.</li>
<li><b>Trap:</b> PoW vs PoS mix-up. <b>Fix:</b> work = computing power (miners); stake = pledged collateral (validators).</li>
<li><b>Trap:</b> Assuming digital assets have fundamental value like stocks. <b>Fix:</b> most have no cash flows.</li>
<li><b>Trap:</b> Believing decentralized exchanges remove investor-protection concerns. <b>Fix:</b> both centralized and decentralized exchanges lack strong oversight.</li>
<li><b>Trap:</b> Confusing permissioned and permissionless. <b>Fix:</b> permissionless = open to all; permissioned = restricted.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> define blockchain/DLT; PoW vs PoS; permissioned vs permissionless; types of digital assets; how they differ from traditional assets; direct vs indirect investment; risks and diversification potential.</li>
<li>Mostly definitional: match the keyword to the term and move on.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Class notebook</b>Everyone holds the same copy; majority agrees what's true.</div>
<div class="anchor"><b>Work burns power, Stake risks collateral</b>PoW vs PoS.</div>
<div class="anchor"><b>No cash flow, no DCF</b>Value = scarcity × demand × mood.</div>
<div class="anchor"><b>Keys or wrappers</b>Direct (your keys, your risk) vs indirect (ETPs, futures, trusts).</div></div>`,
summary:`Digital assets (cryptocurrencies, tokens, digital collectibles) are created, stored and transferred electronically on distributed ledgers; a blockchain records transactions sequentially in linked blocks, with consensus via proof of work (miners' computing power) or proof of stake (validators' pledged collateral), on permissionless (open) or permissioned (restricted) networks. Types include cryptocurrencies (private, no central bank backing), stablecoins (linked to another asset), meme coins, CBDCs (central bank issued) and tokens; tokenization records ownership of real assets, and DeFi extends this. Unlike traditional assets, most digital assets lack backing cash flows and fundamental value, use decentralized ledgers, act as alternatives to fiat, and face developing regulation. Investors trade on centralized or decentralized exchanges, directly (with theft, scam and manipulation risks) or indirectly via coin trusts, futures, ETPs, related stocks and hedge funds. Returns have been high and highly volatile, driven by appreciation and limited supply, with low correlations offering potential diversification.`
},
quiz:[
{q:"In a proof-of-stake blockchain, transactions are validated by participants who:",o:["solve computationally intensive puzzles","pledge collateral that can be forfeited","are appointed by a central bank"],a:1,e:"Validators stake coins as collateral; PoW uses miners' computing power."},
{q:"A digital version of a country's banknotes issued by its central bank is a:",o:["stablecoin","CBDC","meme coin"],a:1,e:"Central bank digital currency."},
{q:"Compared with traditional financial assets, most digital assets:",o:["have well-established regulatory frameworks","are not backed by underlying cash flows","are recorded on private ledgers of central intermediaries"],a:1,e:"Without expected earnings or cash flows, they lack fundamental value in the DCF sense."}]
});

/* ===================== READING 87 ===================== */
add({n:87,topic:"pm",title:"Portfolio Risk and Return: Part I",
