add({n:100,topic:"eth",title:"Guidance for Standard VI: Conflicts of Interest",
los:["100.a Demonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity.","100.b Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct.","100.c Identify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards."],
s:{
eli5:`<p>Conflicts of interest are unavoidable in finance: you might own the stock you recommend, or get paid for sending a client to a friend. The rule isn't "never have conflicts"; it's:</p>
<ol><li><strong>Tell people about them</strong> clearly, before they make decisions.</li>
<li><strong>Clients go first in line:</strong> their trades come before your firm's, and your firm's before yours. Don't jump the queue.</li>
<li><strong>If you get or pay a "thank you" for a referral</strong>, tell your employer and the client what it is and how much, before they agree to anything.</li></ol>`,
core:`<p><strong>What problem is this solving?</strong> Conflicts can bias advice and actions without clients knowing. Full disclosure lets clients judge objectivity; priority rules prevent advisers profiting at clients' expense; referral-fee disclosure reveals hidden incentives.</p>
<ul><li><strong>VI(A):</strong> full and fair disclosure of all matters that could reasonably be expected to impair independence and objectivity or interfere with duties to clients, prospective clients and employer. Disclosure must be prominent, in plain language, and effective (not buried). Common conflicts: stock ownership in covered companies, investment banking relationships, board positions, compensation structures (e.g., bonus tied to fund sales), market making.</li>
<li><strong>VI(B):</strong> investment transactions for clients and employers have priority over transactions in which a member is the beneficial owner. Not a ban on personal trading, but no front-running, and no trading on client trade knowledge. Family accounts that are fee-paying clients are treated like any other client (not disadvantaged). Procedures: blackout/restricted periods, preclearance, reporting of holdings and trades, limited IPO/private-placement participation.</li>
<li><strong>VI(C):</strong> disclose to employer, clients and prospective clients any compensation, consideration or benefit received from or paid to others for the recommendation of products or services. Disclose before entering a formal agreement; include nature and estimated value.</li></ul>`,
formal:`<h4>VI(A) Disclosure of Conflicts</h4>
<p>Members and candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients and employer. Disclosures must be prominent, delivered in plain language, and communicate the relevant information effectively.</p>
<ul><li>Conflicts with clients: ownership of shares, directorships, investment banking ties, relationships, compensation incentives.</li>
<li>Conflicts with employer: outside activities, directorships, compensation arrangements.</li>
<li>Cross-departmental conflicts: sell-side analysts and investment banking; buy-side analysts pressured by portfolio managers.</li>
<li>Stock ownership: disclose ownership of recommended securities. Directorships: disclose and manage (also fiduciary duties to the company).</li>
<li>Disclosure doesn't cure everything: some conflicts should be avoided entirely.</li>
<li>Procedures: policies on disclosure, restrictions, compensation structures.</li></ul>
<h4>VI(B) Priority of Transactions</h4>
<p>Investment transactions for clients and employers must have priority over investment transactions in which a member or candidate is the beneficial owner.</p>
<ul><li>Beneficial owner: has direct or indirect pecuniary interest (including family accounts).</li>
<li>No front-running clients; no trading on knowledge of pending client trades.</li>
<li>Avoid disadvantaging clients when employees participate in IPOs or private placements (limited/pre-approval).</li>
<li>Family accounts that are client accounts: treated like other clients; neither favored nor disadvantaged.</li>
<li>Procedures: blackout/restricted periods, preclearance, duplicate confirmations, reporting of holdings, limit equity IPO participation.</li></ul>
<h4>VI(C) Referral Fees</h4>
<p>Members and candidates must disclose to their employer, clients and prospective clients, as appropriate, any compensation, consideration or benefit received from or paid to others for the recommendation of products or services.</p>
<ul><li>Disclose before entering any formal agreement; describe nature and estimated dollar value.</li>
<li>Applies to fees paid or received, cash or noncash (e.g., research, services, gifts).</li>
<li>Procedures: firm policies, regular reporting of referral arrangements.</li></ul>`,
math:`<div class="f"><span class="lbl">VI(A)</span>Could it reasonably impair objectivity? → DISCLOSE (prominent, plain language) to clients, prospects, employer</div>
<div class="f"><span class="lbl">VI(B) queue</span>Clients (incl. family-member clients) → Employer → Member's own accounts</div>
<div class="f"><span class="lbl">VI(C)</span>Referral benefit (paid or received, cash or not) → disclose nature + estimated value, BEFORE agreement, to employer and clients/prospects</div>
<div class="dir"><div>Buried disclosure (fine print) → not "full and fair"</div><div>Blackout period around client trades → reduces front-running risk</div></div>`,
example:`<div class="q">Violation or not: (a) An analyst issues a buy on a company where she sits on the board; the report doesn't mention it. (b) A manager buys a stock for his own account the morning before placing a large client buy order. (c) A manager's father is a fee-paying client; she gives his account the same allocation as other clients in a hot IPO. (d) A manager excludes her mother's fee-paying account from an attractive trade to avoid "appearances". (e) An adviser refers clients to an accountant who gives her free tax preparation; clients aren't told. (f) A fund discloses the analyst's stock ownership in 6-point type on page 40 of a report.</div>
<ol class="steps"><li><strong>(a)</strong> Violation VI(A): directorship must be disclosed.</li>
<li><strong>(b)</strong> Violation VI(B): front-running; clients first.</li>
<li><strong>(c)</strong> No violation: family client treated like other clients.</li>
<li><strong>(d)</strong> Violation (III(B)/VI(B) guidance): family members who are clients must not be disadvantaged.</li>
<li><strong>(e)</strong> Violation VI(C): noncash referral benefits must be disclosed (nature and value) before agreement.</li>
<li><strong>(f)</strong> Likely violation VI(A): disclosure must be prominent and plain.</li></ol>
<p class="ans">Answers: V · V · OK · V · V · V</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Disclosure in fine print satisfies VI(A). <b>Fix:</b> must be prominent and plain language.</li>
<li><b>Trap:</b> Family accounts must always go last. <b>Fix:</b> if they're fee-paying clients, treat them like other clients.</li>
<li><b>Trap:</b> VI(B) bans personal trading. <b>Fix:</b> it requires client and employer priority, not a ban.</li>
<li><b>Trap:</b> Only cash referral fees need disclosure. <b>Fix:</b> any compensation, consideration or benefit, cash or noncash.</li>
<li><b>Trap:</b> Disclose referral fees after the client signs. <b>Fix:</b> before entering the agreement.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> what must be disclosed and how; front-running; family accounts; IPO participation; referral arrangements (cash and noncash).</li>
<li><strong>Heuristic:</strong> if a reasonable client would want to know about it when judging your advice, disclose it.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Sunlight is the cure</b>Disclose conflicts prominently.</div>
<div class="anchor"><b>Clients, firm, me</b>Priority of transactions.</div>
<div class="anchor"><b>"Who paid whom, how much, before"</b>Referral fee disclosure.</div>
<div class="anchor"><b>Family = client if they pay</b>Neither favored nor penalized.</div></div>`,
summary:`Standard VI manages conflicts of interest. VI(A) Disclosure of Conflicts requires full and fair disclosure, prominent and in plain language, of all matters that could reasonably be expected to impair independence and objectivity or interfere with duties to clients, prospective clients and employer, such as stock ownership, directorships, investment banking relationships and compensation incentives. VI(B) Priority of Transactions requires client and employer transactions to take priority over those in which the member is a beneficial owner: no front-running, limited IPO/private placement participation, blackout periods and preclearance; family members who are fee-paying clients are treated like any other client. VI(C) Referral Fees requires disclosing to the employer, clients and prospective clients the nature and estimated value of any compensation, consideration or benefit received or paid for recommending products or services, before any formal agreement.`
},
quiz:[
{q:"A portfolio manager's sister is a fee-paying client. When allocating shares of an oversubscribed IPO, the manager should:",o:["exclude the sister's account to avoid conflicts","treat the sister's account like any other client account","give the sister priority"],a:1,e:"Family members who are clients should be treated like other clients."},
{q:"An adviser receives free research from a broker in exchange for referring clients. Under VI(C), this:",o:["need not be disclosed because no cash changed hands","must be disclosed to employer and clients","is prohibited"],a:1,e:"Any benefit, cash or noncash, must be disclosed."},
{q:"Which best satisfies VI(A)?",o:["A conflict disclosed in small print at the end of a long report","A clear, prominent disclosure of the analyst's ownership of the recommended stock","Telling clients only if they ask"],a:1,e:"Disclosures must be prominent and in plain language."},
{q:"A manager buys a stock personally just before executing a large client order in the same stock. This violates:",o:["VI(B) Priority of Transactions","VI(C) Referral Fees","V(C) Record Retention"],a:0,e:"Front-running puts personal interest ahead of clients."}]
});

/* ===================== READING 101 ===================== */
add({n:101,topic:"eth",title:"Guidance for Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate",
los:["101.a Demonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity.","101.b Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct.","101.c Identify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards."],
s:{
eli5:`<p>Two rules about the CFA "club" itself:</p>
<ol><li><strong>Don't cheat or spoil it:</strong> no cheating on exams, no sharing what was on the exam, no lying on your application or yearly forms, no misusing a volunteer role. (Saying you disagree with CFA Institute is fine!)</li>
<li><strong>Talk about the CFA correctly:</strong> don't exaggerate what it means. Being a charterholder doesn't mean you'll beat the market. "CFA" is a label you add to a person or charterholder ("a CFA charterholder"), not a noun ("I'm a CFA"). And there's no such thing as a "Level II CFA".</li></ol>`,
core:`<p><strong>What problem is this solving?</strong> The credential's value depends on the exam's integrity and on accurate, consistent use of the designation. Standard VII protects both.</p>
<ul><li><strong>VII(A):</strong> applies to candidates and members in CFA Institute programs (exams, membership, volunteering). Violations: cheating; disclosing confidential exam information (specific questions, topics or formulas tested, or how you did on particular questions); violating exam rules (e.g., calculator policy, writing after time is called); misrepresenting information on the Professional Conduct Statement or applications; improperly using volunteer positions for personal benefit. Allowed: general comments about difficulty or your study approach; criticizing CFA Institute policies.</li>
<li><strong>VII(B):</strong> don't misrepresent or exaggerate the meaning or implications of membership, the designation or candidacy. Must be a member in good standing (dues + annual Professional Conduct Statement) to use "CFA charterholder". Candidates may say they are candidates if registered for the next exam; may state levels passed. May state facts like completing exams in consecutive years, but must not imply superior ability or performance. Use "CFA" as an adjective with capital letters; never as a noun; no partial designation ("CFA Level II").</li></ul>`,
formal:`<h4>VII(A) Conduct as Participants in CFA Institute Programs</h4>
<p>Members and candidates must not engage in any conduct that compromises the reputation or integrity of CFA Institute or the CFA designation or the integrity, validity or security of CFA Institute programs.</p>
<ul><li>Covers: giving or receiving assistance (cheating) on exams; violating exam rules/policies; providing confidential program information to candidates or the public; improperly using the designation for personal or professional gain; misrepresenting information on the PCS or in the CFA Institute Professional Development Program.</li>
<li><strong>Confidential exam information:</strong> may not disclose specific questions, topics or formulas tested or not tested. May discuss: general difficulty, broad topic areas in the public curriculum, personal study strategies.</li>
<li><strong>Expressing an opinion</strong> about CFA Institute programs or policies is permitted.</li>
<li>Volunteers: don't use confidential information or position for personal benefit.</li></ul>
<h4>VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program</h4>
<p>When referring to CFA Institute, CFA Institute membership, the CFA designation or candidacy in the CFA Program, members and candidates must not misrepresent or exaggerate the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program.</p>
<ul><li><strong>Membership:</strong> to claim membership, must pay annual dues and file the Professional Conduct Statement; otherwise lapsed (cannot use the designation until reinstated).</li>
<li><strong>Using the designation:</strong> "CFA" is always an adjective, capital letters, no periods (e.g., "John Smith, CFA", "a CFA charterholder"); never a noun ("he is a CFA" ✘); not in a logo or larger font than the name; no "Chartered Financial Analyst" as a noun either.</li>
<li><strong>Candidates:</strong> may reference participation only if enrolled/registered for the next exam; may state which levels passed ("passed Level II"); "CFA Level II" or "CFA (expected 2027)" are not allowed; no partial designation.</li>
<li><strong>Allowed factual statements:</strong> "passed all three levels on the first attempt" or "in three consecutive years" (if true); not allowed: claiming this implies superior investment ability or results.</li>
<li>Permitted to describe the CFA Program's rigor (e.g., candidates must pass three exams, demonstrate experience, commit to the Code and Standards).</li></ul>`,
math:`<div class="f"><span class="lbl">VII(A)</span>Exam: specific questions/topics/formulas → SECRET &nbsp;·&nbsp; general difficulty, study tips, criticism of CFA Institute → OK</div>
<div class="f"><span class="lbl">VII(B) grammar rule</span>"CFA" = ADJECTIVE: "a CFA charterholder" ✔ · "John Doe, CFA" ✔ · "a CFA" ✘ · "CFA Level I" ✘</div>
<div class="f"><span class="lbl">Who can say what</span>Charterholder in good standing (dues + PCS) → "CFA" &nbsp;·&nbsp; Registered for next exam → "CFA candidate" / "Level II candidate" &nbsp;·&nbsp; Anyone → facts (levels passed, first attempts) without implying superior performance</div>`,
example:`<div class="q">Violation or not: (a) A candidate posts online that "Level I had lots of questions on the Gordon growth model and a tricky one on M²." (b) After the exam, a candidate says "it was hard; I wish I'd done more practice questions." (c) A member publicly criticizes CFA Institute's fee increases. (d) A charterholder who hasn't paid dues for two years keeps "CFA" on his business card. (e) A résumé says "CFA Level II, 2026". (f) A brochure says "As CFA charterholders, our team will achieve superior returns." (g) A résumé says "Passed all three levels of the CFA Program on my first attempt." (h) A candidate who passed Level I but didn't register for Level II calls herself a "CFA candidate".</div>
<ol class="steps"><li><strong>(a)</strong> Violation VII(A): disclosing specific topics/formulas tested.</li>
<li><strong>(b)</strong> No violation: general comment on difficulty.</li>
<li><strong>(c)</strong> No violation: expressing opinions is permitted.</li>
<li><strong>(d)</strong> Violation VII(B): lapsed membership; can't use the designation until reinstated.</li>
<li><strong>(e)</strong> Violation VII(B): no partial designation; say "passed Level I" or "Level II candidate".</li>
<li><strong>(f)</strong> Violation VII(B): implies superior performance.</li>
<li><strong>(g)</strong> No violation: factual statement, no claim of superior ability.</li>
<li><strong>(h)</strong> Violation VII(B): must be registered for the next exam to claim candidacy; may say she passed Level I.</li></ol>
<p class="ans">Answers: V · OK · OK · V · V · V · OK · V</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Criticizing CFA Institute violates VII(A). <b>Fix:</b> opinions are allowed.</li>
<li><b>Trap:</b> "Passed all three levels on first try" is boasting and prohibited. <b>Fix:</b> factual statements are fine; implying superior performance isn't.</li>
<li><b>Trap:</b> Saying you're a candidate after passing a level but not registering. <b>Fix:</b> must be registered for the next exam.</li>
<li><b>Trap:</b> Using "CFA" as a noun. <b>Fix:</b> always an adjective.</li>
<li><b>Trap:</b> Thinking lapsed dues just mean a late fee. <b>Fix:</b> can't use the designation while lapsed.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> exam confidentiality; résumé/business card wording; lapsed membership; candidate status; statements implying superior performance.</li>
<li><strong>Quick check:</strong> Is it factual? Does it imply superior skill/returns? Is "CFA" an adjective? Is the person in good standing / registered?</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>What happens in the exam room stays there</b>No specific content shared.</div>
<div class="anchor"><b>CFA is an adjective</b>"CFA charterholder", never "a CFA".</div>
<div class="anchor"><b>No half-charters</b>No "CFA Level II".</div>
<div class="anchor"><b>Dues + PCS = good standing</b>Lapsed members can't use the mark.</div></div>`,
summary:`Standard VII protects CFA Institute programs and the designation. VII(A) Conduct as Participants in CFA Institute Programs prohibits conduct that compromises the reputation or integrity of CFA Institute, the designation, or the integrity, validity or security of its programs: cheating, violating exam rules, disclosing confidential exam content (specific questions, topics or formulas), misrepresenting information on the Professional Conduct Statement, or misusing volunteer roles; members may still express opinions about CFA Institute and comment generally on exam difficulty. VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program prohibits misrepresenting or exaggerating the meaning of membership, the designation or candidacy. Only members in good standing (dues paid, PCS filed) may use the designation; "CFA" must be used as an adjective; there is no partial designation; candidates must be registered for the next exam to claim candidacy; factual statements about passing exams are allowed but not claims of superior ability or performance.`
},
quiz:[
{q:"Which statement on a résumé is acceptable?",o:["Jane Smith, CFA Level II","Passed Level II of the CFA Program","Jane Smith, CFA (expected 2028)"],a:1,e:"Stating levels passed is factual; partial or anticipated designations are not allowed."},
{q:"A candidate tells friends after the exam that 'there were several questions on the CAPM and M².' This:",o:["is acceptable general commentary","violates VII(A) by disclosing exam topics","violates VII(B)"],a:1,e:"Specific topics or formulas tested are confidential."},
{q:"A charterholder who fails to pay annual dues may:",o:["continue using the designation until notified","not use the CFA designation until membership is reinstated","use the designation if she has held it for more than five years"],a:1,e:"Lapsed membership means the designation cannot be used."},
{q:"Which use of the designation is correct?",o:["He is a CFA.","He is a CFA charterholder.","He earned his CFA last year."],a:1,e:"CFA is an adjective: 'CFA charterholder', 'CFA designation'."}]
});

/* ===================== READING 102 ===================== */
add({n:102,topic:"eth",title:"Application of the Code and Standards: Level I",
los:["102.a Evaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct.","102.b Explain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct."],
s:{
eli5:`<p>This reading is practice: real-life-style stories where you decide "is this OK?" and "which rule does it touch?" It's like a driving test after learning the road rules: you have to apply them in traffic.</p>
<p>The trick is to read each story slowly and ask: Who could be hurt? Was there honesty, fairness, independence? Was something hidden? Who should have been told, and when? Then match it to the rule.</p>`,
core:`<p><strong>What problem is this solving?</strong> The exam tests application, not recitation. Cases often involve several Standards at once, plausible-sounding excuses ("it's legal here", "I disclosed it later", "everyone does it"), and answer choices that differ by one subtle condition. A systematic approach beats intuition.</p>
<ul><li><strong>Typical multi-Standard patterns:</strong> taking records when leaving (IV(A), V(C), III(E)); front-running (VI(B), III(A)); trading on a tip (II(A)); unfair allocations (III(B)); gifts from issuers (I(B)); outside bonuses (IV(B)); misusing the designation (VII(B)); hiding conflicts (VI(A)); unverified research or models (V(A)); missing risk disclosure (V(B)).</li>
<li><strong>What the CFA answer usually looks like:</strong> the most client-protective <em>reasonable</em> action: disclose, get written consent, dissociate, follow the stricter rule, treat clients fairly, keep records. Extreme actions (resigning, reporting to regulators) are rarely the first required step.</li>
<li><strong>Intent matters, outcome doesn't save you:</strong> a violation is a violation even if clients happened to make money.</li></ul>`,
formal:`<h4>A five-step method for any case</h4>
<ol><li><strong>Identify the actor's role:</strong> member/candidate? supervisor? analyst? portfolio manager? This tells you which duties apply.</li>
<li><strong>List the stakeholders and duties:</strong> clients (III), employer (IV), markets (II), profession (I, VII).</li>
<li><strong>Spot the red-flag facts:</strong> nonpublic information; gifts/benefits; personal trading; allocation decisions; departures; outside compensation; performance claims; designation usage; models/third-party research; disclosure timing ("later", "verbally", "in fine print").</li>
<li><strong>Match to the Standard</strong> (and check whether more than one applies).</li>
<li><strong>Decide:</strong> violation or not, and the corrective action/procedure (disclose, consent, dissociate, pro rata, firewall, record-keeping, etc.).</li></ol>
<h4>High-frequency "almost OK" conditions</h4>
<table><tr><th>Situation</th><th>OK if…</th><th>Violation if…</th></tr>
<tr><td>Gift from client</td><td>Disclosed to employer</td><td>Hidden; or if it compromises objectivity</td></tr>
<tr><td>Outside bonus from client</td><td>Written employer consent beforehand</td><td>Verbal or after-the-fact</td></tr>
<tr><td>Using research from others</td><td>Reasonable basis checked, attributed</td><td>Blind reliance or plagiarism</td></tr>
<tr><td>Contacting former clients</td><td>After leaving, public info/memory, no non-solicit</td><td>Before leaving, or using firm records</td></tr>
<tr><td>Premium service levels</td><td>Disclosed and available to all</td><td>Secret favoritism</td></tr>
<tr><td>Conclusions from mixed info</td><td>Public + nonmaterial nonpublic (mosaic)</td><td>Any material nonpublic input</td></tr>
<tr><td>Personal trading</td><td>After client orders; preclearance; blackout respected</td><td>Ahead of client orders</td></tr>
<tr><td>Describing CFA status</td><td>Factual, adjective use, good standing</td><td>Implies superior performance; partial designation</td></tr></table>`,
math:`<div class="f"><span class="lbl">Case-solving equation</span>Role + Stakeholders + Red flags → Standard(s) → Violation? → Corrective action</div>
<div class="f"><span class="lbl">Timing rule</span>Disclose / obtain consent BEFORE acting (conflicts, referral fees, additional compensation, process changes promptly)</div>
<div class="f"><span class="lbl">Profit doesn't excuse</span>Violation status depends on conduct, not on whether clients gained or lost</div>
<div class="dir"><div>"Later", "verbally", "fine print", "everyone does it", "legal here" → usually violation signals</div><div>"Disclosed in advance", "written consent", "pro rata", "dissociated", "documented" → usually compliance signals</div></div>`,
example:`<div class="q">Integrated case. Priya, CFA, is a portfolio manager at Alpha Advisors. (1) A company she covers flies her first-class to its resort for a "site visit" with spa days. (2) There, its CFO mentions that a large contract was just lost; this hasn't been announced. (3) Back home, she sells the stock from all client accounts and her own, her own first because her order is small. (4) Her largest client offers her a 1% bonus if returns beat the index; she accepts, planning to tell her boss at year-end. (5) She updates her marketing materials to say "As a CFA, I deliver superior returns." Identify the violations.</div>
<ol class="steps"><li><strong>(1)</strong> I(B) Independence and Objectivity: lavish issuer-paid travel; she should pay her own way and decline extras.</li>
<li><strong>(2)–(3)</strong> II(A) Material Nonpublic Information: the lost contract is material and nonpublic; she must not trade (for clients or herself) and should encourage public disclosure.</li>
<li><strong>(3)</strong> VI(B) Priority of Transactions: her trade went ahead of clients' (front-running), even apart from the MNPI issue.</li>
<li><strong>(4)</strong> IV(B) Additional Compensation Arrangements: needs written consent from employer before accepting.</li>
<li><strong>(5)</strong> VII(B): "a CFA" is incorrect usage and implies superior performance. Also I(C) misrepresentation.</li></ol>
<p class="ans">Violations: I(B), II(A), VI(B), IV(B), VII(B) (and I(C))</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Choosing "no violation" because the outcome was good. <b>Fix:</b> judge conduct, not results.</li>
<li><b>Trap:</b> Stopping at the first Standard you spot. <b>Fix:</b> cases often involve several.</li>
<li><b>Trap:</b> Picking the most extreme remedy. <b>Fix:</b> pick the required, reasonable remedy (disclose, consent, dissociate).</li>
<li><b>Trap:</b> Accepting "it's legal here" or "common practice". <b>Fix:</b> stricter-of rule; industry practice isn't a defense.</li>
<li><b>Trap:</b> Missing timing words. <b>Fix:</b> "after", "later", "verbally" usually signal a violation.</li></ul>`,
exam:`<ul><li><strong>Format:</strong> short vignettes with "Did X violate the Standards?" or "Which Standard is most likely violated?" or "What should X do?".</li>
<li><strong>Time strategy:</strong> ethics questions are worth the same as quant; don't over-deliberate. Use the red-flag scan; if stuck, choose the answer that best protects clients and market integrity while being reasonable.</li>
<li><strong>Practice volume</strong> matters more here than in any other topic; do lots of questions and read every explanation.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Role → People → Red flags → Rule → Remedy</b>The five-step case routine.</div>
<div class="anchor"><b>"Before, in writing, in plain sight"</b>How compliance looks.</div>
<div class="anchor"><b>"Later, verbally, in fine print"</b>How violations look.</div>
<div class="anchor"><b>Profit is no alibi</b>Good outcomes don't excuse bad conduct.</div></div>`,
summary:`Applying the Code and Standards means evaluating conduct systematically: identify the actor's role, the stakeholders and duties involved, and red-flag facts (nonpublic information, gifts, personal trading, allocations, departures, outside compensation, performance claims, designation use, models and third-party research, disclosure timing), then map them to the relevant Standards, often more than one, and decide whether a violation occurred and what corrective action is required. Compliance typically looks like advance, written, prominent disclosure and consent, dissociation from wrongdoing, following the stricter rule, fair treatment of clients, reasonable basis for recommendations and proper records; violations typically involve late, verbal or buried disclosure, reliance on local law or common practice, front-running, trading on material nonpublic information, or misrepresenting the CFA designation. Good investment outcomes never excuse a violation.`
},
quiz:[
{q:"An analyst who owns shares of a company issues a buy recommendation and discloses her ownership prominently in the report. She has:",o:["violated VI(A)","complied with VI(A)","violated II(A)"],a:1,e:"Prominent disclosure of the conflict satisfies VI(A) (and nothing indicates MNPI)."},
{q:"A member leaves her firm and, after starting at a new firm, contacts former clients using information from public directories. There is no non-solicitation agreement. She has:",o:["violated IV(A)","not violated the Standards","violated III(E)"],a:1,e:"After departure, using public information and memory is permitted absent a restrictive agreement."},
{q:"A portfolio manager's trade on behalf of clients turned out highly profitable, but it was based on a tip from an insider about an unannounced merger. The manager:",o:["did not violate the Standards because clients profited","violated II(A)","violated only III(B)"],a:1,e:"Acting on MNPI is a violation regardless of outcome."},
{q:"An investment firm offers its 'platinum' clients first access to research, discloses this to all clients, and any client can upgrade for a fee. This is:",o:["a violation of III(B)","consistent with III(B)","a violation of VI(A)"],a:1,e:"Different service levels are acceptable if disclosed and available to all."},
{q:"A member's country has no law against using MNPI. A colleague tells her about an unannounced earnings miss. She should:",o:["trade, since local law permits it","not trade, because the Code and Standards are stricter","trade only for clients"],a:1,e:"Follow the stricter standard (I(A)); II(A) prohibits acting on MNPI."},
{q:"A supervisor relies on a subordinate's promise to stop a violation and does nothing else. This most likely violates:",o:["IV(C)","IV(B)","V(C)"],a:0,e:"Reasonable supervisory efforts require more than reliance on assurances."}]
});

</script>
<script>
(function(){
const TOPICS={alt:{name:"Alternative Investments",short:"Alts",color:"var(--quant)",blurb:"Fund structures and fees, alt performance, private equity and debt, real estate, infrastructure, natural resources, hedge funds and digital assets."},
pm:{name:"Portfolio Construction",short:"Portfolio",color:"var(--econ)",blurb:"Risk and return, efficient frontier, CAPM and performance ratios, the portfolio management process, IPS, behavioral biases and risk management."},
eth:{name:"Ethical and Professional Standards",short:"Ethics",color:"var(--cf)",blurb:"Ethics and trust, the Code and Standards, all seven Standards with guidance, and application cases."}};
const SECS=[["eli5","Ultra-Simple (ELI5)"],["core","Intuitive Core Idea"],["formal","Formal CFA-Level"],["math","Mathematics Made Intuitive"],["example","Worked Example"],["traps","Common Mistakes & Traps"],["exam","Thinking in the Exam"],["anchors","Memory Anchors"],["summary","One-Paragraph Summary"],["quiz","Quick Quiz"]];
const R=window.READINGS.sort((a,b)=>a.n-b.n);
const store={get(k,d){try{const v=localStorage.getItem("cfa1b4:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("cfa1b4:"+k,JSON.stringify(v))}catch(e){}}};
let done=store.get("done",{});
let state={r:null,s:"eli5",all:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=h=>h.replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ").replace(/\s+/g," ");

/* theme */
const th=store.get("theme",null); if(th) document.documentElement.setAttribute("data-theme",th);
$("#theme").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const nx=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",nx);store.set("theme",nx)};

function nav(filter){
  const f=(filter||"").trim().toLowerCase();
  let h="";
  for(const t of Object.keys(TOPICS)){
    const rs=R.filter(r=>r.topic===t);
    const dn=rs.filter(r=>done[r.n]).length;
    let items="";
    for(const r of rs){
      let snip="";
      if(f){
        if(!r.title.toLowerCase().includes(f)&&!String(r.n).startsWith(f)){
          const txt=r._txt||(r._txt=strip(Object.values(r.s).join(" ")));
          const i=txt.toLowerCase().indexOf(f);
          if(i<0) continue;
          snip=`<span class="hit">…${esc(txt.slice(Math.max(0,i-30),i+50))}…</span>`;
        }
      }
      items+=`<button class="rlink${state.r===r.n?" on":""}${done[r.n]?" done":""}" data-r="${r.n}" style="--tc:${TOPICS[t].color}"><span class="n">${r.n}</span><span>${esc(r.title)}${snip}</span><span class="ok">✓</span></button>`;
    }
    if(!items&&f) continue;
    h+=`<div class="topic" style="--tc:${TOPICS[t].color}"><div class="topic-h">${TOPICS[t].name}<span>${dn}/${rs.length}</span></div>${items||""}</div>`;
  }
  $("#nav").innerHTML=h||`<div class="overall">No matches.</div>`;
  const tot=Object.keys(done).filter(k=>done[k]).length;
  $("#ovtxt").textContent=`${tot} of ${R.length} readings marked done`;
  $("#ovbar").style.width=(100*tot/R.length)+"%";
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest(".rlink");if(b){go(+b.dataset.r,"eli5");document.body.classList.remove("nav")}});
$("#q").addEventListener("input",e=>nav(e.target.value));
$("#scrim").onclick=()=>document.body.classList.remove("nav");

function home(){
  state.r=null;
  const counts=k=>R.filter(r=>r.topic===k);
  let cards="";
  for(const k of Object.keys(TOPICS)){const rs=counts(k);if(!rs.length)continue;const dn=rs.filter(r=>done[r.n]).length;
    cards+=`<button class="tcard" data-r="${rs[0].n}" style="--tc:${TOPICS[k].color}"><h3>${TOPICS[k].name}</h3><p>${TOPICS[k].blurb}</p><div style="font-size:13px;color:var(--ink3)">Readings ${rs[0].n}–${rs[rs.length-1].n} · ${dn}/${rs.length} done</div><div class="bar"><i style="width:${100*dn/rs.length}%;background:var(--tc)"></i></div></button>`}
  $("#main").innerHTML=`<div class="topbar"><button class="iconbtn" id="burger" aria-label="Menu">☰</button><span class="t">CFA L1 · Book 4</span></div>
  <div class="home" style="padding-top:26px"><div class="kicker" style="--tc:var(--accent)">SchweserNotes 2027 · Book 4</div><h2>Learn every reading three times over: simply, intuitively, then exam-precise.</h2>
  <p class="lead">23 readings, each taught in the same nine layers, plus a quick quiz. Pick a topic to start, or jump in from the sidebar. Calculators inside the maths sections let you move the inputs and watch the answer change.</p>
  <div class="cards">${cards}</div>
  <div class="legend">${SECS.map((s,i)=>`<div><b>${i+1}.</b> ${s[1]}</div>`).join("")}</div>
  <p class="hint">Keys: <kbd>←</kbd> <kbd>→</kbd> move between sections · <kbd>[</kbd> <kbd>]</kbd> previous/next reading · <kbd>/</kbd> search</p></div>`;
  $("#main").querySelectorAll(".tcard").forEach(b=>b.onclick=()=>go(+b.dataset.r,"eli5"));
  $("#burger").onclick=()=>document.body.classList.add("nav");
  nav($("#q").value);
}

function secHTML(r,key,label,i){
  if(key==="quiz") return `<section class="sec" id="s-quiz"><h3>${i+1}. ${label}</h3>${quizHTML(r)}</section>`;
  const body=r.s[key]||"<p><em>—</em></p>";
  const cls=key==="summary"?"prose summary":"prose";
  return `<section class="sec" id="s-${key}"><h3>${i+1}. ${label}</h3><div class="${cls}">${body}</div></section>`;
}
function quizHTML(r){
  if(!r.quiz||!r.quiz.length) return "<p>No quiz.</p>";
  return `<div class="quiz"><p class="score" data-score>Answer each question; feedback is instant.</p>${r.quiz.map((q,qi)=>`<div class="qq" data-qi="${qi}"><p class="stem">${qi+1}. ${q.q}</p>${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join("")}<div class="expl">${q.e}</div></div>`).join("")}</div>`;
}
function wireQuiz(r){
  const root=$("#main");
  root.querySelectorAll(".qq").forEach(div=>{
    div.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const q=r.quiz[+div.dataset.qi];const pick=+b.dataset.oi;
      div.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(i===q.a)x.classList.add("right")});
      if(pick!==q.a)b.classList.add("wrong");
      div.classList.add("answered");div.dataset.ok=pick===q.a?"1":"0";
      const all=root.querySelectorAll(".qq"),ans=root.querySelectorAll(".qq.answered");
      const ok=[...ans].filter(x=>x.dataset.ok==="1").length;
      const sc=root.querySelector("[data-score]");
      if(sc) sc.textContent=ans.length===all.length?`Score: ${ok}/${all.length}${ok===all.length?" — perfect.":" — re-read the explanations for the misses."}`:`${ok}/${ans.length} correct so far`;
    });
  });
}

function go(n,sec,noscroll){
  const r=R.find(x=>x.n===n); if(!r) return home();
  state.r=n; state.s=sec||state.s||"eli5";
  const t=TOPICS[r.topic]; const idx=R.indexOf(r); const prev=R[idx-1],next=R[idx+1];
  document.documentElement.style.setProperty("--tc",t.color);
  const tabs=SECS.map((s,i)=>`<button class="tab${!state.all&&state.s===s[0]?" on":""}" data-s="${s[0]}"><b>${i+1}</b>${s[1]}</button>`).join("");
  const body=state.all?SECS.map((s,i)=>secHTML(r,s[0],s[1],i)).join(""):(()=>{const i=SECS.findIndex(s=>s[0]===state.s);return secHTML(r,SECS[i][0],SECS[i][1],i)})();
  const si=SECS.findIndex(s=>s[0]===state.s);
  const secPager=state.all?"":`<div class="pager">${si>0?`<button class="btn" data-sp="${SECS[si-1][0]}">← ${SECS[si-1][1]}</button>`:"<span></span>"}${si<SECS.length-1?`<button class="btn primary" data-sp="${SECS[si+1][0]}">${SECS[si+1][1]} →</button>`:(next?`<button class="btn primary" data-go="${next.n}">Next: R${next.n} ${esc(next.title)} →</button>`:"<span></span>")}</div>`;
  $("#main").innerHTML=`<div class="topbar"><button class="iconbtn" id="burger" aria-label="Menu">☰</button><span class="t">R${r.n} · ${esc(r.title)}</span></div>
  <header class="rhead" style="--tc:${t.color}"><div class="kicker"><a href="#" id="homelink" style="color:inherit;text-decoration:none">Book 4</a> · ${t.name} · Reading ${r.n}</div><h2>${esc(r.title)}</h2>
  <details class="los"><summary>Learning outcomes (LOS)</summary><ul>${r.los.map(l=>`<li>${l}</li>`).join("")}</ul></details>
  <div class="actions"><button class="btn${done[r.n]?" on":""}" id="markdone">${done[r.n]?"✓ Marked done":"Mark reading done"}</button><button class="btn" id="toggleall">${state.all?"Show one section at a time":"Show all sections on one page"}</button></div></header>
  <div class="tabs" id="tabs">${tabs}</div>
  <div id="body">${body}</div>${secPager}
  <div class="pager">${prev?`<button class="btn" data-go="${prev.n}">← R${prev.n} ${esc(prev.title)}</button>`:"<span></span>"}${next?`<button class="btn" data-go="${next.n}">R${next.n} ${esc(next.title)} →</button>`:"<span></span>"}</div>`;
  $("#burger").onclick=()=>document.body.classList.add("nav");
  $("#homelink").onclick=e=>{e.preventDefault();home();window.scrollTo(0,0)};
  $("#markdone").onclick=()=>{done[r.n]=!done[r.n];store.set("done",done);go(n,state.s,true)};
  $("#toggleall").onclick=()=>{state.all=!state.all;go(n,state.s,true)};
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    if(state.all){const el=document.getElementById("s-"+b.dataset.s);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-70,behavior:"smooth"});return}
    go(n,b.dataset.s)});
  $("#main").querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>go(n,b.dataset.sp));
  $("#main").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go,"eli5"));
  const on=$("#tabs .tab.on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
  renderCalcs(); wireQuiz(r);
  store.set("last",{r:n,s:state.s});
  if(!noscroll){const tb=$("#tabs");const y=tb.getBoundingClientRect().top+scrollY-(innerWidth<=860?55:0);if(scrollY>y)window.scrollTo(0,y)}
  nav($("#q").value);
}

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  if(e.key==="/"){e.preventDefault();$("#q").focus();return}
  if(state.r==null)return;
  const si=SECS.findIndex(s=>s[0]===state.s);const idx=R.findIndex(x=>x.n===state.r);
  if(e.key==="ArrowRight"&&!state.all&&si<SECS.length-1)go(state.r,SECS[si+1][0]);
  if(e.key==="ArrowLeft"&&!state.all&&si>0)go(state.r,SECS[si-1][0]);
  if(e.key==="]"&&R[idx+1])go(R[idx+1].n,"eli5");
  if(e.key==="["&&R[idx-1])go(R[idx-1].n,"eli5");
});

/* ---------- calculators ---------- */
const fmt=(x,d=2)=>isFinite(x)?Number(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const pct=(x,d=2)=>isFinite(x)?fmt(100*x,d)+"%":"—";
function irr(cfs){let lo=-0.99,hi=10;const npv=r=>cfs.reduce((s,c,t)=>s+c/Math.pow(1+r,t),0);let flo=npv(lo),fhi=npv(hi);if(flo*fhi>0)return NaN;for(let i=0;i<200;i++){const m=(lo+hi)/2,fm=npv(m);if(flo*fm<=0){hi=m;fhi=fm}else{lo=m;flo=fm}}return (lo+hi)/2}
const CALCS={
 fee:{t:"Hedge fund fees: management + incentive, hurdle & high-water mark",i:[["v0","Beginning value",100],["v1","Ending value before fees",120],["m","Management fee % (on ending value)",2],["p","Incentive fee %",20],["h","Hurdle rate %",5],["soft","Soft hurdle? (1 = soft, 0 = hard)",1],["hwm","High-water mark",100]],
  f:v=>{const mg=v.v1*v.m/100;const val=v.v1-mg;const base=Math.max(v.hwm,v.v0);const hv=v.v0*(1+v.h/100);let inc=0;if(+v.soft===1){if(val>hv&&val>v.hwm)inc=v.p/100*(val-base)}else{inc=v.p/100*Math.max(0,val-Math.max(base,hv))}const end=val-inc;return `Management fee = ${v.m}% × ${fmt(v.v1)} = <b>${fmt(mg)}</b> → value after mgmt fee ${fmt(val)}<br>Hurdle value = ${fmt(hv)} · HWM = ${fmt(v.hwm)} · ${+v.soft===1?"soft hurdle: fee on the whole gain above HWM once the hurdle is cleared":"hard hurdle: fee only on gain above max(hurdle, HWM)"}<br>Incentive fee = <b>${fmt(inc)}</b> · Total fees = <b>${fmt(mg+inc)}</b><br>Gross return = <b>${pct(v.v1/v.v0-1)}</b> · Net return to investor = <b>${pct(end/v.v0-1)}</b>`}},
 lev:{t:"MOIC & leveraged return",i:[["inv","Total invested capital",100],["real","Realized value (distributions)",90],["unr","Unrealized value (remaining NAV)",60],["r","Return on total assets %",12],["v0","Own capital V₀",100],["vb","Borrowed V_B",50],["rb","Borrowing rate %",6]],
  f:v=>{const moic=(+v.real+ +v.unr)/v.inv;const rl=(v.r/100*(+v.v0+ +v.vb)-v.rb/100*v.vb)/v.v0;return `MOIC = (realized + unrealized) / invested = <b>${fmt(moic,2)}×</b> (ignores timing: a 1.5× in 2 years beats 1.5× in 8)<br>Leveraged return = [r(V₀ + V<sub>B</sub>) − r<sub>B</sub>V<sub>B</sub>] / V₀ = <b>${pct(rl)}</b> vs unlevered ${v.r}%`}},
 carry:{t:"Commodity futures: cost of carry",i:[["s","Spot price",80],["rf","Risk-free rate %",4],["st","Storage cost % of spot",2],["cy","Convenience yield %",9],["T","Years",1]],
  f:v=>{const F=v.s*(1+(v.rf+v.st-v.cy)/100*v.T);const st=F>v.s?"<b>contango</b> (F > S): a long investor rolling futures tends to lose roll yield":F<v.s?"<b>backwardation</b> (F < S): a long investor earns positive roll yield":"flat";return `Net cost of carry = ${v.rf}% + ${v.st}% − ${v.cy}% = ${fmt(+v.rf+ +v.st-v.cy)}%<br>Futures ≈ <b>${fmt(F)}</b> → ${st}`}},
 port:{t:"Two-asset portfolio — drag the correlation",i:[["w","Weight in A %",60],["ea","E(R) A %",10],["sa","σ A %",20],["eb","E(R) B %",6],["sb","σ B %",12],["rho","Correlation ρ (−1 to +1)",0.3,"range"]],
  f:v=>{const w=v.w/100,ea=v.ea/100,sa=v.sa/100,eb=v.eb/100,sb=v.sb/100,p=+v.rho;const er=w*ea+(1-w)*eb;const vr=w*w*sa*sa+(1-w)**2*sb*sb+2*w*(1-w)*p*sa*sb;const lin=w*sa+(1-w)*sb;const den=sa*sa+sb*sb-2*p*sa*sb;const wmin=den>0?(sb*sb-p*sa*sb)/den:NaN;return `ρ = <b>${p.toFixed(2)}</b> · Cov = ρσ<sub>A</sub>σ<sub>B</sub> = ${fmt(p*sa*sb,4)}<br>E(R<sub>p</sub>) = <b>${pct(er)}</b> · σ<sub>p</sub> = <b>${pct(Math.sqrt(Math.max(vr,0)))}</b> vs weighted-average σ ${pct(lin)} → diversification benefit ${pct(lin-Math.sqrt(Math.max(vr,0)))}<br>Minimum-variance weight in A = <b>${pct(wmin,1)}</b>`}},
 util:{t:"Utility & capital allocation line",i:[["rf","Risk-free rate %",4],["em","E(R) risky portfolio %",11],["sm","σ risky portfolio %",20],["A","Risk aversion A",4]],
  f:v=>{const rf=v.rf/100,em=v.em/100,sm=v.sm/100;const sh=(em-rf)/sm;const y=(em-rf)/(v.A*sm*sm);const er=rf+y*(em-rf),sd=y*sm;const U=er-0.5*v.A*sd*sd;return `Sharpe ratio (slope of CAL) = <b>${fmt(sh,3)}</b><br>Optimal weight in risky portfolio y* = (E−R<sub>f</sub>)/(Aσ²) = <b>${pct(y,1)}</b>${y>1?" (borrowing at R<sub>f</sub>)":""}<br>Complete portfolio: E(R) = ${pct(er)}, σ = ${pct(sd)}, Utility U = E(R) − ½Aσ² = <b>${pct(U)}</b>`}},
 beta:{t:"Beta & CAPM",i:[["rho","Correlation with market ρ",0.6],["si","σ of asset %",30],["sm","σ of market %",20],["rf","Risk-free rate %",3],["rm","Expected market return %",9],["fc","Your forecast return %",11]],
  f:v=>{const b=v.rho*v.si/v.sm;const req=+v.rf+b*(v.rm-v.rf);const a=v.fc-req;return `β = ρσ<sub>i</sub>/σ<sub>m</sub> = ${v.rho}×${v.si}/${v.sm} = <b>${fmt(b,3)}</b> · Cov = ρσ<sub>i</sub>σ<sub>m</sub> = ${fmt(v.rho*v.si*v.sm/10000,4)}<br>CAPM required return = ${v.rf}% + ${fmt(b,3)}×(${v.rm}% − ${v.rf}%) = <b>${fmt(req)}%</b><br>Forecast − required = <b>${fmt(a)}%</b> → ${a>0?"above SML: <b>undervalued</b>":a<0?"below SML: <b>overvalued</b>":"on SML: fairly valued"}<br>Total risk σ² = systematic β²σ<sub>m</sub>² (${fmt((b*v.sm)**2,1)}) + unsystematic (${fmt(v.si**2-(b*v.sm)**2,1)}) [%²] → R² = ρ² = ${pct(v.rho*v.rho,0)}`}},
 perf:{t:"Performance measures: Sharpe, Treynor, M², Jensen's alpha",i:[["rp","Portfolio return %",12],["sp","Portfolio σ %",25],["bp","Portfolio β",1.2],["rf","Risk-free rate %",3],["rm","Market return %",10],["sm","Market σ %",18]],
  f:v=>{const sh=(v.rp-v.rf)/v.sp,shm=(v.rm-v.rf)/v.sm;const tr=(v.rp-v.rf)/v.bp;const m2=+v.rf+(v.rp-v.rf)*v.sm/v.sp;const ja=v.rp-(+v.rf+v.bp*(v.rm-v.rf));return `Sharpe = (R<sub>p</sub> − R<sub>f</sub>)/σ<sub>p</sub> = <b>${fmt(sh,3)}</b> vs market <b>${fmt(shm,3)}</b><br>Treynor = (R<sub>p</sub> − R<sub>f</sub>)/β<sub>p</sub> = <b>${fmt(tr,2)}%</b> vs market ${fmt(v.rm-v.rf,2)}%<br>M² = R<sub>f</sub> + (R<sub>p</sub> − R<sub>f</sub>)σ<sub>m</sub>/σ<sub>p</sub> = <b>${fmt(m2)}%</b> → M² alpha = <b>${fmt(m2-v.rm)}%</b><br>Jensen's α = R<sub>p</sub> − [R<sub>f</sub> + β(R<sub>m</sub> − R<sub>f</sub>)] = <b>${fmt(ja)}%</b>`}},
 req:{t:"IPS: required return",i:[["need","Annual spending need",80000],["val","Portfolio value",2000000],["inf","Expected inflation %",2.5],["fee","Fees/costs %",0.5]],
  f:v=>{const s=v.need/v.val;const add=s+v.inf/100+v.fee/100;const mult=(1+s)*(1+v.inf/100)*(1+v.fee/100)-1;return `Spending rate = ${fmt(v.need,0)} / ${fmt(v.val,0)} = <b>${pct(s)}</b><br>Required return (additive) ≈ ${pct(s)} + ${v.inf}% + ${v.fee}% = <b>${pct(add)}</b><br>Required return (multiplicative) = (1+${pct(s)})(1+${v.inf}%)(1+${v.fee}%) − 1 = <b>${pct(mult)}</b>`}},
 var:{t:"Value at risk (parametric, zero mean)",i:[["p","Portfolio value",10000000],["s","σ per period %",1.5],["z","z (1.65 = 5%, 2.33 = 1%)",1.65],["d","Holding days (√t scaling)",1]],
  f:v=>{const VaR=v.z*v.s/100*Math.sqrt(v.d)*v.p;return `VaR = z × σ × √t × value = ${v.z} × ${v.s}% × √${v.d} × ${fmt(v.p,0)} = <b>${fmt(VaR,0)}</b><br>Read: "on ${v.z>=2.3?'1':'5'}% of periods, losses are expected to exceed ${fmt(VaR,0)}". VaR is a minimum loss in the tail, not a maximum.`}}
};

function renderCalcs(){
  document.querySelectorAll(".calc[data-calc]").forEach(el=>{
    const c=CALCS[el.dataset.calc]; if(!c||el.dataset.ready) return; el.dataset.ready=1;
    el.innerHTML=`<h5>${c.t}</h5><div class="cgrid">${c.i.map(([k,l,d,ty])=>ty==="range"?`<label class="wide">${l}: <span data-rv="${k}">${d}</span><input type="range" min="-1" max="1" step="0.05" data-k="${k}" value="${d}"></label>`:`<label${ty==="text"?' class="wide"':""}>${l}<input ${ty==="text"?'type="text"':'type="number" step="any"'} data-k="${k}" value="${d}"></label>`).join("")}</div><div class="cout"></div>`;
    const run=()=>{const v={};el.querySelectorAll("input").forEach(i=>{v[i.dataset.k]=i.type==="text"?i.value:parseFloat(i.value);const rv=el.querySelector(`[data-rv="${i.dataset.k}"]`);if(rv)rv.textContent=(+i.value).toFixed(2)});let out;try{out=c.f(v)}catch(e){out="Check inputs."}el.querySelector(".cout").innerHTML=out};
    el.querySelectorAll("input").forEach(i=>i.addEventListener("input",run)); run();
  });
}


/* ---- site routing: every reading/section has its own URL (#r12-math), back/forward work ---- */
const _go=go,_home=home;let _boot=true,_pop=false;const _SK=SECS.map(s=>s[0]);
function _sync(h){if(_pop)return;const cur=location.hash||"";if(cur===(h||""))return;const url=h||(location.pathname+location.search);try{_boot?history.replaceState(null,"",url):history.pushState(null,"",url)}catch(e){}}
go=function(n,sec,noscroll){_go(n,sec,noscroll);if(state.r===n){_sync("#r"+n+(state.all?"":"-"+state.s));store.set("last",{r:n,s:state.s,t:Date.now()})}};
home=function(){_home();_sync("")};
function _route(ns){const h=decodeURIComponent(location.hash.slice(1));let m=h.match(/^r(\d+)(?:-(\w+))?$/);
  if(m&&R.find(x=>x.n===+m[1])){go(+m[1],_SK.includes(m[2])?m[2]:"eli5",ns);return true}
  m=h.match(/^topic-(\w+)$/);if(m){const r=R.find(x=>x.topic===m[1]);if(r){go(r.n,"eli5",ns);return true}}
  if(h==="home"){home();return true}return false}
window.addEventListener("popstate",()=>{_pop=true;if(!_route(false))_home();_pop=false;window.scrollTo(0,0)});
if(location.protocol==="file:")document.querySelectorAll("a.allbooks").forEach(a=>a.setAttribute("href","../index.html"));
const last=store.get("last",null);
if(!_route(true)){if(last&&R.find(x=>x.n===last.r)) go(last.r,last.s,true); else home();}
_boot=false;
})();
</script>
