<li><strong>Reflect:</strong> was the outcome as anticipated? Were there unintended consequences? What can be learned?</li></ol>`,
math:`<p>No formulas in ethics. Use these "decision equations" instead.</p>
<div class="f"><span class="lbl">Trust equation (intuition)</span>Client trust = expertise × ethics × enforcement &nbsp;(if any factor is zero, trust collapses)</div>
<div class="f"><span class="lbl">Standard of care</span>Suitability: "Does this fit the client?" &nbsp;&lt;&nbsp; Fiduciary: "Is this the best thing for the client?"</div>
<div class="f"><span class="lbl">Decision framework</span>Identify → Consider → Decide &amp; Act → Reflect</div>
<div class="dir"><div>Short-term pressure <span class="up">↑</span> → risk of unethical choice <span class="up">↑</span></div><div>More stakeholders considered → better long-term decisions</div><div>"It's legal" ≠ "it's ethical"</div></div>`,
example:`<div class="q">A sales manager tells Ana, a new adviser, that the team must hit quarterly targets for a high-fee in-house fund. Everyone on the team recommends it to all clients, including retirees who need low-cost income products. Ana thinks, "I'm an honest person, so I'd never do anything wrong," and it's not illegal to recommend the fund. Walk her through the framework.</div>
<ol class="steps"><li><strong>Identify:</strong> facts (high-fee fund, targets, retirees' needs); stakeholders (clients, Ana, employer, profession); duties (loyalty, prudence, suitability to clients); conflict (targets vs client interest).</li>
<li><strong>Consider:</strong> situational influences (peer behavior, manager pressure, bonus), her overconfidence in her own ethics, guidance (compliance department, Code and Standards), alternatives (recommend only where suitable, raise concerns, document reasoning, escalate).</li>
<li><strong>Decide and act:</strong> recommend products based on each client's needs; disclose conflicts; raise the target-setting issue with compliance.</li>
<li><strong>Reflect:</strong> after acting, review outcomes and whether anything was missed.</li>
<li><strong>Lesson:</strong> legal ≠ ethical; short-term targets and peer pressure are classic challenges.</li></ol>
<p class="ans">Takeaway: name the pressures, put clients first, use the framework, escalate.</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> "If it's legal it's ethical." <b>Fix:</b> ethics often requires more than the law.</li>
<li><b>Trap:</b> Confusing suitability with fiduciary duty. <b>Fix:</b> fiduciary (best interest) is the higher standard.</li>
<li><b>Trap:</b> Believing ethical lapses come mainly from bad people. <b>Fix:</b> situational influences and short-termism lead good people astray.</li>
<li><b>Trap:</b> Skipping "reflect". <b>Fix:</b> the framework ends with evaluation of outcomes.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> definitions (ethics, code, standards, profession); why ethics matters more in finance; challenges to ethical behavior; ethics vs law; order of the decision framework.</li>
<li>Expect 1–2 straightforward questions. Recognize the vocabulary and move on.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>The doctor test</b>Clients can't check the medicine, so they need trust.</div>
<div class="anchor"><b>I-C-D-R</b>Identify, Consider, Decide, Reflect.</div>
<div class="anchor"><b>Legal is the floor, ethics is the ceiling</b>Aim higher than the law.</div>
<div class="anchor"><b>Me, Now, Them</b>Challenges: overconfidence (me), short-termism (now), situational pressure (them).</div></div>`,
summary:`Ethics is a set of moral principles based on shared beliefs about acceptable behavior. A code of ethics communicates a profession's commitment to serve clients honestly and builds public trust; professions establish trust through specialized expertise, ethical standards and monitoring of conduct. High ethical standards matter especially in investment management because the product is intangible and clients depend on professionals' knowledge. Some professionals are held to a suitability standard, others to the higher fiduciary (best-interest) standard. Challenges to ethical behavior include overestimating one's own ethics, focusing on short-term consequences, and situational influences such as peer pressure. Laws are more specific and reactive than ethics; not all unethical acts are illegal or vice versa. The ethical decision-making framework is: identify facts, stakeholders, duties, principles and conflicts; consider situational influences, guidance and alternatives; decide and act; and reflect on the outcome.`
},
quiz:[
{q:"Which is NOT a common challenge to ethical behavior?",o:["Overestimating one's own ethical character","Considering long-term consequences of decisions","Situational influences such as peer pressure"],a:1,e:"The challenge is focusing only on short-term consequences."},
{q:"Compared with a suitability standard, a fiduciary standard requires that a professional:",o:["recommend products consistent with risk tolerance","act in the client's best interest","follow only the law"],a:1,e:"Fiduciary = best interest, a higher bar than suitability."},
{q:"The final step of the ethical decision-making framework is to:",o:["identify stakeholders","decide and act","reflect on the decision and its consequences"],a:2,e:"Identify → Consider → Decide and act → Reflect."},
{q:"Which statement about ethics and law is most accurate?",o:["All illegal actions are unethical","Laws are often more specific than ethical principles and may respond to past misconduct","Ethical standards are always lower than legal standards"],a:1,e:"Laws are specific and reactive; ethics requires broader judgment."}]
});

add({n:94,topic:"eth",title:"Code of Ethics and Standards of Professional Conduct",
los:["94.a Describe the structure of the CFA Institute Professional Conduct Program and the process for the enforcement of the Code and Standards.","94.b Identify the six components of the Code of Ethics and the seven Standards of Professional Conduct.","94.c Explain the ethical responsibilities required by the Code and Standards, including the sub-sections of each Standard."],
s:{
eli5:`<p>CFA Institute has a rulebook and a referee. The <strong>rulebook</strong> has two parts: the <strong>Code of Ethics</strong> (six big principles, like "be honest and put clients first") and the <strong>Standards of Professional Conduct</strong> (seven chapters of specific rules).</p>
<p>The <strong>referee</strong> is the Professional Conduct Program. If someone might have broken the rules (they admit it on their yearly form, someone complains, it's in the news, or an exam proctor reports it), staff investigate. If there's a problem, they can propose a penalty, and the member can accept it or ask a panel to hear the case. Penalties range from a public warning to losing the right to call yourself a CFA charterholder.</p>`,
core:`<p><strong>What problem is this solving?</strong> A designation is only valuable if the public believes holders behave well. The Code and Standards define the behavior; the Professional Conduct Program enforces it fairly, so the CFA charter signals trustworthiness.</p>
<ul><li><strong>Code = principles</strong> (the "why" and the spirit). <strong>Standards = specific obligations</strong> (the "what"), organized by whom you owe the duty: the profession (I), capital markets (II), clients (III), employers (IV), the investment process (V), managing conflicts (VI), and CFA Institute itself (VII).</li>
<li><strong>Who's bound:</strong> CFA Institute members (including charterholders) and candidates. Members must annually sign the Professional Conduct Statement.</li>
<li><strong>Enforcement is due process:</strong> investigation by Professional Conduct staff; sanctions proposed; member can accept or contest before a Disciplinary Review Committee hearing panel. Confidential process; sanctions can be public.</li>
<li><strong>The order of the Standards mirrors priorities:</strong> integrity of the profession and markets, then clients, then employer, then process and conflicts, then responsibilities as a member.</li></ul>`,
formal:`<h4>Professional Conduct Program (PCP)</h4>
<ul><li>Governed by the CFA Institute Bylaws and Rules of Procedure for Proceedings Related to Professional Conduct; based on fairness and confidentiality.</li>
<li><strong>Designated Officer / Professional Conduct staff</strong> conduct inquiries; the <strong>Disciplinary Review Committee (DRC)</strong> (volunteer members) enforces through hearing panels.</li>
<li><strong>Inquiries are triggered by:</strong> self-disclosure on the annual Professional Conduct Statement (e.g., litigation, complaints, regulatory actions); written complaints; public sources (media); exam proctor reports of candidate misconduct; analysis of exam materials/scores.</li>
<li><strong>Process:</strong> staff request information, interview the member, gather records → conclude: no disciplinary action, cautionary letter, or continue proceedings and propose a sanction. Member may accept, or reject and request a hearing before a DRC panel, which decides on violation and sanction.</li>
<li><strong>Sanctions:</strong> public censure; suspension of membership and use of the designation; revocation of the charter. For candidates: suspension or prohibition from the CFA Program, voiding exam results.</li></ul>
<h4>Code of Ethics: six components</h4>
<p>Members and candidates must:</p>
<ol><li>Act with integrity, competence, diligence and respect, and in an ethical manner with the public, clients, prospective clients, employers, employees, colleagues and other participants in global capital markets.</li>
<li>Place the integrity of the investment profession and the interests of clients above their own personal interests.</li>
<li>Use reasonable care and exercise independent professional judgment when conducting investment analysis, making recommendations, taking actions and engaging in other professional activities.</li>
<li>Practice and encourage others to practice in a professional and ethical manner that will reflect credit on themselves and the profession.</li>
<li>Promote the integrity and viability of the global capital markets for the ultimate benefit of society.</li>
<li>Maintain and improve their professional competence and strive to maintain and improve the competence of other investment professionals.</li></ol>
<h4>Standards of Professional Conduct</h4>
<table><tr><th>Standard</th><th>Sub-sections</th></tr>
<tr><td>I. Professionalism</td><td>(A) Knowledge of the Law; (B) Independence and Objectivity; (C) Misrepresentation; (D) Misconduct; (E) Competence</td></tr>
<tr><td>II. Integrity of Capital Markets</td><td>(A) Material Nonpublic Information; (B) Market Manipulation</td></tr>
<tr><td>III. Duties to Clients</td><td>(A) Loyalty, Prudence, and Care; (B) Fair Dealing; (C) Suitability; (D) Performance Presentation; (E) Preservation of Confidentiality</td></tr>
<tr><td>IV. Duties to Employers</td><td>(A) Loyalty; (B) Additional Compensation Arrangements; (C) Responsibilities of Supervisors</td></tr>
<tr><td>V. Investment Analysis, Recommendations, and Actions</td><td>(A) Diligence and Reasonable Basis; (B) Communication with Clients and Prospective Clients; (C) Record Retention</td></tr>
<tr><td>VI. Conflicts of Interest</td><td>(A) Disclosure of Conflicts; (B) Priority of Transactions; (C) Referral Fees</td></tr>
<tr><td>VII. Responsibilities as a CFA Institute Member or CFA Candidate</td><td>(A) Conduct as Participants in CFA Institute Programs; (B) Reference to CFA Institute, the CFA Designation, and the CFA Program</td></tr></table>`,
math:`<p>No formulas; here's the structure as a "formula" to memorize.</p>
<div class="f"><span class="lbl">Count</span>Code = 6 components &nbsp;·&nbsp; Standards = 7 Standards, 23 sub-sections (I:5, II:2, III:5, IV:3, V:3, VI:3, VII:2)</div>
<div class="f"><span class="lbl">Enforcement flow</span>Trigger → Investigation (staff) → No action / Cautionary letter / Proposed sanction → Accept or Hearing (DRC panel) → Sanction</div>
<div class="f"><span class="lbl">Sanction ladder</span>Public censure &lt; Suspension &lt; Revocation (candidates: suspension from program, voided results)</div>
<div class="dir"><div>Standards ordered: Profession → Markets → Clients → Employers → Process → Conflicts → CFA Institute</div></div>`,
example:`<div class="q">(a) A charterholder discloses on her annual Professional Conduct Statement that a client filed a complaint against her. What happens? (b) Which Standard covers each: (i) a member plagiarizes a research report; (ii) a candidate shares exam questions online; (iii) an analyst trades on a tip about an unannounced merger; (iv) a manager accepts a bonus from a client without telling his employer; (v) an adviser fails to keep records supporting her recommendations.</div>
<ol class="steps"><li><strong>(a)</strong> Self-disclosure triggers an inquiry by Professional Conduct staff, who may request information and interview her. Outcomes: no action, cautionary letter, or proposed sanction, which she can accept or contest before a DRC hearing panel.</li>
<li><strong>(i)</strong> I(C) Misrepresentation. <strong>(ii)</strong> VII(A) Conduct as Participants in CFA Institute Programs. <strong>(iii)</strong> II(A) Material Nonpublic Information. <strong>(iv)</strong> IV(B) Additional Compensation Arrangements. <strong>(v)</strong> V(C) Record Retention.</li></ol>
<p class="ans">Answers: inquiry → outcomes as above · I(C), VII(A), II(A), IV(B), V(C)</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Thinking only charterholders are bound. <b>Fix:</b> all members <em>and candidates</em>.</li>
<li><b>Trap:</b> Believing the PCP can impose fines or jail. <b>Fix:</b> sanctions are censure, suspension, revocation (and program sanctions for candidates).</li>
<li><b>Trap:</b> "A member must accept a proposed sanction." <b>Fix:</b> they can reject it and request a hearing.</li>
<li><b>Trap:</b> Mixing up Standard numbers. <b>Fix:</b> learn the 7 titles in order; most questions only need the right sub-section.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> what triggers an inquiry; possible outcomes and sanctions; identify Code components vs Standards; match a behavior to a Standard.</li>
<li><strong>Memory order:</strong> "<em>P</em>lease <em>I</em>nvest <em>C</em>arefully, <em>E</em>very <em>I</em>nvestor <em>C</em>ounts <em>C</em>FA": Professionalism, Integrity of markets, Clients, Employers, Investment analysis, Conflicts, CFA Institute.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Rulebook + referee</b>Code &amp; Standards + Professional Conduct Program.</div>
<div class="anchor"><b>6 and 7</b>Six Code components; seven Standards.</div>
<div class="anchor"><b>Concentric circles</b>Profession → markets → clients → employer → process → conflicts → CFA Institute.</div>
<div class="anchor"><b>Censure · Suspend · Revoke</b>The sanction ladder.</div></div>`,
summary:`The CFA Institute Professional Conduct Program, governed by the Bylaws and Rules of Procedure, enforces the Code and Standards for members and candidates. Inquiries are triggered by self-disclosure on the annual Professional Conduct Statement, written complaints, media/public sources, exam proctor reports or analysis of exam materials. Professional Conduct staff investigate and may take no action, issue a cautionary letter, or propose a sanction, which the member can accept or contest before a Disciplinary Review Committee hearing panel; sanctions include public censure, suspension and revocation (and, for candidates, program suspension and voided results). The six-part Code of Ethics requires integrity, competence, diligence and respect; putting the profession and clients first; reasonable care and independent judgment; professional and ethical practice; promoting market integrity; and maintaining competence. The seven Standards cover Professionalism, Integrity of Capital Markets, Duties to Clients, Duties to Employers, Investment Analysis/Recommendations/Actions, Conflicts of Interest, and Responsibilities as a CFA Institute Member or Candidate.`
},
quiz:[
{q:"Which is NOT a way the Professional Conduct Program typically learns of possible violations?",o:["Self-disclosure on the Professional Conduct Statement","Written complaints","Annual random audits of members' tax returns"],a:2,e:"Triggers include self-disclosure, complaints, public/media sources, proctor reports and exam analysis, not tax audits."},
{q:"If a member rejects a proposed sanction, the matter is:",o:["closed with no action","referred to a hearing panel of the Disciplinary Review Committee","sent to securities regulators for prosecution"],a:1,e:"The member may request a hearing before a DRC panel."},
{q:"'Place the integrity of the investment profession and the interests of clients above their own personal interests' is:",o:["a component of the Code of Ethics","Standard III(A)","Standard VI(B)"],a:0,e:"It's the second of the six Code components."},
{q:"Responsibilities of Supervisors falls under which Standard?",o:["I. Professionalism","IV. Duties to Employers","VI. Conflicts of Interest"],a:1,e:"IV(C) Responsibilities of Supervisors."}]
});

/* ===================== READING 95 ===================== */
add({n:95,topic:"eth",title:"Guidance for Standard I: Professionalism",
los:["95.a Demonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity.","95.b Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct.","95.c Identify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards."],
s:{
eli5:`<p>Standard I is about being a trustworthy professional in five ways:</p>
<ol><li><strong>Know the rules</strong> where you work, and if the local law and the CFA rules differ, follow whichever is stricter. If you see others breaking rules, don't take part and step away.</li>
<li><strong>Think for yourself.</strong> Don't let gifts, bosses, or big clients bend your opinion.</li>
<li><strong>Don't lie or exaggerate</strong>, and don't copy others' work as your own.</li>
<li><strong>Don't be dishonest</strong> in ways that make people doubt your integrity.</li>
<li><strong>Be good at your job</strong>, and keep learning.</li></ol>`,
core:`<p><strong>What problem is this solving?</strong> Every other duty rests on basic professionalism: following the law (or a stricter standard), keeping judgment independent, being truthful, behaving with integrity, and being competent. These protect clients and the reputation of the profession.</p>
<ul><li><strong>I(A) Knowledge of the Law:</strong> the "stricter of" rule, and dissociation from violations (you can't just look away).</li>
<li><strong>I(B) Independence and Objectivity:</strong> pressures come from issuers, sales/investment banking colleagues, clients, gifts, travel, ownership. Modest gifts and entertainment are fine; anything that could reasonably compromise judgment is not. Pay your own way on company visits when possible.</li>
<li><strong>I(C) Misrepresentation:</strong> no misleading statements about services, qualifications, performance or investments; no guaranteeing returns on risky investments; no plagiarism (cite sources, except recognized factual data from widely used sources).</li>
<li><strong>I(D) Misconduct:</strong> no dishonesty, fraud or deceit, and no acts that reflect badly on professional reputation, integrity or competence. Personal life matters only when it relates to professional integrity (e.g., fraud), not every private failing.</li>
<li><strong>I(E) Competence:</strong> act with and maintain competence; know your limits and get help when needed.</li></ul>`,
formal:`<h4>I(A) Knowledge of the Law</h4>
<p>Understand and comply with all applicable laws, rules and regulations (including the Code and Standards) of any government, regulatory organization, licensing agency or professional association governing professional activities. In a conflict, comply with the <strong>more strict</strong> law, rule or regulation. Do not knowingly participate or assist in violations, and <strong>dissociate</strong> from any such violation.</p>
<ul><li>Dissociation: report to supervisor/compliance; if unresolved, refuse to participate, possibly resign. Inaction or staying silent can be participation.</li>
<li>Not required to report to regulators, though may be appropriate or legally required; whistleblowing may be warranted.</li>
<li>Procedures: stay informed, maintain current files of applicable law, seek legal/compliance advice, document violations reported.</li></ul>
<h4>I(B) Independence and Objectivity</h4>
<p>Use reasonable care and judgment to achieve and maintain independence and objectivity. Do not offer, solicit or accept any gift, benefit, compensation or consideration that reasonably could be expected to compromise own or another's independence and objectivity.</p>
<ul><li>Modest gifts and customary business entertainment are acceptable. Gifts from <em>clients</em> (for past performance) are less of a concern than gifts from issuers/brokers seeking future business, but should be disclosed to the employer.</li>
<li>Issuer-paid research must disclose the arrangement and use a flat fee (not contingent on conclusions).</li>
<li>Pay for own travel to company visits when possible; avoid lavish trips.</li>
<li>Investment banking pressure: firewalls, restricted lists, separate compensation for analysts.</li>
<li>Procedures: written policies, limit gifts, restrict employee participation in IPOs/private placements, preclearance, appoint a compliance officer.</li></ul>
<h4>I(C) Misrepresentation</h4>
<p>Do not knowingly make any misrepresentations relating to investment analysis, recommendations, actions or other professional activities.</p>
<ul><li>Includes false/misleading statements and omissions; guaranteeing performance of inherently volatile investments (guarantees of insured products or guaranteed structures are fine if accurate).</li>
<li>Plagiarism: using others' work without attribution. Must cite the source (except factual information from recognized statistical reporting services, e.g., Bloomberg data).</li>
<li>Third-party research: attribute; verify reasonableness.</li>
<li>Procedures: written list of firm services and qualifications, maintain records of sources, design templates and approvals for marketing.</li></ul>
<h4>I(D) Misconduct</h4>
<p>Do not engage in any professional conduct involving dishonesty, fraud or deceit, or commit any act that reflects adversely on professional reputation, integrity or competence.</p>
<ul><li>Covers personal conduct only where it reflects on professional integrity (e.g., fraud, theft, abuse of trust). A personal bankruptcy alone is not a violation unless it involved fraud. Repeated public intoxication affecting work may be.</li>
<li>Procedures: code of ethics, list of violations and sanctions, reference checks for new hires.</li></ul>
<h4>I(E) Competence</h4>
<p>Act with and maintain the competence necessary to fulfill professional responsibilities. Includes understanding products and strategies used, continuing education, recognizing limitations and seeking expert help.</p>`,
math:`<div class="f"><span class="lbl">I(A) Stricter-of rule</span>Apply = STRICTER of {Code &amp; Standards, applicable law(s)}</div>
<div class="f"><span class="lbl">The classic three-country grid</span>Home law less strict than Code → follow Code &nbsp;·&nbsp; Home law stricter than Code → follow law &nbsp;·&nbsp; Law of where you do business applies if it governs → still take the stricter</div>
<div class="f"><span class="lbl">I(B) Gift test</span>Could it reasonably compromise judgment? Yes → decline. Modest/customary → OK. From client → disclose to employer.</div>
<div class="f"><span class="lbl">Dissociation path</span>Report to supervisor/compliance → refuse to participate → (if needed) resign; staying silent ≠ dissociation</div>
<div class="dir"><div>Gift value <span class="up">↑</span> or tied to future business → independence risk <span class="up">↑</span></div><div>Issuer-paid research: flat fee + disclosure → acceptable</div></div>`,
example:`<div class="q">Decide violation or not: (a) Lee works in a country whose law allows trading ahead of client orders; the Code doesn't. He front-runs a client order. (b) An analyst accepts an all-expenses-paid weekend at a luxury resort from a company she covers. (c) A client sends a portfolio manager concert tickets after a great year; she tells her employer. (d) An analyst uses statistics from Bloomberg without citing them; he also copies an industry outlook paragraph from a broker's report without attribution. (e) A charterholder files for personal bankruptcy after a medical emergency. (f) A manager notices colleagues backdating trades; she says nothing.</div>
<ol class="steps"><li><strong>(a)</strong> Violation of I(A): the Code is stricter, so it applies (also VI(B)).</li>
<li><strong>(b)</strong> Violation of I(B): lavish, issuer-paid travel could compromise objectivity. Pay own way, accept only modest hospitality.</li>
<li><strong>(c)</strong> No violation: client gift for past performance, disclosed to employer (consistent with I(B) and IV(B)).</li>
<li><strong>(d)</strong> Bloomberg data: OK (recognized factual source). Copied paragraph: <strong>violation of I(C)</strong> (plagiarism).</li>
<li><strong>(e)</strong> No violation of I(D): no dishonesty, fraud or deceit involved.</li>
<li><strong>(f)</strong> Violation of I(A): she must dissociate (report to supervisor/compliance, refuse to participate).</li></ol>
<p class="ans">Answers: violation · violation · OK · data OK / paragraph violation · OK · violation</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Following local law because "it's legal here". <b>Fix:</b> always the stricter of law and Code.</li>
<li><b>Trap:</b> Thinking you must report violations to regulators. <b>Fix:</b> the Standards require dissociation; reporting to authorities is not required (but may be appropriate).</li>
<li><b>Trap:</b> Treating all gifts as forbidden. <b>Fix:</b> modest gifts and normal business entertainment are fine; client gifts should be disclosed.</li>
<li><b>Trap:</b> Every personal problem is "misconduct". <b>Fix:</b> only conduct involving dishonesty/fraud/deceit or reflecting on professional integrity.</li>
<li><b>Trap:</b> Must cite even standard market data. <b>Fix:</b> factual data from recognized statistical services need not be cited.</li>
<li><b>Trap:</b> Saying a guaranteed product can't be described as guaranteed. <b>Fix:</b> fine if the guarantee is genuine; the violation is guaranteeing inherently risky returns.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> which law applies; is a gift acceptable; plagiarism cases; whether personal conduct is misconduct; how to dissociate.</li>
<li><strong>Method:</strong> identify who could be harmed and whose judgment could be compromised; the CFA answer is usually the most client-protective <em>reasonable</em> action, not the most extreme (resigning is rarely the first step).</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>"Stricter wins"</b>I(A).</div>
<div class="anchor"><b>Lavish = no; Modest = OK</b>I(B) gifts.</div>
<div class="anchor"><b>Quote it or don't use it</b>I(C) plagiarism.</div>
<div class="anchor"><b>Fraud, not misfortune</b>I(D): bankruptcy alone isn't misconduct.</div>
<div class="anchor"><b>L-I-M-M-C</b>Law, Independence, Misrepresentation, Misconduct, Competence.</div></div>`,
summary:`Standard I requires professionalism. I(A) Knowledge of the Law: comply with applicable laws and the Code and Standards, follow the stricter in a conflict, and do not knowingly participate in violations but dissociate from them (reporting to authorities is not required but may be appropriate). I(B) Independence and Objectivity: do not offer, solicit or accept gifts, benefits or compensation that could reasonably compromise independence; modest gifts and customary entertainment are acceptable, client gifts should be disclosed to the employer, issuer-paid research needs a flat fee and disclosure, and analysts should pay for their own travel where possible. I(C) Misrepresentation: no misleading statements or omissions, no guarantees of inherently uncertain returns, and no plagiarism (cite sources except recognized factual data). I(D) Misconduct: no dishonesty, fraud or deceit, or acts reflecting adversely on professional reputation, integrity or competence. I(E) Competence: act with and maintain the competence needed for professional responsibilities.`
},
quiz:[
{q:"A member works in Country A (law less strict than the Code) for clients in Country B (law stricter than the Code), and Country B law applies. The member must follow:",o:["Country A law","the Code and Standards","Country B law"],a:2,e:"Follow the strictest applicable standard; here Country B law is stricter than the Code."},
{q:"An analyst accepts a modest gift basket from a company she covers during the holidays. This is:",o:["a violation of I(B) in all cases","acceptable because it's modest and customary","a violation of I(D)"],a:1,e:"Modest gifts and customary entertainment are unlikely to compromise independence."},
{q:"A member discovers her firm is engaging in illegal practices. Under I(A), she should first:",o:["report to regulators immediately","dissociate, e.g., by reporting to supervisors or compliance and refusing to participate","do nothing unless she is directly involved"],a:1,e:"Dissociation is required; reporting to authorities isn't mandated by the Standards."},
{q:"Which most likely violates Standard I(C)?",o:["Using unattributed data from a recognized financial data service","Copying a colleague's research conclusions into one's own report without credit","Stating that a government-insured deposit is guaranteed"],a:1,e:"Using another's work without attribution is plagiarism."}]
});

add({n:96,topic:"eth",title:"Guidance for Standard II: Integrity of Capital Markets",
los:["96.a Demonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity.","96.b Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct.","96.c Identify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards."],
s:{
eli5:`<p>Markets are like a game everyone plays with the same cards face up. Two kinds of cheating ruin it:</p>
<ol><li><strong>Peeking at secret cards</strong>: trading (or tipping friends) on important information the public doesn't have yet, like knowing a takeover will be announced tomorrow.</li>
<li><strong>Faking the game</strong>: spreading false rumors to move a price, or trading back and forth with yourself to make a stock look popular.</li></ol>
<p>But clever, honest detective work is fine: if you piece together lots of public facts and small non-important tidbits into a big insight, you may use it. That's the <strong>mosaic theory</strong>.</p>`,
core:`<p><strong>What problem is this solving?</strong> If insiders profit from secret information or prices can be rigged, investors lose confidence, demand higher returns or leave, and capital is misallocated. Standard II protects fair, efficient markets.</p>
<ul><li><strong>II(A) MNPI:</strong> two tests. <em>Material</em>: would it likely affect the price, or would a reasonable investor want it? (Specific, reliable information.) <em>Nonpublic</em>: not yet disseminated to the market. If both → don't act and don't cause others to act.</li>
<li><strong>Mosaic theory:</strong> combining public information and nonmaterial nonpublic information to reach a conclusion is allowed, even if the conclusion would be material if the company announced it.</li>
<li><strong>Firms must contain information:</strong> firewalls (information barriers), restricted/watch lists, preclearance, monitoring of employee trading.</li>
<li><strong>II(B) Market manipulation:</strong> information-based (spreading false or misleading information, pump-and-dump) or transaction-based (trades that create artificial price or volume, e.g., wash trading, marking the close, cornering supply). Intent to mislead is key; legitimate strategies (tax trades, arbitrage, liquidity provision) are fine.</li></ul>`,
formal:`<h4>II(A) Material Nonpublic Information</h4>
<p>Members and candidates who possess material nonpublic information that could affect the value of an investment must not act or cause others to act on the information.</p>
<ul><li><strong>Material:</strong> disclosure would likely affect the price, or a reasonable investor would want to know it before deciding. Reliability and specificity matter (e.g., earnings, M&amp;A, regulatory decisions, management changes, key contracts). Rumors from unreliable sources may not be material.</li>
<li><strong>Nonpublic:</strong> not disseminated to the marketplace in general (e.g., information given to analysts in a closed meeting before public release).</li>
<li><strong>Mosaic theory:</strong> no violation when conclusions are reached from public information plus nonmaterial nonpublic information.</li>
<li>If you obtain MNPI: don't trade or tip; encourage the issuer to make the information public; consult compliance.</li>
<li>Investment banking/research: <strong>firewalls</strong> (separation, restricted communication, compliance review); <strong>watch list</strong> (monitored), <strong>restricted list</strong> (no trading or recommendations); prevent personal trading; record-keeping.</li>
<li>Even if not illegal locally, still a violation of the Standard.</li></ul>
<h4>II(B) Market Manipulation</h4>
<p>Members and candidates must not engage in practices that distort prices or artificially inflate trading volume with the intent to mislead market participants.</p>
<ul><li><strong>Information-based:</strong> spreading false rumors; issuing misleading research to move prices (e.g., pump-and-dump: buy, hype, sell).</li>
<li><strong>Transaction-based:</strong> trades that create a false impression of activity or price (wash trades, matched orders, painting the tape); securing a controlling, dominant position to manipulate prices (cornering, squeezing).</li>
<li>Not manipulation: legitimate trading for tax purposes, arbitrage, liquidity provision, strategies disclosed and not intended to mislead.</li></ul>`,
math:`<div class="f"><span class="lbl">II(A) MNPI test</span>Material AND Nonpublic → DO NOT ACT, DO NOT TIP &nbsp;·&nbsp; otherwise → may act</div>
<div class="f"><span class="lbl">Mosaic theory</span>Public info + nonmaterial nonpublic info → conclusion → OK to act (even if the conclusion is material)</div>
<div class="f"><span class="lbl">II(B) Manipulation test</span>Distorts price or volume + intent to mislead → VIOLATION</div>
<div class="dir"><div>Information more specific and reliable → more likely material</div><div>Information released via press release/filing → public; analysts' private meeting → not public</div></div>`,
example:`<div class="q">Violation or not: (a) At dinner, a CFO tells an analyst that next week's earnings will be far below consensus. The analyst downgrades the stock the next morning. (b) An analyst counts trucks at a factory via satellite images, talks to suppliers about general demand, and reads public filings, concluding sales will beat expectations. She issues a buy. (c) An investment bank employee working on a merger tells his brother, who buys the target. (d) A manager buys a thinly traded stock, posts glowing anonymous online reviews, then sells. (e) A trader buys and sells the same security between two of her own accounts to boost reported volume. (f) A fund sells losing positions in December for tax purposes and buys similar securities.</div>
<ol class="steps"><li><strong>(a)</strong> Violation II(A): specific earnings information from the CFO is material and nonpublic. He should encourage public disclosure and not act.</li>
<li><strong>(b)</strong> No violation: mosaic theory (public + nonmaterial nonpublic information).</li>
<li><strong>(c)</strong> Violation II(A) by the employee (causing others to act); the brother too if he's a member.</li>
<li><strong>(d)</strong> Violation II(B): information-based manipulation (pump-and-dump).</li>
<li><strong>(e)</strong> Violation II(B): transaction-based manipulation (wash trading to inflate volume).</li>
<li><strong>(f)</strong> No violation: legitimate tax-motivated trading, no intent to mislead.</li></ol>
<p class="ans">Answers: violation · OK · violation · violation · violation · OK</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> "It's legal in my country" for MNPI. <b>Fix:</b> still a violation of II(A).</li>
<li><b>Trap:</b> Thinking any nonpublic info is off-limits. <b>Fix:</b> only <em>material</em> nonpublic info; nonmaterial pieces can form a mosaic.</li>
<li><b>Trap:</b> Believing a material conclusion from a mosaic is a violation. <b>Fix:</b> it's allowed.</li>
<li><b>Trap:</b> Assuming all high-volume trading is manipulation. <b>Fix:</b> intent to mislead is required.</li>
<li><b>Trap:</b> Forgetting "cause others to act" (tipping). <b>Fix:</b> passing MNPI to others is a violation even if you don't trade.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> is information material? Is it public? Mosaic theory scenarios; tipping; firewall procedures; identifying manipulation types.</li>
<li><strong>Quick check:</strong> source (company insider, private meeting) + specificity (numbers, deals, dates) → probably MNPI.</li>
<li><strong>Best action with MNPI:</strong> don't trade or tip, ask the issuer to disclose publicly, inform compliance.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Two locks</b>Material AND nonpublic → locked.</div>
<div class="anchor"><b>Detective, not spy</b>Mosaic = detective work with legal clues.</div>
<div class="anchor"><b>Fake news or fake trades</b>Information-based vs transaction-based manipulation.</div>
<div class="anchor"><b>Walls and lists</b>Firewalls, watch lists, restricted lists.</div></div>`,
summary:`Standard II protects market integrity. II(A) Material Nonpublic Information prohibits acting, or causing others to act, on information that is material (likely to affect price, or that a reasonable investor would want) and nonpublic (not disseminated to the market), regardless of local law; members should encourage public disclosure and consult compliance. The mosaic theory permits conclusions drawn from public information combined with nonmaterial nonpublic information. Firms should use firewalls, watch and restricted lists, and monitoring of personal trading. II(B) Market Manipulation prohibits practices that distort prices or artificially inflate volume with intent to mislead, whether information-based (false rumors, pump-and-dump) or transaction-based (wash trades, creating artificial prices, cornering); legitimate strategies such as tax-motivated or arbitrage trading are not manipulation.`
},
quiz:[
{q:"An analyst combines public filings with nonmaterial information from suppliers to conclude a firm will miss earnings and issues a sell recommendation. Under II(A), this is:",o:["a violation, because the conclusion is material","not a violation, under the mosaic theory","a violation, because suppliers are insiders"],a:1,e:"Public + nonmaterial nonpublic information → permitted, even if the conclusion is material."},
{q:"Which is transaction-based market manipulation?",o:["Wash trading to inflate volume","Spreading false rumors about a merger","Issuing a negative research report based on thorough analysis"],a:0,e:"Wash trades create artificial volume. False rumors are information-based; sound research is legitimate."},
{q:"An analyst learns of an unannounced acquisition from the target's CEO. The most appropriate action is to:",o:["buy the target for client accounts before it's public","refrain from trading and encourage public disclosure","tell only her best clients"],a:1,e:"Do not act or tip; encourage the company to disclose publicly."},
{q:"Information given to a select group of analysts in a closed meeting before a press release is:",o:["public, because analysts are market participants","nonpublic until disseminated to the market","immaterial by definition"],a:1,e:"Selective disclosure isn't public dissemination."}]
});

/* ===================== READING 97 ===================== */
add({n:97,topic:"eth",title:"Guidance for Standard III: Duties to Clients",
los:["97.a Demonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity.","97.b Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct.","97.c Identify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards."],
s:{
eli5:`<p>Your clients come first. That means five things:</p>
<ol><li><strong>Loyalty, prudence and care:</strong> treat their money better than your own, and put their interests ahead of yours and your firm's.</li>
<li><strong>Fair dealing:</strong> don't play favorites. When you have a new idea or a hot investment, everyone gets a fair shot.</li>
<li><strong>Suitability:</strong> know each client and only recommend what fits them.</li>
<li><strong>Honest performance:</strong> show results fairly, the good with the bad.</li>
<li><strong>Confidentiality:</strong> keep their secrets, unless the law requires otherwise or they're doing something illegal.</li></ol>`,
core:`<p><strong>What problem is this solving?</strong> Clients delegate decisions about their wealth and can't monitor everything. Standard III defines the fiduciary-style duties that protect them: who comes first, how to treat clients relative to each other, how to match investments to needs, how to communicate results, and how to protect their information.</p>
<ul><li><strong>III(A):</strong> identify the client (for a pension, it's the beneficiaries; for a fund, the fund mandate), act for their benefit, use prudent judgment, put clients ahead of employer and self. Soft-dollar (client brokerage) arrangements must benefit clients ("client brokerage belongs to the client"); seek best execution; vote proxies in clients' interests (cost-benefit).</li>
<li><strong>III(B):</strong> fair, not necessarily equal. Different service levels are allowed if disclosed and available to all who pay; but disseminating recommendations and allocating trades must be fair (e.g., pro rata allocation of block trades and IPOs).</li>
<li><strong>III(C):</strong> know the client (IPS, updated at least annually or on major changes); judge suitability in a portfolio context; for funds, stick to the stated mandate; unsolicited trades: inform the client if unsuitable (and seek written acknowledgement if highly unsuitable).</li>
<li><strong>III(D):</strong> fair, accurate, complete performance: include terminated accounts, disclose simulated results, no cherry-picking; GIPS compliance is encouraged, not required.</li>
<li><strong>III(E):</strong> confidentiality for current, former and prospective clients, except illegal activity, legal requirement, or client permission. Cooperating with the CFA Institute Professional Conduct Program is permitted.</li></ul>`,
formal:`<h4>III(A) Loyalty, Prudence, and Care</h4>
<p>Members and candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. They must act for the benefit of their clients and place their clients' interests before their employer's or their own interests.</p>
<ul><li>Identify the actual client and the duties owed; manage within the client's objectives/IPS.</li>
<li>Soft dollars: use client brokerage only for research that benefits the client; disclose; seek best execution. Directed brokerage: client may direct trades but should be told it may not achieve best execution.</li>
<li>Proxy voting: part of fiduciary duty; vote in clients' best interests (may not need to vote every routine proxy if cost exceeds benefit); disclose proxy policies.</li>
<li>Procedures: written policies on fiduciary duty, proxy voting, soft dollars, best execution, conflicts; diversify unless directed otherwise.</li></ul>
<h4>III(B) Fair Dealing</h4>
<p>Deal fairly and objectively with all clients when providing investment analysis, making recommendations, taking investment action or engaging in other professional activities.</p>
<ul><li>"Fairly", not "equally": premium service levels allowed if disclosed and offered to all paying for them.</li>
<li>Disseminate recommendation changes simultaneously to all clients for whom they're suitable (not first to favored clients).</li>
<li>Trade allocation: pro rata on a fair basis; members shouldn't participate in oversubscribed IPOs if client orders aren't fully filled; family accounts treated like other clients.</li>
<li>Procedures: limit the number of people aware of changes before dissemination; shorten time between decision and dissemination; publish guidelines for pre-dissemination; simultaneous dissemination; maintain lists of clients and holdings; written trade allocation procedures (pro rata, batch orders, time stamps); disclose policies.</li></ul>
<h4>III(C) Suitability</h4>
<p>(1) When in an advisory relationship: make reasonable inquiry into experience, objectives, constraints (risk, return, liquidity, horizon, taxes, legal, unique) before recommendations; update regularly (at least annually); judge suitability in the context of the total portfolio; ensure recommendations are consistent with stated objectives and constraints. (2) When managing a portfolio to a mandate/strategy: make only recommendations or take only actions consistent with the stated objectives and constraints of the portfolio.</p>
<ul><li>Unsolicited trade requests: if unsuitable, inform the client; if it significantly changes the portfolio's risk, discuss updating the IPS or obtain written acknowledgement; firm may refuse.</li>
<li>Procedures: written IPS, annual reviews.</li></ul>
<h4>III(D) Performance Presentation</h4>
<p>When communicating investment performance information, make reasonable efforts to ensure it is fair, accurate and complete.</p>
<ul><li>No misstatements; no presenting a single best account as representative; include terminated accounts; disclose whether gross or net of fees; label simulated/backtested results; disclose changes in composites; brief presentations should offer full details on request.</li>
<li>Compliance with GIPS is recommended (not required by the Standard).</li></ul>
<h4>III(E) Preservation of Confidentiality</h4>
<p>Keep information about current, former and prospective clients confidential unless: (1) the information concerns illegal activities on the part of the client; (2) disclosure is required by law; or (3) the client or prospective client permits disclosure.</p>
<ul><li>Applies to information received because of the professional relationship.</li>
<li>Sharing with CFA Institute's Professional Conduct Program in an investigation is permitted.</li>
<li>Procedures: data security, firm policies.</li></ul>`,
math:`<div class="f"><span class="lbl">Priority ladder (III(A) with VI(B))</span>Clients &gt; Employer &gt; You</div>
<div class="f"><span class="lbl">Fair dealing</span>Fair ≠ Equal: tiers OK if disclosed + available to all; dissemination simultaneous; allocations pro rata</div>
<div class="f"><span class="lbl">Suitability check</span>Know client (IPS, updated ≥ annually) → whole-portfolio fit → stated mandate (for funds)</div>
<div class="f"><span class="lbl">Confidentiality exceptions</span>Illegal activity OR required by law OR client permission (+ CFA PCP investigations)</div>
<div class="dir"><div>Oversubscribed IPO → clients filled first, pro rata; adviser/family wait</div><div>Composite excluding poor/terminated accounts → III(D) violation</div></div>`,
example:`<div class="q">Violation or not: (a) A manager uses client brokerage to pay for her office rent. (b) A firm offers a premium service with faster research delivery to clients who pay more, disclosed to all clients. (c) After changing a rating to "sell", an analyst calls his three largest clients first and emails everyone else the next day. (d) An oversubscribed IPO: the manager allocates shares pro rata among clients, keeping none for herself. (e) A client asks to buy a speculative stock that's inconsistent with his conservative IPS; the adviser executes without comment. (f) A firm's composite omits two accounts that were closed after large losses. (g) A former client's tax details are shared with a prospective employer. (h) An adviser tells authorities about a client's money laundering.</div>
<ol class="steps"><li><strong>(a)</strong> Violation III(A): client brokerage must benefit clients (research), not pay firm overhead.</li>
<li><strong>(b)</strong> No violation III(B): different service levels disclosed and available to all.</li>
<li><strong>(c)</strong> Violation III(B): recommendation changes must be disseminated fairly/simultaneously.</li>
<li><strong>(d)</strong> No violation: fair (pro rata) allocation, clients first.</li>
<li><strong>(e)</strong> Violation III(C): should inform the client it's unsuitable and discuss (possibly obtain written acknowledgement or update IPS).</li>
<li><strong>(f)</strong> Violation III(D): survivorship-style exclusion; include terminated accounts.</li>
<li><strong>(g)</strong> Violation III(E): confidentiality extends to former clients.</li>
<li><strong>(h)</strong> No violation: illegal activity exception.</li></ol>
<p class="ans">Answers: V · OK · V · OK · V · V · V · OK</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Fair dealing means equal treatment. <b>Fix:</b> fair, not equal; tiers allowed if disclosed and available.</li>
<li><b>Trap:</b> For a pension, the client is the sponsor/management. <b>Fix:</b> duties are owed to plan participants and beneficiaries.</li>
<li><b>Trap:</b> GIPS compliance is required by III(D). <b>Fix:</b> recommended, not required.</li>
<li><b>Trap:</b> Confidentiality ends when the client leaves. <b>Fix:</b> applies to former clients too.</li>
<li><b>Trap:</b> Must vote every proxy. <b>Fix:</b> vote in clients' interest; cost-benefit can justify not voting routine proxies.</li>
<li><b>Trap:</b> Suitability judged security by security. <b>Fix:</b> in the context of the client's total portfolio.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> soft dollars; who is the client; dissemination and trade allocation; IPO allocation; unsolicited trades; mandate drift in a fund; performance composites; confidentiality exceptions.</li>
<li><strong>Heuristic:</strong> if a choice favors some clients, the firm, or the adviser over other clients without disclosure and fairness, it's a III(A)/(B) violation.</li>
<li><strong>Mandate pattern:</strong> a "small-cap value" fund buying large-cap growth → III(C) violation.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>L-F-S-P-P</b>Loyalty, Fair dealing, Suitability, Performance, Privacy.</div>
<div class="anchor"><b>Client's brokerage, client's benefit</b>Soft dollars only for client research.</div>
<div class="anchor"><b>Fair, not equal</b>Tiers OK; favoritism not.</div>
<div class="anchor"><b>Show the whole report card</b>Include the failures.</div>
<div class="anchor"><b>"Illegal, Law, Leave"</b>Confidentiality exceptions: illegal activity, law requires, client gives leave.</div></div>`,
summary:`Standard III sets duties to clients. III(A) Loyalty, Prudence, and Care: act for clients' benefit with reasonable care and prudent judgment, putting clients before employer and self; identify the true client (e.g., pension beneficiaries); use client brokerage (soft dollars) only for clients' benefit; seek best execution; vote proxies in clients' interest. III(B) Fair Dealing: treat clients fairly (not necessarily equally) when disseminating recommendations and taking action; disclosed, available service tiers are acceptable; disseminate changes simultaneously and allocate trades and IPOs pro rata, clients before members. III(C) Suitability: know the client through an IPS updated at least annually, judge suitability for the whole portfolio, follow a fund's stated mandate, and address unsuitable unsolicited trades with the client. III(D) Performance Presentation: fair, accurate and complete (include terminated accounts, disclose simulations; GIPS recommended). III(E) Preservation of Confidentiality: protect information of current, former and prospective clients unless it concerns illegal activity, disclosure is legally required, or the client permits it.`
},
quiz:[
{q:"A portfolio manager uses client brokerage commissions to buy research that benefits all clients. This is:",o:["a violation of III(A)","acceptable, because the research benefits clients","a violation of III(B)"],a:1,e:"Soft dollars are permitted when used for research benefiting clients and with best execution."},
{q:"Under Standard III(B), when an analyst changes a recommendation she should:",o:["inform the largest clients first","disseminate the change to all clients for whom it is suitable simultaneously","wait until clients ask"],a:1,e:"Fair dealing requires simultaneous dissemination to affected clients."},
{q:"A small-cap value fund buys several large-cap growth stocks because they look attractive. This most likely violates:",o:["III(C) Suitability","III(D) Performance Presentation","I(C) Misrepresentation"],a:0,e:"Managing to a mandate requires actions consistent with the fund's stated strategy."},
{q:"Which disclosure of client information is permitted under III(E)?",o:["To a prospective employer to show experience","To authorities about a client's illegal activities","To another client who asks for references"],a:1,e:"Illegal activities, legal requirement or client consent are the exceptions."},
{q:"Standard III(D) requires that:",o:["all firms comply with GIPS","performance be presented fairly, accurately and completely","only gross-of-fee returns be shown"],a:1,e:"GIPS is recommended, not required; disclose gross/net basis."}]
});

/* ===================== READING 98 ===================== */
add({n:98,topic:"eth",title:"Guidance for Standard IV: Duties to Employers",
los:["98.a Demonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity.","98.b Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct.","98.c Identify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards."],
s:{
eli5:`<p>Your employer pays you and trusts you. So:</p>
<ol><li><strong>Loyalty:</strong> don't steal clients, files or secrets, and don't secretly compete with your boss. You're allowed to <em>prepare</em> to leave (look for jobs, plan your own firm), but not to grab clients or records on your way out.</li>
<li><strong>Extra pay:</strong> if someone else (like a client) offers you money or perks connected to your work, tell your employer in writing and get their OK first.</li>
<li><strong>If you supervise people:</strong> make real efforts to stop them breaking rules, with good procedures and follow-through. If the procedures are bad and you can't fix them, don't accept the supervisor job until they're fixed.</li></ol>`,
core:`<p><strong>What problem is this solving?</strong> Employers invest in staff, client relationships and confidential information; employees could exploit those for personal gain. Standard IV balances loyalty to the employer with employees' freedom to change jobs, and makes supervisors accountable for preventing violations.</p>
<ul><li><strong>IV(A):</strong> act for the employer's benefit; don't deprive it of skills or cause harm. Before leaving: may make arrangements (seek a job, set up a firm) as long as they don't breach duties (no soliciting clients before leaving, no taking records or client lists, no misappropriating trade secrets). After leaving: may contact former clients using public sources or memory (unless a non-compete/non-solicit agreement applies), but not firm records. Independent practice for compensation requires employer notification and consent. Whistleblowing to protect clients/markets is not a violation. Employer duty doesn't override the Code: clients and laws still come first.</li>
<li><strong>IV(B):</strong> any gifts, benefits, compensation or consideration that compete with or could create a conflict with the employer's interests require <strong>written consent from all parties involved</strong> (in practice, the employer) before accepting.</li>
<li><strong>IV(C):</strong> supervisors must make reasonable efforts to ensure those they supervise comply with laws and the Code: adequate compliance procedures, education, enforcement, prompt investigation when violations arise. Can delegate tasks, not responsibility. If the firm's compliance system is inadequate, decline supervisory responsibility in writing until it's fixed.</li></ul>`,
formal:`<h4>IV(A) Loyalty</h4>
<p>In matters related to their employment, members and candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer.</p>
<ul><li><strong>Employer responsibilities:</strong> the Standard doesn't require placing employer interests above clients or ethics; members aren't required to follow orders that would violate laws or the Code.</li>
<li><strong>Independent practice:</strong> undertaking independent practice for compensation in competition with employer requires notification and consent (describe the service, compensation, duration).</li>
<li><strong>Leaving an employer:</strong> preparations are permitted (job search, forming a business, registering, leasing space) provided they don't breach the duty of loyalty. Before departure: no soliciting the employer's clients, no taking client lists, files, records or proprietary information, no self-dealing. After departure: may use experience and knowledge; may contact former clients using public information (unless restricted by agreement).</li>
<li><strong>Whistleblowing:</strong> may act contrary to employer's interests to protect clients or market integrity (not for personal gain).</li>
<li><strong>Nature of employment:</strong> applies to employees and also to independent contractors in the relationship.</li>
<li><strong>Social media:</strong> professional connections may belong to the employer under firm policy; follow it when departing.</li>
<li>Procedures: competition/termination policies, incident-reporting, employee classification.</li></ul>
<h4>IV(B) Additional Compensation Arrangements</h4>
<p>Members and candidates must not accept gifts, benefits, compensation or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer's interests unless they obtain written consent from all parties involved.</p>
<ul><li>Typical case: a client offers a bonus tied to performance → disclose terms (nature, amount, duration) to employer in writing and obtain consent before accepting.</li>
<li>Board directorships or outside consulting for compensation → disclose and obtain permission.</li>
<li>Procedures: written reports of any additional compensation, including the nature, amount and duration.</li></ul>
<h4>IV(C) Responsibilities of Supervisors</h4>
<p>Members and candidates must make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable laws, rules, regulations and the Code and Standards.</p>
<ul><li>Applies to anyone supervised (whether or not CFA members).</li>
<li>Must have adequate compliance procedures and ensure they're followed; can delegate supervisory duties but retain responsibility.</li>
<li>On learning of a violation: respond promptly, investigate, take steps to stop it (e.g., limit activity, increase monitoring); reliance on an employee's assurance that it won't happen again is insufficient.</li>
<li>If compliance procedures are inadequate: recommend improvements; if not adopted, decline supervisory responsibility in writing until adequate procedures exist.</li>
<li>Procedures: written code of ethics and compliance procedures, education and training, incentives for ethical behavior, enforcement and sanctions.</li></ul>`,
math:`<div class="f"><span class="lbl">Leaving a firm</span>Before leaving: PREPARE ✔ / SOLICIT clients ✘ / TAKE records ✘ &nbsp;·&nbsp; After leaving: contact former clients from memory/public sources ✔ (unless non-solicit)</div>
<div class="f"><span class="lbl">IV(B) test</span>Outside compensation + possible conflict with employer → WRITTEN consent from employer (all parties) BEFORE accepting</div>
<div class="f"><span class="lbl">IV(C) test</span>Supervisor = reasonable efforts + adequate procedures + prompt response; inadequate system → decline in writing</div>
<div class="dir"><div>Duty to employer ≤ duty to clients and law (never overrides the Code)</div><div>Delegate tasks, not responsibility</div></div>`,
example:`<div class="q">Violation or not: (a) Before resigning, Chen tells three key clients he's leaving and asks them to follow him. (b) Chen downloads his client contact list to a USB drive on his last day. (c) After leaving (no non-solicit), Chen contacts former clients using phone numbers from public directories. (d) A client offers Maria a bonus if her portfolio beats the index; she accepts and tells her employer verbally a month later. (e) A supervisor learns a trader front-ran client orders; the trader promises it won't happen again and the supervisor takes no further action. (f) A newly promoted supervisor finds the firm has no compliance procedures; she declines the supervisory role in writing until procedures are adopted.</div>
<ol class="steps"><li><strong>(a)</strong> Violation IV(A): soliciting clients before departure.</li>
<li><strong>(b)</strong> Violation IV(A) (and possibly V(C)/III(E)): records belong to the employer.</li>
<li><strong>(c)</strong> No violation: public information, after departure, no restrictive agreement.</li>
<li><strong>(d)</strong> Violation IV(B): needs written consent <em>before</em> accepting.</li>
<li><strong>(e)</strong> Violation IV(C): reasonable efforts require more than reliance on assurances (investigate, restrict, monitor).</li>
<li><strong>(f)</strong> No violation: the correct response to inadequate procedures.</li></ol>
<p class="ans">Answers: V · V · OK · V · V · OK</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Thinking any preparation to leave is disloyal. <b>Fix:</b> preparation is allowed; soliciting and taking records are not.</li>
<li><b>Trap:</b> Verbal or after-the-fact disclosure satisfies IV(B). <b>Fix:</b> written consent before acceptance.</li>
<li><b>Trap:</b> Supervisors only responsible for CFA members. <b>Fix:</b> all subordinates.</li>
<li><b>Trap:</b> Loyalty means obeying all employer instructions. <b>Fix:</b> never violate law, the Code, or client duties for the employer.</li>
<li><b>Trap:</b> Whistleblowing violates IV(A). <b>Fix:</b> permitted to protect clients or market integrity.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> departure scenarios (what's OK before/after leaving); independent practice; outside bonuses and directorships; supervisor's response to a violation; inadequate compliance systems.</li>
<li><strong>Keyword map:</strong> "verbal/later disclosure" → IV(B) violation; "relied on promise" → IV(C) violation; "took files/lists" → IV(A) violation.</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Pack your bags, not the files</b>Prepare to leave; don't take records or poach before you go.</div>
<div class="anchor"><b>"Write before you take"</b>IV(B): written consent first.</div>
<div class="anchor"><b>Delegate tasks, not blame</b>IV(C): supervisor stays responsible.</div>
<div class="anchor"><b>No system, no supervising</b>Decline in writing until compliance is adequate.</div></div>`,
summary:`Standard IV sets duties to employers. IV(A) Loyalty: act for the employer's benefit, don't deprive it of your skills, divulge confidential information or harm it; independent competing practice requires notification and consent. Preparing to leave (seeking employment, forming a firm) is permitted, but soliciting clients or taking records, client lists or proprietary information before departure is not; after leaving, former clients may be contacted using public information or memory unless an agreement prohibits it. Whistleblowing to protect clients or markets is not disloyal, and loyalty never requires violating laws, the Code or client duties. IV(B) Additional Compensation Arrangements: do not accept gifts, benefits or compensation that compete with or could conflict with the employer's interests without written consent from all parties involved, obtained in advance. IV(C) Responsibilities of Supervisors: make reasonable efforts (adequate procedures, training, enforcement, prompt investigation) to ensure everyone supervised complies; supervisors can delegate tasks but not responsibility, and should decline supervisory responsibility in writing if compliance procedures are inadequate.`
},
quiz:[
{q:"While still employed, a portfolio manager plans to start his own firm. Which action violates Standard IV(A)?",o:["Leasing office space for the new firm","Contacting his employer's clients to invite them to move with him","Registering the new firm with regulators"],a:1,e:"Soliciting the employer's clients before leaving breaches loyalty; preparations are allowed."},
{q:"A client offers an analyst a cash bonus for outperforming. Under IV(B), the analyst must:",o:["refuse the bonus","obtain written consent from her employer before accepting","disclose it to the client only"],a:1,e:"Written consent from all parties involved (the employer) before acceptance."},
{q:"A supervisor discovers a subordinate violated firm policy. The most appropriate response is to:",o:["accept the employee's promise not to repeat it","investigate promptly and take steps (e.g., restrict activities, increase monitoring)","report the matter only at year-end review"],a:1,e:"Reasonable efforts require prompt investigation and corrective action."},
{q:"If a firm's compliance procedures are inadequate, a member asked to supervise should:",o:["accept and do her best","decline supervisory responsibility in writing until adequate procedures are adopted","resign immediately"],a:1,e:"That's the specific guidance under IV(C)."}]
});

add({n:99,topic:"eth",title:"Guidance for Standard V: Investment Analysis, Recommendations, and Actions",
los:["99.a Demonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity.","99.b Recommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct.","99.c Identify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards."],
s:{
eli5:`<p>Before you tell someone "buy this", three things:</p>
<ol><li><strong>Do your homework</strong> (diligence) and have a sensible reason (reasonable basis). If you use someone else's research, make sure it's sound.</li>
<li><strong>Explain clearly:</strong> tell clients how you make decisions and what the risks are, tell them promptly if your process changes, and separate facts from your opinions.</li>
<li><strong>Keep your notes</strong> that show why you recommended it. If someone asks later, you can prove you did your homework.</li></ol>`,
core:`<p><strong>What problem is this solving?</strong> Clients rely on recommendations they can't verify. Standard V ensures recommendations rest on thorough, independent analysis, are communicated transparently (including risks and process changes), and can be reconstructed from records.</p>
<ul><li><strong>V(A):</strong> diligence and thoroughness appropriate to the situation; reasonable and adequate basis supported by research. Applies to third-party research (check assumptions, rigor, independence), quantitative models (understand them, stress-test, consider extreme scenarios), external managers/sub-advisers (due diligence) and group research (a member may sign a group consensus report she disagrees with if the process was sound; she may document her dissent).</li>
<li><strong>V(B):</strong> disclose the basic format and general principles of the investment process and promptly disclose changes; use reasonable judgment in identifying important factors; distinguish fact from opinion; disclose significant limitations and risks (including model limitations).</li>
<li><strong>V(C):</strong> develop and maintain appropriate records to support analysis, recommendations, actions and communications. Records belong to the employer. If no regulatory requirement, CFA Institute recommends <strong>at least 7 years</strong>.</li></ul>`,
formal:`<h4>V(A) Diligence and Reasonable Basis</h4>
<p>Members and candidates must: (1) exercise diligence, independence and thoroughness in analyzing investments, making recommendations and taking actions; (2) have a reasonable and adequate basis, supported by appropriate research and investigation, for any recommendation or action.</p>
<ul><li>Level of diligence depends on the investment's complexity and the role.</li>
<li><strong>Third-party research:</strong> verify reasonableness (assumptions, rigor, timeliness, objectivity/independence).</li>
<li><strong>Quantitative/model-based research:</strong> understand assumptions, test across scenarios including extreme ones; don't use models you don't understand.</li>
<li><strong>Selecting external advisers/sub-advisers:</strong> due diligence on their process, compliance, performance measurement.</li>
<li><strong>Group research:</strong> may put name on a consensus report even if disagreeing, if the process was adequate and objective; may document dissent; ask to have name removed if strongly opposed.</li>
<li>Procedures: policies on review of third-party research, criteria for research quality, model testing, adviser selection.</li></ul>
<h4>V(B) Communication with Clients and Prospective Clients</h4>
<p>Members and candidates must: (1) disclose to clients and prospective clients the basic format and general principles of the investment processes they use to analyze investments, select securities and construct portfolios, and promptly disclose any changes that might materially affect those processes; (2) disclose significant limitations and risks associated with the investment process; (3) use reasonable judgment in identifying which factors are important to their investment analyses, recommendations or actions, and include those factors in communications; (4) distinguish between fact and opinion in the presentation of investment analysis and recommendations.</p>
<ul><li>Applies to all forms of communication (including social media); brief communications should have more complete information available.</li>
<li>Reports by others (e.g., economists): attribute appropriately.</li></ul>
<h4>V(C) Record Retention</h4>
<p>Develop and maintain appropriate records to support investment analyses, recommendations, actions and other investment-related communications with clients and prospective clients.</p>
<ul><li>Records include notes, spreadsheets, models, emails, reports. Electronic or paper.</li>
<li>Records are the <strong>firm's property</strong>; do not take them when leaving (recreate analysis from public sources at a new firm).</li>
<li>Retention period: follow local regulation; absent that, at least <strong>7 years</strong>.</li></ul>`,
math:`<div class="f"><span class="lbl">V(A)</span>Recommendation = diligence + independence + thoroughness + reasonable &amp; adequate basis</div>
<div class="f"><span class="lbl">V(B) disclosures</span>Process (and changes, promptly) + risks/limitations + key factors + FACT ≠ OPINION</div>
<div class="f"><span class="lbl">V(C)</span>Keep support records ≥ 7 years if no regulation; records = firm property</div>
<div class="dir"><div>Complex investment / model-based → more diligence required</div><div>Material change in process (e.g., new model, new team) → disclose promptly</div></div>`,
example:`<div class="q">Violation or not: (a) An analyst writes "the stock will rise 30% next year" in a report without qualifying it as an estimate. (b) A manager uses a quantitative model built by a colleague without understanding its assumptions; it fails in a market shock. (c) A team publishes a consensus buy; one member disagrees but the process was thorough; she signs and documents her dissent. (d) A firm switches from fundamental to purely quantitative stock selection and tells clients in its next annual letter, a year later. (e) A firm keeps research records for 3 years; local law has no requirement. (f) A portfolio manager relies on a broker's research report after checking its assumptions and the broker's track record.</div>
<ol class="steps"><li><strong>(a)</strong> Violation V(B): must distinguish opinion/forecast from fact.</li>
<li><strong>(b)</strong> Violation V(A): must understand models and test assumptions, including extreme scenarios.</li>
<li><strong>(c)</strong> No violation V(A): sound group process; documenting dissent is appropriate.</li>
<li><strong>(d)</strong> Violation V(B): material changes must be disclosed promptly.</li>
<li><strong>(e)</strong> Violation V(C) guidance: CFA Institute recommends at least 7 years absent regulation.</li>
<li><strong>(f)</strong> No violation: reasonable reliance on third-party research after due diligence.</li></ol>
<p class="ans">Answers: V · V · OK · V · V · OK</p>`,
traps:`<ul class="traps"><li><b>Trap:</b> Must refuse to sign a group report you disagree with. <b>Fix:</b> you may sign if the process was sound; document dissent.</li>
<li><b>Trap:</b> Records belong to the analyst. <b>Fix:</b> they're the employer's property.</li>
<li><b>Trap:</b> Disclose every detail of the process. <b>Fix:</b> basic format and general principles, plus material changes and risks.</li>
<li><b>Trap:</b> Third-party research can be used blindly. <b>Fix:</b> must have a reasonable basis to rely on it.</li>
<li><b>Trap:</b> 7-year rule overrides local law. <b>Fix:</b> local regulation first; 7 years only if none.</li></ul>`,
exam:`<ul><li><strong>Typical questions:</strong> reliance on third-party research; group research dissent; model understanding; process change disclosure; fact vs opinion; record retention period and ownership.</li>
<li><strong>Keyword map:</strong> "will" vs "we expect" → V(B); "didn't understand the model" → V(A); "took notes to new job" → V(C)/IV(A).</li></ul>`,
anchors:`<div class="anchors"><div class="anchor"><b>Homework · Honesty · History</b>V(A), V(B), V(C).</div>
<div class="anchor"><b>"Fact or forecast?"</b>Label opinions as opinions.</div>
<div class="anchor"><b>Seven-year itch</b>Keep records ≥ 7 years if no rule says otherwise.</div>
<div class="anchor"><b>Sign with a sound process</b>Group research: dissent can be documented.</div></div>`,
summary:`Standard V governs investment analysis, recommendations and actions. V(A) Diligence and Reasonable Basis requires diligence, independence and thoroughness and a reasonable, adequate basis supported by research for every recommendation; members must assess the soundness of third-party research, understand and stress-test quantitative models, perform due diligence on external managers, and may sign group research they disagree with if the process was sound (documenting dissent). V(B) Communication with Clients and Prospective Clients requires disclosing the basic format and general principles of the investment process and promptly disclosing material changes, disclosing significant risks and limitations, including the important factors, and distinguishing fact from opinion. V(C) Record Retention requires maintaining records that support analyses, recommendations and communications; records belong to the firm, and absent regulatory requirements CFA Institute recommends retaining them for at least seven years.`
},
quiz:[
{q:"An analyst disagrees with her research team's consensus recommendation, which was reached through a thorough process. Under V(A) she:",o:["must refuse to have her name on the report","may have her name on the report and should consider documenting her dissent","must report the team to compliance"],a:1,e:"A sound process allows her to sign; documenting dissent is recommended."},
{q:"In the absence of regulatory guidance, CFA Institute recommends maintaining records for at least:",o:["3 years","5 years","7 years"],a:2,e:"Seven years."},
{q:"A firm changes its investment process significantly. Under V(B) it should:",o:["disclose the change at the next annual review","promptly disclose the change to clients","disclose only if clients ask"],a:1,e:"Material changes to the investment process must be disclosed promptly."},
{q:"A research report states, 'Earnings will grow 20% next year.' This most likely violates:",o:["V(B), for failing to distinguish opinion from fact","V(C)","I(D)"],a:0,e:"A forecast must be presented as opinion, not fact."}]
});
